<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金额大小写转换工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 主题颜色 - 现代渐变系统 */
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-secondary: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #6366f1 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            
            /* 基础颜色 */
            --color-primary: #6366f1;
            --color-primary-light: #a5b4fc;
            --color-primary-dark: #4f46e5;
            --color-secondary: #f0f4ff;
            --color-success: #10b981;
            --color-text: #1f2937;
            --color-text-light: #4b5563;
            --color-text-lighter: #9ca3af;
            --color-bg: #ffffff;
            --color-bg-light: #f9fafb;
            --color-bg-dark: #f3f4f6;
            --color-border: #e5e7eb;
            
            /* 尺寸和效果 */
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 24px;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            
            /* 动效 */
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #111827;
                --color-bg-light: #1f2937;
                --color-bg-dark: #0f172a;
                --color-text: #f9fafb;
                --color-text-light: #e5e7eb;
                --color-text-lighter: #9ca3af;
                --color-border: #374151;
                --color-secondary: #1e293b;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0) 50%),
                radial-gradient(circle at 0% 100%, rgba(236, 72, 153, 0.08) 0%, rgba(236, 72, 153, 0) 50%);
            background-attachment: fixed;
            padding: 16px;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title-accent {
            position: relative;
            display: inline-block;
        }
        
        .title-accent::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 8px;
            bottom: 4px;
            left: 0;
            background-color: var(--color-primary-light);
            opacity: 0.3;
            z-index: -1;
            border-radius: 4px;
        }
        
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--color-text);
            margin-bottom: 12px;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--color-text-light);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .card {
            background-color: var(--color-bg);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: var(--transition-normal);
            border: 1px solid var(--color-border);
            height: 100%;
        }
        
        .card:hover {
            box-shadow: var(--shadow-lg);
        }
        
        .input-section {
            padding: 20px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        
        .section-icon i {
            color: white;
            font-size: 16px;
        }
        
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text);
        }
        
        /* 新增的转换方向切换按钮样式 */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .conversion-toggle {
            margin-left: 10px;
        }
        
        .toggle-btn {
            background-color: var(--color-bg-light);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-sm);
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .toggle-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        .toggle-btn:hover {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }
        
        .toggle-btn:active::after {
            animation: ripple 0.6s ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }
        
        .toggle-btn i {
            font-size: 0.8rem;
            margin-right: 2px;
        }
        
        .input-wrapper {
            position: relative;
            margin-top: 12px;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-lighter);
            transition: var(--transition-fast);
        }
        
        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 2px solid var(--color-border);
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            transition: var(--transition-fast);
            background-color: var(--color-bg-light);
            color: var(--color-text);
            height: 50px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--color-primary);
            background-color: var(--color-bg);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        input:focus + i {
            color: var(--color-primary);
        }
        
        .amount-example {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--color-text-lighter);
            padding-left: 12px;
        }
        
        .result-section {
            position: relative;
            overflow: hidden;
        }
        
        .result-header {
            padding: 20px 20px 0;
        }
        
        .result-content {
            padding: 8px 20px 20px;
        }
        
        .result-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 160px;
            height: 160px;
            background: var(--gradient-secondary);
            opacity: 0.05;
            border-radius: 100%;
            transform: translate(50%, -50%);
            z-index: 0;
        }
        
        .result-value {
            position: relative;
            font-size: 1.3rem;
            line-height: 1.5;
            color: var(--color-text);
            font-weight: 600;
            word-break: break-all;
            padding: 16px;
            background-color: var(--color-bg-light);
            border-radius: var(--border-radius-md);
            border-left: 4px solid var(--color-primary);
            margin-top: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        
        .btn {
            border: none;
            border-radius: var(--border-radius-md);
            padding: 0 20px;
            height: 46px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }
        
        .btn-primary:hover {
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background-color: var(--color-bg-light);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }
        
        .btn-secondary:hover {
            background-color: var(--color-bg);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .info-card {
            grid-column: span 2;
            background-color: var(--color-bg);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            margin-top: 20px;
        }
        
        .info-header {
            padding: 16px 20px;
            background-color: var(--color-secondary);
            border-bottom: 1px solid var(--color-border);
            position: relative;
            overflow: hidden;
        }
        
        .info-pattern {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-image: 
                linear-gradient(135deg, var(--color-primary) 25%, transparent 25%),
                linear-gradient(225deg, var(--color-primary) 25%, transparent 25%),
                linear-gradient(45deg, var(--color-primary) 25%, transparent 25%),
                linear-gradient(315deg, var(--color-primary) 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            opacity: 0.05;
        }
        
        .info-title {
            position: relative;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text);
            display: flex;
            align-items: center;
        }
        
        .info-title i {
            margin-right: 8px;
            color: var(--color-primary);
        }
        
        .info-content {
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
        }
        
        .rules-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .rules-list li {
            position: relative;
            padding-left: 20px;
            color: var(--color-text-light);
            font-size: 0.9rem;
            flex: 1 1 200px;
        }
        
        .rules-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .rules-list li:nth-child(1)::before { background-color: #6366f1; }
        .rules-list li:nth-child(2)::before { background-color: #8b5cf6; }
        .rules-list li:nth-child(3)::before { background-color: #ec4899; }
        .rules-list li:nth-child(4)::before { background-color: #10b981; }
        .rules-list li:nth-child(5)::before { background-color: #3b82f6; }
        
        .rule-highlight {
            color: var(--color-text);
            font-weight: 500;
        }
        
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background-color: var(--color-text);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000;
        }
        
        .notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        
        .notification i {
            margin-right: 8px;
            color: var(--color-success);
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--color-text-lighter);
        }
        
        .footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .pulse {
            animation: pulse 0.6s cubic-bezier(0.4, 0, 0.6, 1) 1;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .info-card {
                grid-column: span 1;
            }
            
            .rules-list {
                display: block;
            }
            
            .rules-list li {
                margin-bottom: 12px;
            }
            
            .info-content {
                padding: 16px;
            }

            .section-title {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .conversion-toggle {
                margin-left: 0;
                margin-top: 8px;
            }
        }
        
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .input-section, .result-header, .result-content, .info-header, .info-content {
                padding: 16px;
            }
            
            .section-icon {
                width: 32px;
                height: 32px;
            }
            
            .result-value {
                font-size: 1.2rem;
                padding: 12px;
            }
        }

        /* 增强移动端适配 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                max-width: 100%;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 0.85rem;
                padding: 0 10px;
            }
            
            .input-section, .result-header, .result-content {
                padding: 14px;
            }
            
            input {
                height: 46px;
                font-size: 0.95rem;
            }
            
            .btn {
                height: 42px;
                font-size: 0.9rem;
                padding: 0 12px;
            }
            
            .section-title {
                font-size: 0.95rem;
            }
            
            .section-icon {
                width: 30px;
                height: 30px;
            }
            
            .section-icon i {
                font-size: 14px;
            }
            
            .result-value {
                font-size: 1.1rem;
                padding: 10px;
                min-height: 70px;
            }
            
            .amount-example {
                font-size: 0.8rem;
            }
            
            .rules-list li {
                font-size: 0.85rem;
                padding-left: 16px;
                margin-bottom: 10px;
                flex: 1 1 100%;
            }
            
            .notification {
                padding: 8px 16px;
                font-size: 0.9rem;
                bottom: 20px;
            }
        }
        
        /* 超小屏幕设备适配 */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.4rem;
            }
            
            .buttons-container {
                grid-template-columns: 1fr;
            }
            
            .input-section, .result-header, .result-content {
                padding: 12px;
            }
            
            .result-value {
                font-size: 1rem;
            }
            
            .rules-list li {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>金额大小写<span class="title-accent">双向转换工具</span></h1>
            <p class="subtitle">快速在数字金额与中文大写格式之间互相转换，符合银行票据书写规范</p>
        </div>
        
        <div class="main-content">
            <div class="card">
                <div class="input-section">
                    <div class="section-header">
                        <div class="section-icon">
                            <i class="fas fa-keyboard"></i>
                        </div>
                        <div class="section-title">
                            <span id="input-title">输入金额（阿拉伯数字）</span>
                            <div class="conversion-toggle" id="conversion-toggle">
                                <button id="toggle-btn" class="toggle-btn" title="切换转换方向">
                                    <i class="fas fa-exchange-alt"></i> 切换方向
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="input-wrapper">
                        <input type="text" id="amount" placeholder="请输入数字金额，例如：135.9">
                        <i id="input-icon" class="fas fa-yen-sign"></i>
                    </div>
                    <div class="amount-example" id="amount-example">示例: 1234.56、3000、50089.79</div>
                    
                    <div class="buttons-container">
                        <button id="convert-btn" class="btn btn-primary"><i class="fas fa-exchange-alt"></i> 立即转换</button>
                        <button id="copy-btn" class="btn btn-secondary"><i class="fas fa-copy"></i> 复制结果</button>
                    </div>
                </div>
            </div>
            
            <div class="card result-section">
                <div class="result-bg"></div>
                <div class="result-header">
                    <div class="section-header">
                        <div class="section-icon">
                            <i class="fas fa-file-invoice"></i>
                        </div>
                        <div class="section-title">转换结果</div>
                    </div>
                </div>
                
                <div class="result-content">
                    <div class="result-value" id="result-value">壹万贰仟叁佰肆拾伍元陆角柒分</div>
                </div>
            </div>
            
            <div class="info-card">
                <div class="info-header">
                    <div class="info-pattern"></div>
                    <div class="info-title">
                        <i class="fas fa-info-circle"></i> 转换规则说明
                    </div>
                </div>
                
                <div class="info-content">
                    <ul class="rules-list" id="rules-list">
                        <li>支持整数部分最高到<span class="rule-highlight">"亿"</span>位，小数部分精确到<span class="rule-highlight">"分"</span></li>
                        <li>金额为0时显示<span class="rule-highlight">"零元整"</span></li>
                        <li>小数部分为0时显示<span class="rule-highlight">"整"</span></li>
                        <li>转换结果符合<span class="rule-highlight">银行票据书写规范</span></li>
                        <li>支持<span class="rule-highlight">双向转换</span>，点击"切换方向"按钮更改转换模式</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="footer">
            © 2025 金额转换工具 | <a href="https://t.zsxq.com/MlnIL" target="_blank">技术支持</a>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i> 已复制到剪贴板
    </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const amountInput = document.getElementById('amount');
            const convertBtn = document.getElementById('convert-btn');
            const resultValue = document.getElementById('result-value');
            const copyBtn = document.getElementById('copy-btn');
            const notification = document.getElementById('notification');
            const inputTitle = document.getElementById('input-title');
            const inputIcon = document.getElementById('input-icon');
            const amountExample = document.getElementById('amount-example');
            const conversionToggle = document.getElementById('conversion-toggle');
            const toggleBtn = document.getElementById('toggle-btn');
            const rulesList = document.getElementById('rules-list');
            
            // 数字对应的大写
            const digits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            // 整数部分单位
            const intUnits = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿', '拾', '佰', '仟', '万', '拾', '佰', '仟'];
            // 小数部分单位
            const decUnits = ['角', '分'];
            
            // 当前转换方向：true 表示阿拉伯数字 -> 中文大写，false 表示中文大写 -> 阿拉伯数字
            let isArabicToChinese = true;

            // 中文数字转阿拉伯数字函数
            function convertToArabic(chineseAmount) {
                // 处理特殊情况
                if (chineseAmount === '零元整') {
                    return '0';
                }
                
                // 将中文金额拆分为整数和小数部分
                let intPart = '';
                let decPart = '';
                
                // 提取整数部分和小数部分
                const yuanIndex = chineseAmount.indexOf('元');
                if (yuanIndex > -1) {
                    intPart = chineseAmount.substring(0, yuanIndex);
                    decPart = chineseAmount.substring(yuanIndex + 1);
                    
                    // 如果小数部分是"整"，则清空小数部分
                    if (decPart === '整') {
                        decPart = '';
                    }
                } else {
                    intPart = chineseAmount;
                }
                
                // 定义数字和单位映射
                const digitMap = {'零': 0, '壹': 1, '贰': 2, '叁': 3, '肆': 4, '伍': 5, '陆': 6, '柒': 7, '捌': 8, '玖': 9};
                
                // 处理复杂的整数部分，先按"亿"和"万"分段
                const parts = [];
                let start = 0;
                
                // 分段处理
                const indexes = [];
                
                // 找出"亿"和"万"的位置
                for (let i = 0; i < intPart.length; i++) {
                    if (intPart[i] === '亿') {
                        indexes.push({index: i, unit: '亿'});
                    } else if (intPart[i] === '万') {
                        indexes.push({index: i, unit: '万'});
                    }
                }
                
                // 根据位置分段处理
                if (indexes.length === 0) {
                    // 没有亿和万，直接处理
                    parts.push(intPart);
                } else {
                    // 按找到的单位分段
                    for (let i = 0; i < indexes.length; i++) {
                        const idx = indexes[i].index;
                        if (i === 0) {
                            // 第一段，从开始到第一个单位
                            parts.push(intPart.substring(0, idx + 1));
                            start = idx + 1;
                        } else {
                            // 中间段，从上一个单位之后到当前单位
                            parts.push(intPart.substring(start, idx + 1));
                            start = idx + 1;
                        }
                    }
                    // 最后一段，从最后一个单位之后到结束
                    if (start < intPart.length) {
                        parts.push(intPart.substring(start));
                    }
                }
                
                // 处理每一段，计算最终结果
                let result = 0;
                
                // 分别处理每段（亿、万、个）
                for (const part of parts) {
                    // 如果包含"亿"
                    if (part.includes('亿')) {
                        // 去掉"亿"字，计算前面的数值
                        const num = calculateSimpleChineseNumber(part.replace('亿', ''));
                        result += num * 100000000; // 亿
                    } 
                    // 如果包含"万"
                    else if (part.includes('万')) {
                        // 去掉"万"字，计算前面的数值
                        const num = calculateSimpleChineseNumber(part.replace('万', ''));
                        result += num * 10000; // 万
                    } 
                    // 最后一段，直接计算
                    else {
                        result += calculateSimpleChineseNumber(part);
                    }
                }
                
                // 辅助函数：计算不包含"亿"和"万"的简单中文数字
                function calculateSimpleChineseNumber(str) {
                    if (!str) return 0;
                    
                    let num = 0;
                    let temp = 0;
                    
                    for (let i = 0; i < str.length; i++) {
                        const char = str[i];
                        
                        if (digitMap[char] !== undefined) {
                            temp = digitMap[char];
                        } else if (char === '拾') {
                            // 如果是"拾"前没有数字，如"拾"，则默认为"一拾"
                            if (temp === 0) temp = 1;
                            temp *= 10;
                            num += temp;
                            temp = 0;
                        } else if (char === '佰') {
                            // 如果是"佰"前没有数字，如"佰"，则默认为"一佰"
                            if (temp === 0) temp = 1;
                            temp *= 100;
                            num += temp;
                            temp = 0;
                        } else if (char === '仟') {
                            // 如果是"仟"前没有数字，如"仟"，则默认为"一仟"
                            if (temp === 0) temp = 1;
                            temp *= 1000;
                            num += temp;
                            temp = 0;
                        }
                    }
                    
                    // 处理最后可能剩下的数字
                    if (temp > 0) {
                        num += temp;
                    }
                    
                    return num;
                }
                
                // 处理小数部分
                let decimalResult = '';
                if (decPart) {
                    const hasJiao = decPart.includes('角');
                    const hasFen = decPart.includes('分');
                    
                    // 处理角
                    if (hasJiao) {
                        const jiaoIndex = decPart.indexOf('角');
                        if (jiaoIndex > 0) {
                            const jiao = decPart.charAt(jiaoIndex - 1);
                            if (digitMap[jiao] !== undefined) {
                                decimalResult += digitMap[jiao];
                            }
                        }
                    } else {
                        // 没有角但有分，角位补0
                        if (hasFen) {
                            decimalResult += '0';
                        }
                    }
                    
                    // 处理分
                    if (hasFen) {
                        const fenIndex = decPart.indexOf('分');
                        if (fenIndex > 0) {
                            const fen = decPart.charAt(fenIndex - 1);
                            if (digitMap[fen] !== undefined) {
                                decimalResult += digitMap[fen];
                            }
                        }
                    } else if (decimalResult) {
                        // 有角无分，分位补0
                        decimalResult += '0';
                    }
                }
                
                // 组合整数和小数部分
                return decimalResult ? result + '.' + decimalResult : result.toString();
            }
            
            // 切换转换方向
            toggleBtn.addEventListener('click', function() {
                isArabicToChinese = !isArabicToChinese;
                amountInput.value = ''; // 清空输入框
                
                if (isArabicToChinese) {
                    inputTitle.textContent = '输入金额（阿拉伯数字）';
                    inputIcon.className = ''; // 清除所有类
                    inputIcon.classList.add('fas', 'fa-dollar-sign');
                    amountInput.placeholder = '请输入数字金额，例如：135.9';
                    amountExample.textContent = '示例: 1234.56、3000、50089.79';
                    resultValue.textContent = '壹佰叁拾伍元玖角';
                    rulesList.innerHTML = `
                        <li>支持整数部分最高到<span class="rule-highlight">"亿"</span>位，小数部分精确到<span class="rule-highlight">"分"</span></li>
                        <li>金额为0时显示<span class="rule-highlight">"零元整"</span></li>
                        <li>小数部分为0时显示<span class="rule-highlight">"整"</span></li>
                        <li>转换结果符合<span class="rule-highlight">银行票据书写规范</span></li>
                        <li>例如：<span class="rule-highlight">1024 → 壹仟零贰拾肆元整</span></li>
                    `;
                } else {
                    inputTitle.textContent = '输入金额（中文大写）';
                    inputIcon.className = ''; // 清除所有类
                    inputIcon.classList.add('fas', 'fa-yen-sign');
                    amountInput.placeholder = '请输入中文大写金额，例如：壹佰叁拾伍元玖角';
                    amountExample.textContent = '示例: 壹万贰仟叁佰肆拾伍元陆角柒分、壹仟零贰拾肆元整';
                    resultValue.textContent = '135.9';
                    rulesList.innerHTML = `
                        <li>支持整数部分最高到<span class="rule-highlight">"亿"</span>位，小数部分精确到<span class="rule-highlight">"分"</span></li>
                        <li>金额为0时显示<span class="rule-highlight">"零元整"</span></li>
                        <li>小数部分为0时显示<span class="rule-highlight">"整"</span></li>
                        <li>转换结果符合<span class="rule-highlight">银行票据书写规范</span></li>
                        <li>支持<span class="rule-highlight">双向转换</span>，点击"切换方向"按钮更改转换模式</li>
                    `;
                }
                
                // 为切换按钮添加动画效果
                toggleBtn.classList.add('pulse');
                setTimeout(() => {
                    toggleBtn.classList.remove('pulse');
                }, 600);
            });
            
            // 金额转换为大写函数
            function convertToChinese(amount) {
                // 分割整数和小数部分
                const parts = amount.split('.');
                const intPart = parts[0];
                const decPart = parts.length > 1 ? parts[1] : '';
                
                let result = '';
                
                // 处理整数部分
                if (parseInt(intPart) > 0) {
                    for (let i = 0; i < intPart.length; i++) {
                        const digit = parseInt(intPart[i]);
                        const unit = intUnits[intPart.length - 1 - i];
                        
                        if (digit !== 0) {
                            result += digits[digit] + unit;
                        } else {
                            // 处理零
                            if (i === intPart.length - 1) {
                                // 个位是0，不用加零
                                continue;
                            } else if (intPart[i + 1] !== '0') {
                                // 当前位是0，后一位不是0，加零
                                result += '零';
                            } else if (unit === '万' || unit === '亿') {
                                // 万位或亿位是0，但仍需要加单位
                                result += unit;
                            }
                        }
                    }
                    result += '元';
                }
                
                // 处理小数部分
                if (decPart) {
                    // 整数部分是0，且角位也是0
                    if (parseInt(intPart) === 0 && parseInt(decPart[0]) === 0) {
                        result = '零元';
                    }
                    
                    for (let i = 0; i < decPart.length && i < 2; i++) {
                        const digit = parseInt(decPart[i]);
                        if (digit !== 0) {
                            result += digits[digit] + decUnits[i];
                        } else if (i === 0 && decPart.length > 1 && parseInt(decPart[1]) !== 0) {
                            // 角为0，分不为0
                            result += '零';
                        }
                    }
                } else {
                    // 没有小数部分
                    result += '整';
                }
                
                // 特殊情况：0元
                if (parseInt(intPart) === 0 && (!decPart || parseInt(decPart) === 0)) {
                    result = '零元整';
                }
                
                return result;
            }

            // 验证输入金额格式 - 阿拉伯数字模式
            function validateArabicAmount(amount) {
                if (!amount) {
                    return false;
                }
                const amountRegex = /^(0|[1-9]\d{0,15})(\.\d{1,2})?$/;
                return amountRegex.test(amount);
            }
            
            // 验证输入金额格式 - 中文大写模式
            function validateChineseAmount(amount) {
                if (!amount) {
                    return false;
                }
                
                // 简单验证是否包含元字，以及只包含合法的中文大写金额字符
                const validChars = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖', 
                    '拾', '佰', '仟', '万', '亿', '元', '角', '分', '整'];
                
                // 检查是否至少包含"元"字
                if (!amount.includes('元')) {
                    return false;
                }
                
                // 检查是否只包含合法字符
                for (let i = 0; i < amount.length; i++) {
                    const char = amount[i];
                    if (!validChars.includes(char)) {
                        return false;
                    }
                }
                
                return true;
            }
            
            // 执行转换函数
            function performConversion() {
                const amount = amountInput.value.trim();
                
                if (!amount) {
                    alert('请输入金额');
                    return;
                }
                
                try {
                    let result;
                    if (isArabicToChinese) {
                        // 验证阿拉伯数字格式
                        if (!validateArabicAmount(amount)) {
                            alert('请输入正确的金额格式，最多支持16位整数和2位小数');
                            return;
                        }
                        result = convertToChinese(amount);
                    } else {
                        // 验证中文大写格式
                        if (!validateChineseAmount(amount)) {
                            alert('请输入正确的中文大写金额格式，例如：壹佰元整');
                            return;
                        }
                        result = convertToArabic(amount);
                    }
                    
                    resultValue.textContent = result;
                    
                    // 添加动画效果
                    resultValue.classList.add('pulse');
                    setTimeout(() => {
                        resultValue.classList.remove('pulse');
                    }, 600);
                } catch (error) {
                    console.error('转换出错:', error);
                    alert('转换出错，请检查输入格式');
                }
            }
            
            // 复制结果到剪贴板
            function copyToClipboard(text) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return true;
                } catch (error) {
                    console.error('复制失败:', error);
                    return false;
                }
            }
            
            // 设置初始示例
            resultValue.textContent = convertToChinese('135.9');
            
            // 转换按钮点击事件
            convertBtn.addEventListener('click', function() {
                performConversion();
            });
            
            // 复制按钮点击事件
            copyBtn.addEventListener('click', function() {
                const text = resultValue.textContent;
                if (copyToClipboard(text)) {
                    notification.classList.add('show');
                    setTimeout(function() {
                        notification.classList.remove('show');
                    }, 2000);
                }
            });
            
            // 输入框回车事件
            amountInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performConversion();
                }
            });
            
            // 修改输入框处理事件
            amountInput.addEventListener('input', function() {
                // 根据当前转换方向处理输入限制
                if (isArabicToChinese) {
                    // 只允许输入数字和小数点
                    this.value = this.value.replace(/[^\d.]/g, '');
                    
                    // 确保只有一个小数点
                    const parts = this.value.split('.');
                    if (parts.length > 2) {
                        this.value = parts[0] + '.' + parts.slice(1).join('');
                    }
                }
                
                // 输入时自动转换
                const amount = this.value.trim();
                if (amount) {
                    try {
                        let result;
                        if (isArabicToChinese && validateArabicAmount(amount)) {
                            result = convertToChinese(amount);
                        } else if (!isArabicToChinese && validateChineseAmount(amount)) {
                            result = convertToArabic(amount);
                        }
                        
                        if (result) {
                            resultValue.textContent = result;
                            
                            // 避免频繁触发动画
                            if (!resultValue.classList.contains('pulse')) {
                                resultValue.classList.add('pulse');
                                setTimeout(() => {
                                    resultValue.classList.remove('pulse');
                                }, 600);
                            }
                        }
                    } catch (error) {
                        console.error('转换出错:', error);
                    }
                }
            });
        });
    </script>
