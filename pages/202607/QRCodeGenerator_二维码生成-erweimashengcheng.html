<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator | 二维码生成</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-dark-gray: #86868b;
            --apple-light-gray: #f5f5f7;
            --apple-blue: #06c;
            --apple-white: #ffffff;
            --apple-border-radius: 18px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-light-gray);
            color: var(--apple-black);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 22px;
        }
        
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        
        h1 {
            font-size: 40px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        
        .subtitle {
            font-size: 21px;
            color: var(--apple-dark-gray);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .generator-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .input-section {
            width: 100%;
            max-width: 600px;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 18px;
            border: none;
            border-radius: var(--apple-border-radius);
            font-size: 17px;
            font-family: inherit;
            resize: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 4px 20px rgba(0, 102, 204, 0.15);
        }
        
        .settings-panel {
            width: 100%;
            max-width: 600px;
            background-color: var(--apple-white);
            border-radius: var(--apple-border-radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .settings-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .settings-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .setting-item {
            flex: 1;
            min-width: 150px;
        }
        
        .setting-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--apple-dark-gray);
        }
        
        select, input[type="color"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            font-size: 15px;
            background-color: var(--apple-white);
            cursor: pointer;
        }
        
        input[type="color"] {
            height: 42px;
            padding: 4px;
        }
        
        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 22px;
            font-size: 17px;
            font-weight: 500;
            border-radius: 980px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--apple-blue);
            color: var(--apple-white);
        }
        
        .btn-primary:hover {
            background-color: #004a99;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--apple-blue);
            border: 1px solid var(--apple-blue);
        }
        
        .btn-secondary:hover {
            background-color: rgba(0, 102, 204, 0.1);
        }
        
        .output-section {
            width: 100%;
            max-width: 600px;
            background-color: var(--apple-white);
            border-radius: var(--apple-border-radius);
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        
        #qrcode {
            margin: 0 auto;
            padding: 20px;
            background-color: var(--apple-white);
        }
        
        .qr-content {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--apple-light-gray);
            border-radius: 12px;
            word-break: break-all;
            font-size: 15px;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
        }
        
        .message-info {
            background-color: rgba(0, 102, 204, 0.1);
            color: var(--apple-blue);
        }
        
        .message-warning {
            background-color: rgba(255, 204, 0, 0.1);
            color: #b65e00;
        }
        
        .message-error {
            background-color: rgba(255, 59, 48, 0.1);
            color: #d70015;
        }
        
        .hidden {
            display: none;
        }
        
        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--apple-dark-gray);
            font-size: 13px;
        }
        
        @media (max-width: 734px) {
            .container {
                padding: 32px 16px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .subtitle {
                font-size: 19px;
            }
            
            .button-group {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
            }
            
            .settings-group {
                flex-direction: column;
                gap: 15px;
            }
            
            .setting-item {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>高级二维码生成器</h1>
            <p class="subtitle">输入任何文本、URL或其他内容，自定义二维码大小和颜色，创建独特的二维码。</p>
        </header>
        
        <div class="generator-container">
            <div class="input-section">
                <textarea id="inputText" placeholder="输入文本、网址或其他内容..."></textarea>
            </div>
            
            <div class="settings-panel">
                <div class="settings-title">二维码样式设置</div>
                
                <div class="settings-group">
                    <div class="setting-item">
                        <label class="setting-label">二维码大小</label>
                        <select id="qrSize">
                            <option value="200">小 (200×200)</option>
                            <option value="300" selected>中 (300×300)</option>
                            <option value="500">大 (500×500)</option>
                        </select>
                    </div>
                    
                    <div class="setting-item">
                        <label class="setting-label">前景色</label>
                        <input type="color" id="qrColor" value="#1d1d1f">
                    </div>
                    
                    <div class="setting-item">
                        <label class="setting-label">背景色</label>
                        <input type="color" id="qrBgColor" value="#ffffff">
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="generateQRCode()">生成二维码</button>
                <button id="downloadBtn" class="btn btn-secondary hidden" onclick="downloadQRCode()">下载二维码</button>
            </div>
            
            <div id="outputSection" class="output-section hidden">
                <div id="qrcode"></div>
                <div id="qrContent" class="qr-content hidden"></div>
                <div id="message" class="message hidden"></div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 由 老陈 使用 DeepSeek 生成，<a href="https://pan.quark.cn/s/1ce1199a69d4" target="_blank">提示词、网页源码，点这领取，免费</a>.</p>
        </footer>
    </div>

    <script>
        // 保存当前二维码数据URL
        let currentQRCodeDataUrl = '';
        
        function isValidUrl(url) {
            try {
                new URL(url);
                return url.includes('.') && !url.includes(' ');
            } catch (e) {
                return false;
            }
        }

        function generateQRCode() {
            const inputText = document.getElementById('inputText').value.trim();
            const qrcodeDiv = document.getElementById('qrcode');
            const outputSection = document.getElementById('outputSection');
            const qrContentDiv = document.getElementById('qrContent');
            const messageDiv = document.getElementById('message');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // 获取样式设置
            const size = document.getElementById('qrSize').value;
            const color = document.getElementById('qrColor').value;
            const bgColor = document.getElementById('qrBgColor').value;
            
            // 重置UI
            qrcodeDiv.innerHTML = '';
            qrContentDiv.textContent = '';
            messageDiv.textContent = '';
            qrContentDiv.classList.add('hidden');
            messageDiv.classList.add('hidden');
            outputSection.classList.add('hidden');
            downloadBtn.classList.add('hidden');
            
            if (!inputText) {
                showMessage('请输入要生成二维码的内容', 'error');
                return;
            }
            
            // 显示输出区域
            outputSection.classList.remove('hidden');
            
            // 显示原始内容（如果是纯文本）
            const isUrl = /^https?:\/\//i.test(inputText);
            if (!isUrl) {
                qrContentDiv.textContent = inputText;
                qrContentDiv.classList.remove('hidden');
            }
            
            // 验证URL有效性
            const isValidUrlFormat = isUrl && isValidUrl(inputText);
            
            // 设置提示信息
            if (isUrl && !isValidUrlFormat) {
                showMessage(
                    '这不是有效的网页地址，微信扫码可能无法打开。建议使用完整网址(如https://example.com)或删除http://前缀使用纯文本模式',
                    'warning'
                );
            } else if (!isUrl) {
                showMessage(
                    '微信扫描纯文本二维码可能无法显示内容。如需微信支持，请使用完整网址(以http://或https://开头)',
                    'info'
                );
            } else {
                showMessage('这是一个有效网页链接，微信扫码可直接打开', 'info');
            }
            
            // 生成二维码
            try {
                QRCode.toDataURL(inputText, {
                    width: parseInt(size),
                    margin: 2,
                    color: {
                        dark: color,
                        light: bgColor
                    }
                }, function (error, url) {
                    if (error) {
                        showMessage('生成二维码时出错: ' + error.message, 'error');
                        console.error(error);
                    } else {
                        currentQRCodeDataUrl = url; // 保存数据URL
                        
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = '生成的二维码';
                        img.style.width = '100%';
                        img.style.maxWidth = size + 'px';
                        img.style.height = 'auto';
                        qrcodeDiv.appendChild(img);
                        downloadBtn.classList.remove('hidden');
                    }
                });
            } catch (e) {
                showMessage('发生错误: ' + e.message, 'error');
                console.error(e);
            }
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message'; // 重置class
            messageDiv.classList.add('message-' + type);
            messageDiv.classList.remove('hidden');
        }
        
        function downloadQRCode() {
            if (!currentQRCodeDataUrl) {
                showMessage('请先生成二维码', 'error');
                return;
            }
            
            try {
                const link = document.createElement('a');
                const size = document.getElementById('qrSize').value;
                link.download = `二维码-${size}x${size}-${new Date().toISOString().slice(0, 10)}.png`;
                link.href = currentQRCodeDataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                showMessage('下载失败: ' + e.message, 'error');
                console.error(e);
            }
        }
        
        // 初始化颜色选择器标签
        document.getElementById('qrColor').addEventListener('input', function() {
            this.setAttribute('value', this.value);
        });
        
        document.getElementById('qrBgColor').addEventListener('input', function() {
            this.setAttribute('value', this.value);
        });
    </script>
</body>
</html>
