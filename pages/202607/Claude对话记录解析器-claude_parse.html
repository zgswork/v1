<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude 对话记录解析器</title>
    <style>
/* CSS 变量定义 */
:root {
    /* 深色主题变量 */
    --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-body: radial-gradient(ellipse at top, #1a237e 0%, #000051 50%, #0d1117 100%);
    --bg-secondary: #161b22;
    --bg-tertiary: #0d1117;
    --bg-card: #21262d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-accent: #58a6ff;
    --border-color: #30363d;
    --accent-color: #238636;
    --accent-hover: #2ea043;
    --shadow-color: rgba(0,0,0,0.3);
    --code-bg: #0d1117;
    --code-border: #30363d;
    --code-text: #e6edf3;
    --code-lang: #7d8590;
    
    /* 亮色主题变量 */
    --bg-primary-light: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-body-light: radial-gradient(ellipse at top, #f0f4ff 0%, #e8f2ff 50%, #ffffff 100%);
    --bg-secondary-light: #f6f8fa;
    --bg-tertiary-light: #ffffff;
    --bg-card-light: #f1f3f4;
    --text-primary-light: #24292f;
    --text-secondary-light: #656d76;
    --text-accent-light: #0969da;
    --border-color-light: #d0d7de;
    --accent-color-light: #22c55e;
    --accent-hover-light: #16a34a;
    --shadow-color-light: rgba(0,0,0,0.1);
    --code-bg-light: #f6f8fa;
    --code-border-light: #d0d7de;
    --code-text-light: #24292f;
    --code-lang-light: #656d76;
}

/* 基础样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: 
        var(--bg-body),
        radial-gradient(circle at 80% 20%, #303f9f20 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, #3f51b520 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, #ffffff03 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    position: relative;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff60, transparent),
        radial-gradient(2px 2px at 40px 70px, #ffffff40, transparent),
        radial-gradient(1px 1px at 90px 40px, #ffffff80, transparent),
        radial-gradient(1px 1px at 130px 80px, #ffffff60, transparent),
        radial-gradient(2px 2px at 160px 30px, #ffffff40, transparent);
    background-repeat: repeat;
    background-size: 200px 100px;
    animation: twinkle 4s infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    width: 100%;
    box-sizing: border-box;
    overflow-x: hidden;
}

.hidden {
    display: none;
}

.loading {
    text-align: center;
    padding: 50px;
    color: var(--text-secondary);
}

.error {
    background: #da3633;
    color: white;
    padding: 15px;
    border-radius: 6px;
    margin: 20px;
}

/* 头部样式 */
.header {
    background: 
        var(--bg-primary),
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 70%),
        radial-gradient(circle at 80% 20%, rgba(120, 119, 198, 0.3), transparent 70%),
        radial-gradient(circle at 40% 80%, rgba(120, 119, 198, 0.3), transparent 70%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 
        0 8px 32px var(--shadow-color),
        inset 0 1px 0 rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
    animation: headerPulse 3s ease-in-out infinite alternate;
}

@keyframes headerPulse {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
}

.header h1 {
    font-size: 2.2em;
    margin-bottom: 10px;
    font-weight: 700;
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.header p {
    font-size: 1.1em;
    opacity: 0.9;
    position: relative;
    z-index: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

/* 主题切换按钮 */
.theme-toggle-container {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 15px;
}

.theme-toggle {
    cursor: pointer;
    padding: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
    font-size: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    backdrop-filter: blur(10px);
}

.theme-toggle:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    transform: scale(1.1) rotate(180deg);
}

/* 上传区域 */
.upload-section {
    padding: 60px 20px;
    text-align: center;
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.upload-area {
    border: 2px dashed rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 60px 40px;
    margin: 0;
    width: 100%;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.upload-area:hover, .upload-area.dragover {
    border-color: rgba(255, 255, 255, 0.6);
    background: rgba(0, 0, 0, 0.9);
    transform: translateY(-4px);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
}

.upload-area input[type="file"] {
    display: none;
}

.upload-icon {
    font-size: 64px;
    margin-bottom: 20px;
}

.upload-text {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
    color: rgba(255, 255, 255, 0.9);
}

.upload-hint {
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    line-height: 1.5;
}

/* 亮色主题下的上传区域样式 */
.light-theme .upload-area {
    background: rgba(255, 255, 255, 0.9);
    border-color: rgba(0, 0, 0, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.light-theme .upload-area:hover, 
.light-theme .upload-area.dragover {
    background: rgba(255, 255, 255, 0.95);
    border-color: rgba(0, 0, 0, 0.4);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
}

.light-theme .upload-text {
    color: rgba(0, 0, 0, 0.9);
}

.light-theme .upload-hint {
    color: rgba(0, 0, 0, 0.6);
}

/* 统计信息 */
.stats {
    background: var(--bg-secondary);
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-secondary);
    display: none;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 16px var(--shadow-color);
}

.stats.show {
    display: flex !important;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.stat-item:hover {
    background: var(--bg-card);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px var(--shadow-color);
}

/* 控制按钮 */
.controls {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: none;
    flex-direction: column;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 24px var(--shadow-color);
    backdrop-filter: blur(12px);
}

.controls.show {
    display: flex !important;
}

/* 控制面板切换按钮 */
.controls-toggle {
    background: var(--bg-card);
    padding: 12px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.3s ease;
    border-bottom: 1px solid var(--border-color);
    user-select: none;
}

.toggle-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
}

.controls-toggle:hover {
    background: var(--bg-tertiary);
}

.toggle-icon {
    font-size: 16px;
}

.toggle-text {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 14px;
}

/* 快速回到顶部按钮 */
.scroll-top-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
    padding: 6px 12px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    opacity: 0;
    transform: translateX(15px);
    pointer-events: none;
    backdrop-filter: blur(10px);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
    white-space: nowrap;
}

/* 只在收起状态时显示按钮 */
.scroll-top-btn.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

.scroll-top-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    color: rgba(255, 255, 255, 1);
    transform: translateY(-2px);
}

.scroll-text {
    font-size: 12px;
    font-weight: 500;
}

/* CSS箭头样式 */
.arrow-up {
    width: 0;
    height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-bottom: 5px solid currentColor;
    position: relative;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.arrow-up::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: -2px;
    width: 4px;
    height: 1px;
    background: currentColor;
    transition: all 0.3s ease;
}

.scroll-top-btn:hover .arrow-up {
    transform: translateY(-1px);
}

/* 亮色主题下的按钮样式 */
.light-theme .scroll-top-btn {
    background: rgba(0, 0, 0, 0.05);
    border-color: rgba(0, 0, 0, 0.1);
    color: rgba(0, 0, 0, 0.7);
}

.light-theme .scroll-top-btn:hover {
    background: rgba(0, 0, 0, 0.1);
    border-color: rgba(0, 0, 0, 0.2);
    color: rgba(0, 0, 0, 1);
}

/* 控制面板内容 */
.controls-content {
    padding: 18px 24px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    transition: all 0.3s ease;
    overflow: hidden;
}

.controls-content.collapsed {
    max-height: 0;
    padding: 0 24px;
    opacity: 0;
}

.btn {
    background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px var(--shadow-color);
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
}

.btn:hover {
    background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
    transform: translateY(-2px);
    box-shadow: 0 4px 16px var(--shadow-color);
}

.btn:hover::before {
    left: 100%;
}

.search-box {
    flex: 1;
    max-width: 400px;
    padding: 12px 20px;
    border: 2px solid var(--border-color);
    border-radius: 25px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.search-box:focus {
    outline: none;
    border-color: var(--text-accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    transform: scale(1.02);
}

/* 对话样式 */
.conversation {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    margin-bottom: 30px;
    overflow: hidden;
    box-shadow: 0 4px 20px var(--shadow-color);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.conversation:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--shadow-color);
}

.conversation-header {
    background: var(--bg-secondary);
    padding: 15px 24px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border-color);
    user-select: none;
    transition: all 0.3s ease;
    gap: 15px;
}

.conversation-header:hover {
    background: var(--bg-card);
}

.conversation-title-area {
    flex: 1;
    min-width: 0;
}

.conversation-title {
    color: var(--text-primary);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
}

.conversation-preview {
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.8;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
}

.conversation-meta {
    color: var(--text-secondary);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.conversation-arrow {
    color: var(--text-accent);
    font-size: 12px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: all 0.3s ease;
}

.conversation-arrow:hover {
    color: var(--accent-color);
    transform: scale(1.05);
}

.conversation-content {
    display: block;
}

.conversation-content.collapsed {
    display: none;
}

/* 用户消息样式 */
.user-msg {
    background: linear-gradient(135deg, #1f6feb, #0969da);
    color: white;
    padding: 20px;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 15px;
}

.user-msg .avatar {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 2px;
}

.user-msg .message-content {
    flex: 1;
    min-width: 0;
}

.user-msg .label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    opacity: 0.9;
}

.user-msg .content {
    word-wrap: break-word;
    overflow-wrap: break-word;
}

/* 助手消息样式 */
.assistant-msg {
    background: var(--bg-tertiary);
    padding: 20px;
    position: relative;
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: flex-start;
    gap: 15px;
}

.assistant-msg .avatar {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 2px;
}

.assistant-msg .message-content {
    flex: 1;
    min-width: 0;
}

.assistant-msg .label {
    color: var(--accent-color);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
}

.assistant-msg .content {
    word-wrap: break-word;
    overflow-wrap: break-word;
}

/* Claude回复文本内容样式 */
.assistant-text-content {
    margin-top: 10px;
}

/* 大内容块样式 */
.large-content-block {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
}

.content-header {
    background: var(--bg-card);
    padding: 12px 15px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    user-select: none;
}

.content-header:hover {
    background: var(--bg-tertiary);
}

.content-type {
    color: var(--text-accent);
    font-weight: 600;
}

.content-info {
    color: var(--text-secondary);
    font-size: 12px;
}

.toggle-icon {
    color: var(--text-accent);
    font-size: 12px;
}

.content-preview, .content-full {
    padding: 15px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bg-tertiary);
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.content-preview {
    border-bottom: 1px solid var(--border-color);
    color: var(--text-secondary);
}

/* 代码块样式 */
.code-block {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
}

.code-lang {
    background: var(--bg-card);
    padding: 8px 15px;
    font-size: 12px;
    color: var(--code-lang);
    font-weight: 600;
    text-transform: uppercase;
    border-bottom: 1px solid var(--code-border);
}

.code-content {
    padding: 15px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--code-text);
    background: var(--code-bg);
    overflow-x: auto;
}

code {
    background: var(--bg-card);
    padding: 3px 6px;
    border-radius: 3px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 13px;
    color: var(--text-accent);
}

/* 工具相关样式 */
.tools-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
}

.tool-call {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    margin: 15px 0;
    overflow: hidden;
    transition: all 0.3s ease;
}

.tool-call:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--shadow-color);
}

.tool-header {
    background: var(--bg-card);
    padding: 15px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border-color);
    user-select: none;
    transition: all 0.3s ease;
}

.tool-header:hover {
    background: var(--bg-secondary);
}

.tool-icon {
    font-size: 16px;
    flex-shrink: 0;
}

.tool-name {
    color: var(--text-accent);
    font-weight: 600;
    font-size: 14px;
}

.tool-toggle {
    margin-left: auto;
    color: var(--text-accent);
    font-size: 12px;
}

.tool-details {
    padding: 18px;
    background: var(--bg-tertiary);
}

.param {
    margin-bottom: 8px;
    font-size: 13px;
}

.param-key {
    color: var(--text-accent);
    font-weight: 600;
}

.param-value {
    color: var(--text-primary);
    margin-left: 8px;
    font-family: monospace;
    word-break: break-all;
    white-space: pre-wrap;
    display: block;
    background: var(--bg-tertiary);
    padding: 8px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    margin-top: 4px;
}

.param-expand-btn {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 10px;
    margin-left: 8px;
    transition: all 0.2s ease;
}

.param-expand-btn:hover {
    background: var(--accent-hover);
    transform: scale(1.05);
}

/* 工具结果样式 */
.tool-result {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin: 12px 0;
    overflow: hidden;
}

.result-content {
    padding: 15px;
    font-size: 12px;
    color: var(--text-secondary);
    font-family: monospace;
    line-height: 1.4;
    white-space: pre-wrap;
    position: relative;
    background: var(--bg-tertiary);
}

.result-content.collapsed {
    max-height: 4em;
    overflow: hidden;
    position: relative;
}

.result-content.collapsed::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1em;
    background: linear-gradient(transparent, var(--bg-tertiary));
    pointer-events: none;
}

.result-content.collapsed pre {
    max-height: 4em;
    overflow: hidden;
}

.result-content.expanded {
    max-height: none;
}

.result-expand-btn {

// HTML转义函数
function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, (m) => map[m]);
}

// 字符串哈希函数
function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return hash;
}

// 判断是否为真实用户输入
function isRealUserInput(content) {
    if (!content) return false;
    
    if (Array.isArray(content)) return false;
    if (typeof content !== 'string') content = String(content);
    
    content = content.trim();
    
    const systemIndicators = [
        'tool_use_id', 'tool_result', '→import', '→def', '→class',
        'System updated', 'File created', 'File updated',
        'Called the', 'Result of calling'
    ];
    
    const contentLower = content.toLowerCase();
    for (const indicator of systemIndicators) {
        if (contentLower.includes(indicator.toLowerCase())) {
            return false;
        }
    }
    
    if (content.length > 300) {
        const lines = content.split('\n');
        const lineNumberLines = lines.filter(line => /^\s*\d+→/.test(line)).length;
        if (lineNumberLines > 3) return false;
        
        const codeLines = lines.filter(line => 
            /^\s*(def|class|import|from|function|var|let|const)/.test(line.trim())
        ).length;
        
        if (codeLines > 8 && !content.includes('```') && !content.includes('#')) {
            return false;
        }
    }
    
    try {
        if (content.startsWith('[{') || content.startsWith('{')) {
            JSON.parse(content);
            return false;
        }
    } catch (e) {}
    
    return content.length >= 3;
}

// 清理用户内容
function cleanUserContent(content) {
    if (Array.isArray(content)) content = String(content);
    if (typeof content !== 'string') content = String(content);

}

    } catch (err) {

    document.body.removeChild(textArea);
}

// 复制到剪贴板
function copyToClipboard(elementId) {
    const element = document.getElementById(elementId);
    const button = element.querySelector('.copy-btn');
    
    if (!element || !button) {
        console.error('Copy button elements not found for:', elementId);
        return;
    }
    
    // 获取纯文本内容，保持换行格式
    let textToCopy;
    
    // 首先尝试从Map获取完整内容
    const fullContent = fullContentStorage.get(elementId);
    if (fullContent) {
        textToCopy = fullContent;
        debugLog('Using content from Map storage, length:', textToCopy.length);
    } else {
        // 降级方案：从tool-result-content元素获取文本
        const toolResultContent = element.querySelector('.tool-result-content');
        if (toolResultContent) {
            textToCopy = toolResultContent.textContent || toolResultContent.innerText;
        } else {
            // 再降级：从result-text元素获取文本
            const resultText = element.querySelector('.result-text');
            if (resultText) {
                textToCopy = resultText.textContent || resultText.innerText;
                // 移除复制按钮的文本
                textToCopy = textToCopy.replace('复制', '').replace('已复制', '').trim();
            } else {
                textToCopy = element.textContent || element.innerText;
                // 移除复制按钮的文本
                textToCopy = textToCopy.replace('复制', '').replace('已复制', '').trim();
            }
        }
        debugLog('Using content from element, length:', textToCopy.length);
    }
    
    if (!textToCopy) {
        console.error('No content to copy');
        return;
    }
    
    // 使用现代的Clipboard API
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = button.textContent;
            button.textContent = '已复制';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Clipboard API失败:', err);
            fallbackCopyTextToClipboard(textToCopy, button);
        });
    } else {
        // 降级方案
        fallbackCopyTextToClipboard(textToCopy, button);
    }
}

function exportToMarkdown() {

    let markdown = '# Claude 对话记录\n\n';

    if (Object.keys(globalStats.toolStats).length > 0) {
        markdown += '### 工具使用统计\n\n';
        Object.entries(globalStats.toolStats).forEach(([toolName, count]) => {
            markdown += `- ${toolName}: ${count}次\n`;
        });
        markdown += '\n';
    }
    
    markdown += '## 对话内容\n\n';
    
    // 处理每个对话轮次
    conversations.forEach((turn, index) => {
        const userContent = turn.user?.content || '';
        const userTime = turn.user?.timestamp || '';
        const timeStr = userTime ? new Date(userTime).toLocaleString() : '时间未知';
        
        markdown += `### 对话 ${index + 1} (${timeStr})\n\n`;
        
        // 用户消息
        markdown += '**用户:**\n\n';
        if (userContent.trim()) {
            markdown += `${userContent.trim()}\n\n`;
        } else {
            markdown += '(无内容)\n\n';
        }
        
        // 助手回复
        markdown += '**Claude:**\n\n';
        const allAssistantText = turn.assistant_parts.map(part => part.text || '').join('\n\n');
        if (allAssistantText.trim()) {
            markdown += `${allAssistantText.trim()}\n\n`;
        } else {
            markdown += '(无回复内容)\n\n';
        }
        
        // 工具调用
        const allTools = turn.assistant_parts.flatMap(part => part.tools || []);
        if (allTools.length > 0) {
            markdown += '**工具调用:**\n\n';
            
            allTools.forEach((tool, toolIndex) => {
                const toolName = tool.name || 'Unknown';
                markdown += `${toolIndex + 1}. **${toolName}**\n`;
                
                // 工具参数
                if (tool.input && Object.keys(tool.input).length > 0) {
                    markdown += '   - 参数:\n';
                    Object.entries(tool.input).forEach(([key, value]) => {
                        // 处理长内容
                        let displayValue = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
                        if (displayValue.length > 200) {
                            displayValue = displayValue.substring(0, 200) + '...';
                        }
                        markdown += `     - ${key}: ${displayValue}\n`;
                    });
                }
                
                // 工具结果
                const toolResult = turn.tool_results.find(result => result.id === tool.id);
                if (toolResult && toolResult.content) {
                    markdown += '   - 结果:\n';
                    let resultContent = toolResult.content;
                    
                    // 如果是代码内容，用代码块包装
                    if (resultContent.includes('\n') && (resultContent.includes('→') || resultContent.includes('def ') || resultContent.includes('class '))) {
                        markdown += '     ```\n';
                        // 限制结果长度，避免过长
                        if (resultContent.length > 2000) {
                            resultContent = resultContent.substring(0, 2000) + '\n...(内容过长，已截断)';
                        }
                        markdown += resultContent.split('\n').map(line => `     ${line}`).join('\n') + '\n';
                        markdown += '     ```\n';
                    } else {
                        // 普通文本结果
                        if (resultContent.length > 500) {
                            resultContent = resultContent.substring(0, 500) + '...(内容过长，已截断)';
                        }
                        markdown += `     ${resultContent}\n`;
                    }
                }
                
                markdown += '\n';
            });
        }
        
        markdown += '---\n\n';
    });
    
    // 创建并下载文件
    const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `claude-conversation-${new Date().toISOString().split('T')[0]}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

// 解析器相关函数
console.log('Parser.js loaded');

// 解析助手消息
function parseAssistantMessage(msg) {
    const messageData = msg.message || {};
    const contentParts = messageData.content || [];
    
    let textContent = "";
    let toolsUsed = [];
    
    if (Array.isArray(contentParts)) {
        for (const part of contentParts) {
            if (part.type === 'text') {
                textContent += part.text || '';
            } else if (part.type === 'tool_use') {
                toolsUsed.push({
                    name: part.name || '',
                    input: part.input || {},
                    id: part.id || ''
                });
            }
        }
    } else if (typeof contentParts === 'string') {
        textContent = contentParts;
    }
    
    return {
        text: textContent,
        tools: toolsUsed,
        timestamp: msg.timestamp || '',
        model: messageData.model || '',
        usage: messageData.usage || {}
    };
}

// 解析工具结果
function parseToolResult(msg) {
    const toolResult = msg.toolUseResult || {};
    const resultType = toolResult.type || 'text';
    let content = toolResult.content || '';
    
    let fileInfo = null;
    if (resultType === 'text' && typeof content === 'object') {
        fileInfo = {
            file_path: content.filePath || '',
            content: content.content || ''
        };
        content = content.content || '';
    }
    
    return {
        id: toolResult.toolUseId || '', // 添加工具ID用于匹配
        type: resultType,
        content: content,
        file_info: fileInfo,
        timestamp: msg.timestamp || ''
    };
}

// 处理消息
function processMessages(rawMessages) {
    const processedConversations = [];
    const seenUserContent = new Set();
    let currentTurn = null;
    
    for (const msg of rawMessages) {
        const msgType = msg.type || '';
        
        if (msgType === 'user') {
            const content = msg.message?.content || '';
            if (isRealUserInput(content)) {
                const cleanContent = cleanUserContent(content);
                const contentHash = hashString(cleanContent.trim());
                
                if (seenUserContent.has(contentHash)) continue;
                seenUserContent.add(contentHash);
                
                if (currentTurn && isCompleteTurn(currentTurn)) {
                    processedConversations.push(currentTurn);
                }
                
                currentTurn = {
                    user: {
                        content: cleanContent,
                        timestamp: msg.timestamp || ''
                    },
                    assistant_parts: [],
                    tool_results: []
                };
            }
        } else if (msgType === 'assistant' && currentTurn) {
            const assistantData = parseAssistantMessage(msg);
            if (assistantData) {
                currentTurn.assistant_parts.push(assistantData);
            }
        } else if (msg.toolUseResult && currentTurn) {
            const toolResult = parseToolResult(msg);
            if (toolResult) {
                currentTurn.tool_results.push(toolResult);
            }
        }
    }
    
    if (currentTurn && isCompleteTurn(currentTurn)) {
        processedConversations.push(currentTurn);
    }
    
    return processedConversations;
}

// 解析JSONL内容
function parseJsonlContent(content) {
    debugLog('parseJsonlContent called, content length:', content.length);
    try {
        const lines = content.split('\n').filter(line => line.trim());
        debugLog('Found', lines.length, 'lines');
        const rawMessages = [];
        
        lines.forEach((line, index) => {
            try {
                const data = JSON.parse(line);
                data.line_number = index + 1;
                rawMessages.push(data);
            } catch (e) {
                console.warn(`跳过第${index + 1}行，JSON解析失败`);
            }
        });

        debugLog('Parsed', rawMessages.length, 'messages');
        conversations = processMessages(rawMessages);
        debugLog('Processed into', conversations.length, 'conversations');
        
        calculateStats();
        debugLog('Stats calculated');
        
        generateHTML();
        debugLog('HTML generated');
        
        showResults();
        debugLog('Results shown');
        
    } catch (error) {
        console.error('Error in parseJsonlContent:', error);
        console.error('Error stack:', error.stack);
        showError('JSONL解析失败: ' + error.message);
    }
}

// 计算统计信息
function calculateStats() {
    globalStats.totalConversations = conversations.length;
    globalStats.totalTools = 0;
    globalStats.totalUserChars = 0;
    globalStats.totalAssistantChars = 0;
    globalStats.toolStats = {};
    
    for (const turn of conversations) {
        const userContent = turn.user?.content || '';
        globalStats.totalUserChars += userContent.length;
        
        for (const part of turn.assistant_parts || []) {
            const assistantText = part.text || '';
            globalStats.totalAssistantChars += assistantText.length;
            
            for (const tool of part.tools || []) {
                const toolName = tool.name || 'Unknown';
                globalStats.toolStats[toolName] = (globalStats.toolStats[toolName] || 0) + 1;
                globalStats.totalTools++;
            }
        }
    }
}

// 格式化智能内容
function formatSmartContent(text, isUser = false) {
    if (!text) return "";
    if (typeof text !== 'string') text = String(text);
    
    // 清理多余的换行但保持基本格式
    text = text.replace(/\n\s*\n\s*\n+/g, '\n\n').trim();
    
    const originalLength = text.length;
    // 计算实际行数，包括换行符分隔的行
    const lines = text.split('\n');

        const previewLength = Math.min(150, Math.floor(text.length * 0.3));
        const previewText = text.substring(0, previewLength);

        if (isUser) {

        } else if (isCodeContent) {
            const langMatch = text.match(/```(\w+)/);
            contentType = langMatch ? langMatch[1] : 'Code';
        } else {
            contentType = '回复内容';
        }
        
        const blockId = `content-block-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        
        return `
            <div class="large-content-block" id="${blockId}">
                <div class="content-header" onclick="toggleLargeContent(this)">
                    <span class="content-type">${contentType}</span>
                    <span class="content-info">(${actualLineCount} 行，${originalLength} 字符)</span>
                    <span class="toggle-icon">▲ 点击收起</span>

// 格式化Markdown内容
function formatMarkdownSafely(text, isAlreadyEscaped = false) {
    // 安全的Markdown处理函数
    let result = isAlreadyEscaped ? text : escapeHtml(text);
    
    // 临时占位符，避免冲突
    const placeholders = new Map();
    let placeholderIndex = 0;
    
    // 先处理代码块，用占位符替换
    result = result.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
        const placeholder = `__CODE_BLOCK_${placeholderIndex++}__`;
        const codeId = `code-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        // 如果代码已经被转义，需要反转义
        const unescapedCode = isAlreadyEscaped ? 
            code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#039;/g, "'") : 
            code;
        placeholders.set(placeholder, `<div class="code-block">
            <div class="code-lang">${lang || 'Code'}</div>
            <pre class="code-content" id="${codeId}"><button class="copy-btn" onclick="copyToClipboard('${codeId}')">复制</button>${unescapedCode.trim()}</pre>
        </div>`);
        return placeholder;
    });
    
    // 处理行内代码
    result = result.replace(/`([^`\n]+)`/g, (match, code) => {
        const placeholder = `__INLINE_CODE_${placeholderIndex++}__`;
        // 如果代码已经被转义，需要反转义
        const unescapedCode = isAlreadyEscaped ? 
            code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#039;/g, "'") : 
            code;
        placeholders.set(placeholder, `<code style="background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 3px; font-family: monospace; font-size: 0.9em;">${unescapedCode}</code>`);
        return placeholder;
    });
    
    // 处理表格（简化处理）
    const lines = result.split('\n');
    const processedLines = [];
    let inTable = false;
    let tableRows = [];
    
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        
        if (line.includes('|') && line.split('|').length > 2) {
            if (!inTable) {
                inTable = true;
                tableRows = [];
            }
            
            // 跳过分隔行
            if (!line.includes('---')) {
                const cells = line.split('|').filter(cell => cell.trim());
                const rowHtml = cells.map(cell => `<td style="padding: 8px; border: 1px solid var(--border-color); text-align: left;">${cell.trim()}</td>`).join('');
                tableRows.push(`<tr>${rowHtml}</tr>`);
            }
        } else {
            if (inTable) {
                // 结束表格
                processedLines.push(`<table style="border-collapse: collapse; margin: 1em 0; width: 100%;">${tableRows.join('')}</table>`);
                inTable = false;
                tableRows = [];
            }
            processedLines.push(line);
        }
    }
    
    // 处理未结束的表格
    if (inTable && tableRows.length > 0) {
        processedLines.push(`<table style="border-collapse: collapse; margin: 1em 0; width: 100%;">${tableRows.join('')}</table>`);
    }
    
    result = processedLines.join('\n');
    
    // 处理标题
    result = result.replace(/^### (.+)$/gm, '<h3 style="color: var(--text-accent); margin: 1.5em 0 0.5em 0; font-size: 1.2em;">$1</h3>');
    result = result.replace(/^## (.+)$/gm, '<h2 style="color: var(--text-accent); margin: 1.5em 0 0.5em 0; font-size: 1.4em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2em;">$1</h2>');
    result = result.replace(/^# (.+)$/gm, '<h1 style="color: var(--text-accent); margin: 1.5em 0 0.5em 0; font-size: 1.6em; border-bottom: 2px solid var(--border-color); padding-bottom: 0.3em;">$1</h1>');
    
    // 处理引用块
    result = result.replace(/^> (.+)$/gm, '<blockquote style="border-left: 4px solid var(--border-color); margin: 1em 0; padding-left: 1em; color: var(--text-secondary); font-style: italic;">$1</blockquote>');
    
    // 处理粗体和斜体
    result = result.replace(/\*\*([^*\n]+)\*\*/g, '<strong style="color: var(--text-accent); font-weight: 600;">$1</strong>');
    result = result.replace(/\*([^*\n]+)\*/g, '<em style="color: var(--text-accent); font-style: italic;">$1</em>');
    
    // 处理列表
    result = result.replace(/^- (.+)$/gm, '<li style="margin: 0.3em 0;">$1</li>');
    result = result.replace(/^(\d+)\. (.+)$/gm, '<li style="margin: 0.3em 0;">$2</li>');
    
    // 包装连续的列表项
    result = result.replace(/(<li[^>]*>.*<\/li>\s*)+/g, '<ul style="margin: 1em 0; padding-left: 2em; list-style-type: disc;">$&</ul>');
    
    // 处理链接
    result = result.replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" style="color: var(--text-accent); text-decoration: underline;">$1</a>');
    
    // 恢复占位符
    placeholders.forEach((replacement, placeholder) => {
        result = result.replace(new RegExp(placeholder, 'g'), replacement);
    });
    
    // 处理段落和换行 - 更智能的处理
    const sections = result.split(/\n\s*\n/);
    const formattedSections = sections.map(section => {
        if (section.trim()) {
            // 如果段落已经包含HTML标签，直接返回
            if (section.includes('<h1') || section.includes('<h2') || section.includes('<h3') || 
                section.includes('<div') || section.includes('<ul') || section.includes('<blockquote') ||
                section.includes('<table')) {
                return section;
            }
            // 否则包装为段落，确保单个换行也被处理
            const processedSection = section.replace(/\n/g, '<br>');
            return `<p style="margin: 1em 0; line-height: 1.6; white-space: pre-wrap;">${processedSection}</p>`;
        }
        return '';
    }).filter(s => s);
    
    return `<div style="word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">${formattedSections.join('')}</div>`;
}

// 切换大内容块
function toggleLargeContent(header) {
    try {
        const container = header.parentElement;
        const preview = container.querySelector('.content-preview');
        const full = container.querySelector('.content-full');
        const icon = header.querySelector('.toggle-icon');
        
        // 调试信息
        const contentType = header.querySelector('.content-type')?.textContent || 'Unknown';
        
        if (!preview || !full || !icon) {
            console.error('toggleLargeContent failed for', contentType, ':', { 
                preview: !!preview, 
                full: !!full, 
                icon: !!icon,
                container: !!container
            });
            return;
        }
        
        // 更可靠的状态检测
        const fullComputedStyle = getComputedStyle(full);
        const fullIsHidden = full.style.display === 'none' || fullComputedStyle.display === 'none';
        
        // 根据图标文本进行额外验证
        const iconText = icon.textContent;
        const shouldExpand = iconText.includes('展开') || fullIsHidden;
        
        console.log(`toggleLargeContent for ${contentType}:`, {
            fullInlineDisplay: full.style.display,
            fullComputedDisplay: fullComputedStyle.display,
            fullIsHidden: fullIsHidden,
            iconText: iconText,
            shouldExpand: shouldExpand,
            contentLength: full.textContent?.length || 0
        });
        
        if (shouldExpand) {
            // 展开：显示完整内容，隐藏预览
            full.style.display = 'block';
            preview.style.display = 'none';
            icon.textContent = '▲ 点击收起';
            console.log(`Expanded ${contentType}`);
        } else {
            // 收起：隐藏完整内容，显示预览
            full.style.display = 'none';
            preview.style.display = 'block';
            icon.textContent = '▼ 点击展开';
            console.log(`Collapsed ${contentType}`);
        }
        
        // 验证操作是否成功
        setTimeout(() => {
            const finalFullDisplay = getComputedStyle(full).display;
            const finalIconText = icon.textContent;
            const operationSuccessful = (finalFullDisplay === 'none') === finalIconText.includes('展开');
            
            console.log(`Toggle verification for ${contentType}:`, {
                finalFullDisplay: finalFullDisplay,
                finalIconText: finalIconText,
                operationSuccessful: operationSuccessful
            });
            
            if (!operationSuccessful) {
                console.warn(`Toggle operation failed for ${contentType}, attempting force fix...`);
                if (finalIconText.includes('展开')) {
                    full.style.display = 'none';
                    preview.style.display = 'block';
                } else {
                    full.style.display = 'block';
                    preview.style.display = 'none';
                }
            }
        }, 100);
        
    } catch (error) {
        console.error('toggleLargeContent error:', error);
        console.error('Error stack:', error.stack);
    }
}

// 切换工具详情
function toggleTool(header) {
    try {
        const details = header.nextElementSibling;
        const toggle = header.querySelector('.tool-toggle');
        const toolCall = header.parentElement; // 获取整个工具容器
        
        // 调试信息
        const toolName = header.querySelector('.tool-name')?.textContent || 'Unknown';
        const toolId = toolCall?.id || 'Unknown ID';
        
        if (!details || !toggle) {
            console.error(`toggleTool failed for ${toolName} (${toolId}):`, { 
                details: !!details, 
                toggle: !!toggle,
                header: !!header,
                toolCall: !!toolCall
            });
            return;
        }
        
        // 更全面的状态检测方法
        const computedStyle = getComputedStyle(details);
        const currentInlineDisplay = details.style.display;
        const computedDisplay = computedStyle.display;
        
        // 根据切换按钮的文本来判断当前状态（这是最可靠的方法）
        const isCurrentlyExpanded = toggle.textContent.includes('收起');
        
        // 多重检测方法确保状态判断正确
        let isHidden;
        if (isCurrentlyExpanded) {
            // 如果按钮显示"收起"，说明当前是展开状态
            isHidden = false;
        } else {
            // 如果按钮显示"详情"，说明当前是收起状态
            isHidden = true;
        }
        
        // 额外的安全检查：如果display为none，强制认为是隐藏状态
        if (currentInlineDisplay === 'none' || computedDisplay === 'none') {
            isHidden = true;
        }
        
        console.log(`toggleTool for ${toolName} (${toolId}):`, {
            currentInlineStyle: currentInlineDisplay,
            computedDisplay: computedDisplay,
            toggleButtonText: toggle.textContent,
            isCurrentlyExpanded: isCurrentlyExpanded,
            finalIsHidden: isHidden,
            action: isHidden ? 'will expand' : 'will collapse'
        });
        
        // 特别处理问题工具调用
        if (toolId && toolId.includes('686e6f53d84378322bc2e27e')) {
            console.warn(`Special handling for problematic tool: ${toolId}`);
            // 强制重置状态
            details.style.display = '';
            details.style.visibility = '';
            details.removeAttribute('hidden');
        }
        
        if (isHidden) {
            // 展开操作
            details.style.display = 'block';
            details.style.visibility = 'visible';
            details.removeAttribute('hidden');
            toggle.textContent = '▲ 收起';
            if (toolCall) toolCall.classList.add('expanded');
            try {
                showShortcutHint();
            } catch (hintError) {
                console.warn('showShortcutHint error:', hintError);
            }
            console.log(`Expanded ${toolName} (${toolId})`);
        } else {
            // 收起操作
            details.style.display = 'none';
            details.style.visibility = 'hidden';
            toggle.textContent = '▼ 详情';
            if (toolCall) toolCall.classList.remove('expanded');
            console.log(`Collapsed ${toolName} (${toolId})`);
        }
        
        // 验证操作是否成功
        setTimeout(() => {
            const finalComputedStyle = getComputedStyle(details);
            const finalDisplay = finalComputedStyle.display;
            const finalToggleText = toggle.textContent;
            
            console.log(`Toggle verification for ${toolName} (${toolId}):`, {
                finalDisplay: finalDisplay,
                finalToggleText: finalToggleText,
                operationSuccessful: (finalDisplay === 'none') === finalToggleText.includes('详情')
            });
            
            // 如果操作失败，尝试强制修复
            if ((finalDisplay === 'none') !== finalToggleText.includes('详情')) {
                console.warn(`Toggle operation failed for ${toolName}, attempting force fix...`);
                if (finalToggleText.includes('详情')) {
                    details.style.display = 'none';
                } else {
                    details.style.display = 'block';
                }
            }
        }, 100);
        
    } catch (error) {
        console.error('toggleTool error:', error);
        console.error('Error stack:', error.stack);
    }
}

// 修复所有有问题的工具调用状态
function fixAllToolStates() {
    const allToolCalls = document.querySelectorAll('.tool-call');
    let fixedCount = 0;
    
    allToolCalls.forEach(toolCall => {
        const header = toolCall.querySelector('.tool-header');
        const details = toolCall.querySelector('.tool-details');
        const toggle = toolCall.querySelector('.tool-toggle');
        const toolName = toolCall.querySelector('.tool-name')?.textContent || 'Unknown';
        const toolId = toolCall.id;
        
        if (!header || !details || !toggle) return;
        
        // 检查状态是否不一致
        const computedDisplay = getComputedStyle(details).display;
        const toggleText = toggle.textContent;
        const shouldBeHidden = toggleText.includes('详情');
        const isActuallyHidden = computedDisplay === 'none';
        
        if (shouldBeHidden !== isActuallyHidden) {
            console.warn(`Found inconsistent state for ${toolName} (${toolId}):`, {
                shouldBeHidden,
                isActuallyHidden,
                toggleText,
                computedDisplay
            });
            
            // 修复状态
            if (shouldBeHidden) {
                details.style.display = 'none';
                details.style.visibility = 'hidden';
                toolCall.classList.remove('expanded');
            } else {
                details.style.display = 'block';
                details.style.visibility = 'visible';
                toolCall.classList.add('expanded');
            }
            fixedCount++;
        }
    });
    
    if (fixedCount > 0) {
        console.log(`Fixed ${fixedCount} tool state inconsistencies`);
    }
    
    return fixedCount;
}

// 修复所有有问题的内容块状态
function fixAllContentBlockStates() {
    const allContentBlocks = document.querySelectorAll('.large-content-block');
    let fixedCount = 0;
    
    allContentBlocks.forEach(block => {
        const header = block.querySelector('.content-header');
        const preview = block.querySelector('.content-preview');
        const full = block.querySelector('.content-full');
        const icon = block.querySelector('.toggle-icon');
        const contentType = block.querySelector('.content-type')?.textContent || 'Unknown';
        
        if (!header || !preview || !full || !icon) return;
        
        // 检查状态是否不一致
        const fullComputedDisplay = getComputedStyle(full).display;
        const previewComputedDisplay = getComputedStyle(preview).display;
        const iconText = icon.textContent;
        
        const shouldShowFull = iconText.includes('收起');
        const isFullActuallyShowing = fullComputedDisplay !== 'none';
        const isPreviewActuallyShowing = previewComputedDisplay !== 'none';
        
        // 检查状态是否一致
        const isInconsistent = (shouldShowFull !== isFullActuallyShowing) || 
                               (shouldShowFull === isPreviewActuallyShowing);
        
        if (isInconsistent) {
            console.warn(`Found inconsistent content block state for ${contentType}:`, {
                shouldShowFull,
                isFullActuallyShowing,
                isPreviewActuallyShowing,
                iconText,
                fullComputedDisplay,
                previewComputedDisplay
            });
            
            // 修复状态
            if (shouldShowFull) {
                // 应该显示完整内容
                full.style.display = 'block';
                preview.style.display = 'none';
                icon.textContent = '▲ 点击收起';
            } else {
                // 应该显示预览内容
                full.style.display = 'none';
                preview.style.display = 'block';
                icon.textContent = '▼ 点击展开';
            }
            fixedCount++;
        }
    });
    
    if (fixedCount > 0) {
        console.log(`Fixed ${fixedCount} content block state inconsistencies`);
    }
    
    return fixedCount;
}


// 全局状态跟踪详情是否展开或收起
let allDetailsExpanded = true;

// 切换所有详情（工具详情 + 回复详情）
function toggleAllDetails() {
    if (allDetailsExpanded) {
        // 收起所有详情
        const toolsClosed = closeAllToolDetails();
        const repliesClosed = closeAllReplyDetails();
        const totalClosed = toolsClosed + repliesClosed;
        
        if (totalClosed > 0) {
            showDetailedClosedNotification(toolsClosed, repliesClosed);
            allDetailsExpanded = false;
            updateToggleButton();
        }
    } else {
        // 展开所有详情
        const toolsOpened = expandAllToolDetails();
        const repliesOpened = expandAllReplyDetails();
        const totalOpened = toolsOpened + repliesOpened;
        
        if (totalOpened > 0) {
            showDetailedOpenedNotification(toolsOpened, repliesOpened);
            allDetailsExpanded = true;
            updateToggleButton();
        }
    }
}

// 收起所有详情（工具详情 + 回复详情）- 保持向后兼容性
function closeAllDetails() {
    const toolsClosed = closeAllToolDetails();
    const repliesClosed = closeAllReplyDetails();
    const totalClosed = toolsClosed + repliesClosed;
    
    if (totalClosed > 0) {
        showDetailedClosedNotification(toolsClosed, repliesClosed);
        allDetailsExpanded = false;
        updateToggleButton();
    }
}

// 搜索对话
function searchConversation(query) {
    const conversations = document.querySelectorAll('.conversation');
    
    if (!query.trim()) {
        conversations.forEach(conv => conv.style.display = 'block');
        return;
    }
    
    conversations.forEach(conv => {
        const content = conv.textContent.toLowerCase();
        if (content.includes(query.toLowerCase())) {
            conv.style.display = 'block';
        } else {
            conv.style.display = 'none';
        }
    });
}

// DOM加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded, initializing...');
    
    // 初始化主题 - 默认暗黑模式
    const savedTheme = localStorage.getItem('theme') || 'dark';
    const themeToggle = document.getElementById('themeToggle');
    
    if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        if (themeToggle) themeToggle.innerHTML = '☀️';
    } else {
        document.body.classList.remove('light-theme');
        if (themeToggle) themeToggle.innerHTML = '🌙';
        // 确保设置为暗黑模式
        localStorage.setItem('theme', 'dark');
    }
    
    // 添加快捷键监听
    document.addEventListener('keydown', handleKeydown);
    
    // 文件处理
    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
        fileInput.addEventListener('change', handleFile);
        console.log('File input listener added');
    } else {
        console.error('File input not found!');
    }
    
    // 拖拽上传
    const uploadArea = document.querySelector('.upload-area');
    if (uploadArea) {
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });
        console.log('Upload area listeners added');
    } else {
        console.error('Upload area not found!');
    }
});

// 处理文件选择
function handleFile(event) {
    console.log('handleFile called', event);
    const file = event.target.files[0];
    if (file) {
        console.log('File selected:', file.name, file.size);
        processFile(file);
    }
}

// 处理文件
function processFile(file) {
    console.log('processFile called with:', file.name);
    if (!file.name.endsWith('.jsonl')) {
        console.log('Invalid file type');
        showError('请选择 .jsonl 文件');
        return;
    }

    console.log('Starting to process file...');
    showLoading();
    
    const reader = new FileReader();
    reader.onload = function(e) {
        console.log('File reader onload triggered');
        try {
            const content = e.target.result;
            console.log('About to call parseJsonlContent...');
            parseJsonlContent(content);
            console.log('parseJsonlContent completed successfully');
        } catch (error) {
            console.error('Error in reader.onload:', error);
            showError('文件读取失败: ' + error.message);
        }
    };
    reader.readAsText(file);
}

// 生成助手文本HTML
function generateAssistantTextHTML(text) {
    // 判断内容长度，超过600字符认为是长内容
    const lines = text.split('\n');
    const isLongContent = text.length > 600;
    
    if (isLongContent) {
        // 长内容：默认折叠，显示预览
        const previewLength = Math.min(300, Math.floor(text.length * 0.1));
        const previewText = text.substring(0, previewLength);
        
        return `
            <div class="large-content-block">
                <div class="content-header" onclick="toggleLargeContent(this)">
                    <span class="content-type">回复内容</span>
                    <span class="content-info">(${lines.length} 行，${text.length} 字符)</span>
                    <span class="toggle-icon">▼ 点击展开</span>
                </div>
                <div class="content-preview" style="display: block;">${formatMarkdownSafely(previewText)}...</div>
                <div class="content-full" style="display: none;">${formatMarkdownSafely(text)}</div>
            </div>
        `;
    } else {
        // 短内容：默认展开，但可以收起到预览状态
        const previewLength = Math.min(150, Math.floor(text.length * 0.3));
        const previewText = text.substring(0, previewLength);
        
        return `
            <div class="large-content-block">
                <div class="content-header" onclick="toggleLargeContent(this)">
                    <span class="content-type">回复内容</span>
                    <span class="content-info">(${lines.length} 行，${text.length} 字符)</span>
                    <span class="toggle-icon">▲ 点击收起</span>
                </div>
                <div class="content-preview" style="display: none;">${formatMarkdownSafely(previewText)}...</div>
                <div class="content-full" style="display: block;">${formatMarkdownSafely(text)}</div>
            </div>
        `;
    }
}

// 生成工具HTML
function generateToolsHTML(tools, toolResults, turnIndex, partIndex) {
    if (!tools || tools.length === 0) return '';
    
    // 工具图标映射
    const toolIcons = {
        'Write': '📝', 'Read': '📖', 'Bash': '💻', 'Edit': '✏️',
        'LS': '📂', 'Grep': '🔍', 'TodoWrite': '📋', 'WebSearch': '🌐',
        'Task': '🔄', 'Glob': '🔍', 'MultiEdit': '📝', 'NotebookRead': '📓',
        'NotebookEdit': '📓', 'WebFetch': '🌐', 'TodoRead': '📋'
    };
    
    let toolsHTML = '<div class="tools-section">';
    
    // 先收集所有工具结果，建立ID映射
    const resultsByToolId = new Map();
    toolResults.forEach(result => {
        if (result.id) {
            resultsByToolId.set(result.id, result);
        }
    });
    
    tools.forEach((tool, toolIndex) => {
        const toolId = `tool-${turnIndex}-${partIndex}-${toolIndex}`;
        const toolName = tool.name || 'Unknown';
        const icon = toolIcons[toolName] || '🔧';
        
        // 查找对应的工具结果
        let result = resultsByToolId.get(tool.id);
        if (!result && toolResults[toolIndex]) {
            result = toolResults[toolIndex]; // 降级到索引匹配
        }
        
        toolsHTML += `
            <div class="tool-call" id="${toolId}">
                <div class="tool-header" onclick="toggleTool(this)">
                    <span class="tool-icon">${icon}</span>
                    <span class="tool-name">${toolName}</span>
                    ${result && result.content ? `<span class="result-indicator">有结果</span>` : ''}
                    <span class="tool-toggle">▼ 详情</span>
                </div>
                <div class="tool-details" style="display: none;">
                    ${generateToolParamsHTML(tool.input, toolId)}
                    ${result ? generateToolResultHTML(result, toolId) : ''}
                </div>
            </div>
        `;
    });
    
    toolsHTML += '</div>';
    return toolsHTML;
}

// 生成工具参数HTML
function generateToolParamsHTML(input, toolId) {
    let paramsHTML = '';
    
    // 显示关键参数
    const keyParams = ['file_path', 'command', 'pattern', 'content', 'query', 'old_string', 'new_string', 'path', 'description', 'prompt'];
    
    for (const key of keyParams) {
        if (input[key]) {
            let value = input[key];
            const isLongValue = typeof value === 'string' && value.length > 600;
            const paramId = `param-${toolId}-${key}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            
            // 参数也存储到Map中
            fullContentStorage.set(paramId, String(value));
            
            if (isLongValue) {
                // 长内容（>600字符），默认收起
                const displayValue = value.substring(0, 300) + "...";
                paramsHTML += `
                    <div class="param">
                        <span class="param-key">${key}:</span>
                        <div class="param-value param-collapsed" id="${paramId}">${escapeHtml(String(displayValue))}</div>
                        <button class="param-expand-btn" onclick="toggleParamContent('${paramId}')">展开</button>
                    </div>
                `;
            } else if (value.length > 200) {
                // 中等内容（200-600字符），默认展开，但可以收起
                paramsHTML += `
                    <div class="param">
                        <span class="param-key">${key}:</span>
                        <div class="param-value param-expanded" id="${paramId}">${escapeHtml(String(value))}</div>
                        <button class="param-expand-btn" onclick="toggleParamContent('${paramId}')">收起</button>
                    </div>
                `;
            } else {
                // 短内容（≤200字符），直接显示，无需按钮
                paramsHTML += `
                    <div class="param">
                        <span class="param-key">${key}:</span>
                        <div class="param-value">${escapeHtml(String(value))}</div>
                    </div>
                `;
            }
        }
    }
    
    // 如果没有关键参数，显示所有参数
    if (!paramsHTML) {
        Object.entries(input).forEach(([key, value], index) => {
            if (index < 3) { // 最多显示3个参数
                const paramId = `${toolId}-param-${index}`;
                let displayValue = '';
                let needsExpansion = false;
                
                if (typeof value === 'string') {
                    displayValue = value;
                    needsExpansion = value.length > 600;
                } else {
                    displayValue = JSON.stringify(value, null, 2);
                    needsExpansion = displayValue.length > 600;
                }
                
                fullContentStorage.set(paramId, displayValue);
                
                if (needsExpansion) {
                    // 长内容（>600字符），默认收起
                    const shortValue = displayValue.substring(0, 300) + '...';
                    
                    paramsHTML += `
                        <div class="param">
                            <span class="param-key">${key}:</span>
                            <div class="param-value param-collapsed" id="${paramId}">${escapeHtml(shortValue)}</div>
                            <button class="param-expand-btn" onclick="toggleParamContent('${paramId}')">展开</button>
                        </div>
                    `;
                } else if (displayValue.length > 200) {
                    // 中等内容（200-600字符），默认展开，但可以收起
                    paramsHTML += `
                        <div class="param">
                            <span class="param-key">${key}:</span>
                            <div class="param-value param-expanded" id="${paramId}">${escapeHtml(String(displayValue))}</div>
                            <button class="param-expand-btn" onclick="toggleParamContent('${paramId}')">收起</button>
                        </div>
                    `;
                } else {
                    // 短内容（≤200字符），直接显示，无需按钮
                    paramsHTML += `
                        <div class="param">
                            <span class="param-key">${key}:</span>
                            <div class="param-value">${escapeHtml(String(displayValue))}</div>
                        </div>
                    `;
                }
            }
        });
    }
    
    return paramsHTML;
}

// 切换对话显示
function toggleConversation(index) {
    const content = document.getElementById(`conversation-${index}`);
    const header = content.previousElementSibling;
    const arrow = header.querySelector('.conversation-arrow');
    
    if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        arrow.textContent = '▲ 收起';
    } else {
        content.classList.add('collapsed');
        arrow.textContent = '▼ 详情';
    }
}

// 显示二维码弹窗
function showQRCode() {
    const modal = document.getElementById('qrModal');
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden'; // 防止背景滚动
}

// 隐藏二维码弹窗
function hideQRCode() {
    const modal = document.getElementById('qrModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto'; // 恢复滚动
}
