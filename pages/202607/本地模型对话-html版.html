<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地模型对话 - 持久化会话+文件图片上传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f2f3f5;
        }
        /* 左侧会话栏 */
        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        #newChat {
            width: 100%;
            padding: 10px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #newChat:hover {
            background: #0958d9;
        }
        .chat-list {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover {
            background: #f5f7fa;
        }
        .chat-item.active {
            background: #e8f3ff;
            color: #1677ff;
        }
        /* 右侧主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #1677ff;
            color: #fff;
            margin-left: auto;
        }
        .bot-msg {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #333;
        }
        .thinking {
            color: #888;
            font-style: italic;
        }
        /* 附件预览区 */
        .attach-preview {
            padding: 0 20px 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .attach-item {
            position: relative;
            width: 80px;
            height: 80px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #f9f9f9;
        }
        .attach-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .attach-item .file-name {
            font-size: 10px;
            padding: 2px;
            text-align: center;
            overflow: hidden;
        }
        .attach-item .close {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: #ccc;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        /* 底部输入+上传栏 */
        .input-area {
            padding: 16px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        .tool-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tool-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 13px;
        }
        .tool-btn:hover {
            background: #eee;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        #inputText {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            min-height: 48px;
            resize: none;
        }
        #inputText:focus {
            border-color: #1677ff;
        }
        #sendBtn {
            padding: 0 20px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #sendBtn:disabled {
            background: #b3d1f8;
            cursor: not-allowed;
        }
        /* 隐藏原生文件输入 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 左侧会话列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button id="newChat">+ 新建会话</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- 右侧主界面 -->
    <div class="main">
        <div class="chat-box" id="chatBox"></div>
        <!-- 附件预览区 -->
        <div class="attach-preview" id="attachPreview"></div>

        <div class="input-area">
            <!-- 上传按钮栏 -->
            <div class="tool-bar">
                <label class="tool-btn" for="imgUpload">?? 上传图片</label>
                <input type="file" id="imgUpload" accept="image/*" multiple>

                <label class="tool-btn" for="fileUpload">?? 上传文件</label>
                <input type="file" id="fileUpload" multiple>
            </div>
            <!-- 输入发送栏 -->
            <div class="input-row">
                <textarea id="inputText" placeholder="输入问题，回车发送"></textarea>
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 模型配置（修改为你本地接口） ==========
        const API_URL = "http://localhost:11434/v1/chat/completions";
        const MODEL_NAME = "qwen:7b";
        const API_KEY = "sk-local";
        // 本地存储键名
        const STORAGE_KEY = "local_ai_chat_data";
        // ================================================

        // 全局数据
        let chatSessions = [];
        let currentSessionId = null;
        let attachList = [];

        // DOM 元素
        const chatListEl = document.getElementById('chatList');
        const chatBoxEl = document.getElementById('chatBox');
        const attachPreviewEl = document.getElementById('attachPreview');
        const inputEl = document.getElementById('inputText');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChat');
        const imgUpload = document.getElementById('imgUpload');
        const fileUpload = document.getElementById('fileUpload');

        // 页面加载：读取本地存储
        window.onload = function () {
            loadFromLocalStorage();
            initFirstChat();
            renderChatList();
            if(currentSessionId) switchSession(currentSessionId);
        };

        // 保存数据到本地存储
        function saveToLocalStorage() {
            const saveData = {
                chatSessions: chatSessions,
                currentSessionId: currentSessionId
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
        }

        // 从本地存储读取数据
        function loadFromLocalStorage() {
            const str = localStorage.getItem(STORAGE_KEY);
            if (!str) return;
            try {
                const data = JSON.parse(str);
                chatSessions = data.chatSessions || [];
                currentSessionId = data.currentSessionId;
            } catch (e) {
                console.log("读取历史会话失败，初始化空数据");
                chatSessions = [];
                currentSessionId = null;
            }
        }

        // 新建会话
        function createNewSession() {
            const sessionId = Date.now().toString();
            chatSessions.push({
                id: sessionId,
                title: "新会话",
                messages: []
            });
            switchSession(sessionId);
            renderChatList();
            saveToLocalStorage();
        }

        // 初始化首个会话
        function initFirstChat() {
            if (chatSessions.length === 0) createNewSession();
        }

        // 切换会话
        function switchSession(sessionId) {
            currentSessionId = sessionId;
            const session = chatSessions.find(s => s.id === sessionId);
            chatBoxEl.innerHTML = '';
            attachList = [];
            renderAttachPreview();
            session.messages.forEach(item => {
                addMsgToView(item.content, item.role);
            });
            renderChatList();
            saveToLocalStorage();
        }

        // 渲染会话列表
        function renderChatList() {
            chatListEl.innerHTML = '';
            chatSessions.forEach(session => {
                const item = document.createElement('div');
                item.className = `chat-item ${session.id === currentSessionId ? 'active' : ''}`;
                item.innerText = session.title;
                item.onclick = () => switchSession(session.id);
                chatListEl.appendChild(item);
            });
        }

        // 渲染附件预览
        function renderAttachPreview() {
            attachPreviewEl.innerHTML = '';
            attachList.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'attach-item';

                const close = document.createElement('span');
                close.className = 'close';
                close.innerText = '×';
                close.onclick = () => {
                    attachList.splice(idx, 1);
                    renderAttachPreview();
                };
                div.appendChild(close);

                if (item.type === 'image') {
                    const img = document.createElement('img');
                    img.src = item.dataUrl;
                    div.appendChild(img);
                } else {
                    const name = document.createElement('div');
                    name.className = 'file-name';
                    name.innerText = item.name;
                    div.appendChild(name);
                }
                attachPreviewEl.appendChild(div);
            });
        }

        // 选择图片
        function handleImageSelect(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                    attachList.push({
                        type: 'image',
                        name: file.name,
                        dataUrl: ev.target.result,
                        raw: file
                    });
                    renderAttachPreview();
                };
                reader.readAsDataURL(file);
            }
            imgUpload.value = '';
        }

        // 选择普通文件
        function handleFileSelect(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                    attachList.push({
                        type: 'file',
                        name: file.name,
                        content: ev.target.result,
                        raw: file
                    });
                    renderAttachPreview();
                };
                reader.readAsText(file);
            }
            fileUpload.value = '';
        }

        // 页面添加消息
        function addMsgToView(text, role) {
            const div = document.createElement('div');
            if (role === 'user') {
                div.className = 'message user-msg';
            } else if (role === 'assistant') {
                div.className = 'message bot-msg';
            } else {
                div.className = 'message bot-msg thinking';
            }
            div.innerText = text;
            chatBoxEl.appendChild(div);
            chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
            return div;
        }

        // 发送消息 + 附件
        async function sendMessage() {
            const content = inputEl.value.trim();
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (!content && attachList.length === 0) return;

            // 设置会话标题
            if (session.messages.length === 0) {
                session.title = content.substring(0, 12) + (content.length > 12 ? '...' : '');
                renderChatList();
            }

            // 拼接提问内容
            let fullPrompt = content + "\n\n";
            attachList.forEach(att => {
                if (att.type === 'file') {
                    fullPrompt += `【文件：${att.name}】\n${att.content}\n\n`;
                } else if (att.type === 'image') {
                    fullPrompt += `【已上传图片：${att.name}】\n`;
                }
            });

            // 存入会话
            const userMsg = { role: 'user', content: fullPrompt };
            session.messages.push(userMsg);
            addMsgToView(fullPrompt, 'user');

            // 清空输入和附件
            inputEl.value = '';
            attachList = [];
            renderAttachPreview();

            // 加载状态
            const loadingDom = addMsgToView("模型思考中...", "thinking");
            sendBtn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: session.messages,
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content || "模型无返回";

                chatBoxEl.removeChild(loadingDom);
                const botMsg = { role: 'assistant', content: reply };
                session.messages.push(botMsg);
                addMsgToView(reply, 'assistant');
                // 每次对话后自动保存
                saveToLocalStorage();
            } catch (err) {
                chatBoxEl.removeChild(loadingDom);
                addMsgToView(`请求失败：${err.message}`, "thinking");
            }

            sendBtn.disabled = false;
        }

        // 事件绑定
        newChatBtn.addEventListener('click', createNewSession);
        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        imgUpload.addEventListener('change', handleImageSelect);
        fileUpload.addEventListener('change', handleFileSelect);
    </script>
</body>
</html>
