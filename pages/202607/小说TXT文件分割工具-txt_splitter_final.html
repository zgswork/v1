<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说TXT文件分割工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
            background-color: #fafafa;
        }
        h1 {
            font-weight: 300;
            color: #000;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .btn {
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0077ed;
        }
        .btn-secondary {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .btn-secondary:hover {
            background-color: #e5e5e7;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 10px;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f5f5f7;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
        }
        .split-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .split-controls input {
            flex: 1;
            padding: 8px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
        }
        .download-section {
            margin-top: 20px;
            border-top: 1px solid #d2d2d7;
            padding-top: 20px;
        }
        .file-list {
            margin-top: 10px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小说TXT文件分割工具</h1>
        
        <div class="section">
            <label class="file-upload" for="fileInput">选择TXT文件</label>
            <input type="file" id="fileInput" accept=".txt">
            <div id="fileName"></div>
        </div>
        
        <div class="section">
            <textarea id="fileContent" placeholder="文件内容将显示在这里..."></textarea>
        </div>
        
        <div class="section">
            <h3>分割设置</h3>
            <div class="split-controls">
                <input type="number" id="episodesPerFile" placeholder="每文件包含集数" min="1">
            </div>
        </div>
        
        <div class="section">
            <button class="btn" onclick="splitFile()">分割文件</button>
        </div>
        
        <div class="download-section">
            <h3>下载选项</h3>
            <div id="fileList" class="file-list"></div>
            <button id="downloadAllBtn" class="btn" style="display: none;" onclick="downloadAll()">打包下载所有文件</button>
        </div>
    </div>

    <script>
        let fileContent = '';
        let splitFiles = [];
        
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('fileName').textContent = `已选择: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                fileContent = e.target.result;
                document.getElementById('fileContent').value = fileContent;
            };
            reader.readAsText(file);
        });
        
        function addSplitControl() {
            const div = document.createElement('div');
            div.className = 'split-controls';
            div.innerHTML = `
                <input type="text" placeholder="起始章节" class="start-chapter">
                <input type="text" placeholder="结束章节" class="end-chapter">
                <button class="btn btn-secondary" onclick="this.parentNode.remove()">-</button>
            `;
            document.getElementById('splitControls').appendChild(div);
        }
        
        function toggleSplitMethod() {
            const method = document.getElementById('splitMethod').value;
            document.getElementById('chapterSplitControls').style.display = 
                method === 'chapter' ? 'block' : 'none';
            document.getElementById('episodeSplitControls').style.display = 
                method === 'episode' ? 'block' : 'none';
        }
        
        function splitFile() {
            splitByEpisodes();
        }
        
        function splitByEpisodes() {
            if (!fileContent) {
                alert('请先上传文件');
                return;
            }
            
            const episodesPerFile = parseInt(document.getElementById('episodesPerFile').value);
            if (!episodesPerFile || episodesPerFile < 1) {
                alert('请输入有效的每文件集数');
                return;
            }
            
            // 改进的正则表达式，匹配更多集数格式
            const episodeRegex = /(?:^|\n)(第[\d零一二三四五六七八九十百千万]+集|第[\d零一二三四五六七八九十百千万]+章|Episode\s*\d+|[\d零一二三四五六七八九十百千万]+、)/gm;
            const episodes = [];
            let match;
            
            // 重置正则表达式状态
            episodeRegex.lastIndex = 0;
            
            while ((match = episodeRegex.exec(fileContent)) !== null) {
                episodes.push({
                    title: match[1],
                    startIndex: match.index,
                    endIndex: null
                });
            }
            
            if (episodes.length === 0) {
                alert('未找到集数标记，请确认文件格式是否正确');
                return;
            }
            
            // 设置每集的结束位置
            for (let i = 0; i < episodes.length; i++) {
                episodes[i].endIndex = i < episodes.length - 1 ? 
                    episodes[i+1].startIndex : fileContent.length;
            }
            
            splitFiles = [];
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            for (let i = 0; i < episodes.length; i += episodesPerFile) {
                const startEpisode = episodes[i];
                const endEpisode = episodes[Math.min(i + episodesPerFile - 1, episodes.length - 1)];
                
                const content = fileContent.substring(
                    startEpisode.startIndex,
                    endEpisode.endIndex
                );
                
                const fileName = `分割_${startEpisode.title}_至_${endEpisode.title}.txt`;
                splitFiles.push({ name: fileName, content: content });
                
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>${fileName}</span>
                    <button class="btn btn-secondary" onclick="downloadSingle('${fileName}')">下载</button>
                `;
                fileList.appendChild(fileItem);
            }
            
            document.getElementById('downloadAllBtn').style.display = 
                splitFiles.length > 1 ? 'block' : 'none';
        }
        
        function splitByChapters() {
            // 原有的按章节分割逻辑
            if (!fileContent) {
                alert('请先上传文件');
                return;
            }
            
            const controls = document.querySelectorAll('.split-controls');
            if (controls.length === 0) {
                alert('请添加至少一个分割范围');
                return;
            }
            
            splitFiles = [];
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            controls.forEach(control => {
                const start = control.querySelector('.start-chapter').value.trim();
                const end = control.querySelector('.end-chapter').value.trim();
                
                if (!start || !end) {
                    alert('请填写完整的起始和结束章节');
                    return;
                }
                
                const startIndex = fileContent.indexOf(start);
                const endIndex = fileContent.indexOf(end);
                
                if (startIndex === -1 || endIndex === -1) {
                    alert(`未找到章节 "${start}" 或 "${end}"`);
                    return;
                }
                
                const content = fileContent.substring(startIndex, endIndex + end.length);
                const fileName = `分割_${start}_至_${end}.txt`;
                
                splitFiles.push({ name: fileName, content: content });
                
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>${fileName}</span>
                    <button class="btn btn-secondary" onclick="downloadSingle('${fileName}')">下载</button>
                `;
                fileList.appendChild(fileItem);
            });
            
            if (splitFiles.length > 1) {
                document.getElementById('downloadAllBtn').style.display = 'block';
            } else {
                document.getElementById('downloadAllBtn').style.display = 'none';
            }
        }
        
        function downloadSingle(fileName) {
            const file = splitFiles.find(f => f.name === fileName);
            if (!file) return;
            
            const blob = new Blob([file.content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function downloadAll() {
            const zip = new JSZip();
            
            splitFiles.forEach(file => {
                zip.file(file.name, file.content);
            });
            
            zip.generateAsync({ type: 'blob' }).then(content => {
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = '分割文件包.zip';
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>

<div class="section">
    <h3>使用说明</h3>
    <div style="background-color: #f5f5f7; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <p>仅支持分割TXT文件。小说章节可识别以下格式：</p>
        <ul style="margin-top: 10px;">
            <li>"第1集"、"第01集"、"第一集"等中文数字格式</li>
            <li>"第1章"、"第一章"等章节格式</li>
            <li>"Episode 1"、"Episode1"等英文格式</li>
        </ul>
        <p style="margin-top: 10px; color: #ff453a;">注意：章节标记前后不可带有其他符号(如###等)</p>
    </div>
</div>
