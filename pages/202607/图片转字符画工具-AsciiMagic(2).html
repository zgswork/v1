<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转字符画工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(10, 15, 35, 0.85);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            margin-top: 20px;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 25px;
            color: #a0c8ff;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .control-panel {
            flex: 1;
            min-width: 300px;
            background: rgba(25, 35, 70, 0.8);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        
        .preview-panel {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #4facfe;
            border-bottom: 2px solid #4facfe;
            padding-bottom: 10px;
        }
        
        .upload-area {
            border: 3px dashed #4facfe;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            background: rgba(20, 30, 60, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            background: rgba(35, 45, 85, 0.7);
            border-color: #00f2fe;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #4facfe;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #c0d8ff;
        }
        
        .btn {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn i {
            font-size: 1.2rem;
        }
        
        .btn-upload {
            background: linear-gradient(to right, #4facfe, #3a7bd5);
        }
        
        .btn-download {
            background: linear-gradient(to right, #00c853, #0091ea);
        }
        
        .btn-download-image {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            margin-left: 10px;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #b0d0ff;
        }
        
        select, input[type="range"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(15, 25, 50, 0.8);
            border: 1px solid #35517a;
            color: #fff;
            font-size: 1rem;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border-radius: 4px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .preview-box {
            background: rgba(20, 30, 50, 0.9);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        
        .preview-header {
            background: rgba(30, 45, 90, 0.9);
            padding: 12px 20px;
            font-weight: 600;
            color: #4facfe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .preview-content {
            padding: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        #asciiArtContainer {
            background: #000;
            border-radius: 8px;
            overflow: auto;
            max-height: 600px; /* 增加最大高度以适应缩放 */
            width: 100%;
            padding: 15px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            /* 添加自定义滚动条样式 */
            scrollbar-width: thin;
            scrollbar-color: #4facfe #192346;
        }

        /* 添加滚动条样式优化 */
        #asciiArtContainer::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        #asciiArtContainer::-webkit-scrollbar-thumb {
            background-color: #4facfe;
            border-radius: 4px;
        }

        #asciiArtContainer::-webkit-scrollbar-track {
            background-color: #192346;
        }
        
        #asciiArt {
            white-space: pre;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            line-height: 8px;
            letter-spacing: 1px;
            color: #fff;
            margin: 0 auto;
            display: inline-block;
            text-align: left;
        }
        
        .hidden {
            display: none;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #8aa8d8;
        }
        
        .info-text {
            background: rgba(30, 45, 90, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #a0c8ff;
            border-left: 3px solid #4facfe;
        }
        
        .dimension-info {
            font-size: 0.9rem;
            color: #8aa8d8;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .preview-content {
                min-height: 150px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-image"></i> 图片转字符画工具</h1>
            <p class="subtitle">上传图片，自定义字符集和尺寸，生成独特的字符艺术作品</p>
        </header>
        
        <div class="app-container">
            <div class="control-panel">
                <h2 class="panel-title"><i class="fas fa-sliders-h"></i> 控制面板</h2>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <p class="upload-text">点击或拖放图片到此处</p>
                    <button class="btn btn-upload" id="uploadBtn">
                        <i class="fas fa-file-image"></i> 选择图片
                    </button>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                </div>
                
                <div class="control-group">
                    <label for="charsetSelect"><i class="fas fa-font"></i> 字符集:</label>
                    <select id="charsetSelect">
                        <option value="simple">简单: .:-=+*#%@</option>
                        <option value="medium" selected>中等: .'`^",:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$</option>
                        <option value="complex">复杂: @%#*+=-:. </option>
                        <option value="block">方块: ░▒▓█</option>
                        <option value="inverted">反相: @%#*+=-:. </option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="sizeSlider"><i class="fas fa-ruler"></i> 字符密度: <span id="sizeValue">80%</span></label>
                    <input type="range" id="sizeSlider" min="20" max="150" value="80">
                </div>
                
                <div class="control-group">
                    <label for="brightnessSlider"><i class="fas fa-sun"></i> 亮度: <span id="brightnessValue">100%</span></label>
                    <input type="range" id="brightnessSlider" min="50" max="150" value="100">
                </div>
                
                <div class="control-group">
                    <label for="contrastSlider"><i class="fas fa-adjust"></i> 对比度: <span id="contrastValue">100%</span></label>
                    <input type="range" id="contrastSlider" min="50" max="150" value="100">
                </div>

                <!-- 缩放控制滑块（请确保此代码已添加） -->
                <div class="control-group">
                    <label for="zoomSlider"><i class="fas fa-search-plus"></i> 预览缩放: <span id="zoomValue">100%</span></label>
                    <input type="range" id="zoomSlider" min="50" max="200" value="100">
                </div>

                <div class="btn-group">
                    <button class="btn btn-download" id="downloadTxtBtn">
                        <i class="fas fa-file-download"></i> 下载TXT
                    </button>
                    <button class="btn btn-download-image" id="downloadImageBtn">
                        <i class="fas fa-download"></i> 下载图片
                    </button>
                </div>
                
                <div class="info-text">
                    <p><i class="fas fa-lightbulb"></i> 提示：使用高对比度图片效果更佳，调整字符密度可控制字符画精细程度</p>
                </div>
            </div>
            
            <div class="preview-panel">
                <h2 class="panel-title"><i class="fas fa-eye"></i> 预览</h2>
                
                <div class="preview-container">
                    <div class="preview-box">
                        <div class="preview-header">
                            <span>原始图片</span>
                            <span id="originalDimensions" class="dimension-info">尺寸: -</span>
                        </div>
                        <div class="preview-content">
                            <img id="imagePreview" class="hidden">
                            <p id="uploadHint">上传图片后预览将显示在这里</p>
                        </div>
                    </div>
                    
                    <div class="preview-box">
                        <div class="preview-header">
                            <span>字符画效果</span>
                            <span id="asciiDimensions" class="dimension-info">尺寸: -</span>
                        </div>
                        <div class="preview-content">
                            <div id="asciiArtContainer">
                                <pre id="asciiArt">字符画生成后将显示在这里</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>使用HTML5 Canvas和JavaScript实现 | 字符画生成工具 © 2023</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const uploadBtn = document.getElementById('uploadBtn');
            const imagePreview = document.getElementById('imagePreview');
            const asciiArt = document.getElementById('asciiArt');
            const asciiArtContainer = document.getElementById('asciiArtContainer');
            const uploadHint = document.getElementById('uploadHint');
            const charsetSelect = document.getElementById('charsetSelect');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeValue = document.getElementById('sizeValue');
            const brightnessSlider = document.getElementById('brightnessSlider');
            const brightnessValue = document.getElementById('brightnessValue');
            const contrastSlider = document.getElementById('contrastSlider');
            const contrastValue = document.getElementById('contrastValue');
            const downloadTxtBtn = document.getElementById('downloadTxtBtn');
            const downloadImageBtn = document.getElementById('downloadImageBtn');
            const originalDimensions = document.getElementById('originalDimensions');
            const asciiDimensions = document.getElementById('asciiDimensions');
            
            // 字符集映射
            const charsets = {
                simple: ' .:-=+*#%@',
                medium: ` .'^\`",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$`,
                complex: '@%#*+=-:. ',
                block: ' ░▒▓█',
                inverted: '@%#*+=-:. '
            };
            
            let currentImage = null;
            let asciiCanvas = document.createElement('canvas');
            let asciiCtx = asciiCanvas.getContext('2d');
            
            // 上传按钮事件
            uploadBtn.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#00f2fe';
                uploadArea.style.backgroundColor = 'rgba(35, 45, 85, 0.7)';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#4facfe';
                uploadArea.style.backgroundColor = 'rgba(20, 30, 60, 0.5)';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#4facfe';
                uploadArea.style.backgroundColor = 'rgba(20, 30, 60, 0.5)';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleImageUpload();
                }
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', handleImageUpload);
            
            // 滑块事件
            sizeSlider.addEventListener('input', () => {
                sizeValue.textContent = `${sizeSlider.value}%`;
                if (currentImage) generateAsciiArt(currentImage);
            });
            
            brightnessSlider.addEventListener('input', () => {
                brightnessValue.textContent = `${brightnessSlider.value}%`;
                if (currentImage) generateAsciiArt(currentImage);
            });
            
            contrastSlider.addEventListener('input', () => {
                contrastValue.textContent = `${contrastSlider.value}%`;
                if (currentImage) generateAsciiArt(currentImage);
            });
            
            // 字符集选择事件
            charsetSelect.addEventListener('change', () => {
                if (currentImage) generateAsciiArt(currentImage);
            });
            
            // 下载按钮事件
            downloadTxtBtn.addEventListener('click', downloadAsciiTxt);
            downloadImageBtn.addEventListener('click', downloadAsciiImage);
            
            // 处理图片上传
            function handleImageUpload() {
                if (!fileInput.files || !fileInput.files[0]) return;
                
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        imagePreview.src = e.target.result;
                        imagePreview.classList.remove('hidden');
                        uploadHint.classList.add('hidden');
                        originalDimensions.textContent = `尺寸: ${img.width}×${img.height} 像素`;
                        generateAsciiArt(img);
                    };
                    img.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 生成字符画
            function generateAsciiArt(img) {
                // 获取设置
                const density = parseInt(sizeSlider.value) / 100;
                const brightness = parseInt(brightnessSlider.value) / 100;
                const contrast = parseInt(contrastSlider.value) / 100;
                const charsetKey = charsetSelect.value;
                const charset = charsets[charsetKey];
                
                // 创建Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 计算新尺寸（基于密度）
                const width = Math.floor(img.width * density);
                const height = Math.floor(img.height * density * 0.5); // 考虑字符高宽比
                
                canvas.width = width;
                canvas.height = height;
                
                // 绘制图像到Canvas
                ctx.drawImage(img, 0, 0, width, height);
                
                // 获取图像数据
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                // 生成字符画
                let ascii = '';
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        
                        // 计算亮度（应用亮度和对比度调整）
                        let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        gray = Math.min(255, Math.max(0, (gray - 128) * contrast + 128));
                        gray = Math.min(255, Math.max(0, gray * brightness));
                        
                        // 反转某些字符集的亮度
                        const invert = charsetKey === 'inverted';
                        const normalizedGray = invert ? 255 - gray : gray;
                        
                        // 映射到字符集
                        const charIndex = Math.floor(normalizedGray / 255 * (charset.length - 1));
                        ascii += charset.charAt(charIndex);
                    }
                    ascii += '\n';
                }
                
                // 显示字符画
                asciiArt.textContent = ascii;
                asciiArt.style.fontSize = `${Math.max(4, Math.min(12, 10 / density))}px`;
                asciiDimensions.textContent = `尺寸: ${width}×${height} 字符`;
                
                // 创建字符画图片
                createAsciiImage(ascii, width, height, density);
            }
            
            // 创建字符画图片
            function createAsciiImage(ascii, width, height, density) {
                // 设置画布尺寸
                const fontSize = Math.max(4, Math.min(12, 10 / density));
                asciiCanvas.width = width * fontSize * 0.6;
                asciiCanvas.height = height * fontSize * 1.2;
                
                // 清除画布
                asciiCtx.fillStyle = '#000';
                asciiCtx.fillRect(0, 0, asciiCanvas.width, asciiCanvas.height);
                
                // 设置字体样式
                asciiCtx.font = `${fontSize}px 'Courier New', monospace`;
                asciiCtx.fillStyle = '#fff';
                asciiCtx.textBaseline = 'top';
                
                // 绘制字符画
                const lines = ascii.split('\n');
                for (let y = 0; y < lines.length; y++) {
                    asciiCtx.fillText(lines[y], 0, y * fontSize * 1.2);
                }
            }
            
            // 下载字符画文本
            function downloadAsciiTxt() {
                if (!asciiArt.textContent || asciiArt.textContent === '字符画生成后将显示在这里') {
                    alert('请先生成字符画！');
                    return;
                }
                
                const blob = new Blob([asciiArt.textContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = '字符画.txt';
                document.body.appendChild(a);
                a.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            }
            
            // 下载字符画图片
            function downloadAsciiImage() {
                if (!currentImage) {
                    alert('请先生成字符画！');
                    return;
                }
                
                const url = asciiCanvas.toDataURL('image/png');
                
                const a = document.createElement('a');
                a.href = url;
                a.download = '字符画.png';
                document.body.appendChild(a);
                a.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(a);
                }, 100);
            }
            
            // 初始示例
            const sampleImage = new Image();
            sampleImage.onload = function() {
                currentImage = sampleImage;
                imagePreview.src = sampleImage.src;
                imagePreview.classList.remove('hidden');
                uploadHint.classList.add('hidden');
                originalDimensions.textContent = `尺寸: ${sampleImage.width}×${sampleImage.height} 像素`;
                generateAsciiArt(sampleImage);
            };
            sampleImage.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMDA3Y2I3Ii8+PHRleHQgeD0iMTAwIiB5PSIxMDAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPlBpY3R1cmUgVG8gQXNjaWkgQ29udmVydGVyPC90ZXh0Pjwvc3ZnPg==';
        });
    </script>
