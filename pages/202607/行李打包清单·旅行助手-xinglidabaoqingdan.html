          appState = {
            version: 2,
            lists: [{ id: newListId, name: DEFAULT_LIST_NAME, categories: baseCategories }],
            currentListId: newListId,
            settings: { milestoneEnabled: true }
          };
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(appState));
        }
        // 同步 categories
        const current = appState.lists.find(l => l.id === appState.currentListId) || appState.lists[0];
        categories = current?.categories || cloneDefaults();
        return categories;
      } catch (err) {
        console.warn('读取本地数据失败，使用默认数据', err);
        const newListId = `list-${Date.now().toString(36)}`;
        appState = {
          version: 2,
          lists: [{ id: newListId, name: DEFAULT_LIST_NAME, categories: cloneDefaults() }],
          currentListId: newListId,
          settings: { milestoneEnabled: true }
        };
        localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(appState));
        categories = appState.lists[0].categories;
        return categories;
      }
    };

    const saveData = () => {
      try {
        if (appState) {
          const current = appState.lists.find(l => l.id === appState.currentListId);
          if (current) current.categories = categories;
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(appState));
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(categories));
        }
      } catch (err) {
        console.warn('保存本地数据失败', err);
      }
      // TODO: 预留接口 - 将本地数据与云端账户进行同步（如登录后触发同步）
    };


    // ========= 进度计算 =========
    const computeProgress = () => {
      let total = 0;
      let packed = 0;
      for (const cat of categories) {
        for (const item of cat.items) {
          total += 1;
          if (item.packed) packed += 1;
        }
      }
      const percent = total === 0 ? 0 : Math.round((packed / total) * 100);
      return { total, packed, percent };
    };

    const updateProgressUI = () => {
      const { total, packed, percent } = computeProgress();
      const ring = $('#progressRing');
      const text = $('#progressText');
      const count = $('#progressCount');
      if (!ring || !text || !count) return; // 提前返回，避免空指针
      ring.style.setProperty('--p', `${percent}%`);
      text.textContent = `${percent}%`;
      count.textContent = `已打包 ${packed}/${total}`;
      
      // 新增：检测是否触发庆祝动画
      evaluateCelebration(percent);
      // 新增：里程碑微反馈
      evaluateMilestones(percent);
    };

    // 新增：触发庆祝动画（生成彩带并淡入/淡出覆盖层）
    const triggerCelebration = () => {
      const overlay = $('#celebrateOverlay');
      const bucket = $('#confettiBucket');
      if (!overlay || !bucket) return;

      bucket.innerHTML = '';
      const COLORS = ['#3498db', '#f1c40f', '#e67e22', '#e74c3c', '#2ecc71', '#9b59b6', '#1abc9c'];
      const COUNT = 120;
      for (let i = 0; i < COUNT; i += 1) {
        const piece = document.createElement('i');
        piece.className = 'confetti';
        const left = Math.random() * 100; // 0-100vw
        const sizeW = 6 + Math.random() * 7;  // 6-13px
        const sizeH = 8 + Math.random() * 10; // 8-18px
        const rot = Math.floor(Math.random() * 360) + 'deg';
        const delay = (Math.random() * 0.8).toFixed(2) + 's';
        const duration = (2.5 + Math.random() * 2).toFixed(2) + 's';
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        piece.style.left = left + 'vw';
        piece.style.width = sizeW + 'px';
        piece.style.height = sizeH + 'px';
        piece.style.background = color;
        piece.style.setProperty('--rot', rot);
        piece.style.setProperty('--delay', delay);
        piece.style.setProperty('--dur', duration);
        bucket.appendChild(piece);
      }

      overlay.classList.remove('hidden');
      // 使用双帧确保过渡生效
      requestAnimationFrame(() => {
        overlay.classList.remove('opacity-0');
        overlay.classList.add('opacity-100');
      });

      // 3.8 秒后淡出并清理
      setTimeout(() => {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        setTimeout(() => {
          overlay.classList.add('hidden');
          bucket.innerHTML = '';
        }, 550);
      }, 3800);
    };

    // 新增：根据进度百分比判断是否需要触发/重置庆祝状态
    const evaluateCelebration = (percent) => {
      if (percent === 100 && !hasCelebrated) {
        hasCelebrated = true;
        triggerCelebration();
        return;
      }
      if (percent < 100 && hasCelebrated) {
        // 当进度回落后，允许下一次再次触发庆祝
        hasCelebrated = false;
      }
    };

    // ========= 视图渲染 =========
    const itemTemplate = (catId, item) => {
      // 勾选状态对应的样式
      const labelPacked = item.packed ? 'bg-[#ecf0f1]' : '';
      const textPacked = item.packed ? 'line-through text-gray-500' : 'text-gray-700';
      const checked = item.packed ? 'checked' : '';
      const inputId = `${catId}-${item.id}`;
      return `
        <li data-item-id="${item.id}" class="group">
          <label for="${inputId}" class="flex items-center gap-3 p-2 rounded-lg border border-gray-200 transition-colors duration-200 cursor-pointer hover:bg-gray-50 ${labelPacked}">
            <input id="${inputId}" type="checkbox" ${checked}
                   class="h-5 w-5 rounded border-gray-300 text-primary focus:ring-primary focus:outline-none" />
            <span class="flex-1 ${textPacked}">${item.name}</span>
          </label>
        </li>
      `;
    };

    const renderCategories = () => {
      const container = $('#categoriesContainer');
      if (!container) return;
      container.innerHTML = '';
      for (const cat of categories) {
        const card = document.createElement('section');
        card.className = 'bg-white rounded-2xl shadow-card border border-blue-100/60 p-4 sm:p-5';
        card.setAttribute('aria-label', cat.name);

        // 标题
        const header = document.createElement('div');
        header.className = 'mb-3 flex items-center justify-between';
        header.innerHTML = `
          <h3 class="text-base sm:text-lg font-semibold text-gray-900">${cat.name}</h3>
          <span class="text-xs text-gray-400">共 ${cat.items.length} 项</span>
        `;

        // 列表
        const listWrapper = document.createElement('div');
        listWrapper.className = 'mt-1';
        listWrapper.innerHTML = `
          <ul data-cat-id="${cat.id}" class="space-y-2">
            ${cat.items.map(item => itemTemplate(cat.id, item)).join('')}
          </ul>
        `;

        card.appendChild(header);
        card.appendChild(listWrapper);
        container.appendChild(card);
      }
    };

    const renderCategoryOptions = () => {
      const select = $('#addCategory');
      if (!select) return;
      select.innerHTML = categories
        .map(cat => `<option value="${cat.id}">${cat.name}</option>`) 
        .join('');
    };

    const render = () => {
      renderCategories();
      renderCategoryOptions();
      updateProgressUI();
    };

    // ========= 交互逻辑 =========
    const handleCheckboxChange = (evt) => {
      const target = evt.target;
      if (!(target instanceof HTMLInputElement) || target.type !== 'checkbox') return; // 提前返回
      const li = target.closest('li');
      const ul = target.closest('ul');
      if (!li || !ul) return;
      const catId = ul.getAttribute('data-cat-id');
      const itemId = li.getAttribute('data-item-id');
      if (!catId || !itemId) return;

      // 更新数据
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;
      const item = cat.items.find(i => i.id === itemId);
      if (!item) return;
      item.packed = target.checked;
      saveData();

      // 更新视觉样式（不整卡刷新，提升体验）
      const label = li.querySelector('label');
      const nameSpan = li.querySelector('span');
      if (label && nameSpan) {
        label.classList.toggle('bg-[#ecf0f1]', item.packed);
        nameSpan.classList.toggle('line-through', item.packed);
        nameSpan.classList.toggle('text-gray-500', item.packed);
        nameSpan.classList.toggle('text-gray-700', !item.packed);
      }

      // 进度更新
      updateProgressUI();
    };

    const uniqueId = () => `u-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

    const handleAddSubmit = (evt) => {
      evt.preventDefault();
      const select = $('#addCategory');
      const input = $('#addName');
      if (!select || !input) return;

      const catId = select.value;
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return; // 提前返回：不允许空名称
      }

      const cat = categories.find(c => c.id === catId);
      if (!cat) return;

      const newItem = { id: uniqueId(), name, packed: false };
      cat.items.push(newItem);
      saveData();

      // 仅对目标分类列表追加，避免整页重绘
      const ul = document.querySelector(`ul[data-cat-id="${catId}"]`);
      if (ul) {
        ul.insertAdjacentHTML('beforeend', itemTemplate(catId, newItem));
        // 添加后的视觉强调（短暂高亮）
        const lastLi = ul.lastElementChild;
        if (lastLi) {
          const label = lastLi.querySelector('label');
          label?.classList.add('ring-2', 'ring-primary');
          setTimeout(() => label?.classList.remove('ring-2', 'ring-primary'), 600);
        }
        // 更新分类标题数量
        const card = ul.closest('section');
        const counter = card?.querySelector('span.text-xs.text-gray-400');
        if (counter) {
          const current = cat.items.length;
          counter.textContent = `共 ${current} 项`;
        }
      }

      updateProgressUI();
      input.value = '';
      input.focus();
    };

    const handleResetAll = () => {
      let changed = false;
      for (const cat of categories) {
        for (const item of cat.items) {
          if (item.packed) {
            item.packed = false;
            changed = true;
          }
        }
      }
      if (!changed) return; // 无需更新
      saveData();
      // 统一刷新视图（更简单）
      render();
    };

    // ========= 初始化 =========
    const init = () => {
      categories = loadData();
      render();

      // 事件绑定
      const container = $('#categoriesContainer');
      container?.addEventListener('change', handleCheckboxChange);

      const addForm = $('#addForm');
      addForm?.addEventListener('submit', handleAddSubmit);

      const resetBtn = $('#handleResetAll');
      resetBtn?.addEventListener('click', handleResetAll);

      // 页脚年份
      const y = $('#year');
      if (y) y.textContent = new Date().getFullYear();

      // 模板切换（无需新建清单）
      const tplSel = $('#templateSwitcher');
      tplSel?.addEventListener('change', (e) => {
        const key = e.target.value;
        if (!key) return;
        applyTemplateToCurrentList(key);
      });

      // 无障碍：添加按钮键盘回车触发
      const addBtn = $('#addButton');
      addBtn?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          addForm?.requestSubmit();
        }
      });

      // 顶部导入/导出
      const btnExport = $('#btnExport');
      btnExport?.addEventListener('click', exportListsJSON);

      const btnImport = $('#btnImport');
      const inputImport = $('#importInput');
      btnImport?.addEventListener('click', () => inputImport?.click());
      inputImport?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const obj = JSON.parse(text);
          importListsJSON(obj);
        } catch (e) {
          console.warn('导入失败：无法解析文件', e);
        } finally {
          e.target.value = '';
        }
      });

      // 里程碑提示控制
      $('#closeMilestoneToast')?.addEventListener('click', () => {
        const toast = $('#milestoneToast');
        toast?.classList.add('opacity-0');
        setTimeout(() => toast?.classList.add('hidden'), 200);
      });
      $('#disableMilestone')?.addEventListener('click', () => {
        if (!appState) return;
        appState.settings = appState.settings || {};
        appState.settings.milestoneEnabled = false;
        saveData();
        const toast = $('#milestoneToast');
        toast?.classList.add('opacity-0');
        setTimeout(() => toast?.classList.add('hidden'), 200);
      });
    };

    // ========= 多清单核心 =========
    const setCurrentList = (listId) => {
      if (!appState) return;
      const exists = appState.lists.some(l => l.id === listId);
      if (!exists) return;
      appState.currentListId = listId;
      const current = appState.lists.find(l => l.id === listId);
      categories = current?.categories || cloneDefaults();
      hasCelebrated = false; // 切换清单时重置庆祝状态
      milestoneShown = { 25: false, 50: false, 75: false };
      saveData();
      render();
    };

    const createList = (name, templateKey = 'default') => {
      if (!appState) return;
      const finalName = name || `${DEFAULT_LIST_NAME} ${appState.lists.length + 1}`;
      const id = `list-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,5)}`;
      const tplBuilder = TEMPLATES[templateKey] || TEMPLATES.default;
      const newCategories = tplBuilder();
      appState.lists.push({ id, name: finalName, categories: newCategories });
      appState.currentListId = id;
      categories = newCategories;
      hasCelebrated = false;
      milestoneShown = { 25: false, 50: false, 75: false };
      saveData();
      render();
    };

    const applyTemplateToCurrentList = (templateKey) => {
      if (!appState) return;
      const tplBuilder = TEMPLATES[templateKey] || TEMPLATES.default;

      let newCategories = [];
      if (templateKey === 'default') {
        // 默认模板：仅基础分类
        newCategories = cloneDefaults();
      } else {
        // 其它模板：基础分类 + 特定分类，并对重复ID去重处理
        const base = cloneDefaults();
        const specifics = tplBuilder();
        const baseIds = new Set(base.map(c => c.id));
        const mergedSpecifics = specifics.map(c => {
          if (baseIds.has(c.id)) {
            // 避免与基础分类ID冲突，追加后缀并在名称标注“特定”
            const newId = `${c.id}-${templateKey}`;
            const newName = c.name.includes('（特定）') ? c.name : `${c.name}（特定）`;
            return { ...c, id: newId, name: newName };
          }
          return c;
        });
        newCategories = [...base, ...mergedSpecifics];
      }

      const current = appState.lists.find(l => l.id === appState.currentListId);
      if (!current) return;
      current.categories = newCategories;
      categories = newCategories;
      // 重置进度状态
      hasCelebrated = false;
      milestoneShown = { 25: false, 50: false, 75: false };
      saveData();
      render();
    };

    // ========= 导入 / 导出 =========
    const exportListsJSON = () => {
      if (!appState) return;
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0,10);
      a.download = `packing-lists-${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const importListsJSON = (obj) => {
      try {
        if (!obj || obj.version !== 2 || !Array.isArray(obj.lists)) {
          console.warn('导入 JSON 结构不符合 v2 标准');
          return;
        }
        appState = obj;
        const current = appState.lists.find(l => l.id === appState.currentListId) || appState.lists[0];
        appState.currentListId = current.id;
        categories = current.categories;
        hasCelebrated = false;
        milestoneShown = { 25: false, 50: false, 75: false };
        saveData();
        render();
      } catch (e) {
        console.warn('导入异常', e);
      }
    };

    // ========= 里程碑微反馈 =========
    const showMilestoneToast = (msg) => {
      const toast = $('#milestoneToast');
      const text = $('#milestoneMessage');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.remove('hidden');
      requestAnimationFrame(() => toast.classList.remove('opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.classList.add('hidden'), 250);
      }, 1800);
    };

    const evaluateMilestones = (percent) => {
      if (!appState) return;
      const enabled = appState.settings?.milestoneEnabled !== false;
      if (!enabled) return;
      for (const m of MILESTONES) {
        if (percent >= m && !milestoneShown[m]) {
          milestoneShown[m] = true;
          showMilestoneToast(`已完成 ${m}%`);
        }
        if (percent < m && milestoneShown[m]) {
          milestoneShown[m] = false; // 回退后允许再次触发
        }
      }
    };

    // 启动应用
    init();
  </script>
