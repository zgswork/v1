<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭任务轮盘 - 让家务更轻松</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f9f7fe 0%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 30px;
            margin: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0 30px;
        }
        
        h1 {
            color: #5c6bc0;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #7e8caf;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 20px 0;
        }
        
        .wheel-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .wheel-container {
            position: relative;
            width: 450px;
            height: 450px;
            margin: 20px auto;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            background: #f5f7ff;
            border: 10px solid #e0e7ff;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .wheel-section-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .wheel-section-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .wheel-section-item.glow-active {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            border: 3px solid rgba(255, 215, 0, 0.8);
        }
        
        .wheel-section-item.selected-final {
            transform: scale(1.1);
            border: 4px solid #ff6b35;
            box-shadow: 
                0 0 40px rgba(255, 107, 53, 0.8),
                0 0 60px rgba(255, 107, 53, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            animation: selectedPulse 1s ease-in-out infinite alternate;
        }
        
        .glow-effect {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 18px;
            background: linear-gradient(45deg, 
                rgba(255, 215, 0, 0.6), 
                rgba(255, 255, 255, 0.8), 
                rgba(255, 215, 0, 0.6));
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.8),
                0 0 50px rgba(255, 215, 0, 0.4);
            animation: glowPulse 0.3s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 5;
        }
        
        .glow-effect.final-glow {
            background: linear-gradient(45deg, 
                rgba(255, 107, 53, 0.7), 
                rgba(255, 255, 255, 0.9), 
                rgba(255, 107, 53, 0.7));
            box-shadow: 
                0 0 35px rgba(255, 107, 53, 0.9),
                0 0 70px rgba(255, 107, 53, 0.5);
            animation: finalGlowPulse 0.8s ease-in-out infinite alternate;
        }
        
        @keyframes glowPulse {
            0% {
                opacity: 0.8;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }
        
        @keyframes finalGlowPulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        
        @keyframes selectedPulse {
            0% {
                box-shadow: 
                    0 0 40px rgba(255, 107, 53, 0.8),
                    0 0 60px rgba(255, 107, 53, 0.5);
            }
            100% {
                box-shadow: 
                    0 0 50px rgba(255, 107, 53, 1),
                    0 0 80px rgba(255, 107, 53, 0.7);
            }
        }
        
        .wheel-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
            z-index: 2;
            position: relative;
        }
        
        .wheel-text i {
            font-size: 1.5em;
            margin-bottom: 8px;
        }
        
        .glow-effect {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out;
            border-radius: 15px;
            z-index: 3;
        }
        
        @keyframes glowPulse {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1); }
        }
        
        .spin-button {
            background: linear-gradient(to right, #5c6bc0, #7986cb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(92, 107, 192, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(92, 107, 192, 0.6);
        }
        
        .spin-button:active {
            transform: translateY(1px);
        }
        
        .spin-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 9宫格布局不需要指针 */
        
        .result-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .result-card {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .result-title {
            font-size: 1.5rem;
            color: #5c6bc0;
            margin-bottom: 20px;
        }
        
        .result-content {
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        
        .task-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .assigned-to {
            font-size: 1.3rem;
            margin-top: 10px;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        
        .child-task {
            background: rgba(255, 217, 102, 0.3);
            color: #e65100;
        }
        
        .husband-task {
            background: rgba(100, 181, 246, 0.3);
            color: #0d47a1;
        }
        
        .common-task {
            background: rgba(174, 213, 129, 0.3);
            color: #33691e;
        }
        
        .history-section {
            width: 100%;
            margin-top: 20px;
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #5c6bc0;
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }
        
        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .history-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            border-left: 4px solid #5c6bc0;
        }
        
        .history-icon {
            font-size: 1.8rem;
            margin-right: 15px;
            width: 50px;
            text-align: center;
            color: #ff6b6b;
        }
        
        .history-details {
            flex: 1;
        }
        
        .history-task {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .history-assignee {
            font-size: 0.9rem;
            color: #7e8caf;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            min-width: 200px;
            margin: 10px;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #5c6bc0;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #7e8caf;
            font-size: 1.1rem;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-btn {
            background: #e0e7ff;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: #d0d9ff;
            transform: translateY(-2px);
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #7e8caf;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #eee;
            width: 100%;
        }
        
        .task-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .task-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        
        .task-modal.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            color: #5c6bc0;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7e8caf;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5c6bc0;
            font-weight: 500;
        }
        
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #5c6bc0;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #5c6bc0;
            color: white;
        }
        
        .btn-secondary {
            background: #e0e7ff;
            color: #5c6bc0;
        }
        
        .btn-primary:hover {
            background: #3f51b5;
        }
        
        .btn-secondary:hover {
            background: #d0d9ff;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .wheel-container {
                width: 280px;
                height: 280px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-home"></i> 家庭任务轮盘</h1>
            <p class="subtitle">让家务分配变得有趣又公平！轻轻一转，家务任务随机分配给孩子和丈夫，培养责任感，增进家庭和谐</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">本月完成家务</div>
                <div class="stat-value">87</div>
                <div>次任务</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">孩子参与率</div>
                <div class="stat-value">78%</div>
                <div>比上月 ↑12%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">丈夫参与率</div>
                <div class="stat-value">65%</div>
                <div>比上月 ↑8%</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="wheel" id="wheel">
                        <!-- 9宫格任务由JS生成 -->
                    </div>
                </div>
                <button class="spin-button" id="spinBtn">
                    <i class="fas fa-magic"></i> 分配家务
                </button>
                
                <div class="controls">
                    <button class="control-btn" id="addTaskBtn">
                        <i class="fas fa-plus"></i> 添加自定义任务
                    </button>
                    <button class="control-btn" id="resetBtn">
                        <i class="fas fa-sync-alt"></i> 重置任务
                    </button>
                </div>
            </div>
            
            <div class="result-section">
                <div class="result-card">
                    <div class="result-title">本次分配结果</div>
                    <div class="result-content" id="result">
                        <i class="fas fa-arrow-circle-down task-icon"></i>
                        <span>点击旋转按钮开始分配</span>
                    </div>
                </div>
                
                <div class="result-card">
                    <div class="result-title">本周家务冠军</div>
                    <div class="result-content">
                        <i class="fas fa-trophy task-icon" style="color:gold;"></i>
                        <div>小明</div>
                        <div style="font-size:1.2rem; margin-top:10px;">已完成12项任务</div>
                        <div class="assigned-to child-task">孩子组</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="history-section">
            <h2 class="section-title"><i class="fas fa-history"></i> 最近分配记录</h2>
            <div class="history-list" id="historyList">
                <!-- 历史记录由JS生成 -->
            </div>
        </div>
        
        <footer>
            <p>家务分配轮盘 - 让家庭更和谐 | 已帮助2,341个家庭分配家务</p>
            <p>孩子参与家务可培养责任感，丈夫参与家务增进夫妻感情</p>
        </footer>
    </div>
    
    <div class="task-modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> 添加新任务</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="form-group">
                <label for="taskName">任务名称</label>
                <input type="text" id="taskName" placeholder="输入任务名称">
            </div>
            <div class="form-group">
                <label for="taskType">任务类型</label>
                <select id="taskType">
                    <option value="child">孩子任务</option>
                    <option value="husband">丈夫任务</option>
                    <option value="common">共同任务</option>
                </select>
            </div>
            <div class="form-group">
                <label for="taskIcon">选择图标</label>
                <select id="taskIcon">
                    <option value="fa-utensils">餐具</option>
                    <option value="fa-trash">倒垃圾</option>
                    <option value="fa-broom">扫地</option>
                    <option value="fa-bed">整理床铺</option>
                    <option value="fa-tshirt">收衣服</option>
                    <option value="fa-paw">喂宠物</option>
                    <option value="fa-gamepad">整理玩具</option>
                    <option value="fa-car">洗车</option>
                </select>
            </div>
            <div class="form-group">
                <label for="taskColor">选择颜色</label>
                <input type="color" id="taskColor" value="#5c6bc0">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" id="cancelBtn">取消</button>
                <button class="modal-btn btn-primary" id="saveTaskBtn">保存任务</button>
            </div>
        </div>
    </div>
    
    <script>
        // 任务数据
        const tasks = [
            { name: "摆碗筷", type: "child", icon: "fa-utensils", color: "#FFD700" },
            { name: "浇花", type: "child", icon: "fa-seedling", color: "#32CD32" },
            { name: "叠袜子", type: "child", icon: "fa-socks", color: "#00BFFF" },
            { name: "整理玩具", type: "child", icon: "fa-gamepad", color: "#FF6347" },
            { name: "喂宠物", type: "child", icon: "fa-paw", color: "#9370DB" },
            { name: "倒垃圾", type: "husband", icon: "fa-trash-alt", color: "#8B4513" },
            { name: "换床单", type: "husband", icon: "fa-bed", color: "#FF69B4" },
            { name: "洗碗", type: "common", icon: "fa-hand-sparkles", color: "#20B2AA" },
            { name: "收衣服", type: "common", icon: "fa-tshirt", color: "#4682B4" },
            { name: "擦桌子", type: "common", icon: "fa-table", color: "#FFA500" },
            { name: "扫地", type: "common", icon: "fa-broom", color: "#A9A9A9" },
            { name: "做饭", type: "husband", icon: "fa-utensil-spoon", color: "#DC143C" }
        ];
        
        // 家庭成员数据
        const familyMembers = {
            child: ["小明", "小红"],
            husband: ["爸爸"],
            common: ["小明", "小红", "爸爸", "妈妈"]
        };
        
        // DOM元素
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        const historyList = document.getElementById('historyList');
        const taskModal = document.getElementById('taskModal');
        const taskNameInput = document.getElementById('taskName');
        const taskTypeSelect = document.getElementById('taskType');
        const taskIconSelect = document.getElementById('taskIcon');
        const taskColorInput = document.getElementById('taskColor');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveTaskBtn = document.getElementById('saveTaskBtn');
        
        // 历史记录
        let history = [];
        let isSpinning = false;
        let currentRotation = 0;
        
        // 初始化9宫格
        function initWheel() {
            wheel.innerHTML = '';
            
            // 只显示前9个任务，如果任务少于9个则重复显示
            const displayTasks = [];
            for (let i = 0; i < 9; i++) {
                displayTasks.push(tasks[i % tasks.length]);
            }
            
            displayTasks.forEach((task, index) => {
                const gridItem = document.createElement('div');
                gridItem.className = 'wheel-section-item';
                gridItem.style.backgroundColor = task.color;
                // 存储真实的任务索引，而不是宫格索引
                gridItem.dataset.taskIndex = index % tasks.length;
                // 同时存储宫格位置，用于光彩效果定位
                gridItem.dataset.gridIndex = index;
                
                const text = document.createElement('div');
                text.className = 'wheel-text';
                text.innerHTML = `<i class="fas ${task.icon}"></i><div>${task.name}</div>`;
                
                gridItem.appendChild(text);
                wheel.appendChild(gridItem);
            });
        }
        
        // 获取对比色（用于文本颜色）
        function getContrastColor(hexColor) {
            const r = parseInt(hexColor.substr(1, 2), 16);
            const g = parseInt(hexColor.substr(3, 2), 16);
            const b = parseInt(hexColor.substr(5, 2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128 ? '#333' : '#fff';
        }
        
        // 光彩分配
        function spinWheel() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            // 获取所有宫格
            const gridItems = wheel.querySelectorAll('.wheel-section-item');
            
            // 清除之前的选中状态
            gridItems.forEach(item => {
                item.classList.remove('selected-final', 'glow-active');
                const existingGlow = item.querySelector('.glow-effect');
                if (existingGlow) {
                    existingGlow.remove();
                }
            });
            
            // 随机选择任务
            const randomTaskIndex = Math.floor(Math.random() * tasks.length);
            const selectedTask = tasks[randomTaskIndex];
            
            // 找到对应的宫格（考虑重复显示的情况）
            // 由于9宫格可能重复显示任务，需要找到第一个匹配的宫格
            let targetGridIndex = -1;
            gridItems.forEach((item, index) => {
                if (parseInt(item.dataset.taskIndex) === randomTaskIndex && targetGridIndex === -1) {
                    targetGridIndex = index;
                }
            });
            
            // 如果没找到（理论上不应该发生），使用计算的位置
            if (targetGridIndex === -1) {
                targetGridIndex = randomTaskIndex % 9;
            }
            
            // 验证选中的宫格内容与结果是否一致
            const selectedGridTask = gridItems[targetGridIndex].querySelector('.wheel-text div').textContent;
            console.log(`验证: 选中任务=${selectedTask.name}, 宫格显示=${selectedGridTask}, 匹配=${selectedTask.name === selectedGridTask}`);
            
            console.log(`选中任务: ${selectedTask.name} (索引: ${randomTaskIndex}, 宫格: ${targetGridIndex})`);
            
            // 播放光彩效果
            playGlowEffect(gridItems, targetGridIndex, () => {
                showResult(selectedTask);
                isSpinning = false;
                spinBtn.disabled = false;
            });
            
            // 播放音效
            playSpinSound();
        }
        
        // 播放光彩效果
        function playGlowEffect(gridItems, targetIndex, callback) {
            let currentIndex = 0;
            const totalSteps = 20 + targetIndex; // 多转几圈再停在目标位置
            let stepCount = 0;
            
            const glowInterval = setInterval(() => {
                // 移除之前的光彩效果
                gridItems.forEach(item => {
                    item.classList.remove('glow-active');
                    const existingGlow = item.querySelector('.glow-effect');
                    if (existingGlow) {
                        existingGlow.remove();
                    }
                });
                
                // 添加当前位置的光彩效果
                gridItems[currentIndex].classList.add('glow-active');
                const glowDiv = document.createElement('div');
                glowDiv.className = 'glow-effect';
                gridItems[currentIndex].appendChild(glowDiv);
                
                stepCount++;
                
                // 计算下一个位置和延迟时间
                if (stepCount < totalSteps) {
                    currentIndex = (currentIndex + 1) % 9;
                } else {
                    // 停止并显示最终结果
                    clearInterval(glowInterval);
                    setTimeout(() => {
                        // 移除所有光彩效果
                        gridItems.forEach(item => {
                            item.classList.remove('glow-active');
                            const existingGlow = item.querySelector('.glow-effect');
                            if (existingGlow) {
                                existingGlow.remove();
                            }
                        });
                        
                        // 在目标宫格添加最终选中效果
                        gridItems[targetIndex].classList.add('selected-final');
                        const finalGlow = document.createElement('div');
                        finalGlow.className = 'glow-effect final-glow';
                        gridItems[targetIndex].appendChild(finalGlow);
                        
                        callback();
                    }, 800);
                }
            }, Math.max(80 - stepCount * 2, 30)); // 速度逐渐加快，最后减慢
        }
        
        // 播放旋转音效
        function playSpinSound() {
            // 创建音效
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 2);
        }
        
        // 显示结果
        function showResult(task) {
            // 随机选择执行人
            const assignees = familyMembers[task.type];
            const randomAssignee = assignees[Math.floor(Math.random() * assignees.length)];
            
            // 创建结果HTML
            let assigneeClass = '';
            if (task.type === 'child') assigneeClass = 'child-task';
            else if (task.type === 'husband') assigneeClass = 'husband-task';
            else assigneeClass = 'common-task';
            
            resultDiv.innerHTML = `
                <i class="fas ${task.icon} task-icon"></i>
                <div>${task.name}</div>
                <div class="assigned-to ${assigneeClass}">${randomAssignee}</div>
            `;
            
            // 添加到历史记录
            const historyItem = {
                task: task.name,
                assignee: randomAssignee,
                type: task.type,
                icon: task.icon,
                timestamp: new Date()
            };
            
            history.unshift(historyItem);
            if (history.length > 6) history.pop();
            
            updateHistory();
        }
        
        // 更新历史记录
        function updateHistory() {
            historyList.innerHTML = '';
            
            history.forEach(item => {
                let typeClass = '';
                if (item.type === 'child') typeClass = 'child-task';
                else if (item.type === 'husband') typeClass = 'husband-task';
                else typeClass = 'common-task';
                
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-icon">
                        <i class="fas ${item.icon}"></i>
                    </div>
                    <div class="history-details">
                        <div class="history-task">${item.task}</div>
                        <div class="history-assignee">
                            <span class="${typeClass}">${item.assignee}</span> 
                            · ${formatTime(item.timestamp)}
                        </div>
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }
        
        // 格式化时间
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }
        
        // 添加任务
        function addNewTask() {
            const name = taskNameInput.value.trim();
            const type = taskTypeSelect.value;
            const icon = taskIconSelect.value;
            const color = taskColorInput.value;
            
            if (!name) {
                alert('请输入任务名称');
                return;
            }
            
            tasks.push({
                name,
                type,
                icon,
                color
            });
            
            initWheel();
            taskModal.classList.remove('active');
            taskNameInput.value = '';
            
            alert(`任务 "${name}" 已成功添加！`);
        }
        
        // 初始化
        window.onload = () => {
            initWheel();
            updateHistory();
            
            // 事件监听器
            spinBtn.addEventListener('click', spinWheel);
            
            document.getElementById('addTaskBtn').addEventListener('click', () => {
                taskModal.classList.add('active');
            });
            
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (confirm('确定要重置所有任务记录吗？')) {
                    history = [];
                    updateHistory();
                    resultDiv.innerHTML = `<i class="fas fa-arrow-circle-down task-icon"></i>
                                          <span>点击旋转按钮开始分配</span>`;
                    alert('任务记录已重置！');
                }
            });
            
            closeModal.addEventListener('click', () => {
                taskModal.classList.remove('active');
            });
            
            cancelBtn.addEventListener('click', () => {
                taskModal.classList.remove('active');
            });
            
            saveTaskBtn.addEventListener('click', addNewTask);
        };
    </script>
</body>
</html>
