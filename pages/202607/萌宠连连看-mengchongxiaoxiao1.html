<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萌宠连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
            background-color: #FFD6E7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            touch-action: manipulation;
        }
        
        h1 {
            color: #FF6B9D;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            background-color: #FFF;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-label {
            font-size: 14px;
            color: #888;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #FF6B9D;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background-color: #FFF;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            padding: 10px;
        }
        
        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFF9FC;
            border-radius: 8px;
            margin: 2px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .tile:hover {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }
        
        .tile.selected {
            background-color: #FFE5F0;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.8);
        }
        
        .tile img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            pointer-events: none;
        }
        
        .tile.hidden {
            visibility: hidden;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #FF6B9D;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            flex: 1;
            margin: 0 5px;
            min-width: 0;
        }
        
        button:hover {
            background-color: #FF4785;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .path {
            position: absolute;
            background-color: rgba(255, 107, 157, 0.5);
            z-index: 10;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 15px;
            color: white;
            text-align: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #FF6B9D;
        }
        
        .game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        /* 下载弹窗样式 */
        .download-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .download-modal.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .download-content {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .download-content h3 {
            color: #FF6B9D;
            margin-bottom: 15px;
        }
        
        .download-link {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-size: 14px;
            border: 1px dashed #ccc;
        }
        
        .copy-btn {
            background-color: #4CAF50;
            margin-top: 10px;
        }
        
        .close-btn {
            background-color: #f44336;
            margin-top: 10px;
        }
        
        @media (max-width: 500px) {
            h1 {
                font-size: 24px;
            }
            
            .game-info {
                padding: 8px 12px;
            }
            
            .info-label {
                font-size: 12px;
            }
            
            .info-value {
                font-size: 16px;
            }
            
            button {
                padding: 8px 12px;
                font-size: 14px;
            }
            
            .download-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <h1>萌宠连连看</h1>
    
    <div class="game-info">
        <div class="info-item">
            <div class="info-label">时间</div>
            <div class="info-value" id="time">120</div>
        </div>
        <div class="info-item">
            <div class="info-label">分数</div>
            <div class="info-value" id="score">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">重排</div>
            <div class="info-value" id="reshuffle">3</div>
        </div>
    </div>
    
    <div class="game-container">
        <div class="game-board" id="board"></div>
        
        <div class="game-over" id="gameOver">
            <h2>游戏结束!</h2>
            <p>你的最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">再玩一次</button>
        </div>
    </div>
    
    <div class="controls">
        <button id="newGameBtn">新游戏</button>
        <button id="reshuffleBtn">重排</button>
        <button id="downloadBtn">下载游戏</button>
    </div>
    
    <!-- 下载弹窗 -->
    <div class="download-modal" id="downloadModal">
        <div class="download-content">
            <h3>下载游戏</h3>
            <p>复制以下夸克网盘链接在浏览器打开可以转存下载工具</p>
            <div class="download-link" id="downloadLink">
                https://pan.quark.cn/s/0acfce3d1a32
            </div>
            <button class="copy-btn" id="copyBtn">复制链接</button>
            <button class="close-btn" id="closeDownloadBtn">关闭</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏配置
            const config = {
                rows: 8,
                cols: 8,
                types: 16, // 宠物种类数量
                timeLimit: 120, // 游戏时间(秒)
                reshuffleCount: 3 // 初始重排次数
            };
            
            // 游戏状态
            let state = {
                board: [],
                selectedTile: null,
                score: 0,
                timeLeft: config.timeLimit,
                reshuffleLeft: config.reshuffleCount,
                timer: null,
                isGameOver: false,
                petImages: [
                    '🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
                    '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦'
                ]
            };
            
            // DOM元素
            const boardElement = document.getElementById('board');
            const timeElement = document.getElementById('time');
            const scoreElement = document.getElementById('score');
            const reshuffleElement = document.getElementById('reshuffle');
            const gameOverElement = document.getElementById('gameOver');
            const finalScoreElement = document.getElementById('finalScore');
            const newGameBtn = document.getElementById('newGameBtn');
            const reshuffleBtn = document.getElementById('reshuffleBtn');
            const restartBtn = document.getElementById('restartBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadModal = document.getElementById('downloadModal');
            const downloadLink = document.getElementById('downloadLink');
            const copyBtn = document.getElementById('copyBtn');
            const closeDownloadBtn = document.getElementById('closeDownloadBtn');
            
            // 初始化游戏
            function initGame() {
                clearInterval(state.timer);
                
                // 重置状态
                state.board = [];
                state.selectedTile = null;
                state.score = 0;
                state.timeLeft = config.timeLimit;
                state.reshuffleLeft = config.reshuffleCount;
                state.isGameOver = false;
                
                // 更新UI
                timeElement.textContent = state.timeLeft;
                scoreElement.textContent = state.score;
                reshuffleElement.textContent = state.reshuffleLeft;
                gameOverElement.classList.remove('show');
                
                // 创建游戏板
                createBoard();
                
                // 开始计时
                state.timer = setInterval(updateTimer, 1000);
            }
            
            // 创建游戏板
            function createBoard() {
                // 清空游戏板
                boardElement.innerHTML = '';
                
                // 创建配对数组 (每种宠物出现4次)
                let pairs = [];
                for (let i = 0; i < config.types; i++) {
                    for (let j = 0; j < 4; j++) {
                        pairs.push(i);
                    }
                }
                
                // 随机排序
                pairs = shuffleArray(pairs);
                
                // 创建游戏板数组
                state.board = [];
                for (let row = 0; row < config.rows; row++) {
                    state.board[row] = [];
                    for (let col = 0; col < config.cols; col++) {
                        const index = row * config.cols + col;
                        state.board[row][col] = {
                            type: pairs[index],
                            visible: true,
                            element: null
                        };
                    }
                }
                
                // 创建DOM元素
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.dataset.row = row;
                        tile.dataset.col = col;
                        
                        const emoji = document.createElement('div');
                        emoji.textContent = state.petImages[state.board[row][col].type];
                        emoji.style.fontSize = '24px';
                        tile.appendChild(emoji);
                        
                        tile.addEventListener('click', handleTileClick);
                        tile.addEventListener('touchstart', handleTileClick, { passive: true });
                        
                        boardElement.appendChild(tile);
                        state.board[row][col].element = tile;
                    }
                }
            }
            
            // 重排游戏板
            function reshuffleBoard() {
                if (state.reshuffleLeft <= 0 || state.isGameOver) return;
                
                // 收集所有可见的瓷砖及其类型
                const visibleTiles = [];
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        if (state.board[row][col].visible) {
                            visibleTiles.push(state.board[row][col].type);
                        }
                    }
                }
                
                // 随机打乱可见瓷砖的顺序
                const shuffledTypes = shuffleArray(visibleTiles);
                
                // 重新分配瓷砖类型
                let index = 0;
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        if (state.board[row][col].visible) {
                            state.board[row][col].type = shuffledTypes[index++];
                            // 更新显示的emoji
                            const emoji = state.board[row][col].element.querySelector('div');
                            emoji.textContent = state.petImages[state.board[row][col].type];
                        }
                    }
                }
                
                // 减少重排次数
                state.reshuffleLeft--;
                reshuffleElement.textContent = state.reshuffleLeft;
                
                // 清除选中状态
                if (state.selectedTile) {
                    state.board[state.selectedTile.row][state.selectedTile.col].element.classList.remove('selected');
                    state.selectedTile = null;
                }
            }
            
            // 处理瓷砖点击
            function handleTileClick(e) {
                if (state.isGameOver) return;
                
                // 对于触摸事件，防止触发点击事件
                if (e.type === 'touchstart') {
                    e.preventDefault();
                }
                
                const row = parseInt(this.dataset.row);
                const col = parseInt(this.dataset.col);
                const tile = state.board[row][col];
                
                // 如果瓷砖已隐藏或已被选中，则忽略
                if (!tile.visible || (state.selectedTile && state.selectedTile.row === row && state.selectedTile.col === col)) {
                    return;
                }
                
                // 清除之前的选中状态
                if (state.selectedTile) {
                    const prevTile = state.board[state.selectedTile.row][state.selectedTile.col];
                    prevTile.element.classList.remove('selected');
                }
                
                // 选中当前瓷砖
                tile.element.classList.add('selected');
                
                // 如果没有选中的瓷砖，保存当前选中的瓷砖
                if (!state.selectedTile) {
                    state.selectedTile = { row, col };
                    return;
                }
                
                // 获取之前选中的瓷砖
                const prevTile = state.board[state.selectedTile.row][state.selectedTile.col];
                
                // 检查是否可以连接
                if (canConnect(state.selectedTile.row, state.selectedTile.col, row, col)) {
                    // 匹配成功
                    tile.visible = false;
                    prevTile.visible = false;
                    
                    tile.element.classList.add('hidden');
                    prevTile.element.classList.add('hidden');
                    
                    // 增加分数
                    state.score += 10;
                    scoreElement.textContent = state.score;
                    
                    // 检查游戏是否结束
                    checkGameOver();
                }
                
                // 无论是否匹配成功，都清除选中状态
                tile.element.classList.remove('selected');
                prevTile.element.classList.remove('selected');
                state.selectedTile = null;
            }
            
            // 检查两个瓷砖是否可以连接
            function canConnect(row1, col1, row2, col2) {
                // 如果不是相同的类型，不能连接
                if (state.board[row1][col1].type !== state.board[row2][col2].type) {
                    return false;
                }
                
                // 检查直线连接
                if (checkStraightLine(row1, col1, row2, col2)) {
                    return true;
                }
                
                // 检查一个拐角的连接
                if (checkOneCorner(row1, col1, row2, col2)) {
                    return true;
                }
                
                // 检查两个拐角的连接
                if (checkTwoCorners(row1, col1, row2, col2)) {
                    return true;
                }
                
                return false;
            }
            
            // 检查直线连接
            function checkStraightLine(row1, col1, row2, col2) {
                // 如果在同一行
                if (row1 === row2) {
                    const minCol = Math.min(col1, col2);
                    const maxCol = Math.max(col1, col2);
                    
                    // 检查中间是否有障碍物
                    for (let col = minCol + 1; col < maxCol; col++) {
                        if (state.board[row1][col].visible) {
                            return false;
                        }
                    }
                    return true;
                }
                
                // 如果在同一列
                if (col1 === col2) {
                    const minRow = Math.min(row1, row2);
                    const maxRow = Math.max(row1, row2);
                    
                    // 检查中间是否有障碍物
                    for (let row = minRow + 1; row < maxRow; row++) {
                        if (state.board[row][col1].visible) {
                            return false;
                        }
                    }
                    return true;
                }
                
                return false;
            }
            
            // 检查一个拐角的连接
            function checkOneCorner(row1, col1, row2, col2) {
                // 拐点1: (row1, col2)
                if (!state.board[row1][col2].visible || (row1 === row2 && col2 === col1)) {
                    if (checkStraightLine(row1, col1, row1, col2) && 
                        checkStraightLine(row1, col2, row2, col2)) {
                        return true;
                    }
                }
                
                // 拐点2: (row2, col1)
                if (!state.board[row2][col1].visible || (row2 === row1 && col1 === col2)) {
                    if (checkStraightLine(row1, col1, row2, col1) && 
                        checkStraightLine(row2, col1, row2, col2)) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 检查两个拐角的连接
            function checkTwoCorners(row1, col1, row2, col2) {
                // 检查所有可能的拐点
                for (let row = 0; row < config.rows; row++) {
                    if (row === row1 || row === row2 || state.board[row][col1].visible) continue;
                    
                    if (checkStraightLine(row1, col1, row, col1) && 
                        checkOneCorner(row, col1, row2, col2)) {
                        return true;
                    }
                }
                
                for (let col = 0; col < config.cols; col++) {
                    if (col === col1 || col === col2 || state.board[row1][col].visible) continue;
                    
                    if (checkStraightLine(row1, col1, row1, col) && 
                        checkOneCorner(row1, col, row2, col2)) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 更新计时器
            function updateTimer() {
                state.timeLeft--;
                timeElement.textContent = state.timeLeft;
                
                if (state.timeLeft <= 0) {
                    endGame();
                }
            }
            
            // 检查游戏是否结束
            function checkGameOver() {
                // 检查是否所有瓷砖都已消除
                let allHidden = true;
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        if (state.board[row][col].visible) {
                            allHidden = false;
                            break;
                        }
                    }
                    if (!allHidden) break;
                }
                
                if (allHidden) {
                    endGame(true);
                    return;
                }
                
                // 检查是否还有可连接的瓷砖对
                if (!hasValidMoves()) {
                    // 如果没有可连接的瓷砖对，自动洗牌或结束游戏
                    endGame();
                }
            }
            
            // 检查是否还有可连接的瓷砖对
            function hasValidMoves() {
                const visibleTiles = [];
                
                // 收集所有可见的瓷砖
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        if (state.board[row][col].visible) {
                            visibleTiles.push({ row, col });
                        }
                    }
                }
                
                // 检查所有可能的瓷砖对
                for (let i = 0; i < visibleTiles.length; i++) {
                    for (let j = i + 1; j < visibleTiles.length; j++) {
                        const tile1 = visibleTiles[i];
                        const tile2 = visibleTiles[j];
                        
                        // 如果类型相同且可以连接
                        if (state.board[tile1.row][tile1.col].type === state.board[tile2.row][tile2.col].type) {
                            if (canConnect(tile1.row, tile1.col, tile2.row, tile2.col)) {
                                return true;
                            }
                        }
                    }
                }
                
                return false;
            }
            
            // 结束游戏
            function endGame(isWin = false) {
                clearInterval(state.timer);
                state.isGameOver = true;
                
                finalScoreElement.textContent = state.score;
                
                const message = isWin ? 
                    `恭喜你完成了游戏! 用时: ${config.timeLimit - state.timeLeft}秒` : 
                    "时间到了!";
                
                gameOverElement.querySelector('h2').textContent = isWin ? "恭喜获胜!" : "游戏结束!";
                gameOverElement.querySelector('p').textContent = message;
                gameOverElement.classList.add('show');
            }
            
            // 显示下载弹窗
            function showDownloadModal() {
                downloadModal.classList.add('show');
            }
            
            // 隐藏下载弹窗
            function hideDownloadModal() {
                downloadModal.classList.remove('show');
            }
            
            // 复制链接到剪贴板
            function copyDownloadLink() {
                const link = downloadLink.textContent.trim();
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        alert('链接已复制到剪贴板！');
                    } else {
                        alert('无法复制链接，请手动选择并复制。');
                    }
                } catch (err) {
                    alert('浏览器不支持自动复制，请手动选择并复制链接。');
                    console.error('复制失败:', err);
                }
                
                document.body.removeChild(textarea);
            }
            
            // 工具函数: 随机打乱数组
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            // 事件监听
            newGameBtn.addEventListener('click', initGame);
            reshuffleBtn.addEventListener('click', reshuffleBoard);
            restartBtn.addEventListener('click', initGame);
            downloadBtn.addEventListener('click', showDownloadModal);
            closeDownloadBtn.addEventListener('click', hideDownloadModal);
            copyBtn.addEventListener('click', copyDownloadLink);
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
