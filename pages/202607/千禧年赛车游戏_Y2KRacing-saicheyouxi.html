<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>千禧年赛车游戏 | Y2K Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 20px;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 20%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 20px);
            pointer-events: none;
            z-index: -1;
        }
        
        .header {
            text-align: center;
            margin: 10px 0 15px;
            z-index: 10;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            width: 100%;
            animation: titleGlow 2s infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
            100% { text-shadow: 0 0 15px #0ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff; }
        }
        
        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 8px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            margin-bottom: 15px;
            color: #ff0;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        #gameCanvas {
            background: linear-gradient(to bottom, #111 0%, #000 100%);
            border: 4px solid #ff00ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(255, 0, 255, 0.3);
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            display: block;
            margin: 0 auto;
        }
        
        .game-ui {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin: 15px auto 10px;
            background: rgba(0, 0, 20, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #00ffff;
            flex-wrap: wrap;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        
        .score-container, .controls-container {
            display: flex;
            flex-direction: column;
            margin: 5px 0;
        }
        
        .score-title, .controls-title {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #ff0;
            margin-bottom: 4px;
        }
        
        #score, #highScore {
            font-size: clamp(1.5rem, 5vw, 1.8rem);
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-size: clamp(0.8rem, 3vw, 1rem);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.7);
        }
        
        .btn:hover::before {
            opacity: 1;
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: rgba(0, 0, 20, 0.7);
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px auto 0;
            max-width: 800px;
            width: 100%;
            font-size: clamp(0.8rem, 3vw, 1rem);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
        
        .instructions h2 {
            color: #ff0;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            text-shadow: 0 0 5px #ff0;
        }
        
        .instructions p {
            margin: 6px 0;
            line-height: 1.4;
        }
        
        .key {
            display: inline-block;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #0ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 2px;
            box-shadow: 0 0 5px #0ff;
        }
        
        .mobile-controls {
            display: none;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin: 15px auto 0;
            gap: 15px;
        }
        
        .mobile-btn {
            flex: 1;
            height: 70px;
            background: rgba(255, 0, 255, 0.3);
            border: 2px solid #ff00ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            user-select: none;
            touch-action: manipulation;
            transition: all 0.1s;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }
        
        .mobile-btn:active {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #0ff;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            opacity: 0.8;
            width: 100%;
            text-shadow: 0 0 5px #0ff;
        }
        
        .particle {
            position: absolute;
            background: #0ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
            
            .game-ui {
                justify-content: space-around;
            }
            
            .controls {
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .game-ui {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .score-container, .controls-container {
                align-items: center;
            }
            
            .mobile-btn {
                height: 60px;
                font-size: 20px;
            }
            
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>千禧年赛车</h1>
        <div class="subtitle">Y2K RACING - 穿越时空的极速体验</div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div class="game-ui">
            <div class="score-container">
                <div class="score-title">当前分数</div>
                <div id="score">0</div>
            </div>
            
            <div class="controls-container">
                <div class="controls-title">游戏控制</div>
                <div class="controls">
                    <button class="btn" id="startBtn">开始游戏</button>
                    <button class="btn" id="resetBtn">重新开始</button>
                </div>
            </div>
            
            <div class="score-container">
                <div class="score-title">最高分数</div>
                <div id="highScore">0</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>
    </div>
    
    <div class="instructions">
        <h2>游戏说明</h2>
        <p>使用 <span class="key">←</span> 和 <span class="key">→</span> 方向键控制你的赛车，避开其他车辆！</p>
        <p>每成功超越一辆车得 <span style="color:#0ff; text-shadow: 0 0 5px #0ff;">10分</span>，碰撞则游戏结束。</p>
        <p>在手机上可使用屏幕下方的左右按钮进行控制。</p>
        <p>尽可能获得高分，挑战你的极限！</p>
    </div>
    
    <div class="footer">
        © 2023 千禧年赛车游戏 | 为怀旧游戏爱好者打造
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const highScoreDisplay = document.getElementById('highScore');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 调整Canvas大小以适应屏幕
            function resizeCanvas() {
                const maxWidth = Math.min(800, window.innerWidth - 30);
                const aspectRatio = 16/9;
                const newHeight = maxWidth / aspectRatio;
                
                canvas.width = maxWidth;
                canvas.height = newHeight;
                
                // 重新初始化游戏元素位置
                if (player) {
                    player.y = canvas.height - player.height - 20;
                    player.x = canvas.width / 2 - player.width / 2;
                }
                
                road.width = canvas.width * 0.7;
                road.x = (canvas.width - road.width) / 2;
            }
            
            // 游戏变量
            const player = {
                x: 0,
                y: 0,
                width: 40,
                height: 70,
                speed: 8,
                color: '#ff00ff',
                nitro: false,
                nitroTime: 0
            };
            
            const road = {
                width: 0,
                x: 0,
                laneCount: 3,
                markWidth: 8,
                markHeight: 30,
                markGap: 25,
                offset: 0
            };
            
            let cars = [];
            let score = 0;
            let highScore = localStorage.getItem('y2kRacingHighScore') || 0;
            let gameActive = false;
            let gameSpeed = 5;
            let animationId = null;
            let lastTime = 0;
            let carSpawnTimer = 0;
            let particles = [];
            let leftPressed = false;
            let rightPressed = false;
            
            // 初始化游戏
            function init() {
                resizeCanvas();
                
                cars = [];
                particles = [];
                score = 0;
                scoreDisplay.textContent = score;
                highScoreDisplay.textContent = highScore;
                gameSpeed = 5;
                carSpawnTimer = 0;
                player.nitro = false;
                player.nitroTime = 0;
                
                player.x = canvas.width / 2 - player.width / 2;
                player.y = canvas.height - player.height - 20;
            }
            
            // 创建粒子效果
            function createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1;
                    particles.push({
                        x: x,
                        y: y,
                        size: Math.random() * 3 + 1,
                        color: color,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 20 + Math.random() * 30
                    });
                }
            }
            
            // 更新和绘制粒子
            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.globalAlpha = p.life / 50;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }
            
            // 绘制道路
            function drawRoad() {
                // 道路背景
                ctx.fillStyle = '#222';
                ctx.fillRect(road.x, 0, road.width, canvas.height);
                
                // 道路标记
                ctx.fillStyle = '#fff';
                for (let i = 0; i < road.laneCount - 1; i++) {
                    const laneX = road.x + (road.width / road.laneCount) * (i + 1);
                    for (let y = -road.markHeight; y < canvas.height; y += road.markHeight + road.markGap) {
                        // 添加透视效果（近大远小）
                        const scale = 0.8 + (y / canvas.height) * 0.4;
                        const scaledWidth = road.markWidth * scale;
                        const scaledHeight = road.markHeight * scale;
                        
                        ctx.fillRect(laneX - scaledWidth / 2, y + road.offset, scaledWidth, scaledHeight);
                    }
                }
                
                // 道路边界
                ctx.strokeStyle = '#ff0';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(road.x, 0);
                ctx.lineTo(road.x, canvas.height);
                ctx.moveTo(road.x + road.width, 0);
                ctx.lineTo(road.x + road.width, canvas.height);
                ctx.stroke();
                
                // 更新道路偏移以创建运动感
                road.offset += gameSpeed * 0.5;
                if (road.offset > road.markHeight + road.markGap) {
                    road.offset = 0;
                }
            }
            
            // 绘制玩家赛车
            function drawPlayer() {
                // 绘制氮气效果
                if (player.nitro) {
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.width * 0.3, player.y + player.height);
                    ctx.lineTo(player.x + player.width * 0.7, player.y + player.height);
                    ctx.lineTo(player.x + player.width * 0.5, player.y + player.height + 30);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 添加粒子
                    if (Math.random() < 0.7) {
                        createParticles(
                            player.x + player.width/2, 
                            player.y + player.height + 15,
                            '#00ffff',
                            2
                        );
                    }
                }
                
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, player.width, player.height);
                
                // 添加赛车细节
                ctx.fillStyle = '#0ff';
                ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, 12);
                ctx.fillRect(player.x + 4, player.y + player.height - 16, player.width - 8, 12);
                
                // 车窗
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(player.x + 8, player.y + 20, player.width - 16, 16);
                
                // 车灯
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(player.x + 4, player.y + player.height - 4, 8, 4);
                ctx.fillRect(player.x + player.width - 12, player.y + player.height - 4, 8, 4);
            }
            
            // 生成敌方车辆
            function createCar() {
                const laneWidth = road.width / road.laneCount;
                const lane = Math.floor(Math.random() * road.laneCount);
                const x = road.x + lane * laneWidth + (laneWidth - 35) / 2;
                
                // 随机车辆类型
                const carTypes = [
                    {width: 35, height: 60, color: `hsl(${Math.random() * 360}, 70%, 60%)`},
                    {width: 40, height: 55, color: `hsl(${Math.random() * 360}, 70%, 50%)`},
                    {width: 30, height: 65, color: `hsl(${Math.random() * 360}, 70%, 55%)`}
                ];
                
                const type = carTypes[Math.floor(Math.random() * carTypes.length)];
                
                cars.push({
                    x: x,
                    y: -70,
                    width: type.width,
                    height: type.height,
                    speed: gameSpeed + Math.random() * 2,
                    color: type.color,
                    type: Math.floor(Math.random() * 3)
                });
            }
            
            // 绘制敌方车辆
            function drawCars() {
                cars.forEach(car => {
                    ctx.fillStyle = car.color;
                    ctx.fillRect(car.x, car.y, car.width, car.height);
                    
                    // 车窗
                    ctx.fillStyle = '#000';
                    ctx.fillRect(car.x + 4, car.y + 12, car.width - 8, 16);
                    
                    // 车灯
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(car.x + 4, car.y + car.height - 4, 6, 4);
                    ctx.fillRect(car.x + car.width - 10, car.y + car.height - 4, 6, 4);
                    
                    // 添加车辆细节
                    if (car.type === 0) {
                        ctx.fillStyle = '#ff00ff';
                        ctx.fillRect(car.x + 10, car.y + 5, car.width - 20, 5);
                    } else if (car.type === 1) {
                        ctx.fillStyle = '#00ffff';
                        ctx.fillRect(car.x + 5, car.y + 5, 5, car.height - 10);
                        ctx.fillRect(car.x + car.width - 10, car.y + 5, 5, car.height - 10);
                    }
                });
            }
            
            // 更新车辆位置
            function updateCars(deltaTime) {
                for (let i = cars.length - 1; i >= 0; i--) {
                    cars[i].y += cars[i].speed * (deltaTime / 16);
                    
                    // 移除屏幕外的车辆
                    if (cars[i].y > canvas.height) {
                        // 添加得分粒子效果
                        createParticles(
                            cars[i].x + cars[i].width/2, 
                            canvas.height, 
                            '#00ff00',
                            15
                        );
                        
                        cars.splice(i, 1);
                        score += 10;
                        scoreDisplay.textContent = score;
                        
                        // 每100分增加难度
                        if (score % 100 === 0) {
                            gameSpeed += 0.5;
                            
                            // 添加速度提升效果
                            createParticles(
                                canvas.width/2,
                                50,
                                '#ff00ff',
                                30
                            );
                        }
                    }
                }
                
                // 按时间间隔生成新车
                carSpawnTimer += deltaTime;
                if (carSpawnTimer > 1000) {
                    if (Math.random() < 0.7) {
                        createCar();
                    }
                    carSpawnTimer = 0;
                }
            }
            
            // 碰撞检测
            function checkCollision() {
                for (const car of cars) {
                    if (
                        player.x < car.x + car.width &&
                        player.x + player.width > car.x &&
                        player.y < car.y + car.height &&
                        player.y + player.height > car.y
                    ) {
                        // 碰撞时添加爆炸效果
                        createParticles(
                            (player.x + player.width/2 + car.x + car.width/2)/2,
                            (player.y + player.height/2 + car.y + car.height/2)/2,
                            '#ff0000',
                            50
                        );
                        return true;
                    }
                }
                return false;
            }
            
            // 绘制游戏状态
            function drawGameStatus() {
                if (!gameActive) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.font = `bold ${Math.min(40, canvas.width/20)}px "Courier New", monospace`;
                    ctx.fillStyle = '#ff00ff';
                    ctx.textAlign = 'center';
                    ctx.fillText('千禧年赛车', canvas.width / 2, canvas.height / 2 - 30);
                    
                    ctx.font = `${Math.min(20, canvas.width/40)}px "Courier New", monospace`;
                    ctx.fillStyle = '#0ff';
                    ctx.fillText('点击"开始游戏"按钮开始', canvas.width / 2, canvas.height / 2 + 15);
                    
                    ctx.fillStyle = '#ff0';
                    ctx.font = `${Math.min(16, canvas.width/50)}px "Courier New", monospace`;
                    ctx.fillText(`最高分: ${highScore}`, canvas.width / 2, canvas.height / 2 + 45);
                }
                
                if (gameActive && checkCollision()) {
                    gameActive = false;
                    
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('y2kRacingHighScore', highScore);
                        highScoreDisplay.textContent = highScore;
                    }
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.font = `bold ${Math.min(40, canvas.width/20)}px "Courier New", monospace`;
                    ctx.fillStyle = '#ff0000';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 30);
                    
                    ctx.font = `${Math.min(30, canvas.width/27)}px "Courier New", monospace`;
                    ctx.fillStyle = '#0ff';
                    ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                    
                    ctx.font = `${Math.min(20, canvas.width/40)}px "Courier New", monospace`;
                    ctx.fillStyle = '#ff0';
                    ctx.fillText('点击"重新开始"按钮再试一次', canvas.width / 2, canvas.height / 2 + 45);
                }
            }
            
            // 绘制速度计
            function drawSpeedometer() {
                if (!gameActive) return;
                
                const centerX = canvas.width - 40;
                const centerY = 40;
                const radius = 30;
                
                // 绘制外圈
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // 绘制刻度
                const speed = Math.min(gameSpeed * 10, 150);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + Math.sin(speed / 150 * Math.PI - Math.PI/2) * (radius - 5),
                    centerY + Math.cos(speed / 150 * Math.PI - Math.PI/2) * (radius - 5)
                );
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // 绘制速度文本
                ctx.font = '12px "Courier New", monospace';
                ctx.fillStyle = '#0ff';
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.round(speed)} KM/H`, centerX, centerY + radius + 15);
            }
            
            // 游戏循环
            function gameLoop(timestamp) {
                const deltaTime = timestamp - lastTime;
                lastTime = timestamp;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                drawRoad();
                drawCars();
                drawPlayer();
                updateParticles();
                drawSpeedometer();
                drawGameStatus();
                
                if (gameActive) {
                    updateCars(deltaTime);
                    
                    // 处理持续移动
                    if (leftPressed && player.x > road.x) {
                        player.x -= player.speed * 1.5;
                    }
                    if (rightPressed && player.x + player.width < road.x + road.width) {
                        player.x += player.speed * 1.5;
                    }
                    
                    // 随机添加道路粒子效果
                    if (Math.random() < 0.05) {
                        createParticles(
                            road.x + Math.random() * road.width,
                            canvas.height,
                            '#ffffff',
                            3
                        );
                    }
                    
                    // 氮气效果
                    if (player.nitro) {
                        player.nitroTime -= deltaTime;
                        if (player.nitroTime <= 0) {
                            player.nitro = false;
                        }
                    }
                }
                
                animationId = requestAnimationFrame(gameLoop);
            }
            
            // 事件监听
            document.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                
                if (e.key === 'ArrowLeft' && player.x > road.x) {
                    player.x -= player.speed;
                } else if (e.key === 'ArrowRight' && player.x + player.width < road.x + road.width) {
                    player.x += player.speed;
                } else if (e.key === ' ' && !player.nitro) {
                    // 空格键触发氮气加速
                    player.nitro = true;
                    player.nitroTime = 2000; // 2秒氮气效果
                    gameSpeed += 2;
                    setTimeout(() => {
                        if (player.nitro) {
                            gameSpeed -= 2;
                            player.nitro = false;
                        }
                    }, 2000);
                }
            });
            
            // 触摸控制开始
            leftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                leftPressed = true;
            }, { passive: false });
            
            rightBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                rightPressed = true;
            }, { passive: false });
            
            // 触摸控制结束
            leftBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                leftPressed = false;
            }, { passive: false });
            
            rightBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                rightPressed = false;
            }, { passive: false });
            
            // 鼠标控制（用于测试）
            leftBtn.addEventListener('mousedown', () => {
                leftPressed = true;
            });
            
            rightBtn.addEventListener('mousedown', () => {
                rightPressed = true;
            });
            
            document.addEventListener('mouseup', () => {
                leftPressed = false;
                rightPressed = false;
            });
            
            // 游戏控制按钮
            startBtn.addEventListener('click', () => {
                if (!gameActive) {
                    gameActive = true;
                    init();
                }
            });
            
            resetBtn.addEventListener('click', () => {
                gameActive = true;
                init();
            });
            
            // 初始化游戏并启动
            init();
            animationId = requestAnimationFrame(gameLoop);
            
            // 窗口大小变化时重新调整
            window.addEventListener('resize', resizeCanvas);
        });
    </script>
</body>
</html>
