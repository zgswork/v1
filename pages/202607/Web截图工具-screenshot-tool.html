<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web截图工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .tool-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group label {
            font-weight: 600;
            color: #333;
        }

        .setting-group select,
        .setting-group input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .preview-section {
            text-align: center;
        }

        .preview-container {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
        }

        .preview-container.has-image {
            border-style: solid;
            border-color: #667eea;
            background: white;
        }

        .preview-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .placeholder {
            color: #999;
            font-size: 18px;
            text-align: center;
        }

        .download-section {
            display: none;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .footer {
            background: rgba(0,0,0,0.8);
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        .footer p {
            margin: 0;
            font-size: 14px;
        }

        .contact-info {
            color: #ffd700;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .tool-section {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .settings {
                flex-direction: column;
                gap: 15px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ Web截图工具</h1>
            <p>简单易用的网页截图工具，支持屏幕、窗口和标签页截图</p>
        </div>

        <div class="tool-section">
            <div class="status" id="status"></div>

            <div class="settings">
                <div class="setting-group">
                    <label for="format">图片格式:</label>
                    <select id="format">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="quality">图片质量:</label>
                    <input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.9">
                    <span id="qualityValue">90%</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="captureScreen">📺 截取屏幕</button>
                <button class="btn" id="captureWindow">🪟 截取窗口</button>
                <button class="btn" id="captureTab">📄 截取标签页</button>
                <button class="btn" id="clearPreview">🗑️ 清除预览</button>
            </div>

            <div class="preview-section">
                <div class="preview-container" id="previewContainer">
                    <div class="placeholder">
                        <p>📸 点击上方按钮开始截图</p>
                        <p>截图将在这里显示</p>
                    </div>
                </div>

                <div class="download-section" id="downloadSection">
                    <button class="btn" id="downloadBtn">💾 下载图片</button>
                    <button class="btn" id="copyBtn">📋 复制到剪贴板</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>有任何问题联系作者微信：<span class="contact-info">xd135341</span></p>
    </div>

    <script>
        class ScreenshotTool {
            constructor() {
                this.currentStream = null;
                this.currentImage = null;
                this.initializeElements();
                this.bindEvents();
                this.checkBrowserSupport();
            }

            initializeElements() {
                this.elements = {
                    captureScreen: document.getElementById('captureScreen'),
                    captureWindow: document.getElementById('captureWindow'),
                    captureTab: document.getElementById('captureTab'),
                    clearPreview: document.getElementById('clearPreview'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    copyBtn: document.getElementById('copyBtn'),
                    previewContainer: document.getElementById('previewContainer'),
                    downloadSection: document.getElementById('downloadSection'),
                    status: document.getElementById('status'),
                    format: document.getElementById('format'),
                    quality: document.getElementById('quality'),
                    qualityValue: document.getElementById('qualityValue')
                };
            }

            bindEvents() {
                this.elements.captureScreen.addEventListener('click', () => this.captureScreen());
                this.elements.captureWindow.addEventListener('click', () => this.captureWindow());
                this.elements.captureTab.addEventListener('click', () => this.captureTab());
                this.elements.clearPreview.addEventListener('click', () => this.clearPreview());
                this.elements.downloadBtn.addEventListener('click', () => this.downloadImage());
                this.elements.copyBtn.addEventListener('click', () => this.copyToClipboard());
                
                this.elements.quality.addEventListener('input', (e) => {
                    this.elements.qualityValue.textContent = Math.round(e.target.value * 100) + '%';
                });
            }

            checkBrowserSupport() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    this.showStatus('error', '❌ 您的浏览器不支持屏幕捕获功能，请使用Chrome、Firefox或Edge浏览器');
                    this.disableButtons();
                } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    this.showStatus('info', '⚠️ 为了安全考虑，此工具需要在HTTPS环境或localhost下运行');
                }
            }

            disableButtons() {
                this.elements.captureScreen.disabled = true;
                this.elements.captureWindow.disabled = true;
                this.elements.captureTab.disabled = true;
            }

            async captureScreen() {
                try {
                    await this.capture({ video: { mediaSource: 'screen' } });
                } catch (error) {
                    this.handleError('屏幕截图失败', error);
                }
            }

            async captureWindow() {
                try {
                    await this.capture({ video: { mediaSource: 'window' } });
                } catch (error) {
                    this.handleError('窗口截图失败', error);
                }
            }

            async captureTab() {
                try {
                    await this.capture({ video: { mediaSource: 'browser' } });
                } catch (error) {
                    this.handleError('标签页截图失败', error);
                }
            }

            async capture(constraints) {
                this.showStatus('info', '<span class="loading"></span>正在请求屏幕捕获权限...');
                
                try {
                    // 停止之前的流
                    if (this.currentStream) {
                        this.currentStream.getTracks().forEach(track => track.stop());
                    }

                    // 获取屏幕流
                    this.currentStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                    
                    this.showStatus('info', '<span class="loading"></span>正在处理截图...');

                    // 创建video元素来捕获帧
                    const video = document.createElement('video');
                    video.srcObject = this.currentStream;
                    video.play();

                    // 等待视频加载
                    await new Promise((resolve) => {
                        video.addEventListener('loadedmetadata', resolve);
                    });

                    // 创建canvas来绘制帧
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    // 停止流
                    this.currentStream.getTracks().forEach(track => track.stop());
                    this.currentStream = null;

                    // 转换为图片
                    const format = this.elements.format.value;
                    const quality = parseFloat(this.elements.quality.value);
                    const mimeType = `image/${format}`;
                    
                    const dataUrl = canvas.toDataURL(mimeType, quality);
                    this.displayImage(dataUrl);
                    
                    this.showStatus('success', '✅ 截图成功！');
                    
                } catch (error) {
                    if (error.name === 'NotAllowedError') {
                        this.showStatus('error', '❌ 用户拒绝了屏幕捕获权限');
                    } else {
                        throw error;
                    }
                }
            }

            displayImage(dataUrl) {
                this.currentImage = dataUrl;
                
                const img = document.createElement('img');
                img.src = dataUrl;
                img.className = 'preview-image';
                img.alt = '截图预览';
                
                this.elements.previewContainer.innerHTML = '';
                this.elements.previewContainer.appendChild(img);
                this.elements.previewContainer.classList.add('has-image');
                
                this.elements.downloadSection.style.display = 'flex';
            }

            clearPreview() {
                this.currentImage = null;
                this.elements.previewContainer.innerHTML = `
                    <div class="placeholder">
                        <p>📸 点击上方按钮开始截图</p>
                        <p>截图将在这里显示</p>
                    </div>
                `;
                this.elements.previewContainer.classList.remove('has-image');
                this.elements.downloadSection.style.display = 'none';
                this.hideStatus();
            }

            downloadImage() {
                if (!this.currentImage) return;
                
                const format = this.elements.format.value;
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const filename = `screenshot-${timestamp}.${format}`;
                
                const link = document.createElement('a');
                link.href = this.currentImage;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                this.showStatus('success', '✅ 图片下载成功！');
            }

            async copyToClipboard() {
                if (!this.currentImage) return;
                
                try {
                    // 将dataURL转换为blob
                    const response = await fetch(this.currentImage);
                    const blob = await response.blob();
                    
                    // 复制到剪贴板
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    
                    this.showStatus('success', '✅ 图片已复制到剪贴板！');
                } catch (error) {
                    this.showStatus('error', '❌ 复制到剪贴板失败，请尝试下载图片');
                }
            }

            showStatus(type, message) {
                this.elements.status.className = `status ${type}`;
                this.elements.status.innerHTML = message;
                this.elements.status.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => this.hideStatus(), 3000);
                }
            }

            hideStatus() {
                this.elements.status.style.display = 'none';
            }

            handleError(message, error) {
                console.error(message, error);
                this.showStatus('error', `❌ ${message}: ${error.message}`);
            }
        }

        // 初始化工具
        document.addEventListener('DOMContentLoaded', () => {
            new ScreenshotTool();
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case '1':
                        e.preventDefault();
                        document.getElementById('captureScreen').click();
                        break;
                    case '2':
                        e.preventDefault();
                        document.getElementById('captureWindow').click();
                        break;
                    case '3':
                        e.preventDefault();
                        document.getElementById('captureTab').click();
                        break;
                    case 'Delete':
                    case 'Backspace':
                        e.preventDefault();
                        document.getElementById('clearPreview').click();
                        break;
                }
            }
        });
    </script>
</body>
</html>
