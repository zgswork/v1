<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温度换算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .converter-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        /* 左侧单值转换 */
        .single-converter .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-row label {
            min-width: 80px;
            font-weight: 500;
            color: #666;
            font-size: 14px;
        }

        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 右侧区间转换 - 重新布局 */
        .range-converter {
            display: flex;
            flex-direction: column;
        }

        .range-controls {
            margin-bottom: 20px;
        }

        .unit-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .unit-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 12px;
        }

        .unit-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .unit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .range-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-inputs input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .range-inputs input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .range-separator {
            font-weight: 600;
            color: #666;
            font-size: 14px;
            white-space: nowrap;
        }

        /* 增加间距确保结果区域对齐 */
        .range-converter .range-controls {
            min-height: 120px; /* 确保和左侧输入区域差不多高度 */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 结果显示区域 */
        .result-display {
            background: linear-gradient(45deg, #f0f2f5, #e8ecf1);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-top: auto; /* 推到底部与左侧对齐 */
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        .copy-all-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .copy-all-btn:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .copy-all-btn.success {
            background: #2196F3;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            margin: 0 -6px;
            padding-left: 6px;
            padding-right: 6px;
            position: relative;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateX(3px);
        }

        .result-item.copied {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4CAF50;
        }

        .result-label {
            font-weight: 500;
            color: #555;
            font-size: 13px;
        }

        .result-value {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .copy-hint {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .result-item:hover .copy-hint {
            opacity: 1;
        }

        .instruction {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 8px;
            font-style: italic;
        }

        .clear-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 32px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            max-width: 200px;
        }

        .clear-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* 移动端样式 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
                max-width: 500px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .converter-grid {
                grid-template-columns: 1fr;
                gap: 25px;
                margin-bottom: 20px;
            }

            .input-row {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .input-row label {
                min-width: auto;
                font-size: 14px;
            }

            .input-row input {
                padding: 12px 15px;
                font-size: 16px;
            }

            .range-inputs {
                flex-direction: column;
                gap: 10px;
            }

            .range-inputs input {
                width: 100%;
                padding: 12px 15px;
                font-size: 16px;
            }

            .range-separator {
                align-self: center;
                font-size: 16px;
            }

            .unit-selector {
                flex-direction: column;
                gap: 10px;
            }

            .unit-btn {
                padding: 12px;
                font-size: 14px;
            }

            .result-header {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }

            .copy-all-btn {
                width: 100%;
                padding: 10px;
                font-size: 14px;
            }

            .result-item {
                padding: 12px 6px;
            }

            .result-item:hover {
                transform: none;
            }

            .result-label {
                font-size: 14px;
            }

            .result-value {
                font-size: 16px;
            }

            .instruction {
                font-size: 13px;
                margin-top: 10px;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .range-converter .range-controls {
                min-height: auto;
            }

            .result-display {
                margin-top: 0;
            }

            .clear-btn {
                width: 100%;
                max-width: none;
                min-width: auto;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ 温度换算工具</h1>
        
        <div class="converter-grid">
            <!-- 单值转换 -->
            <div class="converter-section single-converter">
                <h2 class="section-title">单值转换</h2>
                <div class="input-group">
                    <div class="input-row">
                        <label for="celsius">摄氏度 (°C):</label>
                        <input type="number" id="celsius" placeholder="输入摄氏度">
                    </div>
                    <div class="input-row">
                        <label for="fahrenheit">华氏度 (°F):</label>
                        <input type="number" id="fahrenheit" placeholder="输入华氏度">
                    </div>
                    <div class="input-row">
                        <label for="kelvin">开尔文 (K):</label>
                        <input type="number" id="kelvin" placeholder="输入开尔文">
                    </div>
                </div>
                
                <div class="result-display" id="singleResult">
                    <div class="result-header">
                        <span class="result-title">转换结果</span>
                        <button class="copy-all-btn" onclick="copyResult('single')">复制全部</button>
                    </div>
                    <div class="result-item" onclick="copySingleValue('resultC')">
                        <div>
                            <span class="result-label">摄氏度:</span>
                            <span class="result-value" id="resultC">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="result-item" onclick="copySingleValue('resultF')">
                        <div>
                            <span class="result-label">华氏度:</span>
                            <span class="result-value" id="resultF">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="result-item" onclick="copySingleValue('resultK')">
                        <div>
                            <span class="result-label">开尔文:</span>
                            <span class="result-value" id="resultK">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="instruction">💡 点击任意结果行即可复制该值</div>
                </div>
            </div>

            <!-- 区间转换 -->
            <div class="converter-section range-converter">
                <h2 class="section-title">区间转换</h2>
                
                <div class="range-controls">
                    <div class="unit-selector">
                        <button class="unit-btn active" data-unit="celsius">摄氏度 (°C)</button>
                        <button class="unit-btn" data-unit="fahrenheit">华氏度 (°F)</button>
                        <button class="unit-btn" data-unit="kelvin">开尔文 (K)</button>
                    </div>
                    
                    <div class="range-inputs">
                        <input type="number" id="rangeMin" placeholder="最小值">
                        <span class="range-separator">至</span>
                        <input type="number" id="rangeMax" placeholder="最大值">
                    </div>
                </div>
                
                <div class="result-display" id="rangeResult">
                    <div class="result-header">
                        <span class="result-title">区间转换结果</span>
                        <button class="copy-all-btn" onclick="copyResult('range')">复制全部</button>
                    </div>
                    <div class="result-item" onclick="copySingleValue('rangeCelsius')">
                        <div>
                            <span class="result-label">摄氏度区间:</span>
                            <span class="result-value" id="rangeCelsius">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="result-item" onclick="copySingleValue('rangeFahrenheit')">
                        <div>
                            <span class="result-label">华氏度区间:</span>
                            <span class="result-value" id="rangeFahrenheit">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="result-item" onclick="copySingleValue('rangeKelvin')">
                        <div>
                            <span class="result-label">开尔文区间:</span>
                            <span class="result-value" id="rangeKelvin">--</span>
                        </div>
                        <div class="copy-hint">点击复制</div>
                    </div>
                    <div class="instruction">💡 点击任意结果行即可复制该值</div>
                </div>
            </div>
        </div>

        <button class="clear-btn" onclick="clearAll()">🗑️ 清除所有</button>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script>
        // 温度转换函数
        function celsiusToFahrenheit(c) {
            return (c * 9/5) + 32;
        }

        function celsiusToKelvin(c) {
            return c + 273.15;
        }

        function fahrenheitToCelsius(f) {
            return (f - 32) * 5/9;
        }

        function fahrenheitToKelvin(f) {
            return ((f - 32) * 5/9) + 273.15;
        }

        function kelvinToCelsius(k) {
            return k - 273.15;
        }

        function kelvinToFahrenheit(k) {
            return ((k - 273.15) * 9/5) + 32;
        }

        // 格式化数字显示
        function formatNumber(num) {
            return Number(num).toFixed(2);
        }

        // 显示提示消息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 复制文本到剪贴板
        function copyToClipboard(text) {
            return navigator.clipboard.writeText(text).then(() => {
                return true;
            }).catch(() => {
                // 降级处理：使用传统方法
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    return true;
                } catch (err) {
                    document.body.removeChild(textArea);
                    return false;
                }
            });
        }

        // 复制单个值
        function copySingleValue(elementId) {
            const element = document.getElementById(elementId);
            const value = element.textContent;
            
            if (value === '--') {
                showToast('请先输入温度值！');
                return;
            }

            copyToClipboard(value).then(success => {
                if (success) {
                    showToast('复制成功！');
                    
                    // 添加复制成功的视觉反馈
                    const resultItem = element.closest('.result-item');
                    resultItem.classList.add('copied');
                    
                    setTimeout(() => {
                        resultItem.classList.remove('copied');
                    }, 2000);
                } else {
                    showToast('复制失败，请手动复制');
                }
            });
        }

        // 复制全部结果
        function copyResult(type) {
            let textToCopy = '';
            
            if (type === 'single') {
                const resultC = document.getElementById('resultC').textContent;
                const resultF = document.getElementById('resultF').textContent;
                const resultK = document.getElementById('resultK').textContent;
                
                if (resultC !== '--') {
                    textToCopy = `温度转换结果：\n摄氏度: ${resultC}\n华氏度: ${resultF}\n开尔文: ${resultK}`;
                } else {
                    showToast('请先输入温度值！');
                    return;
                }
            } else if (type === 'range') {
                const rangeCelsius = document.getElementById('rangeCelsius').textContent;
                const rangeFahrenheit = document.getElementById('rangeFahrenheit').textContent;
                const rangeKelvin = document.getElementById('rangeKelvin').textContent;
                
                if (rangeCelsius !== '--') {
                    textToCopy = `温度区间转换结果：\n摄氏度区间: ${rangeCelsius}\n华氏度区间: ${rangeFahrenheit}\n开尔文区间: ${rangeKelvin}`;
                } else {
                    showToast('请先输入温度区间！');
                    return;
                }
            }
            
            copyToClipboard(textToCopy).then(success => {
                if (success) {
                    showToast('复制成功！');
                    
                    // 临时改变按钮样式
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '已复制';
                    btn.classList.add('success');
                    
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.classList.remove('success');
                    }, 2000);
                } else {
                    showToast('复制失败，请手动复制');
                }
            });
        }

        // 单值转换
        document.getElementById('celsius').addEventListener('input', function() {
            const value = parseFloat(this.value);
            if (!isNaN(value)) {
                document.getElementById('resultC').textContent = formatNumber(value) + '°C';
                document.getElementById('resultF').textContent = formatNumber(celsiusToFahrenheit(value)) + '°F';
                document.getElementById('resultK').textContent = formatNumber(celsiusToKelvin(value)) + 'K';
            } else {
                clearSingleResults();
            }
        });

        document.getElementById('fahrenheit').addEventListener('input', function() {
            const value = parseFloat(this.value);
            if (!isNaN(value)) {
                document.getElementById('resultC').textContent = formatNumber(fahrenheitToCelsius(value)) + '°C';
                document.getElementById('resultF').textContent = formatNumber(value) + '°F';
                document.getElementById('resultK').textContent = formatNumber(fahrenheitToKelvin(value)) + 'K';
            } else {
                clearSingleResults();
            }
        });

        document.getElementById('kelvin').addEventListener('input', function() {
            const value = parseFloat(this.value);
            if (!isNaN(value)) {
                document.getElementById('resultC').textContent = formatNumber(kelvinToCelsius(value)) + '°C';
                document.getElementById('resultF').textContent = formatNumber(kelvinToFahrenheit(value)) + '°F';
                document.getElementById('resultK').textContent = formatNumber(value) + 'K';
            } else {
                clearSingleResults();
            }
        });

        // 清除单值结果
        function clearSingleResults() {
            document.getElementById('resultC').textContent = '--';
            document.getElementById('resultF').textContent = '--';
            document.getElementById('resultK').textContent = '--';
        }

        // 区间转换
        let selectedUnit = 'celsius';

        // 单位选择按钮
        document.querySelectorAll('.unit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedUnit = this.dataset.unit;
                updateRangeConversion();
            });
        });

        // 区间输入监听
        document.getElementById('rangeMin').addEventListener('input', updateRangeConversion);
        document.getElementById('rangeMax').addEventListener('input', updateRangeConversion);

        function updateRangeConversion() {
            const min = parseFloat(document.getElementById('rangeMin').value);
            const max = parseFloat(document.getElementById('rangeMax').value);
            
            if (isNaN(min) || isNaN(max)) {
                clearRangeResults();
                return;
            }

            let minC, maxC, minF, maxF, minK, maxK;

            // 根据选择的单位转换
            switch(selectedUnit) {
                case 'celsius':
                    minC = min; maxC = max;
                    minF = celsiusToFahrenheit(min); maxF = celsiusToFahrenheit(max);
                    minK = celsiusToKelvin(min); maxK = celsiusToKelvin(max);
                    break;
                case 'fahrenheit':
                    minC = fahrenheitToCelsius(min); maxC = fahrenheitToCelsius(max);
                    minF = min; maxF = max;
                    minK = fahrenheitToKelvin(min); maxK = fahrenheitToKelvin(max);
                    break;
                case 'kelvin':
                    minC = kelvinToCelsius(min); maxC = kelvinToCelsius(max);
                    minF = kelvinToFahrenheit(min); maxF = kelvinToFahrenheit(max);
                    minK = min; maxK = max;
                    break;
            }

            // 显示结果
            document.getElementById('rangeCelsius').textContent = `${formatNumber(minC)}°C ~ ${formatNumber(maxC)}°C`;
            document.getElementById('rangeFahrenheit').textContent = `${formatNumber(minF)}°F ~ ${formatNumber(maxF)}°F`;
            document.getElementById('rangeKelvin').textContent = `${formatNumber(minK)}K ~ ${formatNumber(maxK)}K`;
        }

        // 清除区间结果
        function clearRangeResults() {
            document.getElementById('rangeCelsius').textContent = '--';
            document.getElementById('rangeFahrenheit').textContent = '--';
            document.getElementById('rangeKelvin').textContent = '--';
        }

        // 清除所有
        function clearAll() {
            // 清除单值输入
            document.getElementById('celsius').value = '';
            document.getElementById('fahrenheit').value = '';
            document.getElementById('kelvin').value = '';
            
            // 清除区间输入
            document.getElementById('rangeMin').value = '';
            document.getElementById('rangeMax').value = '';
            
            // 清除结果显示
            clearSingleResults();
            clearRangeResults();
            
            // 重置单位选择
            document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.unit-btn[data-unit="celsius"]').classList.add('active');
            selectedUnit = 'celsius';
        }

        // 防止多个输入框同时输入（单值转换）
        document.getElementById('celsius').addEventListener('input', function() {
            if (this.value) {
                document.getElementById('fahrenheit').value = '';
                document.getElementById('kelvin').value = '';
            }
        });

        document.getElementById('fahrenheit').addEventListener('input', function() {
            if (this.value) {
                document.getElementById('celsius').value = '';
                document.getElementById('kelvin').value = '';
            }
        });

        document.getElementById('kelvin').addEventListener('input', function() {
            if (this.value) {
                document.getElementById('celsius').value = '';
                document.getElementById('fahrenheit').value = '';
            }
        });
    </script>
</body>
</html>
