    // 当前选中的金句类型，默认为全部
    let currentQuoteType = 'all';
    
    // 获取DOM元素
    const cardContainer = document.getElementById('cardContainer');
    const quoteTextElement = document.getElementById('quoteText');
    const quoteSourceElement = document.getElementById('quoteSource');
    const currentDateElement = document.getElementById('currentDate');
    const changeQuoteBtn = document.getElementById('changeQuoteBtn');
    const exportBtn = document.getElementById('exportBtn');
    const colorButtons = document.querySelectorAll('.color-btn');
    const quoteTypeButtons = document.querySelectorAll('.quote-type-btn');
    
    // 设置当前日期
    function setCurrentDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
    }
    
    // 随机获取金句
    function getRandomQuote(type = 'all') {
      let selectedQuotes = [];
      
      if (type === 'all') {
        // 合并所有类型的金句
        selectedQuotes = [
          ...quotes.celebrity,
          ...quotes.movie,
          ...quotes.book
        ];
      } else if (quotes[type]) {
        // 选择特定类型的金句
        selectedQuotes = quotes[type];
      }
      
      // 随机选择一条金句
      const randomIndex = Math.floor(Math.random() * selectedQuotes.length);
      const fullQuote = selectedQuotes[randomIndex];
      
      // 分离金句内容和出处
      const separatorIndex = fullQuote.lastIndexOf('—');
      if (separatorIndex === -1) {
        // 处理格式异常的情况
        return { text: fullQuote, source: '— 未知来源' };
      }
      
      const quoteText = fullQuote.substring(0, separatorIndex).trim();
      const quoteSource = fullQuote.substring(separatorIndex).trim();
      
      return { text: quoteText, source: quoteSource };
    }
    
    // 去掉分段，直接返回完整文本
    function getFullText(text) {
      return [text]; // 返回包含完整文本的数组
    }
    
    // 更新金句显示（不使用分段）
    function updateQuote() {
      const { text, source } = getRandomQuote(currentQuoteType);
      const fullText = getFullText(text);
      
      // 清空并重新构建引用文本
      quoteTextElement.innerHTML = '';
      quoteTextElement.classList.add('opacity-0', 'transition-opacity', 'duration-500');
      
      // 创建一个段落元素显示完整文本
      const textElement = document.createElement('p');
      textElement.classList.add('quote-line', 'mb-1', 'opacity-0', 'transition-all', 'duration-500', 'text-left');
      textElement.textContent = fullText[0];
      quoteTextElement.appendChild(textElement);
      
      // 显示文本
      setTimeout(() => {
        textElement.classList.remove('opacity-0');
        textElement.classList.add('opacity-100');
      }, 100);
      
      // 更新出处
      quoteSourceElement.textContent = source;
      quoteSourceElement.classList.add('opacity-0', 'transition-opacity', 'duration-500');
      
      // 显示出处
      setTimeout(() => {
        quoteTextElement.classList.remove('opacity-0');
        quoteSourceElement.classList.remove('opacity-0');
      }, 200);
    }
    
    // 更改背景颜色
    function changeBackgroundColor(colorClass) {
      // 移除所有莫兰迪色类
      Object.keys(tailwind.config.theme.extend.colors.morandi).forEach(color => {
        cardContainer.classList.remove(`bg-morandi-${color}`);
      });
      
      // 添加选中的颜色类
      cardContainer.classList.add(colorClass);
      
      // 更新活跃的颜色按钮
      colorButtons.forEach(btn => {
        btn.classList.remove('ring-4', 'ring-gray-300', 'scale-110');
      });
      document.querySelector(`.color-btn[data-color="${colorClass}"]`).classList.add('ring-4', 'ring-gray-300', 'scale-110');
    }
    
    // 导出卡片为图片
    function exportCardAsImage() {
      // 显示加载状态
      exportBtn.disabled = true;
      exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 正在导出...';
      
      html2canvas(cardContainer, {
        scale: 2, // 提高分辨率
        useCORS: true,
        logging: false,
        allowTaint: false,
        backgroundColor: null
      }).then(canvas => {
        try {
          // 创建下载链接
          const link = document.createElement('a');
          link.download = `每日金句卡片-${new Date().toLocaleDateString().replace(/\//g, '-')}.png`;
          
          // 处理不同浏览器的兼容性
          if (navigator.msSaveBlob) {
            // IE/Edge 兼容
            canvas.toBlob(blob => {
              navigator.msSaveBlob(blob, link.download);
            });
          } else {
            // 标准浏览器
            link.href = canvas.toDataURL('image/png');
            link.click();
          }
        } catch (error) {
          console.error('导出失败:', error);
          alert('导出失败，请重试');
        } finally {
          // 恢复按钮状态
          exportBtn.disabled = false;
          exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出卡片';
        }
      }).catch(error => {
        console.error('导出失败:', error);
        alert('导出失败，请重试');
        // 恢复按钮状态
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出卡片';
      });
    }
    
    // 初始化页面
    function init() {
      setCurrentDate();
      updateQuote();
      
      // 默认选中第一个颜色
      colorButtons[0].classList.add('ring-4', 'ring-gray-300', 'scale-110');
    }
    
    // 事件监听
    changeQuoteBtn.addEventListener('click', updateQuote);
    exportBtn.addEventListener('click', exportCardAsImage);
    
    // 颜色按钮点击事件
    colorButtons.forEach(button => {
      button.addEventListener('click', () => {
        const colorClass = button.getAttribute('data-color');
        changeBackgroundColor(colorClass);
      });
    });
    
    // 金句类型按钮点击事件
    quoteTypeButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentQuoteType = button.getAttribute('data-type');
        
        // 更新按钮样式
        quoteTypeButtons.forEach(btn => {
          btn.classList.remove('bg-gray-400', 'text-white');
          btn.classList.add('bg-gray-200');
        });
        button.classList.remove('bg-gray-200');
        button.classList.add('bg-gray-400', 'text-white');
        
        // 更新金句
        updateQuote();
      });
    });
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
