<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色名称挑战</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 25px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #2d3436;
            margin-bottom: 15px;
            font-size: 2.2rem;
            font-weight: 700;
        }
        
        .instructions {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.4;
            color: #444;
            border-left: 4px solid #2575fc;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .score-item {
            display: flex;
            flex-direction: column;
        }
        
        .score-value {
            font-size: 1.6rem;
            color: #2575fc;
            font-weight: 700;
        }
        
        .color-card-container {
            perspective: 1000px;
            margin: 0 auto 25px;
            width: 260px;
            height: 170px;
        }
        
        .color-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .color-card-front, .color-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .color-card-front {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
        }
        
        .color-card-back {
            transform: rotateY(180deg);
        }
        
        .color-name {
            font-size: 1.9rem;
            font-weight: bold;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
        }
        
        .feedback {
            height: 24px;
            margin: 12px 0 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .correct {
            color: #1dd1a1;
        }
        
        .incorrect {
            color: #ff6b6b;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .options {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .color-btn {
            padding: 12px 5px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f9fa;
            color: #2d3436;
            border: 2px solid #ddd;
        }
        
        .color-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: #e9ecef;
        }
        
        .color-btn:active {
            transform: translateY(1px);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        #resetBtn {
            background: #ff6b6b;
            color: white;
        }
        
        #resetBtn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        
        #newGameBtn {
            background: #4ecdc4;
            color: white;
        }
        
        #newGameBtn:hover {
            background: #38b2ac;
            transform: translateY(-2px);
        }
        
        .credits {
            color: white;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .credits a {
            color: white;
            text-decoration: none;
        }
        
        .credits a:hover {
            text-decoration: underline;
        }
        
        /* 动画效果 */
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(180deg); }
        }
        
        .flip {
            animation: flip 0.6s forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>颜色名称挑战</h1>
        
        <div class="instructions">
            <p>请选择颜色的<b>实际名称</b>，而不是卡片上显示的文字！</p>
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <span>得分</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span>尝试次数</span>
                <span id="attempts" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span>正确率</span>
                <span id="accuracy" class="score-value">0%</span>
            </div>
        </div>
        
        <div class="color-card-container">
            <div class="color-card" id="colorCard">
                <div class="color-card-front">
                    <div class="color-name">?</div>
                </div>
                <div class="color-card-back">
                    <div class="color-name" id="colorText">黑色</div>
                </div>
            </div>
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="options" id="optionsContainer">
            <!-- 颜色选项将由JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button id="resetBtn" class="control-btn">重置游戏</button>
            <button id="newGameBtn" class="control-btn">新挑战</button>
        </div>
    </div>
    
    <div class="credits">
        本游戏由 <a href="https://space.bilibili.com/123456789" target="_blank">@深圳老易</a> 使用DeepSeek制作
    </div>

    <script>
        // 颜色数据
        const colors = [
            { name: "红色", value: "#ff6b6b" },
            { name: "蓝色", value: "#4ecdc4" },
            { name: "绿色", value: "#1dd1a1" },
            { name: "黄色", value: "#feca57" },
            { name: "紫色", value: "#5f27cd" },
            { name: "橙色", value: "#ff9f43" },
            { name: "粉色", value: "#f368e0" },
            { name: "黑色", value: "#2d3436" },
            { name: "青色", value: "#00cec9" },
            { name: "棕色", value: "#a55c45" }
        ];
        
        // 游戏状态
        let score = 0;
        let attempts = 0;
        let currentColor = null;
        let currentName = null;
        
        // DOM元素
        const colorCard = document.getElementById('colorCard');
        const colorText = document.getElementById('colorText');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreElement = document.getElementById('score');
        const attemptsElement = document.getElementById('attempts');
        const accuracyElement = document.getElementById('accuracy');
        const feedbackElement = document.getElementById('feedback');
        const resetBtn = document.getElementById('resetBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        
        // 初始化游戏
        function initGame() {
            score = 0;
            attempts = 0;
            updateScoreboard();
            generateChallenge();
            createOptions();
        }
        
        // 生成新的挑战
        function generateChallenge() {
            // 随机选择一个颜色作为实际颜色
            const colorIndex = Math.floor(Math.random() * colors.length);
            currentColor = colors[colorIndex];
            
            // 随机选择一个名称（可能与实际颜色相同，也可能不同）
            const nameIndex = Math.floor(Math.random() * colors.length);
            currentName = colors[nameIndex].name;
            
            // 更新颜色卡片
            const cardBack = colorCard.querySelector('.color-card-back');
            cardBack.style.backgroundColor = currentColor.value;
            colorText.textContent = currentName;
            
            // 添加翻转动画
            colorCard.classList.remove('flip');
            setTimeout(() => {
                colorCard.classList.add('flip');
            }, 100);
            
            // 清空反馈信息
            feedbackElement.textContent = "";
            feedbackElement.className = "feedback";
        }
        
        // 创建颜色选项
        function createOptions() {
            optionsContainer.innerHTML = "";
            
            // 创建选项数组（包含正确答案和随机选项）
            const options = [currentColor.name];
            
            // 添加4个随机选项（总共5个选项）
            while (options.length < 5) {
                const randomColor = colors[Math.floor(Math.random() * colors.length)].name;
                if (!options.includes(randomColor)) {
                    options.push(randomColor);
                }
            }
            
            // 打乱选项顺序
            shuffleArray(options);
            
            // 创建选项按钮
            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'color-btn';
                button.textContent = option;
                
                button.addEventListener('click', () => {
                    checkAnswer(option);
                });
                
                optionsContainer.appendChild(button);
            });
        }
        
        // 检查答案
        function checkAnswer(selectedName) {
            attempts++;
            
            if (selectedName === currentColor.name) {
                // 正确答案
                score++;
                feedbackElement.textContent = "正确！";
                feedbackElement.className = "feedback correct";
            } else {
                // 错误答案
                feedbackElement.textContent = `错误！正确答案是：${currentColor.name}`;
                feedbackElement.className = "feedback incorrect";
            }
            
            updateScoreboard();
            
            // 1.5秒后生成新的挑战
            setTimeout(() => {
                generateChallenge();
                createOptions();
            }, 1500);
        }
        
        // 更新记分板
        function updateScoreboard() {
            scoreElement.textContent = score;
            attemptsElement.textContent = attempts;
            
            const accuracy = attempts > 0 ? Math.round((score / attempts) * 100) : 0;
            accuracyElement.textContent = `${accuracy}%`;
        }
        
        // 打乱数组顺序（Fisher-Yates洗牌算法）
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // 事件监听
        resetBtn.addEventListener('click', initGame);
        newGameBtn.addEventListener('click', () => {
            generateChallenge();
            createOptions();
        });
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
