<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹珠小游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        #game-container {
            position: relative;
            margin-top: 20px;
        }
        
        #game-canvas {
            background: #111;
            border: 2px solid #444;
            display: block;
        }
        
        #ui {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-top: 10px;
            font-size: 18px;
        }
        
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        
        .author-info {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: right;
        }
        
        .author-info a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }
        
        .author-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>弹珠小游戏</h1>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="500"></canvas>
        <div class="author-info">
            作者：文璧<br>
            <a href="/cdn-cgi/l/email-protection#5a686c6d6f6d6e6b636d6f1a2b2b74393537"><span class="__cf_email__" data-cfemail="ead8dcdddfdddedbd3dddfaa9b9bc4898587">[email&#160;protected]</span></a>
        </div>
    </div>
    <div id="ui">
        <div>分数: <span id="score">0</span></div>
        <div>弹珠: <span id="balls-left">10</span></div>
        <div>关卡: <span id="level">1</span>/3</div>
    </div>
    <button id="restart-btn">重新开始</button>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 游戏设置
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BALL_RADIUS = 10;
        const SHOOTER_RADIUS = 15;
        
        // 游戏状态
        let score = 0;
        let ballsLeft = 10;
        let level = 1;
        let maxLevel = 3;
        let balls = [];
        let bricks = [];
        let shooter = { x: canvas.width/2, y: canvas.height-20 };
        let gameRunning = true;
        
        // 关卡设计 (简化版)
        const levelDesigns = [
            // 第一关 - 非常简单
            {
                rows: 2,
                cols: 5,
                skipRate: 0.5,  // 跳过50%砖块
                colors: ['#FF5252', '#4CAF50'],
                ballSpeed: 2.5
            },
            // 第二关 - 简单
            {
                rows: 2,
                cols: 6,
                skipRate: 0.3,  // 跳过30%砖块
                colors: ['#FF5252', '#2196F3'],
                ballSpeed: 3
            },
            // 第三关 - 中等简单
            {
                rows: 3,
                cols: 6,
                skipRate: 0.2,  // 跳过20%砖块
                colors: ['#FF5252', '#FFEB3B', '#2196F3'],
                ballSpeed: 3
            }
        ];
        
        // 初始化砖块
        function initBricks() {
            bricks = [];
            const design = levelDesigns[level-1];
            
            for (let r = 0; r < design.rows; r++) {
                for (let c = 0; c < design.cols; c++) {
                    if (Math.random() > design.skipRate) {
                        const brickWidth = Math.floor((canvas.width-60)/design.cols)-5;
                        bricks.push({
                            x: 30 + c*(brickWidth + 5),
                            y: 50 + r*25,
                            width: brickWidth,
                            height: 15,
                            color: design.colors[r % design.colors.length],
                            points: 10 * (r + 1)
                        });
                    }
                }
            }
        }
        
        // 发射弹珠 (直线向上)
        function shootBall() {
            if (ballsLeft <= 0 || !gameRunning) return;
            
            balls.push({
                x: shooter.x,
                y: shooter.y - SHOOTER_RADIUS,
                radius: BALL_RADIUS,
                color: '#FF9800',
                dx: 0,  // 水平速度为零
                dy: -levelDesigns[level-1].ballSpeed  // 直线向上
            });
            
            ballsLeft--;
            updateUI();
        }
        
        // 更新游戏状态
        function update() {
            if (!gameRunning) return;
            
            // 移动弹珠
            balls.forEach(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;
                
                // 边界反弹
                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.dx = -ball.dx;
                }
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                }
                
                // 底部消失
                if (ball.y > canvas.height) {
                    ball.y = -100;
                }
            });
            
            // 碰撞检测: 弹珠 vs 砖块
            for (let i = balls.length - 1; i >= 0; i--) {
                const ball = balls[i];
                
                for (let j = bricks.length - 1; j >= 0; j--) {
                    const brick = bricks[j];
                    
                    if (ball.x + ball.radius > brick.x && 
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y && 
                        ball.y - ball.radius < brick.y + brick.height) {
                        
                        // 简单反弹
                        ball.dy = -ball.dy;
                        
                        // 移除砖块
                        score += brick.points;
                        bricks.splice(j, 1);
                        break;
                    }
                }
                
                // 移除超出屏幕的弹珠
                if (ball.y < -50) {
                    balls.splice(i, 1);
                }
            }
            
            // 检查关卡完成
            if (bricks.length === 0) {
                if (level < maxLevel) {
                    level++;
                    ballsLeft = 10; // 每关重置弹珠数量
                    initBricks();
                } else {
                    gameRunning = false;
                    alert(`恭喜通关！最终得分: ${score}`);
                }
                updateUI();
            }
            
            // 检查失败
            if (balls.length === 0 && ballsLeft === 0 && bricks.length > 0) {
                gameRunning = false;
                alert(`游戏结束！得分: ${score}`);
            }
        }
        
        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制发射器
            ctx.beginPath();
            ctx.arc(shooter.x, shooter.y, SHOOTER_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = '#FF5722';
            ctx.fill();
            ctx.closePath();
            
            // 绘制砖块
            bricks.forEach(brick => {
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
            });
            
            // 绘制弹珠
            balls.forEach(ball => {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            });
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('balls-left').textContent = ballsLeft;
            document.getElementById('level').textContent = `${level}/${maxLevel}`;
        }
        
        // 初始化游戏
        function initGame() {
            score = 0;
            level = 1;
            ballsLeft = 10;
            balls = [];
            gameRunning = true;
            initBricks();
            updateUI();
        }
        
        // 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 事件监听
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            shooter.x = Math.max(
                SHOOTER_RADIUS, 
                Math.min(canvas.width - SHOOTER_RADIUS, e.clientX - rect.left)
            );
        });
        
        canvas.addEventListener('click', shootBall);
        document.getElementById('restart-btn').addEventListener('click', initGame);
        
        // 开始游戏
        initGame();
        gameLoop();
    </script>
</body>
</html>
