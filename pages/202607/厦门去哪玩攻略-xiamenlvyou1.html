                ticket: "免费（游乐项目单独收费）",
                openTime: "全天开放（游乐项目9:00-21:00）"
            }
        ];

        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const spotName = document.getElementById('spotName');
        const spotIntro = document.getElementById('spotIntro');
        const spotAddress = document.getElementById('spotAddress');
        const spotTransport = document.getElementById('spotTransport');
        const spotTicket = document.getElementById('spotTicket');
        const spotOpenTime = document.getElementById('spotOpenTime');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');

        // 记录已显示的景点索引
        let shownIndices = [];

        // 生成随机景点
        function generateRandomSpot() {
            // 如果所有景点都已显示过，重置记录
            if (shownIndices.length >= spots.length) {
                shownIndices = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * spots.length);
            } while (shownIndices.includes(randomIndex));
            
            shownIndices.push(randomIndex);
            return spots[randomIndex];
        }

        // 显示景点信息
        function displaySpot(spot) {
            spotName.textContent = spot.name;
            spotIntro.textContent = spot.intro;
            spotAddress.textContent = spot.address;
            spotTransport.textContent = spot.transport;
            spotTicket.textContent = spot.ticket;
            spotOpenTime.textContent = spot.openTime;
            
            resultContainer.style.display = 'block';
        }

        // 按钮事件监听
        generateBtn.addEventListener('click', function() {
            const randomSpot = generateRandomSpot();
            displaySpot(randomSpot);
        });

        changeBtn.addEventListener('click', function() {
            const randomSpot = generateRandomSpot();
            displaySpot(randomSpot);
        });

        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭弹窗事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
