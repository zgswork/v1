<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片拼图小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px;
            border: 3px dashed #ddd;
            border-radius: 15px;
            background: #f9f9f9;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: #e8f0ff;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .control-btn {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #ff5252;
            transform: translateY(-1px);
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-area {
            display: none;
            text-align: center;
        }

        .puzzle-container {
            display: inline-block;
            border: 3px solid #333;
            border-radius: 10px;
            background: #f0f0f0;
            padding: 10px;
            margin: 20px auto;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: 400px;
            height: 300px;
        }

        .puzzle-piece {
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        .puzzle-piece:hover {
            border-color: #667eea;
            transform: scale(1.05);
            z-index: 10;
        }

        .puzzle-piece.dragging {
            opacity: 0.7;
            transform: rotate(5deg) scale(1.1);
            z-index: 100;
        }

        .puzzle-piece.empty {
            background: #f9f9f9;
            border-style: dashed;
            border-color: #ccc;
        }

        .puzzle-piece canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .success-message {
            display: none;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .game-content {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .reference-section {
            text-align: center;
        }

        .reference-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .reference-image {
            border: 3px solid #333;
            border-radius: 10px;
            background: #f0f0f0;
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .reference-image canvas {
            display: block;
            border-radius: 5px;
        }

        .footer {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: auto;
            backdrop-filter: blur(10px);
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .game-content {
                flex-direction: column;
                align-items: center;
            }
            
            .reference-section {
                order: -1;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 600px) {
            .puzzle-grid {
                width: 300px;
                height: 225px;
            }
            
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 图片拼图小游戏</h1>
        
        <div class="upload-section" id="uploadSection">
            <p style="margin-bottom: 20px; color: #666; font-size: 16px;">
                📸 选择一张图片开始游戏<br>
                <small>支持 JPG、PNG、GIF 格式，建议尺寸不超过 2MB</small>
            </p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                选择图片
            </button>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="game-area" id="gameArea">
            <div class="controls">
                <button class="control-btn" id="shuffleBtn">🔀 打乱</button>
                <button class="control-btn" id="resetBtn">🔄 重新开始</button>
                <button class="control-btn" id="newGameBtn">🆕 选择新图片</button>
            </div>
            
            <div class="success-message" id="successMessage">
                🎉 恭喜你完成拼图！🎉
            </div>
            
            <div class="game-content">
                <div class="puzzle-container">
                    <div class="puzzle-grid" id="puzzleGrid"></div>
                </div>
                
                <div class="reference-section">
                    <div class="reference-title">📖 参考图片</div>
                    <div class="reference-image" id="referenceImage"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>有任何问题联系作者微信：<a href="#">xd135341</a></p>
    </div>

    <script>
        class PuzzleGame {
            constructor() {
                this.pieces = [];
                this.emptyIndex = 11; // 最后一个位置为空
                this.originalImage = null;
                this.pieceWidth = 0;
                this.pieceHeight = 0;
                this.isComplete = false;
                
                this.initEventListeners();
            }

            initEventListeners() {
                const fileInput = document.getElementById('fileInput');
                const uploadSection = document.getElementById('uploadSection');
                
                fileInput.addEventListener('change', (e) => this.handleImageUpload(e));
                
                // 拖拽上传
                uploadSection.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadSection.classList.add('dragover');
                });
                
                uploadSection.addEventListener('dragleave', () => {
                    uploadSection.classList.remove('dragover');
                });
                
                uploadSection.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadSection.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0 && files[0].type.startsWith('image/')) {
                        this.processImage(files[0]);
                    }
                });

                document.getElementById('shuffleBtn').addEventListener('click', () => this.shufflePuzzle());
                document.getElementById('resetBtn').addEventListener('click', () => this.resetPuzzle());
                document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
            }

            handleImageUpload(event) {
                const file = event.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    this.processImage(file);
                }
            }

            processImage(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.originalImage = img;
                        this.createPuzzle();
                        this.showGameArea();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            createPuzzle() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                const maxWidth = 400;
                const maxHeight = 300;
                let { width, height } = this.originalImage;
                
                // 按比例缩放
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width *= ratio;
                    height *= ratio;
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(this.originalImage, 0, 0, width, height);
                
                this.pieceWidth = width / 4;
                this.pieceHeight = height / 3;
                
                // 显示参考图片
                this.showReferenceImage(canvas);
                
                // 创建拼图块
                this.pieces = [];
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 4; col++) {
                        const index = row * 4 + col;
                        if (index < 11) { // 前11块
                            const pieceCanvas = document.createElement('canvas');
                            pieceCanvas.width = this.pieceWidth;
                            pieceCanvas.height = this.pieceHeight;
                            const pieceCtx = pieceCanvas.getContext('2d');
                            
                            pieceCtx.drawImage(
                                canvas,
                                col * this.pieceWidth, row * this.pieceHeight,
                                this.pieceWidth, this.pieceHeight,
                                0, 0,
                                this.pieceWidth, this.pieceHeight
                            );
                            
                            this.pieces.push({
                                canvas: pieceCanvas,
                                correctIndex: index,
                                currentIndex: index
                            });
                        }
                    }
                }
                
                this.renderPuzzle();
                this.shufflePuzzle();
            }

            showReferenceImage(canvas) {
                const referenceContainer = document.getElementById('referenceImage');
                referenceContainer.innerHTML = '';
                
                // 创建参考图片的canvas（稍小一些）
                const referenceCanvas = document.createElement('canvas');
                const referenceCtx = referenceCanvas.getContext('2d');
                
                // 参考图片尺寸为拼图的70%
                const refWidth = canvas.width * 0.7;
                const refHeight = canvas.height * 0.7;
                
                referenceCanvas.width = refWidth;
                referenceCanvas.height = refHeight;
                referenceCtx.drawImage(canvas, 0, 0, refWidth, refHeight);
                
                referenceContainer.appendChild(referenceCanvas);
            }

            renderPuzzle() {
                const grid = document.getElementById('puzzleGrid');
                grid.innerHTML = '';
                
                for (let i = 0; i < 12; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'puzzle-piece';
                    cell.dataset.index = i;
                    
                    if (i === this.emptyIndex) {
                        cell.classList.add('empty');
                    } else {
                        const piece = this.pieces.find(p => p.currentIndex === i);
                        if (piece) {
                            // 创建新的canvas并复制内容
                            const displayCanvas = document.createElement('canvas');
                            displayCanvas.width = piece.canvas.width;
                            displayCanvas.height = piece.canvas.height;
                            const displayCtx = displayCanvas.getContext('2d');
                            displayCtx.drawImage(piece.canvas, 0, 0);
                            
                            cell.appendChild(displayCanvas);
                        }
                    }
                    
                    cell.addEventListener('click', () => this.movePiece(i));
                    grid.appendChild(cell);
                }
            }

            movePiece(clickedIndex) {
                if (this.isComplete) return;
                
                const canMove = this.canMovePiece(clickedIndex);
                if (canMove) {
                    // 交换点击的块和空白块
                    const piece = this.pieces.find(p => p.currentIndex === clickedIndex);
                    if (piece) {
                        piece.currentIndex = this.emptyIndex;
                    }
                    this.emptyIndex = clickedIndex;
                    
                    this.renderPuzzle();
                    this.checkCompletion();
                }
            }

            canMovePiece(index) {
                const row = Math.floor(index / 4);
                const col = index % 4;
                const emptyRow = Math.floor(this.emptyIndex / 4);
                const emptyCol = this.emptyIndex % 4;
                
                // 检查是否相邻
                return (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                       (Math.abs(col - emptyCol) === 1 && row === emptyRow);
            }

            shufflePuzzle() {
                this.isComplete = false;
                document.getElementById('successMessage').style.display = 'none';
                
                // 随机移动1000次来打乱
                for (let i = 0; i < 1000; i++) {
                    const possibleMoves = [];
                    for (let j = 0; j < 12; j++) {
                        if (this.canMovePiece(j)) {
                            possibleMoves.push(j);
                        }
                    }
                    
                    if (possibleMoves.length > 0) {
                        const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                        const piece = this.pieces.find(p => p.currentIndex === randomMove);
                        if (piece) {
                            piece.currentIndex = this.emptyIndex;
                        }
                        this.emptyIndex = randomMove;
                    }
                }
                
                this.renderPuzzle();
            }

            resetPuzzle() {
                this.isComplete = false;
                document.getElementById('successMessage').style.display = 'none';
                this.emptyIndex = 11;
                
                this.pieces.forEach((piece, index) => {
                    piece.currentIndex = piece.correctIndex;
                });
                
                this.renderPuzzle();
                this.shufflePuzzle();
            }

            checkCompletion() {
                const isComplete = this.pieces.every(piece => 
                    piece.currentIndex === piece.correctIndex
                ) && this.emptyIndex === 11;
                
                if (isComplete && !this.isComplete) {
                    this.isComplete = true;
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // 添加完成动画
                    setTimeout(() => {
                        const cells = document.querySelectorAll('.puzzle-piece');
                        cells.forEach((cell, index) => {
                            setTimeout(() => {
                                cell.style.animation = 'bounce 0.6s ease-in-out';
                            }, index * 50);
                        });
                    }, 500);
                }
            }

            showGameArea() {
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
            }

            newGame() {
                document.getElementById('uploadSection').style.display = 'block';
                document.getElementById('gameArea').style.display = 'none';
                document.getElementById('successMessage').style.display = 'none';
                document.getElementById('fileInput').value = '';
                this.isComplete = false;
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            new PuzzleGame();
        });
    </script>
</body>
</html>
