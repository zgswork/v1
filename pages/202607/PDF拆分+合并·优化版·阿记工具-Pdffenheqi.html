<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PDF 拆分+合并 · 优化版 · 阿记工具</title>
    <!-- 使用 PDF-lib, FileSaver, pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #c5f7b0; /* 草绿色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .card {
            max-width: 1200px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.1);
            padding: 28px 24px 20px 24px;
            border: 2px solid #e6ffe0;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #1f4f1a;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #2e7d32;
            color: white;
            font-size: 0.9rem;
            padding: 5px 14px;
            border-radius: 40px;
            font-weight: 400;
            white-space: nowrap;
        }
        .sub {
            color: #1b5e20;
            margin-bottom: 25px;
            font-size: 1rem;
            border-left: 5px solid #2e7d32;
            padding-left: 16px;
            background: rgba(70, 130, 70, 0.06);
            border-radius: 0 20px 20px 0;
        }
        /* 两栏布局 */
        .tool-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (min-width: 880px) {
            .tool-panel {
                flex-direction: row;
            }
        }
        .split-box, .merge-box {
            flex: 1;
            background: #fafff7;
            border-radius: 28px;
            padding: 22px 20px;
            box-shadow: inset 0 1px 4px #c0dbb0, 0 8px 12px -8px rgba(0, 40, 0, 0.2);
            border: 1px solid #b1de9c;
        }
        .box-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #154f11;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dashed #a5d696;
            padding-bottom: 12px;
        }
        .file-area {
            background: #e2f3d9;
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 2px dotted #5f9e4b;
        }
        .file-label {
            background: #2e7d32;
            color: white;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            display: inline-block;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,60,0,0.2);
            border: none;
        }
        .file-label:hover {
            background: #1f5f22;
            transform: translateY(-2px);
        }
        .file-info {
            margin-top: 18px;
            background: white;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.95rem;
            color: #1f3c1a;
            word-break: break-all;
            border: 1px solid #98c986;
        }
        /* 拆分区域：删除页 + 拆分按钮 同一行 */
        .split-action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin: 16px 0 8px;
        }
        .delete-pages-wrapper {
            flex: 2 1 240px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #edfae7;
            padding: 5px 12px 5px 18px;
            border-radius: 50px;
            border: 1px solid #9fcf8d;
        }
        .delete-pages-wrapper label {
            font-weight: 600;
            color: #1f5e1a;
            white-space: nowrap;
        }
        .delete-pages-wrapper input {
            flex: 1;
            padding: 12px 12px;
            border: none;
            background: transparent;
            font-size: 1rem;
            outline: none;
            min-width: 120px;
        }
        .delete-pages-wrapper input::placeholder {
            color: #8aa87d;
        }
        .split-exec-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
        }
        .btn-split-exec {
            background: #2b6e2b;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(40,80,20,0.3);
            white-space: nowrap;
        }
        .btn-split-exec:disabled {
            background: #b0cfaa;
            cursor: not-allowed;
        }
        .split-status-inline {
            background: #fff9c6;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border-left: 6px solid #689f38;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .btn-download {
            background: #1b5e20;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            width: 100%;
            margin-top: 12px;
            box-shadow: 0 4px 6px rgba(40,80,20,0.3);
        }
        .btn-download:disabled {
            background: #b0cfaa;
            cursor: not-allowed;
        }
        /* 合并列表样式 */
        .merge-list-area {
            background: #e2f3d9;
            border-radius: 28px;
            padding: 18px 15px;
            margin: 16px 0;
        }
        .merge-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            color: #0a4a0a;
        }
        .merge-files-list {
            list-style: none;
            background: white;
            border-radius: 28px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #8bb87b;
        }
        .merge-files-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f4ffee;
            border-radius: 40px;
            margin-bottom: 6px;
            border: 1px solid #c0e0b2;
            font-size: 0.9rem;
        }
        .file-name {
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .move-buttons { display: flex; gap: 6px; }
        .move-btn, .remove-btn {
            width: 36px; height: 36px;
            border-radius: 36px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .move-btn { background: #77a86f; }
        .move-btn:disabled { background: #bdd6b5; cursor: not-allowed; }
        .remove-btn { background: #c15d4b; }
        .rename-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 10px;
        }
        .rename-row input {
            flex: 2 1 200px;
            padding: 12px 18px;
            border-radius: 60px;
            border: 2px solid #a1cf91;
        }
        .btn-primary {
            background: #2b6e2b;
            color: white;
            font-weight: 600;
            padding: 14px 22px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-primary:disabled {
            background: #b0cfaa;
        }
        .status-msg {
            background: #fff9c6;
            border-radius: 40px;
            padding: 10px 18px;
            margin: 8px 0;
            font-weight: 500;
            border-left: 6px solid #689f38;
        }

        /* 预览区域 (按钮在上方) */
        .preview-section {
            margin-top: 20px;
            background: #dcedd1;
            border-radius: 30px;
            padding: 20px 20px 20px;
            border: 2px solid #79b56b;
            box-shadow: 0 8px 12px -6px #385e30;
        }
        .preview-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .preview-header-row h3 {
            color: #154f11;
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 预览控制按钮组 (位于预览框上部) */
        .preview-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #c8e4b8;
            padding: 12px 18px;
            border-radius: 60px;
        }
        .preview-btn {
            background: #2d7330;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 40px;
            min-width: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a451a;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .preview-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .preview-btn:disabled {
            background: #a1be98;
            box-shadow: none;
            transform: none;
            opacity: 0.6;
            cursor: default;
        }
        .page-input {
            width: 70px;
            text-align: center;
            padding: 10px 5px;
            font-size: 1rem;
            border-radius: 50px;
            border: 2px solid #5f914f;
            font-weight: 600;
            background: white;
        }
        .page-indicator {
            font-weight: 600;
            color: #1b4f1b;
            min-width: 120px;
            text-align: center;
            background: #ecfae4;
            padding: 8px 16px;
            border-radius: 40px;
        }
        .preview-canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f5ffef;
            border-radius: 32px;
            padding: 20px;
            border: 2px solid #9fd18b;
            margin-top: 10px;
        }
        canvas#previewCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 8px 18px rgba(0, 40, 0, 0.3);
            background: white;
            border: 1px solid #bedfb0;
        }
        .preview-placeholder {
            background: #f1fbea;
            border-radius: 30px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #56804b;
            font-size: 1.1rem;
            border: 2px dashed #8cb87a;
            padding: 20px;
        }
        /* 底部文字 */
        .footer {
            text-align: center;
            margin-top: 20px;
            border-top: 2px solid #8fc27e;
            padding-top: 18px;
        }
        .footer p {
            font-size: 1.15rem;
            font-weight: 550;
            color: #154815;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="card">
    <!-- 标题：纯文字，无图标 -->
    <h1>
        PDF分合器
        <span>阿记·JA伙伴</span>
    </h1>
    <div class="sub">🔍 拆分/合并后实时预览 · 按钮置于上方</div>

    <div class="tool-panel">
        <!-- 左侧拆分 -->
        <div class="split-box">
            <div class="box-title"><i>🔪</i> 拆分·删除页码</div>
            <div class="file-area">
                <label for="splitPdfUpload" class="file-label">📂 上传一个PDF文件</label>
                <input type="file" id="splitPdfUpload" accept=".pdf,application/pdf" />
                <div class="file-info" id="splitFileName">未选择文件</div>
            </div>

            <!-- 一行：删除页输入 + 执行拆分按钮 + 状态 -->
            <div class="split-action-row">
                <div class="delete-pages-wrapper">
                    <label>🗑️ 删除页</label>
                    <input type="text" id="pagesToDelete" placeholder="例: 1,3,5-7" value="">
                </div>
                <div class="split-exec-group">
                    <button class="btn-split-exec" id="splitBtn" disabled>⚡ 执行拆分</button>
                    <div id="splitStatusInline" class="split-status-inline" style="display: none;">就绪</div>
                </div>
            </div>
            <!-- 下载按钮单独一行 -->
            <button class="btn-download" id="downloadSplitBtn" disabled>💾 下载拆分后的PDF</button>
        </div>

        <!-- 右侧合并 -->
        <div class="merge-box">
            <div class="box-title"><i>🧩</i> 合并·排序·重命名</div>
            <div class="file-area">
                <label for="mergePdfUpload" class="file-label">📎 上传多个PDF (可多选)</label>
                <input type="file" id="mergePdfUpload" accept=".pdf,application/pdf" multiple />
                <div class="file-info" id="mergeFileCount">未选择文件</div>
            </div>
            <div class="merge-list-area" id="mergeListArea" style="display: none;">
                <div class="merge-list-header"><span>📋 顺序</span><span id="fileCountSpan">0</span></div>
                <ul class="merge-files-list" id="mergeFileList"></ul>
            </div>
            <div class="rename-row">
                <label>📛 新文件名</label>
                <input type="text" id="mergeOutputName" placeholder="合并报告.pdf" value="merged.pdf">
            </div>
            <button class="btn-primary" id="mergeBtn" disabled>🔨 执行合并</button>
            <div id="mergeStatus" class="status-msg" style="display: none;"></div>
            <button class="btn-download" id="downloadMergeBtn" disabled>💾 下载合并后的PDF</button>
        </div>
    </div>

    <!-- 预览区块：按钮移至上排 -->
    <div class="preview-section">
        <!-- 上部分：标题 + 控制按钮 -->
        <div class="preview-header-row">
            <h3>🔎 页面预览</h3>
            <!-- 五个按钮 + 页码指示器 -->
            <div class="preview-controls">
                <button class="preview-btn" id="firstPageBtn" title="首页">⏮️ 首页</button>
                <button class="preview-btn" id="prevPageBtn" title="前一页">◀ 前一页</button>
                <input type="number" id="pageJumpInput" class="page-input" min="1" value="1" step="1">
                <button class="preview-btn" id="jumpPageBtn">跳转</button>
                <button class="preview-btn" id="nextPageBtn" title="后一页">后一页 ▶</button>
                <button class="preview-btn" id="lastPageBtn" title="末页">末页 ⏭️</button>
                <span class="page-indicator" id="pageIndicator">第 0 / 0 页</span>
            </div>
        </div>
        <!-- 预览画布区 -->
        <div id="previewPlaceholder" class="preview-placeholder">
            ⚡ 完成拆分或合并后，此处显示第一页预览
        </div>
        <div id="previewCanvasContainer" class="preview-canvas-container" style="display: none;">
            <canvas id="previewCanvas"></canvas>
        </div>
    </div>

    <!-- 底部保留JA伙伴与微信 -->
    <div class="footer">
        <p>JA伙伴-阿记在做一件事 · 本工具由阿记制作 | 微信DarrenChiii</p>
    </div>
</div>

<script>
    (function() {
        // 变量定义
        let sourcePdfBytes = null;
        let splitBaseName = 'document.pdf';
        let splitProcessedBytes = null;
        
        let mergeFilesArray = [];
        let mergedResultBytes = null;

        // 预览相关
        let currentPdfData = null;
        let currentPdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 0;

        // DOM
        const splitInput = document.getElementById('splitPdfUpload');
        const splitFileNameDiv = document.getElementById('splitFileName');
        const pagesInput = document.getElementById('pagesToDelete');
        const splitBtn = document.getElementById('splitBtn');
        const splitStatusInline = document.getElementById('splitStatusInline');
        const downloadSplitBtn = document.getElementById('downloadSplitBtn');

        const mergeInput = document.getElementById('mergePdfUpload');
        const mergeFileCountDiv = document.getElementById('mergeFileCount');
        const mergeListArea = document.getElementById('mergeListArea');
        const mergeFileList = document.getElementById('mergeFileList');
        const fileCountSpan = document.getElementById('fileCountSpan');
        const mergeOutputName = document.getElementById('mergeOutputName');
        const mergeBtn = document.getElementById('mergeBtn');
        const mergeStatus = document.getElementById('mergeStatus');
        const downloadMergeBtn = document.getElementById('downloadMergeBtn');

        // 预览元素
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewCanvasContainer = document.getElementById('previewCanvasContainer');
        const previewCanvas = document.getElementById('previewCanvas');
        const pageIndicator = document.getElementById('pageIndicator');
        const firstPageBtn = document.getElementById('firstPageBtn');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const lastPageBtn = document.getElementById('lastPageBtn');
        const pageJumpInput = document.getElementById('pageJumpInput');
        const jumpPageBtn = document.getElementById('jumpPageBtn');

        // 辅助函数
        function showInlineStatus(element, msg, isSuccess = true) {
            element.style.display = 'inline-block';
            element.textContent = msg;
            element.style.background = isSuccess ? '#e2f3d9' : '#ffd9c5';
            element.style.borderLeftColor = isSuccess ? '#2e7d32' : '#b34a3a';
        }
        function hideInlineStatus(element) { element.style.display = 'none'; }

        function showStatus(element, msg, isSuccess = true) {
            element.style.display = 'block';
            element.textContent = msg;
            element.style.background = isSuccess ? '#e2f3d9' : '#ffd9c5';
            element.style.borderLeftColor = isSuccess ? '#2e7d32' : '#b34a3a';
        }
        function hideStatus(element) { element.style.display = 'none'; }

        function parsePageString(str, totalPages) {
            if (!str.trim()) return [];
            const parts = str.split(',');
            const pagesSet = new Set();
            for (let part of parts) {
                part = part.trim();
                if (/^\d+$/.test(part)) {
                    let p = parseInt(part, 10);
                    if (p >= 1 && p <= totalPages) pagesSet.add(p);
                } else if (/^\d+-\d+$/.test(part)) {
                    let [start, end] = part.split('-').map(n => parseInt(n, 10));
                    if (start > end) [start, end] = [end, start];
                    start = Math.max(1, start);
                    end = Math.min(totalPages, end);
                    for (let i = start; i <= end; i++) pagesSet.add(i);
                }
            }
            return Array.from(pagesSet).sort((a,b) => a-b);
        }

        // 合并列表渲染
        function renderMergeList() {
            const listEl = mergeFileList;
            listEl.innerHTML = '';
            if (mergeFilesArray.length === 0) {
                mergeListArea.style.display = 'none';
                mergeFileCountDiv.innerText = '未选择文件';
                fileCountSpan.innerText = '0';
                return;
            }
            mergeListArea.style.display = 'block';
            mergeFileCountDiv.innerText = `已选 ${mergeFilesArray.length} 个PDF`;
            fileCountSpan.innerText = mergeFilesArray.length;

            mergeFilesArray.forEach((item, index) => {
                const li = document.createElement('li');
                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.title = item.name;
                nameSpan.innerText = `${index+1}. ${item.name}`;
                
                const btnDiv = document.createElement('div');
                btnDiv.className = 'move-buttons';
                
                const upBtn = document.createElement('button');
                upBtn.innerHTML = '↑';
                upBtn.className = 'move-btn';
                upBtn.disabled = index === 0;
                upBtn.onclick = () => moveFile(index, -1);
                
                const downBtn = document.createElement('button');
                downBtn.innerHTML = '↓';
                downBtn.className = 'move-btn';
                downBtn.disabled = index === mergeFilesArray.length-1;
                downBtn.onclick = () => moveFile(index, 1);
                
                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '✕';
                removeBtn.className = 'remove-btn';
                removeBtn.onclick = () => removeFile(index);
                
                btnDiv.appendChild(upBtn);
                btnDiv.appendChild(downBtn);
                btnDiv.appendChild(removeBtn);
                li.appendChild(nameSpan);
                li.appendChild(btnDiv);
                listEl.appendChild(li);
            });
        }

        function moveFile(idx, delta) {
            const newIdx = idx + delta;
            if (newIdx < 0 || newIdx >= mergeFilesArray.length) return;
            [mergeFilesArray[idx], mergeFilesArray[newIdx]] = [mergeFilesArray[newIdx], mergeFilesArray[idx]];
            renderMergeList();
            mergedResultBytes = null;
            downloadMergeBtn.disabled = true;
            mergeBtn.disabled = mergeFilesArray.length === 0;
            clearPreview();
        }

        function removeFile(idx) {
            mergeFilesArray.splice(idx, 1);
            renderMergeList();
            mergedResultBytes = null;
            downloadMergeBtn.disabled = true;
            mergeBtn.disabled = mergeFilesArray.length === 0;
            if (mergeFilesArray.length === 0) hideStatus(mergeStatus);
            clearPreview();
        }

        async function addMergeFiles(fileList) {
            for (let i = 0; i < fileList.length; i++) {
                const file = fileList[i];
                if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) continue;
                const exists = mergeFilesArray.some(f => f.name === file.name && f.size === file.size);
                if (exists) continue;
                const buffer = await file.arrayBuffer();
                mergeFilesArray.push({ file, name: file.name, buffer });
            }
            renderMergeList();
            mergedResultBytes = null;
            downloadMergeBtn.disabled = true;
            mergeBtn.disabled = mergeFilesArray.length === 0;
            clearPreview();
        }

        // 预览函数
        async function renderPreviewPage(pdfData, pageNum) {
            if (!pdfData) return;
            try {
                if (currentPdfDoc) await currentPdfDoc.destroy();
                const loadingTask = pdfjsLib.getDocument({ data: pdfData });
                currentPdfDoc = await loadingTask.promise;
                totalPages = currentPdfDoc.numPages;
                if (pageNum < 1) pageNum = 1;
                if (pageNum > totalPages) pageNum = totalPages;
                currentPageNum = pageNum;

                const page = await currentPdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.2 });
                const canvas = previewCanvas;
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                previewPlaceholder.style.display = 'none';
                previewCanvasContainer.style.display = 'flex';
                pageIndicator.innerText = `第 ${currentPageNum} / ${totalPages} 页`;
                pageJumpInput.value = currentPageNum;
                pageJumpInput.max = totalPages;
            } catch (err) {
                console.warn(err);
                previewPlaceholder.style.display = 'flex';
                previewCanvasContainer.style.display = 'none';
                pageIndicator.innerText = '预览不可用';
            }
        }

        async function updatePreview(directionOrNum) {
            if (!currentPdfDoc) return;
            if (directionOrNum === 'first') currentPageNum = 1;
            else if (directionOrNum === 'last') currentPageNum = totalPages;
            else if (directionOrNum === 'prev') currentPageNum = Math.max(1, currentPageNum - 1);
            else if (directionOrNum === 'next') currentPageNum = Math.min(totalPages, currentPageNum + 1);
            else if (typeof directionOrNum === 'number') {
                if (directionOrNum >=1 && directionOrNum <= totalPages) currentPageNum = directionOrNum;
                else return;
            }
            await renderPreviewPage(currentPdfData, currentPageNum);
        }

        function clearPreview() {
            currentPdfData = null;
            if (currentPdfDoc) { currentPdfDoc.destroy(); currentPdfDoc = null; }
            previewPlaceholder.style.display = 'flex';
            previewCanvasContainer.style.display = 'none';
            pageIndicator.innerText = '第 0 / 0 页';
        }

        async function setPreviewData(pdfBytes) {
            currentPdfData = pdfBytes;
            await renderPreviewPage(pdfBytes, 1);
        }

        // 拆分事件
        splitInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) {
                splitFileNameDiv.innerText = '未选择文件';
                splitBtn.disabled = true;
                downloadSplitBtn.disabled = true;
                sourcePdfBytes = null;
                clearPreview();
                return;
            }
            splitFileNameDiv.innerText = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            splitBaseName = file.name.replace('.pdf', '') || 'document';
            sourcePdfBytes = await file.arrayBuffer();
            splitBtn.disabled = false;
            downloadSplitBtn.disabled = true;
            splitProcessedBytes = null;
            hideInlineStatus(splitStatusInline);
            clearPreview();
        });

        splitBtn.addEventListener('click', async function() {
            if (!sourcePdfBytes) return;
            hideInlineStatus(splitStatusInline);
            const pagesStr = pagesInput.value.trim();
            if (!pagesStr) {
                showInlineStatus(splitStatusInline, '⚠️ 输入页码', false);
                return;
            }
            try {
                const pdfDoc = await PDFLib.PDFDocument.load(sourcePdfBytes);
                const totalPagesOrig = pdfDoc.getPageCount();
                const toDelete = parsePageString(pagesStr, totalPagesOrig);
                if (toDelete.length === 0) {
                    showInlineStatus(splitStatusInline, '⚠️ 无效页码', false);
                    return;
                }
                const indicesToKeep = [];
                for (let i = 0; i < totalPagesOrig; i++) if (!toDelete.includes(i+1)) indicesToKeep.push(i);
                if (indicesToKeep.length === 0) {
                    showInlineStatus(splitStatusInline, '❌ 无剩余页', false);
                    return;
                }

                const newPdf = await PDFLib.PDFDocument.create();
                const copiedPages = await newPdf.copyPages(pdfDoc, indicesToKeep);
                copiedPages.forEach(page => newPdf.addPage(page));
                splitProcessedBytes = await newPdf.save();
                downloadSplitBtn.disabled = false;
                showInlineStatus(splitStatusInline, `✅ 剩余 ${indicesToKeep.length} 页`, true);
                await setPreviewData(splitProcessedBytes);
            } catch (err) {
                showInlineStatus(splitStatusInline, '❌ 处理失败', false);
                splitProcessedBytes = null; downloadSplitBtn.disabled = true;
            }
        });

        downloadSplitBtn.addEventListener('click', function() {
            if (!splitProcessedBytes) return;
            const blob = new Blob([splitProcessedBytes], { type: 'application/pdf' });
            saveAs(blob, `${splitBaseName}_去页版.pdf`);
        });

        // 合并事件
        mergeInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length) await addMergeFiles(files);
            mergeInput.value = '';
        });

        mergeBtn.addEventListener('click', async function() {
            if (mergeFilesArray.length === 0) return;
            hideStatus(mergeStatus);
            try {
                const mergedPdf = await PDFLib.PDFDocument.create();
                for (let item of mergeFilesArray) {
                    const pdf = await PDFLib.PDFDocument.load(item.buffer);
                    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    pages.forEach(page => mergedPdf.addPage(page));
                }
                mergedResultBytes = await mergedPdf.save();
                downloadMergeBtn.disabled = false;
                showStatus(mergeStatus, `✅ 合并成功！总页数: ${mergedPdf.getPageCount()}`, true);
                await setPreviewData(mergedResultBytes);
            } catch (err) {
                showStatus(mergeStatus, '❌ 合并失败', false);
                mergedResultBytes = null; downloadMergeBtn.disabled = true;
            }
        });

        downloadMergeBtn.addEventListener('click', function() {
            if (!mergedResultBytes) return;
            let filename = mergeOutputName.value.trim() || 'merged.pdf';
            if (!filename.toLowerCase().endsWith('.pdf')) filename += '.pdf';
            const blob = new Blob([mergedResultBytes], { type: 'application/pdf' });
            saveAs(blob, filename);
        });

        // 预览导航
        firstPageBtn.addEventListener('click', () => updatePreview('first'));
        prevPageBtn.addEventListener('click', () => updatePreview('prev'));
        nextPageBtn.addEventListener('click', () => updatePreview('next'));
        lastPageBtn.addEventListener('click', () => updatePreview('last'));
        jumpPageBtn.addEventListener('click', () => {
            const num = parseInt(pageJumpInput.value, 10);
            if (!isNaN(num) && currentPdfDoc && num >=1 && num <= totalPages) updatePreview(num);
        });

        // 初始禁用
        splitBtn.disabled = true; downloadSplitBtn.disabled = true;
        mergeBtn.disabled = true; downloadMergeBtn.disabled = true;
    })();
</script>
</body>
</html>
