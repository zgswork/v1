<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人账务花销记录</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .date-nav button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .date-nav button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .date-display {
            font-size: 1.2em;
            font-weight: bold;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .expense-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .expense-info p {
            color: #666;
            font-size: 0.9em;
        }

        .expense-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #e74c3c;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .summary-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .chart-container {
            margin-top: 20px;
            height: 300px;
            position: relative;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-bars {
            display: flex;
            align-items: end;
            height: 200px;
            gap: 10px;
            padding: 20px 0;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 5px 5px 0 0;
            position: relative;
            min-height: 20px;
            transition: all 0.3s;
        }

        .chart-bar:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .chart-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        .chart-bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #667eea;
            white-space: nowrap;
        }

        .chart-y-axis {
            position: absolute;
            left: 0;
            top: 0;
            height: 200px;
            width: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            padding-right: 10px;
            font-size: 12px;
            color: #666;
        }

        .date-selector {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .date-selector h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .date-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .date-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .quick-dates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .quick-date-btn {
            background: #f8f9fa;
            border: 1px solid #ddd;
            color: #666;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .quick-date-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .chart-controls button {
            flex: 1;
            padding: 10px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chart-controls button.active {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state i {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 个人账务花销记录</h1>
            <p>记录每一笔开销，让生活更有规划</p>
            <div class="date-nav">
                <button onclick="changeDate(-1)">◀ 前一天</button>
                <div class="date-display" id="currentDateDisplay"></div>
                <button onclick="changeDate(1)">后一天 ▶</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 左侧：花销录入 -->
            <div class="section">
                <h2>💳 添加花销</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label>花销名称</label>
                        <input type="text" id="expenseName" placeholder="例如：午餐、交通费" required>
                    </div>
                    <div class="form-group">
                        <label>金额（元）</label>
                        <input type="number" id="expenseAmount" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="expenseCategory">
                            <option value="餐饮">餐饮</option>
                            <option value="交通">交通</option>
                            <option value="购物">购物</option>
                            <option value="娱乐">娱乐</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <input type="text" id="expenseNote" placeholder="可选">
                    </div>
                    <button type="submit" class="btn">添加花销</button>
                </form>

                <div class="date-selector">
                    <h3>📅 快速日期</h3>
                    <div class="date-input-group">
                        <input type="date" id="dateInput" class="date-input" onchange="jumpToDate()">
                        <button class="btn" style="width: auto; padding: 10px 15px;" onclick="jumpToToday()">今天</button>
                    </div>
                    <div class="quick-dates">
                        <button class="quick-date-btn" onclick="jumpToRelativeDate(-7)">⏮ 一周前</button>
                        <button class="quick-date-btn" onclick="jumpToRelativeDate(7)">⏭ 一周后</button>
                        <button class="quick-date-btn" onclick="jumpToRelativeDate(-30)">⏮ 一月前</button>
                        <button class="quick-date-btn" onclick="jumpToRelativeDate(30)">⏭ 一月后</button>
                    </div>
                </div>
            </div>

            <!-- 中间：当日花销列表 -->
            <div class="section">
                <h2>📋 今日花销</h2>
                <div id="expenseList">
                    <div class="empty-state">
                        <i>📝</i>
                        <p>今天还没有记录花销</p>
                        <p>开始记录第一笔吧！</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：汇总和图表 -->
            <div class="section">
                <h2>📊 数据汇总</h2>
                
                <div class="summary-card">
                    <h3>今日总支出</h3>
                    <div class="summary-value" id="dailyTotal">¥0.00</div>
                </div>

                <div class="summary-card">
                    <h3>本周总支出</h3>
                    <div class="summary-value" id="weeklyTotal">¥0.00</div>
                </div>

                <div class="summary-card">
                    <h3>本月总支出</h3>
                    <div class="summary-value" id="monthlyTotal">¥0.00</div>
                </div>

                <div class="chart-controls">
                    <button class="active" onclick="switchChart('daily')">日对比</button>
                    <button onclick="switchChart('weekly')">周对比</button>
                    <button onclick="switchChart('monthly')">月对比</button>
                </div>

                <div class="chart-container">
                    <div class="chart-y-axis" id="chartYAxis"></div>
                    <div class="chart-bars" id="chartBars"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let currentChart = null;
        let currentChartType = 'daily';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateDateDisplay();
            loadExpenses();
            updateSummaries();
            renderChart();
            initDateSelector();
        });

        // 日期相关函数
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateDateDisplay() {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDateDisplay').textContent = 
                currentDate.toLocaleDateString('zh-CN', options);
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            updateDateDisplay();
            loadExpenses();
            updateSummaries();
            renderChart();
            initDateSelector();
        }

        // 数据存储相关
        function getStorageKey() {
            return `expenses_${formatDate(currentDate)}`;
        }

        function loadExpenses() {
            const key = getStorageKey();
            const expenses = JSON.parse(localStorage.getItem(key) || '[]');
            displayExpenses(expenses);
            updateDailyTotal(expenses);
        }

        function saveExpenses(expenses) {
            const key = getStorageKey();
            localStorage.setItem(key, JSON.stringify(expenses));
        }

        // 显示花销列表
        function displayExpenses(expenses) {
            const listContainer = document.getElementById('expenseList');
            
            if (expenses.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <p>今天还没有记录花销</p>
                        <p>开始记录第一笔吧！</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = expenses.map((expense, index) => `
                <div class="expense-item">
                    <div class="expense-info">
                        <h4>${expense.name}</h4>
                        <p>${expense.category}${expense.note ? ` - ${expense.note}` : ''}</p>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="expense-amount">¥${expense.amount.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteExpense(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 添加花销
        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;
            const note = document.getElementById('expenseNote').value.trim();

            if (!name || isNaN(amount) || amount <= 0) {
                alert('请填写正确的花销信息！');
                return;
            }

            const expense = { name, amount, category, note, date: formatDate(currentDate) };
            
            const key = getStorageKey();
            const expenses = JSON.parse(localStorage.getItem(key) || '[]');
            expenses.push(expense);
            
            saveExpenses(expenses);
            displayExpenses(expenses);
            updateDailyTotal(expenses);
            updateSummaries();
            renderChart();
            
            // 重置表单
            document.getElementById('expenseForm').reset();
        });

        // 删除花销
        function deleteExpense(index) {
            if (confirm('确定要删除这条记录吗？')) {
                const key = getStorageKey();
                const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                expenses.splice(index, 1);
                
                saveExpenses(expenses);
                displayExpenses(expenses);
                updateDailyTotal(expenses);
                updateSummaries();
                renderChart();
            }
        }

        // 更新汇总信息
        function updateDailyTotal(expenses) {
            const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
            document.getElementById('dailyTotal').textContent = `¥${total.toFixed(2)}`;
        }

        function updateSummaries() {
            // 周汇总
            const weekTotal = calculateWeekTotal();
            document.getElementById('weeklyTotal').textContent = `¥${weekTotal.toFixed(2)}`;
            
            // 月汇总
            const monthTotal = calculateMonthTotal();
            document.getElementById('monthlyTotal').textContent = `¥${monthTotal.toFixed(2)}`;
        }

        function calculateWeekTotal() {
            let total = 0;
            const today = new Date(currentDate);
            const dayOfWeek = today.getDay();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - dayOfWeek);
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                const key = `expenses_${formatDate(date)}`;
                const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                total += expenses.reduce((sum, expense) => sum + expense.amount, 0);
            }
            
            return total;
        }

        function calculateMonthTotal() {
            let total = 0;
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const key = `expenses_${formatDate(date)}`;
                const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                total += expenses.reduce((sum, expense) => sum + expense.amount, 0);
            }
            
            return total;
        }

        // 图表相关
        function switchChart(type) {
            currentChartType = type;
            
            // 更新按钮状态
            document.querySelectorAll('.chart-controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            // 使用传入的 event 参数
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            renderChart();
        }

        function renderChart() {
            const chartBars = document.getElementById('chartBars');
            const chartYAxis = document.getElementById('chartYAxis');
            
            let labels = [];
            let data = [];
            let maxValue = 0;

            switch (currentChartType) {
                case 'daily':
                    ({ labels, data } = getDailyComparison());
                    break;
                case 'weekly':
                    ({ labels, data } = getWeeklyComparison());
                    break;
                case 'monthly':
                    ({ labels, data } = getMonthlyComparison());
                    break;
            }

            if (data.length === 0 || Math.max(...data) === 0) {
                chartBars.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
                chartYAxis.innerHTML = '';
                return;
            }

            maxValue = Math.max(...data);
            const step = maxValue / 5;

            // 渲染Y轴
            chartYAxis.innerHTML = Array.from({length: 6}, (_, i) => 
                `<div>¥${(maxValue - i * step).toFixed(0)}</div>`
            ).join('');

            // 渲染柱状图
            chartBars.innerHTML = data.map((value, index) => {
                const height = maxValue > 0 ? (value / maxValue) * 180 : 0;
                return `
                    <div class="chart-bar" style="height: ${height}px">
                        <div class="chart-bar-value">¥${value.toFixed(0)}</div>
                        <div class="chart-bar-label">${labels[index]}</div>
                    </div>
                `;
            }).join('');
        }

        function getDailyComparison() {
            const labels = [];
            const data = [];
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date(currentDate);
                date.setDate(currentDate.getDate() - i);
                const key = `expenses_${formatDate(date)}`;
                const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
                
                labels.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
                data.push(total);
            }
            
            return { labels, data };
        }

        function getWeeklyComparison() {
            const labels = [];
            const data = [];
            
            for (let i = 3; i >= 0; i--) {
                const endDate = new Date(currentDate);
                endDate.setDate(currentDate.getDate() - i * 7);
                const startDate = new Date(endDate);
                startDate.setDate(endDate.getDate() - 6);
                
                let weekTotal = 0;
                for (let j = 0; j < 7; j++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + j);
                    const key = `expenses_${formatDate(date)}`;
                    const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                    weekTotal += expenses.reduce((sum, expense) => sum + expense.amount, 0);
                }
                
                labels.push(`第${4-i}周`);
                data.push(weekTotal);
            }
            
            return { labels, data };
        }

        function getMonthlyComparison() {
            const labels = [];
            const data = [];
            
            for (let i = 5; i >= 0; i--) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
                const year = date.getFullYear();
                const month = date.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                let monthTotal = 0;
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDate = new Date(year, month, day);
                    const key = `expenses_${formatDate(dayDate)}`;
                    const expenses = JSON.parse(localStorage.getItem(key) || '[]');
                    monthTotal += expenses.reduce((sum, expense) => sum + expense.amount, 0);
                }
                
                labels.push(date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short' }));
                data.push(monthTotal);
            }
            
            return { labels, data };
        }

        // 日期选择器相关函数
        function initDateSelector() {
            const dateInput = document.getElementById('dateInput');
            dateInput.value = formatDate(currentDate);
        }

        function jumpToDate() {
            const selectedDate = new Date(document.getElementById('dateInput').value);
            if (!isNaN(selectedDate.getTime())) {
                currentDate = selectedDate;
                updateDateDisplay();
                loadExpenses();
                updateSummaries();
                renderChart();
            }
        }

        function jumpToToday() {
            currentDate = new Date();
            updateDateDisplay();
            loadExpenses();
            updateSummaries();
            renderChart();
            initDateSelector();
        }

        function jumpToRelativeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            updateDateDisplay();
            loadExpenses();
            updateSummaries();
            renderChart();
            initDateSelector();
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('expenseForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
