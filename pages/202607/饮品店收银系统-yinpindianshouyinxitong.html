<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饮品店收银系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        .main-screen {
            display: none;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .menu-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .order-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .menu-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: translateY(-2px);
        }

        .btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #1976d2;
        }

        .btn-success {
            background: #4caf50;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-warning {
            background: #ff9800;
        }

        .btn-warning:hover {
            background: #f57c00;
        }

        .order-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            color: #2196f3;
            text-align: center;
            margin: 20px 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .recipe {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .time-display {
            font-size: 18px;
            color: #666;
            margin-left: 20px;
        }

        .promotion-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .promotion-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .menu-item.out-of-stock {
            opacity: 0.5;
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .menu-item.out-of-stock:hover {
            background: #f5f5f5;
            border-color: #e9ecef;
            transform: none;
        }

        .price-edit {
            display: inline-block;
            background: none;
            border: 1px dashed #2196f3;
            color: #2196f3;
            font-weight: bold;
            font-size: 18px;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            min-width: 60px;
            text-align: center;
        }

        .price-edit:focus {
            outline: none;
            border: 2px solid #2196f3;
            background: white;
        }

        .management-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            margin: 0;
        }

        .discount-badge {
            background: #ff4444;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 5px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .form-row {
                flex-direction: column;
            }

            .form-row input,
            .form-row select {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 30px; color: #333;">饮品店收银系统</h2>
            <input type="text" id="username" placeholder="用户名" />
            <input type="password" id="password" placeholder="密码" />
            <button class="btn" onclick="login()" style="width: 100%; margin-top: 20px;">登录</button>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainScreen" class="main-screen">
        <div class="container">
            <div class="header">
                <div>
                    <h1>饮品店收银系统</h1>
                    <div class="time-display" id="timeDisplay"></div>
                </div>
                <div>
                    <button class="btn" onclick="showManagement()">商品管理</button>
                    <button class="btn btn-warning" onclick="showRecipes()">查看配方</button>
                    <button class="btn" onclick="showStats()">营业统计</button>
                    <button class="btn btn-danger" onclick="logout()">退出登录</button>
                </div>
            </div>

            <div class="content">
                <div class="menu-section">
                    <!-- 优惠活动区域 -->
                    <div class="promotion-section">
                        <h4>🎉 优惠活动</h4>
                        <div class="promotion-item">
                            <span>满50减5元</span>
                            <label class="switch">
                                <input type="checkbox" id="promotion1" onchange="togglePromotion('promotion1')">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="promotion-item">
                            <span>第二杯半价</span>
                            <label class="switch">
                                <input type="checkbox" id="promotion2" onchange="togglePromotion('promotion2')">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="promotion-item">
                            <span>买三送一</span>
                            <label class="switch">
                                <input type="checkbox" id="promotion3" onchange="togglePromotion('promotion3')">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="promotion-item">
                            <span>会员9折</span>
                            <label class="switch">
                                <input type="checkbox" id="promotion4" onchange="togglePromotion('promotion4')">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <h3>饮品菜单</h3>
                    <div class="menu-grid" id="menuGrid">
                        <!-- 菜单项将通过JavaScript动态生成 -->
                    </div>
                </div>

                <div class="order-section">
                    <h3>当前订单</h3>
                    <div class="order-list" id="orderList">
                        <!-- 订单项将通过JavaScript动态生成 -->
                    </div>
                    <div id="promotionInfo"
                        style="background: #e8f5e8; padding: 10px; border-radius: 5px; margin: 10px 0; display: none;">
                        <small id="promotionText"></small>
                    </div>
                    <div class="total" id="totalAmount">总计: ¥0.00</div>
                    <div style="margin: 10px 0;">
                        <label>
                            <input type="checkbox" id="memberDiscount" onchange="updateOrderDisplay()"> 会员折扣
                        </label>
                    </div>
                    <button class="btn btn-success" onclick="checkout()"
                        style="width: 100%; margin-bottom: 10px;">结账</button>
                    <button class="btn btn-danger" onclick="clearOrder()" style="width: 100%;">清空订单</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 配方查看模态框 -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('recipeModal')">&times;</span>
            <h2>饮品配方</h2>
            <input type="password" id="recipePassword" placeholder="请输入配方查看密码" style="margin-bottom: 20px;" />
            <button class="btn" onclick="verifyRecipePassword()">确认</button>
            <div id="recipeContent" class="hidden">
                <!-- 配方内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 统计模态框 -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('statsModal')">&times;</span>
            <h2>营业统计</h2>
            <div style="margin-bottom: 20px;">
                <button class="btn" onclick="showDailyStats()">日结</button>
                <button class="btn" onclick="showMonthlyStats()">月结</button>
            </div>
            <div id="statsContent">
                <!-- 统计内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 商品管理模态框 -->
    <div id="managementModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('managementModal')">&times;</span>
            <h2>商品管理</h2>

            <div class="management-section">
                <h3>添加新饮品</h3>
                <div class="form-row">
                    <input type="text" id="newItemName" placeholder="饮品名称">
                    <input type="number" id="newItemPrice" placeholder="价格" step="0.01">
                    <select id="newItemCategory">
                        <option value="奶茶">奶茶</option>
                        <option value="果茶">果茶</option>
                        <option value="咖啡">咖啡</option>
                        <option value="奶昔">奶昔</option>
                        <option value="汽水">汽水</option>
                        <option value="其他">其他</option>
                    </select>
                    <button class="btn" onclick="addNewItem()">添加</button>
                </div>
            </div>

            <div class="management-section">
                <h3>商品列表</h3>
                <div id="itemManagementList">
                    <!-- 商品管理列表将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

                20: { name: '抹茶奶昔', ingredients: '香草冰淇淋150g + 牛奶200ml + 抹茶粉15g + 糖浆20ml', steps: '1.抹茶粉过筛 2.与少量牛奶调匀 3.加入其他材料搅拌 4.打至顺滑' },
                21: { name: '柠檬汽水', ingredients: '苏打水400ml + 新鲜柠檬汁50ml + 糖浆30ml + 冰块适量', steps: '1.柠檬榨汁 2.加入糖浆调匀 3.倒入苏打水 4.加冰块' },
                22: { name: '可乐', ingredients: '可乐500ml + 冰块适量', steps: '1.准备冰镇可乐 2.加入冰块 3.直接享用' },
                23: { name: '雪碧', ingredients: '雪碧500ml + 冰块适量', steps: '1.准备冰镇雪碧 2.加入冰块 3.直接享用' },
                24: { name: '橙汁汽水', ingredients: '苏打水350ml + 新鲜橙汁100ml + 糖浆25ml + 冰块适量', steps: '1.橙子榨汁 2.与糖浆混合 3.加入苏打水 4.加冰完成' }
            }
        };

        // 时间显示功能
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const timeDisplay = document.getElementById('timeDisplay');
            if (timeDisplay) {
                timeDisplay.textContent = timeString;
            }
        }

        // 登录功能
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (systemData.users[username] && systemData.users[username] === password) {
                systemData.currentUser = username;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                initializeMenu();
                // 启动时间更新
                setInterval(updateTime, 1000);
                updateTime();
            } else {
                alert('用户名或密码错误！');
            }
        }

        // 退出登录
        function logout() {
            systemData.currentUser = null;
            systemData.currentOrder = [];
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            updateOrderDisplay();
        }

        // 初始化菜单
        function initializeMenu() {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '';

            systemData.menu.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = item.available ? 'menu-item' : 'menu-item out-of-stock';

                let discountBadge = '';
                if (systemData.promotions.promotion2 && systemData.currentOrder.filter(orderItem => orderItem.id === item.id).length > 0) {
                    discountBadge = '<span class="discount-badge">第二杯半价</span>';
                }

                menuItem.innerHTML = `
                    <h4>${item.name}${!item.available ? ' (缺货)' : ''}${discountBadge}</h4>
                    <p style="color: #666; margin: 5px 0;">${item.category}</p>
                    <p style="color: #2196f3; font-weight: bold; font-size: 18px;">
                        ¥<input type="number" class="price-edit" value="${item.price}" step="0.01" 
                               onchange="updatePrice(${item.id}, this.value)" 
                               onclick="event.stopPropagation()">
                    </p>
                `;

                if (item.available) {
                    menuItem.onclick = () => addToOrder(item);
                }
                menuGrid.appendChild(menuItem);
            });
        }

        // 更新价格
        function updatePrice(itemId, newPrice) {
            const price = parseFloat(newPrice);
            if (price > 0) {
                const item = systemData.menu.find(item => item.id === itemId);
                if (item) {
                    item.price = price;
                    saveMenuData();
                    updateOrderDisplay(); // 更新订单中的价格显示
                }
            }
        }

        // 保存菜单数据
        function saveMenuData() {
            localStorage.setItem('menuData', JSON.stringify(systemData.menu));
        }

        // 添加到订单
        function addToOrder(item) {
            const existingItem = systemData.currentOrder.find(orderItem => orderItem.id === item.id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                systemData.currentOrder.push({
                    ...item,
                    quantity: 1
                });
            }

            updateOrderDisplay();
        }

        // 更新订单显示
        function updateOrderDisplay() {
            const orderList = document.getElementById('orderList');
            const totalAmount = document.getElementById('totalAmount');
            const promotionInfo = document.getElementById('promotionInfo');
            const promotionText = document.getElementById('promotionText');

            orderList.innerHTML = '';
            let subtotal = 0;
            let discount = 0;
            let promotionMessages = [];

            // 计算小计
            systemData.currentOrder.forEach((item, index) => {
                // 更新订单中商品的当前价格
                const menuItem = systemData.menu.find(m => m.id === item.id);
                if (menuItem) {
                    item.price = menuItem.price;
                }

                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                orderItem.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>¥${item.price} × ${item.quantity}</small>
                    </div>
                    <div>
                        <button onclick="changeQuantity(${index}, -1)" style="background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 3px; margin-right: 5px;">-</button>
                        <button onclick="changeQuantity(${index}, 1)" style="background: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 3px; margin-right: 5px;">+</button>
                        <button onclick="removeFromOrder(${index})" style="background: #ff9800; color: white; border: none; padding: 5px 10px; border-radius: 3px;">删除</button>
                    </div>
                `;
                orderList.appendChild(orderItem);
                subtotal += item.price * item.quantity;
            });

            // 应用优惠
            let finalTotal = subtotal;

            // 满50减5元
            if (systemData.promotions.promotion1 && subtotal >= 50) {
                discount += 5;
                promotionMessages.push('满50减5元: -¥5.00');
            }

            // 第二杯半价
            if (systemData.promotions.promotion2) {
                const itemCounts = {};
                systemData.currentOrder.forEach(item => {
                    itemCounts[item.id] = (itemCounts[item.id] || 0) + item.quantity;
                });

                Object.entries(itemCounts).forEach(([itemId, count]) => {
                    if (count >= 2) {
                        const item = systemData.menu.find(m => m.id == itemId);
                        const halfPriceCount = Math.floor(count / 2);
                        const halfPriceDiscount = item.price * 0.5 * halfPriceCount;
                        discount += halfPriceDiscount;
                        promotionMessages.push(`${item.name} 第二杯半价: -¥${halfPriceDiscount.toFixed(2)}`);
                    }
                });
            }

            // 买三送一
            if (systemData.promotions.promotion3) {
                const totalItems = systemData.currentOrder.reduce((sum, item) => sum + item.quantity, 0);
                if (totalItems >= 4) {
                    const freeItems = Math.floor(totalItems / 4);
                    // 找最便宜的商品免费
                    const sortedOrder = [...systemData.currentOrder].sort((a, b) => a.price - b.price);
                    let freeDiscount = 0;
                    let remainingFree = freeItems;

                    for (let item of sortedOrder) {
                        if (remainingFree <= 0) break;
                        const freeFromThis = Math.min(remainingFree, item.quantity);
                        freeDiscount += item.price * freeFromThis;
                        remainingFree -= freeFromThis;
                    }

                    discount += freeDiscount;
                    promotionMessages.push(`买三送一: -¥${freeDiscount.toFixed(2)}`);
                }
            }

            // 会员9折
            const memberDiscount = document.getElementById('memberDiscount').checked;
            if ((systemData.promotions.promotion4 && memberDiscount) || memberDiscount) {
                const memberDiscountAmount = (subtotal - discount) * 0.1;
                discount += memberDiscountAmount;
                promotionMessages.push(`会员9折: -¥${memberDiscountAmount.toFixed(2)}`);
            }

            finalTotal = subtotal - discount;

            // 显示优惠信息
            if (promotionMessages.length > 0) {
                promotionInfo.style.display = 'block';
                promotionText.innerHTML = promotionMessages.join('<br>');
            } else {
                promotionInfo.style.display = 'none';
            }

            totalAmount.innerHTML = `
                ${discount > 0 ? `<div style="font-size: 16px; color: #666;">小计: ¥${subtotal.toFixed(2)}</div>
                <div style="font-size: 16px; color: #f44336;">优惠: -¥${discount.toFixed(2)}</div>` : ''}
                <div style="font-size: 24px; font-weight: bold; color: #2196f3;">总计: ¥${finalTotal.toFixed(2)}</div>
            `;

            // 刷新菜单显示（更新第二杯半价标识）
            if (systemData.promotions.promotion2) {
                initializeMenu();
            }
        }

        // 修改数量
        function changeQuantity(index, change) {
            systemData.currentOrder[index].quantity += change;
            if (systemData.currentOrder[index].quantity <= 0) {
                systemData.currentOrder.splice(index, 1);
            }
            updateOrderDisplay();
        }

        // 从订单中移除
        function removeFromOrder(index) {
            systemData.currentOrder.splice(index, 1);
            updateOrderDisplay();
        }

        // 清空订单
        function clearOrder() {
            if (confirm('确定要清空当前订单吗？')) {
                systemData.currentOrder = [];
                updateOrderDisplay();
            }
        }

        // 结账
        function checkout() {
            if (systemData.currentOrder.length === 0) {
                alert('订单为空，无法结账！');
                return;
            }

            // 重新计算最终金额（包含优惠）
            let subtotal = systemData.currentOrder.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let discount = 0;
            let appliedPromotions = [];

            // 应用所有优惠计算
            if (systemData.promotions.promotion1 && subtotal >= 50) {
                discount += 5;
                appliedPromotions.push('满50减5元');
            }

            if (systemData.promotions.promotion2) {
                const itemCounts = {};
                systemData.currentOrder.forEach(item => {
                    itemCounts[item.id] = (itemCounts[item.id] || 0) + item.quantity;
                });

                Object.entries(itemCounts).forEach(([itemId, count]) => {
                    if (count >= 2) {
                        const item = systemData.menu.find(m => m.id == itemId);
                        const halfPriceCount = Math.floor(count / 2);
                        discount += item.price * 0.5 * halfPriceCount;
                        appliedPromotions.push('第二杯半价');
                    }
                });
            }

            if (systemData.promotions.promotion3) {
                const totalItems = systemData.currentOrder.reduce((sum, item) => sum + item.quantity, 0);
                if (totalItems >= 4) {
                    const freeItems = Math.floor(totalItems / 4);
                    const sortedOrder = [...systemData.currentOrder].sort((a, b) => a.price - b.price);
                    let freeDiscount = 0;
                    let remainingFree = freeItems;

                    for (let item of sortedOrder) {
                        if (remainingFree <= 0) break;
                        const freeFromThis = Math.min(remainingFree, item.quantity);
                        freeDiscount += item.price * freeFromThis;
                        remainingFree -= freeFromThis;
                    }
                    discount += freeDiscount;
                    appliedPromotions.push('买三送一');
                }
            }

            const memberDiscount = document.getElementById('memberDiscount').checked;
            if ((systemData.promotions.promotion4 && memberDiscount) || memberDiscount) {
                const memberDiscountAmount = (subtotal - discount) * 0.1;
                discount += memberDiscountAmount;
                appliedPromotions.push('会员9折');
            }

            const finalTotal = subtotal - discount;

            const orderData = {
                id: Date.now(),
                items: [...systemData.currentOrder],
                subtotal: subtotal,
                discount: discount,
                total: finalTotal,
                appliedPromotions: appliedPromotions,
                timestamp: new Date().toISOString(),
                cashier: systemData.currentUser
            };

            systemData.salesHistory.push(orderData);
            localStorage.setItem('salesHistory', JSON.stringify(systemData.salesHistory));

            let alertMessage = `结账成功！\n订单号: ${orderData.id}\n`;
            if (discount > 0) {
                alertMessage += `小计: ¥${subtotal.toFixed(2)}\n优惠: -¥${discount.toFixed(2)}\n`;
                alertMessage += `优惠活动: ${appliedPromotions.join(', ')}\n`;
            }
            alertMessage += `实付金额: ¥${finalTotal.toFixed(2)}`;

            alert(alertMessage);

            systemData.currentOrder = [];
            document.getElementById('memberDiscount').checked = false;
            updateOrderDisplay();
        }

        // 显示配方
        function showRecipes() {
            document.getElementById('recipeModal').style.display = 'block';
            document.getElementById('recipePassword').value = '';
            document.getElementById('recipeContent').classList.add('hidden');
        }

        // 验证配方密码
        function verifyRecipePassword() {
            const password = document.getElementById('recipePassword').value;

            if (password === systemData.recipePassword) {
                document.getElementById('recipeContent').classList.remove('hidden');
                displayRecipes();
            } else {
                alert('密码错误！');
            }
        }

        // 显示配方内容
        function displayRecipes() {
            const recipeContent = document.getElementById('recipeContent');
            recipeContent.innerHTML = '<h3>饮品配方大全</h3>';

            Object.values(systemData.recipes).forEach(recipe => {
                const recipeDiv = document.createElement('div');
                recipeDiv.className = 'recipe';
                recipeDiv.innerHTML = `
                    <h4>${recipe.name}</h4>
                    <p><strong>配料：</strong>${recipe.ingredients}</p>
                    <p><strong>制作步骤：</strong>${recipe.steps}</p>
                `;
                recipeContent.appendChild(recipeDiv);
            });
        }

        // 显示统计
        function showStats() {
            document.getElementById('statsModal').style.display = 'block';
            showDailyStats();
        }

        // 日结统计
        function showDailyStats() {
            const today = new Date().toDateString();
            const todaySales = systemData.salesHistory.filter(sale =>
                new Date(sale.timestamp).toDateString() === today
            );

            const totalRevenue = todaySales.reduce((sum, sale) => sum + sale.total, 0);
            const totalOrders = todaySales.length;

            const statsContent = document.getElementById('statsContent');
            statsContent.innerHTML = `
                <h3>今日营业统计 (${today})</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>总订单数</h4>
                        <p style="font-size: 24px; color: #2196f3;">${totalOrders}</p>
                    </div>
                    <div class="stat-card">
                        <h4>总营业额</h4>
                        <p style="font-size: 24px; color: #4caf50;">¥${totalRevenue.toFixed(2)}</p>
                    </div>
                    <div class="stat-card">
                        <h4>平均客单价</h4>
                        <p style="font-size: 24px; color: #ff9800;">¥${totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(2) : '0.00'}</p>
                    </div>
                </div>
            `;

            if (todaySales.length > 0) {
                statsContent.innerHTML += '<h4>今日订单详情</h4>';
                todaySales.forEach(sale => {
                    const saleDiv = document.createElement('div');
                    saleDiv.style.cssText = 'background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px;';
                    let promotionInfo = '';
                    if (sale.discount && sale.discount > 0) {
                        promotionInfo = `<p><strong>优惠:</strong> -¥${sale.discount.toFixed(2)} (${sale.appliedPromotions ? sale.appliedPromotions.join(', ') : ''})</p>`;
                    }
                    saleDiv.innerHTML = `
                        <p><strong>订单号:</strong> ${sale.id}</p>
                        <p><strong>时间:</strong> ${new Date(sale.timestamp).toLocaleString()}</p>
                        <p><strong>收银员:</strong> ${sale.cashier}</p>
                        ${sale.subtotal ? `<p><strong>小计:</strong> ¥${sale.subtotal.toFixed(2)}</p>` : ''}
                        ${promotionInfo}
                        <p><strong>实付金额:</strong> ¥${sale.total.toFixed(2)}</p>
                        <p><strong>商品:</strong> ${sale.items.map(item => `${item.name}×${item.quantity}`).join(', ')}</p>
                    `;
                    statsContent.appendChild(saleDiv);
                });
            }
        }

        // 月结统计
        function showMonthlyStats() {
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            const monthlySales = systemData.salesHistory.filter(sale => {
                const saleDate = new Date(sale.timestamp);
                return saleDate.getMonth() === currentMonth && saleDate.getFullYear() === currentYear;
            });

            const totalRevenue = monthlySales.reduce((sum, sale) => sum + sale.total, 0);
            const totalOrders = monthlySales.length;

            // 按日期分组统计
            const dailyStats = {};
            monthlySales.forEach(sale => {
                const date = new Date(sale.timestamp).toDateString();
                if (!dailyStats[date]) {
                    dailyStats[date] = { orders: 0, revenue: 0 };
                }
                dailyStats[date].orders += 1;
                dailyStats[date].revenue += sale.total;
            });

            const statsContent = document.getElementById('statsContent');
            statsContent.innerHTML = `
                <h3>本月营业统计 (${currentYear}年${currentMonth + 1}月)</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>总订单数</h4>
                        <p style="font-size: 24px; color: #2196f3;">${totalOrders}</p>
                    </div>
                    <div class="stat-card">
                        <h4>总营业额</h4>
                        <p style="font-size: 24px; color: #4caf50;">¥${totalRevenue.toFixed(2)}</p>
                    </div>
                    <div class="stat-card">
                        <h4>平均客单价</h4>
                        <p style="font-size: 24px; color: #ff9800;">¥${totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(2) : '0.00'}</p>
                    </div>
                    <div class="stat-card">
                        <h4>营业天数</h4>
                        <p style="font-size: 24px; color: #9c27b0;">${Object.keys(dailyStats).length}</p>
                    </div>
                </div>
            `;

            if (Object.keys(dailyStats).length > 0) {
                statsContent.innerHTML += '<h4>每日营业统计</h4>';
                Object.entries(dailyStats).forEach(([date, stats]) => {
                    const dayDiv = document.createElement('div');
                    dayDiv.style.cssText = 'background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; display: flex; justify-content: space-between;';
                    dayDiv.innerHTML = `
                        <span>${date}</span>
                        <span>订单: ${stats.orders} | 营业额: ¥${stats.revenue.toFixed(2)}</span>
                    `;
                    statsContent.appendChild(dayDiv);
                });
            }
        }

        // 优惠活动切换
        function togglePromotion(promotionId) {
            systemData.promotions[promotionId] = document.getElementById(promotionId).checked;
            updateOrderDisplay(); // 重新计算订单
        }

        // 显示商品管理
        function showManagement() {
            document.getElementById('managementModal').style.display = 'block';
            updateManagementList();
        }

        // 添加新商品
        function addNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const price = parseFloat(document.getElementById('newItemPrice').value);
            const category = document.getElementById('newItemCategory').value;

            if (!name || !price || price <= 0) {
                alert('请填写完整的商品信息！');
                return;
            }

            const newId = Math.max(...systemData.menu.map(item => item.id)) + 1;
            const newItem = {
                id: newId,
                name: name,
                price: price,
                category: category,
                available: true
            };

            systemData.menu.push(newItem);
            saveMenuData();
            initializeMenu();
            updateManagementList();

            // 清空输入框
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            document.getElementById('newItemCategory').value = '奶茶';

            alert('商品添加成功！');
        }

        // 更新商品管理列表
        function updateManagementList() {
            const list = document.getElementById('itemManagementList');
            list.innerHTML = '';

            systemData.menu.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin: 5px 0;';
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.name}</strong> - ${item.category} - ¥${item.price}
                        ${!item.available ? ' <span style="color: red;">(缺货)</span>' : ''}
                    </div>
                    <div>
                        <button class="btn" onclick="toggleAvailability(${item.id})" style="margin-right: 5px; padding: 5px 10px; font-size: 12px;">
                            ${item.available ? '下架' : '上架'}
                        </button>
                        <button class="btn btn-danger" onclick="deleteItem(${item.id})" style="padding: 5px 10px; font-size: 12px;">
                            删除
                        </button>
                    </div>
                `;
                list.appendChild(itemDiv);
            });
        }

        // 切换商品上下架状态
        function toggleAvailability(itemId) {
            const item = systemData.menu.find(item => item.id === itemId);
            if (item) {
                item.available = !item.available;
                saveMenuData();
                initializeMenu();
                updateManagementList();

                // 如果商品下架，从当前订单中移除
                if (!item.available) {
                    systemData.currentOrder = systemData.currentOrder.filter(orderItem => orderItem.id !== itemId);
                    updateOrderDisplay();
                }
            }
        }

        // 删除商品
        function deleteItem(itemId) {
            if (confirm('确定要删除这个商品吗？此操作不可恢复！')) {
                systemData.menu = systemData.menu.filter(item => item.id !== itemId);
                saveMenuData();
                initializeMenu();
                updateManagementList();

                // 从当前订单中移除已删除的商品
                systemData.currentOrder = systemData.currentOrder.filter(orderItem => orderItem.id !== itemId);
                updateOrderDisplay();

                alert('商品删除成功！');
            }
        }

        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function (event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化菜单数据（如果本地存储为空，则使用默认数据）
            if (!localStorage.getItem('menuData')) {
                saveMenuData();
            }

            // 如果已经登录，启动时间显示
            if (systemData.currentUser) {
                setInterval(updateTime, 1000);
                updateTime();
            }
        });
    </script>
</body>

</html>
