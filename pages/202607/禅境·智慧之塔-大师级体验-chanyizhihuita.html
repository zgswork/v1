<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>禅境·智慧之塔 - 大师级体验</title>
    <meta name="description" content="沉浸式禅意汉诺塔，融合东方美学与现代交互的极致体验">
    <meta name="keywords" content="禅意游戏,汉诺塔,东方美学,沉浸式体验">
    <meta name="author" content="林义贵|2547999170@qq.com">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700&display=swap');
        
        :root {
            --zen-primary: #8B5A3C;
            --zen-secondary: #D4A574;
            --zen-accent: #F5E6D3;
            --zen-dark: #1a1a2e;
            --zen-light: #FEFEFE;
            --zen-gold: #D4AF37;
            --zen-shadow: rgba(139, 90, 60, 0.15);
            --transition-normal: 0.4s;
            --transition-fast: 0.2s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 动态背景 */
        .zen-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(212, 165, 116, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 90, 60, 0.1) 0%, transparent 50%);
            animation: zenFloat 20s ease-in-out infinite;
        }
        
        @keyframes zenFloat {
            0%, 100% { transform: translateX(0) translateY(0) scale(1); }
            50% { transform: translateX(30px) translateY(-30px) scale(1.1); }
        }
        
        .zen-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
        }
        
        .zen-header {
            text-align: center;
            padding: 20px;
            background: rgba(44, 24, 16, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(212, 165, 116, 0.2);
        }
        
        .zen-title {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 200;
            color: var(--zen-accent);
            margin-bottom: 8px;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(212, 165, 116, 0.3);
        }
        
        .zen-subtitle {
            font-size: clamp(14px, 2.5vw, 18px);
            color: var(--zen-secondary);
            font-weight: 300;
            opacity: 0.8;
        }
        
        .zen-game-area {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap: 30px;
            align-items: center;
        }
        
        .zen-panel {
            background: rgba(44, 24, 16, 0.4);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(212, 165, 116, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .zen-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(245, 230, 211, 0.1);
            border-radius: 10px;
        }
        
        .zen-stat-label {
            font-size: 14px;
            color: var(--zen-secondary);
        }
        
        .zen-stat-value {
            font-size: 18px;
            font-weight: 500;
            color: var(--zen-gold);
            font-family: 'Inter', sans-serif;
        }
        
        .zen-difficulty {
            margin: 20px 0;
        }
        
        .zen-difficulty-title {
            color: var(--zen-accent);
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .zen-difficulty-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            background: linear-gradient(135deg, rgba(139, 90, 60, 0.3), rgba(212, 165, 116, 0.3));
            color: var(--zen-accent);
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-family: 'Noto Serif SC', serif;
        }
        
        .zen-difficulty-btn.active {
            background: linear-gradient(135deg, var(--zen-gold), #f4d03f);
            color: var(--zen-dark);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        
        .zen-towers-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 400px;
            background: rgba(26, 26, 46, 0.3);
            border-radius: 30px;
            padding: 30px;
            position: relative;
        }
        
        .zen-tower {
            flex: 1;
            max-width: 150px;
            height: 100%;
            position: relative;
            cursor: pointer;
            transition: all var(--transition-normal);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 116, 0.2);
            margin: 0 10px;
        }
        
        .zen-tower:hover {
            background: rgba(212, 165, 116, 0.1);
            transform: translateY(-8px);
        }
        
        .zen-tower.selected {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            transform: translateY(-5px);
        }
        
        .zen-tower-pole {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 70%;
            background: linear-gradient(to top, var(--zen-primary), var(--zen-secondary));
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(139, 90, 60, 0.3);
        }
        
        .zen-tower-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, var(--zen-primary), var(--zen-secondary));
            border-radius: 6px;
        }
        
        .zen-disk {
            position: absolute;
            height: 26px;
            border-radius: 13px;
            background: linear-gradient(135deg, 
                rgba(139, 90, 60, 0.9), 
                rgba(212, 165, 116, 0.7),
                rgba(245, 230, 211, 0.5));
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all var(--transition-normal);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--zen-light);
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 165, 116, 0.3);
        }
        
        .zen-disk.dragging {
            z-index: 1000;
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            cursor: grabbing;
        }
        
        .zen-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .zen-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition-normal);
            min-width: 120px;
        }
        
        .zen-btn-primary {
            background: linear-gradient(135deg, var(--zen-primary), var(--zen-secondary));
            color: var(--zen-light);
            box-shadow: 0 4px 15px rgba(139, 90, 60, 0.3);
        }
        
        .zen-btn-secondary {
            background: transparent;
            color: var(--zen-secondary);
            border: 1px solid var(--zen-secondary);
        }
        
        .zen-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .zen-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 24, 16, 0.9);
            color: var(--zen-accent);
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid var(--zen-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            font-size: 18px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        
        .zen-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .zen-petal {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, var(--zen-gold), #f4d03f);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            animation: petalFall 4s ease-in-out forwards;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        @keyframes petalFall {
            0% {
                transform: translateY(-100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-90vh) rotate(36deg) scale(1);
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .zen-game-area {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                gap: 20px;
            }
            
            .zen-towers-container {
                height: 300px;
                padding: 20px;
            }
            
            .zen-tower {
                max-width: 100px;
            }
            
            .zen-disk {
                height: 22px;
                font-size: 12px;
            }
            
            .zen-panel {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 10px;
            }
        }
        
        .zen-author {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: var(--zen-secondary);
            font-size: 12px;
            opacity: 0.7;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="zen-bg"></div>
    
    <div class="zen-container">
        <header class="zen-header">
            <h1 class="zen-title">禅境·智慧之塔</h1>
            <p class="zen-subtitle">心若止水，智慧自生</p>
        </header>
        
        <div class="zen-game-area">
            <aside class="zen-panel">
                <div class="zen-stat">
                    <span class="zen-stat-label">步数</span>
                    <span class="zen-stat-value" id="moves">0</span>
                </div>
                <div class="zen-stat">
                    <span class="zen-stat-label">时间</span>
                    <span class="zen-stat-value" id="timer">00:00</span>
                </div>
                <div class="zen-stat">
                    <span class="zen-stat-label">最优</span>
                    <span class="zen-stat-value" id="optimal">7</span>
                </div>
                
                <div class="zen-difficulty">
                    <h3 class="zen-difficulty-title">修行境界</h3>
                    <button class="zen-difficulty-btn active" data-level="3">初境·三重</button>
                    <button class="zen-difficulty-btn" data-level="4">化境·四重</button>
                    <button class="zen-difficulty-btn" data-level="5">悟境·五重</button>
                    <button class="zen-difficulty-btn" data-level="6">化境·六重</button>
                </div>
            </aside>
            
            <div class="zen-towers-container" id="towers">
                <!-- 塔将通过JavaScript动态生成 -->
            </div>
            
            <aside class="zen-panel">
                <div class="zen-stat">
                    <span class="zen-stat-label">心境</span>
                    <span class="zen-stat-value" id="mood">平和</span>
                </div>
                <div class="zen-stat">
                    <span class="zen-stat-label">悟性</span>
                    <span class="zen-stat-value" id="wisdom">初悟</span>
                </div>
                <div class="zen-stat">
                    <span class="zen-stat-label">禅意</span>
                    <span class="zen-stat-value" id="zen-level">1</span>
                </div>
            </aside>
        </div>
        
        <footer class="zen-actions">
            <button class="zen-btn zen-btn-primary" onclick="game.reset()">重新修行</button>
            <button class="zen-btn zen-btn-secondary" onclick="game.showHint()">禅机点拨</button>
            <button class="zen-btn zen-btn-secondary" onclick="game.toggleSound()">梵音开关</button>
        </footer>
    </div>
    
    <div class="zen-message" id="message"></div>
    <div class="zen-author">by 林义贵|<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="2d1f18191a1414141c1a1d6d5c5c034e4240">[email&#160;protected]</a></div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        class ZenMasterGame {
            constructor() {
                this.towers = [[], [], []];
                this.moves = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.selectedTower = null;
                this.numDisks = 3;
                this.isAnimating = false;
                this.soundEnabled = true;
                this.zenLevel = 1;
                this.audioContext = null;
                
                this.zenMessages = {
                    start: ["心如止水，智慧自生", "一念不生，万法皆现", "静观其变，顺势而为"],
                    move: ["行云流水，顺其自然", "以柔克刚，大道至简", "步步生莲，处处禅机"],
                    hint: ["观棋不语真君子", "当局者迷，旁观者清", "退一步海阔天空"],
                    win: ["大彻大悟，功德圆满", "登峰造极，返璞归真", "禅意盎然，心境通明"]
                };
                
                this.wisdomLevels = ["初悟", "渐悟", "顿悟", "彻悟", "化境"];
                this.moodStates = ["平和", "专注", "入定", "禅悦", "空灵"];
                
                this.init();
                this.setupEventListeners();
            }
            
            init() {
                this.setupTowers();
                this.reset();
                this.initAudio();
            }
            
            initAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (this.audioContext.state === 'suspended') {
                        document.addEventListener('click', () => {
                            this.audioContext.resume();
                        }, { once: true });
                    }
                } catch (e) {
                    console.log('音频功能不可用');
                    this.soundEnabled = false;
                }
            }
            
            playZenSound(frequency = 432, duration = 0.3) {
                if (!this.soundEnabled || !this.audioContext || this.audioContext.state !== 'running') return;
                
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.2, this.audioContext.currentTime + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                    
                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                } catch (e) {
                    console.log('音频播放失败:', e);
                }
            }
            
            setupTowers() {
                const container = document.getElementById('towers');
                container.innerHTML = '';
                
                const towerNames = ['过去', '现在', '未来'];
                
                for (let i = 0; i < 3; i++) {
                    const tower = document.createElement('div');
                    tower.className = 'zen-tower';
                    tower.dataset.index = i;
                    tower.setAttribute('aria-label', `${towerNames[i]}之塔`);
                    
                    const pole = document.createElement('div');
                    pole.className = 'zen-tower-pole';
                    
                    const base = document.createElement('div');
                    base.className = 'zen-tower-base';
                    
                    tower.appendChild(pole);
                    tower.appendChild(base);
                    container.appendChild(tower);
                }
            }
            
            reset() {
                this.towers = [[], [], []];
                this.moves = 0;
                this.startTime = Date.now();
                this.selectedTower = null;
                this.zenLevel = 1;
                
                for (let i = this.numDisks; i > 0; i--) {
                    this.towers[0].push(i);
                }
                
                this.updateDisplay();
                this.startTimer();
                this.showMessage(this.zenMessages.start[Math.floor(Math.random() * this.zenMessages.start.length)]);
                this.playZenSound(432, 0.5);
            }
            
            updateDisplay() {
                this.updateTowers();
                this.updateStats();
                this.checkWin();
                this.updateZenState();
            }
            
            updateTowers() {
                const towerElements = document.querySelectorAll('.zen-tower');
                
                towerElements.forEach((towerEl, towerIndex) => {
                    const existingDisks = towerEl.querySelectorAll('.zen-disk');
                    existingDisks.forEach(disk => disk.remove());
                    
                    const disks = this.towers[towerIndex];
                    disks.forEach((diskSize, diskIndex) => {
                        const disk = document.createElement('div');
                        disk.className = 'zen-disk';
                        disk.dataset.size = diskSize;
                        disk.style.width = `${25 + diskSize * 12}%`;
                        disk.style.bottom = `${diskIndex * 30 + 15}px`;
                        disk.style.left = '50%';
                        disk.style.transform = 'translateX(-50%)';
                        
                        const hue = 30 + diskSize * 20;
                        disk.style.background = `linear-gradient(135deg, 
                            hsl(${hue}, 40%, ${40 + diskSize * 5}%), 
                            hsl(${hue + 20}, 35%, ${50 + diskSize * 5}%), 
                            hsl(${hue + 10}, 30%, ${60 + diskSize * 5}%))`;
                        
                        disk.textContent = this.getDiskSymbol(diskSize);
                        towerEl.appendChild(disk);
                    });
                });
            }
            
            getDiskSymbol(size) {
                const symbols = ['一', '二', '三', '四', '五', '六'];
                return symbols[size - 1] || size;
            }
            
            updateStats() {
                document.getElementById('moves').textContent = this.moves;
                document.getElementById('optimal').textContent = Math.pow(2, this.numDisks) - 1;
            }
            
            updateZenState() {
                const wisdomIndex = Math.min(Math.floor(this.moves / 5), 4);
                const moodIndex = Math.min(Math.floor(this.moves / 3), 4);
                
                document.getElementById('wisdom').textContent = this.wisdomLevels[wisdomIndex];
                document.getElementById('mood').textContent = this.moodStates[moodIndex];
                document.getElementById('zen-level').textContent = this.zenLevel;
            }
            
            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                
                this.timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const seconds = (elapsed % 60).toString().padStart(2, '0');
                    document.getElementById('timer').textContent = `${minutes}:${seconds}`;
                }, 1000);
            }
            
            setupEventListeners() {
                document.getElementById('towers').addEventListener('click', (e) => {
                    if (this.isAnimating) return;
                    
                    const tower = e.target.closest('.zen-tower');
                    if (!tower) return;
                    
                    const towerIndex = parseInt(tower.dataset.index);
                    this.handleTowerClick(towerIndex);
                });
                
                document.querySelectorAll('.zen-difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (this.isAnimating) return;
                        
                        document.querySelectorAll('.zen-difficulty-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.numDisks = parseInt(e.target.dataset.level);
                        this.reset();
                    });
                });
                
                this.setupTouchSupport();
            }
            
            setupTouchSupport() {
                let touchStartTower = null;
                let touchStartTime = 0;
                
                const handleTouchStart = (e) => {
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        const element = document.elementFromPoint(touch.clientX, touch.clientY);
                        const tower = element?.closest('.zen-tower');
                        if (tower) {
                            touchStartTower = parseInt(tower.dataset.index);
                            touchStartTime = Date.now();
                            tower.style.transform = 'translateY(-5px) scale(1.05)';
                        }
                    }
                };
                
                const handleTouchEnd = (e) => {
                    if (touchStartTower !== null && e.changedTouches.length === 1) {
                        const touch = e.changedTouches[0];
                        const element = document.elementFromPoint(touch.clientX, touch.clientY);
                        const tower = element?.closest('.zen-tower');
                        
                        document.querySelectorAll('.zen-tower').forEach(t => {
                            t.style.transform = '';
                        });
                        
                        if (tower) {
                            const targetTower = parseInt(tower.dataset.index);
                            this.moveDisk(touchStartTower, targetTower);
                        }
                    }
                    touchStartTower = null;
                };
                
                document.addEventListener('touchstart', handleTouchStart, { passive: true });
                document.addEventListener('touchend', handleTouchEnd, { passive: true });
            }
            
            handleTowerClick(towerIndex) {
                if (this.selectedTower === null) {
                    if (this.towers[towerIndex].length > 0) {
                        this.selectedTower = towerIndex;
                        document.querySelectorAll('.zen-tower')[towerIndex].classList.add('selected');
                        this.playZenSound(528, 0.2);
                    }
                } else {
                    if (this.selectedTower === towerIndex) {
                        this.selectedTower = null;
                        document.querySelectorAll('.zen-tower').forEach(t => t.classList.remove('selected'));
                        this.playZenSound(440, 0.1);
                    } else {
                        this.moveDisk(this.selectedTower, towerIndex);
                    }
                }
            }
            
            moveDisk(from, to) {
                if (this.isAnimating || this.towers[from].length === 0) return;
                
                const disk = this.towers[from][this.towers[from].length - 1];
                const targetDisk = this.towers[to][this.towers[to].length - 1];
                
                if (!targetDisk || disk < targetDisk) {
                    this.isAnimating = true;
                    this.towers[from].pop();
                    this.towers[to].push(disk);
                    this.moves++;
                    this.zenLevel++;
                    
                    this.playZenSound(396 + disk * 50, 0.3);
                    
                    setTimeout(() => {
                        this.selectedTower = null;
                        document.querySelectorAll('.zen-tower').forEach(t => t.classList.remove('selected'));
                        this.updateDisplay();
                        this.isAnimating = false;
                        
                        if (Math.random() < 0.4) {
                            this.showMessage(this.zenMessages.move[Math.floor(Math.random() * this.zenMessages.move.length)]);
                        }
                    }, 400);
                } else {
                    this.showMessage("大不压小，柔能克刚");
                    this.playZenSound(220, 0.2);
                }
            }
            
            checkWin() {
                if (this.towers[2].length === this.numDisks) {
                    clearInterval(this.timerInterval);
                    const time = Math.floor((Date.now() - this.startTime) / 1000);
                    const message = `${this.zenMessages.win[Math.floor(Math.random() * this.zenMessages.win.length)]}
                                     ${this.moves}步修行，${time}秒悟道`;
                    
                    this.showMessage(message);
                    this.playZenSound(660, 0.8);
                    this.createPetalStorm();
                }
            }
            
            showMessage(text) {
                const messageEl = document.getElementById('message');
                messageEl.textContent = text;
                messageEl.classList.add('show');
                
                setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 3000);
            }
            
            createPetalStorm() {
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const petal = document.createElement('div');
                        petal.className = 'zen-petal';
                        petal.style.left = Math.random() * 100 + 'vw';
                        petal.style.animationDelay = Math.random() * 2 + 's';
                        document.body.appendChild(petal);
                        
                        setTimeout(() => petal.remove(), 4000);
                    }, i * 100);
                }
            }
            
            showHint() {
                if (this.selectedTower !== null) {
                    const possibleMoves = [];
                    for (let i = 0; i < 3; i++) {
                        if (i !== this.selectedTower) {
                            const disk = this.towers[this.selectedTower][this.towers[this.selectedTower].length - 1];
                            const targetDisk = this.towers[i][this.towers[i].length - 1];
                            if (!targetDisk || disk < targetDisk) {
                                possibleMoves.push(i);
                            }
                        }
                    }
                    
                    if (possibleMoves.length > 0) {
                        const target = possibleMoves[0];
                        const targetTower = document.querySelectorAll('.zen-tower')[target];
                        targetTower.style.boxShadow = '0 0 30px rgba(212, 175, 55, 0.8)';
                        setTimeout(() => {
                            targetTower.style.boxShadow = '';
                        }, 2000);
                        
                        this.showMessage(this.zenMessages.hint[Math.floor(Math.random() * this.zenMessages.hint.length)]);
                    }
                } else {
                    this.showMessage("先择一塔，再寻指引");
                }
            }
            
            toggleSound() {
                this.soundEnabled = !this.soundEnabled;
                const btn = event.target;
                btn.textContent = this.soundEnabled ? '梵音关' : '梵音开';
                this.showMessage(this.soundEnabled ? "梵音袅袅" : "寂静禅心");
            }
        }
        
        // 初始化游戏
        const game = new ZenMasterGame();
        
        // 优化移动端体验
        window.addEventListener('load', () => {
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });
            
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });
        });
        
        // 错误处理
        window.addEventListener('error', (e) => {
            console.error('禅境错误:', e.error);
        });
    </script>
</body>
</html>
