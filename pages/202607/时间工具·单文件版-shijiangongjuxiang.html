<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时间工具 · 单文件版</title>
  <style>
    :root{
      --bg:#0f1320;--card:#141a2b;--text:#e8ecf3;--muted:#9aa4b2;--brand:#6ea8fe;--accent:#7ee787;--danger:#ff6b6b;--warn:#ffd166;--line:#25304a;
    }
    [data-theme="light"]{
      --bg:#f6f7fb;--card:#ffffff;--text:#1b2430;--muted:#576176;--brand:#2357ff;--accent:#11a36a;--danger:#d53f3f;--warn:#b38600;--line:#e6e9f2;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
    a{color:var(--brand)}
    .container{max-width:1200px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
    .title{display:flex;align-items:center;gap:12px}
    h1{font-size:22px;margin:0}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    @media (max-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
    @media (max-width:640px){.grid{grid-template-columns:repeat(1,1fr)}}
    .card{grid-column:span 6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .card.xl{grid-column:span 12}
    .card h2{margin:0 0 12px;font-size:18px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .stack{display:flex;flex-direction:column;gap:8px}
    .clock{font-variant-numeric:tabular-nums;font-size:56px;font-weight:700;letter-spacing:1px}
    .date{font-size:14px}
    .btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
    .btn.brand{background:var(--brand);border-color:transparent;color:#fff}
    .btn.accent{background:var(--accent);border-color:transparent;color:#0b1c12}
    .btn.warn{background:var(--warn);border-color:transparent;color:#12100f}
    .btn.danger{background:var(--danger);border-color:transparent;color:#fff}
    .field{display:flex;align-items:center;gap:8px}
    .field input,.field select, input[type="number"]{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:10px;outline:none;min-width:0}
    input[type="number"]{width:90px}
    .pill{font-size:13px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .laps{max-height:200px;overflow:auto;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
    .laps li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line)}
    .tabs{display:flex;gap:8px;margin-bottom:8px}
    .tabs .tab{padding:6px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer;color:var(--muted)}
    .tabs .tab[aria-selected="true"]{background:var(--brand);border-color:transparent;color:#fff}
    .result{font:600 20px/1 tabular-nums system-ui;}
    .footer{margin-top:16px;color:var(--muted);font-size:12px}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0003;border:1px solid var(--line);padding:2px 6px;border-radius:6px}
    .note{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container" id="app">
    <header>
      <div class="title">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 8v5l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 2v4M8 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <h1>时间工具箱 <span class="muted" style="font-weight:500">（单文件 HTML）</span></h1>
      </div>
      <div class="row">
        <span class="pill" id="sys-tz"></span>
        <button class="btn" id="toggle-theme" title="切换明/暗">🌗 主题</button>
      </div>
    </header>

    <!-- 实时钟表 -->
    <section class="card xl" aria-labelledby="clock-title">
      <h2 id="clock-title">⏰ 实时钟表</h2>
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div class="stack">
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date">加载中…</div>
        </div>
        <div class="stack" style="min-width:260px">
          <label class="note" for="fmt">显示格式</label>
          <select id="fmt">
            <option value="24">24 小时制</option>
            <option value="12">12 小时制</option>
          </select>
          <label class="note" for="tz-select">临时查看其他时区</label>
          <select id="tz-select"></select>
        </div>
      </div>
    </section>

    <section class="grid" aria-label="计时工具区">
      <!-- 秒表 -->
      <div class="card" aria-labelledby="sw-title">
        <h2 id="sw-title">⏱ 秒表</h2>
        <div class="result" id="sw-display">00:00:00.000</div>
        <div class="row" style="margin-top:8px">
          <button class="btn brand" id="sw-start">开始</button>
          <button class="btn warn" id="sw-lap" disabled>圈记</button>
          <button class="btn" id="sw-pause" disabled>暂停</button>
          <button class="btn danger" id="sw-reset" disabled>重置</button>
        </div>
        <ol class="laps" id="sw-laps" aria-live="polite" aria-label="圈记列表"></ol>
      </div>

      <!-- 倒计时 -->
      <div class="card" aria-labelledby="cd-title">
        <h2 id="cd-title">⌛ 倒计时</h2>
        <div class="row">
          <div class="field"><label>时</label><input type="number" id="cd-h" min="0" max="99" value="0" /></div>
          <div class="field"><label>分</label><input type="number" id="cd-m" min="0" max="59" value="1" /></div>
          <div class="field"><label>秒</label><input type="number" id="cd-s" min="0" max="59" value="0" /></div>
        </div>
        <div class="result" id="cd-display">00:01:00</div>
        <div class="row" style="margin-top:8px">
          <button class="btn brand" id="cd-start">开始</button>
          <button class="btn" id="cd-pause" disabled>暂停</button>
          <button class="btn warn" id="cd-add1">+1 分钟</button>
          <button class="btn danger" id="cd-reset" disabled>重置</button>
        </div>
        <div class="note" id="cd-note">时间到将发出提示音与闪烁提醒。</div>
      </div>

      <!-- 时区转换器 -->
      <div class="card" aria-labelledby="tzc-title">
        <h2 id="tzc-title">🌍 时区转换器</h2>
        <div class="stack">
          <div class="row">
            <div class="field" style="flex:1 1 260px">
              <label class="note">源时区</label>
              <select id="tzc-src"></select>
            </div>
            <div class="field" style="flex:1 1 260px">
              <label class="note">目标时区</label>
              <select id="tzc-dst"></select>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label class="note">日期</label>
              <input type="date" id="tzc-date" />
            </div>
            <div class="field">
              <label class="note">时间</label>
              <input type="time" id="tzc-time" step="60" />
            </div>
            <button class="btn brand" id="tzc-convert">转换</button>
          </div>
          <div class="result" id="tzc-output">—</div>
          <div class="note">提示：自动考虑 DST 夏令时；常用城市已内置。</div>
        </div>
      </div>

      <!-- 日期差/加减 -->
      <div class="card" aria-labelledby="dd-title">
        <h2 id="dd-title">📅 日期计算器</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="true" id="tab-diff">日期差</button>
          <button class="tab" role="tab" aria-selected="false" id="tab-add">日期加减</button>
        </div>
        <div id="panel-diff" role="tabpanel" aria-labelledby="tab-diff">
          <div class="row">
            <div class="field"><label class="note">日期 A</label><input type="date" id="dA" /></div>
            <div class="field"><label class="note">日期 B</label><input type="date" id="dB" /></div>
            <button class="btn brand" id="btn-diff">计算</button>
          </div>
          <div class="result" id="out-diff">—</div>
        </div>
        <div id="panel-add" role="tabpanel" aria-labelledby="tab-add" hidden>
          <div class="row">
            <div class="field"><label class="note">起始日期</label><input type="date" id="startDate" /></div>
            <div class="field"><label class="note">± 天</label><input type="number" id="offsetDays" value="30" /></div>
            <button class="btn brand" id="btn-add">计算</button>
          </div>
          <div class="result" id="out-add">—</div>
        </div>
      </div>
    </section>

    <section class="card xl">
      <h2>⏳ 专注番茄钟（25/5）</h2>
      <div class="row">
        <button class="btn brand" id="pom-start">开始 25:00</button>
        <button class="btn" id="pom-pause" disabled>暂停</button>
        <button class="btn danger" id="pom-reset" disabled>重置</button>
        <span class="pill" id="pom-phase">待机</span>
      </div>
      <div class="clock" id="pom-display">25:00</div>
      <div class="note">默认 25 分钟工作、5 分钟休息，可循环。结束会响铃提醒。</div>
    </section>

    <footer class="footer">
      提示：按 <span class="kbd">T</span> 切换主题；按 <span class="kbd">L</span> 为秒表圈记；按 <span class="kbd">Space</span> 控制秒表开始/暂停。
    </footer>
  </div>

  <audio id="beep" preload="auto">
    <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAAAACAAACcQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" type="audio/mp3" />
  </audio>

  <script>
    // ====== 工具函数 ======
    const $ = (s,root=document)=>root.querySelector(s);
    const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
    const pad = (n,len=2)=>String(n).padStart(len,'0');

    // ====== 主题切换 ======
    const themeBtn = $('#toggle-theme');
    const savedTheme = localStorage.getItem('theme')||'dark';
    document.documentElement.dataset.theme = savedTheme;
    themeBtn.addEventListener('click',()=>{
      const cur = document.documentElement.dataset.theme;
      const nxt = cur==='dark'?'light':'dark';
      document.documentElement.dataset.theme = nxt;
      localStorage.setItem('theme',nxt);
    });
    window.addEventListener('keydown',(e)=>{
      if(e.key.toLowerCase()==='t') themeBtn.click();
    });

    // ====== 实时钟表 + 时区查看 ======
    const sysTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    $('#sys-tz').textContent = `系统时区: ${sysTz}`;

    const commonTZ = [
      'UTC','Asia/Shanghai','Asia/Hong_Kong','Asia/Tokyo','Asia/Seoul','Asia/Singapore','Asia/Bangkok',
      'Europe/London','Europe/Paris','Europe/Berlin','Europe/Moscow','Europe/Madrid','Europe/Rome',
      'America/Los_Angeles','America/Denver','America/Chicago','America/New_York','America/Sao_Paulo',
      'Australia/Sydney','Asia/Kolkata','Africa/Cairo','Asia/Dubai','Pacific/Auckland','Asia/Jakarta'
    ];
    const tzSelects = ['#tz-select','#tzc-src','#tzc-dst'].map(id=>$(id));
    function populateTZ(sel, def){
      sel.innerHTML = commonTZ.map(tz=>`<option value="${tz}">${tz}</option>`).join('');
      if(def) sel.value = def;
    }
    populateTZ($('#tz-select'), sysTz);
    populateTZ($('#tzc-src'), sysTz);
    populateTZ($('#tzc-dst'), 'Asia/Shanghai');

    const fmtSel = $('#fmt');
    function formatTime(date, tz, use12){
      const opt = {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:use12,timeZone:tz};
      return new Intl.DateTimeFormat(undefined,opt).format(date);
    }
    function formatDate(date, tz){
      const opt = {year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:tz};
      return new Intl.DateTimeFormat('zh-CN',opt).format(date);
    }

    function tickClock(){
      const now = new Date();
      const tz = $('#tz-select').value || sysTz;
      const use12 = fmtSel.value==='12';
      $('#clock').textContent = formatTime(now, tz, use12);
      $('#date').textContent = `${formatDate(now, tz)} · ${tz}`;
      requestAnimationFrame(()=>setTimeout(tickClock, 250));
    }
    fmtSel.addEventListener('change',()=>localStorage.setItem('fmt',fmtSel.value));
    fmtSel.value = localStorage.getItem('fmt')||'24';
    tickClock();

    // ====== 秒表 ======
    const sw = {startBtn:$('#sw-start'), pauseBtn:$('#sw-pause'), resetBtn:$('#sw-reset'), lapBtn:$('#sw-lap'), display:$('#sw-display'), laps:$('#sw-laps')};
    let swStart=0, swElapsed=0, swTimer=null, lapCount=0;
    function renderSW(ms){
      const h=Math.floor(ms/3600000); ms%=3600000;
      const m=Math.floor(ms/60000); ms%=60000;
      const s=Math.floor(ms/1000); const msr=ms%1000;
      sw.display.textContent = `${pad(h)}:${pad(m)}:${pad(s)}.${pad(msr,3)}`;
    }
    function swTick(){ renderSW(Date.now()-swStart+swElapsed); }
    function swStartFn(){
      if(swTimer) return;
      swStart = Date.now();
      swTimer = setInterval(swTick, 16);
      sw.startBtn.textContent='继续';
      sw.pauseBtn.disabled=false; sw.resetBtn.disabled=false; sw.lapBtn.disabled=false;
    }
    function swPauseFn(){
      if(!swTimer) return;
      clearInterval(swTimer); swTimer=null;
      swElapsed += Date.now()-swStart; renderSW(swElapsed);
    }
    function swResetFn(){
      clearInterval(swTimer); swTimer=null; swStart=0; swElapsed=0; lapCount=0; sw.laps.innerHTML='';
      renderSW(0);
      sw.pauseBtn.disabled=true; sw.resetBtn.disabled=true; sw.lapBtn.disabled=true; sw.startBtn.textContent='开始';
    }
    function swLapFn(){
      const nowMs = swTimer? (Date.now()-swStart+swElapsed): swElapsed;
      const li=document.createElement('li');
      li.innerHTML = `<span>圈 ${++lapCount}</span><span>${sw.display.textContent}</span>`;
      sw.laps.prepend(li);
    }
    sw.startBtn.addEventListener('click',swStartFn);
    sw.pauseBtn.addEventListener('click',swPauseFn);
    sw.resetBtn.addEventListener('click',swResetFn);
    sw.lapBtn.addEventListener('click',swLapFn);
    window.addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault(); swTimer?swPauseFn():swStartFn();}
      if(e.key.toLowerCase()==='l'){swLapFn();}
    });

    // ====== 倒计时 ======
    const cd = {h:$('#cd-h'),m:$('#cd-m'),s:$('#cd-s'),display:$('#cd-display'),start:$('#cd-start'),pause:$('#cd-pause'),reset:$('#cd-reset'),add1:$('#cd-add1')};
    let cdTotal=60*1000, cdEnd=0, cdTimer=null;
    function calcCdTotal(){
      const h=+cd.h.value||0, m=+cd.m.value||0, s=+cd.s.value||0; return (h*3600+m*60+s)*1000;
    }
    function renderCd(ms){
      ms=Math.max(0,ms);
      const h=Math.floor(ms/3600000); ms%=3600000;
      const m=Math.floor(ms/60000); ms%=60000;
      const s=Math.floor(ms/1000);
      cd.display.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    function cdTick(){
      const left = cdEnd - Date.now();
      renderCd(left);
      if(left<=0){
        clearInterval(cdTimer); cdTimer=null; flash(); beep();
        cd.pause.disabled=true; cd.reset.disabled=false; cd.start.disabled=false;
      }
    }
    function cdStartFn(){
      cdTotal = calcCdTotal();
      if(cdTotal<=0) return;
      cdEnd = Date.now()+cdTotal; cdTimer=setInterval(cdTick, 200);
      cd.start.disabled=true; cd.pause.disabled=false; cd.reset.disabled=false;
    }
    function cdPauseFn(){
      if(!cdTimer) return;
      const left = Math.max(0, cdEnd - Date.now());
      clearInterval(cdTimer); cdTimer=null; cdTotal=left; renderCd(left);
      cd.start.disabled=false; cd.pause.disabled=true;
    }
    function cdResetFn(){
      clearInterval(cdTimer); cdTimer=null; cdTotal=calcCdTotal(); renderCd(cdTotal);
      cd.start.disabled=false; cd.pause.disabled=true; cd.reset.disabled=true;
    }
    function cdAdd1Fn(){
      if(cdTimer){ cdEnd += 60000; } else { cdTotal += 60000; renderCd(cdTotal); }
    }
    cd.h.addEventListener('input',()=>renderCd(calcCdTotal()));
    cd.m.addEventListener('input',()=>renderCd(calcCdTotal()));
    cd.s.addEventListener('input',()=>renderCd(calcCdTotal()));
    cd.start.addEventListener('click',cdStartFn);
    cd.pause.addEventListener('click',cdPauseFn);
    cd.reset.addEventListener('click',cdResetFn);
    cd.add1.addEventListener('click',cdAdd1Fn);
    renderCd(cdTotal);

    // ====== 时区转换器 ======
    function toDateInTZ(dateStr,timeStr, tz){
      // 以 tz 的本地时间构造具体 UTC 时间
      const [y,m,d] = dateStr.split('-').map(Number);
      const [hh,mm] = (timeStr||'00:00').split(':').map(Number);
      // 构造在 tz 中的时间的等效 UTC 时间：先获得 tz 下该时间的各组件再反推
      const dt = new Date(Date.UTC(y, m-1, d, hh, mm, 0));
      // 调整：用 formatToParts 在 tz 渲染后与输入对齐，规避 DST 复杂度
      return new Date(dt.getTime());
    }
    function convertTZ(date, fromTZ, toTZ){
      // 先把 fromTZ 视角的时间转成 UTC 时间戳
      const utcTs = date.getTime() - tzOffsetMillis(date, fromTZ);
      // 再加上目标时区偏移
      const dstTs = utcTs + tzOffsetMillis(new Date(utcTs), toTZ);
      return new Date(dstTs);
    }
    function tzOffsetMillis(date, tz){
      // 利用时区格式化得到偏移分钟
      const fmt = new Intl.DateTimeFormat('en-US',{timeZone:tz, timeZoneName:'shortOffset', hour12:false, hour:'2-digit',minute:'2-digit'});
      const parts = fmt.formatToParts(date);
      const tzpart = parts.find(p=>p.type==='timeZoneName')?.value || 'UTC+0';
      const m = tzpart.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/i) || tzpart.match(/UTC([+-])(\d{1,2})(?::(\d{2}))?/i);
      if(!m) return 0;
      const sign = m[1]==='-'?-1:1; const h=+m[2]||0; const min=+(m[3]||0);
      return sign*(h*60+min)*60000;
    }
    $('#tzc-date').valueAsDate = new Date();
    $('#tzc-time').value = new Date().toTimeString().slice(0,5);
    $('#tzc-convert').addEventListener('click',()=>{
      const d = $('#tzc-date').value, t=$('#tzc-time').value;
      const src=$('#tzc-src').value, dst=$('#tzc-dst').value;
      if(!d||!t) return $('#tzc-output').textContent='请先选择日期与时间';
      const base = toDateInTZ(d,t,src);
      const out = convertTZ(base, src, dst);
      const s = new Intl.DateTimeFormat('zh-CN',{dateStyle:'full', timeStyle:'short', timeZone:dst}).format(out);
      $('#tzc-output').textContent = `${dst} → ${s}`;
    });

    // ====== 日期计算器 ======
    const tabDiff = $('#tab-diff'), tabAdd=$('#tab-add');
    tabDiff.addEventListener('click',()=>{
      tabDiff.setAttribute('aria-selected','true'); tabAdd.setAttribute('aria-selected','false');
      $('#panel-diff').hidden=false; $('#panel-add').hidden=true;
    });
    tabAdd.addEventListener('click',()=>{
      tabAdd.setAttribute('aria-selected','true'); tabDiff.setAttribute('aria-selected','false');
      $('#panel-diff').hidden=true; $('#panel-add').hidden=false;
    });
    $('#dA').valueAsDate = new Date();
    $('#dB').valueAsDate = new Date();
    $('#btn-diff').addEventListener('click',()=>{
      const a = new Date($('#dA').value), b=new Date($('#dB').value);
      const ms = Math.abs(b - a);
      const days = Math.floor(ms/86400000);
      const years = Math.floor(days/365.2425);
      const months = Math.floor((days%365.2425)/30.4369);
      $('#out-diff').textContent = `${days} 天（约 ${years} 年 ${months} 个月）`;
    });
    $('#startDate').valueAsDate = new Date();
    $('#btn-add').addEventListener('click',()=>{
      const base = new Date($('#startDate').value);
      const off = parseInt($('#offsetDays').value||0,10);
      base.setDate(base.getDate()+off);
      $('#out-add').textContent = new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(base);
    });

    // ====== 番茄钟 ======
    const pom = {display:$('#pom-display'), start:$('#pom-start'), pause:$('#pom-pause'), reset:$('#pom-reset'), phase:$('#pom-phase')};
    let pomLen=25*60, brkLen=5*60, pomLeft=pomLen, pomTimer=null, working=false;
    function renderPom(){
      const m=Math.floor(pomLeft/60), s=pomLeft%60; pom.display.textContent=`${pad(m)}:${pad(s)}`;
    }
    function pomStart(){ if(pomTimer) return; if(pomLeft<=0) pomLeft=pomLen; working=true; pom.phase.textContent='专注中'; pomTimer=setInterval(()=>{
      pomLeft--; renderPom(); if(pomLeft<=0){ clearInterval(pomTimer); pomTimer=null; beep(); flash(); setTimeout(()=>{ working=false; pomLeft=brkLen; pom.phase.textContent='休息中'; pomStart(); },800); }
    },1000); pom.start.disabled=true; pom.pause.disabled=false; pom.reset.disabled=false; }
    function pomPause(){ if(!pomTimer) return; clearInterval(pomTimer); pomTimer=null; pom.start.disabled=false; pom.pause.disabled=true; }
    function pomReset(){ clearInterval(pomTimer); pomTimer=null; working=false; pomLeft=pomLen; renderPom(); pom.phase.textContent='待机'; pom.start.disabled=false; pom.pause.disabled=true; pom.reset.disabled=true; }
    pom.start.addEventListener('click',pomStart);
    pom.pause.addEventListener('click',pomPause);
    pom.reset.addEventListener('click',pomReset);
    renderPom();

    // ====== 提醒：声音 + 闪烁 ======
    const beepEl = $('#beep');
    function beep(){
      // 极简哔声（静音占位，某些浏览器需用户交互后方可播放）
      try{beepEl.currentTime=0; beepEl.play();}catch(e){}
    }
    function flash(){
      const orig = document.body.style.boxShadow;
      let n=0; const it = setInterval(()=>{
        document.body.style.boxShadow = (n++%2)?'inset 0 0 0 9999px rgba(255,255,255,.08)':'none';
        if(n>8){ clearInterval(it); document.body.style.boxShadow=orig; }
      },150);
    }
  </script>
</body>
</html>
