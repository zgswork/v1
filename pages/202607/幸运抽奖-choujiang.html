<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运抽奖</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --tertiary-color: #45aaf2;
            --dark-color: #2d3436;
            --light-color: #f5f6fa;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .setting-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--dark-color);
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        #initBtn {
            background-color: var(--dark-color);
        }
        
        #thirdPrizeBtn {
            background-color: var(--tertiary-color);
        }
        
        #secondPrizeBtn {
            background-color: var(--secondary-color);
        }
        
        #firstPrizeBtn {
            background-color: var(--primary-color);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .prize-results {
            margin-bottom: 30px;
        }
        
        .prize-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid;
        }
        
        .third-prize .prize-title {
            color: var(--tertiary-color);
            border-bottom-color: var(--tertiary-color);
        }
        
        .second-prize .prize-title {
            color: var(--secondary-color);
            border-bottom-color: var(--secondary-color);
        }
        
        .first-prize .prize-title {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .number {
            background-color: #eee;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .third-prize .number {
            background-color: rgba(69, 170, 242, 0.2);
        }
        
        .second-prize .number {
            background-color: rgba(78, 205, 196, 0.2);
        }
        
        .first-prize .number {
            background-color: rgba(255, 107, 107, 0.2);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>幸运抽奖</h1>
        
        <div class="settings">
            <div class="setting-group">
                <label for="totalNumbers">总号码数量</label>
                <input type="number" id="totalNumbers" value="100" min="1">
            </div>
            
            <div class="setting-group">
                <label for="thirdPrizeCount">三等奖数量</label>
                <input type="number" id="thirdPrizeCount" value="10" min="1">
            </div>
            
            <div class="setting-group">
                <label for="secondPrizeCount">二等奖数量</label>
                <input type="number" id="secondPrizeCount" value="5" min="1">
            </div>
            
            <div class="setting-group">
                <label for="firstPrizeCount">一等奖数量</label>
                <input type="number" id="firstPrizeCount" value="2" min="1">
            </div>
        </div>
        
        <div class="buttons">
            <button id="initBtn">初始化抽奖池</button>
            <button id="thirdPrizeBtn" disabled>抽取三等奖</button>
            <button id="secondPrizeBtn" disabled>抽取二等奖</button>
            <button id="firstPrizeBtn" disabled>抽取一等奖</button>
        </div>
        
        <div class="results">
            <div class="prize-results third-prize">
                <h2 class="prize-title">三等奖结果 (<span id="thirdPrizeCountDisplay">10</span>名)</h2>
                <div class="numbers" id="thirdPrizeNumbers"></div>
            </div>
            
            <div class="prize-results second-prize">
                <h2 class="prize-title">二等奖结果 (<span id="secondPrizeCountDisplay">5</span>名)</h2>
                <div class="numbers" id="secondPrizeNumbers"></div>
            </div>
            
            <div class="prize-results first-prize">
                <h2 class="prize-title">一等奖结果 (<span id="firstPrizeCountDisplay">2</span>名)</h2>
                <div class="numbers" id="firstPrizeNumbers"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let pool = [];
        let availableNumbers = [];
        let thirdPrizeWinners = [];
        let secondPrizeWinners = [];
        let firstPrizeWinners = [];
        
        // DOM元素
        const totalNumbersInput = document.getElementById('totalNumbers');
        const thirdPrizeCountInput = document.getElementById('thirdPrizeCount');
        const secondPrizeCountInput = document.getElementById('secondPrizeCount');
        const firstPrizeCountInput = document.getElementById('firstPrizeCount');
        
        const initBtn = document.getElementById('initBtn');
        const thirdPrizeBtn = document.getElementById('thirdPrizeBtn');
        const secondPrizeBtn = document.getElementById('secondPrizeBtn');
        const firstPrizeBtn = document.getElementById('firstPrizeBtn');
        
        const thirdPrizeCountDisplay = document.getElementById('thirdPrizeCountDisplay');
        const secondPrizeCountDisplay = document.getElementById('secondPrizeCountDisplay');
        const firstPrizeCountDisplay = document.getElementById('firstPrizeCountDisplay');
        
        const thirdPrizeNumbersEl = document.getElementById('thirdPrizeNumbers');
        const secondPrizeNumbersEl = document.getElementById('secondPrizeNumbers');
        const firstPrizeNumbersEl = document.getElementById('firstPrizeNumbers');
        
        // 初始化抽奖池
        function initLottery() {
            const totalNumbers = parseInt(totalNumbersInput.value);
            const thirdPrizeCount = parseInt(thirdPrizeCountInput.value);
            const secondPrizeCount = parseInt(secondPrizeCountInput.value);
            const firstPrizeCount = parseInt(firstPrizeCountInput.value);
            
            // 验证输入
            if (isNaN(totalNumbers) || totalNumbers < 1) {
                alert('请输入有效的总号码数量');
                return;
            }
            
            if (isNaN(thirdPrizeCount) || thirdPrizeCount < 1) {
                alert('请输入有效的三等奖数量');
                return;
            }
            
            if (isNaN(secondPrizeCount) || secondPrizeCount < 1) {
                alert('请输入有效的二等奖数量');
                return;
            }
            
            if (isNaN(firstPrizeCount) || firstPrizeCount < 1) {
                alert('请输入有效的一等奖数量');
                return;
            }
            
            if (thirdPrizeCount + secondPrizeCount + firstPrizeCount > totalNumbers) {
                alert('奖项总数不能超过总号码数量');
                return;
            }
            
            // 更新显示的数量
            thirdPrizeCountDisplay.textContent = thirdPrizeCount;
            secondPrizeCountDisplay.textContent = secondPrizeCount;
            firstPrizeCountDisplay.textContent = firstPrizeCount;
            
            // 初始化抽奖池
            pool = Array.from({length: totalNumbers}, (_, i) => i + 1);
            availableNumbers = [...pool];
            thirdPrizeWinners = [];
            secondPrizeWinners = [];
            firstPrizeWinners = [];
            
            // 清空结果显示
            thirdPrizeNumbersEl.innerHTML = '';
            secondPrizeNumbersEl.innerHTML = '';
            firstPrizeNumbersEl.innerHTML = '';
            
            // 更新按钮状态
            thirdPrizeBtn.disabled = false;
            secondPrizeBtn.disabled = true;
            firstPrizeBtn.disabled = true;
            
            alert(`抽奖池已初始化，共有 ${totalNumbers} 个号码`);
        }
        
        // 抽取奖项
        function drawPrize(prizeType) {
            let count;
            let winnersArray;
            let displayElement;
            
            switch(prizeType) {
                case 'third':
                    count = parseInt(thirdPrizeCountInput.value);
                    winnersArray = thirdPrizeWinners;
                    displayElement = thirdPrizeNumbersEl;
                    break;
                case 'second':
                    count = parseInt(secondPrizeCountInput.value);
                    winnersArray = secondPrizeWinners;
                    displayElement = secondPrizeNumbersEl;
                    break;
                case 'first':
                    count = parseInt(firstPrizeCountInput.value);
                    winnersArray = firstPrizeWinners;
                    displayElement = firstPrizeNumbersEl;
                    break;
                default:
                    return;
            }
            
            // 检查剩余号码是否足够
            if (availableNumbers.length < count) {
                alert(`剩余号码不足，无法抽取 ${count} 个奖项`);
                return;
            }
            
            // 随机抽取
            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const winner = availableNumbers.splice(randomIndex, 1)[0];
                winnersArray.push(winner);
            }
            
            // 显示结果
            displayElement.innerHTML = '';
            winnersArray.forEach(num => {
                const numberEl = document.createElement('div');
                numberEl.className = 'number';
                numberEl.textContent = num;
                displayElement.appendChild(numberEl);
            });
            
            // 更新按钮状态
            switch(prizeType) {
                case 'third':
                    thirdPrizeBtn.disabled = true;
                    if (parseInt(secondPrizeCountInput.value) > 0) {
                        secondPrizeBtn.disabled = false;
                    } else {
                        firstPrizeBtn.disabled = false;
                    }
                    break;
                case 'second':
                    secondPrizeBtn.disabled = true;
                    if (parseInt(firstPrizeCountInput.value) > 0) {
                        firstPrizeBtn.disabled = false;
                    }
                    break;
                case 'first':
                    firstPrizeBtn.disabled = true;
                    break;
            }
        }
        
        // 事件监听
        initBtn.addEventListener('click', initLottery);
        thirdPrizeBtn.addEventListener('click', () => drawPrize('third'));
        secondPrizeBtn.addEventListener('click', () => drawPrize('second'));
        firstPrizeBtn.addEventListener('click', () => drawPrize('first'));
        
        // 初始化显示
        thirdPrizeCountDisplay.textContent = thirdPrizeCountInput.value;
        secondPrizeCountDisplay.textContent = secondPrizeCountInput.value;
        firstPrizeCountDisplay.textContent = firstPrizeCountInput.value;
    </script>
</body>
</html>
