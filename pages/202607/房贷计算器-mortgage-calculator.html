    <script>
        // 切换标签页
        function switchTab(type) {
            // 移除所有活动状态
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.loan-form').forEach(form => form.classList.add('hidden'));
            
            // 激活当前标签
            event.target.classList.add('active');
            document.getElementById(type + '-form').classList.remove('hidden');
        }
        
        // 等额本息计算
        function calculateEqualPayment(principal, rate, months) {
            const monthlyRate = rate / 100 / 12;
            const monthlyPayment = principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
            const totalPayment = monthlyPayment * months;
            const totalInterest = totalPayment - principal;
            
            return {
                monthlyPayment: monthlyPayment,
                totalPayment: totalPayment,
                totalInterest: totalInterest
            };
        }
        
        // 等额本金计算
        function calculateEqualPrincipal(principal, rate, months) {
            const monthlyRate = rate / 100 / 12;
            const monthlyPrincipal = principal / months;
            const firstMonthPayment = monthlyPrincipal + principal * monthlyRate;
            const lastMonthPayment = monthlyPrincipal + monthlyPrincipal * monthlyRate;
            const totalInterest = principal * monthlyRate * (months + 1) / 2;
            const totalPayment = principal + totalInterest;
            
            return {
                firstMonthPayment: firstMonthPayment,
                lastMonthPayment: lastMonthPayment,
                monthlyPrincipal: monthlyPrincipal,
                totalPayment: totalPayment,
                totalInterest: totalInterest
            };
        }
        
        // 格式化金额
        function formatMoney(amount) {
            return amount.toLocaleString('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // 导出Excel功能
        function exportToExcel() {
            // 创建工作簿
            const wb = XLSX.utils.book_new();

                    data.push(['商业贷款利率', currentLoanData.commercialRate + '%']);
                    data.push(['公积金贷款金额', formatMoney(currentLoanData.providentPrincipal)]);
                    data.push(['公积金贷款利率', currentLoanData.providentRate + '%']);

                    data.push(['贷款类型', loanType]);
                    data.push(['贷款金额', formatMoney(currentLoanData.principal)]);
                    data.push(['贷款利率', currentLoanData.rate + '%']);
                }
                
                data.push(['贷款期限', Math.floor(currentLoanData.months/12) + '年(' + currentLoanData.months + '期)']);
                data.push(['还款方式', currentLoanData.method === 'equal-payment' ? '等额本息' : '等额本金']);
                data.push([]); // 空行
                data.push(['还款明细表']);
                data.push([]); // 空行
            }
            
            // 添加表格数据
            const table = document.getElementById('detail-table');
            const rows = table.querySelectorAll('tr');
            
            rows.forEach(row => {
                const cells = row.querySelectorAll('th, td');
                const rowData = Array.from(cells).map(cell => {
                    let text = cell.textContent.trim();
                    // 对于数字列，移除格式化符号并转换为数字
                    if (text.includes('¥')) {
                        const numText = text.replace(/¥|,/g, '');
                        return parseFloat(numText) || text;
                    }
                    // 期数列转换为数字
                    if (/^\d+$/.test(text)) {
                        return parseInt(text);
                    }
                    return text;
                });
                data.push(rowData);
            });
            
            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(data);
            
            // 设置列宽
            ws['!cols'] = [
                { wch: 15 }, // 第一列
                { wch: 20 }, // 第二列
                { wch: 15 }, // 第三列
                { wch: 15 }, // 第四列
                { wch: 20 }  // 第五列
            ];
            
            // 查找表格数据的起始行
            let tableStartRow = -1;
            for (let i = 0; i < data.length; i++) {
                if (data[i] && data[i][0] === '期数') {
                    tableStartRow = i;
                    break;
                }
            }
            
            // 设置样式
            // 1. 设置摘要部分样式
            for (let i = 0; i < data.length; i++) {
                if (data[i] && data[i][0]) {
                    const cellRef = XLSX.utils.encode_cell({ r: i, c: 0 });
                    
                    if (data[i][0] === '贷款信息摘要') {
                        ws[cellRef] = {
                            v: data[i][0],
                            t: 's',
                            s: {
                                font: { bold: true, sz: 16, color: { rgb: "2F5597" } },
                                alignment: { horizontal: "left", vertical: "center" }
                            }
                        };
                    } else if (data[i][0] === '还款明细表') {
                        ws[cellRef] = {
                            v: data[i][0],
                            t: 's',
                            s: {
                                font: { bold: true, sz: 14, color: { rgb: "2F5597" } },
                                alignment: { horizontal: "left", vertical: "center" }
                            }
                        };
                    }
                }
            }
            
            // 2. 设置表头和数据行样式
            if (tableStartRow >= 0) {
                // 设置表头样式
                for (let col = 0; col < 5; col++) {
                    const cellRef = XLSX.utils.encode_cell({ r: tableStartRow, c: col });
                    const cellValue = data[tableStartRow] && data[tableStartRow][col] ? data[tableStartRow][col] : '';
                    
                    ws[cellRef] = {
                        v: cellValue,
                        t: 's',
                        s: {
                            font: { bold: true, color: { rgb: "FFFFFF" } },
                            fill: { fgColor: { rgb: "4472C4" } },
                            alignment: { horizontal: "center", vertical: "center" },
                            border: {
                                top: { style: "thin", color: { rgb: "000000" } },
                                bottom: { style: "thin", color: { rgb: "000000" } },
                                left: { style: "thin", color: { rgb: "000000" } },
                                right: { style: "thin", color: { rgb: "000000" } }
                            }
                        }
                    };
                }
                
                // 设置数据行样式
                for (let row = tableStartRow + 1; row < data.length; row++) {
                    for (let col = 0; col < 5; col++) {
                        const cellRef = XLSX.utils.encode_cell({ r: row, c: col });
                        const cellValue = data[row] && data[row][col] !== undefined ? data[row][col] : '';
                        const isEvenRow = (row - tableStartRow) % 2 === 0;
                        
                        ws[cellRef] = {
                            v: cellValue,
                            t: typeof cellValue === 'number' ? 'n' : 's',
                            s: {

                                    horizontal: col > 0 ? "right" : "center",

                                },
                                fill: { fgColor: { rgb: isEvenRow ? "F8F9FA" : "FFFFFF" } }
                            }
                        };
                    }
                }
            }
            
            // 添加工作表到工作簿
            XLSX.utils.book_append_sheet(wb, ws, '还款明细表');
            
            // 导出文件（使用xlsx-style的导出方法）
            XLSX.writeFile(wb, '还款明细表.xlsx', { bookType: 'xlsx', type: 'binary' });
        }
        
        // 生成详细数据
        function generateDetailData(loanData) {
            if (loanData.type === 'combination') {
                // 组合贷款
                return generateCombinationDetailData(loanData);
            } else {
                // 单一贷款
                const { principal, rate, months, method } = loanData;
                const monthlyRate = rate / 100 / 12;
                const details = [];
                let remainingPrincipal = principal;
                
                if (method === 'equal-payment') {
                    // 等额本息
                    const monthlyPayment = principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
                    
                    for (let i = 0; i < months; i++) {
                        const interest = remainingPrincipal * monthlyRate;
                        const principalPayment = monthlyPayment - interest;
                        remainingPrincipal -= principalPayment;
                        
                        details.push({
                            monthlyPayment: monthlyPayment,
                            principal: principalPayment,
                            interest: interest,
                            remainingPrincipal: Math.max(0, remainingPrincipal)
                        });
                    }
                } else {
                    // 等额本金
                    const monthlyPrincipal = principal / months;
                    
                    for (let i = 0; i < months; i++) {
                        const interest = remainingPrincipal * monthlyRate;
                        const monthlyPayment = monthlyPrincipal + interest;
                        remainingPrincipal -= monthlyPrincipal;
                        
                        details.push({
                            monthlyPayment: monthlyPayment,
                            principal: monthlyPrincipal,
                            interest: interest,
                            remainingPrincipal: Math.max(0, remainingPrincipal)
                        });
                    }
                }
                
                return details;
            }
        }
        
        // 生成组合贷款详细数据
        function generateCombinationDetailData(loanData) {
            const { commercialPrincipal, providentPrincipal, commercialRate, providentRate, months, method } = loanData;
            const commercialMonthlyRate = commercialRate / 100 / 12;
            const providentMonthlyRate = providentRate / 100 / 12;
            const details = [];
            
            let commercialRemaining = commercialPrincipal;
            let providentRemaining = providentPrincipal;
            
            if (method === 'equal-payment') {
                // 等额本息
                const commercialMonthlyPayment = commercialPrincipal * commercialMonthlyRate * Math.pow(1 + commercialMonthlyRate, months) / (Math.pow(1 + commercialMonthlyRate, months) - 1);
                const providentMonthlyPayment = providentPrincipal * providentMonthlyRate * Math.pow(1 + providentMonthlyRate, months) / (Math.pow(1 + providentMonthlyRate, months) - 1);
                
                for (let i = 0; i < months; i++) {
                    const commercialInterest = commercialRemaining * commercialMonthlyRate;
                    const providentInterest = providentRemaining * providentMonthlyRate;
                    
                    const commercialPrincipalPayment = commercialMonthlyPayment - commercialInterest;
                    const providentPrincipalPayment = providentMonthlyPayment - providentInterest;
                    
                    commercialRemaining -= commercialPrincipalPayment;
                    providentRemaining -= providentPrincipalPayment;
                    
                    details.push({
                        monthlyPayment: commercialMonthlyPayment + providentMonthlyPayment,
                        principal: commercialPrincipalPayment + providentPrincipalPayment,
                        interest: commercialInterest + providentInterest,
                        remainingPrincipal: Math.max(0, commercialRemaining) + Math.max(0, providentRemaining)
                    });
                }
            } else {
                // 等额本金
                const commercialMonthlyPrincipal = commercialPrincipal / months;
                const providentMonthlyPrincipal = providentPrincipal / months;
                
                for (let i = 0; i < months; i++) {
                    const commercialInterest = commercialRemaining * commercialMonthlyRate;
                    const providentInterest = providentRemaining * providentMonthlyRate;
                    
                    const commercialMonthlyPayment = commercialMonthlyPrincipal + commercialInterest;
                    const providentMonthlyPayment = providentMonthlyPrincipal + providentInterest;
                    
                    commercialRemaining -= commercialMonthlyPrincipal;
                    providentRemaining -= providentMonthlyPrincipal;
                    
                    details.push({
                        monthlyPayment: commercialMonthlyPayment + providentMonthlyPayment,
                        principal: commercialMonthlyPrincipal + providentMonthlyPrincipal,
                        interest: commercialInterest + providentInterest,
                        remainingPrincipal: Math.max(0, commercialRemaining) + Math.max(0, providentRemaining)
                    });
                }
            }
            
            return details;
        }

        // 计算组合贷款
        function calculateCombination() {
            const commercialAmount = parseFloat(document.getElementById('combo-commercial-amount').value) * 10000;
            const providentAmount = parseFloat(document.getElementById('combo-provident-amount').value) * 10000;
            const years = parseInt(document.getElementById('combo-years').value);
            const commercialRate = parseFloat(document.getElementById('combo-commercial-rate').value);
            const providentRate = parseFloat(document.getElementById('combo-provident-rate').value);
            const method = document.getElementById('combo-method').value;
            
            if (!commercialAmount || !providentAmount || !commercialRate || !providentRate) {
                alert('请输入完整的贷款信息');
                return;
            }
            
            const months = years * 12;
            const totalAmount = commercialAmount + providentAmount;
            
            let results = [];
            
            // 保存当前贷款数据（组合贷款）
            currentLoanData = {
                type: 'combination',
                commercialPrincipal: commercialAmount,
                providentPrincipal: providentAmount,
                commercialRate: commercialRate,
                providentRate: providentRate,
                months: months,
                method: method
            };
            
            if (method === 'equal-payment') {
                const commercialCalc = calculateEqualPayment(commercialAmount, commercialRate, months);
                const providentCalc = calculateEqualPayment(providentAmount, providentRate, months);
                
                const totalMonthlyPayment = commercialCalc.monthlyPayment + providentCalc.monthlyPayment;
                const totalInterest = commercialCalc.totalInterest + providentCalc.totalInterest;
                const totalPayment = commercialCalc.totalPayment + providentCalc.totalPayment;
                
                results = [
                    ['贷款总额', `¥${formatMoney(totalAmount)}`, false],
                    ['商业贷款', `¥${formatMoney(commercialAmount)}`, false],
                    ['公积金贷款', `¥${formatMoney(providentAmount)}`, false],
                    ['还款月数', `${months}个月`, false],
                    ['月均还款', `¥${formatMoney(totalMonthlyPayment)}`, true],
                    ['商业月供', `¥${formatMoney(commercialCalc.monthlyPayment)}`, false],
                    ['公积金月供', `¥${formatMoney(providentCalc.monthlyPayment)}`, false],
                    ['支付利息', `¥${formatMoney(totalInterest)}`, false],
                    ['还款总额', `¥${formatMoney(totalPayment)}`, true]
                ];
            } else {
                const commercialCalc = calculateEqualPrincipal(commercialAmount, commercialRate, months);
                const providentCalc = calculateEqualPrincipal(providentAmount, providentRate, months);
                
                const firstMonthPayment = commercialCalc.firstMonthPayment + providentCalc.firstMonthPayment;
                const lastMonthPayment = commercialCalc.lastMonthPayment + providentCalc.lastMonthPayment;
                const totalInterest = commercialCalc.totalInterest + providentCalc.totalInterest;
                const totalPayment = commercialCalc.totalPayment + providentCalc.totalPayment;

                    ['贷款总额', `¥${formatMoney(totalAmount)}`, false],
                    ['商业贷款', `¥${formatMoney(commercialAmount)}`, false],
                    ['公积金贷款', `¥${formatMoney(providentAmount)}`, false],

                    ['末月还款', `¥${formatMoney(lastMonthPayment)}`, false],
                    ['支付利息', `¥${formatMoney(totalInterest)}`, false],
                    ['还款总额', `¥${formatMoney(totalPayment)}`, true]
                ];
            }
            
            displayResult('组合贷款计算结果', results);
        }
