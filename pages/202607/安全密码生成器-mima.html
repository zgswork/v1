<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #fca311;
            --gray: #6c757d;
            --border-radius: 12px;
            --box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            margin-bottom: 30px;
            transition: var(--transition);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }
        
        .card-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title i {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        
        input, select, button {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #6c757d, #495057);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, var(--danger), #b5179e);
        }
        
        .password-display {
            position: relative;
            margin: 20px 0;
        }
        
        .password-field {
            width: 100%;
            padding: 16px 50px 16px 20px;
            font-size: 1.2rem;
            background-color: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.2rem;
            width: auto;
            padding: 5px;
        }
        
        .copy-btn:hover {
            color: var(--primary);
        }
        
        .strength-meter {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .strength-0 { width: 20%; background: var(--danger); }
        .strength-1 { width: 40%; background: #ff6b6b; }
        .strength-2 { width: 60%; background: var(--warning); }
        .strength-3 { width: 80%; background: #4cc9f0; }
        .strength-4 { width: 100%; background: #52b788; }
        
        .password-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        .saved-passwords {
            margin-top: 30px;
        }
        
        .password-item {
            background: #f8f9fa;
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }
        
        .password-item div {
            flex: 1;
        }
        
        .password-item .actions {
            display: flex;
            gap: 10px;
        }
        
        .password-item button {
            width: auto;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        
        .password-value {
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            margin-top: 5px;
            color: var(--dark);
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--gray);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: var(--dark);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            border-left: 4px solid #52b788;
        }
        
        .notification.error {
            border-left: 4px solid var(--danger);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 30px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #e9ecef;
            border-radius: 50px;
            padding: 5px;
            flex-wrap: wrap;
        }
        
        .tab {
            flex: 1;
            min-width: 150px;
            text-align: center;
            padding: 10px 5px;
            cursor: pointer;
            border-radius: 50px;
            transition: var(--transition);
            white-space: nowrap;
            font-size: 0.9rem;
            margin: 3px;
        }
        
        .tab.active {
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            color: var(--primary);
            font-weight: 600;
        }
        
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-key"></i> 安全密码生成器</h1>
            <p class="subtitle">创建强密码并安全地管理您的所有密码</p>
        </header>
        
        <main class="grid">
            <section class="card">
                <h2 class="card-title"><i class="fas fa-lock"></i> 生成新密码</h2>
                
                <div class="form-group">
                    <label for="passwordLength">密码长度 (8-32位)</label>
                    <input type="range" id="passwordLength" min="8" max="32" value="12">
                    <div class="password-info">
                        <span>8位</span>
                        <span id="lengthValue">12位</span>
                        <span>32位</span>
                    </div>
                </div>
                
                <div class="tabs">
                    <div class="tab active" data-type="strong">大写+小写+特殊字符+数字</div>
                    <div class="tab" data-type="lettersNumbers">大写+小写+数字</div>
                    <div class="tab" data-type="lowercaseNumbers">小写+数字</div>
                    <div class="tab" data-type="random">随机组合</div>
                </div>
                
                <div class="form-group">
                    <button id="generateBtn">
                        <i class="fas fa-sync-alt"></i> 生成密码
                    </button>
                </div>
                
                <div class="password-display">
                    <input type="text" id="passwordOutput" class="password-field" readonly>
                    <button class="copy-btn" id="copyBtn">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
                
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="password-info">
                    <span>弱</span>
                    <span id="strengthText">中等</span>
                    <span>强</span>
                </div>
            </section>
            
            <section class="card">
                <h2 class="card-title"><i class="fas fa-save"></i> 保存密码</h2>
                
                <div class="form-group">
                    <label for="website">网站/应用</label>
                    <input type="text" id="website" placeholder="例如: google.com">
                </div>
                
                <div class="form-group">
                    <label for="username">用户名/邮箱</label>
                    <input type="text" id="username" placeholder="您的登录账号">
                </div>
                
                <div class="form-group">
                    <label for="savedPassword">密码</label>
                    <input type="text" id="savedPassword" placeholder="点击生成或输入密码">
                </div>
                
                <div class="form-group">
                    <label for="notes">备注</label>
                    <input type="text" id="notes" placeholder="可选备注信息">
                </div>
                
                <div class="form-group">
                    <button id="saveBtn">
                        <i class="fas fa-save"></i> 保存到浏览器
                    </button>
                    <button id="exportBtn" class="btn-secondary">
                        <i class="fas fa-file-word"></i> 导出为Word文档
                    </button>
                </div>
            </section>
        </main>
        
        <section class="card saved-passwords">
            <h2 class="card-title"><i class="fas fa-history"></i> 已保存的密码</h2>
            
            <div id="savedPasswordsList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>暂无保存的密码</h3>
                    <p>生成的密码将显示在这里</p>
                </div>
            </div>
        </section>
    </div>
    
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationMessage">操作成功!</span>
    </div>
    
    <footer>
        <p>© 2023 安全密码生成器 | 您的隐私安全是我们的首要任务</p>
    </footer>

    <script>
        // DOM元素
        const passwordLength = document.getElementById('passwordLength');
        const lengthValue = document.getElementById('lengthValue');
        const passwordOutput = document.getElementById('passwordOutput');
        const copyBtn = document.getElementById('copyBtn');
        const generateBtn = document.getElementById('generateBtn');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const tabs = document.querySelectorAll('.tab');
        const websiteInput = document.getElementById('website');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('savedPassword');
        const notesInput = document.getElementById('notes');
        const saveBtn = document.getElementById('saveBtn');
        const exportBtn = document.getElementById('exportBtn');
        const savedPasswordsList = document.getElementById('savedPasswordsList');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notificationMessage');

        // 密码生成选项
        let currentType = 'strong';
        
        // 字符集
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateLengthValue();
            loadSavedPasswords();
            
            // 标签切换
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentType = tab.dataset.type;
                });
            });
        });
        
        // 更新密码长度显示
        passwordLength.addEventListener('input', updateLengthValue);
        
        function updateLengthValue() {
            lengthValue.textContent = `${passwordLength.value}位`;
        }
        
        // 生成密码
        generateBtn.addEventListener('click', generatePassword);
        
        function generatePassword() {
            const length = parseInt(passwordLength.value);
            let charset = '';
            let password = '';
            
            // 根据选择的类型确定字符集
            switch(currentType) {
                case 'strong':
                    charset = lowercase + uppercase + numbers + symbols;
                    break;
                case 'lettersNumbers':
                    charset = lowercase + uppercase + numbers;
                    break;
                case 'lowercaseNumbers':
                    charset = lowercase + numbers;
                    break;
                case 'random':
                    charset = lowercase + uppercase + numbers + symbols;
                    break;
            }
            
            // 确保密码包含所需字符类型（对于非随机类型）
            if (currentType !== 'random') {
                password += getRandomChar(lowercase);
                
                if (currentType === 'strong' || currentType === 'lettersNumbers') {
                    password += getRandomChar(uppercase);
                }
                
                password += getRandomChar(numbers);
                
                if (currentType === 'strong') {
                    password += getRandomChar(symbols);
                }
            }
            
            // 填充剩余长度
            for (let i = password.length; i < length; i++) {
                password += getRandomChar(charset);
            }
            
            // 随机打乱密码字符
            password = shuffleString(password);
            
            // 显示密码
            passwordOutput.value = password;
            passwordInput.value = password;
            
            // 评估密码强度
            evaluatePasswordStrength(password);
        }
        
        // 获取随机字符
        function getRandomChar(charset) {
            return charset.charAt(Math.floor(Math.random() * charset.length));
        }
        
        // 随机打乱字符串
        function shuffleString(string) {
            const array = string.split('');
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array.join('');
        }
        
        // 评估密码强度
        function evaluatePasswordStrength(password) {
            let strength = 0;
            
            // 长度评分
            if (password.length >= 12) strength += 2;
            else if (password.length >= 8) strength += 1;
            
            // 字符类型评分
            if (/[a-z]/.test(password)) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
            
            // 更新UI
            strengthBar.className = 'strength-bar';
            strengthBar.classList.add(`strength-${strength}`);
            
            // 更新文本
            const strengthLabels = ['非常弱', '弱', '中等', '强', '非常强'];
            strengthText.textContent = strengthLabels[strength] || '未知';
        }
        
        // 复制密码
        copyBtn.addEventListener('click', function() {
            passwordOutput.select();
            document.execCommand('copy');
            showNotification('密码已复制到剪贴板!', 'success');
        });
        
        // 保存密码
        saveBtn.addEventListener('click', savePassword);
        
        function savePassword() {
            const website = websiteInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const notes = notesInput.value.trim();
            
            if (!website || !username || !password) {
                showNotification('请填写网站、用户名和密码!', 'error');
                return;
            }
            
            if (password.length < 8) {
                showNotification('密码长度必须至少为8位!', 'error');
                return;
            }
            
            const passwordData = {
                id: Date.now(),
                website,
                username,
                password,
                notes,
                date: new Date().toLocaleString()
            };
            
            // 获取现有密码或初始化数组
            let savedPasswords = JSON.parse(localStorage.getItem('savedPasswords')) || [];
            savedPasswords.push(passwordData);
            
            // 保存到localStorage
            localStorage.setItem('savedPasswords', JSON.stringify(savedPasswords));
            
            // 更新UI
            loadSavedPasswords();
            
            // 仅清空密码输入框
            passwordInput.value = '';
            
            showNotification('密码保存成功!', 'success');
        }
        
        // 加载保存的密码
        function loadSavedPasswords() {
            const savedPasswords = JSON.parse(localStorage.getItem('savedPasswords')) || [];
            
            if (savedPasswords.length === 0) {
                savedPasswordsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>暂无保存的密码</h3>
                        <p>生成的密码将显示在这里</p>
                    </div>
                `;
                return;
            }
            
            savedPasswordsList.innerHTML = '';
            
            savedPasswords.forEach(pwd => {
                const passwordItem = document.createElement('div');
                passwordItem.className = 'password-item';
                passwordItem.innerHTML = `
                    <div>
                        <h3>${escapeHTML(pwd.website)}</h3>
                        <div>${escapeHTML(pwd.username)}</div>
                        <div class="password-value">${escapeHTML(pwd.password)}</div>
                        ${pwd.notes ? `<div><small>备注: ${escapeHTML(pwd.notes)}</small></div>` : ''}
                        <div><small>保存时间: ${escapeHTML(pwd.date)}</small></div>
                    </div>
                    <div class="actions">
                        <button class="copy-pwd-btn" data-password="${escapeHTML(pwd.password)}">
                            <i class="far fa-copy"></i>
                        </button>
                        <button class="delete-pwd-btn btn-danger" data-id="${pwd.id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                savedPasswordsList.appendChild(passwordItem);
            });
            
            // 添加复制和删除事件
            document.querySelectorAll('.copy-pwd-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const password = this.dataset.password;
                    navigator.clipboard.writeText(password);
                    showNotification('密码已复制到剪贴板!', 'success');
                });
            });
            
            document.querySelectorAll('.delete-pwd-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    deletePassword(id);
                });
            });
        }
        
        // 删除密码
        function deletePassword(id) {
            let savedPasswords = JSON.parse(localStorage.getItem('savedPasswords')) || [];
            savedPasswords = savedPasswords.filter(pwd => pwd.id !== id);
            localStorage.setItem('savedPasswords', JSON.stringify(savedPasswords));
            loadSavedPasswords();
            showNotification('密码已删除!', 'success');
        }
        
        // 导出为Word
        exportBtn.addEventListener('click', exportToWord);
        
        function exportToWord() {
            const savedPasswords = JSON.parse(localStorage.getItem('savedPasswords')) || [];
            
            if (savedPasswords.length === 0) {
                showNotification('没有可导出的密码!', 'error');
                return;
            }
            
            let tableHTML = `
                <table border="1" style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background-color:#4361ee; color:white;">
                            <th style="padding:10px;">网站/应用</th>
                            <th style="padding:10px;">用户名</th>
                            <th style="padding:10px;">密码</th>
                            <th style="padding:10px;">备注</th>
                            <th style="padding:10px;">保存时间</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            savedPasswords.forEach(pwd => {
                tableHTML += `
                    <tr>
                        <td style="padding:8px;">${escapeHTML(pwd.website)}</td>
                        <td style="padding:8px;">${escapeHTML(pwd.username)}</td>
                        <td style="padding:8px; font-family:Consolas, monospace;">${escapeHTML(pwd.password)}</td>
                        <td style="padding:8px;">${escapeHTML(pwd.notes || '-')}</td>
                        <td style="padding:8px;">${escapeHTML(pwd.date)}</td>
                    </tr>
                `;
            });
            
            tableHTML += `
                    </tbody>
                </table>
            `;
            
            const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>密码导出</title></head><body>";
            const postHtml = "</body></html>";
            const html = preHtml + tableHTML + postHtml;
            
            const blob = new Blob(['\ufeff', html], {
                type: 'application/msword'
            });
            
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            
            downloadLink.href = url;
            downloadLink.download = '我的密码列表.doc';
            downloadLink.click();
            
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
            
            showNotification('密码已导出为Word文档!', 'success');
        }
        
        // 显示通知
        function showNotification(message, type) {
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // HTML转义函数
        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[tag]));
        }
        
        // 初始生成一个密码
        generatePassword();
    </script>
