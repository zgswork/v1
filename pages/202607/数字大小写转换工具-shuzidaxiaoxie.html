<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字大小写转换工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #2575fc, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .converter-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px;
            position: relative;
            z-index: 1;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-container i {
            position: absolute;
            left: 15px;
            color: #6a11cb;
            font-size: 1.2rem;
        }
        
        #numberInput {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            outline: none;
            color: #2c3e50;
        }
        
        #numberInput:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .input-hint {
            font-size: 0.9rem;
            color: #95a5a6;
            margin-top: 8px;
            margin-left: 10px;
        }
        
        .result-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            border: 1px solid #e9ecef;
            margin-top: 20px;
            position: relative;
        }
        
        #result {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 500;
            line-height: 1.6;
            min-height: 40px;
            padding: 10px;
        }
        
        .result-placeholder {
            color: #95a5a6;
            font-style: italic;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        #convertBtn {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
        
        #convertBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
        }
        
        #resetBtn {
            background: #f8f9fa;
            color: #6a11cb;
            border: 2px solid #e0e0e0;
        }
        
        #resetBtn:hover {
            background: #e9ecef;
        }
        
        .examples {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }
        
        .examples h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .example-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .example-item {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            border-left: 4px solid #6a11cb;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .example-item .number {
            font-weight: 600;
            color: #2575fc;
        }
        
        .example-item .chinese {
            font-size: 0.9rem;
            color: #2c3e50;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            #result {
                font-size: 1.3rem;
            }
            
            .example-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-exchange-alt"></i> 数字大小写转换工具</h1>
            <p>将阿拉伯数字金额转换为符合财务规范的中文大写金额，支持万亿级别数字转换</p>
        </div>
        
        <div class="converter-card">
            <div class="input-group">
                <label for="numberInput">输入金额（阿拉伯数字）</label>
                <div class="input-container">
                    <i class="fas fa-calculator"></i>
                    <input type="text" id="numberInput" placeholder="例如：12345.67" autocomplete="off">
                </div>
                <div class="input-hint">支持整数或小数，最大到万亿级别（12位整数）</div>
            </div>
            
            <div class="result-container">
                <div id="result" class="result-placeholder">转换结果将显示在这里</div>
            </div>
            
            <div class="btn-group">
                <button id="convertBtn">
                    <i class="fas fa-sync-alt"></i> 立即转换
                </button>
                <button id="resetBtn">
                    <i class="fas fa-redo"></i> 重置
                </button>
            </div>
        </div>
        
        <div class="examples">
            <h3><i class="fas fa-lightbulb"></i> 转换示例</h3>
            <div class="example-list">
                <div class="example-item">
                    <div class="number">123.45</div>
                    <div class="chinese">壹佰贰拾叁元肆角伍分</div>
                </div>
                <div class="example-item">
                    <div class="number">1024</div>
                    <div class="chinese">壹仟零贰拾肆元整</div>
                </div>
                <div class="example-item">
                    <div class="number">1000000.00</div>
                    <div class="chinese">壹佰万元整</div>
                </div>
                <div class="example-item">
                    <div class="number">789.03</div>
                    <div class="chinese">柒佰捌拾玖元零叁分</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 数字大小写转换工具 | 符合财务规范的大写金额转换</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const numberInput = document.getElementById('numberInput');
            const resultDiv = document.getElementById('result');
            const convertBtn = document.getElementById('convertBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            // 转换按钮事件
            convertBtn.addEventListener('click', function() {
                const inputValue = numberInput.value.trim();
                if (!inputValue) {
                    resultDiv.innerHTML = '<span style="color:#e74c3c;">请输入要转换的数字金额</span>';
                    return;
                }
                
                // 验证输入是否为有效数字
                if (!/^-?\d*(\.\d*)?$/.test(inputValue)) {
                    resultDiv.innerHTML = '<span style="color:#e74c3c;">输入内容包含非数字字符，请重新输入</span>';
                    return;
                }
                
                // 转换为大写
                const result = convertToChinese(inputValue);
                resultDiv.textContent = result;
                resultDiv.classList.remove('result-placeholder');
            });
            
            // 重置按钮事件
            resetBtn.addEventListener('click', function() {
                numberInput.value = '';
                resultDiv.textContent = '转换结果将显示在这里';
                resultDiv.classList.add('result-placeholder');
                numberInput.focus();
            });
            
            // 按Enter键转换
            numberInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    convertBtn.click();
                }
            });
            
            // 数字转中文大写函数
            function convertToChinese(numStr) {
                // 中文数字字符
                const chineseNum = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
                // 中文单位
                const chineseUnit = ['', '拾', '佰', '仟'];
                const sectionUnit = ['', '万', '亿', '万亿'];
                const decimalUnit = ['角', '分'];
                
                // 处理负号
                let isNegative = false;
                if (numStr.startsWith('-')) {
                    isNegative = true;
                    numStr = numStr.substring(1);
                }
                
                // 分割整数和小数部分
                let parts = numStr.split('.');
                let integerPart = parts[0].replace(/^0+/, '') || '0';
                let decimalPart = parts[1] ? parts[1].substring(0, 2).padEnd(2, '0') : '00';
                
                // 检查整数部分长度
                if (integerPart.length > 16) {
                    return '数字过大，超过万亿级别';
                }
                
                // 处理整数部分为0的情况
                if (integerPart === '0' && decimalPart === '00') {
                    return '零元整';
                }
                
                // 转换整数部分
                let integerResult = '';
                if (integerPart !== '0') {
                    // 每4位一节
                    const sections = [];
                    let rest = integerPart;
                    while (rest.length > 0) {
                        sections.push(rest.substring(Math.max(0, rest.length - 4)));
                        rest = rest.substring(0, Math.max(0, rest.length - 4));
                    }
                    
                    // 处理每一节
                    sections.reverse();
                    for (let i = 0; i < sections.length; i++) {
                        const section = sections[i];
                        let sectionResult = '';
                        let hasNonZero = false;
                        let zeroFlag = false;
                        
                        for (let j = 0; j < section.length; j++) {
                            const digit = parseInt(section[j]);
                            const position = section.length - j - 1;
                            
                            if (digit === 0) {
                                if (hasNonZero) {
                                    zeroFlag = true;
                                }
                            } else {
                                if (zeroFlag) {
                                    sectionResult += '零';
                                    zeroFlag = false;
                                }
                                sectionResult += chineseNum[digit] + chineseUnit[position];
                                hasNonZero = true;
                            }
                        }
                        
                        // 添加节单位（万、亿等）
                        if (sectionResult !== '') {
                            integerResult += sectionResult + sectionUnit[sections.length - i - 1];
                        }
                    }
                    integerResult += '元';
                } else {
                    integerResult = '零元';
                }
                
                // 转换小数部分
                let decimalResult = '';
                const jiao = parseInt(decimalPart[0]);
                const fen = parseInt(decimalPart[1]);
                
                if (jiao === 0 && fen === 0) {
                    decimalResult = '整';
                } else {
                    if (jiao !== 0) {
                        decimalResult += chineseNum[jiao] + decimalUnit[0];
                    }
                    if (fen !== 0) {
                        // 当角为0但分不为0时，需要添加"零"
                        if (jiao === 0 && integerPart !== '0') {
                            decimalResult += '零';
                        }
                        decimalResult += chineseNum[fen] + decimalUnit[1];
                    }
                }
                
                // 组合结果
                let result = integerResult + decimalResult;
                
                // 处理特殊情况：0元+小数部分
                if (integerPart === '0' && decimalResult !== '') {
                    result = '零元' + decimalResult;
                }
                
                // 添加负号
                if (isNegative) {
                    result = '负' + result;
                }
                
                return result;
            }
            
            // 初始聚焦到输入框
            numberInput.focus();
        });
    </script>
</body>
</html>
