<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业刮刮卡 - 趣味学习工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.3);
            color: white;
            font-weight: bold;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 编辑模式样式 */
        .edit-panel {
            display: none;
        }

        .edit-panel.active {
            display: block;
        }

        .config-panel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .config-section {
            margin-bottom: 20px;
        }

        .config-section:last-child {
            margin-bottom: 0;
        }

        .config-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .template-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .template-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56,239,125,0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(235,51,73,0.4);
        }

        /* 批量生成区域 */
        .batch-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .batch-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .batch-list {
            display: grid;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .batch-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .batch-item-number {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .batch-item-content {
            flex: 1;
        }

        .batch-item-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .batch-item-text {
            color: #666;
            font-size: 0.9rem;
        }

        .batch-item-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .icon-btn.edit {
            background: #e3f2fd;
            color: #1976d2;
        }

        .icon-btn.delete {
            background: #ffebee;
            color: #c62828;
        }

        .batch-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .batch-count {
            font-size: 1.1rem;
            color: #667eea;
            font-weight: bold;
        }

        /* 使用模式样式 */
        .use-panel {
            display: none;
        }

        .use-panel.active {
            display: block;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .scratch-card-wrapper {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .scratch-card-wrapper:hover {
            transform: translateY(-5px);
        }

        .scratch-card {
            position: relative;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .scratch-card.cartoon {
            background: linear-gradient(135deg, #FFE066 0%, #FF6B9D 100%);
        }

        .scratch-card.simple {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
        }

        .scratch-card.blue {
            background: linear-gradient(135deg, #64B5F6 0%, #42A5F5 100%);
        }

        .scratch-card-content {
            padding: 30px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scratch-card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .scratch-card-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
        }

        .scratch-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .scratch-canvas {
            display: block;
            touch-action: none;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .card-footer button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .card-footer .reset-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .card-footer .reset-btn:hover {
            background: #bbdefb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .congratulations {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: popIn 0.5s ease;
            display: none;
            z-index: 10;
        }

        .congratulations.show {
            display: block;
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* 添加模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #667eea;
            font-size: 1.3rem;
        }

        .modal-close {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .config-panel {
                padding: 20px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 20px;
            }

            .header,
            .mode-switch,
            .edit-panel,
            .card-footer,
            .modal,
            .use-panel > div:first-child {
                display: none !important;
            }

            .use-panel {
                display: block !important;
            }

            .scratch-card-wrapper {
                box-shadow: none;
                page-break-inside: avoid;
                margin-bottom: 20px;
                padding: 0;
                background: transparent;
            }

            .scratch-card {
                /* 强制打印背景色和渐变 */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border: 1px solid #ddd;
            }

            .scratch-card-content {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .scratch-canvas-container {
                display: none;
            }

            .cards-grid {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 作业刮刮卡</h1>
            <p>趣味学习工具，让孩子爱上作业</p>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" data-mode="edit">🔧 编辑模式</button>
            <button class="mode-btn" data-mode="use">🎮 使用模式</button>
        </div>

        <!-- 编辑模式 -->
        <div class="edit-panel active" id="editPanel">
            <div class="config-panel">
                <div class="config-section">
                    <h3>📋 快速添加刮刮卡</h3>
                    <div class="form-group">
                        <label for="cardTitle">刮刮卡标题</label>
                        <input type="text" id="cardTitle" value="🎉 今日奖励" placeholder="输入刮刮卡标题">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cardStyle">背景样式</label>
                            <select id="cardStyle">
                                <option value="cartoon">🎨 卡通风格</option>
                                <option value="simple">🌿 简约风格</option>
                                <option value="blue">🌊 海洋风格</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cardType">类型</label>
                            <select id="cardType">
                                <option value="reward">🎁 奖励型</option>
                                <option value="homework">📝 作业型</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cardContent">刮刮卡内容</label>
                        <textarea id="cardContent" placeholder="输入刮刮卡内的内容...">今晚免写作业！
可以看30分钟动画片！</textarea>
                        <div class="template-buttons" id="templateButtons">
                            <!-- 模板按钮会根据类型动态生成 -->
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn btn-primary" id="addCardBtn">➕ 添加到列表</button>
                        <button class="action-btn btn-success" id="addMultipleBtn">🔢 批量添加</button>
                    </div>
                </div>
            </div>

            <div class="batch-section">
                <h3>📦 刮刮卡列表 <span id="cardCount">(0)</span></h3>
                <div class="batch-list" id="batchList">
                    <div style="text-align: center; padding: 40px; color: #999;">
                        还没有添加刮刮卡，快去添加吧！
                    </div>
                </div>
                <div class="batch-summary">
                    <div class="batch-count">共 <span id="totalCount">0</span> 张刮刮卡</div>
                    <div class="action-buttons" style="margin-top: 0;">
                        <button class="action-btn btn-danger" id="clearAllBtn">🗑️ 清空列表</button>
                        <button class="action-btn btn-success" id="printAllBtn">🖨️ 打印全部</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 使用模式 -->
        <div class="use-panel" id="usePanel">
            <div style="text-align: center; margin-bottom: 20px;">
                <button class="action-btn btn-primary" onclick="shuffleCards()" style="max-width: 300px; margin: 0 auto;">
                    🎲 重新随机排序
                </button>
            </div>
            <div class="cards-grid" id="cardsGrid">
                <div class="empty-state">
                    <h3>还没有刮刮卡</h3>
                    <p>请先切换到编辑模式添加刮刮卡</p>
                    <button class="action-btn btn-primary" onclick="switchToEditMode()">前往添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 编辑刮刮卡</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="config-section">
                <div class="form-group">
                    <label for="editCardTitle">刮刮卡标题</label>
                    <input type="text" id="editCardTitle">
                </div>
                <div class="form-group">
                    <label for="editCardStyle">背景样式</label>
                    <select id="editCardStyle">
                        <option value="cartoon">🎨 卡通风格</option>
                        <option value="simple">🌿 简约风格</option>
                        <option value="blue">🌊 海洋风格</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editCardContent">刮刮卡内容</label>
                    <textarea id="editCardContent"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="action-btn btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="action-btn btn-primary" id="saveEditBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 批量添加模态框 -->
    <div class="modal" id="batchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔢 批量添加刮刮卡</h3>
                <button class="modal-close" onclick="closeBatchModal()">&times;</button>
            </div>
            <div class="config-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="batchCount">添加数量</label>
                        <input type="number" id="batchCount" value="10" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label for="batchType">类型</label>
                        <select id="batchType">
                            <option value="reward">🎁 奖励型</option>
                            <option value="homework">📝 作业型</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="batchCardTitle">刮刮卡标题</label>
                    <input type="text" id="batchCardTitle" value="🎉 神秘奖励">
                </div>
                <div class="form-group">
                    <label for="batchCardStyle">背景样式</label>
                    <select id="batchCardStyle">
                        <option value="cartoon">🎨 卡通风格</option>
                        <option value="simple">🌿 简约风格</option>
                        <option value="blue">🌊 海洋风格</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="batchOptionsLabel">奖励选项（每张随机选择一个）</label>
                    <textarea id="batchOptions" placeholder="每行一个选项，例如：&#10;今晚免写作业！&#10;作业减半！&#10;可以看30分钟动画片！">今晚免写作业！
作业减半！
可以看30分钟动画片！
可以获得一份小零食！
可以下楼玩耍1小时！</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="action-btn btn-secondary" onclick="closeBatchModal()">取消</button>
                <button class="action-btn btn-primary" id="confirmBatchBtn">生成</button>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let cards = JSON.parse(localStorage.getItem('scratchCards') || '[]');
        let editingCardId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            bindModeSwitch();
            bindConfigEvents();
            loadTemplateButtons();
            renderBatchList();
            renderCardsGrid();
        }

        // 模式切换
        function bindModeSwitch() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const mode = e.target.dataset.mode;
                    switchMode(mode);
                });
            });
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

            document.getElementById('editPanel').classList.toggle('active', mode === 'edit');
            document.getElementById('usePanel').classList.toggle('active', mode === 'use');

            if (mode === 'use') {
                renderCardsGrid();
            }
        }

        function switchToEditMode() {
            switchMode('edit');
        }

        // 配置面板事件
        function bindConfigEvents() {
            // 类型切换
            document.getElementById('cardType').addEventListener('change', (e) => {
                loadTemplateButtons();
                // 根据类型更新默认标题
                const titleInput = document.getElementById('cardTitle');
                const currentTitle = titleInput.value;
                // 只有当标题是默认标题时才自动更新
                if (currentTitle === '🎉 今日奖励' || currentTitle === '📝 今日作业') {
                    titleInput.value = e.target.value === 'reward' ? '🎉 今日奖励' : '📝 今日作业';
                }
            });

            // 添加单张
            document.getElementById('addCardBtn').addEventListener('click', addSingleCard);

            // 批量添加
            document.getElementById('addMultipleBtn').addEventListener('click', openBatchModal);

            // 清空
            document.getElementById('clearAllBtn').addEventListener('click', clearAllCards);

            // 打印（打印前先随机排序）
            document.getElementById('printAllBtn').addEventListener('click', () => {
                renderCardsGrid(); // 重新渲染以随机排序
                setTimeout(() => window.print(), 100);
            });

            // 保存编辑
            document.getElementById('saveEditBtn').addEventListener('click', saveEditCard);

            // 确认批量
            document.getElementById('confirmBatchBtn').addEventListener('click', confirmBatchAdd);

            // 批量模态框类型切换
            document.getElementById('batchType').addEventListener('change', (e) => {
                const titleInput = document.getElementById('batchCardTitle');
                const label = document.getElementById('batchOptionsLabel');
                const currentTitle = titleInput.value;

                // 根据类型更新标签和默认标题
                if (e.target.value === 'homework') {
                    label.textContent = '作业选项（每张随机选择一个）';
                    if (currentTitle === '🎉 神秘奖励' || currentTitle === '🎉 神秘任务') {
                        titleInput.value = '📝 今日作业';
                    }
                } else {
                    label.textContent = '奖励选项（每张随机选择一个）';
                    if (currentTitle === '📝 今日作业') {
                        titleInput.value = '🎉 神秘奖励';
                    }
                }
            });
        }

        // 加载模板按钮
        function loadTemplateButtons() {
            const type = document.getElementById('cardType').value;
            const container = document.getElementById('templateButtons');
            const templates = type === 'reward' ? [
                { label: '免作业', content: '今晚免写作业！' },
                { label: '作业减半', content: '今晚作业减半！' },
                { label: '亲子时间', content: '可以和爸爸妈妈一起玩30分钟！' },
                { label: '看动画片', content: '可以看30分钟动画片！' },
                { label: '零食奖励', content: '可以获得一份小零食！' },
                { label: '外出玩耍', content: '可以下楼玩耍1小时！' }
            ] : [
                { label: '数学练习', content: '完成10道数学题\n阅读20分钟' },
                { label: '语文作业', content: '抄写生字2遍\n背诵古诗一首' },
                { label: '英语任务', content: '跟读英语课文3遍\n背诵单词10个' },
                { label: '轻松作业', content: '阅读绘本1本\n完成练习册1页' },
                { label: '创意作业', content: '画一幅画\n写一篇日记' },
                { label: '综合任务', content: '完成数学作业\n背诵课文\n预习明天课程' }
            ];

            container.innerHTML = templates.map(t =>
                `<button class="template-btn" data-content="${escapeHtml(t.content)}">${t.label}</button>`
            ).join('');

            container.querySelectorAll('.template-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.getElementById('cardContent').value = unescapeHtml(e.target.dataset.content);
                });
            });
        }

        function escapeHtml(text) {
            return text.replace(/\n/g, '\\n').replace(/"/g, '&quot;');
        }

        function unescapeHtml(text) {
            return text.replace(/\\n/g, '\n').replace(/&quot;/g, '"');
        }

        // 添加单张刮刮卡
        function addSingleCard() {
            const type = document.getElementById('cardType').value;
            const titleInput = document.getElementById('cardTitle').value.trim();
            const content = document.getElementById('cardContent').value.trim() || '惊喜内容！';
            const style = document.getElementById('cardStyle').value;

            // 根据类型设置默认标题
            let title = titleInput;
            if (!title) {
                title = type === 'homework' ? '📝 今日作业' : '🎉 今日奖励';
            }

            const card = {
                id: Date.now(),
                title,
                content,
                style,
                type,
                createdAt: new Date().toISOString()
            };

            cards.push(card);
            saveCards();
            renderBatchList();
            renderCardsGrid();

            // 清空内容输入，保留标题和样式设置
            document.getElementById('cardContent').value = '';
        }

        // 批量添加
        function openBatchModal() {
            document.getElementById('batchModal').classList.add('show');
        }

        function closeBatchModal() {
            document.getElementById('batchModal').classList.remove('show');
        }

        function confirmBatchAdd() {
            const count = parseInt(document.getElementById('batchCount').value) || 10;
            const type = document.getElementById('batchType').value;
            const titleInput = document.getElementById('batchCardTitle').value.trim();
            const style = document.getElementById('batchCardStyle').value;
            const options = document.getElementById('batchOptions').value.trim().split('\n').filter(o => o.trim());

            if (options.length === 0) {
                alert('请至少输入一个选项！');
                return;
            }

            // 根据类型设置默认标题
            let title = titleInput;
            if (!title) {
                title = type === 'homework' ? '📝 今日作业' : '🎉 神秘奖励';
            }

            for (let i = 0; i < count; i++) {
                const card = {
                    id: Date.now() + i,
                    title,
                    content: options[Math.floor(Math.random() * options.length)],
                    style,
                    type,
                    createdAt: new Date().toISOString()
                };
                cards.push(card);
            }

            saveCards();
            renderBatchList();
            renderCardsGrid();
            closeBatchModal();
        }

        // 渲染批量列表
        function renderBatchList() {
            const container = document.getElementById('batchList');
            const countSpan = document.getElementById('cardCount');
            const totalSpan = document.getElementById('totalCount');

            countSpan.textContent = `(${cards.length})`;
            totalSpan.textContent = cards.length;

            if (cards.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">还没有添加刮刮卡，快去添加吧！</div>';
                return;
            }

            container.innerHTML = cards.map((card, index) => `
                <div class="batch-item">
                    <div class="batch-item-number">${index + 1}</div>
                    <div class="batch-item-content">
                        <div class="batch-item-title">${escapeHtml(card.title)}</div>
                        <div class="batch-item-text">${escapeHtml(card.content.substring(50))}${card.content.length > 50 ? '...' : ''}</div>
                    </div>
                    <div class="batch-item-actions">
                        <button class="icon-btn edit" onclick="openEditModal(${card.id})" title="编辑">✏️</button>
                        <button class="icon-btn delete" onclick="deleteCard(${card.id})" title="删除">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // 编辑刮刮卡
        function openEditModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;

            editingCardId = id;
            document.getElementById('editCardTitle').value = card.title;
            document.getElementById('editCardStyle').value = card.style;
            document.getElementById('editCardContent').value = card.content;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingCardId = null;
        }

        function saveEditCard() {
            if (!editingCardId) return;

            const cardIndex = cards.findIndex(c => c.id === editingCardId);
            if (cardIndex === -1) return;

            cards[cardIndex].title = document.getElementById('editCardTitle').value.trim() || '🎉 刮刮卡';
            cards[cardIndex].style = document.getElementById('editCardStyle').value;
            cards[cardIndex].content = document.getElementById('editCardContent').value.trim() || '惊喜内容！';

            saveCards();
            renderBatchList();
            renderCardsGrid();
            closeEditModal();
        }

        // 删除刮刮卡
        function deleteCard(id) {
            if (!confirm('确定要删除这张刮刮卡吗？')) return;
            cards = cards.filter(c => c.id !== id);
            saveCards();
            renderBatchList();
            renderCardsGrid();
        }

        // 清空列表
        function clearAllCards() {
            if (!confirm('确定要清空所有刮刮卡吗？')) return;
            cards = [];
            saveCards();
            renderBatchList();
            renderCardsGrid();
        }

        // 保存到本地存储
        function saveCards() {
            localStorage.setItem('scratchCards', JSON.stringify(cards));
        }

        // 渲染使用模式的刮刮卡网格
        function renderCardsGrid() {
            const container = document.getElementById('cardsGrid');

            if (cards.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>还没有刮刮卡</h3>
                        <p>请先切换到编辑模式添加刮刮卡</p>
                        <button class="action-btn btn-primary" onclick="switchToEditMode()">前往添加</button>
                    </div>
                `;
                return;
            }

            // 随机打乱顺序（在使用模式中）
            const shuffledCards = [...cards].sort(() => Math.random() - 0.5);

            container.innerHTML = shuffledCards.map((card, index) => `
                <div class="scratch-card-wrapper">
                    <div class="scratch-card ${card.style}" id="card-${card.id}" style="width: 100%; height: 200px;">
                        <div class="scratch-card-content">
                            <div class="scratch-card-title">${escapeHtml(card.title)}</div>
                            <div class="scratch-card-text">${escapeHtml(card.content)}</div>
                        </div>
                        <div class="scratch-canvas-container">
                            <canvas class="scratch-canvas" data-id="${card.id}"></canvas>
                        </div>
                        <div class="congratulations" id="congratulations-${card.id}">🎊 恭喜！</div>
                    </div>
                    <div class="card-footer">
                        <button class="reset-btn" onclick="resetCard(${card.id})">🔄 重置</button>
                    </div>
                </div>
            `).join('');

            // 初始化所有Canvas
            setTimeout(() => {
                shuffledCards.forEach(card => {
                    initCardCanvas(card.id);
                });
            }, 100);
        }

        // 初始化单个刮刮卡Canvas
        function initCardCanvas(cardId) {
            const canvas = document.querySelector(`canvas[data-id="${cardId}"]`);
            if (!canvas) return;

            const card = document.getElementById(`card-${cardId}`);
            const ctx = canvas.getContext('2d');

            canvas.width = card.offsetWidth;
            canvas.height = card.offsetHeight;

            // 绘制刮层
            ctx.fillStyle = '#CCCCCC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 添加纹理
            ctx.fillStyle = '#BBBBBB';
            for (let i = 0; i < canvas.width; i += 4) {
                for (let j = 0; j < canvas.height; j += 4) {
                    if ((i + j) % 8 === 0) {
                        ctx.fillRect(i, j, 2, 2);
                    }
                }
            }

            // 添加文字提示
            ctx.fillStyle = '#666666';
            ctx.font = 'bold 20px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👆 刮一刮', canvas.width / 2, canvas.height / 2);

            let isDrawing = false;
            let scratchedPixels = 0;
            const totalPixels = canvas.width * canvas.height;

            function getCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startScratch(e) {
                isDrawing = true;
                scratch(e);
            }

            function scratch(e) {
                if (!isDrawing) return;
                e.preventDefault();

                const coords = getCoords(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, 20, 0, Math.PI * 2);
                ctx.fill();
            }

            function stopScratch() {
                if (isDrawing) {
                    isDrawing = false;
                    checkProgress();
                }
            }

            function checkProgress() {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let transparentPixels = 0;

                for (let i = 3; i < imageData.data.length; i += 4) {
                    if (imageData.data[i] === 0) {
                        transparentPixels++;
                    }
                }

                const progress = (transparentPixels / totalPixels) * 100;

                if (progress >= 50) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    document.getElementById(`congratulations-${cardId}`).classList.add('show');
                    setTimeout(() => {
                        document.getElementById(`congratulations-${cardId}`).classList.remove('show');
                    }, 2000);
                }
            }

            // 绑定事件
            canvas.addEventListener('mousedown', startScratch);
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', stopScratch);
            canvas.addEventListener('mouseleave', stopScratch);
            canvas.addEventListener('touchstart', startScratch);
            canvas.addEventListener('touchmove', scratch);
            canvas.addEventListener('touchend', stopScratch);
        }

        // 重置刮刮卡
        function resetCard(cardId) {
            const canvas = document.querySelector(`canvas[data-id="${cardId}"]`);
            if (!canvas) return;

            const card = document.getElementById(`card-${cardId}`);
            const ctx = canvas.getContext('2d');

            document.getElementById(`congratulations-${cardId}`).classList.remove('show');

            canvas.width = card.offsetWidth;
            canvas.height = card.offsetHeight;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#CCCCCC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#BBBBBB';
            for (let i = 0; i < canvas.width; i += 4) {
                for (let j = 0; j < canvas.height; j += 4) {
                    if ((i + j) % 8 === 0) {
                        ctx.fillRect(i, j, 2, 2);
                    }
                }
            }

            ctx.fillStyle = '#666666';
            ctx.font = 'bold 20px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👆 刮一刮', canvas.width / 2, canvas.height / 2);
        }

        // 重新随机排序刮刮卡
        function shuffleCards() {
            // 添加洗牌动画效果
            const container = document.getElementById('cardsGrid');
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';
            container.style.transition = 'all 0.3s ease';

            setTimeout(() => {
                renderCardsGrid();
                container.style.opacity = '1';
                container.style.transform = 'scale(1)';
            }, 300);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
