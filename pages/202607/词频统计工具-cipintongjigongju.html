<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词频统计工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .input-section, .result-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #e9ecef;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4facfe;
        }

        .textarea-container {
            position: relative;
            margin-bottom: 20px;
        }

        #textInput {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s;
        }

        #textInput:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        #searchInput:focus {
            outline: none;
            border-color: #4facfe;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .frequency-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .frequency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .frequency-item:hover {
            background-color: #f8f9fa;
        }

        .frequency-item:last-child {
            border-bottom: none;
        }

        .word {
            font-weight: 500;
            color: #333;
        }

        .count {
            background: #4facfe;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .highlight {
            background-color: #ffeb3b;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .display-text {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-data {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .search-container {
                flex-direction: column;
            }
        }

        .frequency-list::-webkit-scrollbar {
            width: 6px;
        }

        .frequency-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .frequency-list::-webkit-scrollbar-thumb {
            background: #4facfe;
            border-radius: 3px;
        }

        .frequency-list::-webkit-scrollbar-thumb:hover {
            background: #3a8bfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 智能词频统计工具</h1>
            <p>高质量词语提取，智能过滤，符合语言逻辑的词频分析</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">📝 文本输入</h2>
                
                <div class="textarea-container">
                    <textarea id="textInput" placeholder="请在此处粘贴或输入要分析的文本内容..."></textarea>
                </div>
                
                <div class="controls">
                    <button class="btn btn-primary" onclick="analyzeText()">🔍 智能分析</button>
                    <button class="btn btn-secondary" onclick="clearText()">🗑️ 清空文本</button>
                </div>
                
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="输入要查询的词语...">
                    <button class="btn btn-primary" onclick="searchWord()">🔎 查询</button>
                </div>
                
                <div class="stats" id="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="totalChars">0</div>
                        <div class="stat-label">总字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="totalWords">0</div>
                        <div class="stat-label">有效词数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="uniqueWords">0</div>
                        <div class="stat-label">不重复词数</div>
                    </div>
                </div>
            </div>
            
            <div class="result-section">
                <h2 class="section-title">📈 智能分析结果</h2>
                
                <div class="frequency-list" id="frequencyList">
                    <div class="no-data">请输入文本并点击"智能分析"开始分析</div>
                </div>
                
                <h3 class="section-title" style="margin-top: 30px;">🎯 高亮显示</h3>
                <div class="display-text" id="displayText">
                    <div class="no-data">分析结果将在此处显示</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let wordFrequency = {};
        let originalText = '';
        let currentHighlightWord = '';

        // 转义正则表达式特殊字符
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 提取词语的函数
        function extractWords(text) {
            const words = [];
            
            // 常见停用词
            const stopWords = new Set([
                '的', '了', '在', '是', '我', '有', '和', '就', '不', '人', '都', '一', '一个', '上', '也', '很', '到', '说', '要', '去', '你', '会', '着', '没有', '看', '好', '自己', '这样', '那么', '什么', '知道', '这个', '那个', '可以', '但是', '因为', '所以', '如果', '虽然', '然后', '或者', '而且', '不过', '只是', '还是', '已经', '正在', '可能', '应该', '需要', '希望', '觉得', '认为', '发现', '开始', '继续', '结束', '完成', '进行', '实现', '达到', '得到', '成为', '变成', '出现', '产生', '形成', '建立', '创造', '提供', '获得', '接受', '使用', '利用', '采用', '选择', '决定', '确定', '解决', '处理', '面对', '遇到', '碰到', '发生', '出来', '起来', '下来', '过来', '回来', '带来', '拿来', '做出', '作出', '给出', '提出', '指出', '说出', '讲出', '想出', '找出', '看出', '听出', '感到', '感觉', '感受', '体验', '经历', '遭受', '承受', '忍受', '享受', '拥有', '具有', '含有', '包含', '涉及', '关于', '对于', '由于', '基于', '通过', '经过', '越过', '超过', '达到', '到达', '来到', '回到', '走到', '跑到', '飞到', '游到', '爬到', '跳到', '坐到', '站到', '躺到', '睡到', '醒到', '起到', '倒到', '放到', '拿到', '送到', '带到', '推到', '拉到', '抬到', '举到', '扔到', '丢到', '掉到', '落到', '降到', '升到', '涨到', '跌到', '增到', '减到', '加到', '乘到', '除到', '等到', '盼到', '等等', '之类', '以及', '还有', '包括', '除了', '除非', '只要', '只有', '不仅', '不但', '而且', '并且', '同时', '另外', '此外', '其次', '最后', '总之', '因此', '所以', '于是', '然而', '但是', '可是', '不过', '虽然', '尽管', '即使', '就算', '哪怕', '无论', '不管'
            ]);

            // 专业术语词典（高质量词汇）
            const professionalTerms = new Set([
                '人工智能', '机器学习', '深度学习', '神经网络', '自然语言', '计算机科学', '数据分析', '算法优化', '模式识别', '图像处理', '语音识别', '知识图谱', '专家系统', '决策树', '支持向量机', '随机森林', '卷积神经网络', '循环神经网络', '生成对抗网络', '强化学习', '监督学习', '无监督学习', '半监督学习', '迁移学习', '联邦学习', '边缘计算', '云计算', '大数据', '物联网', '区块链', '虚拟现实', '增强现实', '量子计算', '生物信息学', '基因工程', '纳米技术', '新能源', '可再生能源', '环境保护', '可持续发展', '绿色经济', '循环经济', '数字经济', '共享经济', '平台经济', '创新创业', '科技创新', '技术创新', '产业升级', '转型升级', '高质量发展', '供给侧改革', '需求侧管理', '宏观调控', '货币政策', '财政政策', '金融监管', '风险管理', '投资理财', '资产配置', '价值投资', '成长投资', '量化投资', '对冲基金', '私募股权', '风险投资', '天使投资', '众筹融资', '互联网金融', '移动支付', '数字货币', '电子商务', '网络营销', '社交媒体', '内容营销', '品牌建设', '用户体验', '产品设计', '服务设计', '商业模式', '战略规划', '组织管理', '人力资源', '企业文化', '团队建设', '领导力', '执行力', '沟通能力', '创新能力', '学习能力', '适应能力', '抗压能力', '时间管理', '项目管理', '质量管理', '流程管理', '知识管理', '信息管理', '数据管理', '安全管理', '风险控制', '成本控制', '预算管理', '绩效考核', '激励机制', '薪酬体系', '福利待遇', '职业发展', '培训教育', '终身学习', '在线教育', '远程教育', '混合式学习', '个性化学习', '自主学习', '合作学习', '探究学习', '项目式学习', '问题导向学习', '案例教学', '实践教学', '实验教学', '实习实训', '产教融合', '校企合作', '国际合作', '文化交流', '语言学习', '跨文化沟通'
            ]);

            // 1. 优先提取专业术语
            for (let term of professionalTerms) {
                const regex = new RegExp(term, 'g');
                const matches = text.match(regex);
                if (matches) {
                    words.push(...matches);
                }
            }

            // 2. 提取有意义的中文词组（2-4字）
            const chineseWords = text.match(/[\u4e00-\u9fa5]{2,4}/g) || [];
            const filteredChineseWords = chineseWords.filter(word => {
                // 过滤停用词
                if (stopWords.has(word)) return false;
                
                // 过滤重复字符（如：哈哈、呵呵）
                if (/^(.)\1+$/.test(word)) return false;
                
                // 过滤纯数字词汇
                if (/^\d+$/.test(word)) return false;
                
                // 保留有意义的词汇
                return true;
            });
            words.push(...filteredChineseWords);

            // 3. 提取英文单词（3字符以上）
            const englishWords = text.match(/[a-zA-Z]{3,}/g) || [];
            const filteredEnglishWords = englishWords.filter(word => {
                const lowerWord = word.toLowerCase();
                // 过滤常见英文停用词
                const englishStopWords = ['the', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'from', 'up', 'about', 'into', 'through', 'during', 'before', 'after', 'above', 'below', 'between', 'among', 'this', 'that', 'these', 'those', 'what', 'which', 'who', 'when', 'where', 'why', 'how', 'all', 'any', 'both', 'each', 'few', 'more', 'most', 'other', 'some', 'such', 'only', 'own', 'same', 'so', 'than', 'too', 'very', 'can', 'will', 'just', 'should', 'now'];
                return !englishStopWords.includes(lowerWord);
            });
            words.push(...filteredEnglishWords);

            // 4. 提取数字+单位的组合
            const numberUnits = text.match(/\d+[\u4e00-\u9fa5]{1,2}/g) || [];
            words.push(...numberUnits);

            return words;
        }

        // 精简高效的词语质量评分函数
        function getWordQuality(word) {
            let score = 0;
            
            // 基础长度评分
            if (word.length >= 2 && word.length <= 4) {
                score += 2;
            } else {
                return 0; // 长度不符合直接淘汰
            }
            
            // 高价值专业术语识别（超高分）
            const highValueTerms = [
                '人工智能', '机器学习', '深度学习', '神经网络', '自然语言', '计算机科学',
                '数据分析', '图像识别', '语音识别', '推荐系统', '搜索引擎', '云计算',
                '大数据', '物联网', '区块链', '虚拟现实', '增强现实', '量子计算',
                '科学技术', '创新发展', '智能系统', '信息技术', '网络安全', '软件工程',
                '算法优化', '系统设计', '数据挖掘', '模式识别', '智能分析', '技术应用'
            ];
            
            if (highValueTerms.includes(word)) {
                score += 15; // 专业术语给予最高分
            }
            
            // 高质量词汇模式（严格筛选）
            const highQualityPatterns = [
                /^(智能|学习|技术|系统|发展|创新|应用|研究|分析|设计|管理|服务|方法|数据|信息|网络|平台|功能|质量|效果|价值|目标|环境|能力|方式|工具)$/,
                /^(科学|工程|教育|经济|社会|文化|历史|未来|现代|传统|重要|主要|核心|基础|关键|有效|成功|优秀|先进|专业)$/,
                /^(计算|处理|识别|检测|预测|优化|控制|监控|评估|测试|验证|实现|构建|开发|设计|创建)$/
            ];
            
            for (let pattern of highQualityPatterns) {
                if (pattern.test(word)) {
                    score += 8;
                    break;
                }
            }
            
            // 中等质量词汇模式
            const mediumQualityPatterns = [
                /机器|算法|模型|框架|架构|结构|流程|过程|步骤|阶段|层次|级别|标准|规范|协议|接口/,
                /问题|解决|方案|策略|思路|理念|观点|角度|视角|层面|维度|因素|条件|要求|需求/
            ];
            
            for (let pattern of mediumQualityPatterns) {
                if (pattern.test(word)) {
                    score += 4;
                    break;
                }
            }
            
            // 严格过滤无意义词汇
            const invalidPatterns = [
                /^(.)\1+$/, // 重复字符
                /^[哈呵嘿嗯啊哦额呃嗨哟咦咯]+$/, // 语气词
                /^[的了在是我有和就不人都一上也很到说要去你会着没看好自己这样那么什么知道这个那个可以但是因为所以如果虽然然后或者而且不过只是还是已经正在可能应该需要希望觉得认为发现开始继续结束完成进行实现达到得到成为变成出现产生形成建立创造提供获得接受使用利用采用选择决定确定解决处理面对遇到碰到发生]+$/
            ];
            
            for (let pattern of invalidPatterns) {
                if (pattern.test(word)) {
                    return 0;
                }
            }
            
            return score;
        }

        // 分析文本词频
        function analyzeText() {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                alert('请先输入文本内容！');
                return;
            }

            originalText = text;
            wordFrequency = {};

            // 改进的分词逻辑：提取有意义的词语
            const words = extractWords(text);
            
            // 统计词频并进行质量筛选
            const wordQualityMap = {};
            const uniqueWords = [...new Set(words)];
            
            uniqueWords.forEach(word => {
                const normalizedWord = word.toLowerCase();
                const quality = getWordQuality(word);
                
                // 只保留质量分数大于等于3的词语（提高质量门槛）
                if (quality >= 3) {
                    // 使用正则表达式在原文中精确计数，确保与高亮显示一致
                    const regex = new RegExp(escapeRegExp(word), 'g');
                    const matches = originalText.match(regex);
                    const actualCount = matches ? matches.length : 0;
                    
                    if (actualCount > 0) {
                        wordFrequency[normalizedWord] = actualCount;
                        wordQualityMap[normalizedWord] = quality;
                    }
                }
            });

            // 限制词语数量，只保留最有价值的词汇
            const sortedByQualityAndFreq = Object.entries(wordFrequency)
                .map(([word, count]) => ({
                    word,
                    count,
                    quality: wordQualityMap[word] || 0
                }))
                .sort((a, b) => {
                    // 综合排序：质量分数 * 频次
                    const scoreA = a.quality * a.count;
                    const scoreB = b.quality * b.count;
                    return scoreB - scoreA;
                })
                .slice(0, 50); // 只保留前50个最有价值的词汇

            // 重新构建wordFrequency对象
            wordFrequency = {};
            sortedByQualityAndFreq.forEach(item => {
                wordFrequency[item.word] = item.count;
            });

            // 更新统计信息
            updateStats(text, Object.keys(wordFrequency));
            
            // 显示词频列表
            displayFrequencyList();
            
            // 显示原文
            displayOriginalText();
        }

        // 更新统计信息
        function updateStats(text, words) {
            document.getElementById('totalChars').textContent = text.length;
            document.getElementById('totalWords').textContent = words.length;
            document.getElementById('uniqueWords').textContent = Object.keys(wordFrequency).length;
        }

        // 显示词频列表
        function displayFrequencyList() {
            const frequencyList = document.getElementById('frequencyList');
            
            // 按词频排序
            const sortedWords = Object.entries(wordFrequency)
                .sort((a, b) => b[1] - a[1]);

            if (sortedWords.length === 0) {
                frequencyList.innerHTML = '<div class="no-data">未找到符合质量标准的词语</div>';
                return;
            }

            frequencyList.innerHTML = sortedWords
                .map(([word, count]) => `
                    <div class="frequency-item" onclick="highlightWord('${word}')">
                        <span class="word">${word}</span>
                        <span class="count">${count}</span>
                    </div>
                `).join('');
        }

        // 高亮显示指定词语
        function highlightWord(word) {
            currentHighlightWord = word;
            const displayText = document.getElementById('displayText');
            
            if (!originalText) {
                displayText.innerHTML = '<div class="no-data">请先分析文本</div>';
                return;
            }

            // 创建正则表达式，忽略大小写
            const regex = new RegExp(`(${escapeRegExp(word)})`, 'gi');
            
            // 计算实际匹配次数
            const matches = originalText.match(regex);
            const actualCount = matches ? matches.length : 0;
            
            // 高亮显示
            const highlightedText = originalText.replace(regex, '<span class="highlight">$1</span>');
            
            displayText.innerHTML = highlightedText;
            
            // 更新词频列表中的计数，确保一致性
            const frequencyItems = document.querySelectorAll('.frequency-item');
            frequencyItems.forEach(item => {
                const wordSpan = item.querySelector('.word');
                if (wordSpan && wordSpan.textContent === word) {
                    const countSpan = item.querySelector('.count');
                    if (countSpan) {
                        countSpan.textContent = actualCount;
                        // 同时更新内存中的词频数据
                        wordFrequency[word] = actualCount;
                    }
                }
            });
            
            // 滚动到第一个高亮位置
            const firstHighlight = displayText.querySelector('.highlight');
            if (firstHighlight) {
                firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 搜索指定词语
        function searchWord() {
            const searchInput = document.getElementById('searchInput');
            const word = searchInput.value.trim();
            
            if (!word) {
                alert('请输入要查询的词语！');
                return;
            }

            if (!originalText) {
                alert('请先输入并分析文本！');
                return;
            }

            // 在原文中搜索词语（不区分大小写）
            const regex = new RegExp(escapeRegExp(word), 'gi');
            const matches = originalText.match(regex);
            const count = matches ? matches.length : 0;
            
            if (count === 0) {
                alert(`未找到词语"${word}"！`);
                return;
            }

            // 高亮显示搜索的词语
            highlightWord(word);
            
            // 在词频列表中查找并高亮对应项
            const frequencyItems = document.querySelectorAll('.frequency-item');
            let foundInList = false;
            frequencyItems.forEach(item => {
                item.style.backgroundColor = '';
                const itemWord = item.querySelector('.word').textContent;
                if (itemWord.toLowerCase() === word.toLowerCase()) {
                    item.style.backgroundColor = '#e3f2fd';
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    foundInList = true;
                }
            });

            // 显示查询结果
            if (foundInList) {
                alert(`找到词语"${word}"，在文中出现${count}次，已在词频列表和原文中高亮显示`);
            } else {
                alert(`找到词语"${word}"，在文中出现${count}次，已在原文中高亮显示（该词语未在词频统计列表中）`);
            }
            
            // 清空搜索框
            searchInput.value = '';
        }

        // 显示原文
        function displayOriginalText() {
            const displayText = document.getElementById('displayText');
            if (currentHighlightWord) {
                highlightWord(currentHighlightWord);
            } else {
                displayText.textContent = originalText;
            }
        }

        // 清空文本
        function clearText() {
            if (confirm('确定要清空所有内容吗？')) {
                document.getElementById('textInput').value = '';
                document.getElementById('searchInput').value = '';
                document.getElementById('frequencyList').innerHTML = '<div class="no-data">请输入文本并点击"智能分析"开始分析</div>';
                document.getElementById('displayText').innerHTML = '<div class="no-data">分析结果将在此处显示</div>';
                
                // 重置统计
                document.getElementById('totalChars').textContent = '0';
                document.getElementById('totalWords').textContent = '0';
                document.getElementById('uniqueWords').textContent = '0';
                
                // 重置变量
                wordFrequency = {};
                originalText = '';
                currentHighlightWord = '';
            }
        }

        // 转义正则表达式特殊字符
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 回车键搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWord();
            }
        });

        // 示例文本
        window.onload = function() {

            document.getElementById('textInput').value = exampleText;
        };
    </script>
