        const songSelect = document.getElementById('song-select');
        const getLyricsBtn = document.getElementById('get-lyrics');
        const lyricsDisplay = document.getElementById('lyrics-display');

        // 点击按钮获取歌词
        getLyricsBtn.addEventListener('click', function() {
            const selectedIndex = songSelect.value;
            
            if (selectedIndex === '') {
                lyricsDisplay.textContent = '请先选择一首歌曲';
                return;
            }
            
            const selectedSong = songs[selectedIndex];
            lyricsDisplay.textContent = `${selectedSong.title}\n\n${selectedSong.lyrics}`;
        });
    </script>
</body>
</html>
