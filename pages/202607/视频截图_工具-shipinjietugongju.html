<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频截图 | 工具</title>
<meta name="description" content="上传视频，定位到想要的画面，一键截取当前帧。点击截图可直接下载，保留原视频分辨率。">
<style>
:root {
  --bg: #f5f5f7;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --card: #ffffff;
  --border: rgba(0,0,0,0.08);
  --accent: #0071e3;
  --btn: #1d1d1f;
  --btn-text: #fff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.container {
  max-width: 1040px;
  margin: 0 auto;
  padding: 56px 20px 80px;
}
header.hero {
  text-align: center;
  margin-bottom: 28px;
}
.hero h1 {
  margin: 0 0 10px;
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700;
  letter-spacing: -0.02em;
}
.hero p {
  margin: 0;
  color: var(--muted);
  font-size: clamp(14px, 2.2vw, 16px);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  overflow: hidden;
}
.section { padding: 20px; }
.row {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}

.file-picker {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 16px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  transition: box-shadow .2s ease, transform .02s ease;
}
.file-picker:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
.file-picker:active { transform: translateY(1px); }
.file-name { color: var(--muted); font-size: 14px; }

.player {
  background: #000;
  aspect-ratio: 16/9;
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}
video { width: 100%; height: 100%; display: block; background: #000; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

button.primary {
  background: var(--btn);
  color: var(--btn-text);
  border: none;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: box-shadow .2s ease, transform .02s ease, opacity .2s ease;
}
button.primary[disabled] { opacity: .5; cursor: not-allowed; }
button.primary:hover:not([disabled]) { box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
button.primary:active:not([disabled]) { transform: translateY(1px); }

button.secondary {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: box-shadow .2s ease, transform .02s ease, opacity .2s ease, border-color .2s ease, background-color .2s ease;
}
button.secondary:hover:not([disabled]) { box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
button.secondary:active:not([disabled]) { transform: translateY(1px); }
button.secondary[disabled] { opacity: .5; cursor: not-allowed; }

.badge {
  padding: 6px 10px;
  background: #f2f2f3;
  color: var(--muted);
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--border);
}
.support-tip { margin: 8px 0 6px; }
.badge.accent {
  background: rgba(0,113,227,0.08);
  color: var(--accent);
  border-color: rgba(0,113,227,0.25);
}

.meta { color: var(--muted); font-size: 13px; }

.divider { height: 1px; background: var(--border); margin: 0; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  padding: 20px;
}
.shot {
  position: relative;
  display: block;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease;
}
.shot:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.10);
  border-color: rgba(0,0,0,0.12);
}
.shot img { display: block; width: 100%; height: auto; background: #000; }
.shot .info {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,1));
  font-size: 12px; color: var(--muted);
}
.shot .info strong { color: var(--text); font-weight: 600; font-size: 12px; }

.footer-note { padding: 14px 20px 24px; color: var(--muted); font-size: 12px; }

/* Responsive */
@media (max-width: 640px) {
  .section { padding: 16px; }
  .gallery { padding: 16px; gap: 12px; }
}
.page-footer-remarks {
  text-align: center;
  color: var(--muted);
  font-size: 0.75em; /* 桌面从 0.85em 调整到 0.75em */
  line-height: 1.3;  /* 行高从 1.4 调整到 1.3 */
  padding: 0 20px 28px; /* 页面下方留白，不固定 */
}
.page-footer-remarks p {
  margin: 6px 0; /* 段间距从 8px 缩小到 6px */
}
.page-footer-remarks a {
  color: var(--accent);
  text-decoration: underline;
  font-weight: 600;
}
.highlight-red { color: #d93025; font-weight: 700; }
.highlight-green { color: #1e8e3e; font-weight: 700; }

@media (max-width: 640px) {
  .page-footer-remarks { font-size: 0.7em; }   /* 移动端从 0.8em 缩小到 0.7em */
  .page-footer-remarks p { margin: 4px 0; }    /* 移动端段间距从 6px 缩小到 4px */
}
</style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>视频截图</h1>
      <div class="support-tip"><span class="badge accent">支持格式：MP4 (H.264/H.265)、WebM、MOV、MKV（取决于浏览器）</span></div>
      <p>上传本地视频，播放或拖动进度到需要的画面，点击“截取当前帧”。生成的截图点击即可下载，分辨率与原视频一致。</p>
    </header>

    <div class="card">
      <div class="section">
        <div class="row" style="justify-content: space-between;">
          <div class="row">
            <label class="file-picker">
              选择视频
              <input id="fileInput" hidden type="file" accept="video/*">
            </label>
            <span id="fileName" class="file-name">未选择文件</span>
          </div>
          <div class="row">
            <span id="videoMeta" class="badge">分辨率：— × —</span>
          </div>
        </div>
      </div>

      <hr class="divider">

      <div class="section">
        <div class="player">
          <video id="video" controls playsinline disablepictureinpicture controlsList="nodownload noplaybackrate"></video>
        </div>
      </div>

      <div class="section">
        <div class="controls">
          <button id="captureBtn" class="primary" disabled>截取当前帧</button>
          <button id="clearShotsBtn" class="secondary" disabled>清空截图</button>
          <button id="clearVideoBtn" class="secondary" disabled>清空视频</button>
          <span class="meta">提示：支持多次截图；点击下方缩略图直接下载 PNG。</span>
        </div>
      </div>

      <hr class="divider">

      <div id="gallery" class="gallery" aria-live="polite"></div>

      <div class="footer-note">
        为保护隐私，所有处理均在本地浏览器完成，不会上传到服务器。
      </div>
    </div>
  </div>
  <div class="page-footer-remarks" role="contentinfo" aria-label="页面备注">
    <p>获取本工具（<a href="https://pan.quark.cn/s/7273fabb833e" target="_blank" rel="noopener">点这领取</a>）</p>
    <p>更多工具请关注公众号：<strong class="highlight-red">老陈的AI编程实验室</strong></p>
    <p>如有任何建议或问题，请联系微信：<strong class="highlight-green">chenlin241214</strong>（添加请备注AI老陈）</p>
    <p>我正在「AI编程·垂直小流量复利商业化」，你一起来吧？<a href="https://t.zsxq.com/teUBo" target="_blank" rel="noopener">点此加入</a></p>
  </div>

<script>
(function() {
  const $ = (sel) => document.querySelector(sel);
  const fileInput = $('#fileInput');
  const fileName = $('#fileName');
  const video = $('#video');
  const captureBtn = $('#captureBtn');
  const clearShotsBtn = $('#clearShotsBtn');
  const clearVideoBtn = $('#clearVideoBtn');
  const gallery = $('#gallery');
  const videoMeta = $('#videoMeta');

  let objectURL = null;
  let currentFileName = 'video';

  function formatTime(t) {
    const totalMs = Math.round(t * 1000);
    const ms = String(totalMs % 1000).padStart(3, '0');
    const totalSec = Math.floor(totalMs / 1000);
    const s = String(totalSec % 60).padStart(2, '0');
    const m = String(Math.floor((totalSec / 60) % 60)).padStart(2, '0');
    const h = Math.floor(totalSec / 3600);
    return (h > 0 ? h + ':' : '') + m + ':' + s + '.' + ms;
  }

  function updateMeta() {
    if (video.videoWidth && video.videoHeight) {
      videoMeta.textContent = '分辨率：' + video.videoWidth + ' × ' + video.videoHeight;
    } else {
      videoMeta.textContent = '分辨率：— × —';
    }
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    
    // 检查文件类型
    if (!file.type.startsWith('video/')) {
      alert('错误：请选择视频文件！\n\n支持的格式：MP4、WebM、MOV、MKV 等（取决于浏览器支持）');
      fileInput.value = '';
      return;
    }
    
    if (objectURL) {
      URL.revokeObjectURL(objectURL);
      objectURL = null;
    }
    currentFileName = file.name.replace(/\.[^/.]+$/, '') || 'video';
    fileName.textContent = file.name;
    objectURL = URL.createObjectURL(file);
    video.src = objectURL;
    clearVideoBtn.disabled = false;
    captureBtn.disabled = true;
    updateMeta();
  });

  // 监听视频加载错误
  video.addEventListener('error', (e) => {
    const error = video.error;
    let message = '视频加载失败！';
    
    if (error) {
      switch (error.code) {
        case error.MEDIA_ERR_ABORTED:
          message = '视频加载被中止';
          break;
        case error.MEDIA_ERR_NETWORK:
          message = '网络错误导致视频加载失败';
          break;
        case error.MEDIA_ERR_DECODE:
          message = '视频解码失败，可能是不支持的视频格式或编码';
          break;
        case error.MEDIA_ERR_SRC_NOT_SUPPORTED:
          message = '不支持的视频格式或编码';
          break;
        default:
          message = '未知错误：' + (error.message || '视频无法播放');
      }
    }
    
    alert('错误：' + message + '\n\n请尝试以下解决方案：\n1. 确认文件是有效的视频文件\n2. 尝试使用 MP4 (H.264) 格式\n3. 检查视频文件是否损坏');
    
    // 清理状态
    if (objectURL) {
      URL.revokeObjectURL(objectURL);
      objectURL = null;
    }
    fileInput.value = '';
    fileName.textContent = '未选择文件';
    clearVideoBtn.disabled = true;
    captureBtn.disabled = true;
    updateMeta();
  });

  video.addEventListener('loadedmetadata', () => {
    updateMeta();
    captureBtn.disabled = !(video.videoWidth && video.videoHeight);
  });
  video.addEventListener('loadeddata', () => {
    captureBtn.disabled = false;
  });

  captureBtn.addEventListener('click', async () => {
    if (!video.videoWidth || !video.videoHeight) return;

    const w = video.videoWidth;
    const h = video.videoHeight;

    let dataURL;
    try {
      if (typeof OffscreenCanvas !== 'undefined') {
        const off = new OffscreenCanvas(w, h);
        const ctx = off.getContext('2d', { willReadFrequently: false });
        ctx.drawImage(video, 0, 0, w, h);
        const blob = await off.convertToBlob({ type: 'image/png' });
        dataURL = await blobToDataURL(blob);
      } else {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);
        dataURL = canvas.toDataURL('image/png');
      }
    } catch (e) {
      console.error(e);
      alert('截图失败：' + (e && e.message ? e.message : e));
      return;
    }

    const timestamp = new Date();
    const y = timestamp.getFullYear();
    const mo = String(timestamp.getMonth() + 1).padStart(2, '0');
    const d = String(timestamp.getDate()).padStart(2, '0');
    const hh = String(timestamp.getHours()).padStart(2, '0');
    const mm = String(timestamp.getMinutes()).padStart(2, '0');
    const ss = String(timestamp.getSeconds()).padStart(2, '0');
    const current = formatTime(video.currentTime);

    const fileSafeName = (currentFileName || 'video').replace(/[\\\\\\/:*?"<>|]+/g, '_');
    const downloadName = fileSafeName + '_' + y + mo + d + '-' + hh + mm + ss + '_' + w + 'x' + h + '_' + current.replace(/[:.]/g, '') + '.png';

    addShotToGallery(dataURL, downloadName, w, h, current);
  });

  // 清空截图
  clearShotsBtn.addEventListener('click', () => {
    gallery.innerHTML = '';
    clearShotsBtn.disabled = true;
  });

  // 清空视频
  clearVideoBtn.addEventListener('click', () => {
    try { video.pause(); } catch (e) {}
    if (objectURL) {
      URL.revokeObjectURL(objectURL);
      objectURL = null;
    }
    video.removeAttribute('src');
    video.load();
    fileInput.value = '';
    fileName.textContent = '未选择文件';
    currentFileName = 'video';
    captureBtn.disabled = true;
    clearVideoBtn.disabled = true;
    updateMeta();
  });

  function addShotToGallery(dataURL, fileName, w, h, timeStr) {
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = fileName;
    a.className = 'shot';
    a.setAttribute('title', '点击下载：' + fileName);

    const img = document.createElement('img');
    img.src = dataURL;
    img.alt = '截图 ' + w + '×' + h + ' @ ' + timeStr;

    const info = document.createElement('div');
    info.className = 'info';
    const left = document.createElement('div');
    left.innerHTML = '<strong>' + w + '×' + h + '</strong>';
    const right = document.createElement('div');
    right.textContent = '@ ' + timeStr;

    info.appendChild(left);
    info.appendChild(right);

    a.appendChild(img);
    a.appendChild(info);

    if (gallery.firstChild) {
      gallery.insertBefore(a, gallery.firstChild);
    } else {
      gallery.appendChild(a);
    }

    a.addEventListener('click', (e) => {
      if (!('download' in HTMLAnchorElement.prototype)) {
        e.preventDefault();
        forceDownload(dataURL, fileName);
      }
    });
    clearShotsBtn.disabled = false;
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function forceDownload(url, name) {
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => { document.body.removeChild(link); }, 0);
  }

  // 快捷键：按 C 截图
  window.addEventListener('keydown', (e) => {
    if ((e.key === 'c' || e.key === 'C') && !captureBtn.disabled) {
      e.preventDefault();
      captureBtn.click();
    }
  });
})();
</script>
