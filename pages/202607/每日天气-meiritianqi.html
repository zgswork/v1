<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日天气</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            overlay: 'rgba(255, 255, 255, 0.75)'
          }
        }
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }
      .btn-hover {
        @apply transition-all duration-300 hover:scale-105 hover:shadow-lg;
      }
      .weather-card {
        @apply bg-white/80 backdrop-blur-md rounded-2xl p-6 card-shadow max-w-2xl w-full mx-auto transition-all duration-500;
      }
      .notification {
        @apply fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50;
      }
      .notification.show {
        @apply opacity-100;
      }
      .error-message {
        @apply text-red-500 text-sm mt-2 text-center;
      }
      .weather-icon-animation {
        @apply animate-pulse;
      }
      .bg-image {
        @apply fixed inset-0 bg-cover bg-center z-0 transition-all duration-1000 ease-in-out;
      }
      .content-overlay {
        @apply relative z-10;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- 背景图容器 -->
  <div id="backgroundImage" class="bg-image"></div>
  
  <!-- 半透明覆盖层，提升文字可读性 -->
  <div class="fixed inset-0 bg-black/10 z-0"></div>
  
  <!-- 通知提示 -->
  <div id="notification" class="notification">操作成功！</div>
  
  <div class="container mx-auto px-4 py-6 flex-grow content-overlay">
    <!-- 页面标题和日期 -->
    <header class="text-center mb-6">
      <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-white drop-shadow-md mb-2">每日天气</h1>
      <p id="currentDate" class="text-[clamp(1rem,3vw,1.2rem)] text-white drop-shadow-md font-medium"></p>
    </header>
    
    <!-- 城市选择 -->
    <div class="max-w-md mx-auto mb-6">
      <div class="flex gap-2">
        <input type="text" id="cityInput" placeholder="输入城市名称（如：北京、上海）" 
               class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/80 bg-white/90 backdrop-blur-sm">
        <button id="searchCityBtn" class="bg-primary text-white px-4 py-3 rounded-lg btn-hover">
          <i class="fa fa-search"></i>
        </button>
        <button id="locateBtn" class="bg-green-500 text-white px-4 py-3 rounded-lg btn-hover">
          <i class="fa fa-map-marker"></i>
        </button>
      </div>
      <div id="locationError" class="error-message hidden"></div>
    </div>
    
    <!-- 主要内容区 - 天气信息 -->
    <main class="mb-8">
      <div class="weather-card">
        <!-- 城市和日期 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
          <h2 id="cityName" class="text-[clamp(1.5rem,4vw,2rem)] font-bold text-gray-800 mb-2 md:mb-0">请查询天气</h2>
          <div class="flex items-center">
            <i class="fa fa-calendar text-gray-600 mr-2"></i>
            <span id="weatherDate" class="text-gray-600"></span>
            <span id="lastUpdated" class="text-xs text-gray-500 ml-3">(最后更新：--:--)</span>
          </div>
        </div>
        
        <!-- 主要天气信息 -->
        <div class="flex flex-col md:flex-row justify-center items-center mb-8">
          <div id="weatherIcon" class="text-[clamp(5rem,15vw,8rem)] text-yellow-500 mb-4 md:mb-0 md:mr-8 weather-icon-animation">
            <i class="fa fa-cloud"></i>
          </div>
          <div class="text-center md:text-left">
            <div class="flex items-end">
              <span id="temperature" class="text-[clamp(3rem,10vw,5rem)] font-bold text-gray-800">--</span>
              <span class="text-xl text-gray-700 mb-1">°C</span>
            </div>
            <div id="weatherDescription" class="text-[clamp(1.2rem,3vw,1.5rem)] text-gray-700 capitalize">请输入城市或使用定位</div>
          </div>
        </div>
        
        <!-- 详细天气信息 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-tint text-blue-500 mb-1"></i>
            <div class="text-sm text-gray-600">湿度</div>
            <div id="humidity" class="font-semibold">--%</div>
          </div>
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-location-arrow text-green-500 mb-1"></i>
            <div class="text-sm text-gray-600">风速</div>
            <div id="windSpeed" class="font-semibold">-- km/h</div>
          </div>
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-cloud text-gray-500 mb-1"></i>
            <div class="text-sm text-gray-600">云量</div>
            <div id="cloudiness" class="font-semibold">--%</div>
          </div>
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-sun-o text-yellow-500 mb-1"></i>
            <div class="text-sm text-gray-600">紫外线</div>
            <div id="uvIndex" class="font-semibold">--</div>
          </div>
        </div>
        
        <!-- 日出日落信息 -->
        <div class="mt-6 grid grid-cols-2 gap-4 text-center">
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-sun-o text-orange-500 mb-1"></i>
            <div class="text-sm text-gray-600">日出</div>
            <div id="sunrise" class="font-semibold">--:--</div>
          </div>
          <div class="bg-white/60 backdrop-blur-sm p-3 rounded-lg transform transition-all duration-300 hover:scale-105">
            <i class="fa fa-moon-o text-indigo-500 mb-1"></i>
            <div class="text-sm text-gray-600">日落</div>
            <div id="sunset" class="font-semibold">--:--</div>
          </div>
        </div>
      </div>
      
      <!-- 帮助提示 -->
      <div class="bg-white/70 backdrop-blur-sm rounded-xl p-4 max-w-2xl mx-auto text-sm text-gray-700 mt-6">
        <h3 class="font-semibold mb-2 flex items-center"><i class="fa fa-info-circle text-primary mr-2"></i>使用帮助</h3>
        <ul class="list-disc pl-5 space-y-1">
          <li>请输入城市名称（如"北京"、"上海"）查询天气</li>
          <li>点击定位按钮可获取当前所在城市天气</li>
          <li>背景图片会根据天气状况自动切换</li>
          <li>若定位失败，请检查浏览器位置权限设置</li>
        </ul>
      </div>
    </main>
    
    <!-- 导出按钮 -->
    <div class="flex justify-center mb-10">
      <button id="exportBtn" class="bg-white/90 backdrop-blur-sm text-primary px-6 py-3 rounded-lg font-medium btn-hover flex items-center shadow-md">
        <i class="fa fa-download mr-2"></i> 导出天气报告
      </button>
    </div>
    
    <!-- 页脚备注信息 -->
    <footer class="text-center text-white drop-shadow-md text-sm mt-auto">
      <p class="mb-1">本工具由 @邓文涛 制作</p>
      <p class="mb-1">微信：707547441</p>
      <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="5d6a6d6a68696a69696c1d2c2c733e3230">[email&#160;protected]</a></p>
    </footer>
  </div>
  
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // 天气类型与对应图片关键词映射（模拟100张图片的数据库分类）
    const weatherImageMap = {
      sunny: {
        keywords: ['sunny', 'clear sky', 'blue sky', 'sun', 'summer'],
        icon: 'fa-sun-o',
        color: '#FFD700'
      },
      cloudy: {
        keywords: ['cloud', 'cloudy', 'overcast', 'grey sky', 'partly cloudy'],
        icon: 'fa-cloud',
        color: '#9E9E9E'
      },
      rainy: {
        keywords: ['rain', 'rainy', 'storm', 'downpour', 'shower'],
        icon: 'fa-tint',
        color: '#42A5F5'
      },
      snowy: {
        keywords: ['snow', 'snowy', 'blizzard', 'snowflake', 'winter'],
        icon: 'fa-snowflake-o',
        color: '#E0E0E0'
      },
      foggy: {
        keywords: ['fog', 'foggy', 'mist', 'haze', 'smog'],
        icon: 'fa-cloud',
        color: '#BDBDBD'
      },
      stormy: {
        keywords: ['storm', 'thunder', 'lightning', 'thunderstorm'],
        icon: 'fa-bolt',
        color: '#616161'
      },
      night: {
        keywords: ['night', 'moon', 'stars', 'dark sky', 'evening'],
        icon: 'fa-moon-o',
        color: '#3949AB'
      }
    };
    
    // 天气API配置
    const API_CONFIGS = [
      {
        name: 'OpenWeatherMap',
        baseUrl: 'https://api.openweathermap.org/data/2.5/weather',
        apiKey: 'a864cc5f9d689422691287a22f6c4c2'
      },
      {
        name: '备用API',
        baseUrl: 'https://wttr.in',
        format: 'j1'
      }
    ];
    
    // 获取DOM元素
    const bodyElement = document.body;
    const backgroundImage = document.getElementById('backgroundImage');
    const currentDateElement = document.getElementById('currentDate');
    const weatherDateElement = document.getElementById('weatherDate');
    const lastUpdatedElement = document.getElementById('lastUpdated');
    const cityNameElement = document.getElementById('cityName');
    const temperatureElement = document.getElementById('temperature');
    const weatherDescriptionElement = document.getElementById('weatherDescription');
    const humidityElement = document.getElementById('humidity');
    const windSpeedElement = document.getElementById('windSpeed');
    const cloudinessElement = document.getElementById('cloudiness');
    const uvIndexElement = document.getElementById('uvIndex');
    const sunriseElement = document.getElementById('sunrise');
    const sunsetElement = document.getElementById('sunset');
    const weatherIconElement = document.getElementById('weatherIcon');
    const cityInputElement = document.getElementById('cityInput');
    const searchCityBtn = document.getElementById('searchCityBtn');
    const locateBtn = document.getElementById('locateBtn');
    const exportBtn = document.getElementById('exportBtn');
    const notification = document.getElementById('notification');
    const locationErrorElement = document.getElementById('locationError');
    
    // 设置当前日期
    function setCurrentDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
      weatherDateElement.textContent = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }
    
    // 更新最后刷新时间
    function updateLastUpdated() {
      const now = new Date();
      lastUpdatedElement.textContent = `(最后更新：${now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })})`;
    }
    
    // 显示错误信息
    function showError(message) {
      locationErrorElement.textContent = message;
      locationErrorElement.classList.remove('hidden');
      
      setTimeout(() => {
        locationErrorElement.classList.add('hidden');
      }, 5000);
    }
    
    // 隐藏错误信息
    function hideError() {
      locationErrorElement.classList.add('hidden');
    }
    
    // 显示通知
    function showNotification(message) {
      notification.textContent = message;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }
    
    // 根据天气状况获取对应的天气类型
    function getWeatherType(condition, isDaytime = true) {
      condition = condition.toLowerCase();
      
      // 优先判断特殊天气
      if (condition.includes('雷') || condition.includes('暴')) {
        return 'stormy';
      }
      
      if (condition.includes('雪')) {
        return 'snowy';
      }
      
      if (condition.includes('雨') || condition.includes('淋')) {
        return 'rainy';
      }
      
      if (condition.includes('雾') || condition.includes('霾') || condition.includes('烟')) {
        return 'foggy';
      }
      
      // 判断是否为夜间
      if (!isDaytime || condition.includes('夜') || condition.includes('晚')) {
        return 'night';
      }
      
      // 判断多云类型
      if (condition.includes('云') || condition.includes('阴')) {
        return 'cloudy';
      }
      
      // 默认晴天
      return 'sunny';
    }
    
    // 判断是否为白天
    function isDaytime(sunrise, sunset) {
      const now = new Date().getTime() / 1000; // 转换为秒
      return now >= sunrise && now <= sunset;
    }
    
    // 根据天气类型设置背景图
    function setWeatherBackground(weatherType) {
      const weatherConfig = weatherImageMap[weatherType] || weatherImageMap.cloudy;
      
      // 随机选择一个关键词和图片ID（模拟从100张图片中选择）
      const randomKeyword = weatherConfig.keywords[Math.floor(Math.random() * weatherConfig.keywords.length)];
      const randomImageId = Math.floor(Math.random() * 100) + 1; // 1-100的随机数
      
      // 设置背景图
      const imageUrl = `https://picsum.photos/seed/${randomKeyword}${randomImageId}/1920/1080`;
      backgroundImage.style.backgroundImage = `url('${imageUrl}')`;
      
      // 更新天气图标和颜色
      weatherIconElement.innerHTML = `<i class="fa ${weatherConfig.icon}"></i>`;
      weatherIconElement.style.color = weatherConfig.color;
      exportBtn.style.color = weatherConfig.color;
      document.querySelectorAll('.weather-card h2').forEach(title => {
        title.style.color = weatherConfig.color;
      });
    }
    
    // 根据天气状况更新图标动画
    function updateWeatherAnimation(weatherType) {
      // 移除所有动画类
      weatherIconElement.classList.remove('animate-pulse', 'animate-spin', 'animate-bounce');
      
      // 根据天气类型添加不同动画
      switch(weatherType) {
        case 'sunny':
          weatherIconElement.classList.add('animate-pulse');
          break;
        case 'rainy':
        case 'stormy':
          weatherIconElement.classList.add('animate-bounce');
          break;
        case 'snowy':
          weatherIconElement.classList.add('animate-spin');
          break;
        default:
          weatherIconElement.classList.add('animate-pulse');
      }
    }
    
    // 格式化时间
    function formatTime(timestamp) {
      const date = new Date(timestamp * 1000);
      return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    
    // 使用备用API获取天气数据
    async function getWeatherWithBackupAPI(city) {
      try {
        const response = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
        
        if (!response.ok) {
          throw new Error(`备用API请求失败: ${response.status}`);
        }
        
        const data = await response.json();
        
        // 处理备用API的数据格式
        const currentCondition = data.current_condition[0];
        const weatherDesc = currentCondition.weatherDesc[0].value;
        const weatherDay = data.weather[0];
        const sunrise = weatherDay.astronomy[0].sunrise;
        const sunset = weatherDay.astronomy[0].sunset;
        
        // 判断是否为白天（简单处理）
        const now = new Date();
        const currentHour = now.getHours();
        const sunriseHour = parseInt(sunrise.split(':')[0]);
        const sunsetHour = parseInt(sunset.split(':')[0]) + 12; // 转换为24小时制
        const daytime = currentHour >= sunriseHour && currentHour <= sunsetHour;
        
        // 确定天气类型
        const weatherType = getWeatherType(weatherDesc, daytime);
        
        // 更新UI显示天气数据
        cityNameElement.textContent = city;
        temperatureElement.textContent = currentCondition.temp_C;
        weatherDescriptionElement.textContent = weatherDesc;
        humidityElement.textContent = `${currentCondition.humidity}%`;
        windSpeedElement.textContent = `${currentCondition.windspeedKmph} km/h`;
        cloudinessElement.textContent = `${currentCondition.cloudcover}%`;
        uvIndexElement.textContent = currentCondition.uvIndex;
        sunriseElement.textContent = sunrise;
        sunsetElement.textContent = sunset;
        
        // 更新背景图和动画
        setWeatherBackground(weatherType);
        updateWeatherAnimation(weatherType);
        
        // 更新最后刷新时间
        updateLastUpdated();
        
        showNotification(`已通过备用API获取 ${city} 的天气数据`);
        return true;
        
      } catch (error) {
        console.error('备用API获取天气数据失败:', error);
        return false;
      }
    }
    
    // 获取天气数据 - 尝试多个API源
    async function getWeatherData(city) {
      try {
        hideError();
        // 显示加载状态
        cityNameElement.textContent = '加载中...';
        weatherDescriptionElement.textContent = '正在获取天气数据...';
        weatherIconElement.innerHTML = '<i class="fa fa-circle-o-notch fa-spin"></i>';
        
        // 首先尝试第一个API
        const primaryAPI = API_CONFIGS[0];
        const response = await fetch(`${primaryAPI.baseUrl}?q=${encodeURIComponent(city)}&appid=${primaryAPI.apiKey}&units=metric&lang=zh_cn`);
        
        if (!response.ok) {
          // 主API失败，尝试备用API
          const backupSuccess = await getWeatherWithBackupAPI(city);
          if (!backupSuccess) {
            throw new Error('所有API均无法获取数据，请稍后再试');
          }
          return;
        }
        
        const data = await response.json();
        
        // 判断是否为白天
        const daytime = isDaytime(data.sys.sunrise, data.sys.sunset);
        
        // 确定天气类型
        const weatherType = getWeatherType(data.weather[0].description, daytime);
        
        // 更新UI显示天气数据
        cityNameElement.textContent = `${data.name}, ${data.sys.country}`;
        temperatureElement.textContent = Math.round(data.main.temp);
        weatherDescriptionElement.textContent = data.weather[0].description;
        humidityElement.textContent = `${data.main.humidity}%`;
        windSpeedElement.textContent = `${Math.round(data.wind.speed * 3.6)} km/h`; // 转换为km/h
        cloudinessElement.textContent = `${data.clouds.all}%`;
        
        // 获取紫外线指数
        try {
          const uvResponse = await fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=${data.coord.lat}&lon=${data.coord.lon}&appid=${primaryAPI.apiKey}`);
          if (uvResponse.ok) {
            const uvData = await uvResponse.json();
            uvIndexElement.textContent = uvData.value;
          } else {
            uvIndexElement.textContent = 'N/A';
          }
        } catch (error) {
          console.error('获取紫外线数据失败:', error);
          uvIndexElement.textContent = 'N/A';
        }
        
        // 格式化日出日落时间
        sunriseElement.textContent = formatTime(data.sys.sunrise);
        sunsetElement.textContent = formatTime(data.sys.sunset);
        
        // 更新背景图和动画
        setWeatherBackground(weatherType);
        updateWeatherAnimation(weatherType);
        
        // 更新最后刷新时间
        updateLastUpdated();
        
        showNotification(`已获取 ${data.name} 的天气数据`);
        
      } catch (error) {
        console.error('获取天气数据失败:', error);
        showNotification(error.message);
        showError(error.message);
        cityNameElement.textContent = '获取失败';
        weatherDescriptionElement.textContent = '请尝试其他城市或稍后再试';
        weatherIconElement.innerHTML = '<i class="fa fa-exclamation-triangle text-orange-500"></i>';
      }
    }
    
    // 通过地理位置获取天气
    function getWeatherByLocation() {
      hideError();
      if (navigator.geolocation) {
        showNotification('正在获取您的位置...');
        weatherIconElement.innerHTML = '<i class="fa fa-circle-o-notch fa-spin"></i>';
        
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            try {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              
              // 先通过坐标获取城市名
              const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh-CN`);
              
              if (!geoResponse.ok) {
                throw new Error('无法获取位置信息');
              }
              
              const geoData = await geoResponse.json();
              const city = geoData.address.city || geoData.address.town || geoData.address.village || '未知城市';
              
              cityInputElement.value = city;
              getWeatherData(city);
              
            } catch (error) {
              console.error('通过地理位置获取天气失败:', error);
              showNotification('获取位置天气失败，尝试直接使用坐标');
              showError('获取位置天气失败，尝试直接使用坐标');
              
              // 直接使用坐标获取天气
              try {
                const primaryAPI = API_CONFIGS[0];
                const response = await fetch(`${primaryAPI.baseUrl}?lat=${lat}&lon=${lon}&appid=${primaryAPI.apiKey}&units=metric&lang=zh_cn`);
                
                if (!response.ok) {
                  throw new Error('无法使用坐标获取天气');
                }
                
                const data = await response.json();
                cityInputElement.value = data.name;
                getWeatherData(data.name);
                
              } catch (err) {
                console.error('使用坐标获取天气失败:', err);
                showNotification('无法获取天气数据，请手动输入城市');
                showError('无法获取天气数据，请手动输入城市');
                weatherIconElement.innerHTML = '<i class="fa fa-exclamation-triangle text-orange-500"></i>';
              }
            }
          },
          (error) => {
            console.error('获取地理位置失败:', error);
            let errorMessage = '无法获取您的位置';
            
            // 根据错误类型提供更具体的信息
            switch(error.code) {
              case 1:
                errorMessage = '请在浏览器设置中允许位置权限';
                break;
              case 2:
                errorMessage = '无法获取位置信息，请检查网络';
                break;
              case 3:
                errorMessage = '获取位置超时，请重试';
                break;
            }
            
            showNotification(errorMessage);
            showError(errorMessage);
            weatherIconElement.innerHTML = '<i class="fa fa-exclamation-triangle text-orange-500"></i>';
          },
          {
            timeout: 15000, // 15秒超时
            maximumAge: 0, // 不使用缓存位置
            enableHighAccuracy: false // 不要求高精度，更快获取位置
          }
        );
      } else {
        const errorMessage = '您的浏览器不支持地理位置功能，请手动输入城市';
        showNotification(errorMessage);
        showError(errorMessage);
        weatherIconElement.innerHTML = '<i class="fa fa-exclamation-triangle text-orange-500"></i>';
      }
    }
    
    // 导出天气报告为图片
    function exportWeatherReport() {
      // 显示加载状态
      exportBtn.disabled = true;
      exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 正在导出...';
      
      const element = document.querySelector('.weather-card');
      
      html2canvas(element, {
        scale: 2, // 提高分辨率
        useCORS: true,
        logging: false,
        allowTaint: false,
        backgroundColor: null
      }).then(canvas => {
        try {
          // 创建下载链接
          const link = document.createElement('a');
          const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
          const cityName = cityNameElement.textContent || '未知城市';
          link.download = `${cityName}天气报告-${dateStr}.png`;
          
          // 处理不同浏览器的兼容性
          if (navigator.msSaveBlob) {
            // IE/Edge 兼容
            canvas.toBlob(blob => {
              if (blob) {
                navigator.msSaveBlob(blob, link.download);
                showNotification('导出成功！');
              } else {
                showNotification('导出失败，请重试');
              }
            });
          } else {
            // 标准浏览器
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotification('导出成功！');
          }
        } catch (error) {
          console.error('导出失败:', error);
          showNotification('导出失败，请重试');
        } finally {
          // 恢复按钮状态
          exportBtn.disabled = false;
          exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出天气报告';
        }
      }).catch(error => {
        console.error('导出失败:', error);
        showNotification('导出失败，请重试');
        
        // 恢复按钮状态
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出天气报告';
      });
    }
    
    // 初始化默认背景
    function initDefaultBackground() {
      // 默认使用多云天气的背景
      setWeatherBackground('cloudy');
    }
    
    // 初始化页面
    function init() {
      setCurrentDate();
      initDefaultBackground();
      
      // 事件监听
      searchCityBtn.addEventListener('click', () => {
        const city = cityInputElement.value.trim();
        if (city) {
          getWeatherData(city);
        } else {
          const errorMessage = '请输入城市名称';
          showNotification(errorMessage);
          showError(errorMessage);
        }
      });
      
      // 按Enter键搜索
      cityInputElement.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const city = cityInputElement.value.trim();
          if (city) {
            getWeatherData(city);
          } else {
            const errorMessage = '请输入城市名称';
            showNotification(errorMessage);
            showError(errorMessage);
          }
        }
      });
      
      locateBtn.addEventListener('click', getWeatherByLocation);
      exportBtn.addEventListener('click', exportWeatherReport);
    }
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
