<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时标记预览</title>
<style>
:root{--bg:#ffffff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--panel:#f9fafb}
:root[data-theme="dark"]{--bg:#0b0f13;--text:#e5e7eb;--muted:#9ca3af;--border:#1f2937;--accent:#60a5fa;--panel:#111827}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--panel)}
h1{font-size:1.1rem;margin:0;flex:1}
button{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:.4rem .7rem;border-radius:.5rem;cursor:pointer}
button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:840px){main{grid-template-columns:1fr}}
.section{display:flex;flex-direction:column;height:calc(100vh - 58px)}
label{font-size:.85rem;color:var(--muted);padding:.5rem .9rem;border-bottom:1px solid var(--border)}
textarea{flex:1;border:0;padding:1rem;background:var(--bg);color:var(--text);resize:none;outline:none}
#preview{flex:1;overflow:auto;padding:1rem;background:var(--bg)}
#preview h1,h2,h3,h4,h5,h6{margin:1rem 0 .5rem}
#preview p{margin:.6rem 0}
#preview pre{background:var(--panel);padding:.75rem;border-radius:.5rem;overflow:auto}
#preview code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
#preview blockquote{border-left:4px solid var(--border);padding:.5rem 1rem;color:var(--muted);margin:.8rem 0;background:transparent}
#preview ul,#preview ol{padding-left:1.2rem}
.md-table{width:100%;border-collapse:collapse;margin:.8rem 0}
.md-table th,.md-table td{border:1px solid var(--border);padding:.5rem}
.task-item{display:flex;align-items:center;gap:.5rem}
.task-item input{margin-right:.5rem}
.footer{padding:.5rem 1rem;border-top:1px solid var(--border);color:var(--muted);background:var(--panel);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>实时标记预览</h1>
  <div class="toolbar">
    <button id="importBtn">导入MD</button>
    <button id="exportHtmlBtn">导出HTML</button>
    <button id="exportMdBtn">导出MD</button>
    <button id="copyHtmlBtn">复制HTML</button>
    <button id="clearBtn">清空</button>
  </div>
  <button id="themeBtn" title="浅/深主题切换">切换主题</button>
  <input type="file" id="fileInput" accept=".md,text/markdown,text/plain" style="display:none">
</header>
<main>
  <section class="section">
    <label>编辑</label>
    <textarea id="input" placeholder="在此输入 Markdown..." spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
  </section>
  <section class="section">
    <label>预览</label>
    <div id="preview"></div>
  </section>
</main>
<div class="footer">支持标题、列表、链接、图片、代码、加粗/斜体、引用、任务列表与表格</div>
<script>
(function(){
  const root=document.documentElement;
  const input=document.getElementById('input');
  const preview=document.getElementById('preview');
  const themeBtn=document.getElementById('themeBtn');
  const importBtn=document.getElementById('importBtn');
  const exportHtmlBtn=document.getElementById('exportHtmlBtn');
  const exportMdBtn=document.getElementById('exportMdBtn');
  const copyHtmlBtn=document.getElementById('copyHtmlBtn');
  const clearBtn=document.getElementById('clearBtn');
  const fileInput=document.getElementById('fileInput');
  const LS_KEY_MD='rt-md';
  const LS_KEY_THEME='rt-theme';

  function setTheme(t){root.setAttribute('data-theme',t);localStorage.setItem(LS_KEY_THEME,t)}
  function initTheme(){
    const saved=localStorage.getItem(LS_KEY_THEME);
    if(saved){setTheme(saved);return}
    const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark?'dark':'light')
  }
  themeBtn.addEventListener('click',()=>{
    const cur=root.getAttribute('data-theme')||'light';
    setTheme(cur==='light'?'dark':'light')
  });

  const defaultMD=`# 欢迎使用「实时标记预览」
  
- 左侧输入，右侧实时渲染
- 支持浅/深主题切换
- 电脑与手机自适应布局

## 示例
**粗体**、*斜体*、\`行内代码\`、[链接](https://example.com)

> 引用段落

\`\`\`
代码块
function hello(){ console.log('hi') }
\`\`\`

1. 有序列表
2. 第二项

- [x] 任务已完成
- [ ] 任务待处理

| 列A | 列B | 列C |
|:--- |:--: | ---:|
| 左对齐 | 居中 | 右对齐 |

![图片](data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='640' height='360'><rect width='100%' height='100%' fill='%23ddd'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='24' fill='%23666'>Preview</text></svg>)`;

  function isAlignLine(s){return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(s)}
  function splitRow(s){return s.replace(/^\s*\||\|\s*$/g,'').split(/\s*\|\s*/)}
  function alignOf(s){const l=/^:-+$/;const c=/^:-+:$/;const r=/^-+:$/;if(c.test(s))return 'center';if(r.test(s))return 'right';return 'left'}

  function escapeHtml(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
  function inline(md){
    md=md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">');
    md=md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    md=md.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    md=md.replace(/__([^_]+)__/g,'<strong>$1</strong>');
    md=md.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
    md=md.replace(/(^|[^_])_([^_]+)_/g,'$1<em>$2</em>');
    md=md.replace(/`([^`]+)`/g,'<code>$1</code>');
    return md
  }

  function render(md){
    if(!md){preview.innerHTML='';return}
    md=md.replace(/```([\s\S]*?)```/g,(m,code)=>'<pre><code>'+escapeHtml(code)+'</code></pre>');
    const lines=md.split(/\r?\n/);
    let html='',inUl=false,inOl=false;
    for(let i=0;i<lines.length;i++){
      let line=lines[i];
      if(/^\s*$/.test(line)){if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}continue}
      const h=line.match(/^(#{1,6})\s+(.*)$/);
      if(h){html+='<h'+h[1].length+'>'+inline(escapeHtml(h[2]))+'</h'+h[1].length+'>';continue}
      if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){html+='<hr>';continue}
      const bq=line.match(/^>\s?(.*)$/);
      if(bq){html+='<blockquote>'+inline(escapeHtml(bq[1]))+'</blockquote>';continue}
      // 表格解析
      if(/\|/.test(line) && i+1<lines.length && isAlignLine(lines[i+1]) && !/^\s*[-+*]\s+/.test(line) && !/^\s*\d+\.\s+/.test(line)){
        if(inUl){html+='</ul>';inUl=false} if(inOl){html+='</ol>';inOl=false}
        const headers=splitRow(line); const aligns=splitRow(lines[i+1]);
        html+='<table class="md-table"><thead><tr>';
        for(let k=0;k<headers.length;k++){const al=aligns[k]?alignOf(aligns[k]):'left';html+='<th style="text-align:'+al+'">'+inline(escapeHtml(headers[k]))+'</th>'}
        html+='</tr></thead><tbody>';
        i+=2;
        while(i<lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){const cells=splitRow(lines[i]);html+='<tr>'+cells.map((c)=>'<td>'+inline(escapeHtml(c))+'</td>').join('')+'</tr>';i++}
        html+='</tbody></table>';
        i--; continue;
      }
      if(/^\s*[-+*]\s+/.test(line)){
        if(!inUl){html+='<ul>';inUl=true}
        const item=line.replace(/^\s*[-+*]\s+/, '');
        const task=item.match(/^\[([ xX])\]\s+(.*)$/);
        if(task){const checked=/[xX]/.test(task[1]);html+='<li><label class="task-item"><input type="checkbox" disabled'+(checked?' checked':'')+'>'+inline(escapeHtml(task[2]))+'</label></li>'}
        else{html+='<li>'+inline(escapeHtml(item))+'</li>'}
        continue
      }
      if(/^\s*\d+\.\s+/.test(line)){
        if(!inOl){html+='<ol>';inOl=true}
        html+='<li>'+inline(escapeHtml(line.replace(/^\s*\d+\.\s+/,'')))+'</li>';
        continue
      }
      html+='<p>'+inline(escapeHtml(line))+'</p>'
    }
    if(inUl)html+='</ul>';
    if(inOl)html+='</ol>';
    preview.innerHTML=html
  }

  input.addEventListener('input',()=>{localStorage.setItem(LS_KEY_MD,input.value);render(input.value)});

  function download(name,content,mime){
    const blob=new Blob([content],{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),0);
  }
  function exportHtml(){
    const htmlContent='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导出预览</title><style>body{font:16px/1.6 system-ui}pre{background:#f3f4f6;padding:.75rem;border-radius:.5rem;overflow:auto}blockquote{border-left:4px solid #e5e7eb;padding:.5rem 1rem;color:#6b7280}table{width:100%;border-collapse:collapse}table td,table th{border:1px solid #e5e7eb;padding:.5rem}</style><body>'+preview.innerHTML+'</body></html>';
    download('预览.html',htmlContent,'text/html;charset=utf-8');
  }
  function exportMd(){download('内容.md',input.value,'text/markdown;charset=utf-8')}
  async function copyHtml(){
    try{await navigator.clipboard.writeText(preview.innerHTML);alert('已复制HTML到剪贴板')}
    catch(e){
      const ta=document.createElement('textarea');ta.value=preview.innerHTML;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制HTML到剪贴板')
    }
  }
  function clearContent(){if(confirm('确认清空当前内容？')){input.value='';localStorage.removeItem(LS_KEY_MD);render('')}}
  function handleImportFile(f){const r=new FileReader();r.onload=e=>{input.value=String(e.target.result||'');localStorage.setItem(LS_KEY_MD,input.value);render(input.value)};r.readAsText(f)}

  importBtn.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(f)handleImportFile(f);fileInput.value=''});
  exportHtmlBtn.addEventListener('click',exportHtml);
  exportMdBtn.addEventListener('click',exportMd);
  copyHtmlBtn.addEventListener('click',copyHtml);
  clearBtn.addEventListener('click',clearContent);
  input.addEventListener('scroll',()=>{
    const max=input.scrollHeight-input.clientHeight; if(max>0){
      const ratio=input.scrollTop/max; const pmax=preview.scrollHeight-preview.clientHeight;
      preview.scrollTop=ratio*pmax;
    }
  });

  initTheme();
  input.value=localStorage.getItem(LS_KEY_MD)||defaultMD;
  render(input.value);
})();
</script>
</body>
</html>
