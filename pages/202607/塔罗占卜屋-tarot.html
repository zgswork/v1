<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗占卜屋</title>
    <style>
        :root {
            --primary: #2d1a3d;
            --accent: #c5a47e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: var(--primary);
            background-image: radial-gradient(
                circle at 50% 50%,
                rgba(90, 50, 120, 0.3) 0%,
                transparent 70%
            ), repeating-linear-gradient(
                45deg,
                transparent 0, transparent 80px,
                rgba(197, 164, 126, 0.05) 80px, rgba(197, 164, 126, 0.05) 82px
            );
            font-family: '微软雅黑', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* 流星效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* 流星动画 */
        @keyframes meteor {
            0% {
                transform: rotate(215deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(215deg) translateX(-500px);
                opacity: 0;
            }
        }

        /* 闪烁星星动画 */
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 流星元素 */
        .meteor {
            position: fixed;
            width: 2px;
            height: 2px;
            background: linear-gradient(45deg, #fff, #c5a47e);
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 10px #c5a47e;
            animation: meteor 3s linear infinite;
            z-index: -1;
        }

        .meteor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, #fff, transparent);
            transform: translateX(-100px);
        }

        /* 闪烁星星 */
        .star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px #fff;
            animation: twinkle 2s ease-in-out infinite;
            z-index: -1;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
        }

        nav h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            letter-spacing: 4px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            }
            to {
                text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent), 0 0 80px var(--accent);
            }
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .spread-selector,
        .question-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .spread-selector label,
        .question-input label {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        select {
            padding: 12px 20px;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 10px var(--accent);
            border-color: #d4b08c;
        }

        select:hover {
            border-color: #d4b08c;
            transform: translateY(-2px);
        }

        .card-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            max-width: 1400px;
            width: 100%;
            min-height: 200px;
        }

        .card {
            width: 180px;
            height: 300px;
            position: relative;
            cursor: pointer;
            transition: transform 0.5s;
            transform-style: preserve-3d;
            perspective: 1000px;
            flex-shrink: 0;
        }

        .card-back,
        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid var(--accent);
            overflow: hidden;
        }

        .card-back {
            background: linear-gradient(45deg, #3a1f50, #200e2d);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotateY(0deg);
        }

        .card-front {
            background: linear-gradient(45deg, #3a1f50, #200e2d);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .card-pattern {
            text-align: center;
            color: var(--accent);
        }

        .card-symbol {
            font-size: 48px;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .card-image.reversed {
            transform: rotate(180deg);
        }

        .card-name {
            color: var(--accent);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: auto;
        }

        .card-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--accent);
            font-size: 14px;
        }

        .card-fallback.reversed {
            transform: rotate(180deg);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px var(--accent), 0 0 10px var(--accent), 0 0 15px var(--accent);
            }
            to {
                text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 30px var(--accent);
            }
        }

        #startBtn {
            padding: 12px 24px;
            background: linear-gradient(45deg, var(--accent), #d4b08c);
            color: var(--primary);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 164, 126, 0.3);
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 164, 126, 0.4);
        }

        #startBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            display: none;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid var(--accent);
            max-width: 1200px;
            width: 100%;
        }

        .card-result {
            display: flex;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(197, 164, 126, 0.3);
        }

        .result-card-image {
            width: 120px;
            height: 200px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .result-card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .result-card-image.reversed img,
        .result-card-image.reversed .fallback-image {
            transform: rotate(180deg);
        }

        .fallback-image {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #3a1f50, #200e2d);
            border-radius: 4px;
            color: var(--accent);
        }

        .result-card-info {
            flex: 1;
            color: var(--accent);
        }

        .result-card-info h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #fff;
        }

        .result-card-info p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .ai-analysis {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .ai-analysis::before {
            content: '✨';
            display: block;
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 4px;
            border: 1px solid #ff6b6b;
        }

        .error-message::before {
            content: '⚠️';
            margin-right: 8px;
        }

        #apiKeyInput {
            padding: 8px 12px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 4px;
            margin-right: 10px;
        }

        #apiKeyInput:focus {
            outline: none;
            box-shadow: 0 0 5px var(--accent);
        }

        #questionInput {
            padding: 15px 20px;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 8px;
            min-width: 300px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #questionInput:focus {
            outline: none;
            box-shadow: 0 0 15px var(--accent);
            border-color: #d4b08c;
            transform: translateY(-2px);
        }

        #questionInput:hover {
            border-color: #d4b08c;
            transform: translateY(-2px);
        }

        #questionInput::placeholder {
            color: rgba(197, 164, 126, 0.6);
        }

        #saveApiKey {
            padding: 8px 16px;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #saveApiKey:hover {
            background: #d4b08c;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--accent);
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .card-area {
                gap: 15px;
            }

            .card {
                width: 150px;
                height: 250px;
            }

            .card-image,
            .card-fallback {
                height: 160px;
            }

            .result {
                padding: 15px;
            }

            .card-result {
                flex-direction: column;
            }

            .result-card-image {
                width: 100%;
                height: 150px;
                margin-right: 0;
                margin-bottom: 15px;
            }

            .ai-analysis,
            .error-message {
                padding: 15px;
            }

            nav h1 {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }

            .controls-container {
                gap: 15px;
            }

            #questionInput {
                min-width: 250px;
                padding: 12px 16px;
                font-size: 1rem;
            }

            select {
                min-width: 180px;
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .card-area {
                gap: 10px;
            }

            .card {
                width: 120px;
                height: 200px;
            }

            .card-image,
            .card-fallback {
                height: 120px;
            }

            nav h1 {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            #questionInput {
                min-width: 200px;
                padding: 10px 14px;
            }

            select {
                min-width: 160px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1>塔罗占卜屋</h1>
        <div class="controls-container">
            <div class="spread-selector">
                <label for="spreadSelect">选择牌阵：</label>
                <select id="spreadSelect">
                    <option value="1">单张占卜</option>
                    <option value="3" selected>三张牌阵</option>
                    <option value="22">大阿卡纳全阵</option>
                </select>
            </div>
            <div class="question-input">
                <label for="questionInput">您的问题：</label>
                <input type="text" id="questionInput" placeholder="请输入您的问题...">
            </div>
        </div>
    </nav>

    <main>
        <div class="card-area" id="cardArea">
            <!-- 卡片将由JavaScript动态生成 -->
        </div>
        <button id="startBtn">开始占卜</button>
        <div class="result" id="resultArea">
            <div class="result-content"></div>
        </div>
    </main>

    <footer>
        <p>注：本占卜仅为娱乐，结果不代表真实命运</p>
    </footer>

    <script>
        // 预定义塔罗牌数据（22张大阿卡那）- 使用免费在线资源
        const tarotCards = [
            { id: 0, name: '愚者', upright: '新开始', reversed: '鲁莽', desc: '正位：自由探索；逆位：缺乏准备', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar00.jpg' },
            { id: 1, name: '魔术师', upright: '创造', reversed: '欺骗', desc: '正位：运用资源；逆位：滥用能力', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar01.jpg' },
            { id: 2, name: '女祭司', upright: '直觉', reversed: '封闭', desc: '正位：内在智慧；逆位：拒绝沟通', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar02.jpg' },
            { id: 3, name: '皇后', upright: '丰饶', reversed: '依赖', desc: '正位：母性关怀；逆位：过度保护', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar03.jpg' },
            { id: 4, name: '皇帝', upright: '权威', reversed: '专制', desc: '正位：领导能力；逆位：独裁统治', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar04.jpg' },
            { id: 5, name: '教皇', upright: '传统', reversed: '教条', desc: '正位：精神指引；逆位：盲从信仰', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar05.jpg' },
            { id: 6, name: '恋人', upright: '选择', reversed: '冲突', desc: '正位：和谐关系；逆位：价值观冲突', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar06.jpg' },
            { id: 7, name: '战车', upright: '意志', reversed: '失控', desc: '正位：自我掌控；逆位：方向迷失', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar07.jpg' },
            { id: 8, name: '力量', upright: '勇气', reversed: '软弱', desc: '正位：内在力量；逆位：自我怀疑', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar08.jpg' },
            { id: 9, name: '隐士', upright: '内省', reversed: '孤独', desc: '正位：寻求真理；逆位：与世隔绝', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar09.jpg' },
            { id: 10, name: '命运之轮', upright: '转变', reversed: '抗拒', desc: '正位：命运转折；逆位：抗拒改变', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar10.jpg' },
            { id: 11, name: '正义', upright: '平衡', reversed: '偏见', desc: '正位：公平裁决；逆位：不公不义', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar11.jpg' },
            { id: 12, name: '倒吊人', upright: '牺牲', reversed: '徒劳', desc: '正位：不同视角；逆位：无谓牺牲', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar12.jpg' },
            { id: 13, name: '死神', upright: '结束', reversed: '停滞', desc: '正位：必要改变；逆位：抗拒结束', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar13.jpg' },
            { id: 14, name: '节制', upright: '调和', reversed: '失衡', desc: '正位：中庸之道；逆位：极端行为', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar14.jpg' },
            { id: 15, name: '恶魔', upright: '束缚', reversed: '解放', desc: '正位：物质欲望；逆位：摆脱枷锁', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar15.jpg' },
            { id: 16, name: '高塔', upright: '剧变', reversed: '逃避', desc: '正位：打破幻象；逆位：拒绝面对', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar16.jpg' },
            { id: 17, name: '星星', upright: '希望', reversed: '绝望', desc: '正位：精神指引；逆位：失去信心', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar17.jpg' },
            { id: 18, name: '月亮', upright: '潜意识', reversed: '迷惑', desc: '正位：直觉发展；逆位：自我欺骗', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar18.jpg' },
            { id: 19, name: '太阳', upright: '喜悦', reversed: '忧郁', desc: '正位：成功快乐；逆位：暂时挫折', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar19.jpg' },
            { id: 20, name: '审判', upright: '觉醒', reversed: '自责', desc: '正位：精神重生；逆位：自我否定', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar20.jpg' },
            { id: 21, name: '世界', upright: '完成', reversed: '未竟', desc: '正位：圆满达成；逆位：功亏一篑', imageUrl: 'https://www.sacred-texts.com/tarot/pkt/img/ar21.jpg' }
        ];

        // 初始化
        const startBtn = document.getElementById('startBtn');
        const cardArea = document.getElementById('cardArea');
        const resultArea = document.getElementById('resultArea');
        const spreadSelect = document.getElementById('spreadSelect');
        const questionInput = document.getElementById('questionInput');

        // 创建背景动态效果
        function createBackgroundEffects() {
            // 创建闪烁星星
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (1 + Math.random() * 2) + 's';
                document.body.appendChild(star);
            }
            
            // 创建流星
            function createMeteor() {
                const meteor = document.createElement('div');
                meteor.className = 'meteor';
                meteor.style.left = Math.random() * 100 + '%';
                meteor.style.top = Math.random() * 50 + '%';
                meteor.style.animationDuration = (2 + Math.random() * 2) + 's';
                document.body.appendChild(meteor);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    if (meteor.parentNode) {
                        meteor.parentNode.removeChild(meteor);
                    }
                }, 4000);
            }
            
            // 定期创建流星
            setInterval(createMeteor, 2000);
            
            // 初始创建几个流星
            for (let i = 0; i < 3; i++) {
                setTimeout(createMeteor, i * 500);
            }
        }

        // 页面加载时创建背景效果
        document.addEventListener('DOMContentLoaded', createBackgroundEffects);

        // 嵌入的DeepSeek API密钥
        const DEEPSEEK_API_KEY = 'sk-3f7fb5d3d56b4809911af67a3a5844b5';

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            cardArea.innerHTML = '';
            resultArea.style.display = 'none';
            
            // 清除之前的AI按钮和分析结果
            const existingAiBtn = document.getElementById('aiBtn');
            if (existingAiBtn) {
                existingAiBtn.remove();
            }
            const existingAiAnalysis = document.querySelector('.ai-analysis');
            if (existingAiAnalysis) {
                existingAiAnalysis.remove();
            }
            const existingError = document.querySelector('.error-message');
            if (existingError) {
                existingError.remove();
            }

            // 洗牌算法
            const shuffled = [...tarotCards].sort(() => Math.random() - 0.5);
            const count = parseInt(spreadSelect.value);
            const selected = shuffled.slice(0, count);

            // 为每张牌确定正逆位
            const cardOrientations = selected.map(() => Math.random() > 0.5 ? '正位' : '逆位');

            // 创建牌卡并添加翻转动画
            selected.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                
                // 创建卡片背面（默认显示）
                const cardBack = document.createElement('div');
                cardBack.className = 'card-back';
                cardBack.innerHTML = `
                    <div class="card-pattern">
                        <div class="card-symbol">🔮</div>
                        <div class="card-title">塔罗牌</div>
                    </div>
                `;
                
                // 创建卡片正面（翻转后显示）
                const cardFront = document.createElement('div');
                cardFront.className = 'card-front';
                const isReversed = cardOrientations[index] === '逆位';
                cardFront.innerHTML = `
                    <img src="${card.imageUrl}" alt="${card.name}" class="card-image ${isReversed ? 'reversed' : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="card-fallback ${isReversed ? 'reversed' : ''}" style="display: none; padding: 20px; text-align: center; color: white;">
                        <div style="font-size: 48px; margin-bottom: 10px;">🎴</div>
                        <h3>${card.name}</h3>
                    </div>
                    <div class="card-name">${card.name}</div>
                `;
                
                cardElement.appendChild(cardBack);
                cardElement.appendChild(cardFront);
                
                setTimeout(() => {
                    cardElement.classList.add('flipped');
                }, 500 * (index + 1));
                
                cardArea.appendChild(cardElement);
            });

            // 显示结果
            await new Promise(resolve => setTimeout(resolve, 500 * (count + 1)));
            resultArea.style.display = 'block';
            
            // 重新启用开始按钮
            startBtn.disabled = false;
            
            // 三张牌阵的特殊处理
            let resultHTML = '';
            if(count === 3) {
                const positions = ['过去', '现在', '未来'];
                resultHTML = selected.map((card, index) => {
                    const orientation = cardOrientations[index];
                    const isReversed = orientation === '逆位';
                    return `
                        <div class="card-result">
                            <div class="result-card-image ${isReversed ? 'reversed' : ''}">
                                <img src="${card.imageUrl}" alt="${card.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <div class="fallback-image" style="display: none; text-align: center; padding: 20px;">
                                    <div style="font-size: 36px;">🎴</div>
                                    <div>${card.name}</div>
                                </div>
                            </div>
                            <div class="result-card-info">
                                <h3>${positions[index]} - ${card.name}（${orientation}）</h3>
                                <p>${positions[index]}解读：${orientation === '正位' ? card.upright : card.reversed}</p>
                                <p>详细含义：${card.desc}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                resultHTML = selected.map((card, index) => {
                    const orientation = cardOrientations[index];
                    const isReversed = orientation === '逆位';
                    return `
                        <div class="card-result">
                            <div class="result-card-image ${isReversed ? 'reversed' : ''}">
                                <img src="${card.imageUrl}" alt="${card.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <div class="fallback-image" style="display: none; text-align: center; padding: 20px;">
                                    <div style="font-size: 36px;">🎴</div>
                                    <div>${card.name}</div>
                                </div>
                            </div>
                            <div class="result-card-info">
                                <h3>${card.name}（${orientation}）</h3>
                                <p>${card.desc}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            resultArea.querySelector('.result-content').innerHTML = resultHTML;
            
            // 添加AI深度解读按钮（确保只有一个）
            const aiBtn = document.createElement('button');
            aiBtn.id = 'aiBtn';
            aiBtn.textContent = '获取AI深度解读';
            aiBtn.style.cssText = `
                margin-top: 20px;
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            `;
            
            aiBtn.addEventListener('click', async () => {
                aiBtn.disabled = true;
                aiBtn.textContent = 'AI分析中...';
                
                // 清除之前的AI分析结果和错误信息
                const existingAiAnalysis = document.querySelector('.ai-analysis');
                if (existingAiAnalysis) {
                    existingAiAnalysis.remove();
                }
                const existingError = document.querySelector('.error-message');
                if (existingError) {
                    existingError.remove();
                }
                
                try {
                    // 使用嵌入的API密钥
                    const apiKey = DEEPSEEK_API_KEY;
                    
                    // 获取用户问题
                    const userQuestion = questionInput.value.trim() || '一般性占卜';
                    
                    // 构建更自然的提示词
                    const cardList = selected.map((card, index) => {
                        const orientation = cardOrientations[index];
                        const position = count === 3 ? ['过去', '现在', '未来'][index] : '';
                        return position ? `${position}：${card.name}（${orientation}）` : `${card.name}（${orientation}）`;
                    }).join('\n');
                    
                    const spreadName = count === 3 ? '过去-现在-未来' : count === 22 ? '大阿卡纳全阵' : '单张牌阵';
                    
                    const prompt = `作为一位经验丰富的塔罗师，请为这次${spreadName}提供解读：

用户问题：${userQuestion}

抽到的牌：
${cardList}

请从以下角度给出实用建议：
1. 针对用户问题的核心信息解读
2. 当前处境的关键因素分析
3. 可以采取的具体行动方向
4. 需要留意的潜在挑战和注意事项

请用平实易懂的语言，结合用户的具体问题给出个性化建议，控制在400字以内。`;

                    // 使用DeepSeek API进行塔罗牌分析
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [{
                                role: 'system',
                                content: '你是一位资深的塔罗牌解读师，擅长用平实易懂的语言给出实用的生活建议。请避免使用任何特殊符号或格式化标记。'
                            }, {
                                role: 'user',
                                content: prompt
                            }],
                            max_tokens: 400,
                            temperature: 0.3
                        })
                    });
                    
                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('API密钥无效，请联系管理员');
                        } else {
                            throw new Error(`API请求失败: ${response.status} - ${response.statusText}`);
                        }
                    }
                    
                    const data = await response.json();
                    if (!data.choices?.[0]?.message?.content) {
                        throw new Error('无效的API响应格式');
                    }
                    
                    const aiAnalysis = data.choices[0].message.content;
                    
                    // 显示AI分析结果
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai-analysis';
                    aiDiv.style.cssText = `
                        margin-top: 20px;
                        padding: 20px;
                        background: rgba(255,255,255,0.1);
                        border-radius: 8px;
                        border: 1px solid var(--accent);
                    `;
                    aiDiv.innerHTML = `<h3 style="color: var(--accent); margin-top: 0;">✨ AI深度解读 ✨</h3><p style="color: var(--accent); margin: 10px 0; font-style: italic;">问题：${userQuestion}</p><div style="line-height: 1.6; color: white;">${aiAnalysis.replace(/\n/g, '<br>')}</div>`;
                    
                    resultArea.appendChild(aiDiv);
                } catch (error) {
                    console.error('AI分析失败:', error);
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-message';
                    errorDiv.style.cssText = `
                        color: #ff6b6b;
                        margin-top: 20px;
                        padding: 10px;
                        background: rgba(255, 107, 107, 0.1);
                        border-radius: 4px;
                        border: 1px solid #ff6b6b;
                    `;
                    errorDiv.innerHTML = `<strong>AI分析失败:</strong> ${error.message}`;
                    resultArea.appendChild(errorDiv);
                } finally {
                    aiBtn.disabled = false;
                    aiBtn.textContent = '获取AI深度解读';
                }
            });
            
            resultArea.appendChild(aiBtn);
            startBtn.disabled = false;
        });
    </script>
</body>
</html>
