        // 获取DOM元素
        const movieDisplay = document.getElementById('movieDisplay');
        const recommendBtn = document.getElementById('recommendBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        let currentMovieIndex = -1;
        let previousMovieIndex = -1;
        
        // 随机推荐电影
        function recommendMovie() {
            // 确保不会连续推荐同一部电影
            do {
                currentMovieIndex = Math.floor(Math.random() * movies.length);
            } while (currentMovieIndex === previousMovieIndex && movies.length > 1);
            
            previousMovieIndex = currentMovieIndex;
            
            const movie = movies[currentMovieIndex];
            
            // 生成星级评价
            const stars = Math.round(movie.rating / 2); // 10分制转换为5星制
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < stars) {
                    starsHtml += '<span class="star">★</span>';
                } else {
                    starsHtml += '<span class="star" style="color: #ccc;">★</span>';
                }
            }
            
            // 显示电影信息
            movieDisplay.innerHTML = `
                <h2 class="movie-title">${movie.title}</h2>
                <div class="movie-info"><span>国家:</span> ${movie.country}</div>
                <div class="movie-info"><span>主演:</span> ${movie.actors}</div>
                <div class="movie-info"><span>简介:</span> ${movie.description}</div>
                <div class="rating">推荐指数: ${starsHtml} (豆瓣评分: ${movie.rating})</div>
                <div class="movie-info"><span>推荐理由:</span> ${movie.reason}</div>
            `;
            
            // 显示换一部按钮
            changeBtn.style.display = 'inline-block';
        }
        
        // 复制链接功能
        function copyLink() {
            const link = 'https://pan.quark.cn/s/0c81cde6b720';
            navigator.clipboard.writeText(link).then(() => {
                alert('链接已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
        
        // 事件监听
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', recommendMovie);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', () => {
            modal.style.display = 'block';
        });
        
        // 关闭模态框
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
