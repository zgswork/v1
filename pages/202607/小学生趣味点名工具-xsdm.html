<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学生趣味点名工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Marker Felt', '楷体', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 15px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 50%, #a1c4fd 100%);
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(255, 107, 107, 0.2);
        }
        
        .subtitle {
            color: #4ecdc4;
            font-size: 1.4rem;
            margin-bottom: 30px;
        }
        
        .student-display {
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            border-radius: 20px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .student-name {
            font-size: 4.5rem;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 3px 3px 0 rgba(255, 107, 107, 0.2);
            animation: pulse 1.5s infinite;
            transition: all 0.3s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 18px 35px;
            font-size: 1.8rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        
        .start-btn {
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        
        .pause-btn {
            background: linear-gradient(to right, #ffd26f 0%, #ffa8a8 100%);
            color: white;
        }
        
        .reset-btn {
            background: linear-gradient(to right, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
        }
        
        .file-upload {
            background: white;
            border: 3px dashed #4ecdc4;
            border-radius: 20px;
            padding: 30px;
            margin: 25px 0;
            position: relative;
        }
        
        .file-upload h2 {
            color: #1a936f;
            margin-bottom: 20px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .file-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            position: absolute;
        }
        
        .file-label {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .file-label:hover {
            transform: translateY(-3px);
        }
        
        .file-label:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        
        .file-info {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .student-list {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .student-list h2 {
            color: #1a936f;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .students-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .student-item {
            background: linear-gradient(to right, #a1c4fd 0%, #c2e9fb 100%);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1.4rem;
            color: #333;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .counter {
            font-size: 1.6rem;
            color: #ff6b6b;
            margin: 20px 0;
            font-weight: bold;
        }
        
        .decoration {
            position: absolute;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            font-size: 2rem;
            color: #ffd166;
            animation: spin 8s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .bubble {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1.2rem; }
            .student-name { font-size: 3.5rem; }
            .btn { padding: 15px 25px; font-size: 1.5rem; }
            .controls { gap: 10px; }
            .file-label { padding: 15px 30px; font-size: 1.3rem; }
        }
        
        .file-types {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .file-type {
            background: #e0f7fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            animation: slideDown 0.5s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @keyframes slideDown {
            0% { top: -50px; opacity: 0; }
            100% { top: 20px; opacity: 1; }
        }
        
        .success { color: #43e97b; }
        .error { color: #ff6b6b; }
        .info { color: #4facfe; }
        
        .reset-notice {
            background: #ffeb3b;
            padding: 10px 20px;
            border-radius: 50px;
            margin-top: 15px;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 装饰元素 -->
        <div class="decoration" style="top: 20px; left: 30px; animation-delay: 0s;">⭐</div>
        <div class="decoration bubble" style="top: 50px; right: 50px; animation-delay: 1s;"></div>
        <div class="decoration" style="bottom: 100px; left: 40px; animation-delay: 2s;">🔔</div>
        <div class="decoration bubble" style="bottom: 60px; right: 40px; animation-delay: 3s;"></div>
        <div class="decoration" style="top: 120px; right: 30px; animation-delay: 4s;">📚</div>
        
        <h1>🌟 趣味点名工具 🌟</h1>
        <p class="subtitle">随机抽取学生，让课堂更有趣！</p>
        
        <div class="student-display">
            <div class="student-name">准备点名</div>
        </div>
        
        <div class="counter">
            已导入 <span id="student-count">0</span> 名学生
        </div>
        
        <div class="controls">
            <button class="btn start-btn"><i class="fas fa-play"></i>开始点名</button>
            <button class="btn pause-btn"><i class="fas fa-pause"></i>暂停</button>
            <button class="btn reset-btn"><i class="fas fa-redo"></i>重置</button>
        </div>
        
        <div class="file-upload">
            <h2><i class="fas fa-file-import"></i>导入学生名单</h2>
            <input type="file" id="file-input" class="file-input" accept=".txt,.csv,.xlsx,.xls">
            <label for="file-input" class="file-label"><i class="fas fa-cloud-upload-alt"></i>选择文件</label>
            <div class="file-info">
                <p>支持以下格式文件：</p>
                <div class="file-types">
                    <div class="file-type"><i class="fas fa-file-excel"></i> Excel (.xlsx, .xls)</div>
                    <div class="file-type"><i class="fas fa-file-csv"></i> CSV文件</div>
                    <div class="file-type"><i class="fas fa-file-alt"></i> 文本文件 (.txt)</div>
                </div>
                <p>文件要求：第一列为学生姓名</p>
                <div class="reset-notice">
                    <i class="fas fa-exclamation-circle"></i>重置后需重新导入文件
                </div>
            </div>
        </div>
        
        <div class="student-list">
            <h2><i class="fas fa-users"></i>学生名单</h2>
            <div class="students-container" id="students-container">
                <!-- 学生名单将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 初始学生名单（示例）
            let students = ['小明', '小红', '小刚', '小丽', '小华', '小强', '小美', '小林'];
            let intervalId = null;
            let isRunning = false;
            let speed = 100; // 初始速度
            
            // DOM元素
            const studentNameElement = document.querySelector('.student-name');
            const startBtn = document.querySelector('.start-btn');
            const pauseBtn = document.querySelector('.pause-btn');
            const resetBtn = document.querySelector('.reset-btn');
            const fileInput = document.getElementById('file-input');
            const studentsContainer = document.getElementById('students-container');
            const studentCountElement = document.getElementById('student-count');
            
            // 显示消息
            function showMessage(message, type = 'info') {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                messageDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
                document.body.appendChild(messageDiv);
                
                setTimeout(() => {
                    messageDiv.style.opacity = '0';
                    setTimeout(() => {
                        document.body.removeChild(messageDiv);
                    }, 500);
                }, 3000);
            }
            
            // 更新学生名单显示
            function updateStudentList() {
                studentsContainer.innerHTML = '';
                students.forEach(student => {
                    const studentElement = document.createElement('div');
                    studentElement.classList.add('student-item');
                    studentElement.textContent = student;
                    studentsContainer.appendChild(studentElement);
                });
                studentCountElement.textContent = students.length;
            }
            
            // 随机选择学生
            function pickRandomStudent() {
                if (students.length === 0) return;
                const randomIndex = Math.floor(Math.random() * students.length);
                studentNameElement.textContent = students[randomIndex];
                
                // 添加动画效果
                studentNameElement.style.animation = 'none';
                setTimeout(() => {
                    studentNameElement.style.animation = 'pulse 1.5s infinite';
                }, 10);
            }
            
            // 开始点名
            function startRolling() {
                if (students.length === 0) {
                    showMessage('请先导入学生名单！', 'error');
                    return;
                }
                
                if (!isRunning) {
                    isRunning = true;
                    speed = 100; // 重置速度
                    startBtn.innerHTML = '<i class="fas fa-tachometer-alt"></i>加速';
                    intervalId = setInterval(pickRandomStudent, speed);
                    showMessage('点名开始啦！看看谁会第一个被点到呢？', 'info');
                } else {
                    // 加快速度
                    speed = Math.max(30, speed - 20);
                    clearInterval(intervalId);
                    intervalId = setInterval(pickRandomStudent, speed);
                }
            }
            
            // 暂停点名
            function pauseRolling() {
                if (isRunning) {
                    clearInterval(intervalId);
                    isRunning = false;
                    startBtn.innerHTML = '<i class="fas fa-play"></i>开始点名';
                    
                    // 添加庆祝效果
                    if (students.length > 0) {
                        studentNameElement.style.color = '#ff6b6b';
                        studentNameElement.style.textShadow = '0 0 20px #ff6b6b, 0 0 30px #ff6b6b';
                        showMessage(`选中了：${studentNameElement.textContent}！`, 'success');
                        setTimeout(() => {
                            studentNameElement.style.color = '';
                            studentNameElement.style.textShadow = '';
                        }, 1000);
                    }
                }
            }
            
            // 重置
            function resetAll() {
                pauseRolling();
                studentNameElement.textContent = '准备点名';
                students = [];
                fileInput.value = ''; // 重置文件输入框
                updateStudentList();
                showMessage('已重置所有数据！', 'info');
            }
            
            // 处理文件导入
            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = e.target.result;
                    let newStudents = [];
                    
                    // 根据文件类型处理
                    if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                        try {
                            const workbook = XLSX.read(data, {type: 'binary'});
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header:1});
                            
                            jsonData.forEach(row => {
                                if (row[0] && row[0].toString().trim() !== '') {
                                    newStudents.push(row[0].toString().trim());
                                }
                            });
                        } catch (error) {
                            showMessage('解析Excel文件时出错: ' + error.message, 'error');
                            return;
                        }
                    } else if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
                        const content = data;
                        if (file.name.endsWith('.csv')) {
                            newStudents = content.split(/[\n,]/).filter(name => name.trim() !== '');
                        } else {
                            newStudents = content.split('\n').filter(name => name.trim() !== '');
                        }
                    } else {
                        showMessage('不支持的文件格式！', 'error');
                        return;
                    }
                    
                    if (newStudents.length === 0) {
                        showMessage('文件中未找到学生姓名！', 'error');
                        return;
                    }
                    
                    students = newStudents;
                    updateStudentList();
                    
                    // 显示成功消息
                    studentNameElement.textContent = '导入成功!';
                    studentNameElement.style.color = '#43e97b';
                    studentNameElement.style.textShadow = '0 0 20px #43e97b, 0 0 30px #43e97b';
                    showMessage(`成功导入 ${students.length} 名学生！`, 'success');
                    
                    setTimeout(() => {
                        studentNameElement.style.color = '';
                        studentNameElement.style.textShadow = '';
                        studentNameElement.textContent = '准备点名';
                    }, 1500);
                };
                
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    reader.readAsBinaryString(file);
                } else {
                    reader.readAsText(file);
                }
            }
            
            // 事件监听
            startBtn.addEventListener('click', startRolling);
            pauseBtn.addEventListener('click', pauseRolling);
            resetBtn.addEventListener('click', resetAll);
            fileInput.addEventListener('change', handleFileUpload);
            
            // 初始化显示
            updateStudentList();
        });
    </script>
</body>
</html>
