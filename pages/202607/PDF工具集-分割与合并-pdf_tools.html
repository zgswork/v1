<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF工具集 - 分割与合并</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #86868b;
            font-weight: 400;
        }

        .tab-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .tab-buttons {
            display: flex;
            background: #f5f5f7;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 20px;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 500;
            color: #86868b;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0071e3;
            border-bottom: 2px solid #0071e3;
        }

        .tab-btn:hover {
            background: rgba(0, 113, 227, 0.05);
            color: #0071e3;
        }

        .tab-content {
            padding: 40px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .section {
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 20px;
        }

        .file-input-area {
            border: 2px dashed #c7c7cc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            background: #fafafa;
            margin-bottom: 20px;
        }

        .file-input-area:hover {
            border-color: #0071e3;
            background: rgba(0, 113, 227, 0.02);
        }

        .file-input-area.dragover {
            border-color: #0071e3;
            background: rgba(0, 113, 227, 0.05);
            transform: scale(1.02);
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 24px;
            background: #0071e3;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .file-label:hover {
            background: #005bb5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .file-info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #86868b;
        }

        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item .file-name {
            font-weight: 500;
            color: #1d1d1f;
        }

        .file-item .remove-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .file-item .remove-btn:hover {
            background: #cc0000;
        }

        .page-range {
            margin: 20px 0;
        }

        .page-range label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .page-range input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .page-range input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .btn-primary:hover {
            background: #005bb5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8e8ed;
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 8px;
            border-left: 4px solid #0071e3;
            display: none;
        }

        .result-area.show {
            display: block;
        }

        .result-area h3 {
            color: #0071e3;
            margin-bottom: 10px;
        }

        .download-link {
            display: inline-block;
            padding: 12px 24px;
            background: #34c759;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .download-link:hover {
            background: #28a745;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .footer-text {
            color: #86868b;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .footer-promo {
            color: #0071e3;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .tab-content {
                padding: 20px;
            }

            .file-input-area {
                padding: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .tab-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF分割合并工具集</h1>
            <p class="subtitle">轻松分割和合并PDF文件</p>
        </header>

        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="split">PDF分割</button>
                <button class="tab-btn" data-tab="merge">PDF合并</button>
            </div>

            <div class="tab-content">
                <!-- PDF分割 -->
                <div class="tab-panel active" id="split">
                    <div class="section">
                        <h2>按页码提取PDF页面</h2>
                        <div class="file-input-area" id="splitFileArea">
                            <input type="file" id="splitFileInput" class="file-input" accept=".pdf" />
                            <label for="splitFileInput" class="file-label">选择PDF文件</label>
                            <p>或拖拽PDF文件到此处</p>
                            <div class="file-info" id="splitFileInfo">未选择文件</div>
                        </div>

                        <div class="page-range">
                            <label for="pageRange">页码范围（例如：1-3,5,7-9）</label>
                            <input type="text" id="pageRange" placeholder="请输入要提取的页码范围" />
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="splitBtn">开始分割</button>
                            <button class="btn btn-secondary" id="clearSplitBtn">清除</button>
                        </div>

                        <div class="result-area" id="splitResult">
                            <h3>分割完成！</h3>
                            <p>您的PDF文件已成功分割。</p>
                            <a href="#" class="download-link" id="splitDownloadLink">下载分割后的PDF</a>
                        </div>
                    </div>
                </div>

                <!-- PDF合并 -->
                <div class="tab-panel" id="merge">
                    <div class="section">
                        <h2>合并多个PDF文件</h2>
                        <div class="file-input-area" id="mergeFileArea">
                            <input type="file" id="mergeFileInput" class="file-input" accept=".pdf" multiple />
                            <label for="mergeFileInput" class="file-label">选择多个PDF文件</label>
                            <p>或拖拽PDF文件到此处（可多选）</p>
                            <div class="file-list" id="mergeFileList"></div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="mergeBtn">开始合并</button>
                            <button class="btn btn-secondary" id="clearMergeBtn">清除</button>
                        </div>

                        <div class="result-area" id="mergeResult">
                            <h3>合并完成！</h3>
                            <p>您的PDF文件已成功合并。</p>
                            <a href="#" class="download-link" id="mergeDownloadLink">下载合并后的PDF</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p class="footer-text">由 無限「GetRichCode」使用 @AIDE 制作。</p>
            <p class="footer-promo">加好友，免费赠送【AI 变现之道】和【AI 搞钱训练营课程】</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
        const { jsPDF } = window.jspdf;
        const { PDFDocument } = window.PDFLib;

        // Tab页切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有active类
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
                
                // 添加active类到当前按钮和对应面板
                btn.classList.add('active');
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // PDF分割功能
        let splitFile = null;
        
        // 文件选择
        document.getElementById('splitFileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                splitFile = e.target.files[0];
                document.getElementById('splitFileInfo').textContent = `已选择：${splitFile.name} (${(splitFile.size / 1024 / 1024).toFixed(2)} MB)`;
            }
        });

        // 拖拽功能
        const splitFileArea = document.getElementById('splitFileArea');
        
        splitFileArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            splitFileArea.classList.add('dragover');
        });

        splitFileArea.addEventListener('dragleave', () => {
            splitFileArea.classList.remove('dragover');
        });

        splitFileArea.addEventListener('drop', (e) => {
            e.preventDefault();
            splitFileArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type === 'application/pdf') {
                    splitFile = file;
                    document.getElementById('splitFileInfo').textContent = `已选择：${splitFile.name} (${(splitFile.size / 1024 / 1024).toFixed(2)} MB)`;
                } else {
                    alert('请选择PDF文件！');
                }
            }
        });

        // 清除按钮
        document.getElementById('clearSplitBtn').addEventListener('click', () => {
            splitFile = null;
            document.getElementById('splitFileInput').value = '';
            document.getElementById('splitFileInfo').textContent = '未选择文件';
            document.getElementById('pageRange').value = '';
            document.getElementById('splitResult').classList.remove('show');
        });

        // 解析页码范围
        function parsePageRange(rangeStr, totalPages) {
            const pages = new Set();
            const ranges = rangeStr.split(',');
            
            for (const range of ranges) {
                const trimmedRange = range.trim();
                if (trimmedRange.includes('-')) {
                    const [start, end] = trimmedRange.split('-').map(Number);
                    const actualStart = Math.max(1, Math.min(start, totalPages));
                    const actualEnd = Math.max(1, Math.min(end, totalPages));
                    
                    for (let i = actualStart; i <= actualEnd; i++) {
                        pages.add(i);
                    }
                } else {
                    const page = Number(trimmedRange);
                    if (page >= 1 && page <= totalPages) {
                        pages.add(page);
                    }
                }
            }
            
            return Array.from(pages).sort((a, b) => a - b);
        }

        // PDF分割
        document.getElementById('splitBtn').addEventListener('click', async () => {
            if (!splitFile) {
                alert('请选择PDF文件！');
                return;
            }
            
            const pageRangeStr = document.getElementById('pageRange').value.trim();
            if (!pageRangeStr) {
                alert('请输入页码范围！');
                return;
            }
            
            try {
                // 读取PDF文件
                const reader = new FileReader();
                reader.readAsArrayBuffer(splitFile);
                
                reader.onload = async (e) => {
                    const arrayBuffer = e.target.result;
                    
                    // 使用PDF-lib加载PDF
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    const totalPages = pdfDoc.getPageCount();
                    
                    // 解析页码范围
                    const pagesToExtract = parsePageRange(pageRangeStr, totalPages);
                    
                    if (pagesToExtract.length === 0) {
                        alert('请输入有效的页码范围！');
                        return;
                    }
                    
                    // 创建新的PDF
                    const newPdfDoc = await PDFDocument.create();
                    
                    // 提取页面
                    const pages = await newPdfDoc.copyPages(pdfDoc, pagesToExtract.map(pageNum => pageNum - 1));
                    pages.forEach(page => newPdfDoc.addPage(page));
                    
                    // 保存PDF
                    const pdfBytes = await newPdfDoc.save();
                    
                    // 下载PDF
                    const downloadLink = document.getElementById('splitDownloadLink');
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.download = `${splitFile.name.split('.')[0]}_split.pdf`;
                    
                    // 显示结果
                    document.getElementById('splitResult').classList.add('show');
                };
            } catch (error) {
                console.error('分割失败：', error);
                alert('PDF分割失败，请重试！');
            }
        });

        // PDF合并功能
        let mergeFiles = [];
        
        // 文件选择
        document.getElementById('mergeFileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                for (const file of e.target.files) {
                    if (file.type === 'application/pdf') {
                        mergeFiles.push(file);
                    }
                }
                updateMergeFileList();
            }
        });

        // 拖拽功能
        const mergeFileArea = document.getElementById('mergeFileArea');
        
        mergeFileArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            mergeFileArea.classList.add('dragover');
        });

        mergeFileArea.addEventListener('dragleave', () => {
            mergeFileArea.classList.remove('dragover');
        });

        mergeFileArea.addEventListener('drop', (e) => {
            e.preventDefault();
            mergeFileArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                for (const file of e.dataTransfer.files) {
                    if (file.type === 'application/pdf') {
                        mergeFiles.push(file);
                    }
                }
                updateMergeFileList();
            }
        });

        // 更新文件列表
        function updateMergeFileList() {
            const fileList = document.getElementById('mergeFileList');
            fileList.innerHTML = '';
            
            mergeFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span class="file-name">${index + 1}. ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    <button class="remove-btn" onclick="removeMergeFile(${index})">移除</button>
                `;
                fileList.appendChild(fileItem);
            });
        }

        // 移除合并文件
        window.removeMergeFile = function(index) {
            mergeFiles.splice(index, 1);
            updateMergeFileList();
        };

        // 清除按钮
        document.getElementById('clearMergeBtn').addEventListener('click', () => {
            mergeFiles = [];
            updateMergeFileList();
            document.getElementById('mergeResult').classList.remove('show');
        });

        // PDF合并
        document.getElementById('mergeBtn').addEventListener('click', async () => {
            if (mergeFiles.length < 2) {
                alert('请选择至少2个PDF文件进行合并！');
                return;
            }
            
            try {
                // 创建新的PDF
                const newPdfDoc = await PDFDocument.create();
                
                // 遍历所有文件
                for (const file of mergeFiles) {
                    const reader = new FileReader();
                    reader.readAsArrayBuffer(file);
                    
                    await new Promise((resolve) => {
                        reader.onload = async (e) => {
                            const arrayBuffer = e.target.result;
                            const pdfDoc = await PDFDocument.load(arrayBuffer);
                            
                            // 复制所有页面到新PDF
                            const pages = await newPdfDoc.copyPages(pdfDoc, Array.from({ length: pdfDoc.getPageCount() }, (_, i) => i));
                            pages.forEach(page => newPdfDoc.addPage(page));
                            
                            resolve();
                        };
                    });
                }
                
                // 保存PDF
                const pdfBytes = await newPdfDoc.save();
                
                // 下载PDF
                const downloadLink = document.getElementById('mergeDownloadLink');
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.download = 'merged.pdf';
                
                // 显示结果
                document.getElementById('mergeResult').classList.add('show');
            } catch (error) {
                console.error('合并失败：', error);
                alert('PDF合并失败，请重试！');
            }
        });
    </script>
</body>
</html>
