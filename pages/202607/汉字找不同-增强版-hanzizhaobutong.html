@keyframes correctPulse {

@keyframes wrongShake {

    // 开始游戏
    // 开始游戏
    startGame() {
        document.getElementById('modeSelection').classList.add('hidden');
        document.getElementById('difficultySelection').classList.add('hidden');
        document.getElementById('gameArea').classList.remove('hidden');

        this.resetGameState();
        this.generateMatrix();
        this.startTimer();
        this.updateDisplay();
    }

    // 重置游戏状态
    // 重置游戏状态
    resetGameState() {
        this.gameState.score = 0;
        this.gameState.level = 1;
        this.gameState.isPlaying = true;
        this.gameState.isPaused = false;
        this.gameState.foundCount = 0;
        this.gameState.correctClicks = 0;
        this.gameState.wrongClicks = 0;
        this.gameState.hintsUsed = 0;
        
        // 闯关模式特殊设置
        if (this.gameState.currentMode === 'challenge') {
            this.gameState.challengeLives = 3;
            // 闯关模式第一关时间限制
            this.gameState.timeLeft = this.getChallengeTimeLimit(1);
        } else if (this.gameState.currentMode === 'timed') {
            // 限时模式：从设定时间开始倒计时
            this.gameState.timeLeft = this.settings.timeLimit[this.gameState.currentMode] || 60;
        } else {
            // 其他模式：从0开始正计时
            this.gameState.timeLeft = 0;
        }
    }
    
    // 获取闯关模式时间限制
    getChallengeTimeLimit(level) {
        // 第1关30秒，每关递增3秒，最后一关不超过60秒
        const baseTime = 30;
        const increment = 3;
        const maxTime = 60;
        
        const timeLimit = baseTime + (level - 1) * increment;
        return Math.min(timeLimit, maxTime);
    }

    // 生成游戏矩阵
    generateMatrix() {
        const matrixContainer = document.getElementById('gameMatrix');
        matrixContainer.innerHTML = '';
        
        const size = this.settings.matrixSize[this.gameState.currentDifficulty];
        const totalCells = size * size;
        
        // 设置网格样式
        matrixContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        
        // 移动端适配：动态调整单元格大小
        this.adjustMatrixForMobile(matrixContainer, size);
        
        // 获取当前难度的字对
        const availablePairs = this.getAvailablePairs();
        const selectedPair = availablePairs[Math.floor(Math.random() * availablePairs.length)];
        
        // 计算不同字符的数量（10-20%）
        const differentCount = Math.floor(totalCells * (0.1 + Math.random() * 0.1));
        this.gameState.totalDifferences = differentCount;
        
        // 生成矩阵数据
        const matrixData = new Array(totalCells).fill(selectedPair.pair[0]);
        
        // 随机放置不同的字符
        const differentPositions = this.getRandomPositions(totalCells, differentCount);
        differentPositions.forEach(pos => {
            matrixData[pos] = selectedPair.pair[1];
        });
        
        // 创建DOM元素
        matrixData.forEach((char, index) => {
            const cell = document.createElement('div');
            cell.className = 'char-cell';
            cell.textContent = char;
            cell.dataset.index = index;
            cell.dataset.isDifferent = differentPositions.includes(index);
            
            cell.addEventListener('click', (e) => this.handleCellClick(e));
            
            matrixContainer.appendChild(cell);
        });
        
        this.updateProgress();
    }

    // 获取可用字对
    getAvailablePairs() {
        const difficultyRanges = {
            easy: [1, 40],
            medium: [41, 80],
            hard: [1, 100]
        };
        
        const [min, max] = difficultyRanges[this.gameState.currentDifficulty];
        return this.charPairs.filter(pair => pair.id >= min && pair.id <= max);
    }

    // 获取随机位置
    getRandomPositions(total, count) {
        const positions = [];
        while (positions.length < count) {
            const pos = Math.floor(Math.random() * total);
            if (!positions.includes(pos)) {
                positions.push(pos);
            }
        }
        return positions;
    }

    // 处理单元格点击
    // 处理单元格点击
    handleCellClick(event) {
        if (!this.gameState.isPlaying || this.gameState.isPaused) return;
        
        const cell = event.target;
        const isDifferent = cell.dataset.isDifferent === 'true';
        
        if (isDifferent && !cell.classList.contains('correct')) {
            // 正确点击
            cell.classList.add('correct');
            this.gameState.foundCount++;
            this.gameState.correctClicks++;
            this.gameState.score += 10 * this.gameState.level;
            
            this.playSound('correct');
            
            if (this.gameState.foundCount >= this.gameState.totalDifferences) {
                // 完成当前关卡
                this.completeLevel();
            }
        } else {
            // 错误点击
            if (!cell.classList.contains('wrong')) {
                cell.classList.add('wrong');
                this.gameState.wrongClicks++;
                
                // 闯关模式扣生命值
                if (this.gameState.currentMode === 'challenge') {
                    this.gameState.challengeLives--;
                    if (this.gameState.challengeLives <= 0) {
                        // 生命值耗尽，游戏结束
                        this.playSound('lose');
                        setTimeout(() => {
                            this.endGame(false, '💔 生命值耗尽！');
                        }, 600);
                        return;
                    }
                } else {
                    // 其他模式扣分
                    this.gameState.score = Math.max(0, this.gameState.score - 5);
                }
                
                this.playSound('wrong');
                
                // 移除错误标记
                setTimeout(() => {
                    cell.classList.remove('wrong');
                }, 600);
            }
        }
        
        this.updateDisplay();
        this.updateProgress();
    }

    // 完成关卡
    // 完成关卡
    completeLevel() {
        this.gameState.score += 50 * this.gameState.level; // 关卡奖励随等级递增
        
        this.playSound('levelComplete');
        
        if (this.gameState.currentMode === 'challenge') {
            // 闯关模式逻辑
            if (this.gameState.level >= this.gameState.challengeMaxLevel) {
                // 达到最大关卡，游戏胜利
                setTimeout(() => {
                    this.endGame(true, '🏆 恭喜通关所有关卡！');
                }, 500);
            } else {
                // 继续下一关
                this.gameState.level++;
                setTimeout(() => {
                    this.nextChallengeLevel();
                }, 800);
            }
        } else {
            // 其他模式结束游戏
            setTimeout(() => {
                this.endGame(true);
            }, 500);
        }
    }

    // 闯关模式下一关
    nextChallengeLevel() {
        // 重置当前关卡状态
        this.gameState.foundCount = 0;
        this.gameState.totalDifferences = 0;
        
        // 设置新关卡的时间限制
        this.gameState.timeLeft = this.getChallengeTimeLimit(this.gameState.level);
        
        // 根据关卡调整难度
        let currentDifficulty = this.gameState.currentDifficulty;
        if (this.gameState.level > 7) {
            currentDifficulty = 'hard';
        } else if (this.gameState.level > 3) {
            currentDifficulty = 'medium';
        }
        
        // 临时保存原难度，生成矩阵后恢复
        const originalDifficulty = this.gameState.currentDifficulty;
        this.gameState.currentDifficulty = currentDifficulty;
        
        this.generateMatrix();
        
        // 恢复原始难度设置
        this.gameState.currentDifficulty = originalDifficulty;
        
        this.updateDisplay();
        
        // 显示关卡提示
        this.showLevelHint();
    }

    // 显示关卡提示
    showLevelHint() {
        const hintMessages = [
            '第1关：热身练习',
            '第2关：基础挑战',
            '第3关：进阶训练',
            '第4关：中级考验',
            '第5关：高级挑战',
            '第6关：专家级别',
            '第7关：大师水准',
            '第8关：终极考验',
            '第9关：巅峰对决',
            '第10关：最终挑战'
        ];
        
        const message = hintMessages[this.gameState.level - 1] || `第${this.gameState.level}关`;
        const timeLimit = this.getChallengeTimeLimit(this.gameState.level);
        document.getElementById('hintText').textContent = `${message}\n时间限制: ${timeLimit}秒\n生命值: ${this.gameState.challengeLives}`;
        document.getElementById('hintPanel').classList.remove('hidden');
        
        // 3秒后自动关闭
        setTimeout(() => {
            document.getElementById('hintPanel').classList.add('hidden');
        }, 3000);
    }

    // 开始计时器
    startTimer() {
        // 清除之前的计时器
        this.clearTimer();
        
        // 为所有模式启动计时器
        this.timer = setInterval(() => {
            if (!this.gameState.isPaused && this.gameState.isPlaying) {
                if (this.gameState.currentMode === 'timed' || this.gameState.currentMode === 'challenge') {
                    // 限时模式和闯关模式：倒计时
                    this.gameState.timeLeft--;
                    if (this.gameState.timeLeft <= 0) {
                        if (this.gameState.currentMode === 'challenge') {
                            // 闯关模式时间到，扣生命值
                            this.gameState.challengeLives--;
                            if (this.gameState.challengeLives <= 0) {
                                this.endGame(false, '⏰ 时间耗尽，挑战失败！');
                            } else {
                                // 还有生命值，重新开始当前关卡
                                this.playSound('wrong');
                                this.gameState.timeLeft = this.getChallengeTimeLimit(this.gameState.level);
                                this.gameState.foundCount = 0;
                                this.generateMatrix();
                                this.updateDisplay();
                                
                                // 显示时间耗尽提示
                                document.getElementById('hintText').textContent = `⏰ 时间耗尽！\n剩余生命值: ${this.gameState.challengeLives}\n重新开始第${this.gameState.level}关`;
                                document.getElementById('hintPanel').classList.remove('hidden');
                                setTimeout(() => {
                                    document.getElementById('hintPanel').classList.add('hidden');
                                }, 2000);
                            }
                        } else {
                            // 限时模式时间到
                            this.endGame(false);
                        }
                        return;
                    }
                } else {
                    // 经典模式：正计时
                    this.gameState.timeLeft++;
                }
                this.updateDisplay();
            }
        }, 1000);
    }

    // 显示提示
    showHint() {
        if (!this.gameState.isPlaying) return;
        
        this.gameState.hintsUsed++;
        this.gameState.score = Math.max(0, this.gameState.score - 20);
        
        // 找到一个未发现的不同字符
        const cells = document.querySelectorAll('.char-cell');
        const unFoundDifferent = Array.from(cells).find(cell => 
            cell.dataset.isDifferent === 'true' && !cell.classList.contains('correct')
        );
        
        if (unFoundDifferent) {
            unFoundDifferent.classList.add('hint');
            setTimeout(() => {
                unFoundDifferent.classList.remove('hint');
            }, 3000);
            
            // 显示提示文本
            const availablePairs = this.getAvailablePairs();
            const randomPair = availablePairs[Math.floor(Math.random() * availablePairs.length)];
            
            document.getElementById('hintText').textContent = `提示：${randomPair.hint}`;
            document.getElementById('hintPanel').classList.remove('hidden');
        }
        
        this.updateDisplay();
    }

    // 关闭提示
    closeHint() {
        document.getElementById('hintPanel').classList.add('hidden');
    }

    // 切换暂停
    togglePause() {
        if (!this.gameState.isPlaying) return;
        
        this.gameState.isPaused = !this.gameState.isPaused;
        const pauseBtn = document.getElementById('pauseBtn');
        pauseBtn.textContent = this.gameState.isPaused ? '▶️ 继续' : '⏸️ 暂停';
    }

    // 重新开始游戏
    restartGame() {
        this.clearTimer();
        this.startGame();
    }

    // 返回主页
    backToHome() {
        this.clearTimer();
        this.gameState.isPlaying = false;
        this.showModeSelection();
    }

    // 结束游戏
    // 结束游戏
    endGame(isWin, customTitle = null) {
        this.gameState.isPlaying = false;
        this.clearTimer();
        
        // 计算统计数据
        const accuracy = this.gameState.correctClicks + this.gameState.wrongClicks > 0 
            ? Math.round((this.gameState.correctClicks / (this.gameState.correctClicks + this.gameState.wrongClicks)) * 100)
            : 0;
        
        // 计算用时
        let timeUsed;
        if (this.gameState.currentMode === 'timed') {
            // 限时模式：初始时间 - 剩余时间
            timeUsed = this.settings.timeLimit[this.gameState.currentMode] - this.gameState.timeLeft;
        } else {
            // 其他模式：直接使用累计时间
            timeUsed = this.gameState.timeLeft;
        }
        
        // 显示结果
        let resultTitle = '🎉 恭喜通关！';
        if (customTitle) {
            resultTitle = customTitle;
        } else if (!isWin) {
            if (this.gameState.currentMode === 'timed') {
                resultTitle = '⏰ 时间到！';
            } else if (this.gameState.currentMode === 'challenge') {
                resultTitle = '💔 挑战失败！';
            } else {
                resultTitle = '😔 游戏结束！';
            }
        }
        
        document.getElementById('resultTitle').textContent = resultTitle;
        document.getElementById('finalScore').textContent = this.gameState.score;
        document.getElementById('accuracy').textContent = accuracy + '%';
        document.getElementById('timeUsed').textContent = timeUsed + 's';
        
        document.getElementById('resultPanel').classList.remove('hidden');
        
        this.playSound(isWin ? 'win' : 'lose');
    }

    // 再玩一次
    // 再玩一次
    playAgain() {
        document.getElementById('resultPanel').classList.add('hidden');
        this.startGame();
    }

    // 更换模式
    changeMode() {
        document.getElementById('resultPanel').classList.add('hidden');
        this.backToHome();
    }

    // 清除计时器
    clearTimer() {
        if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
        }
    }

    // 更新显示
    // 更新显示
    updateDisplay() {
        document.getElementById('score').textContent = `得分: ${this.gameState.score}`;
        
        // 根据模式显示不同信息
        if (this.gameState.currentMode === 'challenge') {
            document.getElementById('level').textContent = `关卡: ${this.gameState.level}/${this.gameState.challengeMaxLevel}`;
            document.getElementById('timer').textContent = `时间: ${this.gameState.timeLeft}s | 生命: ${this.gameState.challengeLives}`;
        } else {
            document.getElementById('level').textContent = `等级: ${this.gameState.level}`;
            document.getElementById('timer').textContent = `时间: ${this.gameState.timeLeft}s`;
        }
    }

    // 更新进度
    updateProgress() {
        const progress = (this.gameState.foundCount / this.gameState.totalDifferences) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('foundCount').textContent = `已找到: ${this.gameState.foundCount}`;
        document.getElementById('totalCount').textContent = `总计: ${this.gameState.totalDifferences}`;
    }

    // 播放音效
    // 移动端矩阵适配
    adjustMatrixForMobile(matrixContainer, size) {
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 480;
        
        if (isMobile) {
            let cellSize, fontSize;
            
            if (isSmallMobile) {
                // 小屏手机适配
                if (size === 10) {
                    cellSize = '28px';
                    fontSize = '1.1em';
                } else if (size === 8) {
                    cellSize = '35px';
                    fontSize = '1.3em';
                } else {
                    cellSize = '40px';
                    fontSize = '1.4em';
                }
            } else {
                // 平板/大屏手机适配
                if (size === 10) {
                    cellSize = '32px';
                    fontSize = '1.2em';
                } else if (size === 8) {
                    cellSize = '40px';
                    fontSize = '1.4em';
                } else {
                    cellSize = '45px';
                    fontSize = '1.6em';
                }
            }
            
            // 动态设置CSS变量
            document.documentElement.style.setProperty('--mobile-cell-size', cellSize);
            document.documentElement.style.setProperty('--mobile-font-size', fontSize);
            
            // 添加移动端类名
            matrixContainer.classList.add('mobile-matrix');
        } else {
            matrixContainer.classList.remove('mobile-matrix');
        }
    }

    // 播放音效
    playSound(type) {
        if (!this.settings.soundEnabled) return;
        
        // 使用Web Audio API创建简单音效
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        const frequencies = {
            correct: 800,
            wrong: 200,
            levelComplete: 1000,
            win: 1200,
            lose: 150
        };
        
        oscillator.frequency.setValueAtTime(frequencies[type] || 400, audioContext.currentTime);
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
    }

    // 切换音效
    toggleSound() {
        this.settings.soundEnabled = !this.settings.soundEnabled;
        const soundBtn = document.getElementById('soundToggle');
        soundBtn.textContent = this.settings.soundEnabled ? '🔊' : '🔇';
    }
}

// 初始化游戏
document.addEventListener('DOMContentLoaded', () => {
    const game = new HanziGameEnhanced();
    
    // 监听窗口大小变化，重新适配矩阵
    window.addEventListener('resize', () => {
        const matrixContainer = document.getElementById('gameMatrix');
        if (matrixContainer && game.gameState.isPlaying) {
            const size = game.settings.matrixSize[game.gameState.currentDifficulty];
            game.adjustMatrixForMobile(matrixContainer, size);
        }
    });
});

// 添加键盘快捷键支持
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'h':
        case 'H':
            document.getElementById('hintBtn').click();
            break;
        case ' ':
            e.preventDefault();
            document.getElementById('pauseBtn').click();
            break;
        case 'r':
        case 'R':
            document.getElementById('restartBtn').click();
            break;
        case 'Escape':
            document.getElementById('backBtn').click();
            break;
    }
});
