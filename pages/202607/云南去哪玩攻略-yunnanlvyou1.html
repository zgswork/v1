                description: "诺邓古村有1000多年历史，以盐业和火腿闻名，保存了大量明清建筑，是滇西北地区年代最久远的村落之一。",
                address: "云南省大理白族自治州云龙县",
                transportation: "从大理下关客运站乘班车至云龙县，再转乘乡村巴士至诺邓村，全程约3小时。",
                ticket: "免费",
                openingHours: "全天开放"
            },
            {
                name: "鸡足山",
                description: "鸡足山是中国五大佛教名山之一，是迦叶菩萨的道场，有'灵山佛都'之称，山上寺庙众多，香火鼎盛。",
                address: "云南省大理白族自治州宾川县",
                transportation: "从大理下关客运站乘班车至宾川县，再转乘景区专线车，全程约2 hour。",
                ticket: "80元（含景区环保车）",
                openingHours: "08:00-17:00"
            },
            {
                name: "翁丁古寨",
                description: "翁丁古寨是中国最后一个原始佤族村落，有400多年 history，保留着原始的茅草房、祭祀房和寨桩等佤族文化元素。",
                address: "云南省临沧市沧源佤族自治县",
                transportation: "从临沧市乘班车至沧源县，再包车前往翁丁村，全程约4小时。",
                ticket: "30元",
                openingHours: "08:30-17:30"
            }
        ];

        // 获取DOM元素
        const getBtn = document.getElementById('getBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        
        // 记录已显示的景点索引
        let shownAttractions = [];
        
        // 获取随机景点
        function getRandomAttraction() {
            // 如果所有景点都已显示过，重置记录
            if (shownAttractions.length === attractions.length) {
                shownAttractions = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownAttractions.includes(randomIndex));
            
            shownAttractions.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点信息
        function displayAttraction(attraction) {
            resultTitle.textContent = attraction.name;
            
            let html = `
                <div class="result-item"><span class="result-label">景点介绍：</span>${attraction.description}</div>
                <div class="result-item"><span class="result-label">具体地址：</span>${attraction.address}</div>
                <div class="result-item"><span class="result-label">交通攻略：</span>${attraction.transportation}</div>
                <div class="result-item"><span class="result-label">门票信息：</span>${attraction.ticket}</div>
                <div class="result-item"><span class="result-label">开放时间：</span>${attraction.openingHours}</div>
            `;
            
            resultContent.innerHTML = html;
            resultContainer.style.display = 'block';
        }
        
        // 按钮事件监听
        getBtn.addEventListener('click', function() {
            const attraction = getRandomAttraction();
            displayAttraction(attraction);
            changeBtn.disabled = false;
        });
        
        changeBtn.addEventListener('click', function() {
            const attraction = getRandomAttraction();
            displayAttraction(attraction);
        });
        
        // 下载按钮事件监听
        downloadBtn.addEventListener('click', function() {
            downloadModal.style.display = 'flex';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === downloadModal) {
                downloadModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
