<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排卵期计算器</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f3f3;
        }
        
        h1 {
            color: #d23669;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .calculator-container {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            background-color: #d23669;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #a51c4a;
        }
        
        .results {
            margin-top: 30px;
            display: none;
        }
        
        .result-card {
            background-color: #f8e8ee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .result-title {
            color: #d23669;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .note {
            font-size: 14px;
            color: #666;
            margin-top: 30px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            
            .calculator-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>排卵期计算器</h1>
        
        <div class="form-group">
            <label for="lastPeriod">上次月经开始日期:</label>
            <input type="date" id="lastPeriod" required>
        </div>
        
        <div class="form-group">
            <label for="cycleLength">月经周期长度(天):</label>
            <input type="number" id="cycleLength" min="20" max="45" value="28" required>
        </div>
        
        <div class="form-group">
            <label for="periodLength">月经持续时间(天):</label>
            <input type="number" id="periodLength" min="2" max="10" value="5" required>
        </div>
        
        <button id="calculateBtn">计算排卵期</button>
        
        <div id="results" class="results">
            <div class="result-card">
                <div class="result-title">下次月经预计开始日期</div>
                <div id="nextPeriodDate"></div>
            </div>
            
            <div class="result-card">
                <div class="result-title">排卵期</div>
                <div id="ovulationDate"></div>
            </div>
            
            <div class="result-card">
                <div class="result-title">易孕期</div>
                <div id="fertileWindow"></div>
            </div>
        </div>
        
        <div class="note">
            <p><strong>注意：</strong>此计算器提供的是基于平均值的估算结果。实际的排卵时间可能因压力、疾病、作息变化等因素而有所不同。如需避孕或备孕，请咨询医生或使用更精确的排卵检测方法。</p>
        </div>
    </div>

    <script>
        document.getElementById('calculateBtn').addEventListener('click', calculateOvulation);
        
        function calculateOvulation() {
            // 获取用户输入
            const lastPeriodDate = new Date(document.getElementById('lastPeriod').value);
            const cycleLength = parseInt(document.getElementById('cycleLength').value);
            const periodLength = parseInt(document.getElementById('periodLength').value);
            
            // 验证输入
            if (isNaN(lastPeriodDate.getTime()) || isNaN(cycleLength) || isNaN(periodLength)) {
                alert('请输入有效的日期和数字');
                return;
            }
            
            // 计算下次月经日期
            const nextPeriodDate = new Date(lastPeriodDate);
            nextPeriodDate.setDate(nextPeriodDate.getDate() + cycleLength);
            
            // 计算排卵日 (下次月经前14天)
            const ovulationDate = new Date(nextPeriodDate);
            ovulationDate.setDate(ovulationDate.getDate() - 14);
            
            // 计算易孕期 (排卵日前5天到排卵日后1天)
            const fertileStart = new Date(ovulationDate);
            fertileStart.setDate(fertileStart.getDate() - 5);
            
            const fertileEnd = new Date(ovulationDate);
            fertileEnd.setDate(fertileEnd.getDate() + 1);
            
            // 显示结果
            document.getElementById('nextPeriodDate').textContent = formatDate(nextPeriodDate);
            document.getElementById('ovulationDate').textContent = formatDate(ovulationDate);
            document.getElementById('fertileWindow').textContent = `${formatDate(fertileStart)} 至 ${formatDate(fertileEnd)}`;
            
            document.getElementById('results').style.display = 'block';
        }
        
        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }
    </script>
</body>
</html>
