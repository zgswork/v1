<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华为手机使用技巧大全</title>
    <style>
        :root {
            --primary-color: #0072e3;
            --secondary-color: #00c7b1;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --accent-color: #ff5e3a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        .button-container {
            margin: 30px 0;
        }
        
        #random-btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 114, 227, 0.3);
        }
        
        #random-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0, 114, 227, 0.5);
        }
        
        #random-btn:active {
            transform: translateY(0);
        }
        
        .tip-container {
            width: 100%;
            min-height: 200px;
            margin-bottom: 40px;
            perspective: 1000px;
        }
        
        .tip-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            display: none;
        }
        
        .tip-card.show {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }
        
        .tip-type {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            background-color: rgba(0, 114, 227, 0.2);
            color: var(--primary-color);
        }
        
        .tip-content {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            color: #888;
            font-size: 0.9rem;
            width: 100%;
        }
        
        footer p {
            margin: 5px 0;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            #random-btn {
                padding: 12px 25px;
                font-size: 1.1rem;
            }
            
            .tip-content {
                font-size: 1.1rem;
            }
            
            .tip-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>华为手机使用技巧大全</h1>
            <p class="subtitle">探索华为手机的隐藏功能，提升使用体验</p>
        </header>
        
        <div class="button-container">
            <button id="random-btn">随机学个小技巧</button>
        </div>
        
        <div class="tip-container">
            <div class="tip-card" id="tip-card">
                <!-- 技巧内容将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <footer>
            <p>本工具由叁贰壹制作</p>
            <p>微信 coolman88886666</p>
            <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="d8e0ecebeaeaeee1e8ec98a9a9f6bbb7b5">[email&#160;protected]</a></p>
            <p>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="4f3c777b7c7d7d79767f7b0f28222e2623612c2022">[email&#160;protected]</a></p>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 华为手机使用技巧数据库
        const tipsDatabase = [
            {

                content: "指关节双击截屏：用单指关节双击屏幕可以截屏；在屏幕上用指关节画'S'可以进行滚动长截屏。"
            },
            {
                type: "快捷操作",
                content: "熄屏快呼：在手机熄屏状态下，长按音量下键，说出联系人姓名或电话号码，便能快速拨号。"
            },
            {
                type: "隐私保护",
                content: "隐私空间：在设置中创建隐私空间，用不同指纹/密码进入，可以隐藏私人应用和数据。"
            },
            {
                type: "多任务处理",
                content: "分屏模式：长按'最近使用的应用'按钮，从中挑选需要分屏的应用，即可实现分屏操作。"
            },
            {
                type: "智能助手",
                content: "小艺语音助手：长按电源键1秒或说出唤醒词'你好，Yoyo'即可唤醒小艺，帮你打电话、发信息等。"
            },
            {
                type: "相机功能",
                content: "声控拍照：在相机设置中开启'声控拍照'，拍照时说'拍照'或'茄子'即可自动拍摄。"
            },
            {
                type: "电池优化",
                content: "省电模式：在'设置 > 电池'中开启'省电模式'或'超级省电模式'，可显著延长续航时间。"
            },
            {
                type: "文件传输",
                content: "华为分享：在控制中心或设置中开启'华为分享'，可与其他华为设备高速传输文件。"
            },
            {
                type: "应用管理",
                content: "应用分身：对于微信、QQ等应用，可以在'设置 > 应用 > 应用分身'中开启分身功能，同时登录两个账号。"
            },
            {
                type: "手势导航",
                content: "全面屏手势：从屏幕左/右边缘向内滑动可返回上一级；从屏幕底部边缘上滑可返回桌面。"
            },
            {
                type: "智慧视觉",
                content: "智慧识屏：双指长按屏幕，可对当前页面的文字或图片进行识别、搜索、复制或分享。"
            },
            {
                type: "安全功能",
                content: "应用锁：在'设置 > 安全 > 应用锁'中，为微信、相册等应用加锁，防止他人偷看。"
            },
            {
                type: "投屏功能",
                content: "无线投屏：在控制中心找到'无线投屏'功能，让手机与电视连接在同一网络，投射内容到电视上。"
            },
            {
                type: "健康使用",
                content: "健康使用手机：在设置中开启'健康使用手机'功能，可设置使用时间限制和应用限额。"
            },
            {
                type: "NFC功能",
                content: "门禁卡复制：在华为钱包应用中添加门禁卡，依照提示操作，可将门禁卡信息录入手机。"
            }
        ];

        const randomBtn = document.getElementById('random-btn');
        const tipCard = document.getElementById('tip-card');
        
        // 显示随机技巧函数
        function showRandomTip() {
            // 随机选择技巧
            const randomIndex = Math.floor(Math.random() * tipsDatabase.length);
            const tip = tipsDatabase[randomIndex];
            
            // 更新卡片内容
            tipCard.innerHTML = `
                <span class="tip-type">${tip.type}</span>
                <p class="tip-content">${tip.content}</p>
            `;
            
            // 显示卡片
            tipCard.classList.add('show');
            
            // 更改按钮文本（如果不是第一次）
            if (randomBtn.textContent === '随机学个小技巧') {
                randomBtn.textContent = '换一个小技巧';
            }
        }
        
        // 添加按钮点击事件
        randomBtn.addEventListener('click', showRandomTip);
    </script>
</body>
