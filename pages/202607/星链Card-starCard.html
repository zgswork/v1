<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星链Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 414px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* 顶部导航 */
        .navbar {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 6px 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #667eea;
            color: white;
        }

        /* 主要内容区 */
        .main-content {
            min-height: calc(100vh - 70px);
        }

        /* 页面切换 */
        .page {
            display: none;
            padding: 20px;
        }

        .page.active {
            display: block;
        }

        /* 编辑页面样式 */
        .edit-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .avatar-upload {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #eee;
        }

        .avatar-preview:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .upload-text {
            font-size: 12px;
            color: #666;
        }

        /* 标签管理 */
        .tags-manager {
            margin-bottom: 15px;
        }

        .tags-display {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tag-item {
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag-remove {
            cursor: pointer;
            color: #999;
            font-weight: bold;
        }

        .tag-remove:hover {
            color: #ff4757;
        }

        .tag-input-group {
            display: flex;
            gap: 8px;
        }

        .tag-input {
            flex: 1;
        }

        .add-btn {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
        }

        .add-btn:hover {
            background: #5a6fd8;
        }

        /* 预设标签样式 */
        .preset-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-tag {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #495057;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .preset-tag:hover {
            background: #e9ecef;
            border-color: #667eea;
            color: #667eea;
        }

        .preset-tag.selected {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .preset-tag.added {
            background: #28a745;
            border-color: #28a745;
            color: white;
            cursor: default;
        }

        /* 平台管理 */
        .platform-manager {
            margin-bottom: 15px;
        }

        .platform-list {
            margin-bottom: 15px;
        }

        .platform-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
        }

        .platform-info {
            flex: 1;
        }

        .platform-name {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .platform-url {
            font-size: 12px;
            color: #666;
        }

        .platform-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #17a2b8;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-edit:hover {
            background: #138496;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        /* 我的产品管理 */
        .product-manager {
            margin-bottom: 15px;
        }

        .product-list {
            display: grid;
            gap: 15px;
            margin-bottom: 15px;
        }

        .product-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .product-title {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .product-stats {
            font-size: 11px;
            color: #999;
        }

        .product-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }

        /* 预览页面样式 */
        .preview-header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            padding: 40px 20px 30px;
            text-align: center;
            color: #333;
        }

        .preview-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #999;
            border: 4px solid rgba(255,255,255,0.8);
        }

        .preview-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .preview-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .preview-tag {
            background: rgba(255,255,255,0.9);
            color: #666;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        .preview-slogan {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .preview-content {
            padding: 20px;
            background: white;
        }

        .preview-platforms {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .preview-platform {
            text-align: center;
            padding: 15px 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
        }

        .preview-platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .preview-platform-name {
            font-size: 12px;
            font-weight: 500;
        }

        .preview-product {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .preview-product-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

        .preview-product-title {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .preview-product-desc {
            font-size: 12px;
            color: #666;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 350px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn-primary {
            background: #667eea;
            color: white;
        }

        .modal-btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        /* 保存按钮 */
        .save-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #28a745;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
            z-index: 50;
        }

        .save-btn:hover {
            background: #218838;
            transform: scale(1.1);
        }

        /* 响应式 */
        @media (max-width: 375px) {
            .preview-platforms {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* 成功提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }
        #cardProduct {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          justify-content: flex-start;
        }
        .card-product-item {
          flex: 1 1 calc(50% - 16px);
          min-width: 160px;
          max-width: calc(50% - 16px);
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.08);
          padding: 16px;
          margin-bottom: 8px;
          display: flex;
          flex-direction: column;
          transition: box-shadow 0.2s;
          border: 1px solid #f0f0f0;
        }
        @media (max-width: 600px) {
          .card-product-item {
            flex-basis: 100%;
            max-width: 100%;
          }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <div class="navbar">
            <div class="nav-title">星链Card</div>
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchPage('edit')">编辑</button>
                <button class="nav-btn" onclick="switchPage('preview')">预览</button>
                <button class="nav-btn" onclick="switchPage('stats')">数据</button>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="main-content">
            <!-- 编辑页面 -->
            <div id="editPage" class="page active">
                <!-- 基础信息 -->
                <div class="edit-section">
                    <div class="section-title">👤 基础信息</div>
                    
                    <div class="avatar-upload">
                        <div class="avatar-preview" id="avatarPreview" onclick="uploadAvatar()">📸</div>
                        <div class="upload-text">点击上传头像</div>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    </div>

                    <div class="form-group">
                        <label class="form-label">姓名/昵称</label>
                        <input type="text" class="form-input" id="userName" placeholder="请输入您的姓名或昵称">
                    </div>

                    <div class="form-group">
                        <label class="form-label">个人标签</label>
                        <div class="tags-manager">
                            <div class="tags-display" id="tagsDisplay"></div>
                            
                            <!-- 预设标签选择 -->
                            <div style="margin-bottom: 10px;">
                                <label style="font-size: 12px; color: #666; margin-bottom: 5px; display: block;">快速选择</label>
                                <div class="preset-tags" id="presetTags"></div>
                            </div>
                            
                            <!-- 自定义标签输入 -->
                            <div class="tag-input-group">
                                <input type="text" class="form-input tag-input" id="tagInput" placeholder="或自定义标签">
                                <button class="add-btn" onclick="addCustomTag()">添加</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">个人简介 (Slogan)</label>
                        <textarea class="form-input form-textarea" id="userSlogan" placeholder="一句话介绍自己，如：帮你用下班时间搞副业" maxlength="120" oninput="updateSloganCount()"></textarea>
                        <div id="sloganCount" style="font-size: 12px; color: #999; text-align: right;">0/120</div>
                    </div>
                </div>

                <!-- 平台管理 -->
                <div class="edit-section">
                    <div class="section-title">🔗 社交平台</div>
                    
                    <div class="platform-list" id="platformList"></div>
                    
                    <button class="add-btn" style="width: 100%;" onclick="showAddPlatformModal()">+ 添加平台</button>
                </div>

                <!-- 我的产品管理 -->
                <div class="edit-section">
                    <div class="section-title">🛍️ 我的产品</div>
                    <div class="product-list" id="productList"></div>
                    <button class="add-btn" style="width: 100%;" onclick="showAddProductModal()">+ 添加产品</button>
                </div>

                <!-- 名片样式设置 -->
                <div class="edit-section">
                  <div class="section-title">🎨 名片样式</div>
                  <div style="margin-bottom:10px;">
                    <label>背景颜色：</label>
                    <input type="color" id="cardBgColor" value="#667eea" style="width:40px;height:30px;vertical-align:middle;">
                  </div>
                  <div>
                    <label>背景图片：</label>
                    <input type="file" id="cardBgImageInput" accept="image/*">
                    <span id="cardBgImageName" style="font-size:12px;color:#999;"></span>
                    <button id="deleteBgImageBtn" type="button" style="display:none;margin-left:8px;font-size:12px;" onclick="deleteCardBgImage()">删除图片</button>
                  </div>
                </div>

                <!-- ===== 平台管理模态框 ===== -->
                <div id="platformModal" class="modal">
                    <div class="modal-content">
                    <div class="modal-title" id="platformModalTitle">添加平台</div>
                    <div class="form-group">
                        <label class="form-label">平台名称</label>
                        <select class="form-input" id="platformName">
                            <option value="">请选择平台</option>
                            <option value="微信">💬 微信</option>
                            <option value="微信公众号">📢 公众号</option>
                            <option value="微博">🐦 微博</option>
                            <option value="抖音">🎵 抖音</option>
                            <option value="小红书">📕 小红书</option>
                            <option value="B站">📺 B站</option>
                            <option value="知乎">🤔 知乎</option>
                            <option value="快手">⚡ 快手</option>
                            <option value="QQ">💬 QQ</option>
                            <option value="Facebook">📘 Facebook</option>
                            <option value="Instagram">📸 Instagram</option>
                            <option value="Twitter">🐦 Twitter</option>
                            <option value="YouTube">▶️ YouTube</option>
                            <option value="LinkedIn">💼 LinkedIn</option>
                            <option value="Pinterest">📌 Pinterest</option>
                            <option value="Snapchat">👻 Snapchat</option>
                            <option value="Telegram">✈️ Telegram</option>
                            <option value="WhatsApp">📱 WhatsApp</option>
                            <option value="Discord">🎮 Discord</option>
                            <option value="豆瓣">🌱 豆瓣</option>
                            <option value="其他">🔗 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">粉丝数量</label>
                        <input class="form-input" id="platformFollowers" placeholder="如：3w">
                    </div>
                    <div class="form-group">
                        <label class="form-label">主页链接</label>
                        <input class="form-input" id="platformUrl" placeholder="https://...">
                    </div>
                    <div class="modal-buttons">
                        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">取消</button>
                        <button class="modal-btn modal-btn-primary" onclick="savePlatform()">保存</button>
                    </div>
                    </div>
                </div>
                
                <!-- ===== 产品管理模态框 ===== -->
                <div id="productModal" class="modal">
                    <div class="modal-content">
                    <div class="modal-title" id="productModalTitle">添加产品</div>
                    <div class="form-group">
                        <label class="form-label">产品名称</label>
                        <input class="form-input" id="productTitle">
                    </div>
                    <div class="form-group">
                        <label class="form-label">简短描述</label>
                        <input class="form-input" id="productDesc">
                    </div>
                    <div class="form-group">
                        <label class="form-label">数据/卖点</label>
                        <input class="form-input" id="productStats" placeholder="如：已售 2000+">
                    </div>
                    <div class="form-group">
                        <label class="form-label">产品链接（选填）</label>
                        <input class="form-input" id="productUrl" placeholder="https://...">
                    </div>
                    <div class="modal-buttons">
                        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">取消</button>
                        <button class="modal-btn modal-btn-primary" onclick="saveProduct()">保存</button>
                    </div>
                    </div>
                </div>

                <!-- 联系信息 -->
                <div class="edit-section">
                    <div class="section-title">📞 联系信息</div>
                    
                    <div class="form-group">
                        <label class="form-label">微信号</label>
                        <input type="text" class="form-input" id="wechatId" placeholder="请输入微信号">
                    </div>

                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-input" id="phoneNumber" placeholder="请输入手机号">
                    </div>

                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input" id="email" placeholder="请输入邮箱地址">
                    </div>
                </div>
            </div>

            <!-- 预览页面 -->
            <div id="previewPage" class="page">
                <div class="preview-header">
                    <div class="preview-avatar" id="previewAvatar">👤</div>
                    <div class="preview-name" id="previewName">请设置姓名</div>
                    <div class="preview-tags" id="previewTags"></div>
                    <div class="preview-slogan" id="previewSlogan">请设置个人简介</div>
                </div>

                <div class="preview-content">
                    <div class="section-title">🔗 我的平台</div>
                    <div class="preview-platforms" id="previewPlatforms"></div>

                    <div class="section-title">🛍️ 我的产品</div>
                    <div class="preview-product" id="previewProduct"></div>

                    <div class="section-title">📞 联系我</div>
                    <div id="previewContact"></div>
                </div>
            </div>

            <!-- 数据统计页面 -->
            <div id="statsPage" class="page">
                <div class="edit-section">
                    <div class="section-title">📊 访问统计</div>
                    <p style="text-align: center; color: #666; margin: 40px 0;">数据统计功能开发中...</p>
                </div>
            </div>
        </div>

        <!-- 底部操作区 -->
        <div style="padding: 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px;">
            <button class="action-btn" style="flex: 1; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;" onclick="generateCard()">
                🎨 生成名片
            </button>
        </div>

        <!-- 名片生成模态框（无二维码） -->
        <div id="cardModal" class="modal">
            <div class="modal-content" style="max-width: 400px; max-height: 90vh;">
                <div class="modal-title">数字名片</div>
                <!-- 名片预览区 -->
                <div id="digitalCard" style="background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin: 15px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                    <!-- 名片头部 -->
                    <div style="text-align: center; margin-bottom: 20px; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px; color: white;">
                        <div id="cardAvatar" style="width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px;">👤</div>
                        <div id="cardName" style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">姓名</div>
                        <div id="cardTags" style="font-size: 12px; opacity: 0.9;"></div>
                        <div id="cardSlogan" style="font-size: 14px; margin-top: 8px; opacity: 0.8;">个人简介</div>
                    </div>
                    <!-- 平台展示 -->
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333;">🔗 我的平台</div>
                        <div id="cardPlatforms" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;"></div>
                    </div>
                    <!-- 产品集展示 -->
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333;">🛍️ 我的产品</div>
                        <div id="cardProduct" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: flex-start;"></div>
                    </div>
                    <!-- 联系信息 -->
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333;">📞 联系我</div>
                        <div id="cardContact" style="font-size: 12px; color: #666;"></div>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-secondary" onclick="closeModal()">关闭</button>
                    <button class="modal-btn modal-btn-primary" onclick="downloadCard()">💾 下载名片</button>
                    <button class="modal-btn modal-btn-primary" onclick="shareCard()">📤 分享名片</button>
                </div>
            </div>
        </div>

        <!-- 分享二维码模态框 -->
    <div id="qrModal" class="modal">
      <div class="modal-content" style="max-width: 300px;">
        <div class="modal-title">分享二维码</div>
        <div class="qr-code" style="text-align:center; margin:20px 0;"></div>
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-primary" onclick="closeModal()">关闭</button>
        </div>
      </div>
    </div>

    <!-- 成功提示 -->
    <div id="toast" class="toast">保存成功！</div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        // 全局数据存储
        let userData = {
            avatar: '',
            name: '',
            tags: [],
            slogan: '',
            platforms: [],
            product: [],
            contact: {
                wechat: '',
                phone: '',
                email: ''
            },
            cardBgColor: '#667eea', // 新增：名片背景颜色
            cardBgImage: null // 新增：名片背景图片
        };

        let editingPlatformIndex = -1;
        let editingProductIndex = -1;

        // 预设标签数据
        const presetTagsData = [
            // 身份类型
            '职场博主', '知识博主', '生活博主', '美妆博主', '旅行博主', '美食博主',
            '健身博主', '育儿博主', '时尚博主', '摄影师', '设计师', '程序员',
            
            // 平台类型
            '小红书达人', '抖音创作者', 'B站UP主', '微博大V', '知乎答主', '视频号博主',
            
            // 领域专长
            '副业导师', '理财专家', '心理咨询师', '营销专家', '创业者', '自由职业者',
            '内容创作者', '品牌合作达人', '电商达人', '教育培训师',
            
            // 特色标签
            '95后', '00后', '宝妈', '学生党', '上班族', '创业者',
            '专业认证', '官方合作', '头部达人', '新锐博主'
        ];

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderAll();
            renderPresetTags();
            
            // 绑定事件
            document.getElementById('tagInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addCustomTag();
                }
            });

            document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);
            document.getElementById('avatarPreview').addEventListener('contextmenu', function(e) {
                e.preventDefault();
                deleteAvatar();
            });
            // 新增：自动保存主要输入框
            const autoSaveFields = [
                'userName', 'userSlogan', 'wechatId', 'phoneNumber', 'email'
            ];
            autoSaveFields.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', saveData);
                }
            });
            // 新增：平台、产品模态框内输入自动保存
            ['platformName', 'platformFollowers', 'platformUrl'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', function() {
                        // 临时保存到userData.editingPlatformDraft
                        if (!userData.editingPlatformDraft) userData.editingPlatformDraft = {};
                        userData.editingPlatformDraft[id] = el.value;
                        saveData();
                    });
                }
            });
            ['productTitle', 'productDesc', 'productStats', 'productUrl'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', function() {
                        if (!userData.editingProductDraft) userData.editingProductDraft = {};
                        userData.editingProductDraft[id] = el.value;
                        saveData();
                    });
                }
            });
            updateSloganCount(); // 初始化字数统计

            // 名片样式设置事件
            document.getElementById('cardBgColor').addEventListener('input', function() {
              userData.cardBgColor = this.value;
              saveData();
              updatePreview();
            });
            document.getElementById('cardBgImageInput').addEventListener('change', function(e) {
              const file = e.target.files[0];
              if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                  userData.cardBgImage = ev.target.result;
                  document.getElementById('cardBgImageName').textContent = file.name;
                  document.getElementById('deleteBgImageBtn').style.display = '';
                  saveData();
                  updatePreview();
                };
                reader.readAsDataURL(file);
              }
            });
            // 初始化和每次预览时同步按钮显示
            updateBgImageDeleteBtn();
        });

        // 页面切换
        function switchPage(pageType) {
            // 切换导航按钮状态
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 切换页面显示
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageType + 'Page').classList.add('active');

            // 如果切换到预览页面，更新预览内容
            if (pageType === 'preview') {
                updatePreview();
            }
        }

        // 头像上传
        function uploadAvatar() {
            document.getElementById('avatarInput').click();
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    userData.avatar = e.target.result;
                    console.log('头像上传成功:', userData.avatar); // 调试日志
                    document.getElementById('avatarPreview').style.backgroundImage = `url(${e.target.result})`;
                    document.getElementById('avatarPreview').style.backgroundSize = 'cover';
                    document.getElementById('avatarPreview').textContent = '';
                    saveData();
                    
                    // 新增：上传后自动更新预览
                    if (document.getElementById('previewPage').classList.contains('active')) {
                        updatePreview();
                    }
                };
                reader.readAsDataURL(file);
            }
        }
        
        // 删除头像
        function deleteAvatar() {
            if (confirm('确定要删除当前头像吗？')) {
                userData.avatar = null;
                document.getElementById('avatarPreview').style.backgroundImage = '';
                document.getElementById('avatarPreview').textContent = '📸';
                saveData();
                
                // 更新预览
                if (document.getElementById('previewPage').classList.contains('active')) {
                    updatePreview();
                }
            }
        }

        // 标签管理
        function renderPresetTags() {
            const container = document.getElementById('presetTags');
            container.innerHTML = presetTagsData.map(tag => {
                const isAdded = userData.tags.includes(tag);
                const className = isAdded ? 'preset-tag added' : 'preset-tag';
                const onclick = isAdded ? '' : `onclick="addPresetTag('${tag}')"`;
                return `<div class="${className}" ${onclick}>${tag}${isAdded ? ' ✓' : ''}</div>`;
            }).join('');
        }

        function addPresetTag(tag) {
            if (!userData.tags.includes(tag)) {
                userData.tags.push(tag);
                renderTags();
                renderPresetTags(); // 更新预设标签状态
            }
        }

        function addCustomTag() {
            const tagInput = document.getElementById('tagInput');
            const tag = tagInput.value.trim();
            
            if (tag && !userData.tags.includes(tag)) {
                userData.tags.push(tag);
                tagInput.value = '';
                renderTags();
                renderPresetTags(); // 更新预设标签状态
            }
        }

        function removeTag(index) {
            userData.tags.splice(index, 1);
            renderTags();
            renderPresetTags(); // 更新预设标签状态
        }

        function renderTags() {
            const container = document.getElementById('tagsDisplay');
            container.innerHTML = userData.tags.map((tag, index) => `
                <div class="tag-item">
                    ${tag}
                    <span class="tag-remove" onclick="removeTag(${index})">×</span>
                </div>
            `).join('');
        }

        // 平台管理
        function showAddPlatformModal() {
            editingPlatformIndex = -1;
            clearPlatformForm();
            // 新增：恢复草稿
            if (userData.editingPlatformDraft) {
                document.getElementById('platformName').value = userData.editingPlatformDraft.platformName || '';
                document.getElementById('platformFollowers').value = userData.editingPlatformDraft.platformFollowers || '';
                document.getElementById('platformUrl').value = userData.editingPlatformDraft.platformUrl || '';
            }
            document.getElementById('platformModal').style.display = 'flex';
        }

        function editPlatform(index) {
            editingPlatformIndex = index;
            const platform = userData.platforms[index];
            
            document.getElementById('platformName').value = platform.name;
            document.getElementById('platformFollowers').value = platform.followers;
            document.getElementById('platformUrl').value = platform.url;
            
            document.getElementById('platformModal').style.display = 'flex';
        }

        function savePlatform() {
            const name = document.getElementById('platformName').value;
            const followers = document.getElementById('platformFollowers').value;
            const url = document.getElementById('platformUrl').value;
            if (!name || !followers || !url) {
                alert('请填写完整信息');
                return;
            }
            const platformData = {
                name,
                followers,
                url,
                icon: getPlatformIcon(name),
                color: getPlatformColor(name)
            };
            if (editingPlatformIndex >= 0) {
                userData.platforms[editingPlatformIndex] = platformData;
            } else {
                userData.platforms.push(platformData);
            }
            // 清除草稿
            userData.editingPlatformDraft = {};
            closeModal();
            renderPlatforms();
            saveData();
        }

        function deletePlatform(index) {
            if (confirm('确定要删除这个平台吗？')) {
                userData.platforms.splice(index, 1);
                renderPlatforms();
            }
        }

        function renderPlatforms() {
            const container = document.getElementById('platformList');
            container.innerHTML = userData.platforms.map((platform, index) => `
                <div class="platform-item">
                    <div class="platform-icon" style="background: ${platform.color}">
                        ${platform.icon}
                    </div>
                    <div class="platform-info">
                        <div class="platform-name">${platform.name}</div>
                        <div class="platform-url">${platform.followers} • ${platform.url}</div>
                    </div>
                    <div class="platform-actions">
                        <button class="action-btn btn-edit" onclick="editPlatform(${index})">编辑</button>
                        <button class="action-btn btn-delete" onclick="deletePlatform(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 我的产品管理
        function showAddProductModal() {
            editingProductIndex = -1;
            clearProductForm();
            // 新增：恢复草稿
            if (userData.editingProductDraft) {
                document.getElementById('productTitle').value = userData.editingProductDraft.productTitle || '';
                document.getElementById('productDesc').value = userData.editingProductDraft.productDesc || '';
                document.getElementById('productStats').value = userData.editingProductDraft.productStats || '';
                document.getElementById('productUrl').value = userData.editingProductDraft.productUrl || '';
            }
            document.getElementById('productModal').style.display = 'flex';
        }

        function editProduct(index) {
            editingProductIndex = index;
            const product = userData.product[index];
            
            document.getElementById('productTitle').value = product.title;
            document.getElementById('productDesc').value = product.description;
            document.getElementById('productStats').value = product.stats;
            document.getElementById('productUrl').value = product.url;
            
            document.getElementById('productModal').style.display = 'flex';
        }

        function saveProduct() {
            const title = document.getElementById('productTitle').value;
            const description = document.getElementById('productDesc').value;
            const stats = document.getElementById('productStats').value;
            const url = document.getElementById('productUrl').value;
            if (!title || !description) {
                alert('请填写标题和描述');
                return;
            }
            const productData = {
                title,
                description,
                stats,
                url
            };
            if (editingProductIndex >= 0) {
                userData.product[editingProductIndex] = productData;
            } else {
                userData.product.push(productData);
            }
            // 清除草稿
            userData.editingProductDraft = {};
            closeModal();
            renderProduct();
            saveData();
        }

        function deleteProduct(index) {
            if (confirm('确定要删除这个产品吗？')) {
                userData.product.splice(index, 1);
                renderProduct();
            }
        }

        function renderProduct() {
            const container = document.getElementById('productList');
            container.innerHTML = userData.product.map((item, index) => `
                <div class="product-item">
                    <div class="product-actions">
                        <button class="action-btn btn-edit" onclick="editProduct(${index})">编辑</button>
                        <button class="action-btn btn-delete" onclick="deleteProduct(${index})">删除</button>
                    </div>
                    <div class="product-title">${item.title}</div>
                    <div class="product-desc">${item.description}</div>
                    ${item.stats ? `<div class="product-stats">${item.stats}</div>` : ''}
                </div>
            `).join('');
        }

        // 预览更新
        function updatePreview() {
            collectFormData();
            
            // 更新头像
            const previewAvatar = document.getElementById('previewAvatar');
            if (userData.avatar) {
                previewAvatar.style.backgroundImage = `url(${userData.avatar})`;
                previewAvatar.style.backgroundSize = 'cover';
                previewAvatar.textContent = '';
            } else {
                previewAvatar.style.backgroundImage = '';
                previewAvatar.textContent = '👤';
            }

            // 更新基础信息
            document.getElementById('previewName').textContent = userData.name || '请设置姓名';
            document.getElementById('previewSlogan').textContent = userData.slogan || '请设置个人简介';

            // 更新标签
            const previewTags = document.getElementById('previewTags');
            previewTags.innerHTML = userData.tags.map(tag => `
                <span class="preview-tag">${tag}</span>
            `).join('');

            // 更新平台
            const previewPlatforms = document.getElementById('previewPlatforms');
            previewPlatforms.innerHTML = userData.platforms.map(platform => `
                <a href="${platform.url}" target="_blank" class="preview-platform">
                    <div class="preview-platform-icon" style="background: ${platform.color}">
                        ${platform.icon}
                    </div>
                    <div class="preview-platform-name">${platform.name}</div>
                    <div style="font-size: 10px; color: #999;">${platform.followers}</div>
                </a>
            `).join('');

            // 更新产品集
            const previewProduct = document.getElementById('previewProduct');
            previewProduct.innerHTML = userData.product.map(item => `
                <div class="preview-product-item">
                    <div class="preview-product-title">${item.title}</div>
                    <div class="preview-product-desc">${item.description}</div>
                    ${item.stats ? `<div style="font-size: 10px; color: #999; margin-top: 5px;">${item.stats}</div>` : ''}
                </div>
            `).join('');

            // 更新联系信息
            const previewContact = document.getElementById('previewContact');
            const contacts = [];
            if (userData.contact.wechat) contacts.push(`微信：${userData.contact.wechat}`);
            if (userData.contact.phone) contacts.push(`电话：${userData.contact.phone}`);
            if (userData.contact.email) contacts.push(`邮箱：${userData.contact.email}`);
            
            previewContact.innerHTML = contacts.length > 0 ? 
                contacts.map(contact => `<div style="margin-bottom: 8px; font-size: 14px;">${contact}</div>`).join('') :
                '<div style="color: #999; text-align: center;">请添加联系信息</div>';

            // 预览背景
            const previewHeader = document.querySelector('.preview-header');
            if (userData.cardBgImage) {
              previewHeader.style.background = `url(${userData.cardBgImage}) center/cover`;
            } else if (userData.cardBgColor) {
              previewHeader.style.background = userData.cardBgColor;
            } else {
              previewHeader.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%)';
            }
            updateBgImageDeleteBtn(); // 预览时也更新删除按钮状态
        }

        // 数据收集
        function collectFormData() {
            userData.name = document.getElementById('userName').value;
            userData.slogan = document.getElementById('userSlogan').value;
            userData.contact.wechat = document.getElementById('wechatId').value;
            userData.contact.phone = document.getElementById('phoneNumber').value;
            userData.contact.email = document.getElementById('email').value;
        }

        // 数据保存和加载
        function saveData() {
            collectFormData();
            localStorage.setItem('starCardData', JSON.stringify(userData));
            showToast('保存成功！');
        }

        function loadData() {
            const saved = localStorage.getItem('starCardData');
            if (saved) {
                userData = Object.assign(userData, JSON.parse(saved));
                
                // 恢复表单数据
                document.getElementById('userName').value = userData.name || '';
                document.getElementById('userSlogan').value = userData.slogan || '';
                document.getElementById('wechatId').value = userData.contact.wechat || '';
                document.getElementById('phoneNumber').value = userData.contact.phone || '';
                document.getElementById('email').value = userData.contact.email || '';

                // 恢复头像
                if (userData.avatar) {
                    const avatarPreview = document.getElementById('avatarPreview');
                    avatarPreview.style.backgroundImage = `url(${userData.avatar})`;
                    avatarPreview.style.backgroundSize = 'cover';
                    avatarPreview.textContent = '';
                }
            }
        }

        function renderAll() {
            renderTags();
            renderPresetTags();
            renderPlatforms();
            renderProduct();
        }

        // 工具函数
        function getPlatformIcon(name) {
            const icons = {
                '小红书': '📖',
                '抖音': '🎵',
                '微信公众号': '💬',
                '微博': '📢',
                'B站': '📺',
                '知乎': '🤔',
                '快手': '⚡',
                '其他': '🔗'
            };
            return icons[name] || '🔗';
        }

        function getPlatformColor(name) {
            const colors = {
                '小红书': '#ff2442',
                '抖音': '#000',
                '微信公众号': '#07c160',
                '微博': '#e6162d',
                'B站': '#00a1d6',
                '知乎': '#0084ff',
                '快手': '#ff6600',
                '其他': '#667eea'
            };
            return colors[name] || '#667eea';
        }

        function clearPlatformForm() {
            document.getElementById('platformName').value = '';
            document.getElementById('platformFollowers').value = '';
            document.getElementById('platformUrl').value = '';
        }

        function clearProductForm() {
            document.getElementById('productTitle').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productStats').value = '';
            document.getElementById('productUrl').value = '';
        }

        // 生成数字名片
        function generateCard() {
            try {
                collectFormData();
                if (!userData.name) {
                    alert('请先填写姓名信息');
                    return;
                }
                // 确保名片模态框元素存在
                if (!document.getElementById('digitalCard')) {
                    alert('名片元素未正确加载，请刷新页面重试');
                    return;
                }
                // 更新名片内容
                updateCardContent();
                // 显示名片模态框
                document.getElementById('cardModal').style.display = 'flex';
            } catch (error) {
                console.error('生成名片时发生错误:', error);
                throw error;
            }
        }

        function updateCardContent() {
            try {
                // 更新头像
                const cardAvatar = document.getElementById('cardAvatar');
                if (userData.avatar) {
                    cardAvatar.style.backgroundImage = `url(${userData.avatar})`;
                    cardAvatar.style.backgroundSize = 'cover';
                    cardAvatar.textContent = '';
                } else {
                    cardAvatar.style.backgroundImage = '';
                    cardAvatar.textContent = '👤';
                }
                console.info('updateCardContent: 头像更新完成');
                // 更新基础信息
                document.getElementById('cardName').textContent = userData.name || '姓名';
                document.getElementById('cardSlogan').textContent = userData.slogan || '个人简介';
                // 更新标签
                document.getElementById('cardTags').textContent = userData.tags.join(' • ') || '暂无标签';
                // 更新平台
                const cardPlatforms = document.getElementById('cardPlatforms');
                cardPlatforms.innerHTML = (userData.platforms || []).map(platform => `
                    <a href="${platform.url || '#'}" target="_blank" style="text-align: center; padding: 5px; background: #f8f9fa; border-radius: 4px; display: block; text-decoration: none; color: #333;">
                        <div style="width: 24px; height: 24px; margin: 0 auto 3px; background: ${platform.color || '#667eea'}; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white;">${platform.icon || '🔗'}</div>
                        <div style="font-size: 10px; color: #666;">${platform.name || ''}</div>
                        <div style="font-size: 10px; color: #999;">${platform.followers || ''}</div>
                    </a>
                `).join('') || '<div style="color: #999; grid-column: 1/-1; text-align: center;">暂无平台</div>';
                // 更新产品集
                const cardProduct = document.getElementById('cardProduct');
                cardProduct.innerHTML = (userData.product || []).map(item => `
                    <div class="card-product-item">
                        <div style="font-weight: 600; margin-bottom: 8px; font-size: 15px; color: #333;">${item.title || ''}</div>
                        <div style="font-size: 13px; color: #666; margin-bottom: 8px; flex: 1;">${item.description || ''}</div>
                        ${item.stats ? `<div style='font-size: 12px; color: #999; margin-bottom: 8px;'>${item.stats}</div>` : ''}
                        ${item.url ? `<a href="${item.url}" target="_blank" style="font-size: 13px; color: #667eea; text-decoration: underline; align-self: flex-end;">查看产品</a>` : ''}
                    </div>
                `).join('') || '<div style="color: #999; width: 100%; text-align: center;">暂无产品</div>';
                // 更新联系信息
                const cardContact = document.getElementById('cardContact');
                const contacts = [];
                if (userData.contact.wechat) contacts.push(`微信：${userData.contact.wechat}`);
                if (userData.contact.phone) contacts.push(`电话：${userData.contact.phone}`);
                if (userData.contact.email) contacts.push(`邮箱：${userData.contact.email}`);
                cardContact.innerHTML = contacts.length > 0 ? 
                    contacts.map(contact => `<div style="margin: 2px 0; font-size: 14px;">${contact}</div>`).join('') :
                    '<div style="color: #999; text-align: center;">请添加联系信息</div>';

                // 名片背景自定义
                const cardBgDiv = document.getElementById('digitalCard').firstElementChild;
                if (userData.cardBgImage) {
                  cardBgDiv.style.background = `url(${userData.cardBgImage}) center/cover`;
                } else if (userData.cardBgColor) {
                  cardBgDiv.style.background = userData.cardBgColor;
                } else {
                  cardBgDiv.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                }
            } catch (error) {
                console.error('更新名片内容时发生错误:', error);
                throw error;
            }
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 点击空白区域关闭模态框
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }

        // 新增：二维码参数解析与完整名片渲染
        function checkCardParam() {
            const urlParams = new URLSearchParams(window.location.search);
            // 优先支持压缩二维码
            if (urlParams.has('cardzip')) {
                try {
                    const b64 = urlParams.get('cardzip');
                    const deflated = Base64.toUint8Array(b64);
                    const json = pako.inflate(deflated, { to: 'string' });
                    const cardData = JSON.parse(json);
                    renderCardPage(cardData);
                    return;
                } catch (e) {
                    alert('二维码内容解析失败');
                }
            }
            // 兼容原有card参数
            if (urlParams.has('card')) {
                let cardData = null;
                try {
                    cardData = JSON.parse(decodeURIComponent(urlParams.get('card')));
                } catch (e) {}
                if (cardData) {
                    renderCardPage(cardData);
                }
            }
        }
        function renderCardPage(cardData) {
            // 隐藏主容器（编辑、操作区等）
            const mainContainer = document.querySelector('.container');
            if (mainContainer) mainContainer.style.display = 'none';
            // 创建名片展示区
            const cardDiv = document.createElement('div');
            cardDiv.style.maxWidth = '414px';
            cardDiv.style.margin = '30px auto';
            cardDiv.style.background = '#fff';
            cardDiv.style.borderRadius = '16px';
            cardDiv.style.boxShadow = '0 2px 12px rgba(0,0,0,0.08)';
            cardDiv.style.overflow = 'hidden';
            cardDiv.innerHTML = `
              <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:40px 20px 30px;text-align:center;color:#333;">
                <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 15px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:30px;color:#999;border:4px solid rgba(255,255,255,0.8);${cardData.avatar?`background-image:url('${cardData.avatar}');background-size:cover;color:transparent;`:''}">
                  ${cardData.avatar?'': '👤'}
                </div>
                <div style="font-size:24px;font-weight:bold;margin-bottom:8px;">${cardData.name||'未命名'}</div>
                <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                  ${(cardData.tags||[]).map(t=>`<span style='background:rgba(255,255,255,0.9);color:#666;padding:4px 12px;border-radius:15px;font-size:12px;'>${t}</span>`).join('')}
                </div>
                <div style="font-size:16px;margin-bottom:15px;">${cardData.slogan||''}</div>
              </div>
              <div style="padding:20px;background:#fff;">
                <div style="font-size:16px;font-weight:bold;margin-bottom:8px;color:#333;">🔗 我的平台</div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;">
                  ${(cardData.platforms||[]).map(p=>`
                    <a href="${p.url||'#'}" target="_blank" style="text-align:center;padding:15px 10px;background:#f8f9fa;border-radius:8px;text-decoration:none;color:#333;display:block;">
                      <div style="width:40px;height:40px;border-radius:8px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:white;background:${p.color||'#667eea'};">${p.icon||'🔗'}</div>
                      <div style="font-size:12px;font-weight:500;">${p.name||''}</div>
                      <div style="font-size:10px;color:#999;">${p.followers||''}</div>
                    </a>
                  `).join('')||'<div style="color:#999;grid-column:1/-1;text-align:center;">暂无平台</div>'}
                </div>
                <div style="font-size:16px;font-weight:bold;margin-bottom:8px;color:#333;">🛍️ 我的产品</div>
                <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:flex-start;">
                  ${(cardData.product||[]).map(item=>`
                    <div style="flex: 1 1 180px; min-width: 160px; max-width: 48%; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 16px; margin-bottom: 8px; display: flex; flex-direction: column; transition: box-shadow 0.2s; border: 1px solid #f0f0f0;">
                        <div style="font-weight: 600; margin-bottom: 8px; font-size: 15px; color: #333;">${item.title || ''}</div>
                        <div style="font-size: 13px; color: #666; margin-bottom: 8px; flex: 1;">${item.description || ''}</div>
                        ${item.stats ? `<div style='font-size: 12px; color: #999; margin-bottom: 8px;'>${item.stats}</div>` : ''}
                        ${item.url ? `<a href="${item.url}" target="_blank" style="font-size: 13px; color: #667eea; text-decoration: underline; align-self: flex-end;">查看产品</a>` : ''}
                    </div>
                  `).join('')||'<div style="color: #999; width: 100%; text-align: center;">暂无产品</div>'}
                </div>
                <div style="font-size:16px;font-weight:bold;margin-bottom:8px;color:#333;">📞 联系我</div>
                <div>
                  ${cardData.contact && (cardData.contact.wechat||cardData.contact.phone||cardData.contact.email) ? [
                    cardData.contact.wechat?`<div style='margin-bottom:8px;font-size:14px;'>微信：${cardData.contact.wechat}</div>`:'',
                    cardData.contact.phone?`<div style='margin-bottom:8px;font-size:14px;'>电话：${cardData.contact.phone}</div>`:'',
                    cardData.contact.email?`<div style='margin-bottom:8px;font-size:14px;'>邮箱：${cardData.contact.email}</div>`:''
                  ].join('') : '<div style="color:#999;text-align:center;">请添加联系信息</div>'}
                </div>
              </div>
            `;
            document.body.appendChild(cardDiv);
            document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }

        function downloadCard() {
            // 尝试使用 html2canvas 截图 digitalCard 区域
            if (window.html2canvas) {
                const cardElement = document.getElementById('digitalCard');
                window.html2canvas(cardElement).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${userData.name || '我'}-数字名片.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    showToast('名片已下载！');
                });
            } else {
                alert('请手动截图保存名片，或引入 html2canvas 库以支持一键下载。');
            }
        }

        function shareCard() {
            const shareUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: `${userData.name}的数字名片`,
                    text: userData.slogan || '查看我的数字名片',
                    url: shareUrl
                });
            } else {
                // 复制链接到剪贴板
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('名片链接已复制到剪贴板！');
                });
            }
        }

        function updateSloganCount() {
            var el = document.getElementById('userSlogan');
            var count = el.value.length;
            if (count > 120) {
                el.value = el.value.slice(0, 120);
                count = 120;
            }
            document.getElementById('sloganCount').textContent = count + '/120';
        }

        function updateBgImageDeleteBtn() {
            const btn = document.getElementById('deleteBgImageBtn');
            if (userData.cardBgImage) {
                btn.style.display = '';
            } else {
                btn.style.display = 'none';
            }
        }

        function deleteCardBgImage() {
            userData.cardBgImage = '';
            document.getElementById('cardBgImageInput').value = '';
            document.getElementById('cardBgImageName').textContent = '';
            document.getElementById('deleteBgImageBtn').style.display = 'none';
            saveData();
            updatePreview();
        }
    </script>
</body>
</html>
