<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份证性别识别器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 35px;
            text-align: center;
            overflow: hidden;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            position: relative;
            padding-bottom: 15px;
        }
        
        h1:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: all 0.3s;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }
        
        input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
        }
        
        input.error {
            border-color: #ff4757;
            animation: shake 0.5s;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #4a6cf7, #2575fc);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(74, 108, 247, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 108, 247, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        
        .result:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, #4a6cf7, #2575fc);
        }
        
        .male {
            background: rgba(74, 108, 247, 0.08);
            color: #4a6cf7;
        }
        
        .female {
            background: rgba(255, 105, 180, 0.08);
            color: #ff69b4;
        }
        
        .gender-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 1s;
        }
        
        .gender-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .fun-fact {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.6;
            animation: fadeIn 1s ease;
        }
        
        .fun-fact i {
            margin-right: 8px;
            color: #ff9f43;
        }
        
        .hint {
            margin-top: 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            input, button {
                padding: 14px;
                font-size: 16px;
            }
            
            .gender-icon {
                font-size: 50px;
            }
            
            .gender-text {
                font-size: 22px;
            }
            
            .fun-fact {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>身份证性别识别器</h1>
        <div class="input-group">
            <input type="text" id="id-input" placeholder="请输入身份证号码后6位" maxlength="6" autocomplete="off">
        </div>
        <button id="check-btn">
            <i class="fas fa-venus-mars"></i> 识别性别
        </button>
        
        <div id="result" class="result">
            <div class="gender-icon" id="gender-icon"></div>
            <div class="gender-text" id="gender-text"></div>
            <div class="fun-fact" id="fun-fact"></div>
        </div>
        
        <div class="hint">
            提示：请输入身份证号码后6位，最后一位可以是数字或字母X
        </div>
        
        <div class="footer">
            <i class="fas fa-lock"></i> 您的输入不会上传到服务器，保护隐私安全
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('id-input');
            const checkBtn = document.getElementById('check-btn');
            const result = document.getElementById('result');
            const genderIcon = document.getElementById('gender-icon');
            const genderText = document.getElementById('gender-text');
            const funFact = document.getElementById('fun-fact');
            
            // 允许的字符：数字和X（大小写均可）
            const allowedChars = /^[0-9Xx]+$/;
            
            // 输入验证
            input.addEventListener('input', function() {
                const value = input.value;
                
                if (value && !allowedChars.test(value)) {
                    // 移除不允许的字符
                    input.value = value.slice(0, -1);
                    input.classList.add('error');
                    setTimeout(() => input.classList.remove('error'), 500);
                }
            });
            
            // 识别性别
            checkBtn.addEventListener('click', function() {
                const idLastSix = input.value.trim();
                
                // 验证输入
                if (!idLastSix || idLastSix.length !== 6) {
                    showError('请输入6位身份证号码');
                    return;
                }
                
                if (!/^\d{5}[\dXx]$/.test(idLastSix)) {
                    showError('格式错误：前5位必须是数字，最后一位可以是数字或X');
                    return;
                }
                
                // 获取第5位数字（索引为4）
                const fifthDigit = parseInt(idLastSix[4]);
                
                // 判断性别
                if (fifthDigit % 2 === 1) {
                    // 奇数 - 男性
                    showResult('male', '男性', '♂');
                    showFunFact('male');
                } else {
                    // 偶数 - 女性
                    showResult('female', '女性', '♀');
                    showFunFact('female');
                }
            });
            
            // 支持按回车键识别
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkBtn.click();
                }
            });
            
            function showResult(gender, text, icon) {
                result.className = 'result ' + gender;
                genderIcon.textContent = icon;
                genderText.textContent = text;
                result.style.display = 'block';
                
                // 滚动到结果区域
                result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            function showError(message) {
                alert(message);
                input.focus();
            }
            
            function showFunFact(gender) {
                // 20条男女相关的趣味知识
                const genderFacts = [
                    "研究表明，男性和女性在解决问题时使用大脑的不同区域。",
                    "女性平均比男性多消耗20%的时间睡眠，但男性更容易进入深度睡眠。",
                    "男性的大脑体积平均比女性大10%左右，但这并不代表智力差异。",
                    "女性拥有比男性更发达的嗅觉和味觉感受器。",
                    "男性在空间认知任务上通常表现更好，而女性在语言任务上更有优势。",
                    "女性的听力通常比男性更敏锐，尤其是在高频率范围内。",
                    "男性产生的睾丸激素是女性的10-20倍，而女性产生的雌激素更多。",
                    "女性平均寿命比男性长5-7年，这在全球大多数国家都成立。",
                    "男性患自闭症的比例是女性的4倍，而女性患抑郁症的比例是男性的2倍。",
                    "女性的免疫系统通常比男性更强，这可能是寿命更长的原因之一。",
                    "男性比女性更容易色盲，大约8%的男性有某种形式的色觉缺陷。",
                    "女性眨眼频率几乎是男性的两倍，这有助于保持眼睛湿润。",
                    "男性的皮肤比女性厚约25%，而且胶原蛋白密度更高。",
                    "女性通常比男性更能忍受疼痛，尤其是在生育过程中。",
                    "男性的大脑主要专注于特定任务，而女性的大脑更适合多任务处理。",
                    "女性的指纹纹路比男性更密集，这使得指纹更加独特。",
                    "男性患心脏病的风险高于女性，尤其是在中年时期。",
                    "女性在味觉测试中通常能识别出更多细微的味道差异。",
                    "男性的代谢率通常比女性高，这意味着他们消耗更多卡路里。",
                    "女性在沟通时更注重情感表达，而男性更注重解决问题。"
                ];
                
                const randomFact = genderFacts[Math.floor(Math.random() * genderFacts.length)];
                
                funFact.innerHTML = `<i class="fas fa-lightbulb"></i> 趣味知识: ${randomFact}`;
            }
        });
    </script>
</body>
</html>
