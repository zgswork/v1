<!DOCTYPE html>

    <style>
        :root {
            --bg-color: #FFF9F9;
            --text-color: #333333;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        h1 {
            color: #FF9AA2;
            font-weight: 300;
            margin-bottom: 10px;
        }
        
        .description {
            color: #888;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .download-btn {
            position: absolute;
            top: 0;
            right: 20px;
            background-color: #FF9AA2;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .download-btn:hover {
            background-color: #FF7F8E;
            transform: translateY(-2px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }
        
        .modal-link {
            display: block;
            margin: 20px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 6px;
            word-break: break-all;
            color: #0066cc;
            text-decoration: none;
        }
        
        .modal-link:hover {
            text-decoration: underline;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            flex: 1;
        }
        
        .color-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--shadow-color);
        }
        
        .color-display {
            height: 120px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .color-info {
            padding: 15px;
        }
        
        .color-name {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .color-code {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .copy-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .copy-btn:active {
            transform: scale(0.95);
        }
        
        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px 0;
            color: #888;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        @media (max-width: 600px) {
            .color-grid {
                grid-template-columns: 1fr;
            }
            
            .color-display {
                height: 100px;
            }
            
            .download-btn {
                position: static;
                margin: 10px auto;
                display: block;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>马卡龙色卡</h1>
        <p class="description">精选柔和甜美的马卡龙色系，点击复制按钮即可获取颜色代码</p>
        <button class="download-btn" id="downloadBtn">下载工具</button>
    </header>
    
    <main>
        <div class="color-grid" id="colorGrid">
            <!-- 颜色卡片将通过JavaScript动态生成 -->
        </div>
    </main>
    
    <footer>
        <div>本工具由叁贰壹制作</div>
        <div>微信 coolman88886666</div>
        <div>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="536b67606161656a63671322227d303c3e">[email&#160;protected]</a></div>
        <div>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="5c2f64686f6e6e6a656c681c3b313d3530723f3331">[email&#160;protected]</a></div>
    </footer>
    
    <div class="toast" id="toast"></div>
    
    <!-- 下载弹窗 -->
    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2>下载工具</h2>
            <p>复制以下夸克网盘链接在浏览器打开可以转存下载工具</p>
            <a href="https://pan.quark.cn/s/7bb27ee59d58" class="modal-link" target="_blank">https://pan.quark.cn/s/7bb27ee59d58</a>
            <p>点击上方链接可直接跳转</p>
        </div>
    </div>
    
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 马卡龙色系数据
        const macaronColors = [
            { name: "樱花粉", hex: "#FFB6C1", rgb: "rgb(255, 182, 193)", hsl: "hsl(350, 100%, 86%)" },
            { name: "薄荷绿", hex: "#98FF98", rgb: "rgb(152, 255, 152)", hsl: "hsl(120, 100%, 80%)" },
            { name: "淡紫", hex: "#D8BFD8", rgb: "rgb(216, 191, 216)", hsl: "hsl(300, 25%, 80%)" },
            { name: "天蓝", hex: "#87CEFA", rgb: "rgb(135, 206, 250)", hsl: "hsl(203, 92%, 75%)" },
            { name: "柠檬黄", hex: "#FFFACD", rgb: "rgb(255, 250, 205)", hsl: "hsl(54, 100%, 90%)" },
            { name: "珊瑚橙", hex: "#FF7F50", rgb: "rgb(255, 127, 80)", hsl: "hsl(16, 100%, 66%)" },
            { name: "薰衣草紫", hex: "#E6E6FA", rgb: "rgb(230, 230, 250)", hsl: "hsl(240, 67%, 94%)" },
            { name: "蜜桃粉", hex: "#FFDAB9", rgb: "rgb(255, 218, 185)", hsl: "hsl(28, 100%, 86%)" },
            { name: "湖水蓝", hex: "#AFEEEE", rgb: "rgb(175, 238, 238)", hsl: "hsl(180, 65%, 81%)" },
            { name: "香芋紫", hex: "#DDA0DD", rgb: "rgb(221, 160, 221)", hsl: "hsl(300, 48%, 75%)" },
            { name: "奶油黄", hex: "#FFF8DC", rgb: "rgb(255, 248, 220)", hsl: "hsl(48, 100%, 93%)" },
            { name: "淡绿", hex: "#E0F7E0", rgb: "rgb(224, 247, 224)", hsl: "hsl(120, 56%, 92%)" },
            { name: "玫瑰粉", hex: "#FFE4E1", rgb: "rgb(255, 228, 225)", hsl: "hsl(6, 100%, 94%)" },
            { name: "淡蓝", hex: "#E0F7FF", rgb: "rgb(224, 247, 255)", hsl: "hsl(195, 100%, 94%)" },
            { name: "淡橙", hex: "#FFE5B4", rgb: "rgb(255, 229, 180)", hsl: "hsl(39, 100%, 85%)" },
            { name: "淡青", hex: "#D4F1F9", rgb: "rgb(212, 241, 249)", hsl: "hsl(193, 76%, 90%)" }
        ];
        
        // 获取DOM元素
        const colorGrid = document.getElementById('colorGrid');
        const toast = document.getElementById('toast');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        const modalClose = document.getElementById('modalClose');
        
        // 生成颜色卡片
        function generateColorCards() {
            colorGrid.innerHTML = '';
            
            macaronColors.forEach(color => {
                const card = document.createElement('div');
                card.className = 'color-card';
                
                card.innerHTML = `
                    <div class="color-display" style="background-color: ${color.hex};"></div>
                    <div class="color-info">
                        <div class="color-name">${color.name}</div>
                        <div class="color-code">
                            <div class="code-item">
                                <span>HEX</span>
                                <span>${color.hex}</span>
                                <button class="copy-btn" data-value="${color.hex}">复制</button>
                            </div>
                            <div class="code-item">
                                <span>RGB</span>
                                <span>${color.rgb}</span>
                                <button class="copy-btn" data-value="${color.rgb}">复制</button>
                            </div>
                            <div class="code-item">
                                <span>HSL</span>
                                <span>${color.hsl}</span>
                                <button class="copy-btn" data-value="${color.hsl}">复制</button>
                            </div>
                        </div>
                    </div>
                `;
                
                colorGrid.appendChild(card);
            });
            
            // 添加复制按钮事件监听
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    copyToClipboard(value);
                    showToast(`已复制 ${value}`);
                });
            });
        }
        
        // 复制到剪贴板
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }
        
        // 显示Toast提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // 显示下载弹窗
        function showDownloadModal() {
            downloadModal.style.display = 'flex';
        }
        
        // 隐藏下载弹窗
        function hideDownloadModal() {
            downloadModal.style.display = 'none';
        }
        
        // 初始化
        generateColorCards();
        
        // 添加事件监听
        downloadBtn.addEventListener('click', showDownloadModal);
        modalClose.addEventListener('click', hideDownloadModal);
        downloadModal.addEventListener('click', function(e) {
            if (e.target === downloadModal) {
                hideDownloadModal();
            }
        });
    </script>
</body>
</html>
