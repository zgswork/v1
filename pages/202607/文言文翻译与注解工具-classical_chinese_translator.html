<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文言文翻译与注解工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .input-area {
            position: relative;
        }

        #classicalText {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s;
        }

        #classicalText:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn-voice {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-voice:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-voice:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .voice-settings {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-left: 20px;
        }

        .voice-setting {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .voice-setting input[type="range"] {
            width: 80px;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            .controls {
                justify-content: center;
            }
            .voice-settings {
                margin-left: 0;
                margin-top: 10px;
            }
        }

        .result-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }

        .result-section h4 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            line-height: 1.8;
            font-size: 16px;
            border: 1px solid #e9ecef;
        }

        .annotation-item {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #28a745;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .annotation-word {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .annotation-meaning {
            margin: 8px 0;
            color: #333;
        }

        .annotation-example {
            font-size: 14px;
            color: #6c757d;
            font-style: italic;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
            animation: highlight 1s ease-in-out;
        }

        @keyframes highlight {
            0% { background-color: #fff3cd; }
            50% { background-color: #ffeaa7; }
            100% { background-color: #fff3cd; }
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        .footer p {
            margin: 5px 0;
        }

        .wechat {
            color: #1abc9c;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 文言文翻译与注解工具</h1>
            <p>传承古典文化，让文言文触手可及</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h3>📝 请输入文言文文本：</h3>
                <div class="input-area">
                    <textarea id="classicalText" placeholder="请在此输入文言文，例如：学而时习之，不亦说乎？"></textarea>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="translateText()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
                    </svg>
                    开始翻译
                </button>
                
                <button class="btn btn-secondary" onclick="clearAll()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                    清空
                </button>

                <div class="voice-controls">
                    <button class="btn btn-voice" id="speakOriginal" onclick="speakText('original')" disabled>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        朗读原文
                    </button>
                    
                    <button class="btn btn-voice" id="speakTranslation" onclick="speakText('translation')" disabled>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        朗读译文
                    </button>
                    
                    <button class="btn btn-secondary" id="stopSpeaking" onclick="stopSpeaking()" disabled>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M6 6h12v12H6z"/>
                        </svg>
                        停止
                    </button>
                </div>

                <div class="voice-settings">
                    <div class="voice-setting">
                        <label>语速:</label>
                        <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1">
                        <span id="rateValue">1.0</span>
                    </div>
                    <div class="voice-setting">
                        <label>音调:</label>
                        <input type="range" id="speechPitch" min="0.5" max="2" step="0.1" value="1">
                        <span id="pitchValue">1.0</span>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在翻译中，请稍候...</p>
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="result-section">
                    <h4>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
                        </svg>
                        现代汉语翻译
                    </h4>
                    <div class="result-content" id="translationResult"></div>
                </div>

                <div class="result-section">
                    <h4>
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        词汇注解
                    </h4>
                    <div class="result-content" id="annotationResult"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>📱 有任何问题或建议，欢迎联系作者</p>
        <p>微信号：<span class="wechat">xd135341</span></p>
        <p>© 2024 文言文翻译工具 - 让古典文化重焕生机</p>
    </div>

    <script>
        // 文言文词典数据库
        const dictionary = {
            "之": {
                meanings: ["的", "去", "它", "这"],
                types: ["助词", "动词", "代词"],
                examples: ["学而时习之", "送孟浩然之广陵"]
            },
            "而": {
                meanings: ["而且", "但是", "如果"],
                types: ["连词"],
                examples: ["学而时习之", "人不知而不愠"]
            },
            "时": {
                meanings: ["时常", "按时", "时候"],
                types: ["副词", "名词"],
                examples: ["学而时习之", "时不我待"]
            },
            "习": {
                meanings: ["练习", "学习", "复习"],
                types: ["动词"],
                examples: ["学而时习之", "习以为常"]
            },
            "不": {
                meanings: ["不", "没有"],
                types: ["副词"],
                examples: ["不亦说乎", "人不知而不愠"]
            },
            "亦": {
                meanings: ["也", "同样"],
                types: ["副词"],
                examples: ["不亦说乎", "亦步亦趋"]
            },
            "说": {
                meanings: ["高兴", "喜悦"],
                types: ["形容词"],
                examples: ["不亦说乎", "说说而笑"]
            },
            "乎": {
                meanings: ["吗", "呢"],
                types: ["语气词"],
                examples: ["不亦说乎", "学而时习之，不亦说乎"]
            },
            "学": {
                meanings: ["学习", "学问"],
                types: ["动词", "名词"],
                examples: ["学而时习之", "博学而笃行"]
            },
            "人": {
                meanings: ["人", "别人"],
                types: ["名词"],
                examples: ["人不知而不愠", "人之初，性本善"]
            },
            "知": {
                meanings: ["知道", "了解"],
                types: ["动词"],
                examples: ["人不知而不愠", "知之为知之"]
            },
            "愠": {
                meanings: ["生气", "愤怒"],
                types: ["动词"],
                examples: ["人不知而不愠", "愠而不发"]
            },
            "君": {
                meanings: ["君主", "您"],
                types: ["名词", "敬称"],
                examples: ["君子不器", "君临天下"]
            },
            "子": {
                meanings: ["先生", "您", "儿子"],
                types: ["敬称", "名词"],
                examples: ["君子不器", "有朋自远方来"]
            },
            "也": {
                meanings: ["啊", "呢"],
                types: ["语气词"],
                examples: ["不亦君子乎", "学而时习之，不亦说乎"]
            },
            "有": {
                meanings: ["有", "存在"],
                types: ["动词"],
                examples: ["有朋自远方来", "有教无类"]
            },
            "朋": {
                meanings: ["朋友"],
                types: ["名词"],
                examples: ["有朋自远方来", "朋友满天下"]
            },
            "自": {
                meanings: ["从", "自己"],
                types: ["介词", "代词"],
                examples: ["有朋自远方来", "自强不息"]
            },
            "远": {
                meanings: ["远", "遥远"],
                types: ["形容词"],
                examples: ["有朋自远方来", "远近闻名"]
            },
            "方": {
                meanings: ["地方", "方向"],
                types: ["名词"],
                examples: ["有朋自远方来", "四面八方"]
            },
            "来": {
                meanings: ["来", "到来"],
                types: ["动词"],
                examples: ["有朋自远方来", "来日方长"]
            }
        };

        // 语法规则
        const grammarRules = [
            {
                pattern: /(.+)者(.+)也/g,
                translation: "$1是$2",
                explanation: "判断句式：...者...也"
            },
            {
                pattern: /(.+)，不亦(.+)乎/g,
                translation: "$1，不也是很$2吗",
                explanation: "反问句式：不亦...乎"
            },
            {
                pattern: /有(.+)自(.+)来/g,
                translation: "有$1从$2来",
                explanation: "存在句式：有...自...来"
            },
            {
                pattern: /(.+)而(.+)/g,
                translation: "$1并且$2",
                explanation: "并列句式：...而..."
            }
        ];

        // 语音相关变量
        let currentUtterance = null;
        let speechSupported = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeSpeech();
            setupVoiceControls();
        });

        // 初始化语音功能
        function initializeSpeech() {
            if ('speechSynthesis' in window) {
                speechSupported = true;
                console.log('语音合成功能已启用');
            } else {
                speechSupported = false;
                console.log('浏览器不支持语音合成功能');
                // 禁用语音按钮
                document.querySelectorAll('.btn-voice').forEach(btn => {
                    btn.disabled = true;
                    btn.title = '您的浏览器不支持语音功能';
                });
            }
        }

        // 设置语音控制
        function setupVoiceControls() {
            const rateSlider = document.getElementById('speechRate');
            const pitchSlider = document.getElementById('speechPitch');
            const rateValue = document.getElementById('rateValue');
            const pitchValue = document.getElementById('pitchValue');

            rateSlider.addEventListener('input', function() {
                rateValue.textContent = this.value;
            });

            pitchSlider.addEventListener('input', function() {
                pitchValue.textContent = this.value;
            });
        }

        // 翻译文本
        function translateText() {
            const input = document.getElementById('classicalText').value.trim();
            if (!input) {
                alert('请输入文言文文本');
                return;
            }

            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            // 模拟翻译过程
            setTimeout(() => {
                const translation = performTranslation(input);
                const annotations = generateAnnotations(input);

                displayResults(translation, annotations);
                
                // 启用语音按钮
                if (speechSupported) {
                    document.getElementById('speakOriginal').disabled = false;
                    document.getElementById('speakTranslation').disabled = false;
                }

                // 隐藏加载状态，显示结果
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').style.display = 'grid';
            }, 1000);
        }

        // 执行翻译
        function performTranslation(text) {
            let translation = text;

            // 应用语法规则
            grammarRules.forEach(rule => {
                translation = translation.replace(rule.pattern, rule.translation);
            });

            // 词汇替换
            for (let word in dictionary) {
                const meanings = dictionary[word].meanings;
                if (meanings.length > 0) {
                    const regex = new RegExp(word, 'g');
                    translation = translation.replace(regex, meanings[0]);
                }
            }

            // 如果没有明显变化，提供基础翻译
            if (translation === text) {
                translation = provideBasicTranslation(text);
            }

            return translation;
        }

        // 基础翻译（针对常见句子）
        function provideBasicTranslation(text) {
            const commonTranslations = {
                "学而时习之，不亦说乎": "学习并且时常复习，不也是很快乐的事情吗？",
                "有朋自远方来，不亦乐乎": "有朋友从远方来，不也是很快乐的事情吗？",
                "人不知而不愠，不亦君子乎": "别人不了解自己而不生气，不也是君子的表现吗？",
                "温故而知新": "温习旧的知识而获得新的理解",
                "知之为知之，不知为不知": "知道就是知道，不知道就是不知道",
                "三人行，必有我师焉": "三个人一起走，其中必定有我的老师"
            };

            return commonTranslations[text] || `${text}（暂无完整翻译，请参考词汇注解）`;
        }

        // 生成注解
        function generateAnnotations(text) {
            const annotations = [];
            const processedWords = new Set();

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (dictionary[char] && !processedWords.has(char)) {
                    annotations.push({
                        word: char,
                        meanings: dictionary[char].meanings,
                        types: dictionary[char].types,
                        examples: dictionary[char].examples
                    });
                    processedWords.add(char);
                }
            }

            return annotations;
        }

        // 显示结果
        function displayResults(translation, annotations) {
            // 显示翻译结果
            document.getElementById('translationResult').innerHTML = translation;

            // 显示注解
            const annotationHtml = annotations.map(annotation => `
                <div class="annotation-item">
                    <div class="annotation-word">${annotation.word}</div>
                    <div class="annotation-meaning">
                        <strong>释义：</strong>${annotation.meanings.join('、')}
                    </div>
                    <div class="annotation-meaning">
                        <strong>词性：</strong>${annotation.types.join('、')}
                    </div>
                    <div class="annotation-example">
                        <strong>例句：</strong>${annotation.examples.join('；')}
                    </div>
                </div>
            `).join('');

            document.getElementById('annotationResult').innerHTML = 
                annotationHtml || '<p style="color: #6c757d; text-align: center;">暂无词汇注解</p>';
        }

        // 语音朗读
        function speakText(type) {
            if (!speechSupported) {
                alert('您的浏览器不支持语音功能');
                return;
            }

            // 停止当前朗读
            if (currentUtterance) {
                speechSynthesis.cancel();
            }

            let textToSpeak = '';
            let targetElement = null;

            if (type === 'original') {
                textToSpeak = document.getElementById('classicalText').value.trim();
                targetElement = document.getElementById('classicalText');
            } else if (type === 'translation') {
                textToSpeak = document.getElementById('translationResult').textContent.trim();
                targetElement = document.getElementById('translationResult');
            }

            if (!textToSpeak) {
                alert('没有可朗读的内容');
                return;
            }

            // 创建语音合成实例
            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            currentUtterance.lang = 'zh-CN';
            currentUtterance.rate = parseFloat(document.getElementById('speechRate').value);
            currentUtterance.pitch = parseFloat(document.getElementById('speechPitch').value);

            // 朗读开始时的处理
            currentUtterance.onstart = function() {
                document.getElementById('stopSpeaking').disabled = false;
                if (targetElement) {
                    targetElement.classList.add('highlight');
                }
            };

            // 朗读结束时的处理
            currentUtterance.onend = function() {
                document.getElementById('stopSpeaking').disabled = true;
                if (targetElement) {
                    targetElement.classList.remove('highlight');
                }
                currentUtterance = null;
            };

            // 朗读错误时的处理
            currentUtterance.onerror = function(event) {
                console.error('语音合成错误:', event.error);
                document.getElementById('stopSpeaking').disabled = true;
                if (targetElement) {
                    targetElement.classList.remove('highlight');
                }
                currentUtterance = null;
            };

            // 开始朗读
            speechSynthesis.speak(currentUtterance);
        }

        // 停止朗读
        function stopSpeaking() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
            document.getElementById('stopSpeaking').disabled = true;
            
            // 移除高亮
            document.querySelectorAll('.highlight').forEach(el => {
                el.classList.remove('highlight');
            });
            
            currentUtterance = null;
        }

        // 清空所有内容
        function clearAll() {
            document.getElementById('classicalText').value = '';
            document.getElementById('results').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            
            // 停止朗读
            stopSpeaking();
            
            // 禁用语音按钮
            document.getElementById('speakOriginal').disabled = true;
            document.getElementById('speakTranslation').disabled = true;
        }

        // 页面卸载时停止语音
        window.addEventListener('beforeunload', function() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
