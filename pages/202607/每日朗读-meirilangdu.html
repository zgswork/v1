<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日朗读</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色（浅色七彩纯色） -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            reading: {
              red: '#FFEEEE',
              orange: '#FFF3E0',
              yellow: '#FFFDE7',
              green: '#E8F5E9',
              blue: '#E3F2FD',
              indigo: '#E8EAF6',
              purple: '#F3E5F5'
            },
            contentBtn: {
              primary: '#4F86F7',
              secondary: '#F0F4FF',
              hover: '#3A70E0'
            }
          }
        }
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-shadow {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .btn-hover {
        @apply transition-all duration-300 hover:scale-105 hover:shadow-lg;
      }
      .text-container {
        @apply bg-white/90 backdrop-blur-sm rounded-xl p-6 content-shadow min-h-[300px] w-full;
      }
      .control-btn {
        @apply w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center text-xl btn-hover;
      }
      .audio-btn {
        @apply w-14 h-14 rounded-full flex items-center justify-center text-2xl btn-hover mx-2;
      }
      .notification {
        @apply fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50;
      }
      .notification.show {
        @apply opacity-100;
      }
      .recording-indicator {
        @apply w-3 h-3 rounded-full bg-red-500 inline-block animate-pulse mx-2;
      }
    }
  </style>
</head>
<body class="bg-reading-blue min-h-screen transition-colors duration-500 flex flex-col">
  <!-- 通知提示 -->
  <div id="notification" class="notification">操作成功！</div>
  
  <div class="container mx-auto px-4 py-6 flex-grow">
    <!-- 页面标题和日期 -->
    <header class="text-center mb-6">
      <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-2">每日朗读</h1>
      <p id="currentDate" class="text-[clamp(1rem,3vw,1.2rem)] text-gray-700 font-medium"></p>
    </header>
    
    <!-- 内容选择区 -->
    <div class="max-w-2xl mx-auto mb-6">
      <div class="bg-white/80 backdrop-blur-sm rounded-xl p-4 content-shadow">
        <label class="block text-gray-700 mb-2 font-medium">选择内容:</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <button class="content-btn bg-contentBtn-primary text-white p-2 rounded-lg transition-colors shadow btn-hover" data-action="today">今日内容</button>
          <button class="content-btn bg-contentBtn-secondary text-gray-800 p-2 rounded-lg transition-colors shadow btn-hover hover:bg-contentBtn-primary/20" data-action="random">随机内容</button>
          <button class="content-btn bg-contentBtn-secondary text-gray-800 p-2 rounded-lg transition-colors shadow btn-hover hover:bg-contentBtn-primary/20" data-action="clear">清空内容</button>
          <button class="content-btn bg-contentBtn-secondary text-gray-800 p-2 rounded-lg transition-colors shadow btn-hover hover:bg-contentBtn-primary/20" data-action="save">保存编辑</button>
        </div>
      </div>
    </div>
    
    <!-- 主要内容区 - 朗读文本 -->
    <main class="mb-8 max-w-2xl mx-auto">
      <div class="text-container">
        <textarea id="readingContent" class="w-full h-full min-h-[300px] bg-transparent border-none focus:outline-none text-gray-800 text-[clamp(1rem,3vw,1.2rem)] leading-relaxed resize-none" placeholder="请输入或选择朗读内容..."></textarea>
      </div>
    </main>
    
    <!-- 录音和播放控制区 -->
    <div class="max-w-2xl mx-auto mb-8 text-center">
      <h3 class="text-center text-gray-700 mb-4">朗读录音</h3>
      <div class="flex justify-center items-center">
        <button id="recordBtn" class="audio-btn bg-red-100 text-red-600 hover:bg-red-200" title="开始录音">
          <i class="fa fa-microphone"></i>
        </button>
        <button id="stopRecordBtn" class="audio-btn bg-gray-100 text-gray-600 hover:bg-gray-200 hidden" title="停止录音">
          <i class="fa fa-stop"></i>
        </button>
        <button id="playBtn" class="audio-btn bg-green-100 text-green-600 hover:bg-green-200" title="播放录音" disabled>
          <i class="fa fa-play"></i>
        </button>
        <button id="pauseBtn" class="audio-btn bg-yellow-100 text-yellow-600 hover:bg-yellow-200 hidden" title="暂停播放">
          <i class="fa fa-pause"></i>
        </button>
        <span id="recordingStatus" class="hidden"><span class="recording-indicator"></span>正在录音...</span>
      </div>
      
      <!-- 音频播放器 -->
      <div id="audioPlayerContainer" class="mt-4 hidden">
        <audio id="audioPlayer" controls class="w-full max-w-lg mx-auto bg-white/80 rounded-lg p-2">
          您的浏览器不支持音频播放
        </audio>
      </div>
      
      <!-- 录音时长显示 -->
      <div id="recordingTime" class="mt-2 text-gray-600 text-sm hidden">
        录音时长: <span id="timeDisplay">00:00</span>
      </div>
    </div>
    
    <!-- 颜色选择器 -->
    <div class="mb-10">
      <h3 class="text-center text-gray-700 mb-3">选择背景颜色</h3>
      <div class="flex justify-center gap-3 flex-wrap">
        <button class="w-8 h-8 rounded-full bg-reading-red color-btn" data-color="bg-reading-red" title="红色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-orange color-btn" data-color="bg-reading-orange" title="橙色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-yellow color-btn" data-color="bg-reading-yellow" title="黄色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-green color-btn" data-color="bg-reading-green" title="绿色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-blue color-btn ring-4 ring-gray-300 scale-110" data-color="bg-reading-blue" title="蓝色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-indigo color-btn" data-color="bg-reading-indigo" title="靛蓝色"></button>
        <button class="w-8 h-8 rounded-full bg-reading-purple color-btn" data-color="bg-reading-purple" title="紫色"></button>
      </div>
    </div>
    
    <!-- 页脚备注信息 -->
    <footer class="text-center text-gray-700 text-sm mt-auto pb-6">
      <p class="mb-1">本工具由 @邓文涛 制作</p>
      <p class="mb-1">微信：707547441</p>
      <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="b98e898e8c8d8e8d8d88f9c8c897dad6d4">[email&#160;protected]</a></p>
    </footer>
  </div>
  
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // 优化后的内容库，每条111-200字
    const positiveContents = [
      "生活的本质不在于索取而在于给予，不在于拥有而在于体验。我们常常在追逐目标时忽略沿途风景，在渴望完美中错过当下圆满。真正的智慧，是在喧嚣中保持清醒，在浮躁中坚守内心。与不完美和解，与不确定性共处，才能发现生活本真的美好。每一个瞬间都值得珍惜，因为生命的意义就蕴含在这些看似平凡的时刻里。",
      "内心的平静并非来自外界安稳，而是源于对自我的深刻认知与接纳。我们总以为幸福在远方，却忽略了它就在此刻。专注于呼吸的节奏，感受心跳的力量，留意身边人的笑容，你会发现幸福从未远离。真正的强大不是没有软弱，而是在软弱中依然前行；不是没有迷茫，而是在迷茫中保持探索。",
      "时间是最公平的资源，不会为任何人停留，却因使用方式呈现不同价值。我们无法延长生命长度，但可以拓展其宽度与深度。把时间花在有意义的事上、值得的人身上、自我提升上，时间便会回馈成长与充实。不必羡慕他人成就，不知其付出多少；不必焦虑现状，每步踏实前行都在为未来积蓄力量。",
      "真正的自由并非随心所欲，而是掌控自己的思想与行为。能在情绪激动时保持冷静，诱惑面前坚守原则，困境之中保持希望，便获得了内心自由。这种自由不依赖外界，不依附他人评价，源于自我意识觉醒与内心力量。人生道路上总有限制与挑战，但无法阻挡拥有自由灵魂的人追求理想。",
      "感恩是一种生活态度与人生智慧。它并非忽视困难与痛苦，而是教会我们在不完美中寻找美好，在挫折中发现成长。感恩清晨阳光带来光明，夜晚星空给予宁静，身边每个人以不同方式丰富我们的生命。当感恩成为习惯，你会发现值得珍惜的事物如此之多，抱怨与不满会被满足与喜悦取代。",
      "成长往往伴随阵痛与不适，如同破茧成蝶需经历挣扎与蜕变。我们害怕改变因畏惧未知，抗拒成长因留恋舒适。然而生命本质是不断变化与发展，拒绝成长实则拒绝生命的可能性。每一次挑战都是成长契机，每一次困难都是蜕变前奏。不必怕跌倒，站起来会让你更强；不必惧未知，探索会让你更智慧。",
      "真正的幸福并非来自物质积累，而是源于内心丰盈。我们常在追求更多中迷失方向，在比较竞争中忘记生活本真。静下心来会发现，幸福很简单：一本好书，一次深谈，一次与自然接触，甚至片刻宁静思考。这些微小时刻能带来真正满足。幸福不是遥远目标，而是当下可体验的状态。",
      "生命中最珍贵的不是物质，而是经历的时光与情感。人们追求永恒，却忽略美好事物皆有生命周期。花开花落，月圆月缺，四季更迭，这些告诉我们变化才是永恒。与其执着留住什么，不如珍惜当下拥有；与其为逝去惋惜，不如带着回忆前行。每一瞬间都独一无二，共同构成我们丰富的生命故事。",
      "真正的智慧不在于懂得所有答案，而在于保持提问勇气；不在于避免犯错，而在于从错误学习；不在于拥有完美人生，而在于接纳其不完美。智者明白世界复杂、真理多元，故保持开放心态，尊重不同观点，拓展认知边界。他们不追求绝对正确，而求不断进步。",
      "人际关系的本质是相互理解与支持，而非索取与控制。我们常希望他人符合自己期待，却忽略每个人都是独立个体，有自己的思想感受。真正健康的关系，是尊重差异，接纳不完美，在给予中获得满足，在理解中增进感情。不必刻意讨好谁，真诚才是关系基石。",
      "行动是治愈焦虑的最好方式。我们常因想太多、做太少而不安迷茫。与其徘徊犹豫，不如勇敢迈出第一步；与其担心失败后果，不如专注当下努力。很多时候，困难并非如想象可怕，是恐惧放大了难度。每一个微小行动都在积累解决问题的力量；每一次勇敢尝试都在创造突破自我的可能。",
      "自我接纳是心理健康的基础，也是幸福的起点。我们常对自己过于苛刻，放大缺点，忽视优点，在比较中失去自信。然而每个人都独一无二，有自己的价值与意义。接纳不完美并非放弃成长，而是认清真实自己后依然选择爱自己、支持自己。当你能坦然面对缺点，欣赏优点，就会获得内心平静与力量。",
      "真正的成功并非超越他人，而是超越过去的自己。我们生活在充满比较的社会，易陷入与他人竞争，忘记自己的节奏与方向。然而每个人起点、经历、追求不同，盲目比较只会带来焦虑与挫败。成功定义应由自己书写，而非他人标准衡量。找到自己节奏，专注自身成长，就是对成功最好的诠释。",
      "耐心是一种美德与智慧。在追求快速回报的时代，我们常缺乏等待耐心，渴望立竿见影。然而很多有价值的事物需要时间沉淀：大树成长需数年，技能掌握需练习，关系建立需经营，理想实现需坚持。耐心不是消极等待，而是积极坚持；不是被动接受，而是主动积蓄。",
      "勇气不是没有恐惧，而是带着恐惧依然前行。每个人都会害怕失败、未知与被拒绝，这些恐惧都正常。真正的勇敢者并非无所畏惧，而是能正视恐惧，在其面前依然行动。勇气不是一瞬间冲动，而是深思熟虑后的决断；不是鲁莽冒险，而是有准备的尝试。生命的精彩往往发生在走出舒适区的时刻。",
      "活在当下是一种能力与智慧。我们常沉浸在对过去的懊悔或对未来的担忧中，却忽略唯一能把握的当下。过去无法改变，未来尚未到来，只有现在才是真实可把握的。活在当下不是放弃规划未来，而是专注现在的同时为未来做准备；不是忘记过去，而是从过去学习，更好面对现在。",
      "善良是一种选择与力量。在复杂世界中保持善良并非天真，而是深思熟虑后的选择。善良不需要壮举，体现在日常点滴：真诚微笑，温暖话语，及时帮助，理解包容。善良不仅给他人温暖希望，也让自己内心安宁满足。它如同种子，播撒后终会收获更多善意。",
      "学习是终身事业，也是保持生命活力的源泉。在快速变化的时代，知识更新，技能迭代，停止学习意味着落后。学习不仅为获取知识技能，更是为拓展认知，培养思维，丰富精神世界。学习方式很多：阅读，交流，实践，反思，每种方式都能带来成长。保持好奇心与求知欲，让学习成为习惯。",
      "宽恕是一种解脱，不仅宽恕他人，更是宽恕自己。我们常因他人过错耿耿于怀，让怨恨占据内心，殊不知伤害最深的是自己。宽恕不是忘记发生的事，也不是纵容错误，而是放下怨恨执念，不再让过去影响现在生活。宽恕他人能释放自己；宽恕自己能接纳过去不完美。",
      "简单是一种生活态度与人生境界。在物质丰富时代，我们常被欲望驱使，追求更多拥有，结果被物质所累，失去内心平静。简单生活不是过清贫日子，而是分清主次，取舍有度，专注真正重要的事物。减少不必要物质追求，增加精神滋养；减少无效社交，增加有质量独处。",
      "健康是人生最宝贵的财富，没有健康，一切都无从谈起。我们常在追求事业、财富、成就时忽视身体需求，透支健康资本。然而健康如同空气，拥有时不觉珍贵，失去才知重要。维护健康不需要惊天动地的努力，而在日常点滴：均衡饮食，充足睡眠，适度运动，良好心态。",
      "梦想是人生的指南针，指引前进方向，给予前行动力。无论梦想多遥远不切实际，都有其存在价值。梦想不是用来实现的，而是指引方向；不是要达到的终点，而是激发潜能的动力。拥有梦想的人，困境中能看到希望，黑暗中能找到光明。实现梦想的道路充满挑战，正是这些困难让其实现更有意义。",
      "反思是成长的催化剂，能让我们从经历中汲取智慧，从错误中学习经验。我们常忙于前行，却很少停下来回顾思考，结果在同地反复跌倒，在同题上不断困惑。反思不是沉溺过去错误自责，而是客观分析原因，总结经验，避免重蹈覆辙；不是对过去选择后悔，而是从中学习，更好面对未来选择。",
      "专注是效率的源泉，也是成就的基石。在信息爆炸、干扰不断的时代，保持专注越来越困难，也越来越重要。专注不是同时做多件事，而是一次只做一件事，全神贯注，心无旁骛。当我们专注当下任务，能提高效率，提升质量，体验更深层次满足感。培养专注力可以从小事做起。",
      "感恩不仅是一种情感，更是一种生活方式。它让我们在平凡中发现不凡，在困境中找到希望，在失去中看到拥有。感恩父母养育，朋友陪伴，陌生人善意，大自然馈赠，甚至生活中的挑战挫折，因为它们都在促进我们成长。感恩不需要华丽辞藻，只需要真诚心意。",
      "真正的友谊不在于朝夕相处，而在于心灵相通；不在于锦上添花，而在于雪中送炭；不在于索取，而在于付出。朋友是自己选择的家人，是人生道路同行者，是困境支持者，是喜悦分享者。好的友谊能滋养心灵，促进成长，带来力量。珍惜那些理解你、支持你、批评你的真朋友。",
      "逆境是成长的试金石，考验意志，锻炼能力，揭示潜能。人生不可能一帆风顺，困难挫折是常态而非例外。面对逆境，不同态度导致不同结果：逃避让人停滞，抱怨让人消极，勇敢面对让人成长。逆境如同磨刀石，让人更锋利；如同炼金炉，去除杂质，显露真金。每一次克服困难都是自我超越。",
      "自律是自由的前提，想要获得真正自由，必须先学会自律。我们常将自律与约束、痛苦联系，却忽略它是通往自由的必经之路。通过自律，我们可以摆脱坏习惯控制，获得健康自由；积累知识技能，获得选择自由；管理时间精力，获得掌控人生的自由。培养自律可以从建立小习惯开始。",
      "好奇心是学习的动力，也是创新的源泉。它让人对世界保持开放态度，对未知保持探索热情，对生活保持新鲜感觉。随着年龄增长，我们常失去儿时好奇心，对周围事物习以为常，对新知识不再渴求，这其实是隐性衰老。保持好奇心就是保持年轻心态；保持探索欲就是保持生命活力。",
      "倾听是沟通的艺术，也是理解的前提。我们常急于表达自己观点，却忽略倾听他人声音；忙于准备回应，却错过对方真正想表达的内容。真正的倾听不仅是听到话语，更是理解话语背后的情感与需求；不仅是保持沉默，更是通过肢体语言和回应表达尊重与关注。",
      "适度的独处是自我反思与充电的必要方式。在喧嚣世界中，我们常被各种声音和事务包围，很少有机会与自己对话，倾听内心声音。独处不是孤独或逃避，而是给自己安静空间，整理思绪，澄清想法，恢复能量。在独处中，我们能更好了解自己，明确需求与方向。",

    // 获取DOM元素
    const bodyElement = document.body;
    const currentDateElement = document.getElementById('currentDate');
    const readingContentElement = document.getElementById('readingContent');
    const colorButtons = document.querySelectorAll('.color-btn');
    const contentButtons = document.querySelectorAll('.content-btn');
    const notification = document.getElementById('notification');
    
    // 录音相关元素
    const recordBtn = document.getElementById('recordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioPlayerContainer = document.getElementById('audioPlayerContainer');
    const recordingStatus = document.getElementById('recordingStatus');
    const recordingTime = document.getElementById('recordingTime');
    const timeDisplay = document.getElementById('timeDisplay');
    
    // 录音相关变量
    let mediaRecorder;
    let audioChunks = [];
    let stream;
    let recordingSeconds = 0;
    let recordingTimer;
    let isRecording = false;
    let isPlaying = false;
    
    // 设置当前日期
    function setCurrentDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
    }
    
    // 更改背景颜色
    function changeBackgroundColor(colorClass) {
      // 移除所有颜色类
      const colors = ['bg-reading-red', 'bg-reading-orange', 'bg-reading-yellow', 
                      'bg-reading-green', 'bg-reading-blue', 'bg-reading-indigo', 'bg-reading-purple'];
      colors.forEach(color => {
        bodyElement.classList.remove(color);
      });
      
      // 添加选中的颜色类
      bodyElement.classList.add(colorClass);
      
      // 更新按钮选中状态
      colorButtons.forEach(btn => {
        btn.classList.remove('ring-4', 'ring-gray-300', 'scale-110');
      });
      const selectedBtn = document.querySelector(`.color-btn[data-color="${colorClass}"]`);
      if (selectedBtn) {
        selectedBtn.classList.add('ring-4', 'ring-gray-300', 'scale-110');
      }
      
      // 保存用户颜色偏好
      localStorage.setItem('preferredColor', colorClass);
      showNotification('背景颜色已更新');
    }
    
    // 显示通知
    function showNotification(message) {
      notification.textContent = message;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 2000);
    }
    
    // 开始录音
    async function startRecording() {
      try {
        // 请求麦克风权限
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.addEventListener('dataavailable', event => {
          audioChunks.push(event.data);
        });
        
        mediaRecorder.addEventListener('stop', () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const audioUrl = URL.createObjectURL(audioBlob);
          audioPlayer.src = audioUrl;
          playBtn.disabled = false;
          audioPlayerContainer.classList.remove('hidden');
        });
        
        mediaRecorder.start();
        isRecording = true;
        
        // 更新UI
        recordBtn.classList.add('hidden');
        stopRecordBtn.classList.remove('hidden');
        recordingStatus.classList.remove('hidden');
        recordingTime.classList.remove('hidden');
        
        // 开始计时
        recordingSeconds = 0;
        updateRecordingTime();
        recordingTimer = setInterval(updateRecordingTime, 1000);
        
        showNotification('开始录音...');
      } catch (error) {
        console.error('录音失败:', error);
        showNotification('录音失败，请确保已授予麦克风权限');
      }
    }
    
    // 停止录音
    function stopRecording() {
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        
        // 停止计时
        clearInterval(recordingTimer);
        
        // 更新UI
        recordBtn.classList.remove('hidden');
        stopRecordBtn.classList.add('hidden');
        recordingStatus.classList.add('hidden');
        
        showNotification('录音已保存');
      }
    }
    
    // 更新录音时间显示
    function updateRecordingTime() {
      recordingSeconds++;
      const minutes = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
      const seconds = (recordingSeconds % 60).toString().padStart(2, '0');
      timeDisplay.textContent = `${minutes}:${seconds}`;
    }
    
    // 播放录音
    function playRecording() {
      if (audioPlayer.src) {
        audioPlayer.play();
        isPlaying = true;
        
        // 更新UI
        playBtn.classList.add('hidden');
        pauseBtn.classList.remove('hidden');
        showNotification('开始播放录音');
      }
    }
    
    // 暂停播放
    function pauseRecording() {
      audioPlayer.pause();
      isPlaying = false;
      
      // 更新UI
      playBtn.classList.remove('hidden');
      pauseBtn.classList.add('hidden');
      showNotification('录音已暂停');
    }
    
    // 音频播放结束时更新UI
    audioPlayer.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.classList.remove('hidden');
      pauseBtn.classList.add('hidden');
    });
    
    // 根据日期获取每日内容（确保每天内容固定）
    function getDailyContent() {
      const now = new Date();
      // 使用年月日生成唯一标识符
      const dayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
      
      // 检查本地存储中是否已有今日内容
      const storedContent = localStorage.getItem(`dailyContent_${dayKey}`);
      if (storedContent) {
        return storedContent;
      }
      
      // 生成基于日期的随机索引（确保同一天索引相同）
      const index = dayKey % positiveContents.length;
      const dailyContent = positiveContents[index];
      
      // 保存到本地存储
      localStorage.setItem(`dailyContent_${dayKey}`, dailyContent);
      return dailyContent;
    }
    
    // 获取随机内容
    function getRandomContent() {
      const randomIndex = Math.floor(Math.random() * positiveContents.length);
      return positiveContents[randomIndex];
    }
    
    // 内容按钮操作
    function handleContentAction(action) {
      switch(action) {
        case 'today':
          const todayContent = getDailyContent();
          readingContentElement.value = todayContent;
          showNotification('已加载今日内容');
          break;
        case 'random':
          const randomContent = getRandomContent();
          readingContentElement.value = randomContent;
          showNotification('已加载随机内容');
          break;
        case 'clear':
          readingContentElement.value = '';
          showNotification('内容已清空');
          break;
        case 'save':
          const currentContent = readingContentElement.value.trim();
          if (currentContent) {
            // 保存用户编辑的内容
            const now = new Date();
            const dayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
            localStorage.setItem(`dailyContent_${dayKey}`, currentContent);
            showNotification('内容已保存');
          } else {
            showNotification('内容为空，未保存');
          }
          break;
      }
      
      // 更新按钮选中状态
      contentButtons.forEach(btn => {
        btn.classList.remove('bg-contentBtn-primary', 'text-white');
        btn.classList.add('bg-contentBtn-secondary', 'text-gray-800', 'hover:bg-contentBtn-primary/20');
      });
      const selectedBtn = document.querySelector(`.content-btn[data-action="${action}"]`);
      if (selectedBtn) {
        selectedBtn.classList.remove('bg-contentBtn-secondary', 'text-gray-800', 'hover:bg-contentBtn-primary/20');
        selectedBtn.classList.add('bg-contentBtn-primary', 'text-white');
      }
    }
    
    // 初始化页面
    function init() {
      // 设置日期
      setCurrentDate();
      
      // 加载今日内容
      const todayContent = getDailyContent();
      readingContentElement.value = todayContent;
      
      // 恢复用户偏好颜色
      const preferredColor = localStorage.getItem('preferredColor');
      if (preferredColor) {
        changeBackgroundColor(preferredColor);
      }
      
      // 事件监听 - 颜色按钮
      colorButtons.forEach(button => {
        button.addEventListener('click', () => {
          const colorClass = button.getAttribute('data-color');
          changeBackgroundColor(colorClass);
        });
      });
      
      // 事件监听 - 内容按钮
      contentButtons.forEach(button => {
        button.addEventListener('click', () => {
          const action = button.getAttribute('data-action');
          handleContentAction(action);
        });
      });
      
      // 事件监听 - 录音按钮
      recordBtn.addEventListener('click', startRecording);
      stopRecordBtn.addEventListener('click', stopRecording);
      playBtn.addEventListener('click', playRecording);
      pauseBtn.addEventListener('click', pauseRecording);
      
      // 窗口大小变化时调整文本区域
      window.addEventListener('resize', () => {
        const textContainer = document.querySelector('.text-container');
        if (textContainer) {
          textContainer.style.minHeight = `${window.innerHeight * 0.3}px`;
        }
      });
    }
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
