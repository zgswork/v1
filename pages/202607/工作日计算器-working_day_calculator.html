<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作日计算器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #4b6cb7, #182848);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 40px;
            color: #777;
        }
        
        input[type="date"] {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="date"]:focus {
            border-color: #4a86e8;
            outline: none;
        }
        
        .checkbox-group {
            margin: 20px 0;
            display: flex;
            align-items: center;
        }
        
        .checkbox-group input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(75, 108, 183, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin-top: 30px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .result-item {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-label {
            font-weight: 500;
            color: #555;
        }
        
        .result-value {
            font-weight: 600;
            color: #333;
            font-size: 18px;
        }
        
        .details-container {
            margin-top: 20px;
        }
        
        .details-tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }
        
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            border-bottom: 3px solid #4b6cb7;
            color: #4b6cb7;
            font-weight: 500;
        }
        
        .tab-content {
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .day-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        
        .day-item:last-child {
            border-bottom: none;
        }
        
        .weekend {
            background-color: #f8f9fa;
        }
        
        .holiday {
            background-color: #fff5f5;
        }
        
        .workday {
            background-color: #f0f9ff;
        }
        
        .makeup {
            background-color: #fff9db;
        }
        
        .status-message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status-info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        @media (max-width: 850px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .details-tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                flex: 1;
                text-align: center;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-calendar-alt"></i> 工作日计算器</h1>
        <p class="description">计算两个日期之间的工作日天数，基于官方2025年节假日安排</p>
        
        <div class="input-group">
            <label for="start-date"><i class="far fa-calendar-alt"></i> 开始日期</label>
            <div class="input-icon">
                <i class="fas fa-play-circle"></i>
            </div>
            <input type="date" id="start-date" required>
        </div>
        
        <div class="input-group">
            <label for="end-date"><i class="far fa-calendar-alt"></i> 结束日期</label>
            <div class="input-icon">
                <i class="fas fa-flag-checkered"></i>
            </div>
            <input type="date" id="end-date" required>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="exclude-weekends" checked>
            <label for="exclude-weekends">排除周末（周六、周日）</label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="exclude-holidays" checked>
            <label for="exclude-holidays">排除法定节假日</label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="include-makeup" checked>
            <label for="include-makeup">包含调休补班日</label>
        </div>
        
        <button id="calculate-btn">
            <i class="fas fa-calculator"></i> 计算工作日
        </button>
        
        <div class="result-container">
            <div class="result-item">
                <span class="result-label">总天数:</span>
                <span class="result-value" id="total-days">-</span>
            </div>
            
            <div class="result-item">
                <span class="result-label">工作日:</span>
                <span class="result-value" id="work-days">-</span>
            </div>
            
            <div class="result-item">
                <span class="result-label">周末天数:</span>
                <span class="result-value" id="weekend-days">-</span>
            </div>
            
            <div class="result-item">
                <span class="result-label">节假日天数:</span>
                <span class="result-value" id="holiday-days">-</span>
            </div>
            
            <div class="result-item">
                <span class="result-label">补班日天数:</span>
                <span class="result-value" id="makeup-days">-</span>
            </div>
            
            <div class="details-container">
                <div class="details-tabs">
                    <div class="tab active" data-tab="all">全部日期</div>
                    <div class="tab" data-tab="weekends">周末</div>
                    <div class="tab" data-tab="holidays">节假日</div>
                    <div class="tab" data-tab="makeup">补班日</div>
                </div>
                
                <div class="tab-content active" id="all-content">
                    <div class="day-item">
                        <span><strong>日期</strong></span>
                        <span><strong>类型</strong></span>
                    </div>
                </div>
                
                <div class="tab-content" id="weekends-content">
                    <div class="day-item">
                        <span><strong>日期</strong></span>
                        <span><strong>星期</strong></span>
                    </div>
                </div>
                
                <div class="tab-content" id="holidays-content">
                    <div class="day-item">
                        <span><strong>日期</strong></span>
                        <span><strong>节假日名称</strong></span>
                    </div>
                </div>
                
                <div class="tab-content" id="makeup-content">
                    <div class="day-item">
                        <span><strong>日期</strong></span>
                        <span><strong>补班说明</strong></span>
                    </div>
                </div>
            </div>
            
            <div id="status-message" class="status-message status-info">
                请选择开始日期和结束日期
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天和30天后
            const today = new Date();
            const futureDate = new Date();
            futureDate.setDate(today.getDate() + 30);
            
            // 格式化日期为YYYY-MM-DD
            const formatDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            
            document.getElementById('start-date').value = formatDate(today);
            document.getElementById('end-date').value = formatDate(futureDate);
            
            // 定义2025年法定节假日和调休补班日（根据国务院办公厅通知）
            const holidays = [
                // 元旦
                { date: '2025-01-01', name: '元旦', isHoliday: true },
                
                // 春节
                { date: '2025-01-28', name: '春节调休', isMakeup: true }, // 补班
                { date: '2025-01-29', name: '除夕', isHoliday: true },
                { date: '2025-01-30', name: '春节', isHoliday: true },
                { date: '2025-01-31', name: '春节', isHoliday: true },
                { date: '2025-02-01', name: '春节', isHoliday: true },
                { date: '2025-02-02', name: '春节', isHoliday: true },
                { date: '2025-02-03', name: '春节', isHoliday: true },
                { date: '2025-02-04', name: '春节', isHoliday: true },
                { date: '2025-02-05', name: '春节', isHoliday: true },
                { date: '2025-02-08', name: '春节调休', isMakeup: true }, // 补班
                
                // 清明节
                { date: '2025-04-04', name: '清明节', isHoliday: true },
                { date: '2025-04-05', name: '清明节', isHoliday: true },
                { date: '2025-04-06', name: '清明节', isHoliday: true },
                
                // 劳动节
                { date: '2025-04-27', name: '劳动节调休', isMakeup: true }, // 补班
                { date: '2025-05-01', name: '劳动节', isHoliday: true },
                { date: '2025-05-02', name: '劳动节', isHoliday: true },
                { date: '2025-05-03', name: '劳动节', isHoliday: true },
                { date: '2025-05-04', name: '劳动节', isHoliday: true },
                { date: '2025-05-05', name: '劳动节', isHoliday: true },
                
                // 端午节
                { date: '2025-05-31', name: '端午节', isHoliday: true },
                { date: '2025-06-01', name: '端午节', isHoliday: true },
                { date: '2025-06-02', name: '端午节', isHoliday: true },
                
                // 中秋节和国庆节
                { date: '2025-09-28', name: '国庆节调休', isMakeup: true }, // 补班
                { date: '2025-10-01', name: '国庆节/中秋节', isHoliday: true },
                { date: '2025-10-02', name: '国庆节', isHoliday: true },
                { date: '2025-10-03', name: '国庆节', isHoliday: true },
                { date: '2025-10-04', name: '国庆节', isHoliday: true },
                { date: '2025-10-05', name: '国庆节', isHoliday: true },
                { date: '2025-10-06', name: '国庆节', isHoliday: true },
                { date: '2025-10-07', name: '国庆节', isHoliday: true },
                { date: '2025-10-08', name: '国庆节', isHoliday: true },
                { date: '2025-10-11', name: '国庆节调休', isMakeup: true }, // 补班
            ];
            
            // 标签切换功能
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    // 移除所有active类
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    // 添加active类到当前标签和内容
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-content`).classList.add('active');
                });
            });
            
            // 计算按钮点击事件
            document.getElementById('calculate-btn').addEventListener('click', calculateWorkdays);
            
            // 自动计算当日期变化时
            document.getElementById('start-date').addEventListener('change', calculateWorkdays);
            document.getElementById('end-date').addEventListener('change', calculateWorkdays);
            document.getElementById('exclude-weekends').addEventListener('change', calculateWorkdays);
            document.getElementById('exclude-holidays').addEventListener('change', calculateWorkdays);
            document.getElementById('include-makeup').addEventListener('change', calculateWorkdays);
            
            // 初始计算一次
            calculateWorkdays();
            
            function calculateWorkdays() {
                const startDate = new Date(document.getElementById('start-date').value);
                const endDate = new Date(document.getElementById('end-date').value);
                const excludeWeekends = document.getElementById('exclude-weekends').checked;
                const excludeHolidays = document.getElementById('exclude-holidays').checked;
                const includeMakeup = document.getElementById('include-makeup').checked;
                
                // 验证日期有效性
                if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
                    alert('请输入有效的日期');
                    return;
                }
                
                // 确保结束日期不早于开始日期
                if (endDate < startDate) {
                    alert('结束日期不能早于开始日期');
                    return;
                }
                
                // 计算总天数
                const totalTime = endDate - startDate;
                const totalDays = Math.ceil(totalTime / (1000 * 60 * 60 * 24)) + 1;
                
                // 初始化计数器
                let weekendDays = 0;
                let holidayDays = 0;
                let makeupDays = 0;
                let workDays = totalDays;
                
                // 清空详情内容
                document.getElementById('all-content').innerHTML = '<div class="day-item"><span><strong>日期</strong></span><span><strong>类型</strong></span></div>';
                document.getElementById('weekends-content').innerHTML = '<div class="day-item"><span><strong>日期</strong></span><span><strong>星期</strong></span></div>';
                document.getElementById('holidays-content').innerHTML = '<div class="day-item"><span><strong>日期</strong></span><span><strong>节假日名称</strong></span></div>';
                document.getElementById('makeup-content').innerHTML = '<div class="day-item"><span><strong>日期</strong></span><span><strong>补班说明</strong></span></div>';
                
                const currentDate = new Date(startDate);
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                
                for (let i = 0; i < totalDays; i++) {
                    const dateString = formatDate(currentDate);
                    const dayOfWeek = currentDate.getDay();
                    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                    
                    // 检查是否是节假日或补班日
                    const holidayInfo = holidays.find(h => h.date === dateString);
                    const isHoliday = holidayInfo && holidayInfo.isHoliday;
                    const isMakeupDay = holidayInfo && holidayInfo.isMakeup;
                    
                    // 计算周末天数（如果是补班日，不计入周末）
                    if (isWeekend && !isMakeupDay) {
                        weekendDays++;
                        
                        // 添加到周末列表
                        const weekendItem = document.createElement('div');
                        weekendItem.className = 'day-item weekend';
                        weekendItem.innerHTML = `
                            <span>${dateString} 星期${weekdays[dayOfWeek]}</span>
                            <span>周末</span>
                        `;
                        document.getElementById('weekends-content').appendChild(weekendItem);
                    }
                    
                    // 计算节假日天数
                    if (isHoliday) {
                        holidayDays++;
                        
                        // 添加到节假日列表
                        const holidayItem = document.createElement('div');
                        holidayItem.className = 'day-item holiday';
                        holidayItem.innerHTML = `
                            <span>${dateString}</span>
                            <span>${holidayInfo.name}</span>
                        `;
                        document.getElementById('holidays-content').appendChild(holidayItem);
                    }
                    
                    // 计算补班日天数
                    if (isMakeupDay) {
                        makeupDays++;
                        
                        // 添加到补班日列表
                        const makeupItem = document.createElement('div');
                        makeupItem.className = 'day-item makeup';
                        makeupItem.innerHTML = `
                            <span>${dateString}</span>
                            <span>${holidayInfo.name}</span>
                        `;
                        document.getElementById('makeup-content').appendChild(makeupItem);
                    }
                    
                    // 添加到全部日期列表
                    const allItem = document.createElement('div');
                    
                    if (isHoliday) {
                        allItem.className = 'day-item holiday';
                        allItem.innerHTML = `
                            <span>${dateString} 星期${weekdays[dayOfWeek]}</span>
                            <span>${holidayInfo.name}（节假日）</span>
                        `;
                    } else if (isMakeupDay) {
                        allItem.className = 'day-item makeup';
                        allItem.innerHTML = `
                            <span>${dateString} 星期${weekdays[dayOfWeek]}</span>
                            <span>${holidayInfo.name}（补班日）</span>
                        `;
                    } else if (isWeekend) {
                        allItem.className = 'day-item weekend';
                        allItem.innerHTML = `
                            <span>${dateString}</span>
                            <span>周末</span>
                        `;
                    } else {
                        allItem.className = 'day-item workday';
                        allItem.innerHTML = `
                            <span>${dateString} 星期${weekdays[dayOfWeek]}</span>
                            <span>工作日</span>
                        `;
                    }
                    
                    document.getElementById('all-content').appendChild(allItem);
                    
                    // 计算工作日
                    if (excludeWeekends && isWeekend && !isMakeupDay) {
                        workDays--;
                    }
                    
                    if (excludeHolidays && isHoliday) {
                        workDays--;
                    }
                    
                    if (includeMakeup && isMakeupDay && isWeekend) {
                        workDays++; // 补班日如果是周末，要加回来
                    }
                    
                    // 增加一天
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                // 更新UI
                document.getElementById('total-days').textContent = `${totalDays} 天`;
                document.getElementById('weekend-days').textContent = `${weekendDays} 天`;
                document.getElementById('holiday-days').textContent = `${holidayDays} 天`;
                document.getElementById('makeup-days').textContent = `${makeupDays} 天`;
                document.getElementById('work-days').textContent = `${workDays} 天`;
                
                // 更新状态消息
                const statusElement = document.getElementById('status-message');
                statusElement.className = 'status-message status-info';
                
                let message = '<i class="fas fa-info-circle"></i> 计算完成';
                if (excludeWeekends) message += '，已排除周末';
                if (excludeHolidays) message += '，已排除节假日';
                if (includeMakeup) message += '，已包含补班日';
                
                statusElement.innerHTML = message;
            }
        });
    </script>
</body>
</html>
