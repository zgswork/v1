<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多元思维模型：查理·芒格的智慧工具箱</title>
    <style>
        :root {
            --text-color: #333;
            --bg-color: #ffffff;
            --card-bg: #f5f5f5;
            --highlight: #2c5530;
            --navbar-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.1);
            --footer-bg: #f5f5f5;
        }
        
        [data-theme="dark"] {
            --text-color: #e0e0e0;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --highlight: #4caf50;
            --navbar-bg: rgba(18, 18, 18, 0.95);
            --card-shadow: rgba(0, 0, 0, 0.2);
            --border-color: rgba(255, 255, 255, 0.1);
            --footer-bg: #1a1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 24px;
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar.scrolled {
            background: var(--navbar-bg);
            box-shadow: 0 2px 10px var(--card-shadow);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 48px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--highlight);
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover {
            background: var(--border-color);
        }
        
        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-color);
        }

        /* 主视觉区 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--bg-color) 100%);
            position: relative;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 24px;
        }

        .book-cover {
            width: 200px;
            height: 280px;
            margin: 0 auto 48px;
            background: linear-gradient(135deg, var(--highlight), #1a3d1f);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .book-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text x="100" y="140" text-anchor="middle" fill="white" font-size="24" font-weight="bold">穷查理宝典</text></svg>');
            background-size: cover;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 700;
            margin-bottom: 24px;
            color: #333;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            margin-bottom: 48px;
            line-height: 1.5;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            animation: bounce 2s infinite;
        }

        .scroll-indicator svg {
            width: 24px;
            height: 24px;
            stroke: #2c5530;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        /* 主内容区 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            min-height: 100vh;
            background-color: var(--bg-color);
        }

        .models-list {
            position: sticky;
            top: 120px;
            height: fit-content;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .models-list h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #333;
        }

        .model-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .model-item:hover {
            background: var(--card-bg);
            transform: scale(0.98);
            opacity: 0.9;
        }

        .model-item.active {
            background: var(--highlight);
            color: white;
            border-color: var(--highlight);
        }

        .model-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .model-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(44, 85, 48, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .model-item.active .model-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .model-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .model-info p {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.4;
        }

        .model-details {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 0;
        }

        .model-details.expanded {
            max-height: 500px;
            margin-top: 24px;
        }

        .model-details-content {
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        /* 详情面板 */
        .detail-panel {
            position: sticky;
            top: 120px;
            height: fit-content;
        }

        .detail-content {
            background: var(--bg-color);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 10px 30px var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .detail-content h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #333;
        }

        .detail-content .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        .model-visualization {
            width: 100%;
            height: 200px;
            background: #f8f9fa;
            border-radius: 16px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .explanation {
            margin-bottom: 32px;
        }

        .explanation h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .explanation p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 16px;
        }

        .cases {
            margin-top: 32px;
        }

        .case-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .case-item h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--highlight);
        }

        .case-item p {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 12px;
        }

        .case-steps {
            list-style: none;
            padding-left: 0;
        }

        .case-steps li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 8px;
            font-size: 15px;
            color: #555;
        }

        .case-steps li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--highlight);
            font-weight: bold;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 48px 24px;
            background: var(--footer-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                gap: 24px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .hero {
                padding: 0 16px;
            }

            .book-cover {
                width: 150px;
                height: 210px;
                margin-bottom: 32px;
            }

            .main-content {
                grid-template-columns: 1fr;
                gap: 48px;
                padding: 48px 16px;
            }

            .models-list {
                position: static;
                max-height: none;
            }

            .detail-panel {
                position: static;
            }

            .detail-content {
                padding: 32px 24px;
            }

            .model-item {
                padding: 20px;
            }

            .model-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }

        /* 滚动条样式 */
        .models-list::-webkit-scrollbar {
            width: 6px;
        }

        .models-list::-webkit-scrollbar-track {
            background: var(--card-bg);
            border-radius: 3px;
        }

        .models-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .models-list::-webkit-scrollbar-thumb:hover {
            background: var(--highlight);
            opacity: 0.7;
        }

        /* 可视化图表样式 */
        .chart-compound {
            background: linear-gradient(45deg, #e8f5e8, #f0f8f0);
        }

        .chart-probability {
            background: linear-gradient(45deg, #e8f0ff, #f0f6ff);
        }

        .chart-critical {
            background: linear-gradient(45deg, #fff8e8, #fffaf0);
        }

        .chart-evolution {
            background: linear-gradient(45deg, #f8e8ff, #faf0ff);
        }

        .chart-scale {
            background: linear-gradient(45deg, #e8fff8, #f0fff6);
        }

        .chart-cause {
            background: linear-gradient(45deg, #ffe8e8, #fff0f0);
        }

        .chart-opportunity {
            background: linear-gradient(45deg, #e8f8ff, #f0faff);
        }

        .chart-redundancy {
            background: linear-gradient(45deg, #f8f8e8, #fafaf0);
        }

        .chart-occam {
            background: linear-gradient(45deg, #f0e8f8, #f6f0fa);
        }

        .chart-inversion {
            background: linear-gradient(45deg, #e8f8f0, #f0faf6);
        }

        .chart-circle {
            background: linear-gradient(45deg, #f8f0e8, #faf6f0);
        }

        .chart-bias {
            background: linear-gradient(45deg, #e8e8f8, #f0f0fa);
        }
    </style>
</head>

        // 设置主题切换
        function setupThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const lightIcon = document.getElementById('lightIcon');
            const darkIcon = document.getElementById('darkIcon');
            
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDarkMode = document.body.classList.contains('dark-mode');
                
                if (isDarkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    lightIcon.style.display = 'none';
                    darkIcon.style.display = 'block';
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    lightIcon.style.display = 'block';
                    darkIcon.style.display = 'none';
                }
            });
        }
        
        // 加载主题偏好
        function loadThemePreference() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const lightIcon = document.getElementById('lightIcon');
            const darkIcon = document.getElementById('darkIcon');
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDarkMode)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.body.classList.add('dark-mode');
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
            }
        }

        // 渲染模型列表
        function renderModelsList() {
            const container = document.getElementById('modelsList');
            container.innerHTML = mentalModels.map(model => `
                <div class="model-item" onclick="selectModel('${model.id}')" id="model-${model.id}">
                    <div class="model-header">
                        <div class="model-icon">${model.icon}</div>
                        <div class="model-info">
                            <h3>${model.name}</h3>
                            <p>${model.description}</p>
                        </div>
                    </div>
                    <div class="model-details" id="details-${model.id}">
                        <div class="model-details-content">
                            <p>${model.explanation}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 选择模型
        function selectModel(modelId) {
            const model = mentalModels.find(m => m.id === modelId);
            if (!model) return;

            // 更新列表状态
            document.querySelectorAll('.model-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(`model-${modelId}`).classList.add('active');

            // 切换详情展开状态
            const detailsElement = document.getElementById(`details-${modelId}`);
            const isExpanded = detailsElement.classList.contains('expanded');
            
            // 收起所有其他详情
            document.querySelectorAll('.model-details').forEach(details => {
                details.classList.remove('expanded');
            });

            // 如果当前项未展开，则展开它
            if (!isExpanded) {
                detailsElement.classList.add('expanded');
            }

            // 更新右侧详情面板
            updateDetailPanel(model);
            currentModel = model;
        }

        // 更新详情面板

            const container = document.getElementById('detailContent');
