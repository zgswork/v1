<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKFile Logo生成器 - 免费在线设计工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4edf9);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: #555;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .control-panel {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .preview-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .preview-container {
            flex: 1;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .logo-preview {
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .logo-preview canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            flex: 1;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
            transform: translateY(-3px);
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group h3 i {
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="range"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .color-pickers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .history-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .history-panel h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--secondary);
        }

        .history-items {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .history-item {
            width: 70px;
            height: 70px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .history-item canvas {
            width: 100%;
            height: 100%;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .logo-preview {
                width: 250px;
                height: 250px;
                margin: 0 auto;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
            
            .btn {
                padding: 12px 20px;
            }
        }

        @media (max-width: 480px) {
            .color-pickers {
                grid-template-columns: 1fr;
            }
            
            .logo-preview {
                width: 200px;
                height: 200px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-palette"></i> DKFile Logo生成器</h1>
            <p>免费在线创建和自定义您的专属Logo - 无需设计经验，简单易用！</p>
        </header>
        
        <div class="app-container">
            <div class="control-panel">
                <div class="control-group">
                    <h3><i class="fas fa-font"></i> 文本设置</h3>
                    <div class="form-group">
                        <label for="logoText">Logo文字</label>
                        <input type="text" id="logoText" value="DKFile" placeholder="输入Logo文字">
                    </div>
                    <div class="form-group">
                        <label for="fontFamily">字体</label>
                        <select id="fontFamily">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Montserrat', sans-serif" selected>Montserrat</option>
                            <option value="'Poppins', sans-serif">Poppins</option>
                            <option value="Georgia, serif">Georgia</option>
                            <option value="'Courier New', monospace">Courier New</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fontSize">字体大小: <span id="fontSizeValue">48</span>px</label>
                        <input type="range" id="fontSize" min="20" max="120" value="48">
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-fill-drip"></i> 颜色设置</h3>
                    <div class="color-pickers">
                        <div class="form-group">
                            <label for="textColor">文字颜色</label>
                            <input type="color" id="textColor" value="#4361ee">
                        </div>
                        <div class="form-group">
                            <label for="bgColor">背景颜色</label>
                            <input type="color" id="bgColor" value="#f8f9fa">
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-sliders-h"></i> 样式设置</h3>
                    <div class="form-group">
                        <label for="borderRadius">圆角: <span id="borderRadiusValue">10</span>px</label>
                        <input type="range" id="borderRadius" min="0" max="50" value="10">
                    </div>
                    <div class="form-group">
                        <label for="logoStyle">文字样式</label>
                        <select id="logoStyle">
                            <option value="normal">普通</option>
                            <option value="bold">加粗</option>
                            <option value="italic">斜体</option>
                            <option value="underline">下划线</option>
                        </select>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="downloadBtn">
                        <i class="fas fa-download"></i> 下载Logo
                    </button>
                    <button class="btn btn-secondary" id="saveBtn">
                        <i class="fas fa-save"></i> 保存设计
                    </button>
                </div>
            </div>
            
            <div class="preview-panel">
                <div class="preview-container">
                    <div class="logo-preview">
                        <canvas id="logoCanvas" width="400" height="400"></canvas>
                    </div>
                </div>
                
                <div class="history-panel">
                    <h3><i class="fas fa-history"></i> 设计历史</h3>
                    <div class="history-items" id="historyItems">
                        <!-- 历史记录将通过JS动态添加 -->
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 DKFile Logo生成器 | 免费HTML网页托管平台 | 保留所有权利</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const canvas = document.getElementById('logoCanvas');
            const ctx = canvas.getContext('2d');
            const logoTextInput = document.getElementById('logoText');
            const fontFamilySelect = document.getElementById('fontFamily');
            const fontSizeInput = document.getElementById('fontSize');
            const fontSizeValue = document.getElementById('fontSizeValue');
            const textColorInput = document.getElementById('textColor');
            const bgColorInput = document.getElementById('bgColor');
            const borderRadiusInput = document.getElementById('borderRadius');
            const borderRadiusValue = document.getElementById('borderRadiusValue');
            const logoStyleSelect = document.getElementById('logoStyle');
            const downloadBtn = document.getElementById('downloadBtn');
            const saveBtn = document.getElementById('saveBtn');
            const historyItems = document.getElementById('historyItems');
            
            // 存储设计历史
            let designHistory = JSON.parse(localStorage.getItem('logoDesignHistory')) || [];
            
            // 初始化
            renderLogo();
            renderHistory();
            
            // 监听所有输入变化
            const inputs = [
                logoTextInput, 
                fontFamilySelect, 
                fontSizeInput, 
                textColorInput, 
                bgColorInput, 
                borderRadiusInput,
                logoStyleSelect
            ];
            
            inputs.forEach(input => {
                input.addEventListener('input', renderLogo);
            });
            
            // 下载按钮事件
            downloadBtn.addEventListener('click', function() {
                const link = document.createElement('a');
                link.download = 'dkfile-logo.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
            
            // 保存按钮事件
            saveBtn.addEventListener('click', function() {
                const design = {
                    text: logoTextInput.value,
                    font: fontFamilySelect.value,
                    size: fontSizeInput.value,
                    textColor: textColorInput.value,
                    bgColor: bgColorInput.value,
                    borderRadius: borderRadiusInput.value,
                    style: logoStyleSelect.value,
                    timestamp: new Date().toISOString()
                };
                
                // 添加到历史记录
                designHistory.unshift(design);
                if (designHistory.length > 6) {
                    designHistory.pop();
                }
                
                // 保存到localStorage
                localStorage.setItem('logoDesignHistory', JSON.stringify(designHistory));
                
                // 重新渲染历史
                renderHistory();
                
                // 显示保存成功消息
                alert('设计已保存到历史记录！');
            });
            
            // 渲染Logo函数
            function renderLogo() {
                // 更新显示的值
                fontSizeValue.textContent = fontSizeInput.value;
                borderRadiusValue.textContent = borderRadiusInput.value;
                
                // 获取当前设置
                const text = logoTextInput.value || 'DKFile';
                const fontFamily = fontFamilySelect.value;
                const fontSize = parseInt(fontSizeInput.value);
                const textColor = textColorInput.value;
                const bgColor = bgColorInput.value;
                const borderRadius = parseInt(borderRadiusInput.value);
                const style = logoStyleSelect.value;
                
                // 设置Canvas大小
                canvas.width = 400;
                canvas.height = 400;
                
                // 清除Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景
                ctx.fillStyle = bgColor;
                roundRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
                ctx.fill();
                
                // 设置文本样式
                ctx.fillStyle = textColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 设置字体样式
                let fontStyle = '';
                if (style === 'bold') fontStyle = 'bold';
                else if (style === 'italic') fontStyle = 'italic';
                else if (style === 'underline') fontStyle = 'normal';
                
                ctx.font = `${fontStyle} ${fontSize}px ${fontFamily}`;
                
                // 绘制文本
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                
                // 下划线样式
                if (style === 'underline') {
                    const textWidth = ctx.measureText(text).width;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width / 2 - textWidth / 2, canvas.height / 2 + fontSize / 2 + 5);
                    ctx.lineTo(canvas.width / 2 + textWidth / 2, canvas.height / 2 + fontSize / 2 + 5);
                    ctx.strokeStyle = textColor;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            
            // 绘制圆角矩形函数
            function roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
            
            // 渲染历史记录
            function renderHistory() {
                historyItems.innerHTML = '';
                
                if (designHistory.length === 0) {
                    historyItems.innerHTML = '<p>暂无历史记录</p>';
                    return;
                }
                
                designHistory.forEach((design, index) => {
                    const historyCanvas = document.createElement('canvas');
                    historyCanvas.width = 60;
                    historyCanvas.height = 60;
                    const historyCtx = historyCanvas.getContext('2d');
                    
                    // 绘制历史记录缩略图
                    historyCtx.fillStyle = design.bgColor;
                    roundRect(historyCtx, 0, 0, historyCanvas.width, historyCanvas.height, design.borderRadius / 4);
                    historyCtx.fill();
                    
                    historyCtx.fillStyle = design.textColor;
                    historyCtx.textAlign = 'center';
                    historyCtx.textBaseline = 'middle';
                    
                    let fontStyle = '';
                    if (design.style === 'bold') fontStyle = 'bold';
                    else if (design.style === 'italic') fontStyle = 'italic';
                    
                    historyCtx.font = `${fontStyle} ${design.size / 8}px ${design.font}`;
                    historyCtx.fillText(design.text.substring(0, 4), historyCanvas.width / 2, historyCanvas.height / 2);
                    
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.appendChild(historyCanvas);
                    
                    // 点击历史记录恢复设置
                    historyItem.addEventListener('click', function() {
                        logoTextInput.value = design.text;
                        fontFamilySelect.value = design.font;
                        fontSizeInput.value = design.size;
                        textColorInput.value = design.textColor;
                        bgColorInput.value = design.bgColor;
                        borderRadiusInput.value = design.borderRadius;
                        logoStyleSelect.value = design.style;
                        
                        renderLogo();
                    });
                    
                    historyItems.appendChild(historyItem);
                });
            }
        });
    </script>
</body>
</html>
