<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春意家常菜 - 智能团队周点餐系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background-color: #f5fef6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            background-image: linear-gradient(to bottom, #f5fef6, #e6f7e9);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.1);
            overflow: hidden;
            border: 1px solid #c8e6c9;
        }
        
        header {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            transform: rotate(15deg);
            z-index: 0;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .date-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e8f5e9;
            padding: 15px 30px;
            border-bottom: 2px dashed #a5d6a7;
            flex-wrap: wrap;
        }
        
        .current-date {
            font-size: 1.4rem;
            color: #1b5e20;
            font-weight: 500;
        }
        
        .current-date i {
            margin-right: 10px;
        }
        
        .week-control {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .week-control button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .week-control button:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .export-btn {
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .export-btn:hover {
            background-color: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(33, 150, 243, 0.3);
        }
        
        .stats-panel {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 30px;
            border: 1px solid #a5d6a7;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2e7d32;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .stat-detail {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        .weekly-menu {
            padding: 0 30px 30px;
        }
        
        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background-color: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
            border-left: 8px solid #4caf50;
        }
        
        .week-title {
            font-size: 1.8rem;
            color: #1b5e20;
            font-weight: 700;
        }
        
        .week-navigation {
            display: flex;
            gap: 10px;
        }
        
        .week-nav-btn {
            background-color: #81c784;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .week-nav-btn:hover {
            background-color: #4caf50;
            transform: scale(1.1);
        }
        
        .days-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .day-card {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.1);
            transition: all 0.3s;
            border: 1px solid #e8f5e9;
        }
        
        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(46, 125, 50, 0.15);
            border-color: #4caf50;
        }
        
        .day-header {
            padding: 20px;
            background: linear-gradient(135deg, #81c784, #66bb6a);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .day-title {
            font-size: 1.4rem;
            font-weight: 700;
        }
        
        .day-date {
            font-size: 1rem;
            opacity: 0.9;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .day-actions {
            display: flex;
            gap: 10px;
        }
        
        .edit-day-btn {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .edit-day-btn:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }
        
        .day-meals {
            padding: 20px;
        }
        
        .meal-section {
            margin-bottom: 25px;
        }
        
        .meal-section:last-child {
            margin-bottom: 0;
        }
        
        .meal-title {
            font-size: 1.2rem;
            color: #2e7d32;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8f5e9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .meal-title i {
            color: #4caf50;
        }
        
        .meal-dish {
            background-color: #f9fdf9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid #e8f5e9;
        }
        
        .meal-dish:hover {
            background-color: #e8f5e9;
            border-color: #a5d6a7;
        }
        
        .meal-dish:last-child {
            margin-bottom: 0;
        }
        
        .dish-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1b5e20;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .dish-category {
            font-size: 0.85rem;
            color: #666;
            background-color: #e8f5e9;
            padding: 3px 10px;
            border-radius: 15px;
        }
        
        .dish-rating {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        
        .star {
            color: #ffc107;
            font-size: 0.9rem;
            margin-right: 2px;
        }
        
        .rating-value {
            font-size: 0.9rem;
            color: #666;
            margin-left: 5px;
        }
        
        .search-container {
            background-color: #e8f5e9;
            padding: 15px 20px;
            border-bottom: 1px solid #c8e6c9;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 25px;
            padding: 10px 20px;
            border: 2px solid #a5d6a7;
            margin-bottom: 10px;
        }
        
        .search-box i {
            color: #4caf50;
            margin-right: 10px;
        }
        
        .search-box input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            background: transparent;
        }
        
        .clear-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 5px;
        }
        
        .advanced-filters {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        
        .advanced-filters label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .all-dishes-section {
            margin-top: 40px;
            padding: 30px;
            background-color: #f9fdf9;
            border-radius: 15px;
            border: 1px solid #e8f5e9;
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #1b5e20;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c8e6c9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .category-tabs {
            display: flex;
            background-color: #e8f5e9;
            padding: 0 20px;
            overflow-x: auto;
            border-radius: 10px 10px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 20px;
        }
        
        .category-tab {
            padding: 18px 25px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            color: #2e7d32;
            white-space: nowrap;
            transition: all 0.3s;
            position: relative;
            border-bottom: 3px solid transparent;
        }
        
        .category-tab:hover {
            color: #1b5e20;
            background-color: rgba(76, 175, 80, 0.1);
        }
        
        .category-tab.active {
            color: #1b5e20;
            border-bottom: 3px solid #4caf50;
            background-color: rgba(76, 175, 80, 0.15);
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .dish-card {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid #e8f5e9;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .dish-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(46, 125, 50, 0.15);
            border-color: #4caf50;
        }
        
        .dish-header {
            padding: 20px;
            background: linear-gradient(135deg, #a5d6a7, #81c784);
            color: #1b5e20;
        }
        
        .dish-card .dish-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
            display: block;
        }
        
        .dish-card .dish-category {
            font-size: 0.9rem;
            opacity: 0.9;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }
        
        .dish-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .dish-desc {
            color: #666;
            font-size: 0.95rem;
            flex-grow: 1;
            margin-bottom: 15px;
        }
        
        .view-recipe-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
            width: 100%;
            text-align: center;
            margin-top: auto;
        }
        
        .view-recipe-btn:hover {
            background-color: #388e3c;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background-color: white;
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            padding: 25px;
            border-radius: 20px 20px 0 0;
            position: relative;
        }
        
        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .modal-category {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .close-modal:hover {
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .modal-rating {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .recipe-section {
            margin-bottom: 25px;
        }
        
        .recipe-section h3 {
            color: #2e7d32;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e8f5e9;
        }
        
        .recipe-steps {
            padding-left: 20px;
        }
        
        .recipe-steps li {
            margin-bottom: 10px;
        }
        
        .no-dishes {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.2rem;
        }
        
        .no-dishes i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #c8e6c9;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #e8f5e9;
            font-size: 0.9rem;
        }
        
        .history-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px 0 0 5px;
            padding: 12px 8px;
            cursor: pointer;
            z-index: 998;
            transform: translateY(-50%);
            transition: all 0.3s;
        }
        
        .history-toggle:hover {
            background-color: #388e3c;
            padding-right: 12px;
        }
        
        .history-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100vh;
            background-color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 999;
            overflow-y: auto;
            padding: 20px;
        }
        
        .history-sidebar.open {
            right: 0;
        }
        
        .history-item {
            background-color: #f9fdf9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e8f5e9;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .history-item:hover {
            background-color: #e8f5e9;
            transform: translateX(-5px);
        }
        
        .history-title {
            font-weight: 600;
            color: #1b5e20;
            margin-bottom: 5px;
        }
        
        .history-date {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
        }
        
        .history-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
        }
        
        .no-history {
            text-align: center;
            color: #888;
            padding: 30px;
            font-style: italic;
        }
        
        .editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .editor-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .editor-content {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .meal-editor {
            margin: 20px 0;
        }
        
        .dish-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9fdf9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #e8f5e9;
        }
        
        .change-dish-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .change-dish-btn:hover {
            background-color: #388e3c;
        }
        
        .editor-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }
        
        .save-btn, .cancel-btn {
            padding: 10px 25px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .save-btn {
            background-color: #4caf50;
            color: white;
        }
        
        .save-btn:hover {
            background-color: #388e3c;
        }
        
        .cancel-btn {
            background-color: #f5f5f5;
            color: #666;
        }
        
        .cancel-btn:hover {
            background-color: #e0e0e0;
        }
        
        .dish-selector-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .dish-selector-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .dish-selector-content {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .dish-selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .dish-selector-item {
            background-color: #f9fdf9;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            border: 1px solid #e8f5e9;
            transition: all 0.3s;
            text-align: center;
        }
        
        .dish-selector-item:hover {
            background-color: #e8f5e9;
            border-color: #4caf50;
            transform: translateY(-3px);
        }
        
        .dish-selector-item.selected {
            background-color: #c8e6c9;
            border-color: #4caf50;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        @media (max-width: 1200px) {
            .days-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }
        
        @media (max-width: 992px) {
            .days-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }
        
        @media (max-width: 768px) {

        // 智能菜单规划器
        class SmartMenuPlanner {
            constructor(dishes) {
                this.dishes = dishes;
                this.recentlyUsed = [];
                this.maxRecentSize = 30;
            }
            
            getBestDish(category, avoidIds = []) {
                // 优先选择未在最近使用的菜品
                let availableDishes = this.dishes.filter(dish => 
                    dish.category === category && 
                    !avoidIds.includes(dish.id) &&
                    !this.recentlyUsed.includes(dish.id)
                );
                
                if (availableDishes.length === 0) {
                    // 如果没有合适的菜品，放宽条件（只避免avoidIds）
                    availableDishes = this.dishes.filter(dish => 
                        dish.category === category && !avoidIds.includes(dish.id)
                    );
                }
                
                if (availableDishes.length === 0) {
                    // 如果还是没有，返回该分类下评分最高的菜品
                    return this.dishes
                        .filter(d => d.category === category)
                        .sort((a, b) => b.rating - a.rating)[0];
                }
                
                // 综合评分和随机性选择
                return availableDishes
                    .sort((a, b) => {
                        const ratingDiff = b.rating - a.rating;
                        const randomFactor = (Math.random() - 0.5) * 0.3;
                        return ratingDiff + randomFactor;
                    })[0];
            }
            
            generateWeeklyMenu() {
                const menu = [];
                const usedDishIds = [];
                
                for (let i = 0; i < 7; i++) {
                    // 早餐选择
                    const breakfast = this.getBestDish('早餐', usedDishIds);
                    usedDishIds.push(breakfast.id);
                    
                    // 午餐热菜选择
                    const hotDish = this.getBestDish('热菜', usedDishIds);
                    usedDishIds.push(hotDish.id);
                    
                    // 午餐汤羹选择
                    const soup = this.getBestDish('汤羹', usedDishIds);
                    usedDishIds.push(soup.id);
                    
                    // 更新最近使用列表
                    [breakfast.id, hotDish.id, soup.id].forEach(id => {
                        if (!this.recentlyUsed.includes(id)) {
                            this.recentlyUsed.unshift(id);
                            if (this.recentlyUsed.length > this.maxRecentSize) {
                                this.recentlyUsed.pop();
                            }
                        }
                    });
                    
                    menu.push({
                        breakfast,
                        lunchHotDish: hotDish,
                        lunchSoup: soup
                    });
                }
                
                return menu;
            }
            
            updateRecentlyUsed(dishIds) {
                dishIds.forEach(id => {
                    if (!this.recentlyUsed.includes(id)) {
                        this.recentlyUsed.unshift(id);
                        if (this.recentlyUsed.length > this.maxRecentSize) {
                            this.recentlyUsed.pop();
                        }
                    }
                });
            }
            
            getRecentlyUsed() {
                return [...this.recentlyUsed];
            }
        }
        
        // 历史菜单管理器
        class MenuHistory {
            constructor() {
                this.history = JSON.parse(localStorage.getItem('menuHistory') || '{}');
            }
            
            saveWeek(weekKey, menuData, weekTitle) {
                const stats = this.calculateStats(menuData);
                this.history[weekKey] = {
                    menu: menuData,
                    title: weekTitle,
                    savedAt: new Date().toISOString(),
                    stats: stats
                };
                this.persist();
                return stats;
            }
            
            calculateStats(menuData) {
                const dishIds = [];
                let totalRating = 0;
                let dishCount = 0;
                const categories = {};
                
                menuData.forEach(day => {
                    [day.breakfast, day.lunchHotDish, day.lunchSoup].forEach(dish => {
                        if (!dishIds.includes(dish.id)) {
                            dishIds.push(dish.id);
                            totalRating += dish.rating;
                            dishCount++;
                        }
                        categories[dish.category] = (categories[dish.category] || 0) + 1;
                    });
                });
                
                const uniqueDishes = dishIds.length;
                const totalMeals = menuData.length * 3; // 每天3餐
                const averageRating = dishCount > 0 ? (totalRating / dishCount) : 0;
                
                // 计算重复率
                const repeatRate = ((totalMeals - uniqueDishes) / totalMeals * 100).toFixed(1);
                
                return {
                    uniqueDishes,
                    totalMeals,
                    repeatRate: parseFloat(repeatRate),
                    averageRating: parseFloat(averageRating.toFixed(2)),
                    categories
                };
            }
            
            getWeek(weekKey) {
                return this.history[weekKey];
            }
            
            getAllWeeks() {
                return Object.entries(this.history)
                    .sort(([, a], [, b]) => new Date(b.savedAt) - new Date(a.savedAt));
            }
            
            persist() {
                localStorage.setItem('menuHistory', JSON.stringify(this.history));
            }
        }
        
        // 全局变量
        const allDishes = [...dishesData];
        const categories = ["全部", "早餐", "热菜", "汤羹", "凉菜"];
        
        let currentDishes = [...allDishes];
        let currentCategory = "全部";
        let currentWeek = 0; // 0表示本周，1表示下周，-1表示上周，以此类推
        let weeklyMenu = [];
        let menuPlanner;
        let menuHistory;
        
        // 当前编辑状态
        let editingDayIndex = -1;
        let editingMealType = '';
        let selectedDishId = null;

        // 按分类筛选菜品
        function filterDishesByCategory(category) {
            currentCategory = category;
            filterDishes();
        }
        
        // 综合筛选菜品
        function filterDishes() {
            const searchTerm = document.getElementById('dishSearch').value.toLowerCase();
            const highRating = document.getElementById('filterHighRating').checked;
            const recentOnly = document.getElementById('filterRecent').checked;
            const filterBreakfast = document.getElementById('filterBreakfast').checked;
            const filterHotDish = document.getElementById('filterHotDish').checked;
            const filterSoup = document.getElementById('filterSoup').checked;
            
            let filtered = allDishes;
            
            // 按分类筛选
            if (currentCategory !== '全部') {
                filtered = filtered.filter(dish => dish.category === currentCategory);
            }
            
            // 按类型筛选
            const typeFilters = [];
            if (filterBreakfast) typeFilters.push('早餐');
            if (filterHotDish) typeFilters.push('热菜');
            if (filterSoup) typeFilters.push('汤羹');
            
            if (typeFilters.length > 0) {
                filtered = filtered.filter(dish => typeFilters.includes(dish.category));
            }
            
            // 按搜索词筛选
            if (searchTerm) {
                filtered = filtered.filter(dish => 
                    dish.name.toLowerCase().includes(searchTerm) ||
                    dish.ingredients.some(ing => ing.toLowerCase().includes(searchTerm))
                );
            }
            
            // 按评分筛选
            if (highRating) {
                filtered = filtered.filter(dish => dish.rating >= 4.5);
            }
            
            // 按最近使用情况筛选
            if (recentOnly && menuPlanner) {
                const recentlyUsed = menuPlanner.getRecentlyUsed();
                filtered = filtered.filter(dish => !recentlyUsed.includes(dish.id));
            }
            
            renderDishes(filtered);
        }
        
        // 渲染菜品卡片
        function renderDishes(dishes) {
            const menuGrid = document.getElementById('menuGrid');
            
            if (dishes.length === 0) {
                menuGrid.innerHTML = `
                    <div class="no-dishes">
                        <i class="fas fa-utensils"></i>
                        <h3>暂无菜品</h3>
                        <p>当前筛选条件下没有菜品，请调整筛选条件</p>
                    </div>
                `;
                return;
            }
            
            menuGrid.innerHTML = '';
            
            dishes.forEach(dish => {
                const dishCard = document.createElement('div');
                dishCard.className = 'dish-card';
                dishCard.dataset.id = dish.id;
                
                // 生成星级评价
                const stars = generateStars(dish.rating);
                
                // 截取简要做法
                const shortSteps = dish.steps.slice(0, 2).join('；') + '...';
                
                dishCard.innerHTML = `
                    <div class="dish-header">
                        <div class="dish-name">${dish.name}</div>
                        <div class="dish-category">${dish.category}</div>
                    </div>
                    <div class="dish-body">
                        <div class="dish-rating">
                            ${stars}
                            <span class="rating-value">${dish.rating.toFixed(1)}</span>
                        </div>
                        <div class="dish-desc">
                            <strong>主要食材：</strong>${dish.ingredients.slice(0, 3).join('、')}等
                            <br><br>
                            <strong>简要做法：</strong>${shortSteps}
                        </div>
                        <button class="view-recipe-btn" data-id="${dish.id}">
                            <i class="fas fa-book-open"></i> 查看详细做法
                        </button>
                    </div>
                `;
                
                menuGrid.appendChild(dishCard);
            });
            
            // 添加查看做法按钮事件
            document.querySelectorAll('.view-recipe-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const dishId = parseInt(this.dataset.id);
                    const dish = allDishes.find(d => d.id === dishId);
                    if (dish) {
                        showRecipeModal(dish);
                    }
                });

        }
        
        // 生成星级评价HTML
        function generateStars(rating) {
            let starsHTML = '';
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    starsHTML += '<i class="fas fa-star star"></i>';
                } else if (i === fullStars && halfStar) {
                    starsHTML += '<i class="fas fa-star-half-alt star"></i>';
                } else {
                    starsHTML += '<i class="far fa-star star"></i>';
                }
            }
            
            return starsHTML;
        }

        function generateWeeklyMenu() {

            // 保存到历史记录
            const weekKey = `week_${new Date().getFullYear()}_${getWeekNumber(new Date()) + currentWeek}`;
            const weekTitle = `第${getWeekNumber(new Date()) + currentWeek}周菜单`;
            menuHistory.saveWeek(weekKey, weeklyMenu, weekTitle);

        // 渲染周菜单
        function renderWeeklyMenu() {
            const daysContainer = document.getElementById('daysContainer');
            daysContainer.innerHTML = '';

                        <div class="meal-section">

                    showDayEditor(dayIndex);

        // 获取一年中的第几周
        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

            renderWeeklyMenu();

            if (editingDayIndex >= 0) {
                // 更新周菜单
                const dayMenu = weeklyMenu[editingDayIndex];
                
                // 更新最近使用列表
                menuPlanner.updateRecentlyUsed([

                    dayMenu.lunchSoup.id
                ]);
                
                // 保存到历史记录

        // 显示菜品选择器
        function showDishSelector(dayIndex, mealType) {
            editingDayIndex = dayIndex;
            editingMealType = mealType;
            selectedDishId = null;
            
            // 设置选择器标题
            let mealName = '';
            switch(mealType) {
                case 'breakfast': mealName = '早餐'; break;
                case 'hotDish': mealName = '午餐热菜'; break;
                case 'soup': mealName = '午餐汤羹'; break;
            }
            document.getElementById('dishSelectorTitle').textContent = `选择${mealName}`;
            
            // 获取当前周菜单中已使用的菜品ID
            const usedDishIds = [];
            weeklyMenu.forEach(day => {
                usedDishIds.push(day.breakfast.id);
                usedDishIds.push(day.lunchHotDish.id);
                usedDishIds.push(day.lunchSoup.id);
            });
            
            // 获取当前编辑的菜品ID，从usedDishIds中移除（允许选择当前菜品）
            const currentDayMenu = weeklyMenu[dayIndex];
            let currentDishId;
            switch(mealType) {
                case 'breakfast': currentDishId = currentDayMenu.breakfast.id; break;
                case 'hotDish': currentDishId = currentDayMenu.lunchHotDish.id; break;
                case 'soup': currentDishId = currentDayMenu.lunchSoup.id; break;
            }
            
            const filteredUsedDishIds = usedDishIds.filter(id => id !== currentDishId);
            
            // 根据菜品类型筛选菜品
            let category = '';
            switch(mealType) {
                case 'breakfast': category = '早餐'; break;
                case 'hotDish': category = '热菜'; break;
                case 'soup': category = '汤羹'; break;
            }
            
            let availableDishes = allDishes.filter(dish => dish.category === category);
            
            // 移除已使用的菜品（除了当前菜品）
            availableDishes = availableDishes.filter(dish => !filteredUsedDishIds.includes(dish.id));
            
            // 如果可用菜品为空，则放宽条件（允许选择所有该分类菜品）
            if (availableDishes.length === 0) {
                availableDishes = allDishes.filter(dish => dish.category === category);
            }
            
            // 渲染菜品选择器
            const selectorGrid = document.getElementById('dishSelectorGrid');
            selectorGrid.innerHTML = '';
            
            availableDishes.forEach(dish => {
                const dishItem = document.createElement('div');
                dishItem.className = 'dish-selector-item';
                dishItem.dataset.id = dish.id;
                
                const stars = generateStars(dish.rating);
                
                dishItem.innerHTML = `
                    <div style="font-weight: 600; margin-bottom: 5px;">${dish.name}</div>
                    <div style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">${dish.ingredients.slice(0, 2).join('、')}...</div>
                    <div style="font-size: 0.9rem;">${stars} <span style="color: #666;">${dish.rating.toFixed(1)}</span></div>
                `;
                
                dishItem.addEventListener('click', function() {
                    // 移除所有已选中的样式
                    document.querySelectorAll('.dish-selector-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    
                    // 添加选中样式
                    this.classList.add('selected');
                    selectedDishId = parseInt(this.dataset.id);
                });
                
                selectorGrid.appendChild(dishItem);
            });
            
            // 显示选择器
            document.getElementById('dishSelectorModal').classList.add('active');
        }
        
        // 关闭菜品选择器
        function closeDishSelector() {
            document.getElementById('dishSelectorModal').classList.remove('active');
            editingMealType = '';
            selectedDishId = null;
        }
        
        // 确认菜品选择
        function confirmDishSelection() {
            if (selectedDishId && editingDayIndex >= 0 && editingMealType) {
                const selectedDish = allDishes.find(dish => dish.id === selectedDishId);
                
                if (selectedDish) {
                    // 更新周菜单
                    switch(editingMealType) {
                        case 'breakfast':
                            weeklyMenu[editingDayIndex].breakfast = selectedDish;
                            document.getElementById('currentBreakfast').textContent = selectedDish.name;
                            break;
                        case 'hotDish':
                            weeklyMenu[editingDayIndex].lunchHotDish = selectedDish;
                            document.getElementById('currentHotDish').textContent = selectedDish.name;
                            break;
                        case 'soup':
                            weeklyMenu[editingDayIndex].lunchSoup = selectedDish;
                            document.getElementById('currentSoup').textContent = selectedDish.name;
                            break;
                    }
                    
                    // 关闭选择器
                    closeDishSelector();
                    
                    // 显示通知
                    showNotification("菜品已更换！");
                }
            }
        }
        
        // 渲染统计数据
        function renderStats() {
            const stats = menuHistory.calculateStats(weeklyMenu);
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">本周菜品数</div>
                    <div class="stat-value">${stats.uniqueDishes}</div>
                    <div class="stat-detail">共${stats.totalMeals}餐次</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">菜品重复率</div>
                    <div class="stat-value">${stats.repeatRate}%</div>
                    <div class="stat-detail">越低越好</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均评分</div>
                    <div class="stat-value">${stats.averageRating}</div>
                    <div class="stat-detail">满分5分</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">分类分布</div>
                    <div class="stat-value">${Object.keys(stats.categories).length}</div>
                    <div class="stat-detail">种菜品分类</div>
                </div>
            `;
        }
        
        // 加载历史记录
        function loadHistory() {
            const historyList = document.getElementById('historyList');
            const historyItems = menuHistory.getAllWeeks();
            
            if (historyItems.length === 0) {
                historyList.innerHTML = '<p class="no-history">暂无历史记录</p>';
                return;
            }
            
            historyList.innerHTML = '';
            historyItems.forEach(([weekKey, data]) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-title">${data.title}</div>
                    <div class="history-date">${new Date(data.savedAt).toLocaleDateString('zh-CN')}</div>
                    <div class="history-stats">
                        <span>${data.stats.uniqueDishes}道菜品</span>
                        <span>评分: ${data.stats.averageRating}</span>
                    </div>
                `;
                
                historyItem.addEventListener('click', () => {
                    loadWeekFromHistory(weekKey, data);
                });
                
                historyList.appendChild(historyItem);
            });
        }
        
        // 从历史加载周菜单
        function loadWeekFromHistory(weekKey, data) {
            if (confirm(`确定要加载${data.title}吗？当前周菜单将被覆盖。`)) {
                weeklyMenu = data.menu;
                currentWeek = 0; // 设置为当前周
                
                // 更新最近使用列表
                const usedIds = [];
                weeklyMenu.forEach(day => {
                    usedIds.push(day.breakfast.id);
                    usedIds.push(day.lunchHotDish.id);
                    usedIds.push(day.lunchSoup.id);
                });
                menuPlanner.updateRecentlyUsed(usedIds);
                
                // 重新渲染
                renderWeeklyMenu();
                renderStats();
                closeHistorySidebar();
                showNotification(`已加载${data.title}`);
            }
        }
        
        // 切换历史侧边栏
        function toggleHistorySidebar() {
            const sidebar = document.getElementById('historySidebar');
            sidebar.classList.toggle('open');
        }
        
        function closeHistorySidebar() {
            const sidebar = document.getElementById('historySidebar');
            sidebar.classList.remove('open');
        }
        
        // 更新下周菜单
        function updateNextWeekMenu() {
            // 确认是否更新
            if (confirm("即将更新为下周菜单，确认更新吗？")) {
                // 生成下周菜单
                currentWeek = 1; // 切换到下周
                generateWeeklyMenu();
                renderWeeklyMenu();
                renderStats();
                loadHistory();
                
                // 提示用户
                showNotification("下周菜单已更新！");
            }
        }
        
        // 导出增强的Excel文件
        function exportEnhancedWeeklyMenu() {
            const wb = XLSX.utils.book_new();
            
            // 第一个工作表：周菜单
            const menuData = [
                ["春意家常菜 - 智能团队周点餐菜单", "", "", "", "", ""],
                ["导出日期", new Date().toLocaleDateString('zh-CN'), "", "", "", ""],
                ["周次", `第${getWeekNumber(new Date()) + currentWeek}周`, "", "", "", ""],
                ["智能生成", "✓", "菜品重复率控制", "✓", "营养均衡", "✓"],
                [], // 空行
                ["日期", "星期", "早餐", "早餐评分", "午餐热菜", "热菜评分", "午餐汤羹", "汤羹评分"]
            ];
            
            // 获取当前周的开始日期（周一）
            const now = new Date();
            const currentDate = new Date(now);
            currentDate.setDate(now.getDate() + (currentWeek * 7) - (now.getDay() === 0 ? 6 : now.getDay() - 1));
            
            // 生成一周7天的菜单
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(currentDate);
                dayDate.setDate(currentDate.getDate() + i);
                
                // 获取星期几
                const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const weekday = weekdays[dayDate.getDay()];
                
                // 格式化日期
                const formattedDate = `${dayDate.getMonth() + 1}月${dayDate.getDate()}日`;
                
                const dayMenu = weeklyMenu[i];
                menuData.push([
                    formattedDate,
                    weekday,
                    dayMenu.breakfast.name,
                    dayMenu.breakfast.rating.toFixed(1),
                    dayMenu.lunchHotDish.name,
                    dayMenu.lunchHotDish.rating.toFixed(1),
                    dayMenu.lunchSoup.name,
                    dayMenu.lunchSoup.rating.toFixed(1)
                ]);
            }
            
            // 第二个工作表：统计数据
            const stats = menuHistory.calculateStats(weeklyMenu);
            const statsData = [
                ["菜单统计数据", "", "", ""],
                ["统计项", "数值", "说明", ""],
                ["菜品总数", stats.totalMeals, "本周总餐次", ""],
                ["独特菜品数", stats.uniqueDishes, "不重复的菜品数量", ""],
                ["菜品重复率", stats.repeatRate + "%", "越低越好", ""],
                ["平均评分", stats.averageRating, "满分5分", ""],
                [], // 空行
                ["分类分布", "数量", "占比", ""]
            ];
            
            Object.entries(stats.categories).forEach(([category, count]) => {
                const percentage = ((count / stats.totalMeals) * 100).toFixed(1);
                statsData.push([category, count, percentage + "%", ""]);
            });
            
            // 第三个工作表：菜品清单
            const dishData = [
                ["菜品清单", "", "", "", ""],
                ["序号", "菜品名称", "分类", "评分", "主要食材"],
                ...allDishes.slice(0, 50).map((dish, index) => [
                    index + 1,
                    dish.name,
                    dish.category,
                    dish.rating.toFixed(1),
                    dish.ingredients.slice(0, 3).join('、')
                ])
            ];
            
            const menuWs = XLSX.utils.aoa_to_sheet(menuData);
            const statsWs = XLSX.utils.aoa_to_sheet(statsData);
            const dishWs = XLSX.utils.aoa_to_sheet(dishData);
            
            // 设置列宽
            menuWs['!cols'] = [
                {wch: 12}, {wch: 8}, {wch: 20}, {wch: 10}, 
                {wch: 20}, {wch: 10}, {wch: 20}, {wch: 10}
            ];
            
            XLSX.utils.book_append_sheet(wb, menuWs, "周菜单");
            XLSX.utils.book_append_sheet(wb, statsWs, "统计数据");
            XLSX.utils.book_append_sheet(wb, dishWs, "菜品库");
            
            const fileName = `智能周点餐菜单_第${getWeekNumber(new Date()) + currentWeek}周.xlsx`;
            XLSX.writeFile(wb, fileName);
            
            showNotification(`增强版菜单已导出为 ${fileName}`);
        }
        
        // 从localStorage加载数据
        function loadFromLocalStorage() {
            // 从localStorage加载菜品库数据
            const savedDishes = localStorage.getItem('dishLibrary');
            if (savedDishes) {
                try {
                    const data = JSON.parse(savedDishes);
                    // 更新菜品库（保留原有结构，只更新数据）
                    if (data && data.length > 0) {
                        allDishes.length = 0;
                        data.forEach(dish => allDishes.push(dish));
                    }
                } catch (e) {
                    console.error('解析保存的菜品库数据时出错:', e);
                }
            }
            
            // 从localStorage加载最近使用记录
            const savedRecentlyUsed = localStorage.getItem('recentlyUsed');
            if (savedRecentlyUsed) {
                try {
                    const data = JSON.parse(savedRecentlyUsed);
                    if (data && Array.isArray(data)) {
                        menuPlanner.recentlyUsed = data;
                    }
                } catch (e) {
                    console.error('解析最近使用记录时出错:', e);
                }
            }
            
            // 重新初始化菜品显示
            filterDishesByCategory(currentCategory);
            
            // 加载历史记录
            loadHistory();
        }
        
        // 保存菜品库到localStorage
        function saveDishLibraryToLocalStorage() {
            localStorage.setItem('dishLibrary', JSON.stringify(allDishes));
        }
        
        // 保存最近使用记录到localStorage
        function saveRecentlyUsedToLocalStorage() {
            if (menuPlanner) {
                localStorage.setItem('recentlyUsed', JSON.stringify(menuPlanner.recentlyUsed));
            }
        }
        
        // 页面关闭前保存数据
        window.addEventListener('beforeunload', function() {
            saveDishLibraryToLocalStorage();
            saveRecentlyUsedToLocalStorage();
            menuHistory.persist();
        });
        
        // 定期保存数据（每5分钟）
        setInterval(() => {
            saveDishLibraryToLocalStorage();
            saveRecentlyUsedToLocalStorage();
            menuHistory.persist();
        }, 5 * 60 * 1000);
    </script>
</body>
