<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<!-- SEO -->
<title>废话文学十级考试｜Nonsense Master Test</title>
<meta name="description" content="Test your nonsense level. Fun, viral, and absurd Chinese internet culture quiz.">
<meta name="keywords" content="废话文学, nonsense test, 抬杠, funny quiz, 互联网梗, viral game">
<meta property="og:title" content="废话文学十级考试">

<meta property="og:type" content="website">

<!-- 免费商用字体 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --green-main: #4caf50;
    --green-light: #81c784;
    --bg-gradient: linear-gradient(135deg,#dcedc8,#a5d6a7,#81c784);
    --card-bg: #ffffff;
}

* {
    box-sizing: border-box;
    font-family: 'Noto Sans SC', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-gradient);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
}

.container {
    width: 100%;
    max-width: 520px;
}

.card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.15);
}

h1 {
    text-align: center;
    font-size: 1.8rem;
    margin: 0 0 18px;
    color: #2e7d32;
}

.meta {
    font-size: 0.9rem;
    color: #555;
    margin-bottom: 12px;
}

.timer {
    float: right;
    color: #e53935;
    font-weight: 600;
}

.option {
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s;
}
.option:hover {
    background: #f1f8e9;
    border-color: var(--green-main);
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
}

button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--green-main);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
}
button:hover {
    background: var(--green-light);
}

.hidden {
    display: none;
}

/* 证书 */
.cert {
    border: 4px double #333;
    padding: 24px;
    margin-top: 20px;
    background: #fafafa;
}
.cert h3 {
    margin: 0;
    font-size: 1.8rem;
}
.cert p {
    margin: 10px 0;
}

/* 底部说明 */
.footer-note {
    margin-top: 28px;
    font-size: 0.85rem;
    color: #444;
    text-align: left;
}
.footer-note strong {
    display: block;
    margin-top: 10px;
}

/* 底部链接 */
.footer-links {
    margin-top: 18px;
    text-align: center;
    font-size: 1rem;
}
.footer-links a {
    color: #d32f2f;
    font-weight: 700;
    text-decoration: none;
    margin: 0 10px;
}

@media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    .card { padding: 20px 16px; }
}
</style>
</head>

<body>

<div class="container">
    <div class="card" id="app">
        <h1>废话文学十级考试<br><small style="font-weight:400;">Nonsense Master Test</small></h1>

        <div id="quizArea">
            <div class="meta">
                进度：<span id="progress"></span>
                <span class="timer" id="timer">10s</span>
            </div>
            <div id="question"></div>
            <div id="options"></div>
        </div>

        <div id="certArea" class="hidden">
            <div id="cert"></div>
        </div>

        <input id="nickname" class="hidden" placeholder="Enter your name / 输入昵称">
        <button id="shareBtn" class="hidden" onclick="genImg()">📸 生成证书图片</button>
        <button id="restartBtn" class="hidden" onclick="startQuiz()">重新考试</button>

        <div class="footer-note">
            <strong>Tool Guide | 工具说明</strong>
            本测试基于中文互联网流行语境，考察“废话文学”与“抬杠艺术”。
            每题限时 10 秒，答对得分，最终生成专属段位证书。
            <br><br>
            <strong>Features | 工具特色</strong>
            • 50+ 抬杠金句题库<br>
            • 随机出题 & 随机选项<br>
            • 自适应手机 / 平板 / PC<br>
            • 一键生成证书图片，便于分享
        </div>

        <div class="footer-links">
            <a href="https://deepseek.idoxu.com/yujianyh/yujianyhziwojieshao.html" target="_blank">设计@遇见yh</a>
            <a href="https://t.zsxq.com/uuQOG" target="_blank">用户反馈</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const questions = [
    { stem: "抛开事实不谈，", correct: "那我们谈什么", wrong: ["你的态度就有问题","这件事你也有错","难道你就没责任吗"] },
    { stem: "你先别管我说的对不对，", correct: "你先管管你自己", wrong: ["我这是为你好","你就是听不进去","你太敏感了"] },
    { stem: "我不是针对你，", correct: "我是说在座的各位都是垃圾", wrong: ["我只是实话实说","你别多想","大家都一样"] },
    { stem: "虽然我没证据，", correct: "但你就是有嫌疑", wrong: ["但我感觉是这样","你别急着反驳","这只是猜测"] },
    { stem: "哪怕你说得对，", correct: "但你态度不对", wrong: ["我也没法认","这不等于没问题","事实不重要"] },
    { stem: "你这么说，", correct: "就是在找茬", wrong: ["是有道理","我也同意","可能是误会"] },
    { stem: "不管你怎么想，", correct: "反正我觉得不行", wrong: ["我们可以商量","也许能改","先听听别人"] },
    { stem: "你要这么理解，", correct: "我也没办法", wrong: ["那我也没办法","那就算了","随你便"] },
    { stem: "就算全世界都错了，", correct: "你也未必对", wrong: ["那你一定对","那也没用","那也没意义"] },
    { stem: "别拿数据说事，", correct: "我信我直觉", wrong: ["我们要讲理","数据会骗人","数据重要"] },
    { stem: "你这是在抬杠，", correct: "我是在讲道理", wrong: ["你才是抬杠","大家都在说","没必要争"] },
    { stem: "别跟我谈逻辑，", correct: "我就问你服不服", wrong: ["逻辑很重要","我们要讲理","你讲不过我"] },
    { stem: "你现在反驳我，", correct: "正好证明你急了", wrong: ["说明你有想法","值得讨论","说明你认真"] },
    { stem: "你如果不认同，", correct: "那就是你不懂", wrong: ["那也没办法","我们可以聊","可能你没理解"] },
    { stem: "我说的是事实，", correct: "你爱信不信", wrong: ["你仔细想想","你慢慢理解","你可以不信"] },
    { stem: "别拿个例说事，", correct: "这就是普遍现象", wrong: ["那只是个案","我们要看整体","你举的例子"] },
    { stem: "你这不是讨论，", correct: "这是人身攻击", wrong: ["这是交流","这是争论","这是沟通"] },
    { stem: "别动不动就举报，", correct: "你这是玻璃心", wrong: ["这是维权","这是规则","你别太敏感"] },
    { stem: "你这么较真，", correct: "活得累不累", wrong: ["挺认真的","值得尊重","挺难得"] },
    { stem: "你非要这样想，", correct: "我也没办法", wrong: ["那我也没办法","随你便","那你开心就好"] },
    { stem: "别拿道德压我，", correct: "我又不是圣人", wrong: ["我们要讲公德","道德很重要","你也不完美"] },
    { stem: "你这不是观点，", correct: "这是偏见", wrong: ["这是立场","这是看法","这是主观"] },
    { stem: "你这不叫批评，", correct: "这叫阴阳怪气", wrong: ["这是建议","这是吐槽","这是反馈"] },
    { stem: "别拿法律说事，", correct: "人情更重要", wrong: ["法律是基础","要依法办事","法律很重要"] },
    { stem: "你这是在偷换概念，", correct: "你才偷换概念", wrong: ["我没有","你才是","大家都在说"] },
    { stem: "你这么说话，", correct: "让人很下头", wrong: ["挺直接的","有点冲","不太礼貌"] },
    { stem: "你这不是反驳，", correct: "这是复读机", wrong: ["这是总结","这是重复","这是强调"] },
    { stem: "别动不动就上纲上线，", correct: "你戏太多了", wrong: ["你太敏感","你别夸张","你别激动"] },
    { stem: "你这不是讲道理，", correct: "这是情绪输出", wrong: ["这是沟通","这是争论","这是表达"] },
    { stem: "你这么理解，", correct: "那我也没办法", wrong: ["那也没错","那也行","那也合理"] },
    { stem: "你这不是质疑，", correct: "这是杠", wrong: ["这是提问","这是探讨","这是好奇"] },
    { stem: "别拿专业压我，", correct: "我也查过百度", wrong: ["专家也会错","你也不是专家","专业很重要"] },
    { stem: "你这不是讨论，", correct: "这是审判", wrong: ["这是聊天","这是交流","这是争论"] },
    { stem: "你这么想，", correct: "那我也没办法", wrong: ["那也行","那也合理","那也没错"] },
    { stem: "别拿经验说事，", correct: "时代变了", wrong: ["经验重要","经验有用","经验会过时"] },
    { stem: "你这不是建议，", correct: "这是命令", wrong: ["这是提醒","这是意见","这是指导"] },
    { stem: "你这么反驳，", correct: "只能说明你急了", wrong: ["说明你认真","说明你在意","说明你有想法"] },
    { stem: "别拿年龄说事，", correct: "我又不是老古董", wrong: ["经验重要","年纪大有理","年纪无关"] },
    { stem: "你这不是包容，", correct: "这是纵容", wrong: ["这是理解","这是宽容","这是放过"] },
    { stem: "你这么解释，", correct: "只会越描越黑", wrong: ["说明你在意","说明你认真","说明你想澄清"] },
    { stem: "别拿大众说事，", correct: "真理掌握在少数人手里", wrong: ["大众会错","大众有眼光","大众不一定对"] },
    { stem: "你这不是冷静，", correct: "这是冷漠", wrong: ["这是理智","这是克制","这是淡定"] },
    { stem: "你这么坚持，", correct: "那是你固执", wrong: ["那是你认真","那是你坚定","那是你执着"] },
    { stem: "别拿理想主义说事，", correct: "现实点吧", wrong: ["理想很重要","理想要有","理想会破灭"] },
    { stem: "你这不是自由，", correct: "这是没素质", wrong: ["这是权利","这是个性","这是表达"] },
    { stem: "你这么说话，", correct: "只能说明你修养不够", wrong: ["有点直","有点冲","有点急"] },
    { stem: "别拿受害者说事，", correct: "谁还不是个宝宝", wrong: ["要学会坚强","要保护自己","要理性看待"] },
    { stem: "你这不是成长，", correct: "这是变圆滑了", wrong: ["这是成熟","这是懂事","这是适应"] },
    { stem: "你这么想赢，", correct: "那你已经输了", wrong: ["那很正常","那也合理","那也常见"] },
    { stem: "你这么较劲，", correct: "有意思吗", wrong: ["挺认真","挺执着","挺难得"] }
];

let quiz = [], index = 0, score = 0, timer = null, sec = 10;

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function startQuiz(){
    quiz = shuffle(questions).slice(0,10).map(q=>{
        const o = shuffle([q.correct,...q.wrong]);
        return {stem:q.stem,opts:o.map((t,i)=>`${'ABCD'[i]}. ${t}`),ans:o.indexOf(q.correct)};
    });
    index=score=0; sec=10;

    document.getElementById("quizArea").classList.remove("hidden");
    document.getElementById("certArea").classList.add("hidden");

    document.getElementById("nickname").classList.add("hidden");
    document.getElementById("shareBtn").classList.add("hidden");
    document.getElementById("restartBtn").classList.add("hidden");

    showQ();
}

function showQ(){
    clearInterval(timer);
    sec=10;
    document.getElementById("timer").innerText=sec+"s";
    timer=setInterval(()=>{
        sec--;
        document.getElementById("timer").innerText=sec+"s";
        if(sec<=0){clearInterval(timer);nextQ(-1);}
    },1000);

    const q=quiz[index];
    document.getElementById("question").innerText=`${index+1}. ${q.stem}____`;
    document.getElementById("progress").innerText=`${index+1}/10`;

    const ops=document.getElementById("options");ops.innerHTML="";
    q.opts.forEach((t,i)=>{
        const d=document.createElement("div");
        d.className="option";d.innerHTML=t;
        d.onclick=()=>select(i);ops.appendChild(d);
    });
}

function select(i){clearInterval(timer);nextQ(i);}
function nextQ(i){if(i===quiz[index].ans)score++;index++;index<quiz.length?showQ():end();}

function end(){
    clearInterval(timer);

    document.getElementById("quizArea").classList.add("hidden");
    document.getElementById("certArea").classList.remove("hidden");

    const n=document.getElementById("nickname");
    n.classList.remove("hidden");

    document.getElementById("cert").innerHTML=`
        <div class="cert">
            <h3>【废话文学证书】</h3>
            <p id="name">Name：____</p>
            <p>Score：${score}/10</p>
            <p>${score>=8?"🏆 Master":score>=5?"🥈 Pro":"🥉 Rookie"}</p>
        </div>`;

    n.oninput=()=>document.getElementById("name").innerText="Name："+(n.value||"Anonymous");
    document.getElementById("shareBtn").classList.remove("hidden");
    document.getElementById("restartBtn").classList.remove("hidden");
}

function genImg(){
    html2canvas(document.getElementById("cert"),{scale:2}).then(c=>{
        const a=document.createElement("a");
        a.download="Nonsense_Certificate.png";
        a.href=c.toDataURL();
        a.click();
    });
}

startQuiz();
</script>

</body>
</html>
