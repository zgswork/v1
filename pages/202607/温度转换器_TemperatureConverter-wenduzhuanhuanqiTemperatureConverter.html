<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温度转换器 | Temperature Converter</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-size: 18px;
            display: none;
        }
        
        .author {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }
        
        .author a {
            color: #3498db;
            text-decoration: none;
        }
        
        .author a:hover {
            text-decoration: underline;
        }
        
        .language-switch {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        
        .language-btn {
            background: none;
            border: 1px solid #3498db;
            color: #3498db;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }
        
        .language-btn:hover {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="language-btn" onclick="switchLanguage('zh')">中文</button>
            <button class="language-btn" onclick="switchLanguage('en')">EN</button>
        </div>
        
        <h1 id="title">温度转换器</h1>
        
        <div class="input-group">
            <label id="temp-label" for="temperature">输入温度值</label>
            <input type="number" id="temperature" placeholder="请输入温度值">
        </div>
        
        <div class="input-group">
            <label id="from-label">从</label>
            <select id="from-unit">
                <option value="celsius">摄氏度 (°C)</option>
                <option value="fahrenheit">华氏度 (°F)</option>
                <option value="kelvin">开尔文 (K)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label id="to-label">转换为</label>
            <select id="to-unit">
                <option value="fahrenheit">华氏度 (°F)</option>
                <option value="celsius">摄氏度 (°C)</option>
                <option value="kelvin">开尔文 (K)</option>
            </select>
        </div>
        
        <button id="convert-btn" onclick="convertTemperature()">转换</button>
        
        <div class="result" id="result"></div>
        
        <div class="author">
            <span id="author-text">作者：文璧 | 邮箱：</span><a href="/cdn-cgi/l/email-protection#390b0f0e0c0e0d08000e0c794848175a5654"><span class="__cf_email__" data-cfemail="2a181c1d1f1d1e1b131d1f6a5b5b04494547">[email&#160;protected]</span></a>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 语言资源
        const resources = {
            zh: {
                title: "温度转换器",
                tempLabel: "输入温度值",
                tempPlaceholder: "请输入温度值",
                fromLabel: "从",
                toLabel: "转换为",
                celsius: "摄氏度 (°C)",
                fahrenheit: "华氏度 (°F)",
                kelvin: "开尔文 (K)",
                convertBtn: "转换",
                authorText: "作者：文璧 | 邮箱："
            },
            en: {
                title: "Temperature Converter",
                tempLabel: "Enter temperature",
                tempPlaceholder: "Please enter temperature",
                fromLabel: "From",
                toLabel: "To",
                celsius: "Celsius (°C)",
                fahrenheit: "Fahrenheit (°F)",
                kelvin: "Kelvin (K)",
                convertBtn: "Convert",
                authorText: "Author: Wen Bi | Email: "
            }
        };

        // 切换语言
        function switchLanguage(lang) {
            document.getElementById('title').textContent = resources[lang].title;
            document.getElementById('temp-label').textContent = resources[lang].tempLabel;
            document.getElementById('temperature').placeholder = resources[lang].tempPlaceholder;
            document.getElementById('from-label').textContent = resources[lang].fromLabel;
            document.getElementById('to-label').textContent = resources[lang].toLabel;
            document.getElementById('convert-btn').textContent = resources[lang].convertBtn;
            document.getElementById('author-text').textContent = resources[lang].authorText;
            
            // 更新下拉选项
            const fromUnit = document.getElementById('from-unit');
            const toUnit = document.getElementById('to-unit');
            
            for (let i = 0; i < fromUnit.options.length; i++) {
                const option = fromUnit.options[i];
                option.text = resources[lang][option.value];
            }
            
            for (let i = 0; i < toUnit.options.length; i++) {
                const option = toUnit.options[i];
                option.text = resources[lang][option.value];
            }
            
            // 更新结果文本（如果有）
            updateResultText(lang);
        }

        // 更新结果文本
        function updateResultText(lang) {
            const resultElement = document.getElementById('result');
            if (resultElement.style.display === 'block') {
                convertTemperature();
            }
        }

        // 温度转换函数
        function convertTemperature() {
            // 获取输入值
            const inputTemp = parseFloat(document.getElementById('temperature').value);
            if (isNaN(inputTemp)) {
                const currentLang = document.getElementById('convert-btn').textContent === 'Convert' ? 'en' : 'zh';
                alert(currentLang === 'en' ? 'Please enter a valid temperature' : '请输入有效的温度值');
                return;
            }
            
            // 获取单位
            const fromUnit = document.getElementById('from-unit').value;
            const toUnit = document.getElementById('to-unit').value;
            
            // 转换为摄氏度作为中间单位
            let celsius;
            switch (fromUnit) {
                case 'celsius':
                    celsius = inputTemp;
                    break;
                case 'fahrenheit':
                    celsius = (inputTemp - 32) * 5 / 9;
                    break;
                case 'kelvin':
                    celsius = inputTemp - 273.15;
                    break;
            }
            
            // 从摄氏度转换为目标单位
            let result;
            switch (toUnit) {
                case 'celsius':
                    result = celsius;
                    break;
                case 'fahrenheit':
                    result = celsius * 9 / 5 + 32;
                    break;
                case 'kelvin':
                    result = celsius + 273.15;
                    break;
            }
            
            // 显示结果
            const resultElement = document.getElementById('result');
            resultElement.style.display = 'block';
            
            // 获取单位符号
            let fromSymbol, toSymbol;
            switch (fromUnit) {
                case 'celsius': fromSymbol = '°C'; break;
                case 'fahrenheit': fromSymbol = '°F'; break;
                case 'kelvin': fromSymbol = 'K'; break;
            }
            switch (toUnit) {
                case 'celsius': toSymbol = '°C'; break;
                case 'fahrenheit': toSymbol = '°F'; break;
                case 'kelvin': toSymbol = 'K'; break;
            }
            
            resultElement.innerHTML = `${inputTemp} ${fromSymbol} = ${result.toFixed(2)} ${toSymbol}`;
        }
    </script>
</body>
</html>
