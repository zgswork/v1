<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💧 皮肤水分流失计算器</title>
    <style>
        :root {
            --water-blue: #4DA6FF;
            --dry-orange: #FFA726;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #F7FBFF;
            color: var(--text-dark);
        }
        .author-info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: #666;
        }
        .author-info a {
            color: var(--water-blue);
            text-decoration: none;
            font-weight: 600;
        }
        .author-info a:hover {
            text-decoration: underline;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 40px;
        }
        h1 {
            color: var(--water-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .calculator-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(77, 166, 255, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0F0FF;
            border-radius: 10px;
            font-size: 16px;
            background-color: #F5FAFF;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--water-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #3D8BE6;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(77, 166, 255, 0.2);
        }
        .result-container {
            margin-top: 30px;
            display: none;
        }
        .water-drop {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%234DA6FF" d="M50 5c-15 25-30 40-30 60a30 30 0 0 0 60 0c0-20-15-35-30-60z"/></svg>') no-repeat;
            background-size: contain;
            position: relative;
        }
        .water-amount {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .comparison {
            background: #F0F8FF;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .comparison-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .advice-list {
            background: #FFF4E5;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .advice-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .advice-icon {
            margin-right: 10px;
            font-size: 20px;
        }
        .progress-container {
            height: 8px;
            background: #E0E0E0;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4DA6FF, #8BC8FF);
            width: 0%;
            transition: width 1s ease-out;
        }
        @media (max-width: 480px) {
            .water-drop {
                width: 100px;
                height: 100px;
            }
            .author-info {
                position: static;
                text-align: center;
                margin-bottom: 15px;
            }
            header {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="author-info">
        作者：<a href="/cdn-cgi/l/email-protection#d3e1e5e4e6e4e7e2eae4e693a2a2fdb0bcbe">文璧</a> | 
        <a href="/cdn-cgi/l/email-protection#26141011131112171f11136657570845494b">联系合作</a>
    </div>

    <header>
        <h1>
            <span>💧</span>
            皮肤水分流失计算器
        </h1>
        <p>科学计算每日皮肤水分流失量，提供个性化护理建议</p>
    </header>

    <div class="calculator-card">
        <div class="form-group">
            <label for="skin-type">我的皮肤类型</label>
            <select id="skin-type">
                <option value="350">中性/健康皮肤</option>
                <option value="500">混合性皮肤</option>
                <option value="700">干性/敏感皮肤</option>
            </select>
        </div>

        <div class="form-group">
            <label for="environment">今日环境状况</label>
            <select id="environment">
                <option value="1.0">室内空调环境</option>
                <option value="1.2">正常室内环境</option>
                <option value="1.5">干燥/大风天气</option>
                <option value="2.0">极端干燥环境</option>
            </select>
        </div>

        <div class="form-group">
            <label for="activity">今日活动量</label>
            <select id="activity">
                <option value="1.0">静态（久坐办公）</option>
                <option value="1.3">轻度活动（散步/家务）</option>
                <option value="1.6">中度运动（健身/骑行）</option>
                <option value="2.0">剧烈运动（跑步/游泳）</option>
            </select>
        </div>

        <button onclick="calculateWaterLoss()">计算我的水分流失</button>

        <div id="result" class="result-container">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <div class="water-drop">
                <div id="water-amount" class="water-amount">0ml</div>
            </div>
            
            <h3 style="text-align:center;">今日皮肤水分流失量</h3>
            
            <div class="comparison">
                <div id="comparison-icon" class="comparison-icon">🥤</div>
                <p>相当于 <span id="comparison-text" style="font-weight:bold">1罐可乐(330ml)</span> 的水量</p>
            </div>
            
            <div class="advice-list">
                <h4>💡 个性化护理建议：</h4>
                <div id="advices"></div>
            </div>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 水分类比数据
        const comparisons = [
            { amount: 250, icon: "☕", text: "1大杯咖啡(250ml)" },
            { amount: 330, icon: "🥤", text: "1罐可乐(330ml)" },
            { amount: 500, icon: "💧", text: "1瓶矿泉水(500ml)" },
            { amount: 700, icon: "🧋", text: "1杯大杯奶茶(700ml)" },
            { amount: 1000, icon: "🍷", text: "1瓶红酒(750ml)" }
        ];

        // 护理建议库
        const adviceList = {
            low: [
                { icon: "💦", text: "使用保湿喷雾随时补水" },
                { icon: "🧴", text: "选择含透明质酸的精华" }
            ],
            medium: [
                { icon: "🌙", text: "睡前敷15分钟保湿面膜" },
                { icon: "🚿", text: "洗澡后3分钟内涂抹身体乳" },
                { icon: "🍉", text: "每天多吃含水分的水果" }
            ],
            high: [
                { icon: "🛁", text: "避免长时间热水洗澡" },
                { icon: "🧖‍♀️", text: "每周2-3次深度保湿护理" },
                { icon: "💊", text: "考虑口服神经酰胺补充剂" },
                { icon: "❄️", text: "使用加湿器改善环境湿度" }
            ]
        };

        function calculateWaterLoss() {
            // 获取用户输入
            const baseLoss = parseInt(document.getElementById("skin-type").value);
            const envFactor = parseFloat(document.getElementById("environment").value);
            const activityFactor = parseFloat(document.getElementById("activity").value);
            
            // 计算总流失量
            const totalLoss = Math.round(baseLoss * envFactor * activityFactor);
            
            // 更新UI显示
            animateWaterLoss(totalLoss);
            
            // 显示结果区域
            document.getElementById("result").style.display = "block";
        }

        function animateWaterLoss(totalLoss) {
            let current = 0;
            const increment = totalLoss / 50;
            const progressBar = document.getElementById("progress-bar");
            const waterAmount = document.getElementById("water-amount");
            
            const animation = setInterval(() => {
                current += increment;
                if (current >= totalLoss) {
                    current = totalLoss;
                    clearInterval(animation);
                    updateComparison(totalLoss);
                    showAdvices(totalLoss);
                }
                
                // 更新进度条和水滴数字
                const percentage = (current / 1000) * 100;
                progressBar.style.width = Math.min(percentage, 100) + "%";
                waterAmount.textContent = Math.round(current) + "ml";
            }, 20);
        }

        function updateComparison(totalLoss) {
            // 找到最接近的类比
            let closest = comparisons[0];
            for (const item of comparisons) {
                if (Math.abs(item.amount - totalLoss) < Math.abs(closest.amount - totalLoss)) {
                    closest = item;
                }
            }
            
            // 计算倍数关系（如1.5瓶矿泉水）
            let multiple = (totalLoss / closest.amount).toFixed(1);
            let displayText = closest.text;
            
            if (multiple > 1.3) {
                displayText = `${multiple}份${closest.text.replace("1", "")}`;
            }
            
            // 更新UI
            document.getElementById("comparison-icon").textContent = closest.icon;
            document.getElementById("comparison-text").textContent = displayText;
        }

        function showAdvices(totalLoss) {
            const advicesContainer = document.getElementById("advices");
            advicesContainer.innerHTML = "";
            
            // 根据流失量选择建议级别
            let adviceLevel;
            if (totalLoss < 500) {
                adviceLevel = "low";
            } else if (totalLoss < 800) {
                adviceLevel = "medium";
            } else {
                adviceLevel = "high";
            }
            
            // 添加个性化建议
            adviceList[adviceLevel].forEach(item => {
                const div = document.createElement("div");
                div.className = "advice-item";
                div.innerHTML = `
                    <span class="advice-icon">${item.icon}</span>
                    <span>${item.text}</span>
                `;
                advicesContainer.appendChild(div);
            });
            
            // 补充水分摄入建议
            const waterIntake = Math.round(totalLoss * 0.3);
            const waterAdvice = document.createElement("div");
            waterAdvice.className = "advice-item";
            waterAdvice.innerHTML = `
                <span class="advice-icon">🚰</span>
                <span>今日建议额外饮水：<strong>${waterIntake}ml</strong>（流失量的30%）</span>
            `;
            advicesContainer.appendChild(waterAdvice);
        }
    </script>
</body>
</html>
