<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文案仿真器 - 一键去除AI味</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #34d399;
            --light: #f0fdf4;
            --dark: #064e3b;
            --gray: #6b7280;
            --light-gray: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: var(--shadow);
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary-dark), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .input-section, .output-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--primary-dark);
            font-size: 1.3rem;
        }
        
        .section-title i {
            background: var(--light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
        
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius);
            font-size: 1rem;
            resize: vertical;
            transition: var(--transition);
            margin-bottom: 20px;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .btn {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow);
            margin-top: auto;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 20px -3px rgba(16, 185, 129, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .output-container {
            position: relative;
            flex-grow: 1;
        }
        
        #outputText {
            min-height: 300px;
            background-color: var(--light-gray);
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--white);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        
        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .feature-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
        }
        
        .feature-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .feature-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--primary-dark);
        }
        
        .feature-desc {
            color: var(--gray);
            font-size: 0.95rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(16, 185, 129, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .char-count {
            text-align: right;
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid rgba(16, 185, 129, 0.1);
            margin-top: 30px;
        }
        
        .tip {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-radius: var(--radius);
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--dark);
            border-left: 4px solid var(--primary);
        }
        
        .examples {
            margin-top: 20px;
        }
        
        .example-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .example-btn:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h1>AI文案仿真器</h1>
            </div>
            <p class="subtitle">一键去除AI味，让文案更自然、更人性化。智能优化AI生成内容，提升文案真实感。</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">
                    <i class="fas fa-keyboard"></i>
                    <h2>输入AI文案</h2>
                </div>
                <textarea id="inputText" placeholder="请粘贴或输入AI生成的文案内容..."></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> 字符
                </div>
                
                <div class="examples">
                    <p style="margin-bottom: 10px; color: var(--gray); font-size: 0.9rem;">试试这些例子：</p>
                    <button class="example-btn" data-example="1">产品介绍</button>
                    <button class="example-btn" data-example="2">营销文案</button>
                    <button class="example-btn" data-example="3">社交媒体</button>
                </div>
                
                <button id="processBtn" class="btn">
                    <i class="fas fa-magic"></i>
                    一键去除AI味
                </button>
                
                <div class="tip">
                    <i class="fas fa-lightbulb"></i> 提示：本工具通过添加口语化表达、调整句式结构、增加情感词汇等方式，让AI文案更自然。
                </div>
            </div>
            
            <div class="output-section">
                <div class="section-title">
                    <i class="fas fa-user-check"></i>
                    <h2>仿真人文案</h2>
                </div>
                
                <div class="output-container">
                    <textarea id="outputText" placeholder="处理后的文案将显示在这里..." readonly></textarea>
                    <button id="copyBtn" class="copy-btn">
                        <i class="far fa-copy"></i>
                        复制文案
                    </button>
                </div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在智能处理中，请稍候...</p>
                </div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h3 class="feature-title">口语化处理</h3>
                <p class="feature-desc">将生硬的书面语转化为自然的口语表达，增加文案亲和力。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-random"></i>
                </div>
                <h3 class="feature-title">句式多样化</h3>
                <p class="feature-desc">打破AI常见的固定句式，增加长短句结合，使文案更生动。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <h3 class="feature-title">情感化表达</h3>
                <p class="feature-desc">添加情感词汇和语气词，让文案更具人情味和感染力。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h3 class="feature-title">即时优化</h3>
                <p class="feature-desc">实时处理，秒级优化，无需等待即可获得自然流畅的文案。</p>
            </div>
        </div>
        
        <footer>
            <p>AI文案仿真器
