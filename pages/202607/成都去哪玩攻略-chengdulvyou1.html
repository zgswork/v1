        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const resultAddress = document.getElementById('resultAddress');
        const resultTransport = document.getElementById('resultTransport');
        const resultTicket = document.getElementById('resultTicket');
        const resultTime = document.getElementById('resultTime');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');

        // 记录已显示的景点索引
        let shownIndices = [];

        // 生成随机景点
        function generateRandomAttraction() {
            // 如果所有景点都已显示过，重置记录
            if (shownIndices.length === attractions.length) {
                shownIndices = [];
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownIndices.includes(randomIndex));

            shownIndices.push(randomIndex);
            return attractions[randomIndex];
        }

        // 显示景点信息
        function displayAttraction(attraction) {
            resultTitle.textContent = attraction.name;
            resultDesc.textContent = attraction.desc;
            resultAddress.textContent = attraction.address;
            resultTransport.textContent = attraction.transport;
            resultTicket.textContent = attraction.ticket;
            resultTime.textContent = attraction.time;
            
            resultContainer.style.display = 'block';
            generateBtn.style.display = 'none';
            changeBtn.style.display = 'inline-block';
        }

        // 事件监听
        generateBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });

        changeBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });

        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
