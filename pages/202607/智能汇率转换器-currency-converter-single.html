<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能汇率转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* 位置状态 */
        .location-status {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .location-status h3 {
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .status-item i {
            width: 20px;
            text-align: center;
        }

        .success { color: #28a745; }
        .warning { color: #ffc107; }
        .error { color: #dc3545; }

        /* 转换器容器 */
        .converter-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .converter-container h3 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .converter-form {
            display: grid;
            gap: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-group label {
            min-width: 60px;
            font-weight: 600;
            color: #555;
        }

        .amount-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .amount-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .currency-select {
            min-width: 120px;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .currency-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .swap-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .swap-btn:hover {
            background: #5a6fd8;
            transform: rotate(180deg);
        }

        /* 汇率信息 */
        .rate-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            grid-column: 1 / -1;
            text-align: center;
        }

        .rate-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .rate-text.error {
            color: #dc3545;
        }

        .rate-text.warning {
            color: #ffc107;
        }

        .last-update {
            font-size: 0.9rem;
            color: #666;
        }

        /* 图表容器 */
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            grid-column: 1 / -1;
            margin-bottom: 20px;
        }

        .chart-container h3 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        #rateChart {
            width: 100%;
            height: 300px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            cursor: crosshair;
        }

        /* 快速转换 */
        .quick-convert {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            grid-column: 1 / -1;
            text-align: center;
        }

        .quick-convert h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .quick-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quick-btn:hover,
        .quick-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 底部操作 */
        .footer-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #e1e5e9;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e1e5e9;
        }

        .modal-header h3 {
            margin: 0;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            padding: 5px;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e1e5e9;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 开发者信息组件样式 */
        .developer-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .developer-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .developer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }
        
        .btn-icon {
            font-size: 1.1rem;
        }
        
        .developer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .developer-modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .developer-modal-content {
            background: white;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        
        .developer-modal.show .developer-modal-content {
            transform: scale(1);
        }
        
        .developer-modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .developer-modal-header h3 {
            margin: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .developer-modal-body {
            padding: 25px;
        }
        
        .developer-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .developer-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        
        .developer-details h4 {
            margin: 0 0 5px 0;
            color: #1f2937;
            font-size: 1.2rem;
        }
        
        .developer-title {
            color: #6b7280;
            margin: 0 0 8px 0;
            font-weight: 500;
        }
        
        .developer-description {
            color: #4b5563;
            margin: 0;
            line-height: 1.5;
        }
        
        .contact-section,
        .project-info,
        .tech-stack {
            margin-bottom: 25px;
        }
        
        .contact-section h5,
        .project-info h5,
        .tech-stack h5 {
            color: #1f2937;
            margin: 0 0 15px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .contact-grid {
            display: grid;
            gap: 15px;
        }
        
        .contact-item {
            display: grid;
            grid-template-columns: 20px 60px 1fr;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
        }
        
        .contact-item i {
            color: #667eea;
        }
        
        .contact-item span {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .contact-link {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .contact-link:hover {
            color: #764ba2;
        }
        
        .wechat-id {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: monospace;
        }
        
        .wechat-id:hover {
            background: #764ba2;
            transform: translateY(-1px);
        }
        
        .copy-icon {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .wechat-id:hover .copy-icon {
            opacity: 1;
        }
        
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .feature-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: #4b5563;
        }
        
        .feature-list i {
            color: #10b981;
        }
        
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tech-tag {
            background: #e5e7eb;
            color: #374151;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .developer-modal-footer {
            background: #f9fafb;
            padding: 15px 25px;
            border-radius: 0 0 15px 15px;
            border-top: 1px solid #e5e7eb;
        }
        
        .copyright {
            margin: 0;
            color: #6b7280;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group label {
                min-width: auto;
            }

            .quick-buttons {
                gap: 8px;
            }

            .quick-btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            .footer-actions {
                flex-direction: column;
                align-items: center;
            }

            .action-btn {
                width: 200px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .converter-container,
            .location-status,
            .rate-info,
            .chart-container,
            .quick-convert {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }
            
            /* 开发者信息组件移动端适配 */
            .developer-trigger {
                bottom: 15px;
                right: 15px;
            }
            
            .developer-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
                border-radius: 20px;
                gap: 6px;
            }
            
            .btn-icon {
                font-size: 1rem;
            }
            
            .btn-text {
                display: none;
            }
            
            .developer-modal-content {
                width: 95%;
                max-height: 85vh;
            }
            
            .developer-modal-header {
                padding: 15px;
            }
            
            .developer-modal-header h3 {
                font-size: 1.1rem;
            }
            
            .developer-modal-body {
                padding: 20px;
            }
            
            .developer-profile {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .developer-avatar {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
            
            .contact-item {
                grid-template-columns: 20px 50px 1fr;
                gap: 10px;
                padding: 8px;
            }
            
            .wechat-id {
                padding: 5px 10px;
                font-size: 0.9rem;
            }
            
            .tech-tags {
                justify-content: center;
            }
            
            .tech-tag {
                font-size: 0.8rem;
                padding: 3px 10px;
            }
            
            .developer-modal-footer {
                padding: 12px 20px;
            }
            
            .copyright {
                font-size: 0.8rem;
            }
        }

        /* 动画效果 */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        body.loading {
            cursor: wait;
        }
        
        body.loading * {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1><i class="fas fa-exchange-alt"></i> 智能汇率转换器</h1>
            <p>基于地理位置的智能货币转换工具</p>
        </header>

        <!-- 主要内容 -->
        <div class="main-content">
            <!-- 位置状态 -->
            <div class="location-status">
                <h3><i class="fas fa-map-marker-alt"></i> 位置信息</h3>
                <div class="status-item">
                    <span id="locationText"><i class="fas fa-map-marker-alt"></i> 正在检测位置...</span>
                </div>
                <div class="status-item">
                    <span id="localCurrencyText">正在识别本地货币...</span>
                </div>
            </div>

            <!-- 转换器 -->
            <div class="converter-container">
                <h3><i class="fas fa-calculator"></i> 货币转换</h3>
                <div class="converter-form">
                    <div class="input-group">
                        <label for="fromAmount">金额:</label>
                        <input type="number" id="fromAmount" class="amount-input" placeholder="输入金额" value="100" min="0" step="0.01">
                        <select id="fromCurrency" class="currency-select">
                            <option value="CNY">人民币 (CNY)</option>
                            <option value="USD">美元 (USD)</option>
                            <option value="EUR">欧元 (EUR)</option>
                            <option value="GBP">英镑 (GBP)</option>
                            <option value="JPY">日元 (JPY)</option>
                            <option value="KRW">韩元 (KRW)</option>
                            <option value="HKD">港币 (HKD)</option>
                            <option value="TWD">台币 (TWD)</option>
                            <option value="SGD">新加坡元 (SGD)</option>
                            <option value="AUD">澳元 (AUD)</option>
                            <option value="CAD">加元 (CAD)</option>
                            <option value="CHF">瑞士法郎 (CHF)</option>
                            <option value="SEK">瑞典克朗 (SEK)</option>
                            <option value="NOK">挪威克朗 (NOK)</option>
                            <option value="DKK">丹麦克朗 (DKK)</option>
                            <option value="RUB">俄罗斯卢布 (RUB)</option>
                            <option value="INR">印度卢比 (INR)</option>
                            <option value="BRL">巴西雷亚尔 (BRL)</option>
                            <option value="MXN">墨西哥比索 (MXN)</option>
                            <option value="ZAR">南非兰特 (ZAR)</option>
                        </select>
                    </div>

                    <button id="swapBtn" class="swap-btn" title="交换货币">
                        <i class="fas fa-exchange-alt"></i>
                    </button>

                    <div class="input-group">
                        <label for="toAmount">结果:</label>
                        <input type="number" id="toAmount" class="amount-input" placeholder="转换结果" readonly>
                        <select id="toCurrency" class="currency-select">
                            <option value="USD">美元 (USD)</option>
                            <option value="CNY">人民币 (CNY)</option>
                            <option value="EUR">欧元 (EUR)</option>
                            <option value="GBP">英镑 (GBP)</option>
                            <option value="JPY">日元 (JPY)</option>
                            <option value="KRW">韩元 (KRW)</option>
                            <option value="HKD">港币 (HKD)</option>
                            <option value="TWD">台币 (TWD)</option>
                            <option value="SGD">新加坡元 (SGD)</option>

    <script>
        /**
         * 地理位置服务
         */
        class LocationService {
            constructor() {
                this.countryToCurrency = {
                    'CN': 'CNY', 'US': 'USD', 'GB': 'GBP', 'JP': 'JPY', 'DE': 'EUR',
                    'FR': 'EUR', 'IT': 'EUR', 'ES': 'EUR', 'NL': 'EUR', 'BE': 'EUR',
                    'AT': 'EUR', 'PT': 'EUR', 'IE': 'EUR', 'FI': 'EUR', 'GR': 'EUR',
                    'KR': 'KRW', 'HK': 'HKD', 'TW': 'TWD', 'SG': 'SGD', 'AU': 'AUD',
                    'CA': 'CAD', 'CH': 'CHF', 'SE': 'SEK', 'NO': 'NOK', 'DK': 'DKK',
                    'RU': 'RUB', 'IN': 'INR', 'BR': 'BRL', 'MX': 'MXN', 'ZA': 'ZAR'
                };
                
                this.currencyNames = {
                    'CNY': '人民币', 'USD': '美元', 'EUR': '欧元', 'GBP': '英镑',
                    'JPY': '日元', 'KRW': '韩元', 'HKD': '港币', 'TWD': '台币',
                    'SGD': '新加坡元', 'AUD': '澳元', 'CAD': '加元', 'CHF': '瑞士法郎',
                    'SEK': '瑞典克朗', 'NOK': '挪威克朗', 'DKK': '丹麦克朗',
                    'RUB': '俄罗斯卢布', 'INR': '印度卢比', 'BRL': '巴西雷亚尔',
                    'MXN': '墨西哥比索', 'ZAR': '南非兰特'
                };
                
                this.cache = new Map();
                this.cacheExpiry = 24 * 60 * 60 * 1000; // 24小时
            }

            async getUserLocation() {
                const cacheKey = 'userLocation';
                const cached = this.cache.get(cacheKey);
                
                if (cached && Date.now() - cached.timestamp < this.cacheExpiry) {
                    return cached.data;
                }

                try {
                    // 优先使用地理位置API
                    if (this.isGeolocationSupported()) {
                        const position = await this.getCurrentPosition();
                        const location = await this.reverseGeocode(position.coords.latitude, position.coords.longitude);
                        
                        this.cache.set(cacheKey, {
                            data: location,
                            timestamp: Date.now()
                        });
                        
                        return location;
                    }
                } catch (error) {
                    // 地理位置获取失败
                }

                // 备用方案：IP地理位置
                try {
                    const ipLocation = await this.getLocationByIP();
                    
                    this.cache.set(cacheKey, {
                        data: ipLocation,
                        timestamp: Date.now()
                    });
                    
                    return ipLocation;
                } catch (error) {
                    throw new Error('无法获取位置信息');
                }
            }

            isGeolocationSupported() {
                return 'geolocation' in navigator;
            }

            getCurrentPosition() {
                return new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            timeout: 10000,
                            enableHighAccuracy: true,
                            maximumAge: 300000 // 5分钟
                        }
                    );
                });
            }

            async reverseGeocode(lat, lng) {
                // 模拟反向地理编码（实际应用中应使用真实的地理编码服务）
                const mockData = {
                    country: 'CN',
                    countryName: '中国',
                    city: '北京',
                    currency: 'CNY',
                    latitude: lat,
                    longitude: lng
                };
                
                return mockData;
            }

            async getLocationByIP() {
                // 模拟IP地理位置（实际应用中应使用真实的IP地理位置服务）
                return {
                    country: 'CN',
                    countryName: '中国',
                    city: '未知',
                    currency: 'CNY',
                    source: 'ip'
                };
            }

            getCurrencyByCountry(countryCode) {
                return this.countryToCurrency[countryCode] || 'USD';
            }

            getCurrencyName(currencyCode) {
                return this.currencyNames[currencyCode] || currencyCode;
            }

            formatLocationDisplay(location) {
                if (location.city && location.city !== '未知') {
                    return `${location.countryName}, ${location.city}`;
                }
                return location.countryName;
            }

            clearCache() {
                this.cache.clear();
            }

            getSupportedCurrencies() {
                return Object.keys(this.currencyNames);
            }
        }

        /**
         * 汇率API服务
         */
        class ExchangeRateAPI {
            constructor() {
                this.apiEndpoints = [
                    'https://api.exchangerate-api.com/v4/latest/',
                    'https://api.fixer.io/latest?access_key=YOUR_API_KEY&base='
                ];
                
                this.cache = new Map();
                this.cacheExpiry = 15 * 60 * 1000; // 15分钟
                this.retryAttempts = 3;
                this.retryDelay = 1000;
            }

            async getExchangeRates(baseCurrency = 'USD') {
                const cacheKey = `rates_${baseCurrency}`;
                const cached = this.cache.get(cacheKey);
                
                if (cached && Date.now() - cached.timestamp < this.cacheExpiry) {
                    return cached.data;
                }

                for (let attempt = 0; attempt < this.retryAttempts; attempt++) {
                    try {
                        const data = await this.fetchWithRetry(baseCurrency);
                        
                        this.cache.set(cacheKey, {
                            data,
                            timestamp: Date.now()
                        });
                        
                        return data;
                    } catch (error) {
                        if (attempt === this.retryAttempts - 1) {
                            // 所有API请求失败，使用模拟数据
                            return this.getMockRates(baseCurrency);
                        }
                        
                        await this.delay(this.retryDelay * (attempt + 1));
                    }
                }
            }

            async fetchWithRetry(baseCurrency) {
                // 由于跨域限制，这里使用模拟数据
                // 实际应用中需要配置CORS或使用代理服务器
                throw new Error('API请求失败');
            }

            getMockRates(baseCurrency) {
                const mockRates = {
                    'USD': {
                        'CNY': 7.2, 'EUR': 0.85, 'GBP': 0.73, 'JPY': 110,
                        'KRW': 1180, 'HKD': 7.8, 'TWD': 28, 'SGD': 1.35,
                        'AUD': 1.35, 'CAD': 1.25, 'CHF': 0.92, 'SEK': 8.5,
                        'NOK': 8.8, 'DKK': 6.3, 'RUB': 75, 'INR': 74,
                        'BRL': 5.2, 'MXN': 20, 'ZAR': 14.5
                    },
                    'CNY': {
                        'USD': 0.139, 'EUR': 0.118, 'GBP': 0.101, 'JPY': 15.3,
                        'KRW': 164, 'HKD': 1.08, 'TWD': 3.89, 'SGD': 0.188,
                        'AUD': 0.188, 'CAD': 0.174, 'CHF': 0.128, 'SEK': 1.18,
                        'NOK': 1.22, 'DKK': 0.875, 'RUB': 10.4, 'INR': 10.3,
                        'BRL': 0.72, 'MXN': 2.78, 'ZAR': 2.01
                    }
                };
                
                const baseRates = mockRates[baseCurrency] || mockRates['USD'];
                
                return {
                    base: baseCurrency,
                    rates: { [baseCurrency]: 1, ...baseRates },
                    timestamp: Date.now(),
                    isMock: true
                };
            }

            async convertCurrency(amount, fromCurrency, toCurrency) {
                if (fromCurrency === toCurrency) {
                    return {
                        result: amount,
                        rate: 1,
                        timestamp: Date.now()
                    };
                }

                const rates = await this.getExchangeRates(fromCurrency);
                const rate = rates.rates[toCurrency];
                
                if (!rate) {
                    throw new Error(`不支持的货币转换: ${fromCurrency} -> ${toCurrency}`);
                }

                return {
                    result: amount * rate,
                    rate: rate,
                    timestamp: rates.timestamp,
                    isMock: rates.isMock
                };
            }

            async getHistoricalRates(baseCurrency, targetCurrency, days = 30) {
                // 模拟历史汇率数据
                const data = [];
                const baseRate = await this.getExchangeRates(baseCurrency);
                const currentRate = baseRate.rates[targetCurrency] || 1;
                
                for (let i = days - 1; i >= 0; i--) {
                    const date = new Date();
                    date.setDate(date.getDate() - i);
                    
                    // 添加随机波动
                    const variation = (Math.random() - 0.5) * 0.1;
                    const rate = currentRate * (1 + variation);
                    
                    data.push({
                        date: date.toISOString().split('T')[0],
                        rate: Math.max(0, rate)
                    });
                }
                
                return data;
            }

            getSupportedCurrencies() {
                return [
                    'CNY', 'USD', 'EUR', 'GBP', 'JPY', 'KRW', 'HKD', 'TWD',
                    'SGD', 'AUD', 'CAD', 'CHF', 'SEK', 'NOK', 'DKK',
                    'RUB', 'INR', 'BRL', 'MXN', 'ZAR'
                ];
            }

            formatCurrency(amount, currency) {
                const formatter = new Intl.NumberFormat('zh-CN', {
                    style: 'currency',
                    currency: currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 6
                });
                
                try {
                    return formatter.format(amount);
                } catch (error) {
                    return `${amount.toFixed(2)} ${currency}`;
                }
            }

            clearCache() {
                this.cache.clear();
            }

            getCacheStatus() {
                return {
                    size: this.cache.size,
                    keys: Array.from(this.cache.keys())
                };
            }

            isOnline() {
                return navigator.onLine;
            }

            async checkAPIStatus() {
                try {
                    await this.getExchangeRates('USD');
                    return { status: 'online', message: 'API服务正常' };
                } catch (error) {
                    return { status: 'offline', message: '使用离线模式' };
                }
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        /**
         * 汇率图表
         */
        class RateChart {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.data = [];
                this.fromCurrency = '';
                this.toCurrency = '';
                this.tooltip = null;
                
                this.setupCanvas();
                this.bindEvents();
            }

            setupCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                
                this.ctx.scale(dpr, dpr);
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
                
                this.width = rect.width;
                this.height = rect.height;
                this.padding = { top: 40, right: 40, bottom: 60, left: 60 };
            }

            bindEvents() {
                this.canvas.addEventListener('mousemove', (e) => {
                    this.handleMouseMove(e);
                });
                
                this.canvas.addEventListener('mouseleave', () => {
                    this.hideTooltip();
                });
                
                window.addEventListener('resize', () => {
                    this.setupCanvas();
                    this.draw();
                });
            }

            updateData(data, fromCurrency, toCurrency) {
                this.data = data;
                this.fromCurrency = fromCurrency;
                this.toCurrency = toCurrency;
                this.draw();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                if (!this.data || this.data.length === 0) {
                    this.drawEmptyState();
                    return;
                }
                
                this.drawGrid();
                this.drawAxes();
                this.drawLine();
                this.drawPoints();
                this.drawTitle();
            }

            drawGrid() {
                const { ctx, width, height, padding } = this;
                
                ctx.strokeStyle = '#f0f0f0';
                ctx.lineWidth = 1;
                
                // 垂直网格线
                const xStep = (width - padding.left - padding.right) / 6;
                for (let i = 0; i <= 6; i++) {
                    const x = padding.left + i * xStep;
                    ctx.beginPath();
                    ctx.moveTo(x, padding.top);
                    ctx.lineTo(x, height - padding.bottom);
                    ctx.stroke();
                }
                
                // 水平网格线
                const yStep = (height - padding.top - padding.bottom) / 5;
                for (let i = 0; i <= 5; i++) {
                    const y = padding.top + i * yStep;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();
                }
            }

            drawAxes() {
                const { ctx, width, height, padding, data } = this;
                
                if (!data.length) return;
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.font = '12px Arial';
                ctx.fillStyle = '#666';
                ctx.textAlign = 'center';
                
                // X轴标签（日期）
                const xStep = (width - padding.left - padding.right) / (data.length - 1);
                const dateStep = Math.ceil(data.length / 6);
                
                for (let i = 0; i < data.length; i += dateStep) {
                    const x = padding.left + i * xStep;
                    const date = new Date(data[i].date);
                    const label = `${date.getMonth() + 1}/${date.getDate()}`;
                    
                    ctx.fillText(label, x, height - padding.bottom + 20);
                }
                
                // Y轴标签（汇率）
                const rates = data.map(d => d.rate);
                const minRate = Math.min(...rates);
                const maxRate = Math.max(...rates);
                const rateRange = maxRate - minRate;
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                
                for (let i = 0; i <= 5; i++) {
                    const y = padding.top + i * (height - padding.top - padding.bottom) / 5;
                    const rate = maxRate - (i / 5) * rateRange;
                    
                    ctx.fillText(rate.toFixed(4), padding.left - 10, y);
                }
            }

            drawLine() {
                const { ctx, width, height, padding, data } = this;
                
                if (!data.length) return;
                
                const rates = data.map(d => d.rate);
                const minRate = Math.min(...rates);
                const maxRate = Math.max(...rates);
                const rateRange = maxRate - minRate || 1;
                
                const xStep = (width - padding.left - padding.right) / (data.length - 1);
                
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 3;
                ctx.beginPath();
                
                data.forEach((point, index) => {
                    const x = padding.left + index * xStep;
                    const y = height - padding.bottom - ((point.rate - minRate) / rateRange) * (height - padding.top - padding.bottom);
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                
                ctx.stroke();
            }

            drawPoints() {
                const { ctx, width, height, padding, data } = this;
                
                if (!data.length) return;
                
                const rates = data.map(d => d.rate);
                const minRate = Math.min(...rates);
                const maxRate = Math.max(...rates);
                const rateRange = maxRate - minRate || 1;
                
                const xStep = (width - padding.left - padding.right) / (data.length - 1);
                
                ctx.fillStyle = '#667eea';
                
                data.forEach((point, index) => {
                    const x = padding.left + index * xStep;
                    const y = height - padding.bottom - ((point.rate - minRate) / rateRange) * (height - padding.top - padding.bottom);
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, 2 * Math.PI);
                    ctx.fill();
                });
            }

            drawTitle() {
                const { ctx, width } = this;
                
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                const title = `${this.fromCurrency} → ${this.toCurrency}`;
                ctx.fillText(title, width / 2, 10);
            }

            drawEmptyState() {
                const { ctx, width, height } = this;
                
                ctx.font = '16px Arial';
                ctx.fillStyle = '#999';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.fillText('暂无图表数据', width / 2, height / 2);
            }

            handleMouseMove(e) {
                if (!this.data.length) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const dataX = (x - this.padding.left) / (this.width - this.padding.left - this.padding.right) * (this.data.length - 1);
                const index = Math.round(dataX);
                
                if (index >= 0 && index < this.data.length) {
                    const point = this.data[index];
                    this.showTooltip(e.clientX, e.clientY, point);
                } else {
                    this.hideTooltip();
                }
            }

            showTooltip(x, y, point) {
                this.hideTooltip();
                
                this.tooltip = document.createElement('div');
                this.tooltip.className = 'chart-tooltip';
                this.tooltip.style.cssText = `
                    position: fixed;
                    background: rgba(0,0,0,0.8);
                    color: white;
                    padding: 8px 12px;
                    border-radius: 4px;
                    font-size: 12px;
                    pointer-events: none;
                    z-index: 1000;
                    left: ${x + 10}px;
                    top: ${y - 10}px;
                `;
                
                const date = new Date(point.date).toLocaleDateString('zh-CN');
                this.tooltip.innerHTML = `
                    <div>日期: ${date}</div>
                    <div>汇率: ${point.rate.toFixed(4)}</div>
                `;
                
                document.body.appendChild(this.tooltip);
            }

            hideTooltip() {
                if (this.tooltip) {
                    document.body.removeChild(this.tooltip);
                    this.tooltip = null;
                }
            }

            redraw() {
                this.setupCanvas();
                this.draw();
            }

            destroy() {
                this.hideTooltip();
                this.canvas.removeEventListener('mousemove', this.handleMouseMove);
                this.canvas.removeEventListener('mouseleave', this.hideTooltip);
                window.removeEventListener('resize', this.redraw);
            }
        }

        /**
         * 汇率转换器主应用程序
         */
        class CurrencyConverterApp {
            constructor() {
                this.locationService = new LocationService();
                this.exchangeAPI = new ExchangeRateAPI();
                this.chart = null;
                
                this.currentLocation = null;
                this.settings = this.loadSettings();
                this.conversionHistory = [];
                
                this.elements = {};
                this.isInitialized = false;
            }

            async init() {
                // 设置超时保护，确保加载状态不会永久卡住
                const loadingTimeout = setTimeout(() => {
                    // 数据初始化超时，使用默认设置
                    this.hideLoadingState();
                    this.isInitialized = true;
                }, 5000); // 5秒超时
                
                try {
                    // 如果基础组件未初始化，则初始化它们
                    if (!this.elements) {
                        this.initializeElements();
                        this.bindEvents();
                        this.initializeChart();
                    }
                    
                    // 显示数据加载状态
                    this.elements.locationText.innerHTML = '<i class="loading"></i> 正在检测位置...';
                    this.elements.rateText.textContent = '正在加载汇率数据...';
                    
                    // 并行执行数据初始化任务
                    const initTasks = [
                        this.detectUserLocation().catch(err => {
                            // 位置检测失败
                            this.elements.locationText.innerHTML = '<i class="fas fa-map-marker-alt"></i> 位置检测失败';
                        }),
                        this.initializeExchangeRates().catch(err => {
                            // 汇率初始化失败
                            this.elements.rateText.textContent = '汇率数据加载失败，请稍后重试';
                        })
                    ];
                    
                    // 等待数据初始化完成
                    await Promise.allSettled(initTasks);
                    
                    // 执行首次转换（如果有输入）
                    if (this.elements.fromAmount.value) {
                        await this.performConversion().catch(err => {/* 首次转换失败 */});
                    }
                    
                    this.isInitialized = true;
                    clearTimeout(loadingTimeout);
                    
                    // 汇率转换器数据初始化完成
                } catch (error) {
                    console.error('数据初始化失败:', error);
                    clearTimeout(loadingTimeout);
                    this.isInitialized = true; // 即使失败也标记为已初始化，允许用户使用基本功能
                    this.showError('数据初始化失败，部分功能可能不可用: ' + error.message);
                }
            }

            initializeElements() {
                this.elements = {
                    locationText: document.getElementById('locationText'),
                    localCurrencyText: document.getElementById('localCurrencyText'),
                    fromAmount: document.getElementById('fromAmount'),
                    fromCurrency: document.getElementById('fromCurrency'),
                    toAmount: document.getElementById('toAmount'),
                    toCurrency: document.getElementById('toCurrency'),
                    swapBtn: document.getElementById('swapBtn'),
                    rateText: document.getElementById('rateText'),
                    lastUpdate: document.getElementById('lastUpdate'),
                    quickBtns: document.querySelectorAll('.quick-btn'),
                    refreshBtn: document.getElementById('refreshBtn'),
                    settingsBtn: document.getElementById('settingsBtn'),
                    settingsModal: document.getElementById('settingsModal'),
                    closeSettings: document.getElementById('closeSettings'),
                    saveSettings: document.getElementById('saveSettings'),
                    autoDetectLocation: document.getElementById('autoDetectLocation'),
                    defaultCurrency: document.getElementById('defaultCurrency'),
                    updateInterval: document.getElementById('updateInterval')
                };
            }

            bindEvents() {
                this.elements.fromAmount.addEventListener('input', () => {
                    this.debounce(this.performConversion.bind(this), 300)();
                });
                
                this.elements.fromCurrency.addEventListener('change', () => {
                    this.performConversion();
                    this.updateChart();
                });
                
                this.elements.toCurrency.addEventListener('change', () => {
                    this.performConversion();
                    this.updateChart();
                });
                
                this.elements.swapBtn.addEventListener('click', () => {
                    this.swapCurrencies();
                });
                
                this.elements.quickBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const amount = e.target.dataset.amount;
                        this.setAmount(amount);
                        this.updateQuickButtonState(e.target);
                    });
                });
                
                this.elements.refreshBtn.addEventListener('click', () => {
                    this.refreshRates();
                });
                
                this.elements.settingsBtn.addEventListener('click', () => {
                    this.openSettings();
                });
                
                this.elements.closeSettings.addEventListener('click', () => {
                    this.closeSettings();
                });
                
                this.elements.saveSettings.addEventListener('click', () => {
                    this.saveSettings();
                });
                
                this.elements.settingsModal.addEventListener('click', (e) => {
                    if (e.target === this.elements.settingsModal) {
                        this.closeSettings();
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeSettings();
                    }
                });
                
                window.addEventListener('online', () => {
                    this.showMessage('网络连接已恢复', 'success');
                    this.refreshRates();
                });
                
                window.addEventListener('offline', () => {
                    this.showMessage('网络连接已断开，使用缓存数据', 'warning');
                });
            }

            initializeChart() {
                this.chart = new RateChart('rateChart');
            }

            async detectUserLocation() {
                if (!this.settings.autoDetectLocation) {
                    this.elements.locationText.innerHTML = '<i class="fas fa-map-marker-alt"></i> 位置检测已禁用';
                    this.elements.localCurrencyText.innerHTML = `<i class="fas fa-coins"></i> 默认货币: ${this.settings.defaultCurrency}`;
                    return;
                }
                
                try {
                    this.elements.locationText.innerHTML = '<i class="loading"></i> 正在检测位置...';
                    
                    // 设置位置检测超时，避免长时间等待
                    const locationPromise = this.locationService.getUserLocation();
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error('位置检测超时')), 5000);
                    });
                    
                    this.currentLocation = await Promise.race([locationPromise, timeoutPromise]);
                    
                    const locationDisplay = this.locationService.formatLocationDisplay(this.currentLocation);
                    const currencyName = this.locationService.getCurrencyName(this.currentLocation.currency);
                    
                    this.elements.locationText.innerHTML = `<i class="fas fa-map-marker-alt success"></i> ${locationDisplay}`;
                    this.elements.localCurrencyText.innerHTML = `<i class="fas fa-coins success"></i> 本地货币: ${currencyName} (${this.currentLocation.currency})`;
                    
                    if (this.currentLocation.currency) {
                        this.elements.fromCurrency.value = this.currentLocation.currency;
                    }
                    
                } catch (error) {
                    // 位置检测失败
                    this.elements.locationText.innerHTML = `<i class="fas fa-exclamation-triangle warning"></i> ${error.message}`;
                    this.elements.localCurrencyText.innerHTML = `<i class="fas fa-coins"></i> 使用默认货币: ${this.settings.defaultCurrency}`;
                    
                    // 位置检测失败时使用默认货币
                    this.elements.fromCurrency.value = this.settings.defaultCurrency;
                }
            }

            async initializeExchangeRates() {
                try {
                    const baseCurrency = this.elements.fromCurrency.value;
                    
                    // 设置超时控制，避免长时间等待汇率数据
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error('汇率数据获取超时')), 3000);
                    });
                    
                    const ratesPromise = this.exchangeAPI.getExchangeRates(baseCurrency);
                    
                    await Promise.race([ratesPromise, timeoutPromise]);
                } catch (error) {
                    // 汇率数据初始化失败
                    // 即使汇率获取失败，也不阻止应用启动
                }
            }

            async performConversion() {
                if (!this.isInitialized && !this.elements.fromAmount.value) {
                    return;
                }
                
                const amount = parseFloat(this.elements.fromAmount.value) || 0;
                const fromCurrency = this.elements.fromCurrency.value;
                const toCurrency = this.elements.toCurrency.value;
                
                if (amount <= 0) {
                    this.elements.toAmount.value = '';
                    this.updateRateDisplay('请输入有效金额');
                    return;
                }
                
                try {
                    this.showConversionLoading();
                    
                    const result = await this.exchangeAPI.convertCurrency(amount, fromCurrency, toCurrency);
                    
                    this.elements.toAmount.value = result.result.toFixed(6);
                    this.updateRateDisplay(result);
                    this.updateLastUpdateTime(result.timestamp);
                    
                    this.addToHistory({
                        amount,
                        fromCurrency,
                        toCurrency,
                        result: result.result,
                        rate: result.rate,
                        timestamp: Date.now()
                    });
                    
                } catch (error) {
                    console.error('货币转换失败:', error);
                    this.hideConversionLoading();
                    this.elements.toAmount.value = '';
                    this.updateRateDisplay('转换失败，请稍后重试');
                    this.showError('货币转换失败: ' + error.message);
                } finally {
                    this.hideConversionLoading();
                }
            }

            updateRateDisplay(result, type = 'normal') {
                const rateText = this.elements.rateText;
                
                if (typeof result === 'string') {
                    rateText.textContent = result;
                    rateText.className = `rate-text ${type}`;
                    return;
                }
                
                const fromCurrency = this.elements.fromCurrency.value;
                const toCurrency = this.elements.toCurrency.value;
                
                let displayText = `1 ${fromCurrency} = ${result.rate.toFixed(6)} ${toCurrency}`;
                
                rateText.className = 'rate-text';
                rateText.textContent = displayText;
            }

            swapCurrencies() {
                const fromCurrency = this.elements.fromCurrency.value;
                const toCurrency = this.elements.toCurrency.value;
                
                this.elements.fromCurrency.value = toCurrency;
                this.elements.toCurrency.value = fromCurrency;
                
                this.performConversion();
                this.updateChart();
            }

            setAmount(amount) {
                this.elements.fromAmount.value = amount;
                this.performConversion();
            }

            updateQuickButtonState(activeBtn) {
                this.elements.quickBtns.forEach(btn => {
                    btn.classList.remove('active');
                });
                activeBtn.classList.add('active');
            }

            async refreshRates() {
                try {
                    this.showMessage('正在刷新汇率...', 'info');
                    
                    this.exchangeAPI.clearCache();
                    await this.performConversion();
                    await this.updateChart();
                    
                    this.showMessage('汇率已更新', 'success');
                } catch (error) {
                    this.showError('刷新失败: ' + error.message);
                }
            }

            async updateChart() {
                if (!this.chart) return;
                
                try {
                    const fromCurrency = this.elements.fromCurrency.value;
                    const toCurrency = this.elements.toCurrency.value;
                    
                    const historicalData = await this.exchangeAPI.getHistoricalRates(fromCurrency, toCurrency, 30);
                    this.chart.updateData(historicalData, fromCurrency, toCurrency);
                } catch (error) {
                    // 图表更新失败
                }
            }

            openSettings() {
                this.loadSettingsToForm();
                this.elements.settingsModal.classList.add('show');
            }

            closeSettings() {
                this.elements.settingsModal.classList.remove('show');
            }

            loadSettingsToForm() {
                this.elements.autoDetectLocation.checked = this.settings.autoDetectLocation;
                this.elements.defaultCurrency.value = this.settings.defaultCurrency;
                this.elements.updateInterval.value = this.settings.updateInterval;
            }

            saveSettings() {
                this.settings = {
                    autoDetectLocation: this.elements.autoDetectLocation.checked,
                    defaultCurrency: this.elements.defaultCurrency.value,
                    updateInterval: parseInt(this.elements.updateInterval.value)
                };
                
                localStorage.setItem('currencyConverterSettings', JSON.stringify(this.settings));
                
                this.closeSettings();
                this.showMessage('设置已保存', 'success');
                
                // 如果位置检测设置发生变化，重新检测
                if (this.settings.autoDetectLocation) {
                    this.detectUserLocation();
                }
            }

            loadSettings() {
                const defaultSettings = {
                    autoDetectLocation: true,
                    defaultCurrency: 'CNY',
                    updateInterval: 15
                };
                
                try {
                    const saved = localStorage.getItem('currencyConverterSettings');
                    return saved ? { ...defaultSettings, ...JSON.parse(saved) } : defaultSettings;
                } catch (error) {
                    return defaultSettings;
                }
            }

            addToHistory(conversion) {
                this.conversionHistory.unshift(conversion);
                
                // 保持历史记录在50条以内
                if (this.conversionHistory.length > 50) {
                    this.conversionHistory = this.conversionHistory.slice(0, 50);
                }
                
                // 保存到本地存储
                try {
                    localStorage.setItem('conversionHistory', JSON.stringify(this.conversionHistory));
                } catch (error) {
                    // 无法保存转换历史
                }
            }

            showMessage(message, type = 'info') {
                // 创建消息提示
                const messageEl = document.createElement('div');
                messageEl.className = `message message-${type}`;
                messageEl.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : type === 'warning' ? '#ffc107' : '#17a2b8'};
                    color: white;
                    padding: 12px 20px;
                    border-radius: 6px;
                    z-index: 1001;
                    animation: slideInRight 0.3s ease;
                    max-width: 300px;
                    word-wrap: break-word;
                `;
                messageEl.textContent = message;
                
                document.body.appendChild(messageEl);
                
                // 3秒后自动移除
                setTimeout(() => {
                    if (messageEl.parentNode) {
                        messageEl.style.animation = 'slideOutRight 0.3s ease';
                        setTimeout(() => {
                            if (messageEl.parentNode) {
                                document.body.removeChild(messageEl);
                            }
                        }, 300);
                    }
                }, 3000);
            }

            showError(message) {
                this.showMessage(message, 'error');
            }

            showLoadingState() {
                // 显示加载状态
                document.body.classList.add('loading');
            }

            hideLoadingState() {
                // 隐藏加载状态
                document.body.classList.remove('loading');
            }

            showConversionLoading() {
                this.elements.rateText.innerHTML = '<i class="loading"></i> 正在转换...';
            }

            hideConversionLoading() {
                // 由updateRateDisplay处理
            }

            updateLastUpdateTime(timestamp) {
                const date = new Date(timestamp);
                const timeString = date.toLocaleTimeString('zh-CN');
                this.elements.lastUpdate.textContent = timeString;
            }

            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
        }

        // 应用程序初始化
        document.addEventListener('DOMContentLoaded', () => {
            const app = new CurrencyConverterApp();
            
            // 快速启动模式：立即显示基础界面
            app.initializeElements();
            app.bindEvents();
            app.initializeChart();
            
            // 设置初始状态，让用户立即看到可用的界面
            app.elements.locationText.innerHTML = '<i class="fas fa-map-marker-alt"></i> 准备就绪';
            app.elements.rateText.textContent = '请输入金额进行转换';
            
            // 后台异步初始化数据，不阻塞界面
            setTimeout(() => {
                app.init().catch(error => {
                    console.error('后台初始化失败:', error);
                });
            }, 100); // 延迟100ms启动后台初始化
            
            // 清除所有可能存在的loading动画
            setTimeout(() => {
                const loadingElements = document.querySelectorAll('.loading');
                loadingElements.forEach(el => {
                    if (el.tagName === 'I' && el.parentNode) {
                        // 清除残留的loading动画
                        el.remove();
                    }
                });
                document.body.classList.remove('loading');
            }, 8000); // 8秒后强制清除所有loading状态
        });
    </script>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 开发者信息组件功能
        // 显示开发者信息弹出框
        function showDeveloperInfo() {
            const modal = document.getElementById('developerModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // 隐藏开发者信息弹出框
        function hideDeveloperInfo(event) {
            // 如果点击的是模态框背景或者是关闭按钮，则关闭模态框
            if (!event || event.target === event.currentTarget || event.target.classList.contains('close-btn')) {
                const modal = document.getElementById('developerModal');
                modal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
        }
        
        // 复制微信号功能
        function copyWechatId(element) {
            const wechatId = element.getAttribute('data-wechat');
            
            // 使用现代剪贴板API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    showCopyTooltip(element, '复制成功！');
                }).catch(() => {
                    fallbackCopyTextToClipboard(wechatId, element);
                });
            } else {
                // 降级方案
                fallbackCopyTextToClipboard(wechatId, element);
            }
        }
        
        // 降级复制方案
        function fallbackCopyTextToClipboard(text, element) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyTooltip(element, '复制成功！');
                } else {
                    showCopyTooltip(element, '复制失败');
                }
            } catch (err) {
                showCopyTooltip(element, '复制失败');
            }
            
            document.body.removeChild(textArea);
        }
        
        // 显示复制提示
        function showCopyTooltip(element, message) {
            // 创建临时提示元素
            const tooltip = document.createElement('div');
            tooltip.textContent = message;
            tooltip.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #1f2937;
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                font-size: 0.9rem;
                z-index: 3000;
                opacity: 0;
                transition: opacity 0.3s ease;
            `;
            
            document.body.appendChild(tooltip);
            
            // 显示动画
            setTimeout(() => {
                tooltip.style.opacity = '1';
            }, 10);
            
            // 隐藏并移除
            setTimeout(() => {
                tooltip.style.opacity = '0';
                setTimeout(() => {
                    if (tooltip.parentNode) {
                        tooltip.parentNode.removeChild(tooltip);
                    }
                }, 300);
            }, 2000);
        }
        
        // 键盘事件支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideDeveloperInfo();
            }
        });
        
        // 为微信号添加键盘支持
        document.addEventListener('DOMContentLoaded', function() {
            const wechatElement = document.querySelector('.wechat-id');
            if (wechatElement) {
                wechatElement.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        copyWechatId(this);
                    }
                });
            }
        });
    </script>
