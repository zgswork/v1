        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const resultAddress = document.getElementById('resultAddress');
        const resultTransport = document.getElementById('resultTransport');
        const resultTicket = document.getElementById('resultTicket');
        const resultTime = document.getElementById('resultTime');
        const modal = document.getElementById('myModal');
        const closeBtn = document.querySelector('.close');

        // 记录已显示的景点索引
        let shownAttractions = [];

        // 随机生成景点攻略
        function generateAttraction() {
            // 如果所有景点都已显示过，重置记录
            if (shownAttractions.length === attractions.length) {
                shownAttractions = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownAttractions.includes(randomIndex));
            
            shownAttractions.push(randomIndex);
            
            const attraction = attractions[randomIndex];
            
            resultTitle.textContent = attraction.name;
            resultDesc.textContent = attraction.desc;
            resultAddress.textContent = attraction.address;
            resultTransport.textContent = attraction.transport;
            resultTicket.textContent = attraction.ticket;
            resultTime.textContent = attraction.time;
            
            resultContainer.style.display = 'block';
        }

        // 按钮事件监听
        generateBtn.addEventListener('click', function() {
            generateAttraction();
            generateBtn.textContent = '再换一个景点';
        });
        
        changeBtn.addEventListener('click', generateAttraction);

        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });

        // 初始隐藏结果容器
        resultContainer.style.display = 'none';
    </script>
</body>
</html>
