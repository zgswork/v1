<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 背景装饰元素 */
        .bg-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .floating-shape:nth-child(1) {
            top: 20%;
            left: 10%;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            top: 60%;
            right: 15%;
            width: 40px;
            height: 40px;
            background: white;
            transform: rotate(45deg);
            animation-delay: 5s;
        }

        .floating-shape:nth-child(3) {
            bottom: 30%;
            left: 20%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            animation-delay: 10s;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 40px;
        }

        .logo {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);

        @keyframes pulse {
            0%, 100% { transform: scale(1); }

        h1 {

            -webkit-text-fill-color: transparent;

        .modal-content {

        .modal h2 {

        .contact-item {

            color: white;
            border-radius: 10px;
            font-weight: 500;
        }
    </style>
</head>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // QR码生成库 - 使用qrcode.js的简化版本
        function QRCode(element, options) {
            this.element = element;
            this.options = Object.assign({
                width: 300,
                height: 300,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            }, options);
        }

        QRCode.CorrectLevel = {
            L: 1,
            M: 0,
            Q: 3,
            H: 2
        };

        // 简化的QR码生成算法
        QRCode.prototype.makeCode = function(text) {
            this.element.innerHTML = '';
            
            if (!text) {
                return;
            }

            // 创建canvas元素
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = this.options.width;
            
            canvas.width = size;
            canvas.height = size;
            canvas.style.display = 'block';
            canvas.style.margin = '0 auto';
            
            // 使用第三方API生成QR码
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                ctx.drawImage(img, 0, 0, size, size);
                this.element.appendChild(canvas);
                
                // 显示下载按钮
                const downloadBtn = document.getElementById('downloadBtn');
                if (downloadBtn) {
                    downloadBtn.style.display = 'inline-block';
                }
            };
            
            img.onerror = () => {
                // 如果API失败，使用备用方案
                this.generateFallbackQR(text, canvas, ctx, size);
            };
            
            img.src = qrApiUrl;
        };

        // 备用QR码生成方案
        QRCode.prototype.generateFallbackQR = function(text, canvas, ctx, size) {
            // 简单的网格模式QR码
            const gridSize = 25;
            const cellSize = size / gridSize;
            
            // 清空画布
            ctx.fillStyle = this.options.colorLight;
            ctx.fillRect(0, 0, size, size);
            
            // 生成伪随机模式（基于文本内容）
            ctx.fillStyle = this.options.colorDark;
            
            // 绘制定位标记
            this.drawFinderPattern(ctx, 0, 0, cellSize);
            this.drawFinderPattern(ctx, (gridSize - 7) * cellSize, 0, cellSize);
            this.drawFinderPattern(ctx, 0, (gridSize - 7) * cellSize, cellSize);
            
            // 基于文本内容生成数据模式
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash + text.charCodeAt(i)) & 0xffffffff;
            }
            
            // 填充数据区域
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    // 跳过定位标记区域
                    if (this.isFinderPattern(row, col, gridSize)) continue;
                    
                    // 基于哈希值决定是否填充
                    const seed = (row * gridSize + col + hash) % 100;
                    if (seed < 45) {
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
            
            this.element.appendChild(canvas);
            
            // 显示下载按钮
            const downloadBtn = document.getElementById('downloadBtn');
            if (downloadBtn) {
                downloadBtn.style.display = 'inline-block';
            }
        };

        // 绘制定位标记
        QRCode.prototype.drawFinderPattern = function(ctx, x, y, cellSize) {
            // 外框 7x7
            ctx.fillRect(x, y, 7 * cellSize, 7 * cellSize);
            
            // 内部白色 5x5
            ctx.fillStyle = this.options.colorLight;
            ctx.fillRect(x + cellSize, y + cellSize, 5 * cellSize, 5 * cellSize);
            
            // 中心黑色 3x3
            ctx.fillStyle = this.options.colorDark;
            ctx.fillRect(x + 2 * cellSize, y + 2 * cellSize, 3 * cellSize, 3 * cellSize);
        };

        // 检查是否为定位标记区域
        QRCode.prototype.isFinderPattern = function(row, col, gridSize) {
            return (row < 9 && col < 9) || 
                   (row < 9 && col >= gridSize - 8) || 
                   (row >= gridSize - 8 && col < 9);
        };

        let qr = null;

        function generateQR() {
            const textInput = document.getElementById('textInput');
            const sizeSelect = document.getElementById('sizeSelect');
            const qrContainer = document.getElementById('qrContainer');
            const text = textInput.value.trim();

            // 清除之前的错误信息
            const existingError = document.querySelector('.error');
            if (existingError) {
                existingError.remove();
            }

            if (!text) {
                showError('请输入要生成QR码的文本');
                return;
            }

            const size = parseInt(sizeSelect.value);
            
            // 添加生成中的状态
            qrContainer.innerHTML = `
                <div class="generating">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <div style="margin-top: 15px; color: #667eea; font-weight: 500;">正在生成QR码...</div>
                </div>
            `;
            
            // 添加CSS样式用于加载动画
            if (!document.querySelector('#loading-styles')) {
                const style = document.createElement('style');
                style.id = 'loading-styles';
                style.textContent = `
                    .generating {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        padding: 40px;
                    }
                    .loading-spinner {
                        font-size: 32px;
                        color: #667eea;
                    }
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                    .fa-spin {
                        animation: spin 1s linear infinite;
                    }
                `;
                document.head.appendChild(style);
            }

            // 延迟一点时间显示加载效果
            setTimeout(() => {
                // 清空容器并添加QR码区域
                qrContainer.innerHTML = '<div class="qr-code"></div>';
                qrContainer.classList.add('has-qr');
                
                // 添加下载按钮
                const downloadBtn = document.createElement('button');
                downloadBtn.id = 'downloadBtn';
                downloadBtn.className = 'download-btn';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> 下载QR码';
                downloadBtn.onclick = downloadQR;
                qrContainer.appendChild(downloadBtn);

                // 创建QR码
                const qrCodeDiv = qrContainer.querySelector('.qr-code');
                qr = new QRCode(qrCodeDiv, {
                    width: size,
                    height: size,
                    colorDark: '#000000',
                    colorLight: '#ffffff'
                });

                qr.makeCode(text);
            }, 800);
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrContainer canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = `qrcode-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                
                // 添加下载动画效果
                const downloadBtn = document.getElementById('downloadBtn');
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '<i class="fas fa-check"></i> 已下载';
                downloadBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                
                setTimeout(() => {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.style.background = '';
                }, 2000);
                
                link.click();
            }
        }

        function showError(message) {
            const qrContainer = document.getElementById('qrContainer');
            qrContainer.classList.remove('has-qr');
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            qrContainer.appendChild(errorDiv);
        }

        // 回车键生成QR码
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR();
            }
        });

        // 实时字符计数
        document.getElementById('textInput').addEventListener('input', function(e) {
            const maxLength = 2000;
            const currentLength = e.target.value.length;
            
            // 移除之前的计数器
            const existingCounter = document.querySelector('.char-counter');
            if (existingCounter) {
                existingCounter.remove();
            }
            
            // 添加字符计数器
            if (currentLength > 0) {
                const counter = document.createElement('div');
                counter.className = 'char-counter';
                counter.style.cssText = 'font-size: 12px; color: #666; text-align: right; margin-top: 5px;';
                counter.textContent = `${currentLength}/${maxLength}`;
                
                if (currentLength > maxLength * 0.9) {
                    counter.style.color = '#dc3545';
                }
                
                e.target.parentNode.appendChild(counter);
            }
        });

        // 联系我们模态框功能
        function openContactModal() {
            document.getElementById('contactModal').style.display = 'block';
        }

        function closeContactModal() {
            document.getElementById('contactModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('contactModal');
            if (event.target === modal) {
                closeContactModal();
            }
        }

        // ESC键关闭模态框
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeContactModal();
            }
        });
    </script>
</body>
</html>
