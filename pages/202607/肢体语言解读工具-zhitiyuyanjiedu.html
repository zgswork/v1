                sceneButtons.forEach(btn => {
                    btn.classList.remove('bg-primary/10', 'border-primary');
                    btn.classList.add('bg-neutral');
                });
                
                // 添加当前按钮的选中状态
                this.classList.remove('bg-neutral');
                this.classList.add('bg-primary/10', 'border-primary');
                
                const sceneCode = this.getAttribute('data-scene');
                displaySceneLanguage(sceneCode);
            });
        });

        // 显示所选场景的肢体语言
        function displaySceneLanguage(sceneCode) {
            const sceneData = bodyLanguageDatabase[sceneCode];
            
            if (!sceneData) return;
            
            // 更新标题和副标题
            resultTitle.textContent = sceneData.name;
            resultSubtitle.textContent = sceneData.description;
            
            // 清空并填充肢体语言内容
            bodyLanguageContent.innerHTML = '';
            
            sceneData.items.forEach((item, index) => {
                const languageElement = document.createElement('div');
                languageElement.className = 'language-item animate-fadeIn';
                languageElement.style.animationDelay = `${index * 0.1}s`;
                languageElement.innerHTML = `

            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('py-2', 'shadow');
                header.classList.remove('py-4', 'shadow-sm');
            } else {
                header.classList.add('py-4', 'shadow-sm');
                header.classList.remove('py-2', 'shadow');
            }
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fadeIn {
                animation: fadeIn 0.5s ease forwards;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
