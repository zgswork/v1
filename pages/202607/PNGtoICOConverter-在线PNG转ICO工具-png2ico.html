<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG to ICO Converter - 在线PNG转ICO工具</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 语言切换 */
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 12px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .lang-btn:hover,
        .lang-btn.active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            color: white;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* 主要内容 */
        .main {
            padding-bottom: 30px;
        }

        /* 上传和设置行布局 */
        .upload-settings-row {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 20px;
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: fit-content;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-header h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
        }

        .card-header p {
            color: #666;
            font-size: 0.9rem;
        }

        /* 上传区域 */
        .upload-area {
            padding: 30px 20px;
            text-align: center;
            border: 3px dashed #ddd;
            margin: 20px;
            border-radius: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-card {
            min-height: 300px;
        }

        .settings-card {
            max-width: 400px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .settings-card .settings-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-content p {
            margin-bottom: 20px;
            color: #666;
            font-size: 1.1rem;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(86, 171, 47, 0.4);
        }

        .btn-info {
            background: linear-gradient(45deg, #3498db, #74b9ff);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 设置区域 */
        .settings-content {
            padding: 20px;
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .setting-group label {
            font-weight: 500;
            color: #333;
        }

        .setting-group select,
        .setting-group input[type="range"] {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .setting-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .setting-group input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #e0e0e0;
            border-radius: 5px;
        }

        .setting-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 文件列表 */
        .batch-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .files-list {
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .file-preview {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9rem;
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .file-status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        /* 进度提示 */
        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .progress-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 25px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .notification.show {
            opacity: 1;
            pointer-events: auto;
        }

        .notification.success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
        }

        .notification.error {
            background: linear-gradient(45deg, #e74c3c, #f39c12);
        }

        .notification.info {
            background: linear-gradient(45deg, #3498db, #74b9ff);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .upload-settings-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .settings-card {
                max-width: 100%;
            }
            
            .card-header {
                padding: 15px;
            }
            
            .upload-area {
                margin: 15px;
                padding: 20px 15px;
            }
            
            .upload-card {
                min-height: 250px;
            }
            
            .settings-content {
                padding: 15px;
            }
            
            .batch-actions {
                flex-direction: column;
                margin-left: 0;
                margin-top: 15px;
            }
            
            .file-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .file-actions {
                justify-content: center;
            }
            
            .language-switcher {
                top: 10px;
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.5rem;
            }
            
            .upload-icon {
                font-size: 2rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 语言切换 -->
    <div class="language-switcher">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <!-- 头部 -->
    <header class="header">
        <div class="container">
            <h1 class="title" data-i18n="title">PNG to ICO Converter</h1>
            <p class="subtitle" data-i18n="subtitle">快速、免费的在线PNG转ICO工具</p>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="main">
        <div class="container">
            <!-- 上传和设置区域 -->
            <div class="upload-settings-row">
                <!-- 上传区域 -->
                <div class="card upload-card">
                    <div class="card-header">
                        <h2 data-i18n="upload_title">上传PNG图片</h2>
                        <p data-i18n="upload_desc">支持单个或批量上传PNG格式图片</p>
                    </div>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-content">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <p data-i18n="drag_drop">拖拽文件到此处或点击选择文件</p>
                            <input type="file" id="fileInput" multiple accept=".png" hidden>
                            <button class="btn btn-primary" id="selectBtn" data-i18n="select_files">选择文件</button>
                        </div>
                    </div>
                </div>

                <!-- 设置区域 -->
                <div class="card settings-card">
                    <div class="card-header">
                        <h2 data-i18n="settings_title">转换设置</h2>
                    </div>
                    <div class="settings-content">
                        <div class="setting-group">
                            <label data-i18n="size_label">ICO尺寸:</label>
                            <select id="sizeSelect">
                                <option value="16">16x16</option>
                                <option value="32" selected>32x32</option>
                                <option value="48">48x48</option>
                                <option value="64">64x64</option>
                                <option value="128">128x128</option>
                                <option value="256">256x256</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label data-i18n="quality_label">图片质量:</label>
                            <input type="range" id="qualityRange" min="1" max="100" value="90">
                            <span id="qualityValue">90%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 文件列表 -->
            <div class="card files-card" id="filesCard" style="display: none;">
                <div class="card-header">
                    <h2 data-i18n="files_title">文件列表</h2>
                    <div class="batch-actions">
                        <button class="btn btn-success" id="convertAllBtn" data-i18n="convert_all">全部转换</button>
                        <button class="btn btn-info" id="downloadAllBtn" data-i18n="download_all" disabled>全部下载</button>
                    </div>
                </div>
                <div class="files-list" id="filesList"></div>
            </div>
        </div>
    </main>

    <!-- 进度提示 -->
    <div class="progress-overlay" id="progressOverlay" style="display: none;">
        <div class="progress-content">
            <div class="spinner"></div>
            <p data-i18n="processing">正在处理中...</p>
        </div>
    </div>

    <!-- 通知 -->
    <div class="notification" id="notification"></div>

    <script>
        // 多语言支持
        const translations = {
            zh: {
                title: 'PNG to ICO Converter',
                subtitle: '快速、免费的在线PNG转ICO工具',
                upload_title: '上传PNG图片',
                upload_desc: '支持单个或批量上传PNG格式图片',
                drag_drop: '拖拽文件到此处或点击选择文件',
                select_files: '选择文件',
                settings_title: '转换设置',
                size_label: 'ICO尺寸:',
                quality_label: '图片质量:',
                files_title: '文件列表',
                convert_all: '全部转换',
                download_all: '全部下载',
                processing: '正在处理中...',
                convert: '转换',
                download: '下载',
                pending: '等待中',
                processing_status: '处理中',
                completed: '已完成',
                error: '错误',
                success_upload: '文件上传成功！',
                error_upload: '文件上传失败，请重试',
                success_convert: '转换完成！',
                error_convert: '转换失败，请重试',
                invalid_file: '请选择有效的PNG文件',
                file_too_large: '文件大小不能超过10MB'
            },
            en: {
                title: 'PNG to ICO Converter',
                subtitle: 'Fast, free online PNG to ICO conversion tool',
                upload_title: 'Upload PNG Images',
                upload_desc: 'Support single or batch upload of PNG format images',
                drag_drop: 'Drag files here or click to select files',
                select_files: 'Select Files',
                settings_title: 'Conversion Settings',
                size_label: 'ICO Size:',
                quality_label: 'Image Quality:',
                files_title: 'File List',
                convert_all: 'Convert All',
                download_all: 'Download All',
                processing: 'Processing...',
                convert: 'Convert',
                download: 'Download',
                pending: 'Pending',
                processing_status: 'Processing',
                completed: 'Completed',
                error: 'Error',
                success_upload: 'Files uploaded successfully!',
                error_upload: 'File upload failed, please try again',
                success_convert: 'Conversion completed!',
                error_convert: 'Conversion failed, please try again',
                invalid_file: 'Please select valid PNG files',
                file_too_large: 'File size cannot exceed 10MB'
            }
        };

        // 全局变量
        let currentLang = 'zh';
        let uploadedFiles = [];
        let convertedFiles = [];

        // DOM元素
        const elements = {
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            selectBtn: document.getElementById('selectBtn'),
            filesCard: document.getElementById('filesCard'),
            filesList: document.getElementById('filesList'),
            convertAllBtn: document.getElementById('convertAllBtn'),
            downloadAllBtn: document.getElementById('downloadAllBtn'),
            sizeSelect: document.getElementById('sizeSelect'),
            qualityRange: document.getElementById('qualityRange'),
            qualityValue: document.getElementById('qualityValue'),
            progressOverlay: document.getElementById('progressOverlay'),
            notification: document.getElementById('notification')
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            setupEventListeners();
            setupLanguageSwitcher();
            updateLanguage();
            updateQualityDisplay();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 文件上传
            elements.selectBtn.addEventListener('click', () => elements.fileInput.click());
            elements.fileInput.addEventListener('change', handleFileSelect);
            
            // 拖拽上传
            elements.uploadArea.addEventListener('dragover', handleDragOver);
            elements.uploadArea.addEventListener('dragleave', handleDragLeave);
            elements.uploadArea.addEventListener('drop', handleDrop);
            elements.uploadArea.addEventListener('click', () => elements.fileInput.click());
            
            // 批量操作
            elements.convertAllBtn.addEventListener('click', convertAllFiles);
            elements.downloadAllBtn.addEventListener('click', downloadAllFiles);
            
            // 质量滑块
            elements.qualityRange.addEventListener('input', updateQualityDisplay);
        }

        // 语言切换
        function setupLanguageSwitcher() {
            const langBtns = document.querySelectorAll('.lang-btn');
            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.dataset.lang;
                    switchLanguage(lang);
                });
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;
            updateLanguage();
            
            // 更新按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function updateLanguage() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.dataset.i18n;
                if (translations[currentLang][key]) {
                    element.textContent = translations[currentLang][key];
                }
            });
            
            // 更新placeholder
            const placeholderElements = document.querySelectorAll('[data-i18n-placeholder]');
            placeholderElements.forEach(element => {
                const key = element.dataset.i18nPlaceholder;
                if (translations[currentLang][key]) {
                    element.placeholder = translations[currentLang][key];
                }
            });
        }

        // 文件处理
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            processFiles(files);
        }

        function handleDragOver(event) {
            event.preventDefault();
            elements.uploadArea.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.preventDefault();
            elements.uploadArea.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            elements.uploadArea.classList.remove('dragover');
            const files = Array.from(event.dataTransfer.files);
            processFiles(files);
        }

        function processFiles(files) {
            const validFiles = files.filter(file => {
                if (!file.type.includes('png')) {
                    showNotification(translations[currentLang].invalid_file, 'error');
                    return false;
                }
                if (file.size > 10 * 1024 * 1024) { // 10MB limit
                    showNotification(translations[currentLang].file_too_large, 'error');
                    return false;
                }
                return true;
            });
            
            if (validFiles.length > 0) {
                uploadedFiles.push(...validFiles);
                displayFiles();
                showNotification(translations[currentLang].success_upload, 'success');
            }
        }

        function displayFiles() {
            elements.filesCard.style.display = 'block';
            elements.filesList.innerHTML = '';
            
            uploadedFiles.forEach((file, index) => {
                const fileItem = createFileItem(file, index);
                elements.filesList.appendChild(fileItem);
            });
            
            updateBatchButtons();
        }

        function createFileItem(file, index) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <img class="file-preview" src="${URL.createObjectURL(file)}" alt="Preview">
                <div class="file-info">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${formatFileSize(file.size)}</div>
                </div>
                <div class="file-actions">
                    <span class="file-status status-pending" id="status-${index}">${translations[currentLang].pending}</span>
                    <button class="btn btn-primary" onclick="convertFile(${index})" id="convert-${index}">${translations[currentLang].convert}</button>
                    <button class="btn btn-success" onclick="downloadFile(${index})" id="download-${index}" style="display: none;">${translations[currentLang].download}</button>
                </div>
            `;
            return div;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ICO格式转换器类
        class PngToIcoConverter {
            constructor() {
                // ICO文件格式常量
                this.MAX_SIZE = 256;           // 最大尺寸 (1 << 8)
                this.MAX_FILES = 65536;        // 最大文件数 (1 << 16)
                this.FILE_HEADER_SIZE = 6;     // 文件头大小
                this.IMAGE_HEADER_SIZE = 16;   // 图像头大小
                this.ICO_MIME = "image/x-icon"; // ICO MIME类型
            }

            /**
             * 将PNG文件转换为ICO格式的Blob
             * @param {File} pngFile - PNG文件
             * @param {number} targetSize - 目标尺寸
             * @returns {Promise<Blob>} ICO格式的Blob
             */
            async convertToIcoBlob(pngFile, targetSize = 32) {
                try {
                    // 1. 加载并调整PNG图像尺寸
                    const resizedPngBlob = await this.resizePngImage(pngFile, targetSize);
                    
                    // 2. 创建ICO文件结构
                    const icoBuffer = await this.createIcoFile([{
                        png: resizedPngBlob,
                        size: targetSize
                    }]);
                    
                    // 3. 返回ICO格式的Blob
                    return new Blob([icoBuffer], { type: this.ICO_MIME });
                } catch (error) {
                    console.error('ICO转换失败:', error);
                    throw new Error('ICO转换失败: ' + error.message);
                }
            }

            /**
             * 调整PNG图像尺寸
             * @param {File} file - 原始PNG文件
             * @param {number} targetSize - 目标尺寸
             * @returns {Promise<Blob>} 调整尺寸后的PNG Blob
             */
            async resizePngImage(file, targetSize) {
                return new Promise((resolve, reject) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    
                    img.onload = () => {
                        try {
                            // 设置画布尺寸
                            canvas.width = targetSize;
                            canvas.height = targetSize;
                            
                            // 清除画布并设置透明背景
                            ctx.clearRect(0, 0, targetSize, targetSize);
                            
                            // 计算缩放比例，保持宽高比
                            const scale = Math.min(targetSize / img.width, targetSize / img.height);
                            const scaledWidth = img.width * scale;
                            const scaledHeight = img.height * scale;
                            
                            // 居中绘制图像
                            const x = (targetSize - scaledWidth) / 2;
                            const y = (targetSize - scaledHeight) / 2;
                            
                            // 使用高质量缩放
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            
                            // 绘制图像
                            ctx.drawImage(img, x, y, scaledWidth, scaledHeight);
                            
                            // 转换为PNG Blob
                            canvas.toBlob((blob) => {
                                if (blob) {
                                    resolve(blob);
                                } else {
                                    reject(new Error('Canvas转换失败'));
                                }
                            }, 'image/png', 1.0); // 使用最高质量
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    img.onerror = () => reject(new Error('图像加载失败'));
                    img.src = URL.createObjectURL(file);
                });
            }

            /**
             * 创建ICO文件
             * @param {Array} inputs - 输入图像数组
             * @returns {Promise<Uint8Array>} ICO文件的字节数组
             */
            async createIcoFile(inputs) {
                const inputCount = inputs.length;
                if (inputCount > this.MAX_FILES) {
                    throw new Error('文件数量过多');
                }

                // 计算总文件大小
                const headersLength = this.FILE_HEADER_SIZE + this.IMAGE_HEADER_SIZE * inputCount;
                let totalLength = headersLength;
                
                // 预处理所有输入，计算总大小
                const processedInputs = [];
                for (const input of inputs) {
                    const blob = input.png;
                    const img = await this.loadImageFromBlob(blob);
                    const size = input.size || Math.min(img.naturalWidth, img.naturalHeight);
                    
                    processedInputs.push({
                        blob: blob,
                        img: img,
                        size: size
                    });
                    
                    totalLength += blob.size;
                }

                // 创建ICO文件缓冲区
                const buffer = new Uint8Array(totalLength);
                
                // 写入文件头 (6字节)
                // 前2字节: 保留字段 (0)
                // 第3-4字节: 文件类型 (1 = ICO)
                // 第5-6字节: 图像数量
                buffer.set([0, 0, 1, 0, ...this.numberTo2Bytes(inputCount)], 0);
                
                // 写入图像头和数据
                let imageDataOffset = headersLength;
                
                for (let i = 0; i < processedInputs.length; i++) {
                    const headerOffset = this.FILE_HEADER_SIZE + this.IMAGE_HEADER_SIZE * i;
                    const input = processedInputs[i];
                    const size = input.size;
                    
                    // 写入图像头 (16字节)
                    buffer.set([
                        size > this.MAX_SIZE ? 0 : size,  // 宽度 (0表示256)
                        size > this.MAX_SIZE ? 0 : size,  // 高度 (0表示256)
                        0,                                 // 调色板颜色数 (0表示无调色板)
                        0,                                 // 保留字段
                        0, 0,                             // 颜色平面数 (0或1)
                        32, 0,                            // 每像素位数 (32位RGBA)
                        ...this.numberTo4Bytes(input.blob.size),      // 图像数据大小
                        ...this.numberTo4Bytes(imageDataOffset)       // 图像数据偏移
                    ], headerOffset);
                    
                    // 写入图像数据
                    const imageBuffer = await input.blob.arrayBuffer();
                    buffer.set(new Uint8Array(imageBuffer), imageDataOffset);
                    imageDataOffset += input.blob.size;
                }
                
                return buffer;
            }

            /**
             * 从Blob加载图像
             * @param {Blob} blob - 图像Blob
             * @returns {Promise<HTMLImageElement>} 加载的图像元素
             */
            loadImageFromBlob(blob) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        URL.revokeObjectURL(img.src); // 清理内存
                        resolve(img);
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(img.src); // 清理内存
                        reject(new Error('无效的图像格式'));
                    };
                    img.src = URL.createObjectURL(blob);
                });
            }

            /**
             * 将数字转换为2字节小端序数组
             * @param {number} num - 要转换的数字
             * @returns {Array<number>} 2字节数组
             */
            numberTo2Bytes(num) {
                return [num & 255, (num >> 8) & 255];
            }

            /**
             * 将数字转换为4字节小端序数组
             * @param {number} num - 要转换的数字
             * @returns {Array<number>} 4字节数组
             */
            numberTo4Bytes(num) {
                return [
                    num & 255,
                    (num >> 8) & 255,
                    (num >> 16) & 255,
                    (num >> 24) & 255
                ];
            }
        }

        // 全局转换器实例
        const icoConverter = new PngToIcoConverter();

        // 转换功能
        async function convertFile(index) {
            const file = uploadedFiles[index];
            const statusElement = document.getElementById(`status-${index}`);
            const convertBtn = document.getElementById(`convert-${index}`);
            const downloadBtn = document.getElementById(`download-${index}`);
            
            try {
                // 更新状态
                statusElement.textContent = translations[currentLang].processing_status;
                statusElement.className = 'file-status status-processing';
                convertBtn.disabled = true;
                
                // 获取用户设置
                const targetSize = parseInt(elements.sizeSelect.value);
                
                // 使用专业的ICO转换器
                const convertedBlob = await icoConverter.convertToIcoBlob(file, targetSize);
                
                // 保存转换结果
                convertedFiles[index] = {
                    blob: convertedBlob,
                    filename: file.name.replace(/\.png$/i, '.ico')
                };
                
                // 更新UI
                statusElement.textContent = translations[currentLang].completed;
                statusElement.className = 'file-status status-completed';
                convertBtn.style.display = 'none';
                downloadBtn.style.display = 'inline-block';
                
                updateBatchButtons();
                showNotification(translations[currentLang].success_convert, 'success');
                
            } catch (error) {
                console.error('转换错误:', error);
                statusElement.textContent = translations[currentLang].error;
                statusElement.className = 'file-status status-error';
                convertBtn.disabled = false;
                showNotification(translations[currentLang].error_convert, 'error');
            }
        }

        // 保持向后兼容的转换函数
        async function convertPngToIco(file) {
            const targetSize = parseInt(elements.sizeSelect.value);
            return await icoConverter.convertToIcoBlob(file, targetSize);
        }

        function downloadFile(index) {
            const convertedFile = convertedFiles[index];
            if (convertedFile) {
                const url = URL.createObjectURL(convertedFile.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = convertedFile.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        // 批量操作
        async function convertAllFiles() {
            elements.progressOverlay.style.display = 'flex';
            
            try {
                for (let i = 0; i < uploadedFiles.length; i++) {
                    if (!convertedFiles[i]) {
                        await convertFile(i);
                        // 添加延迟以避免浏览器卡顿
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }
                showNotification(translations[currentLang].success_convert, 'success');
            } catch (error) {
                showNotification(translations[currentLang].error_convert, 'error');
            } finally {
                elements.progressOverlay.style.display = 'none';
            }
        }

        function downloadAllFiles() {
            convertedFiles.forEach((file, index) => {
                if (file) {
                    setTimeout(() => downloadFile(index), index * 100);
                }
            });
        }

        function updateBatchButtons() {
            const hasFiles = uploadedFiles.length > 0;
            const allConverted = convertedFiles.filter(f => f).length === uploadedFiles.length;
            
            elements.convertAllBtn.disabled = !hasFiles || allConverted;
            elements.downloadAllBtn.disabled = !allConverted;
        }

        // 质量显示更新
        function updateQualityDisplay() {
            elements.qualityValue.textContent = elements.qualityRange.value + '%';
        }

        // 通知系统
        function showNotification(message, type = 'info') {
            elements.notification.textContent = message;
            elements.notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                elements.notification.classList.remove('show');
            }, 3000);
        }

        // 初始化语言
        document.querySelector('.lang-btn[data-lang="zh"]').classList.add('active');
    </script>
</body>
</html>
