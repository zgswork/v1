<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft - 在线HTML编辑器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --dark: #0d1b2a;
            --light: #f8f9fa;
            --editor-bg: #1e1e1e;
            --preview-bg: #ffffff;
            --border: #3a3a3a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo i {
            font-size: 2.2rem;
            color: var(--success);
        }
        
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--success), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .btn i {
            font-size: 1.1rem;
        }
        
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 70vh;
        }
        
        .editors {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        
        .code-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--editor-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .editor-header {
            background: #252526;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .editor-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #d4d4d4;
        }
        
        .editor-title i {
            color: var(--success);
        }
        
        .editor-content {
            flex: 1;
            padding: 15px;
        }
        
        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        
        .preview {
            flex: 1;
            background: var(--preview-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        
        .preview-header {
            background: #252526;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .preview-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #d4d4d4;
        }
        
        .preview-title i {
            color: #f72585;
        }
        
        .preview-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            color: #333;
        }
        
        .file-manager {
            background: rgba(13, 27, 42, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .file-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .file-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .file-info i {
            color: var(--success);
            font-size: 1.2rem;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
        }
        
        .file-btn {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        
        .file-btn:hover {
            color: var(--success);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: var(--dark);
            padding: 15px 25px;
            border-radius: 5px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(200%);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .editors {
                flex-direction: column;
            }
            
            .editor-container {
                height: auto;
            }
            
            .code-editor {
                min-height: 200px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .file-list {
                grid-template-columns: 1fr;
            }
        }
        
        /* 代码高亮效果 */
        textarea:focus {
            box-shadow: 0 0 0 2px var(--primary);
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-code"></i>
                <h1>WebCraft HTML编辑器</h1>
            </div>
            <div class="controls">
                <button class="btn" id="runBtn">
                    <i class="fas fa-play"></i> 运行代码
                </button>
                <button class="btn" id="saveBtn">
                    <i class="fas fa-save"></i> 保存文件
                </button>
                <button class="btn" id="newBtn">
                    <i class="fas fa-file"></i> 新建文件
                </button>
                <button class="btn" id="clearBtn">
                    <i class="fas fa-broom"></i> 清空
                </button>
            </div>
        </header>
        
        <div class="editor-container">
            <div class="editors">
                <div class="code-editor">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fab fa-html5"></i>
                            <span>HTML</span>
                        </div>
                    </div>
                    <div class="editor-content">
                        <textarea id="htmlCode" placeholder="在此编写HTML代码...">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;我的网页&lt;/title&gt;
    &lt;style&gt;
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0f8ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #4361ee;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 20px 0;
        }
        .btn {
            background: #4361ee;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class="container"&gt;
        &lt;h1&gt;欢迎使用WebCraft编辑器&lt;/h1&gt;
        &lt;div class="card"&gt;
            &lt;p&gt;这是一个使用在线HTML编辑器创建的示例页面&lt;/p&gt;
            &lt;button class="btn"&gt;点击我&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class="card"&gt;
            &lt;h3&gt;功能特性&lt;/h3&gt;
            &lt;ul style="text-align: left;"&gt;
                &lt;li&gt;实时预览HTML/CSS/JS效果&lt;/li&gt;
                &lt;li&gt;响应式设计，适配所有设备&lt;/li&gt;
                &lt;li&gt;本地文件存储管理&lt;/li&gt;
                &lt;li&gt;简洁易用的界面&lt;/li&gt;
            &lt;/ul&gt;
        &lt;/div&gt;
    &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                    </div>
                </div>
                
                <div class="code-editor">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fab fa-css3-alt"></i>
                            <span>CSS</span>
                        </div>
                    </div>
                    <div class="editor-content">
                        <textarea id="cssCode" placeholder="在此编写CSS代码...">/* 添加自定义CSS样式 */
.container {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.btn {
    transition: all 0.3s ease;
}

.btn:hover {
    background: #3a0ca3;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}</textarea>
                    </div>
                </div>
                
                <div class="code-editor">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fab fa-js"></i>
                            <span>JavaScript</span>
                        </div>
                    </div>
                    <div class="editor-content">
                        <textarea id="jsCode" placeholder="在此编写JavaScript代码...">// 添加交互功能
document.addEventListener('DOMContentLoaded', function() {
    const buttons = document.querySelectorAll('.btn');
    
    buttons.forEach(button => {
        button.addEventListener('click', function() {
            alert('按钮被点击了!');
            this.textContent = '已点击';
            this.style.background = '#f72585';
        });
    });
    
    // 控制台输出
    console.log('页面已加载完成!');
});</textarea>
                    </div>
                </div>
            </div>
            
            <div class="preview">
                <div class="preview-header">
                    <div class="preview-title">
                        <i class="fas fa-eye"></i>
                        <span>实时预览</span>
                    </div>
                    <div>
                        <button class="btn" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                </div>
                <div class="preview-content">
                    <iframe id="previewFrame" style="width: 100%; height: 100%; border: none; background: white;"></iframe>
                </div>
            </div>
        </div>
        
        <div class="file-manager">
            <div class="file-header">
                <h2><i class="fas fa-folder-open"></i> 文件管理器</h2>
                <div>
                    <input type="text" id="fileName" placeholder="输入文件名" style="padding: 8px; border-radius: 5px; border: none; margin-right: 10px;">
                </div>
            </div>
            <div class="file-list" id="fileList">
                <!-- 文件列表将通过JS动态生成 -->
                <div class="file-item">
                    <div class="file-info">
                        <i class="fas fa-file-code"></i>
                        <span>示例文件.html</span>
                    </div>
                    <div class="file-actions">
                        <button class="file-btn" title="加载"><i class="fas fa-folder-open"></i></button>
                        <button class="file-btn" title="删除"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">文件已成功保存！</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const htmlCode = document.getElementById('htmlCode');
            const cssCode = document.getElementById('cssCode');
            const jsCode = document.getElementById('jsCode');
            const previewFrame = document.getElementById('previewFrame');
            const runBtn = document.getElementById('runBtn');
            const saveBtn = document.getElementById('saveBtn');
            const newBtn = document.getElementById('newBtn');
            const clearBtn = document.getElementById('clearBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const fileName = document.getElementById('fileName');
            const fileList = document.getElementById('fileList');
            const notification = document.getElementById('notification');
            
            // 初始运行
            updatePreview();
            
            // 运行按钮事件
            runBtn.addEventListener('click', updatePreview);
            
            // 刷新按钮事件
            refreshBtn.addEventListener('click', updatePreview);
            
            // 保存按钮事件
            saveBtn.addEventListener('click', saveFile);
            
            // 新建按钮事件
            newBtn.addEventListener('click', newFile);
            
            // 清空按钮事件
            clearBtn.addEventListener('click', clearAll);
            
            // 实时预览（输入时更新）
            [htmlCode, cssCode, jsCode].forEach(editor => {
                editor.addEventListener('input', updatePreview);
            });
            
            // 更新预览函数
            function updatePreview() {
                const html = htmlCode.value;
                const css = `<style>${cssCode.value}</style>`;
                const js = `<script>${jsCode.value}<\/script>`;
                
                const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                
                previewDoc.open();
                previewDoc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        ${css}
                    </head>
                    <body>
                        ${html}
                        ${js}
                    </body>
                    </html>
                `);
                previewDoc.close();
            }
            
            // 保存文件函数
            function saveFile() {
                const name = fileName.value.trim() || '未命名文件.html';
                const content = htmlCode.value;
                
                // 保存到localStorage
                localStorage.setItem(name, JSON.stringify({
                    html: htmlCode.value,
                    css: cssCode.value,
                    js: jsCode.value,
                    timestamp: new Date().toISOString()
                }));
                
                // 显示通知
                showNotification(`文件 "${name}" 已保存！`);
                
                // 更新文件列表
                updateFileList();
                
                // 清空文件名输入
                fileName.value = '';
            }
            
            // 新建文件函数
            function newFile() {
                htmlCode.value = '';
                cssCode.value = '';
                jsCode.value = '';
                fileName.value = '';
                updatePreview();
                showNotification('已创建新文件');
            }
            
            // 清空函数
            function clearAll() {
                if (confirm('确定要清空所有编辑器内容吗？')) {
                    htmlCode.value = '';
                    cssCode.value = '';
                    jsCode.value = '';
                    updatePreview();
                    showNotification('所有编辑器已清空');
                }
            }
            
            // 显示通知函数
            function showNotification(message) {
                notification.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // 更新文件列表函数
            function updateFileList() {
                fileList.innerHTML = '';
                
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    
                    // 跳过非文件项
                    if (key.startsWith('file-')) continue;
                    
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    fileItem.innerHTML = `
                        <div class="file-info">
                            <i class="fas fa-file-code"></i>
                            <span>${key}</span>
                        </div>
                        <div class="file-actions">
                            <button class="file-btn load-btn" title="加载"><i class="fas fa-folder-open"></i></button>
                            <button class="file-btn delete-btn" title="删除"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    
                    // 添加加载事件
                    const loadBtn = fileItem.querySelector('.load-btn');
                    loadBtn.addEventListener('click', () => {
                        const fileData = JSON.parse(localStorage.getItem(key));
                        htmlCode.value = fileData.html;
                        cssCode.value = fileData.css;
                        jsCode.value = fileData.js;
                        updatePreview();
                        fileName.value = key;
                        showNotification(`已加载文件: ${key}`);
                    });
                    
                    // 添加删除事件
                    const deleteBtn = fileItem.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', () => {
                        if (confirm(`确定要删除文件 "${key}" 吗？`)) {
                            localStorage.removeItem(key);
                            fileItem.remove();
                            showNotification(`文件 "${key}" 已删除`);
                        }
                    });
                    
                    fileList.appendChild(fileItem);
                }
                
                // 如果没有文件，显示提示
                if (fileList.children.length === 0) {
                    fileList.innerHTML = '<div class="no-files">没有保存的文件</div>';
                }
            }
            
            // 初始化文件列表
            updateFileList();
        });
    </script>
</body>
</html>
