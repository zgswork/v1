<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML转图片工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --accent-color: #FF9800;
            --background-color: #f5f5f5;
            --surface-color: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --background-color: #1a1a1a;
            --surface-color: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border-color: #404040;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
        }

        .header {
            background: var(--surface-color);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background: #1976D2;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: var(--border-color);
        }

        .btn-icon {
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr 300px;
            gap: 1rem;
            padding: 1rem;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 80px);
        }

        .panel {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--background-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .panel-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor-tabs {
            display: flex;
            background: var(--background-color);
            border-bottom: 1px solid var(--border-color);
        }

        .editor-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }

        .editor-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: var(--surface-color);
        }

        .editor-tab:hover {
            color: var(--text-primary);
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }

        .preview-container {
            flex: 1;
            position: relative;
            background: white;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .preview-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .preview-size {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .settings-panel {
            padding: 1rem;
            overflow-y: auto;
        }

        .setting-group {
            margin-bottom: 1.5rem;
        }

        .setting-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .setting-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .setting-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }

        .setting-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .format-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .format-option {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            background: var(--surface-color);
        }

        .format-option.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .format-option:hover {
            border-color: var(--primary-color);
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .template-item {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            background: var(--surface-color);
            font-size: 0.8rem;
        }

        .template-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-message {
            padding: 0.5rem;
            border-radius: var(--border-radius);
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .status-success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .status-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .status-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                height: auto;
            }
            
            .panel {
                min-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.5rem 1rem;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .main-container {
                padding: 0.5rem;
                gap: 0.5rem;
            }
            
            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .resize-handle {
            width: 4px;
            background: var(--border-color);
            cursor: col-resize;
            transition: background-color 0.2s;
        }

        .resize-handle:hover {
            background: var(--primary-color);
        }

        .color-picker {
            width: 40px;
            height: 30px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
        }

        .file-input {
            display: none;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            transition: var(--transition);
            margin: 1rem 0;
        }

        .drop-zone.dragover {
            border-color: var(--primary-color);
            background: rgba(76, 175, 80, 0.1);
        }

        .shortcut-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }
    </style>
</head>
<body data-theme="light">
    <header class="header">
        <div class="header-content">
            <div class="logo">
                🖼️ HTML转图片工具
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="loadTemplate">
                    📋 模板
                </button>
                <button class="btn btn-outline" id="importFile">
                    📁 导入
                </button>
                <button class="btn btn-secondary" id="exportCode">
                    💾 导出代码
                </button>
                <button class="btn btn-primary" id="generateImage">
                    🖼️生成图片 <span class="shortcut-hint">Ctrl+Enter</span>
                </button>
                <button class="btn-icon" id="themeToggle" title="切换主题">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- 代码编辑器面板 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">代码编辑器</div>
                <div>
                    <button class="btn btn-outline" id="formatCode">格式化</button>
                    <button class="btn btn-outline" id="clearCode">清空</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="editor-tabs">
                    <button class="editor-tab active" data-tab="html">HTML</button>
                    <button class="editor-tab" data-tab="css">CSS</button>
                    <button class="editor-tab" data-tab="js">JavaScript</button>
                </div>
                <div class="editor-container">
                    <textarea id="htmlEditor" class="editor-content"></textarea>
                    <textarea id="cssEditor" class="editor-content hidden"></textarea>
                    <textarea id="jsEditor" class="editor-content hidden"></textarea>
                </div>
            </div>
        </div>

        <!-- 预览面板 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">实时预览</div>
                <div class="preview-toolbar">
                    <button class="btn btn-outline" id="refreshPreview">🔄</button>
                    <button class="btn btn-outline" id="fullscreenPreview">⛶</button>
                    <div class="preview-size">
                        <span id="previewSize">1200×800</span>
                    </div>
                </div>
            </div>
            <div class="panel-content">
                <div class="preview-container">
                    <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">导出设置</div>
            </div>
            <div class="panel-content">
                <div class="settings-panel">
                    <div class="setting-group">
                        <label class="setting-label">图片格式</label>
                        <div class="format-options">
                            <div class="format-option active" data-format="png">PNG</div>
                            <div class="format-option" data-format="jpeg">JPEG</div>
                            <div class="format-option" data-format="webp">WebP</div>
                            <div class="format-option" data-format="svg">SVG</div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">图片尺寸</label>
                        <div class="setting-row">
                            <input type="number" class="setting-input" id="imageWidth" placeholder="宽度" value="1200">
                            <input type="number" class="setting-input" id="imageHeight" placeholder="高度" value="800">
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">图片质量 (0.1-1.0)</label>
                        <input type="range" class="setting-input" id="imageQuality" min="0.1" max="1" step="0.1" value="0.9">
                        <div style="text-align: center; margin-top: 0.5rem; color: var(--text-secondary);">
                            <span id="qualityValue">0.9</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">背景颜色</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="color" class="color-picker" id="backgroundColor" value="#ffffff">
                            <input type="text" class="setting-input" id="backgroundColorText" value="#ffffff" style="flex: 1;">
                        </div>
                        <label style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="transparentBackground">
                            <span>透明背景 (仅PNG)</span>
                        </label>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">设备像素比</label>
                        <select class="setting-input" id="devicePixelRatio">
                            <option value="1">1x (标准)</option>
                            <option value="2" selected>2x (高清)</option>
                            <option value="3">3x (超高清)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">边距设置</label>
                        <div class="setting-row">
                            <input type="number" class="setting-input" id="paddingX" placeholder="水平边距" value="0">
                            <input type="number" class="setting-input" id="paddingY" placeholder="垂直边距" value="0">
                        </div>
                    </div>

                    <div class="setting-group">
                        <button class="btn btn-primary" id="generateImageBtn" style="width: 100%;">
                            🖼️ 生成图片
                        </button>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">快速模板</label>
                        <div class="templates-grid">
                            <div class="template-item" data-template="blank">空白页面</div>
                            <div class="template-item" data-template="card">名片</div>
                            <div class="template-item" data-template="poster">海报</div>
                            <div class="template-item" data-template="certificate">证书</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 模板选择模态框 -->
    <div class="modal" id="templateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">选择模板</h3>
                <button class="close-btn" onclick="closeModal('templateModal')">&times;</button>
            </div>
            <div id="templateList">
                <!-- 模板列表将在这里动态生成 -->
            </div>
        </div>
    </div>

    <!-- 导入文件模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">导入文件</h3>
                <button class="close-btn" onclick="closeModal('importModal')">&times;</button>
            </div>
            <div class="drop-zone" id="dropZone">
                <p>拖拽HTML文件到这里，或点击选择文件</p>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <input type="file" id="fileInput" class="file-input" accept=".html,.htm,.txt">
            </div>
        </div>
    </div>

    <!-- 进度提示 -->
    <div id="progressContainer" class="hidden">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        // 全局变量
        let htmlEditor, cssEditor, jsEditor;
        let currentFormat = 'png';
        let isGenerating = false;
        
        // 模板数据
        const templates = {
            blank: {
                name: '空白页面',
                html: `<!DOCTYPE html>
<html>
<head>
    <title>空白页面</title>
</head>
<body>
    <h1>Hello World!</h1>
</body>
</html>`,
                css: '',
                js: ''
            },
            card: {
                name: '名片模板',
                html: `<!DOCTYPE html>
<html>
<head>
    <title>名片</title>
</head>
<body>
    <div class="business-card">
        <div class="header">
            <h1>张三</h1>
            <p class="title">前端开发工程师</p>
        </div>
        <div class="contact">
            <p>📧 zhangsan@example.com</p>
            <p>📱 138-0000-0000</p>
            <p>🌐 www.example.com</p>
        </div>
    </div>
</body>
</html>`,
                css: `.business-card {
    width: 350px;
    height: 200px;

    margin-bottom: 20px;

.contact p {
    margin: 5px 0;
    font-size: 12px;
}`,
                js: ''
            },
            poster: {
                name: '海报模板',
                html: `<!DOCTYPE html>
<html>
<head>
    <title>活动海报</title>
</head>
<body>
    <div class="poster">
        <div class="header">
            <h1>春季音乐节</h1>
            <p class="subtitle">感受音乐的魅力</p>
        </div>
        <div class="content">
            <div class="date">2024年4月15日</div>
            <div class="location">📍 城市音乐厅</div>
            <div class="price">票价：¥99起</div>
        </div>
        <div class="footer">
            <p>扫码购票</p>
        </div>
    </div>
</body>
</html>`,
                css: `.poster {
    width: 400px;
    height: 600px;
    background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
    color: white;
    padding: 40px;
    text-align: center;
    font-family: 'Arial', sans-serif;
    position: relative;
    overflow: hidden;
}

.poster::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/></svg>') repeat;
    animation: float 20s infinite linear;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-100px) rotate(360deg); }
}

.header h1 {
    font-size: 36px;
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.subtitle {
    font-size: 18px;
    margin: 0 0 40px 0;
    opacity: 0.9;
}

.content {
    margin: 60px 0;
}

.date {
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
}

.location, .price {
    font-size: 16px;
    margin: 15px 0;
}

        // 初始化应用
        class HTMLToImageApp {
            constructor() {
                this.isDarkTheme = localStorage.getItem('darkTheme') === 'true';
                this.settings = {
                    format: 'png',
                    width: 1200,
                    height: 800,
                    quality: 0.9,
                    backgroundColor: '#ffffff',
                    transparent: false,
                    devicePixelRatio: 2,
                    paddingX: 0,
                    paddingY: 0
                };
                this.init();
            }

            init() {
                this.initEditors();
                this.bindEvents();
                this.applyTheme();
                this.loadDefaultTemplate();
                this.updatePreview();
            }

            initEditors() {
                // 初始化HTML编辑器
                htmlEditor = CodeMirror.fromTextArea(document.getElementById('htmlEditor'), {
                    mode: 'htmlmixed',
                    theme: this.isDarkTheme ? 'monokai' : 'eclipse',
                    lineNumbers: true,
                    autoCloseTags: true,
                    autoCloseBrackets: true,
                    matchBrackets: true,
                    indentUnit: 2,
                    tabSize: 2,
                    lineWrapping: true
                });

                // 初始化CSS编辑器
                cssEditor = CodeMirror.fromTextArea(document.getElementById('cssEditor'), {
                    mode: 'css',
                    theme: this.isDarkTheme ? 'monokai' : 'eclipse',
                    lineNumbers: true,
                    autoCloseBrackets: true,
                    matchBrackets: true,
                    indentUnit: 2,
                    tabSize: 2,
                    lineWrapping: true
                });

                // 初始化JavaScript编辑器
                jsEditor = CodeMirror.fromTextArea(document.getElementById('jsEditor'), {
                    mode: 'javascript',
                    theme: this.isDarkTheme ? 'monokai' : 'eclipse',
                    lineNumbers: true,
                    autoCloseBrackets: true,
                    matchBrackets: true,
                    indentUnit: 2,
                    tabSize: 2,
                    lineWrapping: true
                });

                // 绑定编辑器变化事件
                htmlEditor.on('change', () => this.debounceUpdatePreview());
                cssEditor.on('change', () => this.debounceUpdatePreview());
                jsEditor.on('change', () => this.debounceUpdatePreview());
            }

            bindEvents() {
                // 主题切换
                document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());

                // 编辑器标签切换
                document.querySelectorAll('.editor-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => this.switchEditorTab(e.target.dataset.tab));
                });

                // 格式选择
                document.querySelectorAll('.format-option').forEach(option => {
                    option.addEventListener('click', (e) => this.selectFormat(e.target.dataset.format));
                });

                // 模板选择
                document.querySelectorAll('.template-item').forEach(item => {
                    item.addEventListener('click', (e) => this.loadTemplate(e.target.dataset.template));
                });

                // 按钮事件
                document.getElementById('generateImage').addEventListener('click', () => this.generateImage());
                document.getElementById('generateImageBtn').addEventListener('click', () => this.generateImage());
                document.getElementById('loadTemplate').addEventListener('click', () => this.showTemplateModal());
                document.getElementById('importFile').addEventListener('click', () => this.showImportModal());
                document.getElementById('exportCode').addEventListener('click', () => this.exportCode());
                document.getElementById('formatCode').addEventListener('click', () => this.formatCurrentCode());
                document.getElementById('clearCode').addEventListener('click', () => this.clearCurrentCode());
                document.getElementById('refreshPreview').addEventListener('click', () => this.updatePreview());
                document.getElementById('fullscreenPreview').addEventListener('click', () => this.toggleFullscreenPreview());

                // 设置变化事件
                document.getElementById('imageWidth').addEventListener('input', (e) => {
                    this.settings.width = parseInt(e.target.value) || 1200;
                });
                document.getElementById('imageHeight').addEventListener('input', (e) => {
                    this.settings.height = parseInt(e.target.value) || 800;
                });
                document.getElementById('imageQuality').addEventListener('input', (e) => {
                    this.settings.quality = parseFloat(e.target.value);
                    document.getElementById('qualityValue').textContent = e.target.value;
                });
                document.getElementById('backgroundColor').addEventListener('input', (e) => {
                    this.settings.backgroundColor = e.target.value;
                    document.getElementById('backgroundColorText').value = e.target.value;
                });
                document.getElementById('backgroundColorText').addEventListener('input', (e) => {
                    this.settings.backgroundColor = e.target.value;
                    document.getElementById('backgroundColor').value = e.target.value;
                });
                document.getElementById('transparentBackground').addEventListener('change', (e) => {
                    this.settings.transparent = e.target.checked;
                });
                document.getElementById('devicePixelRatio').addEventListener('change', (e) => {
                    this.settings.devicePixelRatio = parseFloat(e.target.value);
                });
                document.getElementById('paddingX').addEventListener('input', (e) => {
                    this.settings.paddingX = parseInt(e.target.value) || 0;
                });
                document.getElementById('paddingY').addEventListener('input', (e) => {
                    this.settings.paddingY = parseInt(e.target.value) || 0;
                });

                // 文件导入
                document.getElementById('fileInput').addEventListener('change', (e) => this.handleFileImport(e));
                
                // 拖拽导入
                const dropZone = document.getElementById('dropZone');
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('dragover');
                });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                    this.handleFileDrop(e);
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'Enter') {
                        e.preventDefault();
                        this.generateImage();
                    }
                    if (e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        this.exportCode();
                    }
                    if (e.key === 'F11') {
                        e.preventDefault();
                        this.toggleFullscreenPreview();
                    }
                });
            }

            toggleTheme() {
                this.isDarkTheme = !this.isDarkTheme;
                localStorage.setItem('darkTheme', this.isDarkTheme);
                this.applyTheme();
            }

            applyTheme() {
                document.body.setAttribute('data-theme', this.isDarkTheme ? 'dark' : 'light');
                document.getElementById('themeToggle').textContent = this.isDarkTheme ? '☀️' : '🌙';
                
                // 更新编辑器主题
                const theme = this.isDarkTheme ? 'monokai' : 'eclipse';
                if (htmlEditor) htmlEditor.setOption('theme', theme);
                if (cssEditor) cssEditor.setOption('theme', theme);
                if (jsEditor) jsEditor.setOption('theme', theme);
            }

            switchEditorTab(tab) {
                // 更新标签状态
                document.querySelectorAll('.editor-tab').forEach(t => t.classList.remove('active'));
                document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

                // 隐藏所有编辑器
                document.querySelectorAll('.editor-content').forEach(editor => {
                    editor.parentElement.classList.add('hidden');
                });

                // 显示对应编辑器
                let targetEditor;
                switch(tab) {
                    case 'html':
                        targetEditor = htmlEditor;
                        break;
                    case 'css':
                        targetEditor = cssEditor;
                        break;
                    case 'js':
                        targetEditor = jsEditor;
                        break;
                }
                
                if (targetEditor) {
                    targetEditor.getWrapperElement().parentElement.classList.remove('hidden');
                    targetEditor.refresh();
                }
            }

            selectFormat(format) {
                this.settings.format = format;
                currentFormat = format;
                
                // 更新UI
                document.querySelectorAll('.format-option').forEach(option => {
                    option.classList.remove('active');
                });
                document.querySelector(`[data-format="${format}"]`).classList.add('active');
            }

            loadTemplate(templateKey) {
                const template = templates[templateKey];
                if (template) {
                    htmlEditor.setValue(template.html);
                    cssEditor.setValue(template.css);
                    jsEditor.setValue(template.js);
                    this.updatePreview();
                }
            }

            loadDefaultTemplate() {
                this.loadTemplate('blank');
            }

            debounceUpdatePreview() {
                clearTimeout(this.previewTimeout);
                this.previewTimeout = setTimeout(() => this.updatePreview(), 500);
            }

            updatePreview() {
                const htmlContent = htmlEditor.getValue();
                const cssContent = cssEditor.getValue();
                const jsContent = jsEditor.getValue();

                const fullHTML = this.combineCode(htmlContent, cssContent, jsContent);
                
                const iframe = document.getElementById('previewFrame');
                const blob = new Blob([fullHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                iframe.onload = () => {
                    URL.revokeObjectURL(url);
                    this.updatePreviewSize();
                };
                
                iframe.src = url;
            }

            combineCode(html, css, js) {
                // 如果HTML已经是完整的文档，直接使用
                if (html.includes('<!DOCTYPE') || html.includes('<html')) {
                    // 在head中插入CSS
                    if (css) {
                        const styleTag = `<style>${css}</style>`;
                        if (html.includes('</head>')) {
                            html = html.replace('</head>', `${styleTag}</head>`);
                        } else {
                            html = html.replace('<html>', `<html><head>${styleTag}</head>`);
                        }
                    }
                    
                    // 在body末尾插入JS
                    if (js) {
                        const scriptTag = `<script>${js}<\/script>`;
                        if (html.includes('</body>')) {
                            html = html.replace('</body>', `${scriptTag}</body>`);
                        } else {
                            html += scriptTag;
                        }
                    }
                    
                    return html;
                } else {
                    // 构建完整的HTML文档
                    return `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <style>
        ${css}
    </style>
</head>
<body>
    ${html}
    <script>
        ${js}
    <\/script>
</body>
</html>`;
                }
            }

            updatePreviewSize() {
                const iframe = document.getElementById('previewFrame');
                const sizeDisplay = document.getElementById('previewSize');
                
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const body = iframeDoc.body;
                    if (body) {
                        const rect = body.getBoundingClientRect();
                        sizeDisplay.textContent = `${Math.round(rect.width)}×${Math.round(rect.height)}`;
                    }
                } catch (e) {
                    sizeDisplay.textContent = '无法获取尺寸';
                }
            }

            async generateImage() {
                if (isGenerating) return;
                
                isGenerating = true;
                this.showProgress('正在生成图片...', 0);
                
                try {
                    const iframe = document.getElementById('previewFrame');
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    if (!iframeDoc.body) {
                        throw new Error('预览内容为空，请先添加HTML内容');
                    }

                    this.showProgress('正在渲染...', 30);

                    const options = {
                        allowTaint: true,
                        useCORS: true,
                        scale: this.settings.devicePixelRatio,
                        width: this.settings.width,
                        height: this.settings.height,
                        backgroundColor: this.settings.transparent ? null : this.settings.backgroundColor,
                        x: this.settings.paddingX,
                        y: this.settings.paddingY
                    };

                    this.showProgress('正在转换...', 60);

                    const canvas = await html2canvas(iframeDoc.body, options);
                    
                    this.showProgress('正在导出...', 90);

                    let dataURL;
                    switch (this.settings.format) {
                        case 'png':
                            dataURL = canvas.toDataURL('image/png');
                            break;
                        case 'jpeg':
                            dataURL = canvas.toDataURL('image/jpeg', this.settings.quality);
                            break;
                        case 'webp':
                            dataURL = canvas.toDataURL('image/webp', this.settings.quality);
                            break;
                        case 'svg':
                            // SVG导出需要特殊处理
                            dataURL = await this.generateSVG(iframeDoc.body);
                            break;
                        default:
                            dataURL = canvas.toDataURL('image/png');
                    }

                    this.downloadImage(dataURL, `html-to-image.${this.settings.format}`);
                    this.showProgress('生成完成！', 100, 'success');
                    
                    setTimeout(() => this.hideProgress(), 2000);
                    
                } catch (error) {
                    console.error('生成图片失败:', error);
                    this.showProgress(`生成失败: ${error.message}`, 0, 'error');
                    setTimeout(() => this.hideProgress(), 3000);
                } finally {
                    isGenerating = false;
                }
            }

            async generateSVG(element) {
                // 简单的SVG生成实现
                const rect = element.getBoundingClientRect();
                const styles = window.getComputedStyle(element);
                
                const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            ${element.outerHTML}
        </div>
    </foreignObject>
</svg>`;
                
                return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
            }

            downloadImage(dataURL, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            showProgress(message, progress, type = 'info') {
                const container = document.getElementById('progressContainer');
                const fill = document.getElementById('progressFill');
                const messageEl = document.getElementById('statusMessage');
                
                container.classList.remove('hidden');
                fill.style.width = `${progress}%`;
                messageEl.textContent = message;
                messageEl.className = `status-message status-${type}`;
            }

            hideProgress() {
                document.getElementById('progressContainer').classList.add('hidden');
            }

            showTemplateModal() {
                document.getElementById('templateModal').classList.add('active');
                this.renderTemplateList();
            }

            showImportModal() {
                document.getElementById('importModal').classList.add('active');
            }

            renderTemplateList() {
                const container = document.getElementById('templateList');
                container.innerHTML = Object.entries(templates).map(([key, template]) => `
                    <div class="template-item" onclick="app.loadTemplate('${key}'); closeModal('templateModal');" style="margin: 0.5rem 0; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); cursor: pointer;">
                        <h4>${template.name}</h4>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">点击加载此模板</p>
                    </div>
                `).join('');
            }

            exportCode() {
                const htmlContent = htmlEditor.getValue();
                const cssContent = cssEditor.getValue();
                const jsContent = jsEditor.getValue();
                
                const fullHTML = this.combineCode(htmlContent, cssContent, jsContent);
                
                const blob = new Blob([fullHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.download = 'exported-code.html';
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
            }

            formatCurrentCode() {
                const activeTab = document.querySelector('.editor-tab.active').dataset.tab;
                
                switch(activeTab) {
                    case 'html':
                        // 简单的HTML格式化
                        const htmlContent = htmlEditor.getValue();
                        htmlEditor.setValue(this.formatHTML(htmlContent));
                        break;
                    case 'css':
                        // 简单的CSS格式化
                        const cssContent = cssEditor.getValue();
                        cssEditor.setValue(this.formatCSS(cssContent));
                        break;
                    case 'js':
                        // 简单的JS格式化
                        const jsContent = jsEditor.getValue();
                        jsEditor.setValue(this.formatJS(jsContent));
                        break;
                }
            }

            formatHTML(html) {
                // 简单的HTML格式化实现
                return html.replace(/></g, '>\n<').replace(/\n\s*\n/g, '\n');
            }

            formatCSS(css) {
                // 简单的CSS格式化实现
                return css.replace(/;/g, ';\n').replace(/{/g, '{\n').replace(/}/g, '\n}\n');
            }

            formatJS(js) {
                // 简单的JS格式化实现
                return js.replace(/;/g, ';\n').replace(/{/g, '{\n').replace(/}/g, '\n}\n');
            }

            clearCurrentCode() {
                const activeTab = document.querySelector('.editor-tab.active').dataset.tab;
                
                switch(activeTab) {
                    case 'html':
                        htmlEditor.setValue('');
                        break;
                    case 'css':
                        cssEditor.setValue('');
                        break;
                    case 'js':
                        jsEditor.setValue('');
                        break;
                }
                
                this.updatePreview();
            }

            toggleFullscreenPreview() {
                const iframe = document.getElementById('previewFrame');
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) {
                    iframe.msRequestFullscreen();
                }
            }

            handleFileImport(event) {
                const file = event.target.files[0];
                if (file) {
                    this.readFile(file);
                }
            }

            handleFileDrop(event) {
                const files = event.dataTransfer.files;
                if (files.length > 0) {
                    this.readFile(files[0]);
                }
            }

            readFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    this.parseImportedHTML(content);
                    closeModal('importModal');
                };
                reader.readAsText(file);
            }

            parseImportedHTML(html) {
                // 提取HTML、CSS和JS
                let htmlContent = html;
                let cssContent = '';
                let jsContent = '';
                
                // 提取CSS
                const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
                let styleMatch;
                while ((styleMatch = styleRegex.exec(html)) !== null) {
                    cssContent += styleMatch[1] + '\n';
                    htmlContent = htmlContent.replace(styleMatch[0], '');
                }
                
                // 提取JS
                const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                let scriptMatch;
                while ((scriptMatch = scriptRegex.exec(html)) !== null) {
                    if (!scriptMatch[0].includes('src=')) { // 只提取内联脚本
                        jsContent += scriptMatch[1] + '\n';
                    }
                    htmlContent = htmlContent.replace(scriptMatch[0], '');
                }
                
                // 清理HTML
                htmlContent = htmlContent.replace(/<!DOCTYPE[^>]*>/i, '');
                htmlContent = htmlContent.replace(/<html[^>]*>/i, '');
                htmlContent = htmlContent.replace(/<\/html>/i, '');
                htmlContent = htmlContent.replace(/<head[^>]*>[\s\S]*?<\/head>/i, '');
                htmlContent = htmlContent.replace(/<body[^>]*>/i, '');
                htmlContent = htmlContent.replace(/<\/body>/i, '');
                htmlContent = htmlContent.trim();
                
                // 设置编辑器内容
                htmlEditor.setValue(htmlContent);
                cssEditor.setValue(cssContent.trim());
                jsEditor.setValue(jsContent.trim());
                
                this.updatePreview();
            }
        }

        // 全局函数
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 初始化应用
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new HTMLToImageApp();
        });

        // 模态框点击外部关闭
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
