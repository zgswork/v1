<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堆叠柱状图制作工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .data-input-section {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-method {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .method-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #e0e0e0;
            padding: 8px;
            text-align: center;
        }

        .data-table th {
            background: #f8f9ff;
            font-weight: 600;
            color: #333;
        }

        .data-table input {
            width: 100%;
            border: none;
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }

        .data-table input:focus {
            outline: 2px solid #667eea;
            border-radius: 3px;
        }

        .csv-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .csv-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .csv-hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .chart-settings {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .setting-group {
            background: #f8f9ff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .setting-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .setting-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .color-input {
            width: 100%;
            height: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
        }

        .chart-preview {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #f8f9ff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #chartCanvas {
            max-width: 100%;
            max-height: 400px;
        }

        .placeholder {
            color: #666;
            text-align: center;
            font-size: 1.1em;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn-large {
            padding: 12px 24px;
            font-size: 1em;
            min-width: 120px;
        }

        .data-series {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .series-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .series-title {
            font-weight: 600;
            color: #333;
        }

        .series-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            cursor: pointer;
        }

        .series-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .series-input {
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            color: #721c24;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            color: #155724;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .input-methods {
                grid-template-columns: 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .table-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 堆叠柱状图制作工具</h1>
            <p>创建专业的堆叠柱状图，支持多数据系列，可自定义样式和导出</p>
        </div>

        <div class="main-content">
            <!-- 数据输入区域 -->
            <div class="data-input-section">
                <div class="section-title">
                    <span>📝</span>
                    数据输入
                </div>
                
                <div class="input-methods">
                    <div class="input-method">
                        <div class="method-title">
                            <span>📋</span>
                            表格输入
                        </div>
                        
                        <div class="table-controls">
                            <button class="btn btn-small" id="addRowBtn">
                                <span>➕</span>
                                添加行
                            </button>
                            <button class="btn btn-small" id="addColBtn">
                                <span>➕</span>
                                添加列
                            </button>
                            <button class="btn btn-small btn-danger" id="removeRowBtn">
                                <span>➖</span>
                                删除行
                            </button>
                            <button class="btn btn-small btn-danger" id="removeColBtn">
                                <span>➖</span>
                                删除列
                            </button>
                        </div>
                        
                        <table class="data-table" id="dataTable">
                            <thead>
                                <tr>
                                    <th>类别</th>
                                    <th>系列1</th>
                                    <th>系列2</th>
                                    <th>系列3</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" value="Q1" placeholder="类别名称"></td>
                                    <td><input type="number" value="20" placeholder="数值"></td>
                                    <td><input type="number" value="30" placeholder="数值"></td>
                                    <td><input type="number" value="25" placeholder="数值"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="Q2" placeholder="类别名称"></td>
                                    <td><input type="number" value="35" placeholder="数值"></td>
                                    <td><input type="number" value="25" placeholder="数值"></td>
                                    <td><input type="number" value="40" placeholder="数值"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="Q3" placeholder="类别名称"></td>
                                    <td><input type="number" value="45" placeholder="数值"></td>
                                    <td><input type="number" value="35" placeholder="数值"></td>
                                    <td><input type="number" value="30" placeholder="数值"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="Q4" placeholder="类别名称"></td>
                                    <td><input type="number" value="30" placeholder="数值"></td>
                                    <td><input type="number" value="45" placeholder="数值"></td>
                                    <td><input type="number" value="35" placeholder="数值"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="input-method">
                        <div class="method-title">
                            <span>📄</span>
                            CSV格式输入
                        </div>
                        
                        <textarea id="csvInput" class="csv-input" placeholder="请输入CSV格式数据，例如：\n\n类别,系列1,系列2,系列3\nQ1,20,30,25\nQ2,35,25,40\nQ3,45,35,30\nQ4,30,45,35"></textarea>
                        
                        <div class="csv-hint">
                            第一行为标题行，第一列为类别名称，其余列为数据系列
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <button class="btn btn-small" id="parseCsvBtn">
                                <span>🔄</span>
                                解析CSV
                            </button>
                            <button class="btn btn-small btn-secondary" id="exportCsvBtn">
                                <span>📤</span>
                                导出CSV
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图表设置 -->
            <div class="chart-settings">
                <div class="section-title">
                    <span>⚙️</span>
                    图表设置
                </div>
                
                <div class="settings-grid">
                    <div class="setting-group">
                        <label class="setting-label" for="chartTitle">图表标题</label>
                        <input type="text" id="chartTitle" class="setting-input" value="堆叠柱状图" placeholder="输入图表标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="xAxisTitle">X轴标题</label>
                        <input type="text" id="xAxisTitle" class="setting-input" value="类别" placeholder="输入X轴标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="yAxisTitle">Y轴标题</label>
                        <input type="text" id="yAxisTitle" class="setting-input" value="数值" placeholder="输入Y轴标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="chartWidth">图表宽度</label>
                        <input type="number" id="chartWidth" class="setting-input" value="800" min="400" max="1200">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="chartHeight">图表高度</label>
                        <input type="number" id="chartHeight" class="setting-input" value="400" min="300" max="800">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showLegend">显示图例</label>
                        <select id="showLegend" class="setting-input">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showValues">显示数值</label>
                        <select id="showValues" class="setting-input">
                            <option value="false">隐藏</option>
                            <option value="true">显示</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="colorScheme">配色方案</label>
                        <select id="colorScheme" class="setting-input">
                            <option value="default">默认配色</option>
                            <option value="blue">蓝色系</option>
                            <option value="green">绿色系</option>
                            <option value="red">红色系</option>
                            <option value="purple">紫色系</option>
                            <option value="orange">橙色系</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-large" id="generateChartBtn">
                    <span>📊</span>
                    生成图表
                </button>
                <button class="btn btn-large btn-success" id="downloadPngBtn" disabled>
                    <span>🖼️</span>
                    下载PNG
                </button>
                <button class="btn btn-large btn-success" id="downloadJpgBtn" disabled>
                    <span>📷</span>
                    下载JPG
                </button>
                <button class="btn btn-large btn-danger" id="clearBtn">
                    <span>🗑️</span>
                    清空重置
                </button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>正在生成图表...</div>
            </div>

            <!-- 图表预览 -->
            <div class="chart-preview">
                <div class="section-title">
                    <span>📈</span>
                    图表预览
                </div>
                
                <div class="chart-container">
                    <canvas id="chartCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <div style="font-size: 3em; margin-bottom: 15px;">📊</div>
                        <div>设置数据并点击"生成图表"按钮开始制作</div>
                    </div>
                </div>
            </div>

            <!-- 错误信息 -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- 成功信息 -->
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <!-- 引入Chart.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <script>
        class StackedBarChartGenerator {
            constructor() {
                this.chart = null;
                this.currentData = null;
                this.initializeElements();
                this.bindEvents();
            }

            initializeElements() {
                this.dataTable = document.getElementById('dataTable');
                this.csvInput = document.getElementById('csvInput');
                this.chartCanvas = document.getElementById('chartCanvas');
                this.placeholder = document.getElementById('placeholder');
                this.loading = document.getElementById('loading');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                
                // 按钮
                this.addRowBtn = document.getElementById('addRowBtn');
                this.addColBtn = document.getElementById('addColBtn');
                this.removeRowBtn = document.getElementById('removeRowBtn');
                this.removeColBtn = document.getElementById('removeColBtn');
                this.parseCsvBtn = document.getElementById('parseCsvBtn');
                this.exportCsvBtn = document.getElementById('exportCsvBtn');
                this.generateChartBtn = document.getElementById('generateChartBtn');
                this.downloadPngBtn = document.getElementById('downloadPngBtn');
                this.downloadJpgBtn = document.getElementById('downloadJpgBtn');
                this.clearBtn = document.getElementById('clearBtn');
                
                // 设置
                this.chartTitle = document.getElementById('chartTitle');
                this.xAxisTitle = document.getElementById('xAxisTitle');
                this.yAxisTitle = document.getElementById('yAxisTitle');
                this.chartWidth = document.getElementById('chartWidth');
                this.chartHeight = document.getElementById('chartHeight');
                this.showLegend = document.getElementById('showLegend');
                this.showValues = document.getElementById('showValues');
                this.colorScheme = document.getElementById('colorScheme');
            }

            bindEvents() {
                // 表格操作
                this.addRowBtn.addEventListener('click', () => this.addTableRow());
                this.addColBtn.addEventListener('click', () => this.addTableColumn());
                this.removeRowBtn.addEventListener('click', () => this.removeTableRow());
                this.removeColBtn.addEventListener('click', () => this.removeTableColumn());
                
                // CSV操作
                this.parseCsvBtn.addEventListener('click', () => this.parseCsvData());
                this.exportCsvBtn.addEventListener('click', () => this.exportToCsv());
                
                // 图表操作
                this.generateChartBtn.addEventListener('click', () => this.generateChart());
                this.downloadPngBtn.addEventListener('click', () => this.downloadChart('png'));
                this.downloadJpgBtn.addEventListener('click', () => this.downloadChart('jpeg'));
                this.clearBtn.addEventListener('click', () => this.clearAll());
            }

            addTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                const headerCells = this.dataTable.querySelectorAll('thead th');
                const newRow = document.createElement('tr');
                
                for (let i = 0; i < headerCells.length; i++) {
                    const cell = document.createElement('td');
                    const input = document.createElement('input');
                    
                    if (i === 0) {
                        input.type = 'text';
                        input.placeholder = '类别名称';
                        input.value = `类别${tbody.children.length + 1}`;
                    } else {
                        input.type = 'number';
                        input.placeholder = '数值';
                        input.value = '0';
                    }
                    
                    cell.appendChild(input);
                    newRow.appendChild(cell);
                }
                
                tbody.appendChild(newRow);
                this.showSuccess('已添加新行');
            }

            addTableColumn() {
                const thead = this.dataTable.querySelector('thead tr');
                const tbody = this.dataTable.querySelector('tbody');
                const currentCols = thead.children.length;
                
                // 添加表头
                const headerCell = document.createElement('th');
                headerCell.textContent = `系列${currentCols}`;
                thead.appendChild(headerCell);
                
                // 为每行添加新列
                Array.from(tbody.children).forEach(row => {
                    const cell = document.createElement('td');
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.placeholder = '数值';
                    input.value = '0';
                    cell.appendChild(input);
                    row.appendChild(cell);
                });
                
                this.showSuccess('已添加新列');
            }

            removeTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                if (tbody.children.length > 1) {
                    tbody.removeChild(tbody.lastElementChild);
                    this.showSuccess('已删除最后一行');
                } else {
                    this.showError('至少需要保留一行数据');
                }
            }

            removeTableColumn() {
                const thead = this.dataTable.querySelector('thead tr');
                const tbody = this.dataTable.querySelector('tbody');
                
                if (thead.children.length > 2) {
                    // 删除表头最后一列
                    thead.removeChild(thead.lastElementChild);
                    
                    // 删除每行最后一列
                    Array.from(tbody.children).forEach(row => {
                        row.removeChild(row.lastElementChild);
                    });
                    
                    this.showSuccess('已删除最后一列');
                } else {
                    this.showError('至少需要保留类别列和一个数据列');
                }
            }

            parseCsvData() {
                const csvText = this.csvInput.value.trim();
                if (!csvText) {
                    this.showError('请输入CSV数据');
                    return;
                }

                try {
                    const lines = csvText.split('\n').filter(line => line.trim());
                    if (lines.length < 2) {
                        this.showError('CSV数据至少需要包含标题行和一行数据');
                        return;
                    }

                    // 解析标题行
                    const headers = lines[0].split(',').map(h => h.trim());
                    
                    // 解析数据行
                    const dataRows = lines.slice(1).map(line => 
                        line.split(',').map(cell => cell.trim())
                    );

                    // 重建表格
                    this.rebuildTable(headers, dataRows);
                    this.showSuccess('CSV数据解析成功');
                } catch (error) {
                    this.showError('CSV数据格式错误：' + error.message);
                }
            }

            rebuildTable(headers, dataRows) {
                const thead = this.dataTable.querySelector('thead tr');
                const tbody = this.dataTable.querySelector('tbody');
                
                // 清空现有内容
                thead.innerHTML = '';
                tbody.innerHTML = '';
                
                // 重建表头
                headers.forEach(header => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    thead.appendChild(th);
                });
                
                // 重建数据行
                dataRows.forEach(rowData => {
                    const tr = document.createElement('tr');
                    
                    rowData.forEach((cellData, index) => {
                        const td = document.createElement('td');
                        const input = document.createElement('input');
                        
                        if (index === 0) {
                            input.type = 'text';
                            input.placeholder = '类别名称';
                        } else {
                            input.type = 'number';
                            input.placeholder = '数值';
                        }
                        
                        input.value = cellData;
                        td.appendChild(input);
                        tr.appendChild(td);
                    });
                    
                    tbody.appendChild(tr);
                });
            }

            exportToCsv() {
                const data = this.getTableData();
                if (!data) return;
                
                const csvContent = [
                    data.headers.join(','),
                    ...data.rows.map(row => row.join(','))
                ].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `chart_data_${new Date().getTime()}.csv`;
                link.click();
                
                this.showSuccess('CSV文件导出成功');
            }

            getTableData() {
                const thead = this.dataTable.querySelector('thead tr');
                const tbody = this.dataTable.querySelector('tbody');
                
                // 获取表头
                const headers = Array.from(thead.children).map(th => th.textContent.trim());
                
                // 获取数据行
                const rows = Array.from(tbody.children).map(tr => {
                    return Array.from(tr.children).map(td => {
                        const input = td.querySelector('input');
                        return input ? input.value.trim() : '';
                    });
                });
                
                // 验证数据
                if (headers.length < 2) {
                    this.showError('至少需要一个类别列和一个数据列');
                    return null;
                }
                
                if (rows.length === 0) {
                    this.showError('请输入数据');
                    return null;
                }
                
                // 检查数据完整性
                for (let i = 0; i < rows.length; i++) {
                    if (!rows[i][0]) {
                        this.showError(`第${i + 1}行缺少类别名称`);
                        return null;
                    }
                    
                    for (let j = 1; j < rows[i].length; j++) {
                        if (rows[i][j] === '' || isNaN(parseFloat(rows[i][j]))) {
                            this.showError(`第${i + 1}行第${j + 1}列数据无效`);
                            return null;
                        }
                    }
                }
                
                return { headers, rows };
            }

            generateChart() {
                const data = this.getTableData();
                if (!data) return;

                this.showLoading(true);
                this.hideMessages();
                
                setTimeout(() => {
                    try {
                        this.renderChart(data);
                        this.currentData = data;
                        this.showLoading(false);
                        this.showSuccess('图表生成成功');
                    } catch (error) {
                        this.showLoading(false);
                        this.showError('图表生成失败：' + error.message);
                    }
                }, 500);
            }

            renderChart(data) {
                const ctx = this.chartCanvas.getContext('2d');
                
                // 销毁现有图表
                if (this.chart) {
                    this.chart.destroy();
                }
                
                // 准备数据
                const labels = data.rows.map(row => row[0]);
                const datasets = [];
                const colors = this.getColorScheme();
                
                // 为每个数据系列创建数据集
                for (let i = 1; i < data.headers.length; i++) {
                    const seriesData = data.rows.map(row => parseFloat(row[i]));
                    
                    datasets.push({
                        label: data.headers[i],
                        data: seriesData,
                        backgroundColor: colors[i - 1] || colors[0],
                        borderColor: colors[i - 1] || colors[0],
                        borderWidth: 1
                    });
                }
                
                // 设置图表配置
                const config = {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                stacked: true,
                                title: {
                                    display: !!this.xAxisTitle.value,
                                    text: this.xAxisTitle.value
                                }
                            },
                            y: {
                                stacked: true,
                                title: {
                                    display: !!this.yAxisTitle.value,
                                    text: this.yAxisTitle.value
                                }
                            }
                        },
                        plugins: {
                            title: {
                                display: !!this.chartTitle.value,
                                text: this.chartTitle.value,
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            legend: {
                                display: this.showLegend.value === 'true'
                            },
                            datalabels: {
                                display: this.showValues.value === 'true',
                                color: 'white',
                                font: {
                                    weight: 'bold'
                                },
                                formatter: function(value) {
                                    return value > 0 ? value : '';
                                }
                            }
                        }
                    }
                };
                
                // 设置画布大小
                this.chartCanvas.width = parseInt(this.chartWidth.value);
                this.chartCanvas.height = parseInt(this.chartHeight.value);
                
                // 创建图表
                this.chart = new Chart(ctx, config);
                
                // 显示图表，隐藏占位符
                this.placeholder.style.display = 'none';
                this.chartCanvas.style.display = 'block';
                
                // 启用下载按钮
                this.downloadPngBtn.disabled = false;
                this.downloadJpgBtn.disabled = false;
            }

            getColorScheme() {
                const schemes = {
                    default: ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#38f9d7', '#ffecd2', '#fcb69f'],
                    blue: ['#3498db', '#2980b9', '#1abc9c', '#16a085', '#2c3e50', '#34495e', '#5dade2', '#85c1e9', '#aed6f1', '#d6eaf8'],
                    green: ['#27ae60', '#2ecc71', '#1abc9c', '#16a085', '#52c41a', '#73d13d', '#95de64', '#b7eb8f', '#d9f7be', '#f6ffed'],
                    red: ['#e74c3c', '#c0392b', '#e67e22', '#d35400', '#f39c12', '#f1c40f', '#ff7675', '#fd79a8', '#fdcb6e', '#e17055'],
                    purple: ['#9b59b6', '#8e44ad', '#667eea', '#764ba2', '#a29bfe', '#6c5ce7', '#fd79a8', '#fdcb6e', '#e17055', '#00b894'],
                    orange: ['#e67e22', '#d35400', '#f39c12', '#f1c40f', '#ff7675', '#fd79a8', '#fdcb6e', '#e17055', '#00b894', '#00cec9']
                };
                
                return schemes[this.colorScheme.value] || schemes.default;
            }

            downloadChart(format) {
                if (!this.chart) {
                    this.showError('请先生成图表');
                    return;
                }

                try {
                    const link = document.createElement('a');
                    link.download = `stacked_bar_chart_${new Date().getTime()}.${format === 'jpeg' ? 'jpg' : format}`;
                    
                    if (format === 'jpeg') {
                        // 对于JPEG格式，需要白色背景
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = this.chartCanvas.width;
                        canvas.height = this.chartCanvas.height;
                        
                        // 填充白色背景
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // 绘制图表
                        ctx.drawImage(this.chartCanvas, 0, 0);
                        
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                    } else {
                        link.href = this.chartCanvas.toDataURL('image/png');
                    }
                    
                    link.click();
                    this.showSuccess(`${format.toUpperCase()}图片下载成功`);
                } catch (error) {
                    this.showError('图片下载失败：' + error.message);
                }
            }

            clearAll() {
                // 重置表格
                const thead = this.dataTable.querySelector('thead tr');
                const tbody = this.dataTable.querySelector('tbody');
                
                thead.innerHTML = `
                    <th>类别</th>
                    <th>系列1</th>
                    <th>系列2</th>
                    <th>系列3</th>
                `;
                
                tbody.innerHTML = `
                    <tr>
                        <td><input type="text" value="Q1" placeholder="类别名称"></td>
                        <td><input type="number" value="20" placeholder="数值"></td>
                        <td><input type="number" value="30" placeholder="数值"></td>
                        <td><input type="number" value="25" placeholder="数值"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="Q2" placeholder="类别名称"></td>
                        <td><input type="number" value="35" placeholder="数值"></td>
                        <td><input type="number" value="25" placeholder="数值"></td>
                        <td><input type="number" value="40" placeholder="数值"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="Q3" placeholder="类别名称"></td>
                        <td><input type="number" value="45" placeholder="数值"></td>
                        <td><input type="number" value="35" placeholder="数值"></td>
                        <td><input type="number" value="30" placeholder="数值"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="Q4" placeholder="类别名称"></td>
                        <td><input type="number" value="30" placeholder="数值"></td>
                        <td><input type="number" value="45" placeholder="数值"></td>
                        <td><input type="number" value="35" placeholder="数值"></td>
                    </tr>
                `;
                
                // 清空CSV输入
                this.csvInput.value = '';
                
                // 重置设置
                this.chartTitle.value = '堆叠柱状图';
                this.xAxisTitle.value = '类别';
                this.yAxisTitle.value = '数值';
                this.chartWidth.value = '800';
                this.chartHeight.value = '400';
                this.showLegend.value = 'true';
                this.showValues.value = 'false';
                this.colorScheme.value = 'default';
                
                // 销毁图表
                if (this.chart) {
                    this.chart.destroy();
                    this.chart = null;
                }
                
                // 显示占位符
                this.placeholder.style.display = 'block';
                this.chartCanvas.style.display = 'none';
                
                // 禁用下载按钮
                this.downloadPngBtn.disabled = true;
                this.downloadJpgBtn.disabled = true;
                
                this.hideMessages();
                this.showSuccess('已重置所有设置');
            }

            showLoading(show) {
                this.loading.classList.toggle('show', show);
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.classList.add('show');
                this.successMessage.classList.remove('show');
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.classList.add('show');
                this.errorMessage.classList.remove('show');
            }

            hideMessages() {
                this.errorMessage.classList.remove('show');
                this.successMessage.classList.remove('show');
            }
        }

        // 等待Chart.js库加载完成后初始化
        window.addEventListener('load', () => {
            if (typeof Chart !== 'undefined') {
                new StackedBarChartGenerator();
            } else {
                console.error('Chart.js库加载失败');
                document.getElementById('errorMessage').textContent = 'Chart.js库加载失败，请检查网络连接';
                document.getElementById('errorMessage').classList.add('show');
            }
        });
    </script>
</body>
</html>
