<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业兴趣测评</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        :root {
            --primary: #FF6B35;
            --secondary: #4361EE;
            --accent: #06D6A0;
            --dark: #2B2D42;
            --light: #F8F9FA;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.3s ease;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .screen {
            display: none;
            min-height: 100vh;
            padding: 2rem;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .active {
            display: flex;
        }
        
        /* 开始页面样式 */
        .start-screen {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?ixlib=rb-4.0.3') center/cover;
            color: white;
            text-align: center;
        }
        
        .start-btn {
            background: var(--primary);
            color: white;
            font-size: 1.2rem;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 107, 53, 0.4);
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 2rem;
            transform: scale(1);
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.6);
        }
        
        .start-btn:active {
            animation: bounce 0.5s;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        /* 问题页面样式 */
        .question-container {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .question-text {
            color: var(--dark);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .option-btn {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            margin: 0 auto;
        }
        
        .option-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(67, 97, 238, 0.5);
        }
        
        .option-btn.selected {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(6, 214, 160, 0.7);
            border-color: var(--accent);
        }
        
        .option-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            margin: 2rem 0;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* 结果页面样式 */
        .result-container {
            width: 90%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: translateY(100%);
            animation: slideIn 0.8s forwards;
        }
        
        @keyframes slideIn {
            to { transform: translateY(0); }
        }
        
        .result-title {
            color: var(--primary);
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .result-type {
            color: var(--secondary);
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin: 1rem 0;
        }
        
        .result-desc {
            color: var(--dark);
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .career-list {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .career-item {
            background: #E3F2FD;
            color: #0d47a1;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .career-item i {
            margin-right: 10px;
            color: var(--secondary);
        }
        
        .restart-btn {
            background: var(--accent);
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 2rem;
            box-shadow: 0 4px 10px rgba(6, 214, 160, 0.4);
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .question-text { font-size: 1.5rem; }
            .option-btn { width: 100px; height: 100px; }
            .result-title { font-size: 1.8rem; }
            .result-type { font-size: 1.5rem; }
        }
        
        @media (max-width: 480px) {
            .screen { padding: 1rem; }
            .question-container, .result-container { padding: 1.5rem; }
            .question-text { font-size: 1.3rem; }
            .options-container { grid-template-columns: 1fr 1fr; }
            .option-btn { width: 90px; height: 90px; font-size: 0.8rem; }
            .option-icon { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- 开始页面 -->
    <div id="start-screen" class="screen active">
        <h1 class="text-5xl font-bold mb-6">欢迎来到职业兴趣测评</h1>
        <p class="text-xl mb-10 max-w-2xl text-center px-4">探索你的职业兴趣方向，发现最适合你的职业道路</p>
        <button id="start-btn" class="start-btn">开始测评</button>
    </div>
    
    <!-- 问题页面 -->
    <div id="test-screen" class="screen">
        <div class="question-container">
            <div id="question-text" class="question-text"></div>
            <div id="options-container" class="options-container"></div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>
    </div>
    
    <!-- 结果页面 -->
    <div id="result-screen" class="screen">
        <div class="result-container">
            <h2 class="result-title">测评结果</h2>
            <div id="result-type" class="result-type"></div>
            <div id="result-desc" class="result-desc"></div>
            <h3 class="text-xl font-bold mb-4 text-center" style="color: var(--secondary);">推荐职业</h3>
            <ul id="career-list" class="career-list"></ul>
            <button id="restart-btn" class="restart-btn">重新测评</button>
        </div>
    </div>

    <script>
        // 职业兴趣类型定义
        const interestTypes = {
            R: { 
                name: "现实型", 
                desc: "你偏好需要动手操作、使用工具或机械的工作，喜欢户外活动或机械操作，注重实际问题的解决。",
                color: "#4CAF50"
            },
            I: { 
                name: "研究型", 
                desc: "你擅长观察、分析和解决问题，喜欢独立工作，对科学和学术研究有浓厚兴趣。",
                color: "#2196F3"
            },
            A: { 
                name: "艺术型", 
                desc: "你富有创造力和想象力，喜欢通过艺术形式表达自我，对美感和原创性有强烈追求。",
                color: "#9C27B0"
            },
            S: { 
                name: "社会型", 
                desc: "你喜欢帮助他人，擅长教导和关怀，重视人际关系和社会服务，具有强烈的同理心。",
                color: "#FF9800"
            },
            E: { 
                name: "企业型", 
                desc: "你具有领导才能，喜欢影响和说服他人，追求权力和成就，擅长管理和组织活动。",
                color: "#F44336"
            },
            C: { 
                name: "常规型", 
                desc: "你偏好结构化的工作环境，注重细节和准确性，擅长组织和处理数据，遵循规则和程序。",
                color: "#607D8B"
            }
        };
        
        // 职业推荐数据
        const careerRecommendations = {
            R: ["机械工程师", "电气技师", "土木工程师", "园艺设计师", "飞行员"],
            I: ["科学研究员", "数据分析师", "软件工程师", "医学研究员", "大学教授"],
            A: ["平面设计师", "音乐家", "作家", "建筑师", "艺术指导"],
            S: ["心理咨询师", "社会工作者", "教师", "护士", "人力资源专员"],
            E: ["企业经理", "销售总监", "市场营销专家", "创业家", "公关经理"],
            C: ["会计师", "银行职员", "行政助理", "审计师", "数据库管理员"]
        };
        
        // 测评问题
        const questions = [
            {
                text: "你更喜欢从事哪种类型的活动？",
                options: [
                    { text: "动手操作设备", icon: "fa-tools", type: "R" },
                    { text: "研究分析数据", icon: "fa-flask", type: "I" },
                    { text: "创作艺术作品", icon: "fa-palette", type: "A" },
                    { text: "帮助他人解决问题", icon: "fa-hands-helping", type: "S" },
                    { text: "组织管理团队", icon: "fa-chart-line", type: "E" },
                    { text: "整理文档资料", icon: "fa-file-alt", type: "C" }
                ]
            },
            {
                text: "在空闲时间，你更倾向于做什么？",
                options: [
                    { text: "修理家用物品", icon: "fa-wrench", type: "R" },
                    { text: "阅读科普书籍", icon: "fa-book", type: "I" },
                    { text: "绘画或摄影", icon: "fa-camera", type: "A" },
                    { text: "参加志愿活动", icon: "fa-hand-holding-heart", type: "S" },
                    { text: "参加商业社交", icon: "fa-handshake", type: "E" },
                    { text: "规划行程预算", icon: "fa-calculator", type: "C" }
                ]
            },
            {
                text: "你更擅长哪种类型的工作？",
                options: [
                    { text: "操作机械设备", icon: "fa-cogs", type: "R" },
                    { text: "解决复杂问题", icon: "fa-lightbulb", type: "I" },
                    { text: "创意设计", icon: "fa-pencil-alt", type: "A" },
                    { text: "沟通协调", icon: "fa-comments", type: "S" },
                    { text: "领导决策", icon: "fa-bullhorn", type: "E" },
                    { text: "数据处理", icon: "fa-table", type: "C" }
                ]
            },
            {
                text: "你更看重工作的哪些方面？",
                options: [
                    { text: "实用技能提升", icon: "fa-hard-hat", type: "R" },
                    { text: "知识探索机会", icon: "fa-microscope", type: "I" },
                    { text: "创意表达空间", icon: "fa-magic", type: "A" },
                    { text: "社会影响力", icon: "fa-globe-americas", type: "S" },
                    { text: "晋升发展机会", icon: "fa-trophy", type: "E" },
                    { text: "稳定工作环境", icon: "fa-shield-alt", type: "C" }
                ]
            },
            {
                text: "你希望工作环境是怎样的？",
                options: [
                    { text: "户外或车间", icon: "fa-tree", type: "R" },
                    { text: "实验室或研究室", icon: "fa-vial", type: "I" },
                    { text: "工作室或画廊", icon: "fa-theater-masks", type: "A" },
                    { text: "社区或学校", icon: "fa-school", type: "S" },
                    { text: "商业办公室", icon: "fa-building", type: "E" },
                    { text: "整洁的办公室", icon: "fa-desktop", type: "C" }
                ]
            }
        ];
        
        // 应用状态
        const state = {
            currentQuestion: 0,
            answers: {},
            scores: { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 }
        };
        
        // DOM元素
        const elements = {
            startScreen: document.getElementById('start-screen'),
            testScreen: document.getElementById('test-screen'),
            resultScreen: document.getElementById('result-screen'),
            startBtn: document.getElementById('start-btn'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            progress: document.getElementById('progress'),
            resultType: document.getElementById('result-type'),
            resultDesc: document.getElementById('result-desc'),
            careerList: document.getElementById('career-list'),
            restartBtn: document.getElementById('restart-btn')
        };
        
        // 初始化应用
        function initApp() {
            elements.startBtn.addEventListener('click', startTest);
            elements.restartBtn.addEventListener('click', restartTest);
        }
        
        // 开始测试
        function startTest() {
            elements.startScreen.classList.remove('active');
            elements.testScreen.classList.add('active');
            showQuestion(0);
        }
        
        // 显示问题
        function showQuestion(index) {
            state.currentQuestion = index;
            const question = questions[index];
            
            // 更新进度条
            elements.progress.style.width = `${((index + 1) / questions.length) * 100}%`;
            
            // 设置问题文本
            elements.questionText.textContent = question.text;
            
            // 清空选项容器
            elements.optionsContainer.innerHTML = '';
            
            // 添加选项按钮
            question.options.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <i class="${option.icon} option-icon"></i>
                    <span>${option.text}</span>
                `;
                
                // 添加选择事件
                btn.addEventListener('click', () => selectOption(option.type, i));
                
                elements.optionsContainer.appendChild(btn);
            });
        }
        
        // 选择选项
        function selectOption(type, index) {
            // 更新分数
            state.scores[type]++;
            state.answers[state.currentQuestion] = type;
            
            // 添加选择效果
            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => btn.classList.remove('selected'));
            optionBtns[index].classList.add('selected');
            
            // 延迟后进入下一题
            setTimeout(() => {
                if (state.currentQuestion < questions.length - 1) {
                    showQuestion(state.currentQuestion + 1);
                } else {
                    showResults();
                }
            }, 500);
        }
        
        // 显示结果
        function showResults() {
            elements.testScreen.classList.remove('active');
            elements.resultScreen.classList.add('active');
            
            // 确定最高分类型
            let maxScore = 0;
            let dominantType = '';
            
            for (const type in state.scores) {
                if (state.scores[type] > maxScore) {
                    maxScore = state.scores[type];
                    dominantType = type;
                }
            }
            
            // 显示结果
            const typeInfo = interestTypes[dominantType];
            elements.resultType.textContent = typeInfo.name;
            elements.resultType.style.color = typeInfo.color;
            elements.resultDesc.textContent = typeInfo.desc;
            
            // 显示职业推荐
            elements.careerList.innerHTML = '';
            careerRecommendations[dominantType].forEach(career => {
                const li = document.createElement('li');
                li.className = 'career-item';
                li.innerHTML = `<i class="fas fa-briefcase"></i> ${career}`;
                elements.careerList.appendChild(li);
            });
        }
        
        // 重新开始测试
        function restartTest() {
            // 重置状态
            state.currentQuestion = 0;
            state.answers = {};
            state.scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
            
            // 切换屏幕
            elements.resultScreen.classList.remove('active');
            elements.startScreen.classList.add('active');
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
