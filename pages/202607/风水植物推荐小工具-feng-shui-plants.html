<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风水植物推荐小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            font-size: 1.2em;
            font-weight: bold;
            color: #2c5530;
            margin-bottom: 10px;
        }

        .upload-area {
            border: 3px dashed #4CAF50;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f9f9f9;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            background: #f0f8f0;
            border-color: #45a049;
        }

        .upload-area.dragover {
            background: #e8f5e8;
            border-color: #2e7d32;
        }

        .upload-icon {
            font-size: 3em;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .preview-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .select-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .option-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .option-card:hover {
            background: #e8f5e8;
            border-color: #4CAF50;
            transform: translateY(-2px);
        }

        .option-card.selected {
            background: #4CAF50;
            color: white;
            border-color: #45a049;
            transform: translateY(-2px);
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .result-section {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e8f5e8 100%);
            border-radius: 15px;
            border-left: 5px solid #4CAF50;
            display: none;
        }

        .result-title {
            font-size: 1.5em;
            color: #2c5530;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .result-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            text-align: justify;
        }

        .plant-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .plant-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .plant-emoji {
            font-size: 2em;
            margin-right: 15px;
        }

        .plant-info {
            flex: 1;
        }

        .plant-name {
            font-weight: bold;
            color: #2c5530;
            margin-bottom: 5px;
        }

        .plant-desc {
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .select-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 风水植物推荐</h1>
            <p>根据房屋朝向和五行缺失，为您推荐最适合的风水植物</p>
        </div>

        <div class="content">
            <!-- 照片上传区域 -->
            <div class="form-group">
                <label>📸 上传房屋照片（可选）</label>
                <div class="upload-area" onclick="document.getElementById('photo-input').click()">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击或拖拽上传房屋照片</div>
                    <div class="upload-text" style="font-size: 0.9em; color: #999;">支持 JPG、PNG 格式</div>
                    <input type="file" id="photo-input" class="file-input" accept="image/*">
                    <img id="preview" class="preview-image" style="display: none;">
                </div>
            </div>

            <!-- 房屋朝向选择 -->
            <div class="form-group">
                <label>🧭 选择房屋朝向</label>
                <div class="select-group" id="direction-group">
                    <div class="option-card" data-value="east">东</div>
                    <div class="option-card" data-value="south">南</div>
                    <div class="option-card" data-value="west">西</div>
                    <div class="option-card" data-value="north">北</div>
                    <div class="option-card" data-value="southeast">东南</div>
                    <div class="option-card" data-value="southwest">西南</div>
                    <div class="option-card" data-value="northwest">西北</div>
                    <div class="option-card" data-value="northeast">东北</div>
                </div>
            </div>

            <!-- 五行缺失选择 -->
            <div class="form-group">
                <label>⚡ 选择五行缺失</label>
                <div class="select-group" id="element-group">
                    <div class="option-card" data-value="wood">缺木</div>
                    <div class="option-card" data-value="fire">缺火</div>
                    <div class="option-card" data-value="earth">缺土</div>
                    <div class="option-card" data-value="metal">缺金</div>
                    <div class="option-card" data-value="water">缺水</div>
                    <div class="option-card" data-value="none">无缺失</div>
                </div>
            </div>

            <!-- 生成推荐按钮 -->
            <button class="generate-btn" onclick="generateRecommendation()">
                🌱 生成植物推荐
            </button>

            <!-- 结果显示区域 -->
            <div class="result-section" id="result-section">
                <div class="result-title">🌿 为您推荐的风水植物</div>
                <div class="result-content" id="result-content"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedDirection = '';
        let selectedElement = '';

        // 植物推荐数据库
        const plantDatabase = {
            wood: {
                plants: [
                    { name: '富贵竹', emoji: '🎋', desc: '寓意富贵吉祥，生命力旺盛，能够补充木元素' },
                    { name: '绿萝', emoji: '🌿', desc: '净化空气，生长茂盛，象征生机勃勃' },
                    { name: '发财树', emoji: '🌳', desc: '招财进宝，枝叶繁茂，增强木气' },
                    { name: '吊兰', emoji: '🌱', desc: '清新雅致，易于养护，调和室内气场' }
                ],
                description: '您的五行缺木，建议选择生命力旺盛的绿色植物。木元素代表生长、发展和创新，这些植物能够为您带来蓬勃的生机和向上的能量。'
            },
            fire: {
                plants: [
                    { name: '红掌', emoji: '🌺', desc: '花色鲜红，象征热情与活力，补充火元素' },
                    { name: '一品红', emoji: '🌹', desc: '红色花朵，寓意鸿运当头，增强火气' },
                    { name: '红色玫瑰', emoji: '🌹', desc: '热情奔放，象征爱情与激情' },
                    { name: '凤仙花', emoji: '🌸', desc: '花色艳丽，生命力强，带来火的能量' }
                ],
                description: '您的五行缺火，建议选择红色或橙色花朵的植物。火元素代表热情、活力和光明，这些植物能够为您带来温暖的能量和积极的心态。'
            },
            earth: {
                plants: [
                    { name: '仙人掌', emoji: '🌵', desc: '耐旱坚韧，象征稳重踏实，补充土元素' },
                    { name: '多肉植物', emoji: '🪴', desc: '厚实饱满，寓意财富积累，增强土气' },
                    { name: '君子兰', emoji: '🌷', desc: '高雅稳重，象征君子品格，调和土元素' },
                    { name: '橡皮树', emoji: '🌳', desc: '叶片厚实，根系发达，增强稳定能量' }
                ],
                description: '您的五行缺土，建议选择厚实稳重的植物。土元素代表稳定、包容和滋养，这些植物能够为您带来踏实的根基和稳定的能量。'
            },
            metal: {
                plants: [
                    { name: '白掌', emoji: '🤍', desc: '花色洁白，象征纯净与高雅，补充金元素' },
                    { name: '银叶菊', emoji: '🌼', desc: '叶片银白，寓意财富与贵气，增强金气' },
                    { name: '白色兰花', emoji: '🌺', desc: '高贵典雅，象征品格高洁' },
                    { name: '茉莉花', emoji: '🌸', desc: '花香清雅，色泽纯白，调和金元素' }
                ],
                description: '您的五行缺金，建议选择白色或银色的植物。金元素代表收获、精准和高贵，这些植物能够为您带来清净的能量和高雅的气质。'
            },
            water: {
                plants: [
                    { name: '水仙花', emoji: '🌼', desc: '水培植物，象征纯洁与新生，补充水元素' },
                    { name: '荷花', emoji: '🪷', desc: '出淤泥而不染，寓意高洁品格，增强水气' },
                    { name: '铜钱草', emoji: '🌿', desc: '圆叶如钱，水培易活，招财又补水' },
                    { name: '绿萝（水培）', emoji: '🌱', desc: '水培养护，生机盎然，调和水元素' }
                ],
                description: '您的五行缺水，建议选择水培植物或与水相关的植物。水元素代表智慧、流动和滋润，这些植物能够为您带来灵动的能量和智慧的启发。'
            },
            none: {
                plants: [
                    { name: '平安树', emoji: '🌳', desc: '寓意平安健康，调和整体气场' },
                    { name: '幸福树', emoji: '🌲', desc: '象征幸福美满，带来正面能量' },
                    { name: '金钱树', emoji: '💰', desc: '招财进宝，叶片厚实，增强财运' },
                    { name: '龟背竹', emoji: '🌿', desc: '长寿吉祥，净化空气，调和环境' }
                ],
                description: '您的五行平衡，建议选择寓意吉祥的综合性植物。这些植物能够维持良好的气场平衡，为您带来全方位的正面能量。'
            }
        };

        // 方位与五行的对应关系
        const directionElements = {
            east: 'wood',
            southeast: 'wood',
            south: 'fire',
            southwest: 'earth',
            west: 'metal',
            northwest: 'metal',
            north: 'water',
            northeast: 'earth'
        };

        // 初始化事件监听
        document.addEventListener('DOMContentLoaded', function() {
            // 照片上传功能
            const photoInput = document.getElementById('photo-input');
            const preview = document.getElementById('preview');
            const uploadArea = document.querySelector('.upload-area');

            photoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 拖拽上传功能
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    photoInput.files = files;
                    photoInput.dispatchEvent(new Event('change'));
                }
            });

            // 选项卡点击事件
            document.querySelectorAll('.option-card').forEach(card => {
                card.addEventListener('click', function() {
                    const group = this.parentElement;
                    const groupId = group.id;
                    
                    // 清除同组其他选项的选中状态
                    group.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                    
                    // 设置当前选项为选中状态
                    this.classList.add('selected');
                    
                    // 保存选择
                    if (groupId === 'direction-group') {
                        selectedDirection = this.dataset.value;
                    } else if (groupId === 'element-group') {
                        selectedElement = this.dataset.value;
                    }
                });
            });
        });

        // 生成推荐函数
        function generateRecommendation() {
            if (!selectedDirection || !selectedElement) {
                alert('请先选择房屋朝向和五行缺失！');
                return;
            }

            const resultSection = document.getElementById('result-section');
            const resultContent = document.getElementById('result-content');

            // 获取推荐数据
            const elementData = plantDatabase[selectedElement];
            const directionElement = directionElements[selectedDirection];
            
            // 构建推荐内容
            let recommendation = `
                <div style="margin-bottom: 20px;">
                    <strong>🏠 房屋朝向：</strong>${getDirectionName(selectedDirection)}<br>
                    <strong>⚡ 五行缺失：</strong>${getElementName(selectedElement)}<br>
                    <strong>🌟 朝向五行：</strong>${getElementName(directionElement)}
                </div>
                
                <div style="margin-bottom: 20px;">
                    ${elementData.description}
                </div>
            `;

            // 添加方位建议
            recommendation += `
                <div style="margin-bottom: 20px; padding: 15px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
                    <strong>📍 摆放建议：</strong>
                    根据您的房屋朝向（${getDirectionName(selectedDirection)}），建议将植物摆放在${getPlacementAdvice(selectedDirection, selectedElement)}，
                    这样能够更好地调和气场，发挥植物的风水作用。
                </div>
            `;

            // 添加植物列表
            recommendation += '<div class="plant-list">';
            elementData.plants.forEach(plant => {
                recommendation += `
                    <div class="plant-item">
                        <div class="plant-emoji">${plant.emoji}</div>
                        <div class="plant-info">
                            <div class="plant-name">${plant.name}</div>
                            <div class="plant-desc">${plant.desc}</div>
                        </div>
                    </div>
                `;
            });
            recommendation += '</div>';

            // 添加养护提示
            recommendation += `
                <div style="margin-top: 20px; padding: 15px; background: #d1ecf1; border-radius: 8px; border-left: 4px solid #17a2b8;">
                    <strong>💡 养护提示：</strong>
                    定期浇水、适当施肥，保持植物健康茂盛的状态，这样才能发挥最佳的风水效果。
                    同时要注意及时清理枯叶，保持植物的生机活力。
                </div>
            `;

            resultContent.innerHTML = recommendation;
            resultSection.style.display = 'block';
            
            // 平滑滚动到结果区域
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        // 辅助函数
        function getDirectionName(direction) {
            const names = {
                east: '东', south: '南', west: '西', north: '北',
                southeast: '东南', southwest: '西南', northwest: '西北', northeast: '东北'
            };
            return names[direction] || direction;
        }

        function getElementName(element) {
            const names = {
                wood: '木', fire: '火', earth: '土', metal: '金', water: '水', none: '无缺失'
            };
            return names[element] || element;
        }

        function getPlacementAdvice(direction, element) {
            // 根据朝向和五行缺失给出摆放建议
            const advice = {
                east: '客厅东侧或阳台',
                south: '客厅南侧或窗台',
                west: '客厅西侧或餐厅',
                north: '书房或卧室北侧',
                southeast: '客厅东南角或玄关',
                southwest: '客厅西南角或厨房附近',
                northwest: '书房西北角或主卧',
                northeast: '客厅东北角或儿童房'
            };
            return advice[direction] || '室内光线充足的位置';
        }
    </script>
</body>
</html>
