<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界时间</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .location {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .time {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #3498db;
        }
        .date {
            font-size: 18px;
            margin-bottom: 25px;
            color: #7f8c8d;
        }
        .change-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .change-btn:hover {
            background-color: #2980b9;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
        }
        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">世界时间</div>
        <div class="location" id="location">中国, 北京</div>
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">星期一 (2023年1月1日)</div>
        <button class="change-btn" id="changeBtn">更换城市</button>
        <div id="citySelectContainer" style="display: none; margin-top: 15px;">
            <select id="citySelect">
                <option value="Asia/Shanghai">中国, 北京 (UTC+8)</option>
                <option value="Asia/Tokyo">日本, 东京 (UTC+9)</option>
                <option value="Asia/Seoul">韩国, 首尔 (UTC+9)</option>
                <option value="Asia/Hong_Kong">中国, 香港 (UTC+8)</option>
                <option value="Asia/Taipei">中国, 台北 (UTC+8)</option>
                <option value="Asia/Singapore">新加坡 (UTC+8)</option>
                <option value="Asia/Kolkata">印度, 新德里 (UTC+5:30)</option>
                <option value="Asia/Dubai">阿联酋, 迪拜 (UTC+4)</option>
                <option value="Europe/London">英国, 伦敦 (UTC+0)</option>
                <option value="Europe/Paris">法国, 巴黎 (UTC+1)</option>
                <option value="Europe/Berlin">德国, 柏林 (UTC+1)</option>
                <option value="Europe/Moscow">俄罗斯, 莫斯科 (UTC+3)</option>
                <option value="America/New_York">美国, 纽约 (UTC-5)</option>
                <option value="America/Chicago">美国, 芝加哥 (UTC-6)</option>
                <option value="America/Denver">美国, 丹佛 (UTC-7)</option>
                <option value="America/Los_Angeles">美国, 洛杉矶 (UTC-8)</option>
                <option value="America/Toronto">加拿大, 多伦多 (UTC-5)</option>
                <option value="America/Sao_Paulo">巴西, 圣保罗 (UTC-3)</option>
                <option value="Australia/Sydney">澳大利亚, 悉尼 (UTC+10)</option>
                <option value="Pacific/Auckland">新西兰, 奥克兰 (UTC+12)</option>
                <option value="Pacific/Honolulu">美国, 檀香山 (UTC-10)</option>
                <option value="Pacific/Midway">中途岛 (UTC-11)</option>
                <option value="Pacific/Kiritimati">基里巴斯, 圣诞岛 (UTC+14)</option>
            </select>
            <button class="change-btn" id="confirmBtn" style="margin-top: 10px;">确认</button>
        </div>
    </div>
    
    <div class="footer">
        <div>本工具由叁贰壹制作</div>
        <div>微信coolman88886666</div>
        <div>QQ邮箱<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="655d51565757535c55512514144b060a08">[email&#160;protected]</a></div>
        <div>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="36450e02050404000f060376515b575f5a1855595b">[email&#160;protected]</a></div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 城市映射表
        const cityMap = {
            "Asia/Shanghai": { name: "中国, 北京", offset: 8 },
            "Asia/Tokyo": { name: "日本, 东京", offset: 9 },
            "Asia/Seoul": { name: "韩国, 首尔", offset: 9 },
            "Asia/Hong_Kong": { name: "中国, 香港", offset: 8 },
            "Asia/Taipei": { name: "中国, 台北", offset: 8 },
            "Asia/Singapore": { name: "新加坡", offset: 8 },
            "Asia/Kolkata": { name: "印度, 新德里", offset: 5.5 },
            "Asia/Dubai": { name: "阿联酋, 迪拜", offset: 4 },
            "Europe/London": { name: "英国, 伦敦", offset: 0 },
            "Europe/Paris": { name: "法国, 巴黎", offset: 1 },
            "Europe/Berlin": { name: "德国, 柏林", offset: 1 },
            "Europe/Moscow": { name: "俄罗斯, 莫斯科", offset: 3 },
            "America/New_York": { name: "美国, 纽约", offset: -5 },
            "America/Chicago": { name: "美国, 芝加哥", offset: -6 },
            "America/Denver": { name: "美国, 丹佛", offset: -7 },
            "America/Los_Angeles": { name: "美国, 洛杉矶", offset: -8 },
            "America/Toronto": { name: "加拿大, 多伦多", offset: -5 },
            "America/Sao_Paulo": { name: "巴西, 圣保罗", offset: -3 },
            "Australia/Sydney": { name: "澳大利亚, 悉尼", offset: 10 },
            "Pacific/Auckland": { name: "新西兰, 奥克兰", offset: 12 },
            "Pacific/Honolulu": { name: "美国, 檀香山", offset: -10 },
            "Pacific/Midway": { name: "中途岛", offset: -11 },
            "Pacific/Kiritimati": { name: "基里巴斯, 圣诞岛", offset: 14 }
        };

        // 星期几的中文名称
        const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        let currentTimezone = "Asia/Shanghai";
        let citySelectVisible = false;

        // 获取DOM元素
        const locationElement = document.getElementById('location');
        const timeElement = document.getElementById('time');
        const dateElement = document.getElementById('date');
        const changeBtn = document.getElementById('changeBtn');
        const citySelectContainer = document.getElementById('citySelectContainer');
        const citySelect = document.getElementById('citySelect');
        const confirmBtn = document.getElementById('confirmBtn');

        // 更新时间
        function updateTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const selectedCity = cityMap[currentTimezone];
            const localTime = new Date(utc + (3600000 * selectedCity.offset));
            
            const hours = String(localTime.getHours()).padStart(2, '0');
            const minutes = String(localTime.getMinutes()).padStart(2, '0');
            const seconds = String(localTime.getSeconds()).padStart(2, '0');
            
            const year = localTime.getFullYear();
            const month = String(localTime.getMonth() + 1).padStart(2, '0');
            const day = String(localTime.getDate()).padStart(2, '0');
            const weekday = weekdays[localTime.getDay()];
            
            locationElement.textContent = selectedCity.name;
            timeElement.textContent = `${hours}:${minutes}:${seconds}`;
            dateElement.textContent = `${weekday} (${year}年${month}月${day}日)`;
        }

        // 切换城市选择界面
        function toggleCitySelect() {
            citySelectVisible = !citySelectVisible;
            citySelectContainer.style.display = citySelectVisible ? 'block' : 'none';
            changeBtn.textContent = citySelectVisible ? '取消' : '更换城市';
        }

        // 确认选择城市
        function confirmCitySelection() {
            currentTimezone = citySelect.value;
            toggleCitySelect();
            updateTime();
        }

        // 事件监听
        changeBtn.addEventListener('click', toggleCitySelect);
        confirmBtn.addEventListener('click', confirmCitySelection);

        // 初始化
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
