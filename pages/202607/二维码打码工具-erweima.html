<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码打码工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 100%;
            margin: 0 auto;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        
        .image-container {
            width: 100%;
            max-width: 500px;
            height: 300px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #fff;
            position: relative;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .placeholder {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }
        
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        #selectImageBtn {
            background-color: #2ecc71;
        }
        
        #selectImageBtn:hover {
            background-color: #27ae60;
        }
        
        #resetBtn {
            background-color: #e74c3c;
        }
        
        #resetBtn:hover {
            background-color: #c0392b;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>二维码打码工具</h1>
        
        <div class="image-container">
            <div class="placeholder">请选择包含二维码的图片</div>
            <img id="imagePreview" alt="预览图片">
            <canvas id="imageCanvas" style="display:none;"></canvas>
            
            <div class="loading">
                <div class="spinner"></div>
                <div id="loadingText">处理中...</div>
            </div>
        </div>
        
        <p class="error" id="errorMsg"></p>
        
        <div class="buttons">
            <button id="selectImageBtn">选择图片</button>
            <button id="blurBtn" disabled>一键打码</button>
            <button id="saveBtn" disabled>保存图片</button>
            <button id="resetBtn" disabled>重置图片</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素
            const imageContainer = document.querySelector('.image-container');
            const placeholder = document.querySelector('.placeholder');
            const imagePreview = document.getElementById('imagePreview');
            const imageCanvas = document.getElementById('imageCanvas');
            const ctx = imageCanvas.getContext('2d');
            const loading = document.querySelector('.loading');
            const loadingText = document.getElementById('loadingText');
            const errorMsg = document.getElementById('errorMsg');
            
            // 按钮
            const selectImageBtn = document.getElementById('selectImageBtn');
            const blurBtn = document.getElementById('blurBtn');
            const saveBtn = document.getElementById('saveBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            // 状态变量
            let originalImageData = null;
            let currentImageData = null;
            let qrCodeLocation = null;
            let imageType = '';
            let originalImageSrc = '';
            
            // 选择图片
            selectImageBtn.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    // 检查文件大小
                    if (file.size > 20 * 1024 * 1024) {
                        showError('图片大小不能超过20MB');
                        return;
                    }
                    
                    showLoading('图片加载中...');
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            // 设置canvas尺寸
                            imageCanvas.width = img.width;
                            imageCanvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            
                            // 保存原始图像数据
                            originalImageData = ctx.getImageData(0, 0, img.width, img.height);
                            currentImageData = originalImageData;
                            originalImageSrc = event.target.result;
                            
                            // 显示预览
                            imagePreview.src = originalImageSrc;
                            imagePreview.style.display = 'block';
                            placeholder.style.display = 'none';
                            
                            // 获取图片类型
                            imageType = file.type || 'image/jpeg';
                            
                            // 启用按钮
                            blurBtn.disabled = false;
                            resetBtn.disabled = false;
                            
                            hideLoading();
                        };
                        img.onerror = function() {
                            hideLoading();
                            showError('图片加载失败，请重试');
                        };
                        img.src = event.target.result;
                    };
                    reader.onerror = function() {
                        hideLoading();
                        showError('文件读取失败，请重试');
                    };
                    reader.readAsDataURL(file);
                };
                
                input.click();
            });
            
            // 一键打码
            blurBtn.addEventListener('click', function() {
                if (!currentImageData) return;
                
                showLoading('正在识别二维码...');
                
                // 使用jsQR识别二维码
                setTimeout(() => {
                    try {
                        // 创建优化后的识别canvas
                        const detectCanvas = document.createElement('canvas');
                        const maxSize = 800;
                        let detectWidth = imageCanvas.width;
                        let detectHeight = imageCanvas.height;
                        
                        // 调整到合适尺寸
                        if (detectWidth > maxSize || detectHeight > maxSize) {
                            const ratio = Math.min(maxSize / detectWidth, maxSize / detectHeight);
                            detectWidth = Math.floor(detectWidth * ratio);
                            detectHeight = Math.floor(detectHeight * ratio);
                        }
                        
                        detectCanvas.width = detectWidth;
                        detectCanvas.height = detectHeight;
                        const detectCtx = detectCanvas.getContext('2d');
                        
                        // 绘制预处理图像（提高对比度）
                        detectCtx.drawImage(imageCanvas, 0, 0, detectWidth, detectHeight);
                        
                        // 应用图像增强
                        const imageData = detectCtx.getImageData(0, 0, detectWidth, detectHeight);
                        enhanceImage(imageData.data);
                        detectCtx.putImageData(imageData, 0, 0);
                        
                        // 尝试识别
                        const code = jsQR(
                            imageData.data,
                            detectWidth,
                            detectHeight,
                            {
                                inversionAttempts: 'dontInvert',
                                canOverwriteImage: false
                            }
                        );
                        
                        if (code) {
                            // 计算原始图像中的坐标
                            const scaleX = imageCanvas.width / detectWidth;
                            const scaleY = imageCanvas.height / detectHeight;
                            
                            qrCodeLocation = {
                                topLeftCorner: {
                                    x: code.location.topLeftCorner.x * scaleX,
                                    y: code.location.topLeftCorner.y * scaleY
                                },
                                topRightCorner: {
                                    x: code.location.topRightCorner.x * scaleX,
                                    y: code.location.topRightCorner.y * scaleY
                                },
                                bottomLeftCorner: {
                                    x: code.location.bottomLeftCorner.x * scaleX,
                                    y: code.location.bottomLeftCorner.y * scaleY
                                },
                                bottomRightCorner: {
                                    x: code.location.bottomRightCorner.x * scaleX,
                                    y: code.location.bottomRightCorner.y * scaleY
                                },
                                dimension: Math.max(
                                    Math.abs(code.location.topRightCorner.x - code.location.topLeftCorner.x),
                                    Math.abs(code.location.bottomLeftCorner.y - code.location.topLeftCorner.y)
                                ) * scaleX
                            };
                            
                            applyBlur();
                            saveBtn.disabled = false;
                            hideLoading();
                        } else {
                            hideLoading();
                            showError('未检测到二维码，请尝试调整图片角度或确保二维码清晰可见');
                        }
                    } catch (error) {
                        hideLoading();
                        showError('二维码识别失败，请尝试其他图片');
                        console.error('QR识别错误:', error);
                    }
                }, 100);
            });
            
            // 图像增强处理
            function enhanceImage(imageData) {
                // 简单的对比度增强
                const contrast = 1.5;
                const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                
                for (let i = 0; i < imageData.length; i += 4) {
                    imageData[i] = factor * (imageData[i] - 128) + 128;
                    imageData[i+1] = factor * (imageData[i+1] - 128) + 128;
                    imageData[i+2] = factor * (imageData[i+2] - 128) + 128;
                }
            }
            
            // 应用高斯模糊
            function applyBlur() {
                if (!qrCodeLocation) return;
                
                showLoading('正在打码处理...');
                
                // 创建临时canvas处理模糊
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = imageCanvas.width;
                tempCanvas.height = imageCanvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                
                // 绘制原始图像
                tempCtx.drawImage(imageCanvas, 0, 0);
                
                // 提取二维码区域
                const { x, y, width, height } = getQRCodeArea();
                
                // 创建一个新的canvas用于模糊处理
                const blurCanvas = document.createElement('canvas');
                blurCanvas.width = width;
                blurCanvas.height = height;
                const blurCtx = blurCanvas.getContext('2d');
                
                // 提取二维码区域图像
                blurCtx.drawImage(
                    tempCanvas,
                    x, y, width, height,
                    0, 0, width, height
                );
                
                // 应用高斯模糊
                blurCtx.filter = 'blur(10px)';
                blurCtx.drawImage(blurCanvas, 0, 0);
                blurCtx.filter = 'none';
                
                // 将模糊后的图像绘制回原canvas
                tempCtx.drawImage(
                    blurCanvas,
                    0, 0, width, height,
                    x, y, width, height
                );
                
                // 更新canvas和预览
                ctx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
                ctx.drawImage(tempCanvas, 0, 0);
                imagePreview.src = tempCanvas.toDataURL(imageType);
                
                hideLoading();
            }
            
            // 获取二维码区域（扩大30%范围）
            function getQRCodeArea() {
                // 修改为0 padding，确保正好覆盖二维码
                const padding = 0; // 无额外 padding
                const topLeft = qrCodeLocation.topLeftCorner;
                const bottomRight = qrCodeLocation.bottomRightCorner;
                const dimension = qrCodeLocation.dimension;
                
                // 精确计算二维码边界，不添加额外 padding
                const x = Math.max(0, topLeft.x);
                const y = Math.max(0, topLeft.y);
                
                // 计算精确的宽度和高度，确保正好覆盖二维码
                const width = Math.min(
                    imageCanvas.width - x,
                    bottomRight.x - topLeft.x
                );
                const height = Math.min(
                    imageCanvas.height - y,
                    bottomRight.y - topLeft.y
                );
                
                return { x, y, width, height };
            }
            
            // 保存图片
            saveBtn.addEventListener('click', function() {
                if (!currentImageData) return;
                
                showLoading('正在生成图片...');
                
                // 确保canvas数据是最新的
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = imageCanvas.width;
                tempCanvas.height = imageCanvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(imageCanvas, 0, 0);
                
                // 确保imageType有有效值
                const saveImageType = imageType && ['image/png', 'image/jpeg', 'image/webp'].includes(imageType) ? imageType : 'image/jpeg';
                const extension = saveImageType === 'image/png' ? '.png' : saveImageType === 'image/webp' ? '.webp' : '.jpg';
                
                setTimeout(() => {
                    try {
                        const link = document.createElement('a');
                        link.download = 'qr-blurred' + extension;
                        // 添加质量参数
                        link.href = tempCanvas.toDataURL(saveImageType, 0.9);
                        document.body.appendChild(link);
                        
                        // 使用新的点击方式以提高兼容性
                        const event = new MouseEvent('click', {
                            view: window,
                            bubbles: true,
                            cancelable: true
                        });
                        link.dispatchEvent(event);
                        
                        setTimeout(() => {
                            document.body.removeChild(link);
                            hideLoading();
                        }, 100);
                    } catch (error) {
                        hideLoading();
                        showError('保存图片失败: ' + error.message);
                        console.error('保存错误:', error);
                    }
                }, 200); // 增加延迟时间以确保canvas渲染完成
            });
            
            // 重置图片
            resetBtn.addEventListener('click', function() {
                if (!originalImageData) return;
                
                ctx.putImageData(originalImageData, 0, 0);
                currentImageData = originalImageData;
                qrCodeLocation = null;
                imagePreview.src = originalImageSrc;
                saveBtn.disabled = true;
            });
            
            // 显示加载状态
            function showLoading(text) {
                loadingText.textContent = text || '处理中...';
                loading.style.display = 'flex';
            }
            
            // 隐藏加载状态
            function hideLoading() {
                loading.style.display = 'none';
            }
            
            // 显示错误信息
            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
                
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
