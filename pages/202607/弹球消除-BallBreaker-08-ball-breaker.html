<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹球消除 - Ball Breaker</title>
    <style>
        /* 
        游戏介绍：炫彩霓虹风格的弹球消除游戏
        游戏规则：控制挡板反弹小球，消除所有彩色砖块
        详细玩法：
        1. 使用鼠标或左右键控制挡板移动
        2. 小球碰到砖块会消除砖块并获得分数
        3. 不同颜色的砖块有不同分值
        4. 小球掉落到底部会失去生命值
        5. 炫彩霓虹风格的视觉效果
        */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            font-family: 'Arial', sans-serif;
            color: #ff00ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 10px 102px 10px;
            overflow-x: hidden;
        }

        .game-container {
            background: radial-gradient(circle at center, rgba(255, 0, 255, 0.1) 0%, transparent 70%),
                        linear-gradient(135deg, #111111 0%, #221133 100%);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 30px #ff00ff,
                inset 0 0 30px rgba(255, 0, 255, 0.1);
            width: min(90vw, 420px);
            max-height: calc(100vh - 140px);
            padding: 15px;
            margin-bottom: 12px;
        }

        .title {
            font-size: clamp(1.5em, 4vw, 2.5em);
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
            animation: neonRainbow 3s infinite;
            letter-spacing: 2px;
        }

        @keyframes neonRainbow {
            0% { 
                filter: hue-rotate(0deg) brightness(1);
            }
            25% { 
                filter: hue-rotate(90deg) brightness(1.2);
            }
            50% { 
                filter: hue-rotate(180deg) brightness(1);
            }
            75% { 
                filter: hue-rotate(270deg) brightness(1.2);
            }
            100% { 
                filter: hue-rotate(360deg) brightness(1);
            }
        }

        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: clamp(0.9em, 2.5vw, 1.2em);
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-weight: bold;
        }

        #gameCanvas {
            display: block;
            border: 1px solid #00ffff;
            cursor: none;
            background: 
                radial-gradient(circle at 25% 25%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            width: 100%;
            height: auto;
            max-width: 400px;
            max-height: calc(100vh - 200px);
        }

        .controls {
            margin-top: 8px;
            text-align: center;
            font-size: clamp(0.8em, 2vw, 1em);
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.95);
            color: #ff00ff;
            padding: 30px;
            border: 2px solid #ff00ff;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 
                0 0 40px #ff00ff,
                inset 0 0 20px rgba(255, 0, 255, 0.2);
        }

        .game-over h2 {
            white-space: nowrap;
            margin: 0 0 15px 0;
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-family: 'Arial', sans-serif;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 25px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
            letter-spacing: 1px;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px 5px 102px 5px;
            }
            
            .game-container {
                width: 95vw;
                max-height: calc(100vh - 120px);
                padding: 10px;
            }
            
            #gameCanvas {
                cursor: default;
                max-height: calc(100vh - 180px);
            }
        }
        
        @media (max-height: 600px) {
            .game-container {
                max-height: calc(100vh - 100px);
            }
            
            #gameCanvas {
                max-height: calc(100vh - 160px);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">⚡ 弹球消除 ⚡</div>
        <div class="hud">
            <span>得分: <span id="score">0</span></span>
            <span>最高分: <span id="highScore">0</span></span>
            <span>生命: <span id="lives">3</span></span>
            <span>关卡: <span id="level">1</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div class="controls">
            鼠标/左右键控制挡板 | 消除所有砖块！
        </div>
        
        <div class="game-over" id="gameOver">
            <h2 id="gameOverTitle">💥 游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <p>最高得分: <span id="finalHighScore">0</span></p>
            <p>通过关卡: <span id="finalLevel">0</span></p>
            <button class="restart-btn" onclick="restartGame()">🔄 重新开始</button>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');
        const finalLevelElement = document.getElementById('finalLevel');

        // 游戏状态
        let gameRunning = true;
        let score = 0;
        let lives = 3;
        let level = 1;
        let highScore = localStorage.getItem('ballBreakerHighScore') ? parseInt(localStorage.getItem('ballBreakerHighScore')) : 0;
        
        // 初始化最高分显示
        highScoreElement.textContent = highScore;

        // 挡板
        let paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 8,
            color: '#00ffff'
        };

        // 小球
        let ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 8,
            vx: 4,
            vy: -4,
            color: '#ffffff',
            trail: []
        };

        // 砖块数组
        let bricks = [];
        
        // 粒子系统
        let particles = [];
        
        // 键盘状态
        let keys = {};
        
        // 鼠标位置
        let mouseX = canvas.width / 2;

        // 砖块颜色和分值
        const brickColors = [
            { color: '#ff0080', value: 50 },
            { color: '#ff8000', value: 40 },
            { color: '#ffff00', value: 30 },
            { color: '#80ff00', value: 20 },
            { color: '#00ff80', value: 10 }
        ];

        // 初始化砖块
        function initBricks() {
            bricks = [];
            const rows = 5 + level;
            const cols = 8;
            const brickWidth = canvas.width / cols;
            const brickHeight = 20;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const colorIndex = row % brickColors.length;
                    bricks.push({
                        x: col * brickWidth,
                        y: 50 + row * (brickHeight + 2),
                        width: brickWidth - 2,
                        height: brickHeight,
                        color: brickColors[colorIndex].color,
                        value: brickColors[colorIndex].value,
                        destroyed: false,
                        glowIntensity: Math.random()
                    });
                }
            }
        }

        // 创建粒子
        function createParticle(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 20,
                    y: y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.02,
                    color: color,
                    size: Math.random() * 4 + 1
                });
            }
        }

        // 绘制发光效果
        function drawGlow(x, y, width, height, color, intensity = 1) {
            ctx.shadowColor = color;
            ctx.shadowBlur = 15 * intensity;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
            ctx.shadowBlur = 0;
        }

        // 绘制挡板
        function drawPaddle() {
            // 挡板主体
            drawGlow(paddle.x, paddle.y, paddle.width, paddle.height, paddle.color);
            
            // 挡板装饰
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(paddle.x + 10, paddle.y + 2, paddle.width - 20, 3);
            ctx.fillRect(paddle.x + 20, paddle.y + 8, paddle.width - 40, 3);
        }

        // 绘制小球
        function drawBall() {
            // 小球拖尾
            ball.trail.forEach((point, index) => {
                const alpha = index / ball.trail.length;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10 * alpha;
                ctx.beginPath();
                ctx.arc(point.x, point.y, ball.radius * alpha, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 小球主体
            ctx.shadowColor = ball.color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 小球内核
            ctx.fillStyle = '#ffff80';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // 绘制砖块
        function drawBricks() {
            bricks.forEach(brick => {
                if (!brick.destroyed) {
                    brick.glowIntensity += (Math.random() - 0.5) * 0.1;
                    brick.glowIntensity = Math.max(0.5, Math.min(1.5, brick.glowIntensity));
                    
                    drawGlow(brick.x, brick.y, brick.width, brick.height, brick.color, brick.glowIntensity);
                    
                    // 砖块边框
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 砖块分值显示
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(brick.value, brick.x + brick.width/2, brick.y + brick.height/2 + 4);
                }
            });
        }

        // 绘制粒子
        function drawParticles() {
            particles.forEach(particle => {
                const alpha = particle.life;
                ctx.fillStyle = particle.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.shadowColor = particle.color;
                ctx.shadowBlur = 5;
                
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        // 绘制背景网格
        function drawBackground() {
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.1)';
            ctx.lineWidth = 1;
            
            // 垂直线
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        // 更新游戏逻辑
        function update() {
            if (!gameRunning) return;

            // 更新挡板位置
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                paddle.x = Math.max(0, paddle.x - paddle.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
            }
            
            // 鼠标控制挡板
            paddle.x = mouseX - paddle.width / 2;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // 更新小球位置
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 更新小球尾迹
            ball.trail.push({x: ball.x, y: ball.y});
            if (ball.trail.length > 8) {
                ball.trail.shift();
            }

            // 小球边界碰撞
            if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
                ball.vx = -ball.vx;
                createParticle(ball.x, ball.y, '#00ffff', 5);
            }
            if (ball.y - ball.radius <= 0) {
                ball.vy = -ball.vy;
                createParticle(ball.x, ball.y, '#00ffff', 5);
            }

            // 小球和挡板碰撞
            if (ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x + ball.radius > paddle.x &&
                ball.x - ball.radius < paddle.x + paddle.width) {
                
                // 计算反弹角度
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = (hitPos - 0.5) * Math.PI / 3;
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                
                ball.vx = Math.sin(angle) * speed;
                ball.vy = -Math.abs(Math.cos(angle) * speed);
                
                createParticle(ball.x, ball.y, paddle.color, 8);
            }

            // 小球和砖块碰撞
            bricks.forEach((brick, index) => {
                if (!brick.destroyed &&
                    ball.x + ball.radius > brick.x &&
                    ball.x - ball.radius < brick.x + brick.width &&
                    ball.y + ball.radius > brick.y &&
                    ball.y - ball.radius < brick.y + brick.height) {
                    
                    // 确定碰撞方向
                    const overlapX = Math.min(ball.x + ball.radius - brick.x, brick.x + brick.width - ball.x + ball.radius);
                    const overlapY = Math.min(ball.y + ball.radius - brick.y, brick.y + brick.height - ball.y + ball.radius);
                    
                    if (overlapX < overlapY) {
                        ball.vx = -ball.vx;
                    } else {
                        ball.vy = -ball.vy;
                    }
                    
                    // 消除砖块
                    brick.destroyed = true;
                    score += brick.value;
                    scoreElement.textContent = score;
                    
                    // 更新最高分
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('ballBreakerHighScore', highScore);
                    }
                    
                    createParticle(brick.x + brick.width/2, brick.y + brick.height/2, brick.color, 12);
                }
            });

            // 检查小球是否掉落
            if (ball.y > canvas.height) {
                lives--;
                livesElement.textContent = lives;
                
                if (lives <= 0) {
                    gameOver();
                } else {
                    resetBall();
                }
            }

            // 检查是否通关
            if (bricks.every(brick => brick.destroyed)) {
                level++;
                levelElement.textContent = level;
                initBricks();
                resetBall();
                
                // 增加小球速度
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                const newSpeed = Math.min(speed + 0.5, 8);
                ball.vx = (ball.vx / speed) * newSpeed;
                ball.vy = (ball.vy / speed) * newSpeed;
            }

            // 更新粒子
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.98;
                particle.vy *= 0.98;
                particle.life -= particle.decay;
                return particle.life > 0;
            });
        }

        // 重置小球
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.vx = (Math.random() - 0.5) * 6;
            ball.vy = -Math.abs(ball.vy);
            ball.trail = [];
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = 'rgba(10, 10, 10, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            if (gameRunning) {
                drawBricks();
                drawParticles();
                drawPaddle();
                drawBall();
            }
        }

        // 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            finalLevelElement.textContent = level - 1;
            
            if (lives <= 0) {
                gameOverTitle.textContent = '💥 游戏结束 💥';
            } else {
                gameOverTitle.textContent = '🎉 恭喜通关 🎉';
            }
            
            gameOverElement.style.display = 'block';
        }

        // 重新开始游戏
        function restartGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            level = 1;
            
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
            gameOverElement.style.display = 'none';
            
            // 重置游戏对象
            paddle.x = canvas.width / 2 - 50;
            resetBall();
            
            // 清空粒子
            particles = [];
            
            // 重新初始化砖块
            initBricks();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 鼠标事件
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        // 触摸事件
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        });

        // 响应式画布
        function resizeCanvas() {
            const maxWidth = 400;
            const maxHeight = Math.min(500, window.innerHeight - 200);
            
            if (window.innerWidth <= 768) {
                canvas.width = Math.min(350, window.innerWidth - 30);
                canvas.height = Math.min(450, window.innerHeight - 180);
            } else {
                canvas.width = Math.min(maxWidth, window.innerWidth - 40);
                canvas.height = Math.min(maxHeight, window.innerHeight - 200);
            }
            
            // 确保最小尺寸
            canvas.width = Math.max(300, canvas.width);
            canvas.height = Math.max(400, canvas.height);
            
            // 重新调整游戏对象位置
            paddle.x = canvas.width / 2 - 50;
            paddle.y = canvas.height - 30;
            resetBall();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 初始化游戏
        initBricks();
        gameLoop();

        // Footer 脚本
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
                document.body.appendChild(tpl.content.cloneNode(true));
            }

            document.querySelectorAll('.qr-wrapper').forEach(w => {
                const link = w.querySelector('.qr-link');
                const img = w.querySelector('.qr-img');
                if (link && img && link.dataset.img) {
                    img.src = link.dataset.img.trim();
                }
            });
        });
    </script>
</body>
</html>
