<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标测试工具 | Mouse Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .test-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .test-area {
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            width: 400px;
            height: 300px;
            position: relative;
            background-color: #f9f9f9;
            overflow: hidden;
        }
        .test-area h2 {
            margin-top: 0;
        }
        .info-panel {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            background-color: white;
            text-align: left;
        }
        .info-row {
            display: flex;
            margin-bottom: 8px;
        }
        .info-label {
            font-weight: bold;
            min-width: 120px;
        }
        .click-spot {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #666;
        }
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-btn {
            padding: 5px 10px;
            border: 1px solid #ccc;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 3px;
        }
        .language-btn.active {
            background: #4CAF50;
            color: white;
        }
        .click-counter {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .click-type {
            text-align: center;
        }
        .click-count {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        .instructions {
            margin: 20px 0;
            padding: 15px;
            background-color: #e7f3fe;
            border-left: 6px solid #2196F3;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <button id="langZh" class="language-btn active">中文</button>
        <button id="langEn" class="language-btn">English</button>
    </div>
    
    <h1 id="title">鼠标测试工具</h1>
    
    <div class="instructions" id="instructions">
        <p id="instructionText">请在下方测试区域移动、点击鼠标或滚动滚轮。此工具将显示鼠标的详细信息，包括位置、按钮状态和滚轮方向。</p>
    </div>
    
    <div class="test-container">
        <div class="test-area" id="moveTestArea">
            <h2 id="moveTestTitle">鼠标移动测试</h2>
            <div id="clickSpot" class="click-spot" style="display: none;"></div>
            <div class="coordinates" id="coordinates">X: 0, Y: 0</div>
            
            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label" id="positionLabel">当前位置:</span>
                    <span id="position">(0, 0)</span>
                </div>
                <div class="info-row">
                    <span class="info-label" id="movementLabel">移动方向:</span>
                    <span id="movement">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label" id="buttonsLabel">按钮状态:</span>
                    <span id="buttons">未按下</span>
                </div>
                <div class="info-row">
                    <span class="info-label" id="wheelLabel">滚轮状态:</span>
                    <span id="wheel">-</span>
                </div>
            </div>
        </div>
        
        <div class="test-area" id="clickTestArea">
            <h2 id="clickTestTitle">鼠标点击测试</h2>
            
            <div class="click-counter">
                <div class="click-type">
                    <div id="leftClickLabel">左键点击</div>
                    <div class="click-count" id="leftClickCount">0</div>
                </div>
                <div class="click-type">
                    <div id="rightClickLabel">右键点击</div>
                    <div class="click-count" id="rightClickCount">0</div>
                </div>
                <div class="click-type">
                    <div id="middleClickLabel">中键点击</div>
                    <div class="click-count" id="middleClickCount">0</div>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label" id="lastClickLabel">最后点击:</span>
                    <span id="lastClick">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label" id="doubleClickLabel">双击测试:</span>
                    <span id="doubleClick">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label" id="clickPositionLabel">点击位置:</span>
                    <span id="clickPosition">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 多语言文本
        const translations = {
            zh: {
                title: "鼠标测试工具",
                instructionText: "请在下方测试区域移动、点击鼠标或滚动滚轮。此工具将显示鼠标的详细信息，包括位置、按钮状态和滚轮方向。",
                moveTestTitle: "鼠标移动测试",
                clickTestTitle: "鼠标点击测试",
                positionLabel: "当前位置:",
                movementLabel: "移动方向:",
                buttonsLabel: "按钮状态:",
                wheelLabel: "滚轮状态:",
                lastClickLabel: "最后点击:",
                doubleClickLabel: "双击测试:",
                clickPositionLabel: "点击位置:",
                leftClickLabel: "左键点击",
                rightClickLabel: "右键点击",
                middleClickLabel: "中键点击",
                noPress: "未按下",
                wheelUp: "向上滚动",
                wheelDown: "向下滚动",
                wheelNone: "无滚动",
                leftButton: "左键",
                rightButton: "右键",
                middleButton: "中键",
                button4: "按钮4",
                button5: "按钮5",
                singleClick: "单击",
                doubleClick: "双击"
            },
            en: {
                title: "Mouse Tester",
                instructionText: "Move, click or scroll in the test area below. This tool will display detailed information about your mouse, including position, button states and wheel direction.",
                moveTestTitle: "Mouse Movement Test",
                clickTestTitle: "Mouse Click Test",
                positionLabel: "Position:",
                movementLabel: "Movement:",
                buttonsLabel: "Buttons:",
                wheelLabel: "Wheel:",
                lastClickLabel: "Last click:",
                doubleClickLabel: "Double click:",
                clickPositionLabel: "Click position:",
                leftClickLabel: "Left click",
                rightClickLabel: "Right click",
                middleClickLabel: "Middle click",
                noPress: "No press",
                wheelUp: "Wheel up",
                wheelDown: "Wheel down",
                wheelNone: "No wheel movement",
                leftButton: "Left button",
                rightButton: "Right button",
                middleButton: "Middle button",
                button4: "Button 4",
                button5: "Button 5",
                singleClick: "Single click",
                doubleClick: "Double click"
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            const moveTestArea = document.getElementById('moveTestArea');
            const clickTestArea = document.getElementById('clickTestArea');
            const clickSpot = document.getElementById('clickSpot');
            const coordinates = document.getElementById('coordinates');
            
            // 信息显示元素
            const position = document.getElementById('position');
            const movement = document.getElementById('movement');
            const buttons = document.getElementById('buttons');
            const wheel = document.getElementById('wheel');
            const leftClickCount = document.getElementById('leftClickCount');
            const rightClickCount = document.getElementById('rightClickCount');
            const middleClickCount = document.getElementById('middleClickCount');
            const lastClick = document.getElementById('lastClick');
            const doubleClick = document.getElementById('doubleClick');
            const clickPosition = document.getElementById('clickPosition');
            
            // 语言切换元素
            const langZhBtn = document.getElementById('langZh');
            const langEnBtn = document.getElementById('langEn');
            
            let currentLang = 'zh';
            let leftClicks = 0;
            let rightClicks = 0;
            let middleClicks = 0;
            let lastClickTime = 0;
            let lastX = 0;
            let lastY = 0;
            let lastMoveTime = 0;
            let lastDirection = '';
            
            // 初始化语言
            updateLanguage(currentLang);
            
            // 中文按钮点击事件
            langZhBtn.addEventListener('click', function() {
                currentLang = 'zh';
                updateLanguage(currentLang);
                langZhBtn.classList.add('active');
                langEnBtn.classList.remove('active');
            });
            
            // 英文按钮点击事件
            langEnBtn.addEventListener('click', function() {
                currentLang = 'en';
                updateLanguage(currentLang);
                langEnBtn.classList.add('active');
                langZhBtn.classList.remove('active');
            });
            
            // 鼠标移动事件
            moveTestArea.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // 更新位置显示
                position.textContent = `(${Math.round(x)}, ${Math.round(y)})`;
                coordinates.textContent = `X: ${Math.round(x)}, Y: ${Math.round(y)}`;
                
                // 显示点击点
                clickSpot.style.left = `${x}px`;
                clickSpot.style.top = `${y}px`;
                clickSpot.style.display = 'block';
                
                // 计算移动方向
                const now = Date.now();
                if (lastMoveTime > 0 && now - lastMoveTime < 100) {
                    let direction = '';
                    if (x > lastX + 2) direction += '→';
                    else if (x < lastX - 2) direction += '←';
                    
                    if (y > lastY + 2) direction += '↓';
                    else if (y < lastY - 2) direction += '↑';
                    
                    if (direction !== '') {
                        lastDirection = direction;
                        movement.textContent = direction;
                    }
                }
                
                lastX = x;
                lastY = y;
                lastMoveTime = now;
            });
            
            // 鼠标离开区域事件
            moveTestArea.addEventListener('mouseleave', function() {
                clickSpot.style.display = 'none';
                movement.textContent = '-';
            });
            
            // 鼠标按钮按下事件
            document.addEventListener('mousedown', function(e) {
                updateButtonStates(e);
            });
            
            // 鼠标按钮释放事件
            document.addEventListener('mouseup', function(e) {
                updateButtonStates(e);
            });
            
            // 鼠标滚轮事件
            document.addEventListener('wheel', function(e) {
                const t = translations[currentLang];
                wheel.textContent = e.deltaY < 0 ? t.wheelUp : t.wheelDown;
                setTimeout(() => {
                    wheel.textContent = t.wheelNone;
                }, 500);
            });
            
            // 鼠标点击事件
            clickTestArea.addEventListener('click', function(e) {
                if (e.button === 0) { // 左键
                    leftClicks++;
                    leftClickCount.textContent = leftClicks;
                    updateClickInfo(e, translations[currentLang].leftButton);
                }
            });
            
            // 鼠标右键点击事件
            clickTestArea.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                rightClicks++;
                rightClickCount.textContent = rightClicks;
                updateClickInfo(e, translations[currentLang].rightButton);
                return false;
            });
            
            // 鼠标中键点击事件
            clickTestArea.addEventListener('auxclick', function(e) {
                if (e.button === 1) { // 中键
                    e.preventDefault();
                    middleClicks++;
                    middleClickCount.textContent = middleClicks;
                    updateClickInfo(e, translations[currentLang].middleButton);
                }
            });
            
            // 双击测试
            clickTestArea.addEventListener('dblclick', function(e) {
                const t = translations[currentLang];
                doubleClick.textContent = `${t.doubleClick} (${getButtonName(e.button, t)})`;
            });
            
            // 更新按钮状态显示
            function updateButtonStates(e) {
                const t = translations[currentLang];
                const pressedButtons = [];
                
                if (e.buttons & 1) pressedButtons.push(t.leftButton);
                if (e.buttons & 2) pressedButtons.push(t.rightButton);
                if (e.buttons & 4) pressedButtons.push(t.middleButton);
                if (e.buttons & 8) pressedButtons.push(t.button4);
                if (e.buttons & 16) pressedButtons.push(t.button5);
                
                buttons.textContent = pressedButtons.length > 0 
                    ? pressedButtons.join(', ') 
                    : t.noPress;
            }
            
            // 更新点击信息
            function updateClickInfo(e, buttonName) {
                const t = translations[currentLang];
                const now = Date.now();
                const rect = clickTestArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                lastClick.textContent = `${buttonName} - ${t.singleClick}`;
                clickPosition.textContent = `(${Math.round(x)}, ${Math.round(y)})`;
                
                // 检测双击
                if (now - lastClickTime < 500) {
                    doubleClick.textContent = `${t.doubleClick} (${buttonName})`;
                }
                
                lastClickTime = now;
            }
            
            // 获取按钮名称
            function getButtonName(button, t) {
                switch(button) {
                    case 0: return t.leftButton;
                    case 1: return t.middleButton;
                    case 2: return t.rightButton;
                    case 3: return t.button4;
                    case 4: return t.button5;
                    default: return `Button ${button}`;
                }
            }
            
            // 更新界面语言
            function updateLanguage(lang) {
                const t = translations[lang];
                document.getElementById('title').textContent = t.title;
                document.getElementById('instructionText').textContent = t.instructionText;
                document.getElementById('moveTestTitle').textContent = t.moveTestTitle;
                document.getElementById('clickTestTitle').textContent = t.clickTestTitle;
                document.getElementById('positionLabel').textContent = t.positionLabel;
                document.getElementById('movementLabel').textContent = t.movementLabel;
                document.getElementById('buttonsLabel').textContent = t.buttonsLabel;
                document.getElementById('wheelLabel').textContent = t.wheelLabel;
                document.getElementById('lastClickLabel').textContent = t.lastClickLabel;
                document.getElementById('doubleClickLabel').textContent = t.doubleClickLabel;
                document.getElementById('clickPositionLabel').textContent = t.clickPositionLabel;
                document.getElementById('leftClickLabel').textContent = t.leftClickLabel;
                document.getElementById('rightClickLabel').textContent = t.rightClickLabel;
                document.getElementById('middleClickLabel').textContent = t.middleClickLabel;
                
                // 重置一些状态文本
                buttons.textContent = t.noPress;
                wheel.textContent = t.wheelNone;
                movement.textContent = '-';
            }
        });
    </script>
</body>
</html>
