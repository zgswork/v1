        // 获取DOM元素
        const getGuideBtn = document.getElementById('getGuideBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const attractionContent = document.getElementById('attractionContent');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];
        
        // 上次显示的景点索引
        let lastIndex = -1;
        
        // 获取随机景点(不重复)
        function getRandomAttraction() {
            if (attractions.length === 1) return attractions[0];
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (randomIndex === lastIndex && attractions.length > 1);
            
            lastIndex = randomIndex;
            return attractions[randomIndex];
        }
        
        // 显示景点信息
        function displayAttraction(attraction) {
            attractionContent.innerHTML = `
                <div class="attraction-name">${attraction.name}</div>
                <div class="attraction-info">
                    <div><span class="info-title">景点介绍：</span>${attraction.description}</div>
                    <div><span class="info-title">具体地址：</span>${attraction.address}</div>
                    <div><span class="info-title">交通攻略：</span>${attraction.transport}</div>
                    <div><span class="info-title">门票信息：</span>${attraction.ticket}</div>
                    <div><span class="info-title">开放时间：</span>${attraction.openTime}</div>
                </div>
            `;
            
            resultContainer.style.display = 'block';
            changeBtn.style.display = 'inline-block';
        }
        
        // 按钮点击事件
        getGuideBtn.addEventListener('click', function() {
            const randomAttraction = getRandomAttraction();
            displayAttraction(randomAttraction);
        });
        
        changeBtn.addEventListener('click', function() {
            const randomAttraction = getRandomAttraction();
            displayAttraction(randomAttraction);
        });

        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭弹窗
        span.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
