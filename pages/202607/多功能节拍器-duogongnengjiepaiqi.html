<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能节拍器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff9966, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .display-container {
            background: rgba(50, 50, 70, 0.5);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .bpm-display {
            font-size: 5rem;
            font-weight: bold;
            margin: 15px 0;
            color: #4facfe;
        }

        .beat-indicator {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .beat-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #333;
            margin: 0 8px;
            transition: all 0.1s ease;
        }

        .beat-dot.active {
            background: #ff5e62;
            transform: scale(1.3);
            box-shadow: 0 0 15px #ff5e62;
        }

        .beat-dot.strong {
            background: #4facfe;
        }

        .beat-dot.active.strong {
            background: #00c9ff;
            box-shadow: 0 0 15px #00c9ff;
            transform: scale(1.5);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: rgba(40, 40, 60, 0.6);
            padding: 20px;
            border-radius: 12px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #aaccff;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(30, 30, 50, 0.8);
            color: white;
            border: 1px solid #4facfe;
            font-size: 1rem;
            margin-top: 8px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        #stopBtn {
            background: linear-gradient(to right, #ff5e62, #ff9966);
        }

        .pulse {
            animation: pulse 0.5s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .bpm-display {
                font-size: 4rem;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多功能节拍器</h1>
        <p class="subtitle">音乐练习的完美伴侣 - 适配所有设备</p>
        
        <div class="display-container">
            <div class="bpm-display" id="bpmDisplay">120</div>
            <div class="beat-indicator" id="beatIndicator">
                <!-- Beat dots will be generated here -->
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <h2>速度控制</h2>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>慢</span>
                        <span>BPM: <span id="bpmValue">120</span></span>
                        <span>快</span>
                    </div>
                    <input type="range" id="bpmSlider" min="40" max="240" value="120">
                </div>
            </div>
            
            <div class="control-group">
                <h2>节拍设置</h2>
                <label for="beatsInput">每小节拍数:</label>
                <input type="number" id="beatsInput" min="1" max="12" value="4">
                
                <label for="soundSelect">声音类型:</label>
                <select id="soundSelect">
                    <option value="beep">电子音</option>
                    <option value="click">机械声</option>
                    <option value="drum">鼓点</option>
                    <option value="wood">木鱼</option>
                </select>
            </div>
        </div>
        
        <div class="button-container">
            <button id="startBtn">开始</button>
            <button id="stopBtn">停止</button>
        </div>
    </div>

    <script>
        // DOM元素
        const bpmDisplay = document.getElementById('bpmDisplay');
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmValue = document.getElementById('bpmValue');
        const beatsInput = document.getElementById('beatsInput');
        const beatIndicator = document.getElementById('beatIndicator');
        const soundSelect = document.getElementById('soundSelect');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        // 全局变量
        let isPlaying = false;
        let timer = null;
        let currentBeat = 0;
        let beatsPerMeasure = 4;
        let audioContext;
        let sounds = {};
        
        // 初始化节拍点
        function initBeatDots() {
            beatIndicator.innerHTML = '';
            for (let i = 0; i < beatsPerMeasure; i++) {
                const dot = document.createElement('div');
                dot.className = 'beat-dot' + (i === 0 ? ' strong' : '');
                beatIndicator.appendChild(dot);
            }
        }
        
        // 初始化声音
        function initSounds() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // 创建不同的声音
            sounds = {
                beep: (accent) => createBeepSound(accent ? 880 : 440),
                click: (accent) => createClickSound(accent),
                drum: (accent) => createDrumSound(accent),
                wood: () => createWoodSound()
            };
        }
        
        // 创建蜂鸣声
        function createBeepSound(frequency) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            gainNode.gain.value = 0.2;
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        // 创建机械点击声
        function createClickSound(accent) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.value = accent ? 150 : 100;
            gainNode.gain.value = accent ? 0.3 : 0.2;
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.05);
        }
        
        // 创建鼓声
        function createDrumSound(accent) {
            // 模拟鼓声的简单方法
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = accent ? 'sine' : 'triangle';
            oscillator.frequency.value = accent ? 100 : 200;
            gainNode.gain.value = accent ? 0.5 : 0.3;
            
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        // 创建木鱼声
        function createWoodSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 300;
            gainNode.gain.value = 0.4;
            
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        
        // 播放节拍
        function playBeat() {
            const beats = document.querySelectorAll('.beat-dot');
            
            // 重置所有点
            beats.forEach(beat => beat.classList.remove('active'));
            
            // 激活当前点
            beats[currentBeat].classList.add('active');
            
            // 播放声音（第一拍是强拍）
            const soundType = soundSelect.value;
            const accent = currentBeat === 0;
            
            if (sounds[soundType]) {
                sounds[soundType](accent);
            }
            
            // 更新当前拍
            currentBeat = (currentBeat + 1) % beatsPerMeasure;
        }
        
        // 开始节拍器
        function startMetronome() {
            if (isPlaying) return;
            
            // 初始化音频上下文（如果尚未初始化）
            if (!audioContext) {
                initSounds();
            }
            
            isPlaying = true;
            startBtn.disabled = true;
            bpmSlider.disabled = true;
            
            const bpm = parseInt(bpmSlider.value);
            const interval = 60000 / bpm; // 毫秒
            
            // 立即播放第一拍
            playBeat();
            
            // 设置定时器
            timer = setInterval(playBeat, interval);
            
            // 添加脉冲动画
            bpmDisplay.classList.add('pulse');
        }
        
        // 停止节拍器
        function stopMetronome() {
            if (!isPlaying) return;
            
            isPlaying = false;
            startBtn.disabled = false;
            bpmSlider.disabled = false;
            
            clearInterval(timer);
            
            // 重置节拍点
            currentBeat = 0;
            const beats = document.querySelectorAll('.beat-dot');
            beats.forEach(beat => beat.classList.remove('active'));
            
            // 移除脉冲动画
            bpmDisplay.classList.remove('pulse');
        }
        
        // 更新BPM显示
        function updateBpmDisplay() {
            const bpm = bpmSlider.value;
            bpmDisplay.textContent = bpm;
            bpmValue.textContent = bpm;
            bpmDisplay.classList.add('pulse');
            
            // 如果正在播放，重新设置定时器
            if (isPlaying) {
                stopMetronome();
                startMetronome();
            }
            
            // 移除动画类
            setTimeout(() => {
                bpmDisplay.classList.remove('pulse');
            }, 300);
        }
        
        // 更新节拍数
        function updateBeats() {
            beatsPerMeasure = parseInt(beatsInput.value) || 4;
            initBeatDots();
            
            // 如果正在播放，重新设置定时器
            if (isPlaying) {
                stopMetronome();
                startMetronome();
            }
        }
        
        // 事件监听器
        bpmSlider.addEventListener('input', updateBpmDisplay);
        beatsInput.addEventListener('input', updateBeats);
        startBtn.addEventListener('click', startMetronome);
        stopBtn.addEventListener('click', stopMetronome);
        
        // 初始化
        initBeatDots();
        updateBpmDisplay();
        
        // 添加触摸设备支持
        document.body.addEventListener('touchend', function() {
            if (!audioContext) {
                initSounds();
            }
        });
    </script>
</body>
</html>
