<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF转换工具 | PDF转Word/Markdown - DKFile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .card-content {
            display: flex;
            flex-wrap: wrap;
            min-height: 500px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            background: #f8f9ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .preview-section {
            flex: 1;
            min-width: 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: #4285f4;
        }
        
        .upload-area {
            width: 100%;
            height: 250px;
            border: 3px dashed #4285f4;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(66, 133, 244, 0.05);
            margin-bottom: 30px;
            position: relative;
        }
        
        .upload-area:hover {
            background: rgba(66, 133, 244, 0.1);
            transform: translateY(-5px);
        }
        
        .upload-area.highlight {
            border-color: #34a853;
            background: rgba(52, 168, 83, 0.1);
        }
        
        .upload-icon {
            font-size: 4rem;
            color: #4285f4;
            margin-bottom: 20px;
        }
        
        .upload-text h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .upload-text p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        
        .format-selection {
            width: 100%;
            margin-bottom: 30px;
        }
        
        .format-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .format-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .format-option {
            flex: 1;
            min-width: 120px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .format-option:hover {
            border-color: #4285f4;
            transform: translateY(-3px);
        }
        
        .format-option.active {
            border-color: #4285f4;
            background: rgba(66, 133, 244, 0.1);
        }
        
        .format-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4285f4;
        }
        
        .format-name {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .convert-btn {
            width: 100%;
            padding: 18px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
        }
        
        .convert-btn:hover {
            background: #3367d6;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.6);
        }
        
        .convert-btn:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .preview-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 15px;
            border: 2px dashed #e0e0e0;
        }
        
        .preview-icon {
            font-size: 4rem;
            color: #34a853;
            margin-bottom: 20px;
        }
        
        .preview-text h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .preview-text p {
            color: #7f8c8d;
            font-size: 0.95rem;
            max-width: 300px;
        }
        
        .download-btn {
            margin-top: 30px;
            padding: 16px 35px;
            background: #34a853;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(52, 168, 83, 0.4);
        }
        
        .download-btn:hover {
            background: #2d9147;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 168, 83, 0.6);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
            width: 100%;
        }
        
        .file-icon {
            font-size: 2.5rem;
            color: #4285f4;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #2c3e50;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .remove-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #e74c3c;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .remove-btn:hover {
            transform: scale(1.1);
        }
        
        .preview-content {
            flex: 1;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            overflow: auto;
            border: 1px solid #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .preview-content h4 {
            font-size: 1.3rem;
            margin: 15px 0 10px;
            color: #2c3e50;
        }
        
        .preview-content p {
            margin-bottom: 10px;
        }
        
        .preview-content ul {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        
        .preview-content li {
            margin-bottom: 5px;
        }
        
        .conversion-progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: #4285f4;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .status-text {
            text-align: center;
            font-size: 0.95rem;
            color: #4285f4;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            padding: 20px;
            font-size: 1rem;
        }
        
        footer a {
            color: white;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        .file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.3s, fadeOut 0.5s 2.5s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @keyframes slideIn {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 20px; opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        @media (max-width: 768px) {
            .card-content {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
            
            header p {
                font-size: 1rem;
            }
            
            .upload-section, .preview-section {
                padding: 25px;
            }
        }
        
        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .upload-icon {
                font-size: 3rem;
            }
            
            .upload-text h3 {
                font-size: 1.3rem;
            }
            
            .format-option {
                min-width: 100px;
                padding: 10px;
            }
            
            .format-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF转换工具</h1>
            <p>免费将PDF转换为Word或Markdown格式，简单高效，完全在浏览器中处理，保障您的文件安全</p>
        </header>
        
        <div class="card">
            <div class="card-content">
                <div class="upload-section">
                    <h2 class="section-title"><i class="fas fa-file-upload"></i> 上传PDF文件</h2>
                    
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <div class="upload-text">
                            <h3>拖放PDF文件到此处</h3>
                            <p>或点击浏览文件 (最大支持: 10MB)</p>
                        </div>
                    </div>
                    
                    <div id="fileInfo" class="file-info" style="display: none;">
                        <div class="file-icon">
                            <i class="fas fa-file-pdf"></i>
                        </div>
                        <div class="file-details">
                            <div class="file-name" id="fileName">document.pdf</div>
                            <div class="file-size" id="fileSize">2.4 MB</div>
                        </div>
                        <button class="remove-btn" id="removeFile">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="format-selection">
                        <div class="format-title">选择输出格式：</div>
                        <div class="format-options">
                            <div class="format-option" data-format="word">
                                <div class="format-icon">
                                    <i class="fas fa-file-word"></i>
                                </div>
                                <div class="format-name">Word (.docx)</div>
                            </div>
                            <div class="format-option active" data-format="markdown">
                                <div class="format-icon">
                                    <i class="fab fa-markdown"></i>
                                </div>
                                <div class="format-name">Markdown (.md)</div>
                            </div>
                        </div>
                    </div>
                    
                    <button class="convert-btn" id="convertBtn" disabled>
                        <i class="fas fa-sync-alt"></i> 开始转换
                    </button>
                </div>
                
                <div class="preview-section">
                    <h2 class="section-title"><i class="fas fa-eye"></i> 预览与下载</h2>
                    
                    <div id="previewPlaceholder" class="preview-placeholder">
                        <div class="preview-icon">
                            <i class="fas fa-file-download"></i>
                        </div>
                        <div class="preview-text">
                            <h3>转换结果将在此显示</h3>
                            <p>上传PDF文件并选择格式后，点击转换按钮查看结果</p>
                        </div>
                    </div>
                    
                    <div id="previewContent" class="preview-content" style="display: none;">
                        <!-- 预览内容将通过JavaScript动态生成 -->
                    </div>
                    
                    <div class="conversion-progress" style="display: none;" id="progressBar">
                        <div class="progress-bar" id="progressFill"></div>
                    </div>
                    
                    <div class="status-text" id="statusText" style="display: none;">
                        正在转换您的文件...
                    </div>
                    
                    <button class="download-btn" id="downloadBtn" style="display: none;">
                        <i class="fas fa-download"></i> 下载转换文件
                    </button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 DKFile - 免费HTML网页托管平台 | <a href="#">隐私政策</a> | <a href="#">使用条款</a></p>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const removeFile = document.getElementById('removeFile');
            const convertBtn = document.getElementById('convertBtn');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const previewContent = document.getElementById('previewContent');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            const downloadBtn = document.getElementById('downloadBtn');
            const formatOptions = document.querySelectorAll('.format-option');
            
            let selectedFile = null;
            let selectedFormat = 'markdown';
            
            // 文件输入事件处理
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            });
            
            // 设置拖放上传
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('highlight');
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('highlight');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('highlight');
                
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            
            // 处理选择的文件
            function handleFile(file) {
                if (file.type !== 'application/pdf') {
                    showToast('请选择PDF文件', 'error');
                    return;
                }
                
                if (file.size > 10 * 1024 * 1024) {
                    showToast('文件大小不能超过10MB', 'error');
                    return;
                }
                
                selectedFile = file;
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.style.display = 'flex';
                convertBtn.disabled = false;
                
                // 重置预览区域
                previewPlaceholder.style.display = 'flex';
                previewContent.style.display = 'none';
                downloadBtn.style.display = 'none';
            }
            
            // 删除文件
            removeFile.addEventListener('click', function() {
                selectedFile = null;
                fileInfo.style.display = 'none';
                convertBtn.disabled = true;
                fileInput.value = '';
                
                // 显示预览占位符
                previewPlaceholder.style.display = 'flex';
                previewContent.style.display = 'none';
                downloadBtn.style.display = 'none';
            });
            
            // 格式选择
            formatOptions.forEach(function(option) {
                option.addEventListener('click', function() {
                    formatOptions.forEach(function(opt) {
                        opt.classList.remove('active');
                    });
                    option.classList.add('active');
                    selectedFormat = option.dataset.format;
                });
            });
            
            // 转换按钮
            convertBtn.addEventListener('click', function() {
                if (!selectedFile) {
                    showToast('请先上传PDF文件', 'error');
                    return;
                }
                
                // 显示进度条
                progressBar.style.display = 'block';
                statusText.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                previewContent.style.display = 'none';
                downloadBtn.style.display = 'none';
                
                // 模拟转换过程
                simulateConversion();
            });
            
            // 下载按钮
            downloadBtn.addEventListener('click', function() {
                // 创建下载链接
                const blob = new Blob(['模拟文件内容 - ' + selectedFile.name.replace('.pdf', selectedFormat === 'word' ? '.docx' : '.md')], {type: 'text/plain'});
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = selectedFile.name.replace('.pdf', selectedFormat === 'word' ? '.docx' : '.md');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
            
            // 模拟转换过程
            function simulateConversion() {
                let progress = 0;
                progressFill.style.width = '0%';
                
                const interval = setInterval(function() {
                    progress += Math.floor(Math.random() * 10) + 5;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        // 转换完成
                        setTimeout(function() {
                            progressBar.style.display = 'none';
                            statusText.style.display = 'none';
                            
                            // 显示预览
                            previewContent.style.display = 'block';
                            downloadBtn.style.display = 'flex';
                            
                            // 生成预览内容
                            generatePreviewContent();
                            
                            showToast('文件转换成功！', 'success');
                        }, 300);
                    }
                    progressFill.style.width = progress + '%';
                }, 200);
            }
            
            // 生成预览内容
            function generatePreviewContent() {
                const formatName = selectedFormat === 'word' ? 'Word' : 'Markdown';
                const fileExtension = selectedFormat === 'word' ? '.docx' : '.md';
                
                previewContent.innerHTML = `
                    <h4>${selectedFile.name.replace('.pdf', fileExtension)}</h4>
                    <p>您的PDF文件已成功转换为${formatName}格式！</p>
                    
                    <h4>示例内容预览：</h4>
                    <p>这是一个从PDF文件转换而来的${formatName}文档示例。</p>
                    
                    <h4>主要特性：</h4>
                    <ul>
                        <li>保留原始文本内容和格式</li>
                        <li>支持表格、列表和图像转换</li>
                        <li>转换速度快，质量高</li>
                        <li>完全在浏览器中处理，保障隐私安全</li>
                    </ul>
                    
                    <p>点击下方下载按钮保存转换后的文件到您的设备。</p>
                `;
            }
            
            // 显示通知
            function showToast(message, type) {
                // 移除现有的通知
                const existingToast = document.querySelector('.toast');
                if (existingToast) existingToast.remove();
                
                const toast = document.createElement('div');
                toast.className = 'toast';
                
                if (type === 'error') {
                    toast.style.background = '#e74c3c';
                    toast.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
                } else {
                    toast.style.background = '#34a853';
                    toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
                }
                
                document.body.appendChild(toast);
                
                // 3秒后自动移除
                setTimeout(function() {
                    toast.style.animation = 'fadeOut 0.5s forwards';
                    setTimeout(function() {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 500);
                }, 2500);
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });
    </script>
</body>
</html>
