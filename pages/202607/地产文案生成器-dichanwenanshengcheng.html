<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地产文案生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
        }

        .output-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .copy-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            margin-top: 15px;
        }

        .copy-btn:hover {
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
        }

        .output-area {
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .footer a {
            color: #4facfe;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }

        .template-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .template-btn {
            padding: 10px;
            border: 2px solid #e1e5e9;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 14px;
        }

        .template-btn:hover {
            border-color: #4facfe;
            background: #f0f8ff;
        }

        .template-btn.active {
            border-color: #4facfe;
            background: #4facfe;
            color: white;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .randomize-options {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 地产文案生成器</h1>
            <p>专业的房地产营销文案，一键生成，轻松复制</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h3>📝 输入房产信息</h3>
                
                <div class="randomize-options">
                    <label>🎲 随机化选项</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="randomLayout" checked>
                            <label for="randomLayout">随机排版</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="randomEmoji" checked>
                            <label for="randomEmoji">随机表情</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="randomWords" checked>
                            <label for="randomWords">随机用词</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>文案类型</label>
                    <div class="template-selector">
                        <div class="template-btn active" data-template="sale">销售文案</div>
                        <div class="template-btn" data-template="rent">租赁文案</div>
                        <div class="template-btn" data-template="investment">投资文案</div>
                        <div class="template-btn" data-template="luxury">豪宅文案</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectName">项目名称</label>
                    <input type="text" id="projectName" placeholder="如：万科翡翠公园">
                </div>

                <div class="form-group">
                    <label for="location">项目位置</label>
                    <input type="text" id="location" placeholder="如：朝阳区CBD核心区域">
                </div>

                <div class="form-group">
                    <label for="houseType">户型</label>
                    <input type="text" id="houseType" placeholder="如：三室两厅两卫">
                </div>

                <div class="form-group">
                    <label for="area">面积</label>
                    <input type="text" id="area" placeholder="如：120平米">
                </div>

                <div class="form-group">
                    <label for="price">价格</label>
                    <input type="text" id="price" placeholder="如：580万 或 8000元/月">
                </div>

                <div class="form-group">
                    <label for="features">项目亮点</label>
                    <textarea id="features" placeholder="如：地铁口300米，名校学区，精装修，南北通透，采光极佳"></textarea>
                </div>

                <div class="form-group">
                    <label for="contact">联系方式</label>
                    <input type="text" id="contact" placeholder="如：张经理 138****8888">
                </div>

                <button class="btn" onclick="generateContent()">🚀 生成文案</button>
            </div>

            <div class="output-section">
                <h3>📄 生成的文案</h3>
                <div class="output-area" id="outputArea">
                    <div class="loading">请填写左侧信息，点击生成文案按钮</div>
                </div>
                <button class="btn copy-btn" onclick="copyToClipboard()">📋 复制文案</button>
                <div class="success-message" id="successMessage">文案已复制到剪贴板！</div>
            </div>
        </div>

        <div class="footer">
            <p>有任何问题联系作者微信：<strong>xd135341</strong></p>
        </div>
    </div>

    <script>
        let currentTemplate = 'sale';
        let generatedContent = '';

        // 模板选择
        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTemplate = this.dataset.template;
            });
        });

        // 随机表情库
        const emojiSets = {
            house: ['🏠', '🏡', '🏢', '🏘️', '🏰', '🏛️'],
            star: ['⭐', '🌟', '✨', '💫', '🌠'],
            location: ['📍', '🗺️', '📌', '🎯'],
            money: ['💰', '💎', '💵', '🏆', '👑'],
            fire: ['🔥', '💥', '⚡', '🚀', '💯'],
            phone: ['📞', '☎️', '📱', '📲'],
            heart: ['❤️', '💖', '💝', '💕', '🧡']
        };

        // 随机用词库
        const wordVariations = {
            excellent: ['优质', '精品', '高端', '品质', '臻品', '匠心'],
            location: ['黄金地段', '核心位置', '优越地段', '繁华地带', 'CBD核心', '城市中心'],
            opportunity: ['机不可失', '限时优惠', '抢购中', '火热销售', '稀缺房源', '珍贵机会'],
            contact: ['咨询热线', '专线电话', '贵宾热线', '服务专线', '预约热线'],
            investment: ['投资首选', '财富增值', '稳健投资', '资产配置', '价值投资'],
            luxury: ['奢华体验', '尊贵享受', '品质生活', '精致生活', '高端生活']
        };

        // 多种排版格式
        const layoutFormats = {
            format1: {
                separator: '\n',
                sectionSeparator: '\n\n',
                bulletPoint: '• ',
                emphasis: '【】'
            },
            format2: {
                separator: ' | ',
                sectionSeparator: '\n\n━━━━━━━━━━━━━━━━━━━━\n\n',
                bulletPoint: '▶ ',
                emphasis: '★★'
            },
            format3: {
                separator: '\n',
                sectionSeparator: '\n\n═══════════════════\n\n',
                bulletPoint: '◆ ',
                emphasis: '✦✦'
            },
            format4: {
                separator: '\n',
                sectionSeparator: '\n\n▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n\n',
                bulletPoint: '➤ ',
                emphasis: '◈◈'
            }
        };

        // 获取随机元素
        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // 获取随机表情
        function getRandomEmoji(type) {
            if (!document.getElementById('randomEmoji').checked) {
                // 返回默认表情
                const defaults = {
                    house: '🏠',
                    star: '🌟',
                    location: '📍',
                    money: '💰',
                    fire: '🔥',
                    phone: '📞',
                    heart: '❤️'
                };
                return defaults[type] || '✨';
            }
            return getRandomElement(emojiSets[type] || emojiSets.star);
        }

        // 获取随机用词
        function getRandomWord(type) {
            if (!document.getElementById('randomWords').checked) {
                // 返回默认用词
                const defaults = {
                    excellent: '优质',
                    location: '黄金地段',
                    opportunity: '机不可失',
                    contact: '咨询热线',
                    investment: '投资首选',
                    luxury: '奢华体验'
                };
                return defaults[type] || type;
            }
            return getRandomElement(wordVariations[type] || [type]);
        }

        // 获取随机排版格式
        function getRandomLayout() {
            if (!document.getElementById('randomLayout').checked) {
                return layoutFormats.format1;
            }
            const formats = Object.values(layoutFormats);
            return getRandomElement(formats);
        }

        // 文案模板（支持随机化）
        const templates = {
            sale: {
                title: "{houseEmoji} {emphasis}{projectName}{emphasis}火热销售中！",
                sections: [
                    "{starEmoji} 项目亮点：",
                    "{locationEmoji} {locationWord}：{location}",
                    "{houseEmoji} 户型配置：{houseType}",
                    "📐 建筑面积：{area}",
                    "{moneyEmoji} 售价：{price}",
                    "",
                    "✨ 项目特色：",
                    "{features}",
                    "",
                    "{fireEmoji} {opportunityWord}！",
                    "{phoneEmoji} {contactWord}：{contact}",
                    "",
                    "#品质生活 #{investmentWord} #现房销售"
                ]
            },
            rent: {
                title: "{houseEmoji} {emphasis}{projectName}{emphasis}精品房源出租",
                sections: [
                    "{starEmoji} 房源信息：",
                    "{locationEmoji} 地理位置：{location}",
                    "{houseEmoji} 房型布局：{houseType}",
                    "📐 使用面积：{area}",
                    "{moneyEmoji} 租金：{price}",
                    "",
                    "✨ 房源优势：",
                    "{features}",
                    "",
                    "🎯 适合人群：白领、家庭、学生",
                    "{phoneEmoji} 看房预约：{contact}",
                    "",
                    "#精装修 #拎包入住 #交通便利"
                ]
            },
            investment: {
                title: "{moneyEmoji} {emphasis}{projectName}{emphasis}投资价值分析",
                sections: [
                    "📈 投资亮点：",
                    "{locationEmoji} 核心地段：{location}",
                    "{houseEmoji} 产品类型：{houseType}",
                    "📐 投资面积：{area}",
                    "{moneyEmoji} 投资门槛：{price}",
                    "",
                    "🎯 投资优势：",
                    "{features}",
                    "",
                    "📊 预期收益：稳定增值，租金回报丰厚",
                    "{phoneEmoji} 投资咨询：{contact}",
                    "",
                    "#{investmentWord} #资产配置 #财富增值"
                ]
            },
            luxury: {
                title: "👑 {emphasis}{projectName}{emphasis}奢华生活典范",
                sections: [
                    "{starEmoji} 奢华配置：",
                    "{locationEmoji} 尊贵地址：{location}",
                    "{houseEmoji} 空间布局：{houseType}",
                    "📐 奢享面积：{area}",
                    "{moneyEmoji} 尊享价格：{price}",
                    "",
                    "✨ {luxuryWord}：",
                    "{features}",
                    "",
                    "🎭 专属服务：私人管家，24小时礼宾",
                    "{phoneEmoji} 私享热线：{contact}",
                    "",
                    "#奢华生活 #身份象征 #品质之选"
                ]
            }
        };

        function generateContent() {
            // 获取输入值
            const projectName = document.getElementById('projectName').value || '优质项目';
            const location = document.getElementById('location').value || '优越地段';
            const houseType = document.getElementById('houseType').value || '精品户型';
            const area = document.getElementById('area').value || '舒适面积';
            const price = document.getElementById('price').value || '合理价格';
            const features = document.getElementById('features').value || '品质保证，值得信赖';
            const contact = document.getElementById('contact').value || '专业顾问为您服务';

            // 获取随机化元素
            const layout = getRandomLayout();
            const randomVars = {
                houseEmoji: getRandomEmoji('house'),
                starEmoji: getRandomEmoji('star'),
                locationEmoji: getRandomEmoji('location'),
                moneyEmoji: getRandomEmoji('money'),
                fireEmoji: getRandomEmoji('fire'),
                phoneEmoji: getRandomEmoji('phone'),
                heartEmoji: getRandomEmoji('heart'),
                locationWord: getRandomWord('location'),
                opportunityWord: getRandomWord('opportunity'),
                contactWord: getRandomWord('contact'),
                investmentWord: getRandomWord('investment'),
                luxuryWord: getRandomWord('luxury'),
                emphasis: layout.emphasis
            };

            // 获取当前模板
            const template = templates[currentTemplate];
            
            // 替换标题变量
            let title = template.title;
            Object.keys(randomVars).forEach(key => {
                title = title.replace(new RegExp(`{${key}}`, 'g'), randomVars[key]);
            });
            title = title
                .replace(/{projectName}/g, projectName);

            // 替换内容变量
            let sections = template.sections.map(section => {
                let processedSection = section;
                Object.keys(randomVars).forEach(key => {
                    processedSection = processedSection.replace(new RegExp(`{${key}}`, 'g'), randomVars[key]);
                });
                return processedSection
                    .replace(/{projectName}/g, projectName)
                    .replace(/{location}/g, location)
                    .replace(/{houseType}/g, houseType)
                    .replace(/{area}/g, area)
                    .replace(/{price}/g, price)
                    .replace(/{features}/g, features)
                    .replace(/{contact}/g, contact);
            });

            // 应用随机排版格式
            generatedContent = title + layout.sectionSeparator + sections.join(layout.separator);

            // 显示生成的内容
            document.getElementById('outputArea').textContent = generatedContent;
        }

        function copyToClipboard() {
            if (!generatedContent) {
                alert('请先生成文案！');
                return;
            }

            navigator.clipboard.writeText(generatedContent).then(function() {
                const successMsg = document.getElementById('successMessage');
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            }).catch(function(err) {
                // 备用复制方法
                const textArea = document.createElement('textarea');
                textArea.value = generatedContent;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const successMsg = document.getElementById('successMessage');
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            });
        }

        // 回车键快速生成
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateContent();
            }
        });
    </script>
</body>
</html>
