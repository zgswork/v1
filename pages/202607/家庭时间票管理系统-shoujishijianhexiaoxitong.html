<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭时间票管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin: 20px 0;
        }
        
        header {
            background: #4e73df;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .balance-container {
            background: #f8f9fc;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e3e6f0;
        }
        
        .balance {
            font-size: 42px;
            font-weight: bold;
            color: #4e73df;
            margin: 10px 0;
        }
        
        .panels {
            display: flex;
            flex-wrap: wrap;
        }
        
        .panel {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .panel-left {
            border-right: 1px solid #e3e6f0;
        }
        
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4e73df;
            padding-bottom: 10px;
            border-bottom: 2px solid #4e73df;
        }
        
        .task-list {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #e3e6f0;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .task:hover {
            background: #f8f9fc;
        }
        
        .task-name {
            font-weight: 500;
            flex: 2;
        }
        
        .task-time {
            color: #4e73df;
            font-weight: bold;
            flex: 1;
            text-align: right;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 12px 10px;
            border-bottom: 1px solid #e3e6f0;
            display: flex;
            justify-content: space-between;
        }
        
        .history-desc {
            flex: 2;
        }
        
        .history-time {
            flex: 1;
            text-align: right;
            font-weight: bold;
        }
        
        .earned {
            color: #1cc88a;
        }
        
        .spent {
            color: #e74a3b;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-earn {
            background: #4e73df;
            color: white;
            flex: 2;
        }
        
        .btn-earn:hover {
            background: #2e59d9;
        }
        
        .btn-spend {
            background: #36b9cc;
            color: white;
            flex: 1;
        }
        
        .btn-spend:hover {
            background: #2c9faf;
        }
        
        .btn-reset {
            background: #e74a3b;
            color: white;
        }
        
        .btn-reset:hover {
            background: #e02d1b;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .modal h3 {
            margin-bottom: 20px;
            color: #4e73df;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d3e2;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-cancel {
            background: #858796;
            color: white;
        }
        
        .btn-cancel:hover {
            background: #6c6e7e;
        }
        
        .btn-confirm {
            background: #4e73df;
            color: white;
        }
        
        .btn-confirm:hover {
            background: #2e59d9;
        }
        
        @media (max-width: 768px) {
            .panels {
                flex-direction: column;
            }
            
            .panel-left {
                border-right: none;
                border-bottom: 1px solid #e3e6f0;
            }
        }
        
        .category {
            margin-top: 20px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #eaecf4;
            border-radius: 5px;
            font-weight: bold;
            color: #4e73df;
        }
        
        .task-icon {
            margin-right: 10px;
            width: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>家庭时间票管理系统</h1>
            <p>通过家务和学习赚取手机使用时间</p>
        </header>
        
        <div class="balance-container">
            <p>可用手机时间</p>
            <div class="balance" id="balance">0 分钟</div>
        </div>
        
        <div class="panels">
            <div class="panel panel-left">
                <h2>任务列表</h2>
                <div class="task-list" id="taskList">
                    <div class="category">日常家务</div>
                    <div class="task" data-name="洗碗一次" data-minutes="5">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-utensils"></i></span>洗碗一次</span>
                        <span class="task-time">+5分钟</span>
                    </div>
                    <div class="task" data-name="扫地一次" data-minutes="5">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-broom"></i></span>扫地一次</span>
                        <span class="task-time">+5分钟</span>
                    </div>
                    <div class="task" data-name="丢垃圾一次" data-minutes="5">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-trash"></i></span>丢垃圾一次</span>
                        <span class="task-time">+5分钟</span>
                    </div>
                    <div class="task" data-name="及时洗内衣一次" data-minutes="3">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-tshirt"></i></span>及时洗内衣一次</span>
                        <span class="task-time">+3分钟</span>
                    </div>
                    <div class="task" data-name="及时洗袜子一次" data-minutes="3">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-socks"></i></span>及时洗袜子一次</span>
                        <span class="task-time">+3分钟</span>
                    </div>
                    
                    <div class="category">学习任务</div>
                    <div class="task" data-name="整理错题本并讲解清晰" data-minutes="60">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-book"></i></span>按周整理错题本并讲解清晰</span>
                        <span class="task-time">+60分钟</span>
                    </div>
                    <div class="task" data-name="单科周考达到A+线" data-minutes="60">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-graduation-cap"></i></span>单科周考达到A+线</span>
                        <span class="task-time">+60分钟</span>
                    </div>
                    <div class="task" data-name="单科月考达到A+线" data-minutes="60">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-graduation-cap"></i></span>单科月考达到A+线</span>
                        <span class="task-time">+60分钟</span>
                    </div>
                    <div class="task" data-name="月考总分年级排名前50" data-minutes="120">
                        <span class="task-name"><span class="task-icon"><i class="fas fa-trophy"></i></span>月考总分年级排名前50</span>
                        <span class="task-time">+120分钟</span>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-earn" onclick="showCustomEarnModal()">自定义任务</button>
                    <button class="btn-spend" onclick="showSpendModal()">使用时间</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>历史记录</h2>
                <div class="history-list" id="historyList">
                    <div class="history-item">
                        <div class="history-desc">暂无记录</div>
                        <div class="history-time">0分钟</div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-reset" onclick="resetData()">重置数据</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 自定义任务模态框 -->
    <div class="modal" id="customEarnModal">
        <div class="modal-content">
            <h3>添加自定义任务</h3>
            <div class="form-group">
                <label for="customTask">任务描述</label>
                <input type="text" id="customTask" placeholder="输入任务描述">
            </div>
            <div class="form-group">
                <label for="customMinutes">奖励分钟数</label>
                <input type="number" id="customMinutes" placeholder="输入分钟数" min="1">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('customEarnModal')">取消</button>
                <button class="btn-confirm" onclick="addCustomEarnedTime()">确认</button>
            </div>
        </div>
    </div>
    
    <!-- 使用时间模态框 -->
    <div class="modal" id="spendModal">
        <div class="modal-content">
            <h3>使用手机时间</h3>
            <div class="form-group">
                <label for="spendMinutes">使用分钟数</label>
                <input type="number" id="spendMinutes" placeholder="输入要使用的分钟数" min="1">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('spendModal')">取消</button>
                <button class="btn-confirm" onclick="spendTime()">确认</button>
            </div>
        </div>
    </div>

    <script>
        // 初始数据
        let balance = 0;
        let history = [];
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupTaskClickHandlers();
            renderHistory();
            updateBalance();
        });
        
        // 从本地存储加载数据
        function loadData() {
            const savedBalance = localStorage.getItem('timeBalance');
            const savedHistory = localStorage.getItem('timeHistory');
            
            if (savedBalance) {
                balance = parseInt(savedBalance);
            }
            
            if (savedHistory) {
                history = JSON.parse(savedHistory);
            }
        }
        
        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem('timeBalance', balance);
            localStorage.setItem('timeHistory', JSON.stringify(history));
        }
        
        // 设置任务点击处理
        function setupTaskClickHandlers() {
            const tasks = document.querySelectorAll('.task');
            tasks.forEach(task => {
                task.addEventListener('click', function() {
                    const taskName = this.getAttribute('data-name');
                    const minutes = parseInt(this.getAttribute('data-minutes'));
                    addEarnedTime(taskName, minutes);
                });
            });
        }
        
        // 渲染历史记录
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item"><div class="history-desc">暂无记录</div><div class="history-time">0分钟</div></div>';
                return;
            }
            
            // 按时间倒序显示
            const sortedHistory = [...history].reverse();
            
            sortedHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                const timeClass = item.type === 'earned' ? 'earned' : 'spent';
                const sign = item.type === 'earned' ? '+' : '-';
                
                historyItem.innerHTML = `
                    <div class="history-desc">${item.description}</div>
                    <div class="history-time ${timeClass}">${sign}${item.minutes}分钟</div>
                `;
                
                historyList.appendChild(historyItem);
            });
        }
        
        // 更新余额显示
        function updateBalance() {
            document.getElementById('balance').textContent = `${balance} 分钟`;
        }
        
        // 显示自定义任务模态框
        function showCustomEarnModal() {
            document.getElementById('customEarnModal').style.display = 'flex';
        }
        
        // 显示使用时间模态框
        function showSpendModal() {
            document.getElementById('spendModal').style.display = 'flex';
        }
        
        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 添加赚取的时间
        function addEarnedTime(taskName, minutes) {
            // 更新余额
            balance += minutes;
            
            // 添加到历史记录
            history.push({
                type: 'earned',
                description: `完成任务: ${taskName}`,
                minutes: minutes,
                date: new Date().toLocaleString()
            });
            
            // 更新UI和数据
            updateBalance();
            renderHistory();
            saveData();
            
            alert(`成功完成 "${taskName}"，赚取 ${minutes} 分钟手机使用时间！`);
        }
        
        // 添加自定义任务赚取的时间
        function addCustomEarnedTime() {
            const customTask = document.getElementById('customTask');
            const customMinutes = document.getElementById('customMinutes');
            
            let taskName = customTask.value.trim();
            let minutes = parseInt(customMinutes.value);
            
            if (!taskName) {
                alert('请输入任务描述');
                return;
            }
            
            if (!minutes || minutes <= 0) {
                alert('请输入有效的分钟数');
                return;
            }
            
            // 更新余额
            balance += minutes;
            
            // 添加到历史记录
            history.push({
                type: 'earned',
                description: `完成任务: ${taskName}`,
                minutes: minutes,
                date: new Date().toLocaleString()
            });
            
            // 更新UI和数据
            updateBalance();
            renderHistory();
            saveData();
            
            // 关闭模态框并重置表单
            closeModal('customEarnModal');
            customTask.value = '';
            customMinutes.value = '';
            
            alert(`成功完成 "${taskName}"，赚取 ${minutes} 分钟手机使用时间！`);
        }
        
        // 使用时间
        function spendTime() {
            const spendMinutes = document.getElementById('spendMinutes');
            const minutes = parseInt(spendMinutes.value);
            
            if (!minutes || minutes <= 0) {
                alert('请输入有效的分钟数');
                return;
            }
            
            if (minutes > balance) {
                alert('可用时间不足');
                return;
            }
            
            // 更新余额
            balance -= minutes;
            
            // 添加到历史记录
            history.push({
                type: 'spent',
                description: '使用手机时间',
                minutes: minutes,
                date: new Date().toLocaleString()
            });
            
            // 更新UI和数据
            updateBalance();
            renderHistory();
            saveData();
            
            // 关闭模态框并重置表单
            closeModal('spendModal');
            spendMinutes.value = '';
            
            alert(`已使用 ${minutes} 分钟手机时间！`);
        }
        
        // 重置数据
        function resetData() {
            if (confirm('确定要重置所有数据吗？这将清空所有记录和余额！')) {
                balance = 0;
                history = [];
                
                updateBalance();
                renderHistory();
                saveData();
                
                alert('数据已重置！');
            }
        }
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modals = document.getElementsByClassName('modal');
            for (let i = 0; i < modals.length; i++) {
                if (event.target == modals[i]) {
                    modals[i].style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
