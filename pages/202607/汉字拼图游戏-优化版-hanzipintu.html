<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字拼图游戏 - 优化版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ffe066;
        }
        
        .instructions {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .character-display {
            background: linear-gradient(to bottom, #ffe066, #ffcc00);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 4rem;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
            border: 3px dashed #ff9900;
        }
        
        .puzzle-pieces {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .puzzle-piece {
            width: 65px;
            height: 65px;
            background: linear-gradient(to bottom, #bbdefb, #90caf9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid #64b5f6;
        }
        
        .puzzle-piece:hover {
            transform: scale(1.08);
            background: linear-gradient(to bottom, #90caf9, #64b5f6);
        }
        
        .puzzle-piece.selected {
            background: linear-gradient(to bottom, #a5d6a7, #4caf50);
            transform: scale(1.12);
            border-color: #4caf50;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            min-width: 120px;
        }
        
        #check-btn {
            background: linear-gradient(to bottom, #4caf50, #388e3c);
            color: white;
            box-shadow: 0 4px 0 #2e7d32;
        }
        
        #hint-btn {
            background: linear-gradient(to bottom, #ff9800, #f57c00);
            color: white;
            box-shadow: 0 4px 0 #e65100;
        }
        
        #next-btn {
            background: linear-gradient(to bottom, #2196f3, #1976d2);
            color: white;
            box-shadow: 0 4px 0 #0d47a1;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        
        .feedback {
            text-align: center;
            font-size: 1.4rem;
            min-height: 50px;
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
        }
        
        .correct {
            color: #4caf50;
            background-color: #e8f5e9;
        }
        
        .incorrect {
            color: #f44336;
            background-color: #ffebee;
        }
        
        .score {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 15px;
            font-weight: bold;
            color: #673ab7;
            padding: 8px;
            background-color: #ede7f6;
            border-radius: 10px;
        }
        
        .hint-message {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 10px;
            color: #ff9800;
            font-weight: bold;
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .character-display {
                font-size: 3.2rem;
                min-height: 110px;
                padding: 20px;
            }
            
            .puzzle-piece {
                width: 55px;
                height: 55px;
                font-size: 1.7rem;
            }
            
            button {
                padding: 12px 20px;
                font-size: 1rem;
                min-width: 100px;
            }
            
            .feedback {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

            <div class="feedback" id="feedback"></div>

            <div class="score" id="score">得分: 0</div>

        let currentCharacter = null;

        // 初始化游戏
        function initGame() {

            const randomIndex = Math.floor(Math.random() * characters.length);
            currentCharacter = characters[randomIndex];
            
            // 显示目标汉字
            targetCharacterEl.textContent = currentCharacter.character;
            
            // 生成拼图块
            generatePuzzlePieces();
            
            // 清空反馈
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            hintMessageEl.textContent = '';
            
            // 清空已选块
            selectedPieces = [];
            
            // 重置答题状态
            isAnswered = false;
            
            // 启用所有拼图块
            const allPieces = document.querySelectorAll('.puzzle-piece');
            allPieces.forEach(piece => {
                piece.style.pointerEvents = 'auto';
            });
        }

        // 生成拼图块
        function generatePuzzlePieces() {
            // 清空容器
            puzzleContainerEl.innerHTML = '';
            
            // 获取正确部件
            const correctParts = [...currentCharacter.parts];
            const allParts = [];
            
            // 如果是独体字，不在答题区域显示相同字符
            if (currentCharacter.single) {
                // 只添加干扰部件
                const distractors = ['亻', '口', '木', '氵', '艹', '日', '月', '火', '土', '扌', '讠', '纟', '王', '女', '子', '又', '心', '⻊', '门', '宀'];
                
                // 确保不添加与目标汉字相同的部件
                const filteredDistractors = distractors.filter(d => d !== currentCharacter.character);
                
                // 添加8个干扰部件
                while (allParts.length < 8) {
                    const randomDistractor = filteredDistractors[Math.floor(Math.random() * filteredDistractors.length)];
                    if (!allParts.includes(randomDistractor)) {
                        allParts.push(randomDistractor);
                    }
                }
            } else {
                // 非独体字：添加正确部件和干扰部件
                const distractors = ['亻', '口', '木', '氵', '艹', '日', '月', '火', '土', '扌', '讠', '纟', '王', '女', '子', '又', '心', '⻊', '门', '宀'];
                
                // 添加正确部件
                correctParts.forEach(part => {
                    allParts.push(part);
                });
                
                // 添加干扰部件直到达到10个
                while (allParts.length < 10) {
                    const randomDistractor = distractors[Math.floor(Math.random() * distractors.length)];
                    if (!allParts.includes(randomDistractor)) {
                        allParts.push(randomDistractor);
                    }
                }
            }
            
            // 打乱顺序
            shuffleArray(allParts);
            
            // 创建拼图块
            allParts.forEach(part => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.textContent = part;
                piece.addEventListener('click', () => selectPiece(piece, part));
                puzzleContainerEl.appendChild(piece);
            });
        }

        // 选择拼图块
        function selectPiece(piece, part) {
            // 如果已经回答正确，不允许再选择
            if (isAnswered) return;
            
            if (selectedPieces.includes(piece)) {
                // 如果已经选中，则取消选择
                piece.classList.remove('selected');
                selectedPieces = selectedPieces.filter(p => p !== piece);
            } else {
                // 选中拼图块
                piece.classList.add('selected');
                selectedPieces.push(piece);
            }
        }

        // 检查答案
        function checkAnswer() {
            // 如果已经回答正确，不再处理
            if (isAnswered) return;
            
            const selectedParts = selectedPieces.map(piece => piece.textContent);
            const correctParts = [...currentCharacter.parts];
            
            // 简单检查：是否选择了正确数量的部件
            if (selectedParts.length !== correctParts.length) {
                feedbackEl.textContent = '部件数量不对，再试试看！';
                feedbackEl.className = 'feedback incorrect';
                return;
            }
            
            // 检查每个部件是否正确
            for (let part of correctParts) {
                if (!selectedParts.includes(part)) {
                    feedbackEl.textContent = '不完全正确，再试试看！';
                    feedbackEl.className = 'feedback incorrect';
                    return;
                }
            }
            
            // 答案正确
            feedbackEl.textContent = '太棒了！答对了！';
            feedbackEl.className = 'feedback correct';
            
            // 只有在第一次答对时才加分
            if (!isAnswered) {
                score += 10;
                scoreEl.textContent = `得分: ${score}`;
                isAnswered = true;
            }
            
            // 禁用所有拼图块
            const allPieces = document.querySelectorAll('.puzzle-piece');
            allPieces.forEach(piece => {
                piece.style.pointerEvents = 'none';
            });
        }

        // 提供提示
        function giveHint() {
            hintMessageEl.textContent = `提示: ${currentCharacter.character} = ${currentCharacter.parts.join(' + ')}`;
            
            // 5秒后清除提示
            setTimeout(() => {
                hintMessageEl.textContent = '';
            }, 5000);
        }

        // 工具函数：打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 事件监听
        checkBtn.addEventListener('click', checkAnswer);
        hintBtn.addEventListener('click', giveHint);
        nextBtn.addEventListener('click', initGame);

        // 开始游戏
        initGame();
    </script>
</body>
</html>
