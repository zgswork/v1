<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快餐健康指数评分器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .food-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .food-input:focus {
            outline: none;
            border-color: #4CAF50;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .food-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .food-select:focus {
            outline: none;
            border-color: #4CAF50;
            background: #fff;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e9e9e9;
            border-color: #ccc;
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border-left: 5px solid #4CAF50;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-number {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .score-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .health-advice {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #4CAF50;
        }

        .health-advice h3 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .health-advice p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #999;
            font-size: 12px;
        }

        .input-mode-toggle {
            display: flex;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #4CAF50;
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .content {
                padding: 20px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .score-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥗 快餐健康指数评分器</h1>
            <p>科学评估您的快餐选择，助力健康生活</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="foodInput">选择或输入快餐名称：</label>
                
                <div class="input-mode-toggle">
                    <button class="toggle-btn active" onclick="switchInputMode('select')">选择模式</button>
                    <button class="toggle-btn" onclick="switchInputMode('input')">输入模式</button>
                </div>
                
                <select id="foodSelect" class="food-select">
                    <option value="">请选择快餐类型...</option>
                    <option value="炸鸡">炸鸡</option>
                    <option value="汉堡">汉堡</option>
                    <option value="薯条">薯条</option>
                    <option value="披萨">披萨</option>
                    <option value="可乐">可乐</option>
                    <option value="沙拉">沙拉</option>
                    <option value="烤鸡腿">烤鸡腿</option>
                    <option value="牛肉卷">牛肉卷</option>
                    <option value="鸡肉卷">鸡肉卷</option>
                    <option value="三明治">三明治</option>
                    <option value="全麦三明治">全麦三明治</option>
                    <option value="水果杯">水果杯</option>
                    <option value="鸡胸肉沙拉">鸡胸肉沙拉</option>
                    <option value="蔬菜汉堡">蔬菜汉堡</option>
                    <option value="无糖可乐">无糖可乐</option>
                    <option value="低脂酸奶">低脂酸奶</option>
                </select>
                
                <input type="text" id="foodInput" class="food-input" placeholder="请输入快餐名称..." style="display: none;">
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="calculateScore()">🔍 开始评分</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清除</button>
            </div>
            
            <div id="resultCard" class="result-card">
                <div class="score-display">
                    <div id="scoreNumber" class="score-number">0</div>
                    <div class="score-label">健康指数</div>
                </div>
                
                <div class="health-advice">
                    <h3>🏥 健康建议</h3>
                    <p id="healthAdvice">请先选择或输入快餐名称进行评分</p>
                </div>
            </div>
        </div>
        
        <div class="footer">
            有任何问题请联系作者微信：xd135341
        </div>
    </div>

    <script>
        // 快餐健康评分数据库
        const foodDatabase = {
            // 高油高糖高盐类 (30-50分)
            '炸鸡': { base: 35, category: 'unhealthy' },
            '薯条': { base: 30, category: 'unhealthy' },
            '披萨': { base: 45, category: 'unhealthy' },
            '可乐': { base: 25, category: 'unhealthy' },
            '汉堡': { base: 40, category: 'unhealthy' },
            '炸薯条': { base: 30, category: 'unhealthy' },
            '甜甜圈': { base: 25, category: 'unhealthy' },
            '奶昔': { base: 35, category: 'unhealthy' },
            
            // 含蔬菜蛋白质适中类 (60-75分)
            '烤鸡腿': { base: 65, category: 'moderate' },
            '牛肉卷': { base: 70, category: 'moderate' },
            '鸡肉卷': { base: 68, category: 'moderate' },
            '三明治': { base: 60, category: 'moderate' },
            '鸡肉汉堡': { base: 62, category: 'moderate' },
            '牛肉汉堡': { base: 58, category: 'moderate' },
            '烤鸡翅': { base: 60, category: 'moderate' },
            
            // 健康类 (80-95分)
            '沙拉': { base: 85, category: 'healthy' },
            '水果杯': { base: 90, category: 'healthy' },
            '全麦三明治': { base: 80, category: 'healthy' },
            '鸡胸肉沙拉': { base: 88, category: 'healthy' },
            '蔬菜汉堡': { base: 82, category: 'healthy' },
            '低脂酸奶': { base: 85, category: 'healthy' },
            '无糖可乐': { base: 75, category: 'healthy' },
            '蔬菜卷': { base: 83, category: 'healthy' }
        };

        // 健康关键词加分
        const healthyKeywords = [
            '蔬菜', '全麦', '低脂', '鸡胸肉', '无糖', 
            '烤', '蒸', '煮', '新鲜', '有机', 
            '少油', '少盐', '少糖', '纤维', '维生素'
        ];

        let currentInputMode = 'select';

        function switchInputMode(mode) {
            const selectElement = document.getElementById('foodSelect');
            const inputElement = document.getElementById('foodInput');
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            
            currentInputMode = mode;
            
            // 更新按钮状态
            toggleBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'select') {
                selectElement.style.display = 'block';
                inputElement.style.display = 'none';
                inputElement.value = '';
            } else {
                selectElement.style.display = 'none';
                inputElement.style.display = 'block';
                selectElement.value = '';
            }
            
            // 清除结果
            hideResult();
        }

        function getCurrentFoodName() {
            if (currentInputMode === 'select') {
                return document.getElementById('foodSelect').value.trim();
            } else {
                return document.getElementById('foodInput').value.trim();
            }
        }

        function calculateScore() {
            const foodName = getCurrentFoodName();
            
            if (!foodName) {
                alert('请先选择或输入快餐名称！');
                return;
            }

            let score = 0;
            let category = 'unknown';
            
            // 检查数据库中是否有完全匹配
            if (foodDatabase[foodName]) {
                score = foodDatabase[foodName].base;
                category = foodDatabase[foodName].category;
            } else {
                // 模糊匹配和关键词分析
                score = analyzeFood(foodName);
                category = getCategory(score);
            }
            
            // 检查健康关键词加分
            const bonusScore = calculateBonusScore(foodName);
            score += bonusScore;
            
            // 限制最高分为100
            score = Math.min(score, 100);
            
            // 显示结果
            displayResult(score, foodName, bonusScore);
        }

        function analyzeFood(foodName) {
            const name = foodName.toLowerCase();
            
            // 不健康关键词
            const unhealthyKeywords = ['炸', '油炸', '糖', '甜', '奶油', '芝士', '培根', '香肠', '可乐', '汽水'];
            // 适中关键词  
            const moderateKeywords = ['烤', '煎', '肉', '鸡', '牛', '猪', '卷', '包'];
            // 健康关键词
            const healthyKeywords = ['沙拉', '蔬菜', '水果', '全麦', '低脂', '无糖', '鸡胸'];
            
            let unhealthyCount = 0;
            let moderateCount = 0;
            let healthyCount = 0;
            
            unhealthyKeywords.forEach(keyword => {
                if (name.includes(keyword)) unhealthyCount++;
            });
            
            moderateKeywords.forEach(keyword => {
                if (name.includes(keyword)) moderateCount++;
            });
            
            healthyKeywords.forEach(keyword => {
                if (name.includes(keyword)) healthyCount++;
            });
            
            // 根据关键词数量决定基础分数
            if (healthyCount > 0) {
                return 80 + Math.random() * 15; // 80-95
            } else if (moderateCount > 0 && unhealthyCount === 0) {
                return 60 + Math.random() * 15; // 60-75
            } else if (unhealthyCount > 0) {
                return 30 + Math.random() * 20; // 30-50
            } else {
                return 50 + Math.random() * 20; // 默认 50-70
            }
        }

        function getCategory(score) {
            if (score >= 80) return 'healthy';
            if (score >= 60) return 'moderate';
            return 'unhealthy';
        }

        function calculateBonusScore(foodName) {
            let bonus = 0;
            const name = foodName.toLowerCase();
            
            healthyKeywords.forEach(keyword => {
                if (name.includes(keyword)) {
                    bonus += 5;
                }
            });
            
            return Math.min(bonus, 15); // 最多加15分
        }

        function displayResult(score, foodName, bonusScore) {
            const scoreElement = document.getElementById('scoreNumber');
            const adviceElement = document.getElementById('healthAdvice');
            const resultCard = document.getElementById('resultCard');
            
            // 动画显示分数
            animateScore(scoreElement, score);
            
            // 根据分数生成建议
            const advice = generateAdvice(score, foodName, bonusScore);
            adviceElement.innerHTML = advice;
            
            // 显示结果卡片
            resultCard.classList.add('show');
            
            // 滚动到结果区域
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function animateScore(element, targetScore) {
            let currentScore = 0;
            const increment = targetScore / 30;
            const timer = setInterval(() => {
                currentScore += increment;
                if (currentScore >= targetScore) {
                    currentScore = targetScore;
                    clearInterval(timer);
                }
                element.textContent = Math.round(currentScore);
                
                // 根据分数改变颜色
                if (currentScore >= 80) {
                    element.style.color = '#4CAF50';
                } else if (currentScore >= 60) {
                    element.style.color = '#FF9800';
                } else {
                    element.style.color = '#F44336';
                }
            }, 50);
        }

        function generateAdvice(score, foodName, bonusScore) {
            let advice = '';
            let emoji = '';
            
            if (score >= 90) {
                emoji = '🌟';
                advice = `<strong>优秀选择！</strong><br>「${foodName}」是非常健康的快餐选择，富含营养且热量适中。建议作为日常饮食的一部分，搭配适量运动效果更佳。`;
            } else if (score >= 80) {
                emoji = '✅';
                advice = `<strong>健康选择！</strong><br>「${foodName}」营养价值较高，是不错的快餐选择。建议适量食用，注意搭配其他营养食物。`;
            } else if (score >= 70) {
                emoji = '⚖️';
                advice = `<strong>还算均衡</strong><br>「${foodName}」营养相对均衡，偶尔食用问题不大。建议搭配蔬菜或水果，增加膳食纤维摄入。`;
            } else if (score >= 60) {
                emoji = '⚠️';
                advice = `<strong>适量食用</strong><br>「${foodName}」含有一定营养，但可能油脂或钠含量偏高。建议控制食用频率，搭配清淡食物。`;
            } else if (score >= 40) {
                emoji = '🚨';
                advice = `<strong>谨慎选择</strong><br>「${foodName}」可能含有较多油脂、糖分或添加剂。建议偶尔食用，并注意控制分量，多喝水促进代谢。`;
            } else {
                emoji = '❌';
                advice = `<strong>不建议经常食用</strong><br>「${foodName}」营养价值较低，可能含有过多不健康成分。建议选择更健康的替代品，如沙拉、水果或全麦食品。`;
            }
            
            if (bonusScore > 0) {
                advice += `<br><br>💡 <em>检测到健康关键词，额外加分 ${bonusScore} 分！</em>`;
            }
            
            return `${emoji} ${advice}`;
        }

        function clearAll() {
            // 清除输入
            document.getElementById('foodSelect').value = '';
            document.getElementById('foodInput').value = '';
            
            // 隐藏结果
            hideResult();
            
            // 重置为选择模式
            if (currentInputMode !== 'select') {
                switchInputMode('select');
                document.querySelector('.toggle-btn').click();
            }
        }

        function hideResult() {
            const resultCard = document.getElementById('resultCard');
            resultCard.classList.remove('show');
        }

        // 回车键触发评分
        document.getElementById('foodInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateScore();
            }
        });

        // 选择框变化时隐藏之前的结果
        document.getElementById('foodSelect').addEventListener('change', hideResult);
        document.getElementById('foodInput').addEventListener('input', hideResult);
    </script>
</body>
</html>
