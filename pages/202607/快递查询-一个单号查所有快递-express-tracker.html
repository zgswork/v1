<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快递查询 - 一个单号查所有快递</title>
    <meta name="description" content="免费快递查询工具，支持一个单号查询所有快递公司，包括顺丰、圆通、申通、中通、韵达等主流快递">
    <meta name="keywords" content="快递查询,物流查询,快递单号查询,顺丰查询,圆通查询,申通查询">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23dots)"/></svg>');
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-content {
            padding: 40px;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-section h2::before {
            content: '🔍';
            font-size: 1.2em;
        }

        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-end;
            min-width: 120px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .tips {
            background: #f8f9ff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .tips h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .tips ul {
            list-style: none;
            font-size: 13px;
            color: #666;
        }

        .tips li {
            margin-bottom: 5px;
            padding-left: 15px;
            position: relative;
        }

        .tips li::before {
            content: '•';
            color: #667eea;
            position: absolute;
            left: 0;
        }

        .results-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none;
        }

        .results-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
        }

        .results-header h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .results-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .results-content {
            padding: 30px;
        }

        .express-item {
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .express-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .express-header {
            background: #f8f9ff;
            padding: 15px 20px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .express-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .express-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-delivered {
            background: #d4edda;
            color: #155724;
        }

        .status-transit {
            background: #fff3cd;
            color: #856404;
        }

        .status-pickup {
            background: #cce5ff;
            color: #004085;
        }

        .status-problem {
            background: #f8d7da;
            color: #721c24;
        }

        .express-body {
            padding: 20px;
        }

        .tracking-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }

        .tracking-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .tracking-time {
            min-width: 140px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .tracking-status {
            flex: 1;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }

        .tracking-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin-top: 6px;
            position: relative;
        }

        .tracking-item:not(:last-child) .tracking-dot::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 3px;
            width: 2px;
            height: 30px;
            background: #e1e8ed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .success-message {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(81, 207, 102, 0.3);
        }

        .warning-message {
            background: linear-gradient(135deg, #ffd43b, #fab005);
            color: #333;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(255, 212, 59, 0.3);
        }

        .retry-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .retry-button:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .network-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .network-online {
            background: #51cf66;
            color: white;
        }

        .network-offline {
            background: #ff6b6b;
            color: white;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .footer p {
            margin: 5px 0;
            opacity: 0.9;
        }

        .footer p:first-child {
            font-weight: 600;
            font-size: 16px;
            opacity: 1;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 2em;
            }

            .header p {
                font-size: 1em;
            }

            .main-content {
                padding: 20px;
            }

            .search-section {
                padding: 20px;
            }

            .search-form {
                flex-direction: column;
            }

            .input-group {
                min-width: auto;
            }

            .search-btn {
                align-self: stretch;
            }

            .express-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .tracking-item {
                flex-direction: column;
                gap: 5px;
            }

            .tracking-time {
                min-width: auto;
                font-size: 13px;
            }

            .tracking-dot {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-section,
            .results-content {
                padding: 15px;
            }

            .express-body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 快递查询</h1>
            <p>一个单号查所有快递 - 支持主流快递公司</p>
        </div>

        <div class="main-content">
            <div class="search-section">
                <h2>快递单号查询</h2>
                
                <div class="search-form">
                    <div class="input-group">
                        <label for="trackingNumber">快递单号</label>
                        <input type="text" id="trackingNumber" placeholder="请输入快递单号" maxlength="30">
                    </div>
                    
                    <div class="input-group">
                        <label for="expressCompany">快递公司（可选）</label>
                        <select id="expressCompany">
                            <option value="">自动识别</option>
                            <option value="SF">顺丰速运</option>

                            <option value="YTO">圆通速递</option>
                            <option value="YD">韵达速递</option>

                            <option value="DBL">德邦快递</option>
                            <option value="ZJS">宅急送</option>

                        </select>
                    </div>
                    
                    <button class="search-btn" onclick="queryExpress()">
                    <span id="searchBtnText">🔍 查询</span>
                </button>
                </div>

                <div class="tips">
                    <h4>💡 使用提示：</h4>
                    <ul>
                        <li>支持自动识别快递公司，无需手动选择</li>
                        <li>支持顺丰、中通、申通、圆通、韵达等主流快递</li>
                        <li>查询结果实时更新，与官网同步</li>

            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <h3 id="resultsTitle">查询结果</h3>

                </div>

        <div class="footer">

            <p>Gmail: <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="93f7f8f5fafff6a3a3a2d3f4fef2faffbdf0fcfe">[email&#160;protected]</a></p>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 快递公司映射
        const expressCompanies = {
            'SF': { name: '顺丰速运', phone: '95338', website: 'www.sf-express.com' },
            'ZTO': { name: '中通快递', phone: '95311', website: 'www.zto.com' },
            'STO': { name: '申通快递', phone: '95543', website: 'www.sto.cn' },
            'YTO': { name: '圆通速递', phone: '95554', website: 'www.yto.net.cn' },
            'YD': { name: '韵达速递', phone: '95546', website: 'www.yunda56.com' },
            'HTKY': { name: '百世快递', phone: '95320', website: 'www.800best.com' },
            'EMS': { name: '中国邮政EMS', phone: '11183', website: 'www.ems.com.cn' },
            'HHTT': { name: '天天快递', phone: '400-188-8888', website: 'www.ttkdex.com' },
            'JD': { name: '京东物流', phone: '950616', website: 'www.jdl.cn' },
            'UC': { name: '优速快递', phone: '400-1111-119', website: 'www.uc56.com' },
            'DBL': { name: '德邦快递', phone: '95353', website: 'www.deppon.com' },
            'ZJS': { name: '宅急送', phone: '400-6789-000', website: 'www.zjs.com.cn' },
            'JT': { name: '极兔速递', phone: '400-863-0888', website: 'www.jtexpress.com.cn' }
        };

        // 模拟快递查询函数
        async function mockExpressQuery(trackingNumber, company) {
            // 模拟网络延迟
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            const results = [];
            const companies = company ? [company] : ['SF', 'ZTO', 'STO', 'YTO', 'YD'];
            
            companies.forEach(comp => {
                if (expressCompanies[comp]) {
                    const companyInfo = expressCompanies[comp];
                    const trackingData = generateMockData(companyInfo.name);
                    
                    results.push({
                        company: comp,
                        companyName: companyInfo.name,
                        phone: companyInfo.phone,
                        website: companyInfo.website,
                        status: getStatusText(trackingData[0].status),
                        statusClass: getStatusClass(trackingData[0].status),
                        tracking: trackingData
                    });
                }
            });
            
            return results;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            if (status.includes('已签收') || status.includes('签收')) {
                return 'status-delivered';
            } else if (status.includes('派送') || status.includes('派件')) {
                return 'status-transit';
            } else if (status.includes('已收取') || status.includes('揽件')) {
                return 'status-pickup';
            } else if (status.includes('异常') || status.includes('问题')) {
                return 'status-problem';
            } else {
                return 'status-transit';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            if (status.includes('已签收') || status.includes('签收')) {
                return '已签收';
            } else if (status.includes('派送') || status.includes('派件')) {
                return '派送中';
            } else if (status.includes('已收取') || status.includes('揽件')) {
                return '已揽件';
            } else if (status.includes('异常') || status.includes('问题')) {
                return '异常件';
            } else {
                return '运输中';
            }
        }

        // 主查询函数 - 最终增强版
        async function queryExpress() {
            const trackingNumberInput = document.getElementById('trackingNumber').value;
            const company = document.getElementById('expressCompany').value;
            
            try {
                // 验证和清理输入
                const trackingNumber = validateTrackingNumber(trackingNumberInput);
                
                showLoading();
                
                const results = await realExpressQuery(trackingNumber, company);
                
                // 显示调试信息
                const detectedCompany = company || detectExpressCompany(trackingNumber);
                showDebugInfo(trackingNumber, detectedCompany, results);
                
                if (results.length === 0) {
                    showEnhancedError('未找到该快递单号的物流信息，请检查单号是否正确或稍后重试', 'warning');
                    return;
                }
                
                displayResults(results);
                
                // 记录查询历史（本地存储）
                saveQueryHistory(trackingNumber, company);
                
                // 显示成功提示
                if (results.some(r => r.isReal)) {
                    console.log('✅ 查询成功，显示实时数据');
                } else {
                    console.log('ℹ️ 查询成功，提供跳转查询');
                }
                
                // 恢复按钮状态
                const searchBtn = document.querySelector('.search-btn');
                const searchBtnText = document.getElementById('searchBtnText');
                if (searchBtn && searchBtnText) {
                    searchBtn.disabled = false;
                    searchBtnText.innerHTML = '🔍 查询';
                }
                
            } catch (error) {
                console.error('查询失败:', error);
                
                // 使用增强的错误处理
                const { errorMessage, errorType, showRetry } = handleApiError(error, trackingNumberInput);
                showEnhancedError(errorMessage, errorType, showRetry);
            }
        }

        // 添加调试信息显示功能
        function showDebugInfo(trackingNumber, detectedCompany, queryResult) {
            console.group('🔍 快递查询调试信息');
            console.log('📝 输入单号:', trackingNumber);
            console.log('🎯 识别结果:', detectedCompany);
            console.log('📊 查询结果:', queryResult);
            console.log('🕒 查询时间:', new Date().toLocaleString('zh-CN'));
            console.groupEnd();
            
            // 在页面上显示调试信息（开发模式）
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                const debugDiv = document.getElementById('debugInfo') || createDebugDiv();
                debugDiv.innerHTML = `
                    <h4>🔍 调试信息</h4>
                    <p><strong>输入单号:</strong> ${trackingNumber}</p>
                    <p><strong>识别公司:</strong> ${detectedCompany} (${expressCompanies[detectedCompany]?.name || '未知'})</p>
                    <p><strong>查询状态:</strong> ${queryResult.length > 0 ? '成功' : '失败'}</p>
                    <p><strong>查询时间:</strong> ${new Date().toLocaleString('zh-CN')}</p>
                `;
            }
        }
        
        function createDebugDiv() {
            const debugDiv = document.createElement('div');
            debugDiv.id = 'debugInfo';
            debugDiv.style.cssText = `
                position: fixed;
                top: 10px;
                left: 10px;
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 10px;
                border-radius: 5px;
                font-size: 12px;
                z-index: 9999;
                max-width: 300px;
            `;
            document.body.appendChild(debugDiv);
            return debugDiv;
        }
        function initPage() {
            // 初始化网络监控
            initNetworkMonitoring();
            
            // 绑定回车键查询
            const trackingInput = document.getElementById('trackingNumber');
            if (trackingInput) {
                trackingInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        queryExpress();
                    }
                });
            }
            
            // 绑定快递公司选择变化事件
            const companySelect = document.getElementById('expressCompany');
            if (companySelect) {
                companySelect.addEventListener('change', function() {
                    const trackingNumber = document.getElementById('trackingNumber').value.trim();
                    if (trackingNumber) {
                        // 自动触发查询（可选）
                        console.log('快递公司已更改为:', this.value);

                });

        // 增强的错误处理函数
        function handleApiError(error, trackingNumber) {
            let errorMessage = '';
            let errorType = 'error';
            let showRetry = true;

            if (!navigator.onLine) {
                errorMessage = '网络连接已断开，请检查网络设置后重试';
                errorType = 'warning';
            } else if (error.message.includes('timeout') || error.message.includes('超时')) {
                errorMessage = '查询超时，服务器响应较慢，请稍后重试';
                errorType = 'warning';
            } else if (error.message.includes('404') || error.message.includes('Not Found')) {
                errorMessage = '查询服务暂时不可用，请稍后重试或使用官方查询';
                errorType = 'warning';
            } else if (error.message.includes('跨域') || error.message.includes('CORS')) {
                errorMessage = '由于浏览器安全限制，将为您跳转到官方查询页面';
                errorType = 'warning';
                showRetry = false;
                // 延迟跳转
                setTimeout(() => {
                    // 自动识别快递公司
                    const detectedCompany = detectExpressCompany(trackingNumber);
                    const urls = buildUserFriendlyUrl(trackingNumber, detectedCompany);
                    console.log(`🔗 跳转到快递查询页面: ${urls.primary}`);
                    window.open(urls.primary, '_blank');
                }, 3000);
            } else if (error.message.includes('单号')) {
                errorMessage = error.message;
                errorType = 'warning';
                showRetry = false;
            } else {
                errorMessage = '查询失败，请检查快递单号是否正确或稍后重试';
            }

            return { errorMessage, errorType, showRetry };
        }

        // 快递公司自动识别 - 增强版
        function detectExpressCompany(trackingNumber) {
            // 清理输入
            const cleanNumber = trackingNumber.replace(/\s+/g, '').toUpperCase();
            
            // 详细的识别规则
            const patterns = [
                // 顺丰速运
                { code: 'SF', pattern: /^SF\d{12}$/, name: '顺丰速运' },
                { code: 'SF', pattern: /^\d{12}$/, condition: (num) => num.startsWith('1') || num.startsWith('2') },
                
                // 中通快递
                { code: 'ZTO', pattern: /^(ZTO|ZT)\d{10,12}$/, name: '中通快递' },
                { code: 'ZTO', pattern: /^\d{12}$/, condition: (num) => num.startsWith('7') || num.startsWith('6') },
                
                // 申通快递
                { code: 'STO', pattern: /^(STO|ST)\d{10,12}$/, name: '申通快递' },
                { code: 'STO', pattern: /^\d{12}$/, condition: (num) => num.startsWith('3') || num.startsWith('4') },
                { code: 'STO', pattern: /^\d{15}$/, condition: (num) => num.startsWith('77') || num.startsWith('78') },
                
                // 圆通速递
                { code: 'YTO', pattern: /^(YT|YTO)\d{10,13}$/, name: '圆通速递' },
                { code: 'YTO', pattern: /^\d{12,13}$/, condition: (num) => num.startsWith('YT') || /^[0-9]{12,13}$/.test(num) },
                
                // 韵达快递
                { code: 'YD', pattern: /^(YD|YUNDA)\d{10,13}$/, name: '韵达快递' },
                { code: 'YD', pattern: /^\d{13}$/, condition: (num) => num.startsWith('12') || num.startsWith('13') },
                { code: 'YD', pattern: /^\d{15}$/, condition: (num) => num.startsWith('46') || num.startsWith('47') || num.startsWith('48') },
                
                // EMS
                { code: 'EMS', pattern: /^E[A-Z]\d{9}CN$/, name: 'EMS' },
                { code: 'EMS', pattern: /^[A-Z]{2}\d{9}[A-Z]{2}$/, name: 'EMS' },
                
                // 京东物流
                { code: 'JD', pattern: /^(JD|京东)\d{12,15}$/, name: '京东物流' },
                { code: 'JD', pattern: /^JD\d{18}$/, name: '京东物流' },
                
                // 德邦快递
                { code: 'DBL', pattern: /^\d{8,10}$/, condition: (num) => num.length >= 8 && num.length <= 10 },
                
                // 天天快递
                { code: 'HHTT', pattern: /^\d{12}$/, condition: (num) => num.startsWith('5') || num.startsWith('8') },
                
                // 百世快递
                { code: 'HTKY', pattern: /^(B|H)\d{10,12}$/, name: '百世快递' },
                
                // 极兔速递
                { code: 'JT', pattern: /^(JT|极兔)\d{10,13}$/, name: '极兔速递' },
                { code: 'JT', pattern: /^JT\d{13}$/, name: '极兔速递' },
                { code: 'JT', pattern: /^\d{13}$/, condition: (num) => num.startsWith('77') || num.startsWith('78') || num.startsWith('79') },
                
                // 邮政快递包裹
                { code: 'YZPY', pattern: /^\d{11,13}$/, condition: (num) => /^[0-9]{11,13}$/.test(num) }
            ];
            
            // 按优先级匹配
            for (const rule of patterns) {
                if (rule.pattern.test(cleanNumber)) {
                    if (rule.condition) {
                        if (rule.condition(cleanNumber)) {
                            console.log(`🎯 自动识别: ${cleanNumber} -> ${rule.code} (${rule.name || expressCompanies[rule.code]?.name})`);
                            return rule.code;
                        }
                    } else {
                        console.log(`🎯 自动识别: ${cleanNumber} -> ${rule.code} (${rule.name || expressCompanies[rule.code]?.name})`);
                        return rule.code;
                    }
                }
            }
            
            // 如果都不匹配，根据长度和特征进行推测
            if (cleanNumber.length === 12) {
                console.log(`🤔 推测识别: ${cleanNumber} -> SF (12位数字，推测为顺丰)`);
                return 'SF';
            } else if (cleanNumber.length === 13) {
                console.log(`🤔 推测识别: ${cleanNumber} -> YTO (13位数字，推测为圆通)`);
                return 'YTO';
            } else if (cleanNumber.length === 15) {
                // 15位数字优先检查韵达快递和申通快递
                if (cleanNumber.startsWith('46') || cleanNumber.startsWith('47') || cleanNumber.startsWith('48')) {
                    console.log(`🤔 推测识别: ${cleanNumber} -> YD (15位数字，以46/47/48开头，推测为韵达)`);
                    return 'YD';
                } else if (cleanNumber.startsWith('77') || cleanNumber.startsWith('78')) {
                    console.log(`🤔 推测识别: ${cleanNumber} -> STO (15位数字，以77/78开头，推测为申通)`);
                    return 'STO';
                }
                console.log(`🤔 推测识别: ${cleanNumber} -> ZTO (15位数字，推测为中通)`);
                return 'ZTO';
            } else if (cleanNumber.length >= 10 && cleanNumber.length <= 15) {
                console.log(`🤔 推测识别: ${cleanNumber} -> ZTO (${cleanNumber.length}位数字，推测为中通)`);
                return 'ZTO';
            }
            
            // 默认返回中通（覆盖面较广）
            console.log(`❓ 无法识别: ${cleanNumber} -> ZTO (默认中通)`);
            return 'ZTO';
        }

        // 安全的跨域请求处理
        async function safeApiRequest(url, options = {}) {
            try {
                // 添加安全头部
                const secureOptions = {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        ...options.headers
                    },
                    mode: 'cors',
                    credentials: 'omit' // 不发送cookies，提高安全性
                };
                
                const response = await fetch(url, secureOptions);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API请求失败:', error);
                throw error;
            }
        }

        // 输入验证和清理
        function sanitizeInput(input) {
            if (typeof input !== 'string') return '';
            
            // 移除潜在的恶意字符
            return input
                .replace(/[<>\"'&]/g, '') // 移除HTML特殊字符
                .replace(/[^\w\-]/g, '') // 只保留字母数字和连字符
                .trim()
                .substring(0, 30); // 限制长度
        }

        // 增强的快递单号验证
        function validateTrackingNumber(trackingNumber) {
            const sanitized = sanitizeInput(trackingNumber);
            
            if (!sanitized) {
                throw new Error('快递单号不能为空');
            }
            
            if (sanitized.length < 8 || sanitized.length > 20) {
                throw new Error('快递单号长度应在8-20位之间');
            }
            
            // 检查是否包含有效字符
            if (!/^[A-Za-z0-9\-]+$/.test(sanitized)) {
                throw new Error('快递单号只能包含字母、数字和连字符');
            }
            
            return sanitized;
        }

                    text-align: center;
                    padding: 20px;
                    color: #666;

            if (!document.querySelector('style[data-result-actions]')) {
                style.setAttribute('data-result-actions', 'true');

        // 回车键查询
        document.getElementById('trackingNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchExpress();

        });

        // 输入框自动清理
        document.getElementById('trackingNumber').addEventListener('input', function(e) {
