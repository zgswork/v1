        // 记录已展示的品牌索引
        let shownBrands = [];
        
        // 显示随机品牌
        function showRandomBrand() {
            // 如果所有品牌都已展示过，重置记录
            if (shownBrands.length === brands.length) {
                shownBrands = [];
            }
            
            // 获取未展示过的随机品牌索引
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * brands.length);
            } while (shownBrands.includes(randomIndex));
            
            shownBrands.push(randomIndex);
            const brand = brands[randomIndex];
            
            // 更新DOM
            brandLogo.src = brand.logo;
            brandLogo.alt = `${brand.name} logo`;
            brandName.textContent = brand.name;
            brandCountry.textContent = brand.country;
            brandStory.textContent = brand.story;
            brandPositioning.textContent = brand.positioning;

                featuresList.appendChild(li);
            });
            brandFeatures.appendChild(featuresList);
            
            // 更新产品系列列表
            productSeries.innerHTML = '';

            brandContainer.style.display = 'block';
            
            // 更新按钮文本
            brandBtn.textContent = '换一个化妆品品牌';
        }
        
        // 添加按钮点击事件
        brandBtn.addEventListener('click', showRandomBrand);
    </script>
