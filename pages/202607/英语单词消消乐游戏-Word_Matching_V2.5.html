<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词消消乐游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #FFF9F0;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background-image: radial-gradient(#FFD166 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        .header {
            text-align: center;
            margin: 20px 0 30px;
            position: relative;
        }
        
        h1 {
            font-size: 2.8rem;
            color: #EF476F;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            background: linear-gradient(to right, #06D6A0, #118AB2, #FFD166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #5F0F40;
            margin-bottom: 15px;
        }
        
        .game-info {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #5F0F40;
            font-weight: bold;
        }
        
        .game-info span {
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .timer-card {
            background: linear-gradient(135deg, #FFD166, #FF9E6D);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }
        
        .score-card {
            background: linear-gradient(135deg, #06D6A0, #118AB2);
        }
        
        .timer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #EF476F, #06D6A0);
        }
        
        .timer-card h3 {
            color: #5F0F40;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .timer-card .time {
            font-size: 1.8rem;
            font-weight: bold;
            color: #5F0F40;
            font-family: 'Courier New', monospace;
        }
        
        .level-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .level-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #FFD166;
            border: 2px solid #5F0F40;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .level-dot::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
        }
        
        .level-dot.active {
            background: #EF476F;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(239, 71, 111, 0.6);
        }
        
        .level-dot.completed {
            background: #06D6A0;
            box-shadow: 0 0 10px rgba(6, 214, 160, 0.6);
        }
        
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }
        
        .bubble {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            position: relative;
            box-shadow: 
                inset 0 8px 15px rgba(255, 255, 255, 0.4),
                0 12px 20px rgba(0, 0, 0, 0.2),
                0 0 0 4px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            padding: 10px;
            user-select: none;
            overflow: hidden;
            animation: float 3s infinite ease-in-out;
        }
        
        .bubble::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .bubble.en {
            background: hsla(216, 100%, 65%, 0.85);
        }
        
        .bubble.cn {
            background: hsla(334, 100%, 50%, 0.85);
        }
        
        .bubble.selected {
            transform: scale(1.15);
            box-shadow: 
                inset 0 8px 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.8),
                0 15px 25px rgba(0, 0, 0, 0.3);
            animation: pulse 1s infinite alternate;
            z-index: 10;
        }
        
        .bubble.matched {
            animation: disappear 0.8s forwards;
        }
        
        .bubble.error {
            animation: shake 0.5s ease;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
        }
        
        @keyframes disappear {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #5F0F40, #9A031E);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        button.primary {
            background: linear-gradient(135deg, #06D6A0, #118AB2);
        }
        
        button.small {
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, 
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.8) 50%,
                rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:hover::after {
            animation: shine 1.5s ease;
        }
        
        @keyframes shine {
            0% { left: -50%; }
            100% { left: 150%; }
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #FFF9F0, #FFE8D6);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: popIn 0.5s ease;
            border: 3px solid #FFD166;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .modal h2 {
            font-size: 2.5rem;
            color: #5F0F40;
            margin-bottom: 20px;
        }
        
        .modal p {
            font-size: 1.3rem;
            margin: 15px 0;
            color: #5F0F40;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
            text-align: center;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat-item h3 {
            color: #5F0F40;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .stat-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #118AB2;
            font-family: 'Courier New', monospace;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #5F0F40;
            transition: transform 0.3s;
        }
        
        .close-btn:hover {
            transform: rotate(90deg);
        }
        
        .word-manager {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            margin: 30px auto;
            max-width: 800px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: 2px dashed #118AB2;
            display: none;
        }
        
        .word-manager h3 {
            text-align: center;
            color: #5F0F40;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .word-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .word-form input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #FFD166;
            border-radius: 8px;
            font-size: 1.1rem;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.7);
        }
        
        .word-form button {
            padding: 12px 20px;
            font-size: 1rem;
        }
        
        .word-list-actions {
            display: flex;
            justify-content: space-between;
            margin: 15px 0 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .word-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            margin-top: 5px;
            border: 1px solid #FFD166;
        }
        
        .word-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px dashed #FFD166;
            transition: background 0.3s;
        }
        
        .word-item:hover {
            background: rgba(255, 209, 102, 0.2);
        }
        
        .word-item:last-child {
            border-bottom: none;
        }
        
        .word-checkbox {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .word-text {
            font-weight: bold;
            flex-grow: 1;
        }
        
        .word-actions {
            display: flex;
            gap: 10px;
        }
        
        .word-actions button {
            padding: 5px 10px;
            font-size: 0.9rem;
            background: #5F0F40;
        }
        
        .import-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #FFD166;
        }
        
        .import-section h4 {
            color: #5F0F40;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .import-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .import-box {
            background: rgba(255, 255, 255, 0.7);
            border: 2px dashed #06D6A0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
        }
        
        .import-box:hover {
            background: rgba(6, 214, 160, 0.1);
            transform: translateY(-3px);
        }
        
        .import-box i {
            font-size: 2.5rem;
            color: #06D6A0;
            margin-bottom: 10px;
        }
        
        .import-box p {
            color: #5F0F40;
            font-weight: bold;
        }
        
        #file-input {
            display: none;
        }
        
        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: firework 1s ease-out;
        }
        
        @keyframes firework {
            0% { transform: translate(var(--x), var(--y)); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
        
        .wonderful {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 8rem;
            font-weight: bold;
            color: #FF6B6B;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: 99;
            pointer-events: none;
            animation: zoomIn 1s ease-out forwards;
        }
        
        @keyframes zoomIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        
        .medal-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .medal {
            font-size: 4rem;
            animation: medalSpin 1.5s ease-out forwards;
            transform-origin: center bottom;
        }
        
        @keyframes medalSpin {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(360deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }
        
        .medal-info {
            margin-top: 10px;
            font-weight: bold;
            color: #5F0F40;
        }
        
        .no-words-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 1.4rem;
            color: #5F0F40;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            margin: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .no-words-message i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #06D6A0;
            display: block;
        }
        
        .no-words-message .highlight {
            color: #EF476F;
            font-weight: bold;
        }
        
        /* 作者信息 */
        .author-info {
            text-align: center;
            padding: 20px;
            color: #5F0F40;
            font-size: 1rem;
            max-width: 1200px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .author-info p {
            margin: 0;
            padding: 5px 0;
            font-weight: bold;
        }
        
        .wechat-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }
        
        .wechat-icon {
            color: #06D6A0;
            font-size: 1.2rem;
        }
        
        /* 发音提示样式 */
        .speaking-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: none;
        }
        
        .bubble.speaking .speaking-indicator {
            display: block;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        
        /* 移动端优化 */
        @media (max-width: 1000px) {
            .bubble-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .bubble-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
            
            .bubble {
                width: 85px;
                height: 85px;
                font-size: 1.0rem;
            }
            
            .stats-container {
                gap: 15px;
            }
            
            .timer-card {
                min-width: 140px;
                padding: 12px 20px;
            }
            
            .timer-card .time {
                font-size: 1.5rem;
            }
            
            .import-options {
                flex-direction: column;
                align-items: center;
            }
            
            .medal {
                font-size: 3rem;
            }
            
            .no-words-message {
                font-size: 1.1rem;
                padding: 20px;
            }
            
            .author-info {
                padding: 15px;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .game-info {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .game-info span {
                width: 100%;
                text-align: center;
            }
            
            .stats-container {
                flex-direction: column;
                align-items: center;
            }
            
            .timer-card {
                width: 100%;
                max-width: 300px;
            }
            
            .bubble-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            
            .bubble {
                width: 80px;
                height: 80px;
                font-size: 0.9rem;
                padding: 5px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            
            button {
                width: 100%;
                max-width: 280px;
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .word-form {
                flex-direction: column;
            }
            
            .word-form input, 
            .word-form button {
                width: 100%;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .medal-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .word-list-actions {
                flex-direction: column;
                align-items: stretch;
            }
            
            .modal-content {
                padding: 25px 15px;
            }
            
            .modal h2 {
                font-size: 2rem;
            }
            
            .modal p {
                font-size: 1.1rem;
            }
            
            .stat-item {
                padding: 10px;
            }
            
            .stat-item .value {
                font-size: 1.5rem;
            }
            
            .author-info {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 360px) {
            .bubble {
                width: 70px;
                height: 70px;
                font-size: 0.8rem;
            }
            
            .game-info span {
                font-size: 0.95rem;
                padding: 6px 12px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .author-info {
                font-size: 0.8rem;
            }
        }
        
        /* 触摸优化 */
        .bubble {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        button {
            touch-action: manipulation;
        }
        
        /* 防止长按选择文本 */
        .bubble, button, .word-item {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 移动端滚动优化 */
        .word-list {
            -webkit-overflow-scrolling: touch;
        }
        
        /* 移动端模态框优化 */
        @media (max-height: 600px) {
            .modal {
                align-items: flex-start;
                padding-top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>英语单词消消乐游戏</h1>
        <div class="subtitle">快乐学习，轻松记忆</div>
        <div class="game-info">
            <span>单词总量: <span id="total-words-count">24</span></span>
            <span>关卡: <span id="current-level-display">1</span>/<span id="total-levels">2</span></span>
            <span>每关单词: <span id="words-per-level">12</span> 对</span>
        </div>
    </div>
    
    <div class="game-container">
        <div class="stats-container">
            <div class="timer-card">
                <h3>总用时</h3>
                <div class="time" id="total-time">00:00</div>
            </div>
            <div class="timer-card">
                <h3>当前关卡用时</h3>
                <div class="time" id="current-time">00:00</div>
            </div>
            <div class="timer-card score-card">
                <h3>当前关卡得分</h3>
                <div class="time" id="current-score">0</div>
            </div>
            <div class="timer-card score-card">
                <h3>总分数</h3>
                <div class="time" id="total-score">0</div>
            </div>
        </div>
        
        <div class="level-indicator" id="level-indicator">
            <div class="level-dot active"></div>
            <div class="level-dot"></div>
        </div>

    <script>
        // 内置单词库
        const builtInWords = [
            { english: 'meet', chinese: '相识；结识' },
            { english: 'new', chinese: '新的' },
            { english: 'morning', chinese: '早晨；上午' },
            { english: 'classmate', chinese: '同班同学' },
            { english: 'her', chinese: '她的' },
            { english: 'name', chinese: '名字' },
            { english: 'sit', chinese: '坐' },
            { english: 'afternoon', chinese: '下午' },
            { english: 'his', chinese: '他的' },
            { english: 'run', chinese: '跑' },
            { english: 'fast', chinese: '快地；迅速地；快的' },
            { english: 'fly', chinese: '飞；放飞' },
            { english: 'draw', chinese: '画面' },
            { english: 'write', chinese: '写字；书写' },
            { english: 'jump', chinese: '跳' },
            { english: 'welcome', chinese: '欢迎' },
            { english: 'woof', chinese: '（狗叫声）汪汪' },
            { english: 'but', chinese: '但是' },
            { english: 'happy', chinese: '开心的' },
            { english: 'sad', chinese: '难过的；悲哀的' },
            { english: 'tired', chinese: '累的；疲惫的' },
            { english: 'hungry', chinese: '饥饿的' },
            { english: 'full', chinese: '饱的' }
        ];
        
        // 初始化单词库 - 使用内置单词
        let wordLibrary = [...builtInWords];
        
        // 游戏状态
        let gameState = {
            currentLevel: 1,
            totalLevels: 2,
            selectedBubble: null,
            matchedPairs: 0,
            totalPairs: 0,
            accumulatedTime: 0,
            currentLevelTime: 0,
            levelTimer: null,
            wrongWords: [],
            gameWords: [],
            currentLevelScore: 0,
            totalScore: 0,
            highScore: 0,
            usedWords: [],
            isPracticeMode: false
        };
        
        // 全局发音开关状态
        let soundEnabled = true;
        
        // DOM 元素
        const elements = {
            bubbleGrid: document.getElementById('bubble-grid'),
            levelIndicator: document.getElementById('level-indicator'),
            totalTime: document.getElementById('total-time'),
            currentTime: document.getElementById('current-time'),
            levelCompleteModal: document.getElementById('level-complete-modal'),
            gameCompleteModal: document.getElementById('game-complete-modal'),
            wrongWordsModal: document.getElementById('wrong-words-modal'),
            levelTime: document.getElementById('level-time'),
            totalGameTime: document.getElementById('total-game-time'),
            completionTime: document.getElementById('completion-time'),
            wrongWordsList: document.getElementById('wrong-words-list'),
            wordList: document.getElementById('word-list'),
            englishInput: document.getElementById('english-input'),
            chineseInput: document.getElementById('chinese-input'),
            wordManager: document.getElementById('word-manager'),
            currentScore: document.getElementById('current-score'),
            totalScore: document.getElementById('total-score'),
            levelScore: document.getElementById('level-score'),
            finalScore: document.getElementById('final-score'),
            highScore: document.getElementById('high-score'),
            totalWordsCount: document.getElementById('total-words-count'),
            currentLevelDisplay: document.getElementById('current-level-display'),
            totalLevels: document.getElementById('total-levels'),
            wordsPerLevel: document.getElementById('words-per-level'),
            medalContainer: document.getElementById('medal-container'),
            medalInfo: document.getElementById('medal-info'),
            soundToggleBtn: document.getElementById('sound-toggle-btn')
        };
        
        // 发音函数 - 使用有道词典API
        function playWordAudio(word) {
            // 检查发音开关状态
            if (!soundEnabled) return;
            
            // 创建音频元素
            const audio = new Audio();
            
            // 设置音频源为有道词典发音API
            audio.src = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`;
            
            // 播放前添加speaking类
            const activeBubbles = document.querySelectorAll(`.bubble.en[data-text="${word}"]`);
            activeBubbles.forEach(bubble => {
                bubble.classList.add('speaking');
            });
            
            // 播放音频
            audio.play().catch(e => {
                console.error("播放发音失败:", e);
            });
            
            // 播放结束后移除speaking类
            audio.onended = () => {
                activeBubbles.forEach(bubble => {
                    bubble.classList.remove('speaking');
                });
            };
        }
        
        // 更新发音按钮状态
        function updateSoundButton() {
            if (soundEnabled) {
                elements.soundToggleBtn.classList.add('sound-on');
                elements.soundToggleBtn.innerHTML = '<i class="fas fa-volume-up"></i> 发音开启';
            } else {
                elements.soundToggleBtn.classList.remove('sound-on');
                elements.soundToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i> 发音关闭';
            }
        }
        
        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            gameState.currentLevel = 1;
            gameState.matchedPairs = 0;
            gameState.accumulatedTime = 0;
            gameState.currentLevelTime = 0;
            gameState.wrongWords = [];
            gameState.currentLevelScore = 0;
            gameState.totalScore = 0;
            gameState.usedWords = [];
            gameState.isPracticeMode = false;
            
            // 更新显示
            elements.currentScore.textContent = '0';
            elements.totalScore.textContent = '0';
            elements.totalWordsCount.textContent = wordLibrary.length;
            elements.totalLevels.textContent = gameState.totalLevels;
            elements.wordsPerLevel.textContent = wordLibrary.length > 0 ? '12' : '0';
            
            // 清除计时器
            if (gameState.levelTimer) clearInterval(gameState.levelTimer);
            
            // 更新计时器显示
            elements.totalTime.textContent = formatTime(0);
            elements.currentTime.textContent = formatTime(0);
            
            // 更新关卡指示器
            updateLevelIndicator();
            
            // 开始游戏
            startLevel();
        }
        
        // 开始关卡
        function startLevel() {
            // 重置状态
            gameState.matchedPairs = 0;
            gameState.selectedBubble = null;
            gameState.currentLevelScore = 0;
            elements.currentScore.textContent = '0';
            elements.bubbleGrid.innerHTML = '';
            elements.currentLevelDisplay.textContent = gameState.currentLevel;
            
            // 计算本关实际单词对数
            let wordsPerLevel = Math.min(12, wordLibrary.length - (gameState.currentLevel - 1) * 12);
            gameState.totalPairs = wordsPerLevel;
            
            // 更新显示
            elements.wordsPerLevel.textContent = wordsPerLevel;
            
            const selectedWords = getRandomWords(wordsPerLevel);
            gameState.gameWords = selectedWords;
            
            // 创建泡泡
            createBubbles(selectedWords);
            
            // 更新关卡指示器
            updateLevelIndicator();
            
            // 启动计时器
            startTimers();
        }
        
        // 获取随机单词
        function getRandomWords(count) {
            // 从单词库中排除已使用的单词
            const availableWords = wordLibrary.filter(word => 
                !gameState.usedWords.includes(word.english)
            );
            
            // 如果可用单词不足，则使用全部单词
            const wordPool = availableWords.length >= count ? availableWords : wordLibrary;
            
            // 随机选择单词
            const shuffled = [...wordPool].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, count);
            
            // 添加到已使用列表
            selected.forEach(word => {
                gameState.usedWords.push(word.english);
            });
            
            return selected;
        }
        
        // 创建泡泡
        function createBubbles(words) {
            // 创建中英文泡泡对
            const bubbles = [];
            
            words.forEach(word => {
                bubbles.push({
                    text: word.english,
                    type: 'en',
                    pair: word.chinese
                });
                
                bubbles.push({
                    text: word.chinese,
                    type: 'cn',
                    pair: word.english
                });
            });
            
            // 随机排序泡泡
            shuffleArray(bubbles);
            
            // 添加到网格
            bubbles.forEach(bubble => {
                const bubbleEl = document.createElement('div');
                bubbleEl.className = `bubble ${bubble.type}`;
                bubbleEl.textContent = bubble.text;
                bubbleEl.dataset.text = bubble.text;
                bubbleEl.dataset.type = bubble.type;
                bubbleEl.dataset.pair = bubble.pair;
                
                // 添加浮动动画延迟
                bubbleEl.style.animationDelay = `${Math.random() * 2}s`;
                
                // 添加发音指示器
                if (bubble.type === 'en') {
                    const indicator = document.createElement('div');
                    indicator.className = 'speaking-indicator';
                    bubbleEl.appendChild(indicator);
                }
                
                bubbleEl.addEventListener('click', () => handleBubbleClick(bubbleEl));
                elements.bubbleGrid.appendChild(bubbleEl);
            });
        }
        
        // 处理泡泡点击
        function handleBubbleClick(bubble) {
            // 如果泡泡已被匹配，则忽略点击
            if (bubble.classList.contains('matched')) return;
            
            // 如果是英文泡泡，播放发音
            if (bubble.dataset.type === 'en') {
                playWordAudio(bubble.dataset.text);
            }
            
            // 如果当前没有选中的泡泡
            if (!gameState.selectedBubble) {
                bubble.classList.add('selected');
                gameState.selectedBubble = bubble;
                return;
            }
            
            // 如果点击了同一个泡泡
            if (gameState.selectedBubble === bubble) {
                bubble.classList.remove('selected');
                gameState.selectedBubble = null;
                return;
            }
            
            // 检查配对
            const bubble1 = gameState.selectedBubble;
            const bubble2 = bubble;
            
            // 禁止同语言配对
            if (bubble1.dataset.type === bubble2.dataset.type) {
                bubble1.classList.remove('selected');
                bubble2.classList.add('error');
                setTimeout(() => {
                    bubble2.classList.remove('error');
                }, 500);
                
                // 添加到错题本
                addToWrongWords(bubble1.dataset.text, bubble1.dataset.type);
                gameState.selectedBubble = null;
                return;
            }
            
            // 检查是否配对
            if ((bubble1.dataset.type === 'en' && bubble1.dataset.pair === bubble2.dataset.text) || 
                (bubble1.dataset.type === 'cn' && bubble1.dataset.pair === bubble2.dataset.text)) {
                // 配对成功
                bubble1.classList.add('matched');
                bubble2.classList.add('matched');
                bubble1.classList.remove('selected');
                
                // 添加匹配动画
                setTimeout(() => {
                    bubble1.style.visibility = 'hidden';
                    bubble2.style.visibility = 'hidden';
                }, 400);
                
                gameState.matchedPairs++;
                
                // 计算得分：每对10分
                gameState.currentLevelScore += 10;
                elements.currentScore.textContent = gameState.currentLevelScore;
                
                // 检查关卡是否完成
                if (gameState.matchedPairs === gameState.totalPairs) {
                    setTimeout(completeLevel, 600);
                }
            } else {
                // 配对失败
                bubble1.classList.remove('selected');
                bubble2.classList.add('error');
                setTimeout(() => {
                    bubble2.classList.remove('error');
                }, 500);
                
                // 添加到错题本
                addToWrongWords(bubble1.dataset.text, bubble1.dataset.type);
                addToWrongWords(bubble2.dataset.text, bubble2.dataset.type);
            }
            
            gameState.selectedBubble = null;
        }
        
        // 添加到错题本
        function addToWrongWords(text, type) {
            // 检查是否已存在
            const exists = gameState.wrongWords.some(word => 
                (type === 'en' && word.english === text) || 
                (type === 'cn' && word.chinese === text)
            );
            
            if (!exists) {
                if (type === 'en') {
                    const chinese = wordLibrary.find(w => w.english === text)?.chinese;
                    if (chinese) {
                        gameState.wrongWords.push({ english: text, chinese });
                    }
                } else {
                    const english = wordLibrary.find(w => w.chinese === text)?.english;
                    if (english) {
                        gameState.wrongWords.push({ english, chinese: text });
                    }
                }
            }
        }
        
        // 完成关卡
        function completeLevel() {
            // 停止关卡计时器
            clearInterval(gameState.levelTimer);
            
            // 计算时间奖励分数
            const timeBonus = Math.min(20, Math.max(0, 20 - Math.floor(gameState.currentLevelTime / 5)));
            gameState.currentLevelScore += timeBonus;
            elements.currentScore.textContent = gameState.currentLevelScore;
            
            // 累加到总分
            gameState.totalScore += gameState.currentLevelScore;
            elements.totalScore.textContent = gameState.totalScore;
            
            // 累加时间
            gameState.accumulatedTime += gameState.currentLevelTime;
            
            // 显示关卡完成动画
            showLevelCompleteAnimation();
            
            // 显示完成模态框
            setTimeout(() => {
                elements.levelTime.textContent = formatTime(gameState.currentLevelTime);
                elements.levelScore.textContent = gameState.currentLevelScore;
                elements.levelCompleteModal.style.display = 'flex';
            }, 1500);
        }
        
        // 显示关卡完成动画
        function showLevelCompleteAnimation() {
            const wonderful = document.createElement('div');
            wonderful.className = 'wonderful';
            wonderful.textContent = 'Wonderful!';
            document.body.appendChild(wonderful);
            
            setTimeout(() => {
                wonderful.remove();
            }, 2000);
        }
        
        // 下一关
        function nextLevel() {
            gameState.currentLevel++;
            
            if (gameState.currentLevel > gameState.totalLevels) {
                completeGame();
            } else {
                elements.levelCompleteModal.style.display = 'none';
                startLevel();
            }
        }
        
        // 完成游戏
        function completeGame() {
            // 更新最高分
            if (gameState.totalScore > gameState.highScore) {
                gameState.highScore = gameState.totalScore;
            }
            
            // 显示完成模态框
            elements.totalGameTime.textContent = formatTime(gameState.accumulatedTime);
            elements.finalScore.textContent = gameState.totalScore;
            elements.highScore.textContent = gameState.highScore;
            elements.completionTime.textContent = new Date().toLocaleString();
            elements.gameCompleteModal.style.display = 'flex';
            
            // 显示烟花效果
            showFireworks();
        }
        
        // 显示烟花效果
        function showFireworks() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFD166', '#06D6A0', '#118AB2'];
            
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    
                    // 随机起始位置
                    const startX = window.innerWidth / 2;
                    const startY = window.innerHeight / 2;
                    
                    // 随机目标位置
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 100 + Math.random() * 500;
                    const targetX = startX + Math.cos(angle) * distance;
                    const targetY = startY + Math.sin(angle) * distance;
                    
                    // 随机颜色
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    firework.style.setProperty('--x', `${startX}px`);
                    firework.style.setProperty('--y', `${startY}px`);
                    firework.style.setProperty('--tx', `${targetX - startX}px`);
                    firework.style.setProperty('--ty', `${targetY - startY}px`);
                    firework.style.backgroundColor = color;
                    
                    document.body.appendChild(firework);
                    
                    // 移除元素
                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }, i * 20);
            }
        }
        
        // 开始计时器
        function startTimers() {
            // 重置关卡计时
            gameState.currentLevelTime = 0;
            elements.currentTime.textContent = formatTime(0);
            
            // 启动关卡计时器
            clearInterval(gameState.levelTimer);
            gameState.levelTimer = setInterval(() => {
                gameState.currentLevelTime++;
                elements.currentTime.textContent = formatTime(gameState.currentLevelTime);
                // 总用时 = 累计时间 + 当前关卡用时
                elements.totalTime.textContent = formatTime(gameState.accumulatedTime + gameState.currentLevelTime);
            }, 1000);
        }
        
        // 格式化时间 (mm:ss)
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新关卡指示器
        function updateLevelIndicator() {
            const dots = elements.levelIndicator.querySelectorAll('.level-dot');
            dots.forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                
                if (index + 1 === gameState.currentLevel) {
                    dot.classList.add('active');
                } else if (index + 1 < gameState.currentLevel) {
                    dot.classList.add('completed');
                }
            });
        }
        
        // 渲染单词列表
        function renderWordList() {
            elements.wordList.innerHTML = '';
            
            wordLibrary.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.innerHTML = `
                    <div class="word-text">${word.english} - ${word.chinese}</div>
                `;
                elements.wordList.appendChild(item);
            });
        }
        
        // 渲染错题本
        function renderWrongWordsList() {
            elements.wrongWordsList.innerHTML = '';
            
            if (gameState.wrongWords.length === 0) {
                elements.wrongWordsList.innerHTML = '<p style="padding: 20px; text-align: center; color: #5F0F40;">错题本为空</p>';
                return;
            }
            
            gameState.wrongWords.forEach(word => {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.innerHTML = `
                    <div class="word-text">${word.english} - ${word.chinese}</div>
                `;
                elements.wrongWordsList.appendChild(item);
            });
        }
        
        // 练习错题
        function practiceWrongWords() {
            if (gameState.wrongWords.length === 0) {
                alert('错题本为空，无法开始练习');
                return;
            }
            
            // 关闭错题本模态框
            elements.wrongWordsModal.style.display = 'none';
            
            // 设置练习模式
            gameState.isPracticeMode = true;
            
            // 使用错题本中的单词
            gameState.gameWords = gameState.wrongWords;
            gameState.currentLevel = 1;
            gameState.matchedPairs = 0;
            gameState.totalPairs = gameState.wrongWords.length;
            
            // 重置计时器
            clearInterval(gameState.levelTimer);
            gameState.currentLevelTime = 0;
            elements.currentTime.textContent = formatTime(0);
            gameState.accumulatedTime = 0;
            elements.totalTime.textContent = formatTime(0);
            
            // 创建泡泡
            elements.bubbleGrid.innerHTML = '';
            createBubbles(gameState.gameWords);
            
            // 更新关卡指示器
            updateLevelIndicator();
            
            // 启动计时器
            startTimers();
        }
        
        // 工具函数：打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // 初始化事件监听器
        function initEventListeners() {
            // 单词管理按钮事件
            document.getElementById('word-manager-btn').addEventListener('click', () => {
                elements.wordManager.style.display = elements.wordManager.style.display === 'none' ? 'block' : 'none';
            });
            
            // 错题本按钮事件
            document.getElementById('wrong-words-btn').addEventListener('click', () => {
                renderWrongWordsList();
                elements.wrongWordsModal.style.display = 'flex';
            });
            
            // 关闭按钮事件
            document.querySelectorAll('.close-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.closest('.modal').style.display = 'none';
                });
            });
            
            // 下一关按钮
            document.getElementById('next-level-btn').addEventListener('click', nextLevel);
            
            // 再玩一次按钮
            document.getElementById('play-again-btn').addEventListener('click', () => {
                elements.gameCompleteModal.style.display = 'none';
                initGame();
            });
            
            // 重置按钮
            document.getElementById('reset-btn').addEventListener('click', initGame);
            
            // 练习错题按钮
            document.getElementById('practice-wrong-btn').addEventListener('click', practiceWrongWords);
            
            // 发音开关按钮事件
            elements.soundToggleBtn.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                updateSoundButton();
            });
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            soundEnabled = true; // 默认开启发音
            updateSoundButton();
            
            initEventListeners();
            renderWordList();
            initGame();
        });
    </script>
</body>
</html>
