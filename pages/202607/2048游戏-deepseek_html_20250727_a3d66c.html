<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #faf8ef;
            color: #776e65;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 40px;
            margin: 0;
            color: #776e65;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .score-container {
            background: #bbada0;
            padding: 10px 15px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .score-title {
            font-size: 14px;
        }
        
        .score-value {
            font-size: 20px;
        }
        
        .game-container {
            background: #bbada0;
            border-radius: 6px;
            width: 450px;
            height: 450px;
            padding: 15px;
            margin: 0 auto;
            position: relative;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            height: 100%;
        }
        
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            color: #776e65;
        }
        
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            background: #eee4da;
            transition: all 0.1s ease-in-out;
        }
        
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: white; }
        .tile-16 { background: #f59563; color: white; }
        .tile-32 { background: #f67c5f; color: white; }
        .tile-64 { background: #f65e3b; color: white; }
        .tile-128 { background: #edcf72; color: white; font-size: 30px; }
        .tile-256 { background: #edcc61; color: white; font-size: 30px; }
        .tile-512 { background: #edc850; color: white; font-size: 30px; }
        .tile-1024 { background: #edc53f; color: white; font-size: 25px; }
        .tile-2048 { background: #edc22e; color: white; font-size: 25px; }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            z-index: 100;
            display: none;
        }
        
        .game-over-text {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        button {
            background: #8f7a66;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        button:hover {
            background: #9f8b77;
        }
        
        .instructions {
            margin-top: 30px;
            background: #bbada0;
            padding: 15px;
            border-radius: 6px;
            color: white;
        }
        
        .instructions h2 {
            margin-top: 0;
        }
        
        .key {
            background: #eee4da;
            color: #776e65;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-title">分数</div>
                <div class="score-value" id="score">0</div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="grid" id="grid">
                <!-- 游戏格子将通过JavaScript动态生成 -->
            </div>
            
            <div class="game-over" id="game-over">
                <div class="game-over-text">游戏结束!</div>
                <button id="restart-btn">再来一局</button>
            </div>
        </div>
        
        <button id="new-game-btn">新游戏</button>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>使用键盘方向键 <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> 移动方块</p>
            <p>当两个相同数字的方块相撞时，它们会合并成它们的和!</p>
            <p>每次移动后，会在空白处随机出现一个2或4的方块</p>
            <p>当获得2048的方块时获胜，当无法移动时游戏结束</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('grid');
            const scoreDisplay = document.getElementById('score');
            const gameOverDisplay = document.getElementById('game-over');
            const newGameBtn = document.getElementById('new-game-btn');
            const restartBtn = document.getElementById('restart-btn');
            
            let board = [];
            let score = 0;
            let gameOver = false;
            
            // 初始化游戏
            function initGame() {
                // 清空游戏板
                board = Array(4).fill().map(() => Array(4).fill(0));
                score = 0;
                gameOver = false;
                scoreDisplay.textContent = '0';
                gameOverDisplay.style.display = 'none';
                
                // 清空网格
                grid.innerHTML = '';
                
                // 创建16个单元格
                for (let i = 0; i < 16; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    grid.appendChild(cell);
                }
                
                // 添加两个初始方块
                addRandomTile();
                addRandomTile();
                
                updateBoard();
            }
            
            // 添加随机方块
            function addRandomTile() {
                if (isBoardFull()) return;
                
                let row, col;
                do {
                    row = Math.floor(Math.random() * 4);
                    col = Math.floor(Math.random() * 4);
                } while (board[row][col] !== 0);
                
                board[row][col] = Math.random() < 0.9 ? 2 : 4;
            }
            
            // 检查游戏板是否已满
            function isBoardFull() {
                return board.every(row => row.every(cell => cell !== 0));
            }
            
            // 更新游戏板显示
            function updateBoard() {
                const cells = document.querySelectorAll('.cell');
                
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        const index = i * 4 + j;
                        const cell = cells[index];
                        
                        // 清空单元格
                        cell.innerHTML = '';
                        
                        if (board[i][j] !== 0) {
                            const tile = document.createElement('div');
                            tile.className = `tile tile-${board[i][j]}`;
                            tile.textContent = board[i][j];
                            cell.appendChild(tile);
                        }
                    }
                }
            }
            
            // 移动方块
            function move(direction) {
                if (gameOver) return;
                
                let moved = false;
                const oldBoard = JSON.parse(JSON.stringify(board));
                
                // 根据方向处理移动
                switch (direction) {
                    case 'up':
                        for (let j = 0; j < 4; j++) {
                            for (let i = 1; i < 4; i++) {
                                if (board[i][j] !== 0) {
                                    let row = i;
                                    while (row > 0 && board[row - 1][j] === 0) {
                                        board[row - 1][j] = board[row][j];
                                        board[row][j] = 0;
                                        row--;
                                        moved = true;
                                    }
                                    
                                    if (row > 0 && board[row - 1][j] === board[row][j]) {
                                        board[row - 1][j] *= 2;
                                        score += board[row - 1][j];
                                        board[row][j] = 0;
                                        moved = true;
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'down':
                        for (let j = 0; j < 4; j++) {
                            for (let i = 2; i >= 0; i--) {
                                if (board[i][j] !== 0) {
                                    let row = i;
                                    while (row < 3 && board[row + 1][j] === 0) {
                                        board[row + 1][j] = board[row][j];
                                        board[row][j] = 0;
                                        row++;
                                        moved = true;
                                    }
                                    
                                    if (row < 3 && board[row + 1][j] === board[row][j]) {
                                        board[row + 1][j] *= 2;
                                        score += board[row + 1][j];
                                        board[row][j] = 0;
                                        moved = true;
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'left':
                        for (let i = 0; i < 4; i++) {
                            for (let j = 1; j < 4; j++) {
                                if (board[i][j] !== 0) {
                                    let col = j;
                                    while (col > 0 && board[i][col - 1] === 0) {
                                        board[i][col - 1] = board[i][col];
                                        board[i][col] = 0;
                                        col--;
                                        moved = true;
                                    }
                                    
                                    if (col > 0 && board[i][col - 1] === board[i][col]) {
                                        board[i][col - 1] *= 2;
                                        score += board[i][col - 1];
                                        board[i][col] = 0;
                                        moved = true;
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'right':
                        for (let i = 0; i < 4; i++) {
                            for (let j = 2; j >= 0; j--) {
                                if (board[i][j] !== 0) {
                                    let col = j;
                                    while (col < 3 && board[i][col + 1] === 0) {
                                        board[i][col + 1] = board[i][col];
                                        board[i][col] = 0;
                                        col++;
                                        moved = true;
                                    }
                                    
                                    if (col < 3 && board[i][col + 1] === board[i][col]) {
                                        board[i][col + 1] *= 2;
                                        score += board[i][col + 1];
                                        board[i][col] = 0;
                                        moved = true;
                                    }
                                }
                            }
                        }
                        break;
                }
                
                // 如果移动了，添加新方块并更新显示
                if (moved) {
                    addRandomTile();
                    updateBoard();
                    scoreDisplay.textContent = score;
                    
                    // 检查是否获胜
                    if (hasWon()) {
                        gameOver = true;
                        gameOverDisplay.style.display = 'flex';
                        gameOverDisplay.querySelector('.game-over-text').textContent = '你赢了!';
                    }
                    // 检查是否游戏结束
                    else if (isGameOver()) {
                        gameOver = true;
                        gameOverDisplay.style.display = 'flex';
                        gameOverDisplay.querySelector('.game-over-text').textContent = '游戏结束!';
                    }
                }
            }
            
            // 检查是否获胜(达到2048)
            function hasWon() {
                return board.some(row => row.some(cell => cell === 2048));
            }
            
            // 检查游戏是否结束
            function isGameOver() {
                // 检查是否有空格
                if (!isBoardFull()) return false;
                
                // 检查是否有可以合并的相邻方块
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (i < 3 && board[i][j] === board[i + 1][j]) return false;
                        if (j < 3 && board[i][j] === board[i][j + 1]) return false;
                    }
                }
                
                return true;
            }
            
            // 键盘事件监听
            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                        move('up');
                        break;
                    case 'ArrowDown':
                        move('down');
                        break;
                    case 'ArrowLeft':
                        move('left');
                        break;
                    case 'ArrowRight':
                        move('right');
                        break;
                }
            });
            
            // 新游戏按钮
            newGameBtn.addEventListener('click', initGame);
            restartBtn.addEventListener('click', initGame);
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
