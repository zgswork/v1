<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟计时器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .timer-shadow {
                box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
            }
            .tag-active {
                @apply bg-primary text-white;
            }
            .btn-hover {
                @apply transition-all duration-300 hover:scale-105 active:scale-95;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-dark">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-primary mb-2">番茄钟计时器</h1>
            <p class="text-gray-600 text-lg">专注工作，提高效率</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 计时器部分 -->
            <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-lg">
                <div class="mb-8">
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <div class="flex-1">
                            <label for="timerDuration" class="block text-sm font-medium text-gray-700 mb-1">番茄钟时长 (分钟)</label>
                            <input type="number" id="timerDuration" min="1" max="60" value="25" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition duration-200">
                        </div>
                        <div class="flex-1">
                            <label for="timerLabel" class="block text-sm font-medium text-gray-700 mb-1">标签</label>
                            <div class="flex">
                                <input type="text" id="timerLabel" placeholder="输入标签..." class="flex-1 px-4 py-3 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition duration-200">
                                <button id="addLabelBtn" class="bg-primary text-white px-4 rounded-r-lg hover:bg-primary/90 transition duration-200">
                                    <i class="fa fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 标签列表 -->
                    <div class="mb-6">
                        <p class="text-sm font-medium text-gray-700 mb-2">常用标签:</p>
                        <div id="tagList" class="flex flex-wrap gap-2">
                            <!-- 标签将通过JS动态添加 -->
                        </div>
                    </div>

                    <!-- 计时器显示 -->
                    <div class="timer-shadow bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-8 text-center mb-8">
                        <div id="timerDisplay" class="text-[clamp(2.5rem,8vw,5rem)] font-bold text-primary mb-2">25:00</div>
                        <div id="currentLabelDisplay" class="text-gray-500 italic">未开始</div>
                    </div>

                    <!-- 控制按钮 -->
                    <div class="flex justify-center gap-4 md:gap-6">
                        <button id="startBtn" class="btn-hover bg-secondary text-white px-6 py-3 rounded-full flex items-center gap-2 shadow-md hover:shadow-lg">
                            <i class="fa fa-play"></i> 开始
                        </button>
                        <button id="pauseBtn" class="btn-hover bg-accent text-white px-6 py-3 rounded-full flex items-center gap-2 shadow-md hover:shadow-lg hidden">
                            <i class="fa fa-pause"></i> 暂停
                        </button>
                        <button id="resetBtn" class="btn-hover bg-gray-500 text-white px-6 py-3 rounded-full flex items-center gap-2 shadow-md hover:shadow-lg">
                            <i class="fa fa-refresh"></i> 重置
                        </button>
                        <button id="completeBtn" class="btn-hover bg-primary text-white px-6 py-3 rounded-full flex items-center gap-2 shadow-md hover:shadow-lg hidden">
                            <i class="fa fa-check"></i> 完成
                        </button>
                    </div>
                </div>
            </div>

            <!-- 统计部分 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fa fa-bar-chart text-primary"></i> 统计数据</h2>

                <div class="mb-6">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-50 rounded-xl p-4 text-center">
                            <p class="text-gray-500 text-sm mb-1">总番茄钟数</p>
                            <p id="totalPomodoros" class="text-2xl font-bold text-primary">0</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 text-center">
                            <p class="text-gray-500 text-sm mb-1">总时长 (分钟)</p>
                            <p id="totalMinutes" class="text-2xl font-bold text-primary">0</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 text-center">
                            <p class="text-gray-500 text-sm mb-1">平均时长 (分钟)</p>
                            <p id="averageMinutes" class="text-2xl font-bold text-primary">0</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 text-center">
                            <p class="text-gray-500 text-sm mb-1">完成率</p>
                            <p id="completionRate" class="text-2xl font-bold text-primary">0%</p>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">标签统计</label>
                        <div id="labelStats" class="bg-gray-50 rounded-xl p-4 max-h-40 overflow-y-auto">
                            <p class="text-gray-500 text-center italic">暂无数据</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">时间范围</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <input type="date" id="startDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                            </div>
                            <div>
                                <input type="date" id="endDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                            </div>
                        </div>
                        <button id="filterStatsBtn" class="w-full mt-3 bg-primary/10 text-primary px-4 py-2 rounded-lg hover:bg-primary/20 transition duration-200">
                            筛选统计
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>番茄钟计时器 &copy; 2023 | 专注工作，提高效率</p>
            <p class="mt-2">加斌斌微信：1123024580，为你定制专属工具~</p>
        </footer>
    </div>

    <script>
        // 存储数据
        const AppData = {
            labels: [],
            pomodoros: [],
            currentTimer: null,
            timerRunning: false,
            timerMinutes: 25,
            timerSeconds: 0,
            currentLabel: '',
            filterStartDate: '',
            filterEndDate: ''
        };

        // DOM元素
        const elements = {
            timerDuration: document.getElementById('timerDuration'),
            timerLabel: document.getElementById('timerLabel'),
            addLabelBtn: document.getElementById('addLabelBtn'),
            tagList: document.getElementById('tagList'),
            timerDisplay: document.getElementById('timerDisplay'),
            currentLabelDisplay: document.getElementById('currentLabelDisplay'),
            startBtn: document.getElementById('startBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            resetBtn: document.getElementById('resetBtn'),
            completeBtn: document.getElementById('completeBtn'),
            totalPomodoros: document.getElementById('totalPomodoros'),
            totalMinutes: document.getElementById('totalMinutes'),
            averageMinutes: document.getElementById('averageMinutes'),
            completionRate: document.getElementById('completionRate'),
            labelStats: document.getElementById('labelStats'),
            startDate: document.getElementById('startDate'),
            endDate: document.getElementById('endDate'),
            filterStatsBtn: document.getElementById('filterStatsBtn')
        };

        // 初始化应用
        function initApp() {
            loadData();
            renderTags();
            updateTimerDisplay();
            updateStats();
            initEventListeners();
            setDefaultDateRange();
        }

        // 从localStorage加载数据
        function loadData() {
            const savedLabels = localStorage.getItem('pomodoroLabels');
            const savedPomodoros = localStorage.getItem('pomodoroHistory');

            if (savedLabels) {
                AppData.labels = JSON.parse(savedLabels);
            }

            if (savedPomodoros) {
                AppData.pomodoros = JSON.parse(savedPomodoros);
            }
        }

        // 保存数据到localStorage
        function saveData() {
            localStorage.setItem('pomodoroLabels', JSON.stringify(AppData.labels));
            localStorage.setItem('pomodoroHistory', JSON.stringify(AppData.pomodoros));
        }

        // 渲染标签列表
        function renderTags() {
            elements.tagList.innerHTML = '';

            if (AppData.labels.length === 0) {
                elements.tagList.innerHTML = '<p class="text-gray-500 italic">暂无标签，添加你的第一个标签吧！</p>';
                return;
            }

            AppData.labels.forEach(label => {
                const tagBtn = document.createElement('button');
                tagBtn.className = `px-3 py-1 rounded-full text-sm transition duration-200 ${AppData.currentLabel === label ? 'tag-active' : 'bg-gray-200 hover:bg-gray-300 text-gray-800'}`;
                tagBtn.textContent = label;
                tagBtn.addEventListener('click', () => selectLabel(label));
                elements.tagList.appendChild(tagBtn);
            });
        }

        // 选择标签
        function selectLabel(label) {
            AppData.currentLabel = label;
            elements.timerLabel.value = label;
            elements.currentLabelDisplay.textContent = label ? `当前标签: ${label}` : '未开始';
            renderTags();
        }

        // 添加标签
        function addLabel() {
            const label = elements.timerLabel.value.trim();
            if (label && !AppData.labels.includes(label)) {
                AppData.labels.push(label);
                saveData();
                renderTags();
                selectLabel(label);
            }
            elements.timerLabel.value = '';
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = AppData.timerMinutes.toString().padStart(2, '0');
            const seconds = AppData.timerSeconds.toString().padStart(2, '0');
            elements.timerDisplay.textContent = `${minutes}:${seconds}`;
        }

        // 开始计时器
        function startTimer() {
            if (AppData.timerRunning) return;

            // 更新标签
            const label = elements.timerLabel.value.trim();
            if (label) {
                if (!AppData.labels.includes(label)) {
                    AppData.labels.push(label);
                    saveData();
                    renderTags();
                }
                AppData.currentLabel = label;
                elements.currentLabelDisplay.textContent = `当前标签: ${label}`;
            } else if (!AppData.currentLabel) {
                AppData.currentLabel = '未分类';
                elements.currentLabelDisplay.textContent = '当前标签: 未分类';
            }

            // 更新时长
            const duration = parseInt(elements.timerDuration.value);
            if (duration && duration !== AppData.timerMinutes && !AppData.timerRunning) {
                AppData.timerMinutes = duration;
                AppData.timerSeconds = 0;
                updateTimerDisplay();
            }

            AppData.timerRunning = true;
            elements.startBtn.classList.add('hidden');
            elements.pauseBtn.classList.remove('hidden');
            elements.completeBtn.classList.remove('hidden');

            AppData.currentTimer = setInterval(() => {
                if (AppData.timerSeconds === 0) {
                    if (AppData.timerMinutes === 0) {
                        completeTimer(true);
                        return;
                    }
                    AppData.timerMinutes--;
                    AppData.timerSeconds = 59;
                } else {
                    AppData.timerSeconds--;
                }
                updateTimerDisplay();
            }, 1000);
        }

        // 暂停计时器
        function pauseTimer() {
            if (!AppData.timerRunning) return;

            clearInterval(AppData.currentTimer);
            AppData.timerRunning = false;
            elements.startBtn.classList.remove('hidden');
            elements.pauseBtn.classList.add('hidden');
            elements.startBtn.innerHTML = '<i class="fa fa-play"></i> 继续';
        }

        // 重置计时器
        function resetTimer() {
            clearInterval(AppData.currentTimer);
            AppData.timerRunning = false;
            AppData.timerMinutes = parseInt(elements.timerDuration.value) || 25;
            AppData.timerSeconds = 0;
            elements.startBtn.classList.remove('hidden');
            elements.pauseBtn.classList.add('hidden');
            elements.completeBtn.classList.add('hidden');
            elements.startBtn.innerHTML = '<i class="fa fa-play"></i> 开始';
            updateTimerDisplay();
        }

        // 完成计时器
        function completeTimer(autoComplete = false) {
            clearInterval(AppData.currentTimer);

            // 记录完成的番茄钟
            const pomodoro = {
                label: AppData.currentLabel || '未分类',
                duration: parseInt(elements.timerDuration.value) || 25,
                completed: true,
                date: new Date().toISOString()
            };

            AppData.pomodoros.push(pomodoro);
            saveData();

            // 重置计时器
            resetTimer();
            elements.currentLabelDisplay.textContent = '未开始';
            AppData.currentLabel = '';
            renderTags();
            updateStats();

            // 显示完成提示
            alert(autoComplete ? '番茄钟时间到！恭喜完成一个番茄钟！' : '恭喜完成一个番茄钟！');
        }

        // 更新统计数据
        function updateStats() {
            // 获取筛选后的番茄钟数据
            let filteredPomodoros = [...AppData.pomodoros];

            // 应用日期筛选
            if (AppData.filterStartDate && AppData.filterEndDate) {
                const startDate = new Date(AppData.filterStartDate);
                const endDate = new Date(AppData.filterEndDate);
                endDate.setHours(23, 59, 59, 999);

                filteredPomodoros = filteredPomodoros.filter(p => {
                    const pomoDate = new Date(p.date);
                    return pomoDate >= startDate && pomoDate <= endDate;
                });
            }

            // 基本统计
            const totalPomodoros = filteredPomodoros.length;
            const totalMinutes = filteredPomodoros.reduce((sum, p) => sum + p.duration, 0);
            const averageMinutes = totalPomodoros > 0 ? (totalMinutes / totalPomodoros).toFixed(1) : '0';
            const completedPomodoros = filteredPomodoros.filter(p => p.completed).length;
            const completionRate = totalPomodoros > 0 ? Math.round((completedPomodoros / totalPomodoros) * 100) : 0;

            // 更新统计显示
            elements.totalPomodoros.textContent = totalPomodoros;
            elements.totalMinutes.textContent = totalMinutes;
            elements.averageMinutes.textContent = averageMinutes;
            elements.completionRate.textContent = `${completionRate}%`;

            // 标签统计
            const labelCounts = {};
            filteredPomodoros.forEach(p => {
                labelCounts[p.label] = (labelCounts[p.label] || 0) + 1;
            });

            // 渲染标签统计
            if (Object.keys(labelCounts).length === 0) {
                elements.labelStats.innerHTML = '<p class="text-gray-500 text-center italic">暂无数据</p>';
                return;
            }

            elements.labelStats.innerHTML = '';
            const sortedLabels = Object.keys(labelCounts).sort((a, b) => labelCounts[b] - labelCounts[a]);

            sortedLabels.forEach(label => {
                const labelStatEl = document.createElement('div');
                labelStatEl.className = 'flex justify-between items-center py-1 border-b border-gray-200 last:border-0';
                labelStatEl.innerHTML = `
                    <span class="font-medium">${label}</span>
                    <span class="bg-primary/10 text-primary px-2 py-0.5 rounded-full text-xs">${labelCounts[label]} 次</span>
                `;
                elements.labelStats.appendChild(labelStatEl);
            });
        }

        // 设置默认日期范围
        function setDefaultDateRange() {
            const today = new Date();
            const startDate = new Date();
            startDate.setDate(today.getDate() - 7); // 默认显示过去7天

            elements.startDate.value = startDate.toISOString().split('T')[0];
            elements.endDate.value = today.toISOString().split('T')[0];

            AppData.filterStartDate = elements.startDate.value;
            AppData.filterEndDate = elements.endDate.value;
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 时长输入变化
            elements.timerDuration.addEventListener('change', () => {
                if (!AppData.timerRunning) {
                    AppData.timerMinutes = parseInt(elements.timerDuration.value) || 25;
                    AppData.timerSeconds = 0;
                    updateTimerDisplay();
                }
            });

            // 添加标签按钮
            elements.addLabelBtn.addEventListener('click', addLabel);

            // 回车添加标签
            elements.timerLabel.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addLabel();
            });

            // 控制按钮
            elements.startBtn.addEventListener('click', startTimer);
            elements.pauseBtn.addEventListener('click', pauseTimer);
            elements.resetBtn.addEventListener('click', resetTimer);
            elements.completeBtn.addEventListener('click', () => completeTimer(false));

            // 筛选统计
            elements.filterStatsBtn.addEventListener('click', () => {
                AppData.filterStartDate = elements.startDate.value;
                AppData.filterEndDate = elements.endDate.value;
                updateStats();
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
