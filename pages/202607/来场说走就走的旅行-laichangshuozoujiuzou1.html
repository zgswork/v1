        // 获取DOM元素
        const randomBtn = document.getElementById('randomBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultDiv = document.getElementById('result');
        const attractionName = document.getElementById('attractionName');
        const attractionDesc = document.getElementById('attractionDesc');
        const attractionAddress = document.getElementById('attractionAddress');
        const attractionTransport = document.getElementById('attractionTransport');
        const attractionTicket = document.getElementById('attractionTicket');
        const attractionTime = document.getElementById('attractionTime');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('myModal');
        const span = document.getElementsByClassName('close')[0];
        
        // 当前显示的景点
        let currentAttraction = null;

        // 随机获取一个景点
        function getRandomAttraction() {
            const randomIndex = Math.floor(Math.random() * attractions.length);
            return attractions[randomIndex];
        }

        // 显示景点信息
        function displayAttraction(attraction) {
            currentAttraction = attraction;
            attractionName.textContent = attraction.name;
            attractionDesc.textContent = attraction.desc;
            attractionAddress.textContent = attraction.address;
            attractionTransport.textContent = attraction.transport;
            attractionTicket.textContent = attraction.ticket;
            attractionTime.textContent = attraction.time;
            
            resultDiv.style.display = 'block';
            changeBtn.disabled = false;
        }

        // 随机景点按钮点击事件
        randomBtn.addEventListener('click', function() {
            const attraction = getRandomAttraction();
            displayAttraction(attraction);
        });

        // 换一个景点按钮点击事件
        changeBtn.addEventListener('click', function() {
            let newAttraction;
            do {
                newAttraction = getRandomAttraction();
            } while (newAttraction.name === currentAttraction.name && attractions.length > 1);
            
            displayAttraction(newAttraction);
        });

        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭按钮点击事件
        span.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
