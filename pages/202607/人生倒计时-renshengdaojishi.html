<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #4CAF50;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }
        
        h1 {
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #2E7D32;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #1B5E20;
        }
        
        .result {
            margin-top: 30px;
            font-size: 1.5rem;
            line-height: 1.6;
        }
        
        .footer {
            margin-top: 40px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        
        .footer-btn {
            margin: 10px;
            padding: 10px 15px;
            background-color: #388E3C;
            border-radius: 5px;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .result {
                font-size: 1.2rem;
            }
            
            .footer {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>人生倒计时</h1>
        
        <div class="input-section">
            <label for="birthdate">请输入您的出生日期：</label>
            <input type="date" id="birthdate" required>
            
            <label for="life-expectancy">预计寿命（岁）：</label>
            <input type="number" id="life-expectancy" value="80" min="1" max="120">
            
            <button onclick="calculateLife()">计算人生剩余时间</button>
        </div>
        
        <div class="result" id="result">
            请填写您的出生日期和预期寿命，然后点击计算按钮。
        </div>
        
        <div class="footer">
            <div class="footer-btn" onclick="showDeveloper()">开发者：兔子先生</div>
            <div class="footer-btn" onclick="showTechSupport()">技术支持：AI编程星球</div>
        </div>
    </div>
    
    <script>
        function calculateLife() {
            const birthdate = new Date(document.getElementById('birthdate').value);
            const lifeExpectancy = parseInt(document.getElementById('life-expectancy').value);
            
            if (isNaN(birthdate.getTime())) {
                alert('请输入有效的出生日期');
                return;
            }
            
            if (isNaN(lifeExpectancy) || lifeExpectancy <= 0) {
                alert('请输入有效的预期寿命');
                return;
            }
            
            const now = new Date();
            const deathDate = new Date(birthdate);
            deathDate.setFullYear(birthdate.getFullYear() + lifeExpectancy);
            
            const totalLifeMs = deathDate - birthdate;
            const livedMs = now - birthdate;
            const remainingMs = deathDate - now;
            
            if (remainingMs <= 0) {
                document.getElementById('result').innerHTML = `
                    <p>根据您的输入，您已经超过了预期寿命。</p>
                    <p>请珍惜每一天！</p>
                `;
                return;
            }
            
            const livedPercent = (livedMs / totalLifeMs * 100).toFixed(2);
            const remainingPercent = (remainingMs / totalLifeMs * 100).toFixed(2);
            
            const remainingYears = Math.floor(remainingMs / (1000 * 60 * 60 * 24 * 365));
            const remainingMonths = Math.floor((remainingMs % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
            const remainingDays = Math.floor((remainingMs % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24));
            
            document.getElementById('result').innerHTML = `
                <p>您已经度过了人生的 ${livedPercent}%</p>
                <p>剩余时间约占人生的 ${remainingPercent}%</p>
                <p>预计剩余时间：${remainingYears} 年 ${remainingMonths} 个月 ${remainingDays.toFixed(0)} 天</p>
                <p>请珍惜时光，活出精彩人生！</p>
            `;
        }
        
        function showDeveloper() {
            alert('合作联系vx：l932371716');
        }
        
        function showTechSupport() {
            window.open('https://t.zsxq.com/y1934', '_blank');
        }
    </script>
</body>
</html>
