<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟 | Pomodoro Timer</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --secondary-color: #2c3e50;
            --light-color: #ecf0f1;
            --dark-color: #34495e;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--light-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-weight: 300;
        }
        
        .timer-display {
            font-size: 5rem;
            font-weight: 200;
            margin: 1.5rem 0;
            color: var(--dark-color);
            font-family: 'Courier New', monospace;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        
        button:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background-color: var(--secondary-color);
        }
        
        button.secondary:hover {
            background-color: #1a252f;
        }
        
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: transparent;
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
            padding: 0.5rem 1rem;
        }
        
        .language-switch:hover {
            background-color: var(--secondary-color);
            color: white;
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .mode-btn {
            background-color: transparent;
            color: var(--dark-color);
            border: 1px solid var(--dark-color);
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 50px;
        }
        
        .mode-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .task-input {
            margin-bottom: 1.5rem;
        }
        
        input {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 50px;
            width: 70%;
            font-size: 1rem;
            text-align: center;
        }
        
        .task-list {
            text-align: left;
            margin-top: 1.5rem;
        }
        
        .task-item {
            padding: 0.8rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        
        .completed {
            text-decoration: line-through;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <button id="language-switch" class="language-switch">EN/中文</button>
    
    <div class="container">
        <h1 id="app-title">番茄工作时钟</h1>
        
        <div class="mode-selector">
            <button id="pomodoro-btn" class="mode-btn active">25:00</button>
            <button id="short-break-btn" class="mode-btn">05:00</button>
            <button id="long-break-btn" class="mode-btn">15:00</button>
        </div>
        
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="controls">
            <button id="start-btn">开始</button>
            <button id="reset-btn" class="secondary">重置</button>
        </div>
        
        <div class="task-input">
            <input type="text" id="task-input" placeholder="输入任务内容">
            <button id="add-task-btn">添加任务</button>
        </div>
        
        <div class="task-list">
            <h3 id="task-list-title">任务列表</h3>
            <ul id="tasks"></ul>
        </div>
    </div>

    <script>
        // 语言切换
        const languageSwitch = document.getElementById('language-switch');
        let currentLanguage = 'zh';
        
        // 翻译内容
        const translations = {
            'zh': {
                'appTitle': '番茄工作时钟',
                'start': '开始',
                'pause': '暂停',
                'reset': '重置',
                'taskPlaceholder': '输入任务内容',
                'addTask': '添加任务',
                'taskList': '任务列表',
                'pomodoro': '工作',
                'shortBreak': '短休息',
                'longBreak': '长休息'
            },
            'en': {
                'appTitle': 'Pomodoro Timer',
                'start': 'Start',
                'pause': 'Pause',
                'reset': 'Reset',
                'taskPlaceholder': 'Enter task description',
                'addTask': 'Add Task',
                'taskList': 'Task List',
                'pomodoro': 'Pomodoro',
                'shortBreak': 'Short Break',
                'longBreak': 'Long Break'
            }
        };
        
        // 切换语言
        function switchLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            updateTexts();
        }
        
        // 更新界面文本
        function updateTexts() {
            document.getElementById('app-title').textContent = translations[currentLanguage]['appTitle'];
            document.getElementById('start-btn').textContent = isPaused ? translations[currentLanguage]['start'] : translations[currentLanguage]['pause'];
            document.getElementById('reset-btn').textContent = translations[currentLanguage]['reset'];
            document.getElementById('task-input').placeholder = translations[currentLanguage]['taskPlaceholder'];
            document.getElementById('add-task-btn').textContent = translations[currentLanguage]['addTask'];
            document.getElementById('task-list-title').textContent = translations[currentLanguage]['taskList'];
            document.getElementById('pomodoro-btn').textContent = currentLanguage === 'zh' ? '25:00' : translations[currentLanguage]['pomodoro'];
            document.getElementById('short-break-btn').textContent = currentLanguage === 'zh' ? '05:00' : translations[currentLanguage]['shortBreak'];
            document.getElementById('long-break-btn').textContent = currentLanguage === 'zh' ? '15:00' : translations[currentLanguage]['longBreak'];
        }
        
        languageSwitch.addEventListener('click', switchLanguage);
        
        // 番茄时钟逻辑
        let timer;
        let isPaused = true;
        let timeLeft = 25 * 60; // 25分钟
        let currentMode = 'pomodoro'; // pomodoro, shortBreak, longBreak
        
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const pomodoroBtn = document.getElementById('pomodoro-btn');
        const shortBreakBtn = document.getElementById('short-break-btn');
        const longBreakBtn = document.getElementById('long-break-btn');
        
        // 初始化
        updateTimerDisplay();
        
        // 开始/暂停按钮
        startBtn.addEventListener('click', () => {
            if (isPaused) {
                startTimer();
            } else {
                pauseTimer();
            }
        });
        
        // 重置按钮
        resetBtn.addEventListener('click', resetTimer);
        
        // 模式选择
        pomodoroBtn.addEventListener('click', () => switchMode('pomodoro'));
        shortBreakBtn.addEventListener('click', () => switchMode('shortBreak'));
        longBreakBtn.addEventListener('click', () => switchMode('longBreak'));
        
        // 开始计时器
        function startTimer() {
            isPaused = false;
            startBtn.textContent = translations[currentLanguage]['pause'];
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    playAlarm();
                    // 自动切换到下一个模式
                    if (currentMode === 'pomodoro') {
                        // 完成一个番茄后，检查是否应该长休息
                        const completedPomodoros = document.querySelectorAll('.task-item.completed').length;
                        if (completedPomodoros > 0 && completedPomodoros % 4 === 0) {
                            switchMode('longBreak');
                        } else {
                            switchMode('shortBreak');
                        }
                    } else {
                        switchMode('pomodoro');
                    }
                    startTimer(); // 自动开始下一个阶段
                }
            }, 1000);
        }
        
        // 暂停计时器
        function pauseTimer() {
            isPaused = true;
            startBtn.textContent = translations[currentLanguage]['start'];
            clearInterval(timer);
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            switchMode(currentMode); // 重新加载当前模式的时间
        }
        
        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            pomodoroBtn.classList.remove('active');
            shortBreakBtn.classList.remove('active');
            longBreakBtn.classList.remove('active');
            
            switch (mode) {
                case 'pomodoro':
                    timeLeft = 25 * 60;
                    pomodoroBtn.classList.add('active');
                    break;
                case 'shortBreak':
                    timeLeft = 5 * 60;
                    shortBreakBtn.classList.add('active');
                    break;
                case 'longBreak':
                    timeLeft = 15 * 60;
                    longBreakBtn.classList.add('active');
                    break;
            }
            
            updateTimerDisplay();
            updateTexts();
        }
        
        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 播放提示音
        function playAlarm() {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3');
            audio.play();
        }
        
        // 任务管理
        const taskInput = document.getElementById('task-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const tasksList = document.getElementById('tasks');
        
        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });
        
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText) {
                const taskItem = document.createElement('li');
                taskItem.className = 'task-item';
                
                const taskTextSpan = document.createElement('span');
                taskTextSpan.textContent = taskText;
                
                const taskDeleteBtn = document.createElement('button');
                taskDeleteBtn.textContent = '×';
                taskDeleteBtn.style.background = 'none';
                taskDeleteBtn.style.color = 'var(--primary-color)';
                taskDeleteBtn.style.border = 'none';
                taskDeleteBtn.style.fontSize = '1.5rem';
                taskDeleteBtn.style.cursor = 'pointer';
                taskDeleteBtn.style.padding = '0';
                taskDeleteBtn.style.marginLeft = '1rem';
                
                taskDeleteBtn.addEventListener('click', () => {
                    taskItem.remove();
                });
                
                taskItem.addEventListener('click', () => {
                    taskItem.classList.toggle('completed');
                });
                
                taskItem.appendChild(taskTextSpan);
                taskItem.appendChild(taskDeleteBtn);
                tasksList.appendChild(taskItem);
                
                taskInput.value = '';
            }
        }
    </script>
</body>
</html>
