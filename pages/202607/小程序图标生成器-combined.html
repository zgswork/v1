<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序图标生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .icon-preview {
                @apply w-12 h-12 flex items-center justify-center rounded-lg shadow-md transition-all duration-300 hover:scale-110 cursor-pointer;
            }
            .color-option {
                @apply w-10 h-10 rounded-full cursor-pointer transition-all duration-300 hover:scale-110 border-2 border-transparent;
            }
            .color-option.selected {
                @apply border-white ring-2 ring-gray-400;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">小程序图标生成器</h1>
            <button id="downloadAll" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition-all duration-300 flex items-center gap-2">
                <i class="fa fa-download"></i> 下载所有图标
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-6">
        <section class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">选择图标风格</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="flex flex-col items-center">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">选择主色调</h3>
                    <div class="flex flex-wrap gap-3 justify-center" id="colorOptions">
                        <div class="color-option selected" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                        <div class="color-option" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                        <div class="color-option" data-color="#FFD166" style="background-color: #FFD166;"></div>
                        <div class="color-option" data-color="#06D6A0" style="background-color: #06D6A0;"></div>
                        <div class="color-option" data-color="#118AB2" style="background-color: #118AB2;"></div>
                        <div class="color-option" data-color="#073B4C" style="background-color: #073B4C;"></div>
                        <div class="color-option" data-color="#EF476F" style="background-color: #EF476F;"></div>
                        <div class="color-option" data-color="#FF9F1C" style="background-color: #FF9F1C;"></div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">选择图标形状</h3>
                    <div class="flex gap-3">
                        <button class="shape-option px-3 py-1 rounded-lg bg-primary text-white text-sm" data-shape="rounded">圆角方形</button>
                        <button class="shape-option px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm" data-shape="circle">圆形</button>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">选择图标大小</h3>
                    <div class="flex gap-3">
                        <button class="size-option px-3 py-1 rounded-lg bg-primary text-white text-sm" data-size="40">40x40px</button>
                        <button class="size-option px-3 py-1 rounded-lg bg-gray-200 text-gray-700 text-sm" data-size="60">60x60px</button>
                        <button class="size-option px-3 py-1 rounded-lg bg-gray-200 text-gray-700 text-sm" data-size="80">80x80px</button>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">生成数量</h3>
                    <div class="flex items-center gap-2">
                        <input type="range" id="iconCount" min="15" max="30" value="15" class="w-32"/>
                        <span id="countValue" class="text-sm font-medium text-gray-700">15</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">图标预览</h2>
            <div id="iconGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">
                <!-- 图标将通过JavaScript动态生成 -->
            </div>
        </section>
    </main>

    <footer class="bg-white shadow-inner py-4 px-6 mt-8">
        <div class="max-w-6xl mx-auto text-center text-gray-600 text-sm">
            <p>小程序图标生成器 &copy; 2023</p>
        </div>
    </footer>

            // 加载SVG图标到Canvas的函数
            function loadSvgToCanvas(svgPath, color, size, canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size, size);

                // 绘制背景
                ctx.fillStyle = color;
                ctx.beginPath();
                if (currentShape === 'circle') {
                    ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
                } else {
                    // 圆角矩形
                    const radius = 8;
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(size - radius, 0);
                    ctx.arcTo(size, 0, size, radius, radius);
                    ctx.lineTo(size, size - radius);
                    ctx.arcTo(size, size, size - radius, size, radius);
                    ctx.lineTo(radius, size);
                    ctx.arcTo(0, size, 0, size - radius, radius);
                    ctx.lineTo(0, radius);
                    ctx.arcTo(0, 0, radius, 0, radius);
                }
                ctx.fill();

                // 绘制图标
                ctx.fillStyle = 'white';
                ctx.beginPath();
                
                // 创建路径对象
                const path = new Path2D(svgPath);
                
                // 计算缩放比例 - 使图标适合画布并留出一些边距
                const scale = size * 0.7 / 24; // 70% 的画布大小，假设原始图标是24x24
                
                // 先平移到中心，再缩放
                ctx.translate(size/2, size/2); // 平移到画布中心
                ctx.scale(scale, scale);
                ctx.translate(-12, -12); // 将图标中心点移到原点
                
                ctx.fill(path);
            }

            // 状态变量
            let currentColor = '#FF6B6B';
            let currentShape = 'rounded';
            let currentSize = 40;
            let currentCount = 15;
            let generatedIcons = [];

            // DOM元素
            const colorOptions = document.getElementById('colorOptions');
            const shapeOptions = document.querySelectorAll('.shape-option');
            const sizeOptions = document.querySelectorAll('.size-option');
            const iconCount = document.getElementById('iconCount');
            const countValue = document.getElementById('countValue');
            const iconGrid = document.getElementById('iconGrid');
            const downloadAll = document.getElementById('downloadAll');

            // 事件监听器
            colorOptions.addEventListener('click', function(e) {
                if (e.target.classList.contains('color-option')) {
                    document.querySelectorAll('.color-option').forEach(option => {
                        option.classList.remove('selected');
                    });
                    e.target.classList.add('selected');
                    currentColor = e.target.dataset.color;
                    generateIcons();
                }
            });

            shapeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    shapeOptions.forEach(opt => {
                        opt.classList.remove('bg-primary', 'text-white');
                        opt.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    this.classList.remove('bg-gray-200', 'text-gray-700');
                    this.classList.add('bg-primary', 'text-white');
                    currentShape = this.dataset.shape;
                    generateIcons();
                });
            });

            sizeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    sizeOptions.forEach(opt => {
                        opt.classList.remove('bg-primary', 'text-white');
                        opt.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    this.classList.remove('bg-gray-200', 'text-gray-700');
                    this.classList.add('bg-primary', 'text-white');
                    currentSize = parseInt(this.dataset.size);
                    generateIcons();
                });
            });

            iconCount.addEventListener('input', function() {
                currentCount = parseInt(this.value);
                countValue.textContent = currentCount;
                generateIcons();
            });

            downloadAll.addEventListener('click', function() {
                if (generatedIcons.length === 0) {
                    alert('请先生成图标');
                    return;
                }

                // 创建一个ZIP文件下载（这里简化处理，实际项目中可以使用JSZip库）
                alert('正在准备下载所有图标...\n\n由于浏览器安全限制，此演示仅支持单个图标下载。\n完整版本可使用JSZip库实现批量下载。');
            });

            // 生成图标
            function generateIcons() {
                iconGrid.innerHTML = '';
                generatedIcons = [];

                // 随机选择指定数量的图标
                const shuffledIcons = [...iconConfig].sort(() => 0.5 - Math.random());
                const selectedIcons = shuffledIcons.slice(0, currentCount);

                selectedIcons.forEach(icon => {
                    // 创建图标容器
                    const iconContainer = document.createElement('div');
                    iconContainer.className = 'flex flex-col items-center gap-2 p-2';

                    // 创建图标预览
                    const iconPreview = document.createElement('div');
                    iconPreview.className = `icon-preview text-white`;
                    iconPreview.style.backgroundColor = currentColor;
                    if (currentShape === 'circle') {
                        iconPreview.style.borderRadius = '50%';
                    }
                    iconPreview.style.width = `${currentSize}px`;
                    iconPreview.style.height = `${currentSize}px`;

                    // 创建Canvas用于预览
                    const previewCanvas = document.createElement('canvas');
                    previewCanvas.width = currentSize;
                    previewCanvas.height = currentSize;
                    previewCanvas.className = 'w-full h-full';
                    loadSvgToCanvas(icon.svgPath, currentColor, currentSize, previewCanvas);
                    iconPreview.appendChild(previewCanvas);

                    // 创建图标名称
                    const iconName = document.createElement('span');
                    iconName.className = 'text-sm font-medium text-gray-700';
                    iconName.textContent = icon.name;

                    // 添加到容器
                    iconContainer.appendChild(iconPreview);
                    iconContainer.appendChild(iconName);
                    iconGrid.appendChild(iconContainer);

                    // 绑定下载事件
                    iconPreview.addEventListener('click', function() {
                        downloadIcon(icon, currentColor, currentShape, currentSize);
                    });

                    // 保存生成的图标信息
                    generatedIcons.push({
                        name: icon.name,
                        icon: icon.icon,
                        color: currentColor,
                        shape: currentShape,
                        size: currentSize
                    });
                });
            }

            // 下载图标
            function downloadIcon(icon, color, shape, size) {
                // 创建Canvas
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;

                // 加载SVG图标到Canvas
                loadSvgToCanvas(icon.svgPath, color, size, canvas);

                // 转换为JPG并下载
                canvas.toBlob(function(blob) {
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${icon.name}.jpg`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    } else {
                        alert('图标生成失败，请重试。');
                    }
                }, 'image/jpeg', 0.9);
            }

            // 初始化生成图标
            generateIcons();
        });
    </script>
</body>
</html>
