<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量级文本格式化工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --dark: #1d3557;
            --light: #f8f9fa;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --text: #333;
            --text-light: #6c757d;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 优化后的标题区域 */
        header {
            text-align: center;
            padding: 40px 0 30px;
            margin-bottom: 30px;
            position: relative;
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.25);
            position: relative;
        }
        
        .logo:after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid rgba(67, 97, 238, 0.15);
            border-radius: 50%;
            z-index: -1;
        }
        
        .logo i {
            font-size: 2.8rem;
            color: white;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        
        h1:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--success));
            border-radius: 2px;
        }
        
        .subtitle {
            font-size: 1.15rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 25px auto 0;
            line-height: 1.7;
            position: relative;
        }
        
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(67, 97, 238, 0.05);
        }
        
        .circle-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            left: 10%;
        }
        
        .circle-2 {
            width: 150px;
            height: 150px;
            bottom: -50px;
            right: 15%;
        }
        
        /* 以下部分保持不变 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }
        
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .panel-header {
            background: var(--primary);
            color: white;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-content {
            padding: 20px;
            height: 300px;
        }
        
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 1rem;
            line-height: 1.7;
            background: transparent;
            color: var(--text);
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        
        .input-panel textarea {
            color: var(--text);
        }
        
        .output-panel textarea {
            color: var(--dark);
        }
        
        .options-panel {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: #f8f9ff;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        
        .option-item:hover {
            background: #edf2ff;
            border-color: var(--primary-light);
        }
        
        .option-item.active {
            background: #e6eeff;
            border-color: var(--primary);
        }
        
        .option-icon {
            width: 40px;
            height: 40px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.1rem;
        }
        
        .option-text h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .option-text p {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: #f5f8ff;
            border-color: var(--primary-light);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        .character-count {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .platform-presets {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .presets-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .preset-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #f0f4ff;
            border: 1px solid #d0d8f0;
            color: var(--primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .preset-btn:hover {
            background: #e0e8ff;
            border-color: var(--primary-light);
        }
        
        .preset-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="decoration">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
            </div>
            
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-text-height"></i>
                </div>
                <h1>文本格式化工具</h1>
                <p class="subtitle">快速优化文本格式，添加段落间距，清理多余空格，让您的文本在各种平台上完美呈现</p>
            </div>
        </header>
        
        <div class="main-content">
            <div class="panel input-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-keyboard"></i>
                        <span>原始文本</span>
                    </div>
                    <div>
                        <i class="fas fa-lightbulb"></i>
                    </div>
                </div>
                <div class="panel-content">
                    <textarea id="inputText" placeholder="在此粘贴需要格式化的文本...">这是一个段落示例文本。它没有空行分隔，所有内容都连在一起。

这是第二个段落。但中间有多个空行。

这是第三个段落。行尾有额外空格      。
中英文混排示例:这是English text需要优化。
HTML标签示例: <p>保留标签</p> 同时清理文本。

格式化工具将解决这些问题。</textarea>
                </div>
            </div>
            
            <div class="panel output-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <i class="fas fa-code"></i>
                        <span>格式化结果</span>
                    </div>
                    <div>
                        <i class="fas fa-clipboard"></i>
                    </div>
                </div>
                <div class="panel-content">
                    <textarea id="outputText" readonly></textarea>
                </div>
                <div class="character-count">
                    <span id="charCount">0</span> 字符
                </div>
            </div>
        </div>
        
        <div class="options-panel">
            <h2><i class="fas fa-sliders-h"></i> 格式化选项</h2>
            <div class="options-grid">
                <div class="option-item active" id="addEmptyLinesOption">
                    <div class="option-icon">
                        <i class="fas fa-paragraph"></i>
                    </div>
                    <div class="option-text">
                        <h3>段落间添加空行</h3>
                        <p>在段落之间添加清晰的分隔</p>
                    </div>
                </div>
                
                <div class="option-item active" id="trimSpacesOption">
                    <div class="option-icon">
                        <i class="fas fa-cut"></i>
                    </div>
                    <div class="option-text">
                        <h3>删除行首尾空格</h3>
                        <p>清理每行开头和结尾的空格</p>
                    </div>
                </div>
                
                <div class="option-item" id="autoSpaceOption">
                    <div class="option-icon">
                        <i class="fas fa-language"></i>
                    </div>
                    <div class="option-text">
                        <h3>中英文间加空格</h3>
                        <p>优化中英文混排的阅读体验</p>
                    </div>
                </div>
                
                <div class="option-item" id="mergeBlankLinesOption">
                    <div class="option-icon">
                        <i class="fas fa-compress-arrows-alt"></i>
                    </div>
                    <div class="option-text">
                        <h3>合并多余空行</h3>
                        <p>将多个连续空行合并为一个</p>
                    </div>
                </div>
            </div>
            
            <div class="platform-presets">
                <div class="presets-title">
                    <i class="fas fa-palette"></i>
                    <span>平台预设</span>
                </div>
                <div class="preset-buttons">
                    <button class="preset-btn active" data-preset="universal">通用格式</button>
                    <button class="preset-btn" data-preset="markdown">Markdown</button>
                    <button class="preset-btn" data-preset="html">HTML内容</button>
                    <button class="preset-btn" data-preset="social">社交媒体</button>
                </div>
            </div>
            
            <div class="actions">
                <button class="btn btn-primary" id="formatBtn">
                    <i class="fas fa-magic"></i> 格式化文本
                </button>
                <button class="btn btn-success" id="copyBtn">
                    <i class="fas fa-copy"></i> 复制结果
                </button>
                <button class="btn btn-secondary" id="clearBtn">
                    <i class="fas fa-broom"></i> 清空文本
                </button>
                <button class="btn btn-warning" id="exampleBtn">
                    <i class="fas fa-lightbulb"></i> 使用示例
                </button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 文本格式化工具 | 本地处理，无需网络 | 所有操作在浏览器中完成</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const formatBtn = document.getElementById('formatBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const charCount = document.getElementById('charCount');
            
            // 选项元素
            const addEmptyLinesOption = document.getElementById('addEmptyLinesOption');
            const trimSpacesOption = document.getElementById('trimSpacesOption');
            const autoSpaceOption = document.getElementById('autoSpaceOption');
            const mergeBlankLinesOption = document.getElementById('mergeBlankLinesOption');
            
            // 预设按钮
            const presetButtons = document.querySelectorAll('.preset-btn');
            
            // 初始化状态
            let options = {
                addEmptyLines: true,
                trimSpaces: true,
                autoSpace: false,
                mergeBlankLines: false
            };
            
            // 更新字符计数
            function updateCharCount() {
                charCount.textContent = outputText.value.length;
            }
            
            // 选项切换
            function toggleOption(optionElement, optionKey) {
                optionElement.classList.toggle('active');
                options[optionKey] = !options[optionKey];
            }
            
            // 绑定选项点击事件
            addEmptyLinesOption.addEventListener('click', () => toggleOption(addEmptyLinesOption, 'addEmptyLines'));
            trimSpacesOption.addEventListener('click', () => toggleOption(trimSpacesOption, 'trimSpaces'));
            autoSpaceOption.addEventListener('click', () => toggleOption(autoSpaceOption, 'autoSpace'));
            mergeBlankLinesOption.addEventListener('click', () => toggleOption(mergeBlankLinesOption, 'mergeBlankLines'));
            
            // 预设选择
            presetButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 移除所有active类
                    presetButtons.forEach(b => b.classList.remove('active'));
                    // 为当前按钮添加active类
                    this.classList.add('active');
                    
                    const preset = this.dataset.preset;
                    
                    // 根据预设调整选项
                    switch(preset) {
                        case 'universal':
                            options.addEmptyLines = true;
                            options.trimSpaces = true;
                            options.autoSpace = false;
                            options.mergeBlankLines = false;
                            break;
                        case 'markdown':
                            options.addEmptyLines = true;
                            options.trimSpaces = true;
                            options.autoSpace = true;
                            options.mergeBlankLines = true;
                            break;
                        case 'html':
                            options.addEmptyLines = true;
                            options.trimSpaces = true;
                            options.autoSpace = false;
                            options.mergeBlankLines = true;
                            break;
                        case 'social':
                            options.addEmptyLines = true;
                            options.trimSpaces = true;
                            options.autoSpace = true;
                            options.mergeBlankLines = true;
                            break;
                    }
                    
                    // 更新选项UI
                    addEmptyLinesOption.classList.toggle('active', options.addEmptyLines);
                    trimSpacesOption.classList.toggle('active', options.trimSpaces);
                    autoSpaceOption.classList.toggle('active', options.autoSpace);
                    mergeBlankLinesOption.classList.toggle('active', options.mergeBlankLines);
                });
            });
            
            // 格式化函数
            function formatText() {
                let text = inputText.value;
                
                // 1. 删除行首尾空格
                if (options.trimSpaces) {
                    text = text.split('\n').map(line => line.trim()).join('\n');
                }
                
                // 2. 添加段落空行
                if (options.addEmptyLines) {
                    // 标准化已有空行
                    text = text.replace(/\n{2,}/g, '\n\n');
                    // 在非空行之间添加空行
                    text = text.replace(/([^\n])\n([^\n])/g, '$1\n\n$2');
                }
                
                // 3. 合并多余空行
                if (options.mergeBlankLines) {
                    text = text.replace(/\n{3,}/g, '\n\n');
                }
                
                // 4. 中英文间加空格
                if (options.autoSpace) {
                    text = text
                        .replace(/([\u4e00-\u9fa5])([a-zA-Z])/g, '$1 $2')
                        .replace(/([a-zA-Z])([\u4e00-\u9fa5])/g, '$1 $2');
                }
                
                outputText.value = text;
                updateCharCount();
            }
            
            // 复制结果
            function copyToClipboard() {
                outputText.select();
                document.execCommand('copy');
                
                // 显示反馈
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }
            
            // 清空文本
            function clearText() {
                inputText.value = '';
                outputText.value = '';
                updateCharCount();
            }
            
            // 使用示例文本
            function loadExample() {
                inputText.value = `欢迎使用文本格式化工具！

这是一个演示文本，展示工具如何优化您的文本格式。

您会注意到：
- 段落之间没有空行
- 行尾有多余空格    
- 中英文混排时没有空格：例如"这是一个example文本"

使用此工具后：
• 段落之间会有清晰分隔
• 多余空格会被移除
• 中英文混排更美观

请尝试点击"格式化文本"按钮查看效果！`;
                
                formatText();
            }
            
            // 事件监听
            formatBtn.addEventListener('click', formatText);
            copyBtn.addEventListener('click', copyToClipboard);
            clearBtn.addEventListener('click', clearText);
            exampleBtn.addEventListener('click', loadExample);
            
            // 初始加载示例文本
            loadExample();
        });
    </script>
</body>
</html>
