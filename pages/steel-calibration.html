<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>长细比反算最大长度 & 压力校核(方管/圆管)</title>

    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ===== 卡片 ===== */
        .container {
            max-width: 960px;
            width: 100%;
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 44px 48px;
            box-shadow:
                0 20px 60px rgba(0, 20, 40, .12),
                0 8px 24px rgba(0, 20, 40, .06),
                inset 0 1px 2px rgba(255, 255, 255, .6);
            border: 1px solid rgba(255, 255, 255, .5);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #0b2b4a, #1a4b6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .badge {
            margin-left: auto;
            background: rgba(26, 75, 109, .1);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #1a4b6d;
            border: 1px solid rgba(26, 75, 109, .12);
        }

        /* ===== 主体布局：左侧 tab + 右侧内容 ===== */
        .main-body {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ===== 左侧竖向 Tab 栏 ===== */
        .tab-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 56px;
            padding: 12px 6px;
            background: rgba(219, 228, 237, .4);
            border-radius: 20px;
            flex-shrink: 0;
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 44px;
            min-height: 72px;
            padding: 10px 4px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            color: #4d6f8a;
            border-radius: 14px;
            cursor: pointer;
            transition: .25s ease;
            font-family: inherit;
            text-align: center;
            line-height: 1.35;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 2px;
        }

        .tab-btn .tab-icon {
            font-size: 18px;
            writing-mode: horizontal-tb;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .tab-btn .tab-text {
            writing-mode: vertical-rl;
            letter-spacing: 3px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, .5);
            color: #1a4b6d;
        }

        .tab-btn.active {
            background: #fff;
            color: #0b1e33;
            box-shadow: 0 4px 12px rgba(0, 20, 40, .08);
        }

        /* 右侧内容区 */
        .tab-content {
            flex: 1;
            min-width: 0;
        }

        /* ===== 表单 ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1/-1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #1f3a57;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label .unit {
            font-weight: 400;
            color: #6f8aa3;
            font-size: 12px;
            background: rgba(111, 138, 163, .1);
            padding: 0 8px;
            border-radius: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #0b1e33;
            border: 1.5px solid #dbe4ed;
            border-radius: 16px;
            outline: none;
            background: #fff;
            transition: .25s ease;
        }

        input:focus,
        select:focus {
            border-color: #2b7bb6;
            box-shadow: 0 0 0 4px rgba(43, 123, 182, .12);
        }

        .hint {
            font-size: 12px;
            color: #6f8aa3;
        }

        /* ===== 单选按钮组 ===== */
        .radio-group {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1.5px solid #dbe4ed;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #1f3a57;
            background: #fff;
            transition: .2s ease;
            flex: 1;
            justify-content: center;
        }

        .radio-group label:hover {
            border-color: #2b7bb6;
            background: rgba(43, 123, 182, .04);
        }

        .radio-group input[type="radio"] {
            width: auto;
            margin: 0;
            accent-color: #1a4b6d;
        }

        .radio-group label:has(input:checked) {
            border-color: #1a4b6d;
            background: rgba(26, 75, 109, .08);
            font-weight: 600;
        }

        /* ===== 按钮 ===== */
        .btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #1a4b6d, #0f3550);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: .25s ease;
            box-shadow: 0 8px 20px rgba(26, 75, 109, .2);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(26, 75, 109, .28);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* ===== 结果区 ===== */
        .result-area {
            margin-top: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .6);
            padding: 24px 28px;
            border: 1px solid rgba(219, 228, 237, .5);
            min-height: 80px;
        }

        .empty-state {
            text-align: center;
            color: #8aa3bb;
            padding: 18px 0;
        }

        .empty-state .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }

        /* 结果行 */
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 0;
            border-bottom: 1px solid rgba(219, 228, 237, .3);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item .label {
            font-size: 14px;
            color: #1f3a57;
            font-weight: 500;
        }

        .result-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #0b1e33;
        }

        .result-item .sub {
            font-size: 13px;
            color: #6f8aa3;
            margin-left: 6px;
        }

        /* 高亮块 */
        .result-highlight {
            background: linear-gradient(135deg, #e7f2fa, #d4e5f2);
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 4px solid #1a4b6d;
            margin-top: 10px;
        }

        .result-highlight .label {
            font-weight: 600;
            color: #0b2b4a;
            font-size: 14px;
        }

        .result-highlight .value {
            font-size: 22px;
            font-weight: 700;
            color: #0f3550;
        }

        .result-highlight .sub {
            font-size: 14px;
            color: #4d6f8a;
            margin-left: 6px;
        }

        /* 安全/不安全 标签 */
        .safety-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 8px;
        }

        .safety-ok {
            background: #e8f5e9;
            color: #1b7a2e;
        }

        .safety-warn {
            background: #fff4e5;
            color: #b76b00;
        }

        .safety-danger {
            background: #fde8e8;
            color: #c62828;
        }

        /* 提示框 */
        .warn {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            background: #fff4e5;
            color: #8a5c00;
            border-left: 4px solid #e6a700;
            line-height: 1.6;
        }

        .warn strong {
            color: #b76b00;
        }

        .danger-box {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            background: #fde8e8;
            color: #8a1a1a;
            border-left: 4px solid #d32f2f;
            line-height: 1.6;
        }

        .info {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            background: #e8f4fd;
            color: #0d47a1;
            border-left: 4px solid #1976d2;
            line-height: 1.6;
        }

        .info strong {
            color: #0d47a1;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #4d6f8a;
            text-transform: uppercase;
            margin: 14px 0 6px;
            letter-spacing: 0.5px;
        }

        /* 国标依据 */
        .gb-ref {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            background: rgba(26, 75, 109, .04);
            color: #3a5a7a;
            border: 1px dashed rgba(26, 75, 109, .2);
            line-height: 1.6;
        }

        .gb-ref strong {
            color: #1a4b6d;
        }

        /* 面板切换 */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .main-body {
                flex-direction: column;
            }

            .tab-sidebar {
                flex-direction: row;
                width: 100%;
                padding: 6px 10px;
                overflow-x: auto;
            }

            .tab-btn {
                writing-mode: horizontal-tb;
                flex-direction: row;
                width: auto;
                min-height: unset;
                flex: 1;
                justify-content: center;
                padding: 10px 12px;
                font-size: 13px;
                letter-spacing: normal;
                white-space: nowrap;
            }

            .tab-btn .tab-icon {
                font-size: 16px;
                margin-bottom: 0;
                margin-right: 6px;
            }

            .tab-btn .tab-text {
                writing-mode: horizontal-tb;
                letter-spacing: normal;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px 18px;
                border-radius: 28px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }

            .header .badge {
                display: none;
            }

            .radio-group {
                flex-direction: column;
            }

            .result-highlight .value {
                font-size: 18px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <span class="icon">📐</span>
            <h1>长细比 & 压力校核工具</h1>
            <span class="badge">方管 · 圆管 · GB 50017</span>
        </div>

        <!-- 主体：左侧竖向 Tab + 右侧内容 -->
        <div class="main-body">

            <!-- 左侧竖向 Tab 栏 -->
            <div class="tab-sidebar">
                <button class="tab-btn active" data-tab="tab-length">
                    <span class="tab-text">材料允许长度</span>
                </button>
                <button class="tab-btn" data-tab="tab-axial">
                    <span class="tab-text">轴心受压</span>
                </button>
                <button class="tab-btn" data-tab="tab-bend">
                    <span class="tab-text">压弯组合</span>
                </button>
            </div>

            <!-- 右侧内容区 -->
            <div class="tab-content">

                <!-- ========== 面板1：反算最大长度 ========== -->
                <div class="panel active" id="tab-length">

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>自定义规格 <span class="unit">常用预设</span></label>
                            <select id="presetSpec1">
                                <option value="">— 常用预设 —</option>
                                <optgroup label="方矩管">
                                    <option value="40*20*2">40*20*2(方管)</option>
                                    <option value="40*40*2.5">40*40*2.5(方管)</option>
                                    <option value="40*40*3">40*40*3(方管)</option>
                                    <option value="50*30*3">50*30*3(方管)</option>
                                    <option value="50*50*3">50*50*3(方管)</option>
                                    <option value="60*40*3">60*40*3(矩形管)</option>
                                    <option value="80*80*4">80*80*4(方管)</option>
                                    <option value="100*50*4">100*50*4(矩形管)</option>
                                    <option value="120*60*5">120*60*5(矩形管)</option>
                                    <option value="150*100*6">150*100*6(矩形管)</option>
                                </optgroup>
                                <optgroup label="圆管">
                                    <option value="D20*2">D20*2(圆管)</option>
                                    <option value="D40*2">D40*2(圆管)</option>
                                    <option value="D50*3">D50*3(圆管)</option>
                                    <option value="D80*4">D80*4(圆管)</option>
                                    <option value="D100*4">D100*4(圆管)</option>
                                    <option value="D150*6">D150*6(圆管)</option>
                                </optgroup>
                                <option value="__custom__">✏️ 手动输入自定义规格…</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>规格输入 <span class="unit" id="inputHintUnit1">宽*高*壁厚 或 宽*壁厚</span></label>
                            <input id="specInput1" type="text" placeholder="如 40*20*2 或 40*2 或 D40*2" value="40*20*2"
                                autocomplete="off" />
                            <div class="hint">方矩管：宽*高*壁厚(如 40*20*2)或 宽*壁厚 &nbsp;·&nbsp; 圆管：D外径*壁厚 &nbsp;·&nbsp;
                                编辑后离开输入框即自动计算</div>
                        </div>

                        <div class="form-group full-width" id="shapeSelectGroup1" style="display:none;">
                            <label>截面类型 <span class="unit">两元素时需指定</span></label>
                            <div class="radio-group">
                                <label><input type="radio" name="shapeType1" value="square" id="shapeSquare1" /> ◼方管</label>
                                <label><input type="radio" name="shapeType1" value="round" id="shapeRound1" /> ● 圆管</label>
                            </div>
                        </div>

                        <!-- 面板1 专属 -->
                        <div class="form-group">
                            <label>允许长细比 λ <span class="unit">—</span></label>
                            <input id="lambdaInput" type="number" value="150" min="1" step="1" />
                        </div>
                        <div class="form-group">
                            <div class="hint" style="margin-top:18px;">
                                常用：
                                <select id="presetLambda">
                                    <option value="">—</option>
                                    <option value="120">λ≤120(重要构件)</option>
                                    <option value="150" selected>λ≤150(一般压杆)</option>
                                    <option value="200">λ≤200(次要构件)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>支撑条件 μ <span class="unit">μ</span></label>
                            <select id="muSelect1">
                                <option value="0.5">两端固定 μ=0.5</option>
                                <option value="0.7">一端固定一端铰支 μ=0.7</option>
                                <option value="1.0" selected>两端铰支 μ=1.0</option>
                                <option value="2.0">一端固定一端自由 μ=2.0</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>材料牌号 <span class="unit">f_y</span></label>
                            <select id="materialSelect1">
                                <option value="235">Q235(f=215 N/mm²)</option>
                                <option value="355" selected>Q355(f=310 N/mm²)</option>
                                <option value="390">Q390(f=350 N/mm²)</option>
                                <option value="420">Q420(f=380 N/mm²)</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn" id="calcLengthBtn">🚀 计算最大长度</button>
                    <div class="result-area" id="lengthResult">
                        <div class="empty-state"><span class="emoji">📏</span>点击按钮计算</div>
                    </div>
                </div>

                <!-- ========== 面板2：轴心受压承载力 ========== -->
                <div class="panel" id="tab-axial">

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>自定义规格 <span class="unit">常用预设</span></label>
                            <select id="presetSpec2">
                                <option value="">— 常用预设 —</option>
                                <optgroup label="方矩管">
                                   <option value="40*20*2">40*20*2(方管)</option>
                                    <option value="40*40*2.5">40*40*2.5(方管)</option>
                                    <option value="40*40*3">40*40*3(方管)</option>
                                    <option value="50*30*3">50*30*3(方管)</option>
                                    <option value="50*50*3">50*50*3(方管)</option>
                                    <option value="60*40*3">60*40*3(矩形管)</option>
                                    <option value="80*80*4">80*80*4(方管)</option>
                                    <option value="100*50*4">100*50*4(矩形管)</option>
                                    <option value="120*60*5">120*60*5(矩形管)</option>
                                    <option value="150*100*6">150*100*6(矩形管)</option>
                                </optgroup>
                                <optgroup label="圆管">
                                    <option value="D20*2">D20*2(圆管)</option>
                                    <option value="D40*2">D40*2(圆管)</option>
                                    <option value="D50*3">D50*3(圆管)</option>
                                    <option value="D80*4">D80*4(圆管)</option>
                                    <option value="D100*4">D100*4(圆管)</option>
                                    <option value="D150*6">D150*6(圆管)</option>
                                </optgroup>
                                <option value="__custom__">✏️ 手动输入自定义规格…</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>规格输入 <span class="unit">宽*高*壁厚 或 D外径*壁厚</span></label>
                            <input id="specInput2" type="text" placeholder="如 40*20*2 或 D40*2" value="40*20*2"
                                autocomplete="off" />
                            <div class="hint">编辑后离开输入框即自动计算</div>
                        </div>

                        <div class="form-group full-width" id="shapeSelectGroup2" style="display:none;">
                            <label>截面类型 <span class="unit">两元素时需指定</span></label>
                            <div class="radio-group">
                                <label><input type="radio" name="shapeType2" value="square" id="shapeSquare2" /> ◼方管</label>
                                <label><input type="radio" name="shapeType2" value="round" id="shapeRound2" /> ● 圆管</label>
                            </div>
                        </div>

                        <!-- 面板2 专属 -->
                        <div class="form-group">
                            <label>材料牌号 <span class="unit">f_y</span></label>
                            <select id="materialSelect2">
                                <option value="235">Q235(f=215)</option>
                                <option value="355" selected>Q355(f=310)</option>
                                <option value="390">Q390(f=350)</option>
                                <option value="420">Q420(f=380)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>支撑条件 μ <span class="unit">μ</span></label>
                            <select id="muSelect2">
                                <option value="0.5">两端固定 μ=0.5</option>
                                <option value="0.7">一端固定一端铰支 μ=0.7</option>
                                <option value="1.0" selected>两端铰支 μ=1.0</option>
                                <option value="2.0">一端固定一端自由 μ=2.0</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>构件长度 L <span class="unit">mm</span></label>
                            <input id="lengthInput2" type="number" value="1200" min="1" step="1" />
                        </div>

                        <div class="form-group">
                            <label>截面类别 <span class="unit">稳定系数 φ</span></label>
                            <select id="sectionClassSelect">
                                <option value="a">a 类(圆管/焊接圆管)</option>
                                <option value="b" selected>b 类(方矩管 宽厚比>20)</option>
                                <option value="c">c 类(方矩管 宽厚比≤20)</option>
                            </select>
                            <div class="hint">按 GB 50017 附录 D</div>
                        </div>

                        <div class="form-group">
                            <label>安全系数 K <span class="unit">—</span></label>
                            <input id="safetyInput2" type="number" value="1.5" min="1" step="0.1" />
                            <div class="hint">允许压力 = φAf / K</div>
                        </div>

                        <div class="form-group">
                            <label>实际轴力 N_use <span class="unit">kN</span></label>
                            <input id="NaxialInput" type="number" value="0" min="0" step="0.5" />
                            <div class="hint">0 = 仅算承载力，不校核</div>
                        </div>
                    </div>

                        </div>

                        <div class="form-group">
                            <label>安全系数 K <span class="unit">—</span></label>
                            <input id="safetyInput3" type="number" value="1.5" min="1" step="0.1" />

                    <button class="btn" id="calcBendBtn">🚀 校核压弯组合</button>
                    <div class="result-area" id="bendResult">

                    </div>

            </div><!-- /tab-content -->
        </div><!-- /main-body -->

        <div style="margin-top:20px;font-size:12px;color:#8aa3bb;text-align:center;">
            按 GB 50017-2017 欧拉柱模型 & 轴心受压稳定 · ε_k = √(235/f_y)
        </div>

    </div>

    <script>
        (function () {
            'use strict';

            /* ===== 常量 ===== */
            var SLENDER_LIMIT = 200;
            var THIN_WALL_PCT = 5;
            var WELD_THIN_PCT = 3;
            var COLD_FORM_MAX_T = 20;
            var E = 206000;

            /* ===== 工具函数 ===== */
            function epsilonK(fy) { return Math.sqrt(235 / fy); }
            function fmt(v, d) {
                d = d || 1;
                if (Math.abs(v) < 0.01) return v.toFixed(4);
                if (Number.isInteger(v)) return v.toString();
                return v.toFixed(d);
            }
            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function getF(fy) {
                if (fy <= 235) return 215;
                if (fy <= 355) return 310;
                if (fy <= 390) return 350;
                return 380;
            }

            /* ===== Tab 切换 ===== */
            var btns = document.querySelectorAll('.tab-btn');
            btns.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var target = btn.getAttribute('data-tab');
                    btns.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    document.getElementById('tab-length').classList.remove('active');
                    document.getElementById('tab-axial').classList.remove('active');
                    document.getElementById('tab-bend').classList.remove('active');
                    document.getElementById(target).classList.add('active');
                });
            });

            /* ===== 解析规格(每面板独立) ===== */
            function parseSpec(str) {
                var parts = str.replace(/\s+/g, '').split('*').filter(function (s) { return s.length > 0; });
                var first = parts[0];
                if (first && (first.charAt(0) === 'D' || first.charAt(0) === 'd')) {
                    var D, t;
                    if (parts.length === 2) { D = parseFloat(first.substring(1)); t = parseFloat(parts[1]); }
                    else if (parts.length === 3) { D = parseFloat(parts[1]); t = parseFloat(parts[2]); }
                    if (!D || !t || t * 2 >= D) return null;
                    return { kind: 'round', D: D, t: t };
                }
                if (parts.length === 2) {
                    var b = parseFloat(parts[0]), t = parseFloat(parts[1]);
                    if (!b || !t || t * 2 >= b) return null;
                    return { kind: 'ambiguous', B: b, t: t };
                }
                if (parts.length === 3) {
                    var b = parseFloat(parts[0]), h = parseFloat(parts[1]), t = parseFloat(parts[2]);
                    if (!b || !h || !t || t * 2 >= b || t * 2 >= h) return null;
                    return { kind: 'rect', B: b, H: h, t: t, isSquare: (b === h) };
                }
                return null;
            }

            // 各面板独立获取规格
            function getSpec(panelNum) {
                var input = document.getElementById('specInput' + panelNum);
                var raw = parseSpec(input.value);
                if (!raw) return null;
                if (raw.kind === 'ambiguous') {
                    var sq = document.getElementById('shapeSquare' + panelNum);
                    var rnd = document.getElementById('shapeRound' + panelNum);
                    if (rnd && rnd.checked) return { kind: 'round', D: raw.B, t: raw.t };
                    return { kind: 'rect', B: raw.B, H: raw.B, t: raw.t, isSquare: true };
                }
                return raw;
            }

            /* ===== 截面几何 ===== */
            function calcRect(B, H, t) {
                var A = B * H - (B - 2 * t) * (H - 2 * t);
                var Ix = (B * H * H * H - (B - 2 * t) * (H - 2 * t) * (H - 2 * t) * (H - 2 * t)) / 12;
                var Iy = (H * B * B * B - (H - 2 * t) * (B - 2 * t) * (B - 2 * t) * (B - 2 * t)) / 12;
                var ix = Math.sqrt(Ix / A), iy = Math.sqrt(Iy / A);
                var Wx = Ix / (H / 2), Wy = Iy / (B / 2);
                return { A: A, Ix: Ix, Iy: Iy, ix: ix, iy: iy, Wx: Wx, Wy: Wy };
            }
            function calcRound(D, t) {
                var R = D / 2, r = R - t;
                var A = Math.PI * (R * R - r * r);
                var I = Math.PI * (R * R * R * R - r * r * r * r) / 4;
                var i = Math.sqrt(I / A);
                var W = I / R;
                return { A: A, I: I, i: i, W: W };
            }
            function getSection(spec) {
                if (spec.kind === 'rect') return calcRect(spec.B, spec.H, spec.t);
                return calcRound(spec.D, spec.t);
            }

            /* ===== 稳定系数 φ (GB 50017 附录 D) ===== */
            function stabilityFactor(lambda, fy, klass) {
                var params = {
                    'a': { a1: 0.41, a2: 0.986, a3: 0.152, lc: 0.7 },
                    'b': { a1: 0.65, a2: 0.965, a3: 0.300, lc: 0.8 },
                    'c': { a1: 0.73, a2: 0.906, a3: 0.595, lc: 0.9 }
                };
                var p = params[klass] || params['b'];
                var lambda_n = (lambda / Math.PI) * Math.sqrt(fy / E);
                var phi;
                if (lambda_n <= p.lc) {
                    phi = 1 - (p.a1 + p.a2 * lambda_n + p.a3 * lambda_n * lambda_n) * lambda_n;
                } else {
                    phi = 1 / ((1 + 0.35 * lambda_n) * lambda_n * lambda_n);
                }
                if (phi > 1) phi = 1;
                if (phi < 0.05) phi = 0.05;
                return phi;
            }

            /* ===== 国标校验 ===== */
            function checkGB(spec, fy) {
                var ek = epsilonK(fy);
                var warnings = [], infos = [];
                if (spec.kind === 'rect') {
                    var B = spec.B, H = spec.H, t = spec.t;
                    var btRatio = Math.max(B, H) / t, btLimit = 40 * ek;
                    if (btRatio <= btLimit) {
                        infos.push('<strong>✅ 局部稳定满足：</strong>b/t=' + fmt(btRatio, 1) + ' ≤ 40ε_k=' + fmt(btLimit, 1) + '(Q' + fy + ')。<br/><span style="font-size:11px;color:#6f8aa3;">GB 50017-2017 第7.3.1条</span>');
                    } else {
                        warnings.push('<strong>⚠️ 局部稳定不满足：</strong>b/t=' + fmt(btRatio, 1) + ' > 40ε_k=' + fmt(btLimit, 1) + '，需按有效截面计算或加加劲肋。');
                    }
                    if (t / Math.min(B, H) * 100 < THIN_WALL_PCT) {
                        warnings.push('<strong>⚠️ 壁厚偏薄：</strong>t/min(B,H)=' + fmt(t / Math.min(B, H) * 100, 2) + '% < ' + THIN_WALL_PCT + '%');
                    }
                    if (t < WELD_THIN_PCT) {
                        warnings.push('<strong>⚠️ 焊接不推荐：</strong>t=' + t + 'mm < ' + WELD_THIN_PCT + 'mm，角焊缝易焊穿。建议 hf_min=1.5mm，需谨慎施焊。');
                    }
                    if (t > COLD_FORM_MAX_T) {
                        warnings.push('<strong>⚠️ 不宜冷弯：</strong>t=' + t + 'mm > ' + COLD_FORM_MAX_T + 'mm，建议改用四块板组焊箱形截面。');
                    }
                } else if (spec.kind === 'round') {
                    var D = spec.D, t = spec.t;
                    var dtRatio = D / t, dtLimit = 100 * ek;
                    if (dtRatio <= dtLimit) {
                        infos.push('<strong>✅ 局部稳定满足：</strong>D/t=' + fmt(dtRatio, 1) + ' ≤ 100ε_k=' + fmt(dtLimit, 1) + '(Q' + fy + ')。<br/><span style="font-size:11px;color:#6f8aa3;">GB 50017-2017 第7.3.1条</span>');
                    } else {
                        warnings.push('<strong>⚠️ 局部稳定不满足：</strong>D/t=' + fmt(dtRatio, 1) + ' > 100ε_k=' + fmt(dtLimit, 1) + '，需按有效截面计算。');
                    }
                    if (t < WELD_THIN_PCT) {
                        warnings.push('<strong>⚠️ 焊接不推荐：</strong>t=' + t + 'mm < ' + WELD_THIN_PCT + 'mm，角焊缝易焊穿。');
                    }
                }
                return { warnings: warnings, infos: infos };
            }

            function renderGB(html, warnings, infos) {
                infos.forEach(function (s) { html += '<div class="info">' + s + '</div>'; });
                warnings.forEach(function (s) { html += '<div class="warn">' + s + '</div>'; });
                return html;
            }

            function specHeader(spec, fy, extra) {
                var html = '';
                if (spec.kind === 'rect') {
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                    html += '<span style="font-size:18px;font-weight:600;color:#0b1e33;">' + spec.B + '×' + spec.H + '×' + spec.t + ' (' + (spec.isSquare ? '方管' : '矩形管') + ')</span>';
                    html += '<span style="font-size:13px;color:#4d6f8a;background:rgba(77,111,138,.08);padding:2px 14px;border-radius:20px;">▭ Q' + fy + extra + '</span></div>';
                } else {
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                    html += '<span style="font-size:18px;font-weight:600;color:#0b1e33;">D' + spec.D + '×' + spec.t + '(圆管)</span>';
                    html += '<span style="font-size:13px;color:#4d6f8a;background:rgba(77,111,138,.08);padding:2px 14px;border-radius:20px;">● Q' + fy + extra + '</span></div>';
                }
                return html;
            }

            /* =========================================
             *  面板1：反算最大长度
             * ======================================== */
            function calcLength() {
                var spec = getSpec(1);
                var lambda = +document.getElementById('lambdaInput').value;
                var mu = +document.getElementById('muSelect1').value;
                var fy = +document.getElementById('materialSelect1').value;
                var result = document.getElementById('lengthResult');

                if (!spec) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>规格解析失败</div>'; return; }
                if (!lambda || lambda <= 0) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>λ 不合法</div>'; return; }

                var sec = getSection(spec);
                var html = specHeader(spec, fy, '');

                html += '<div class="section-title">📐 截面几何参数</div>';
                html += '<div class="result-item"><span class="label">截面面积 A</span><span class="value">' + fmt(sec.A) + ' <span class="sub">mm²</span></span></div>';

                if (spec.kind === 'rect') {
                    var iBig = Math.max(sec.ix, sec.iy), iSmall = Math.min(sec.ix, sec.iy);
                    html += '<div class="result-item"><span class="label">回转半径 i₁(较大)</span><span class="value">' + fmt(iBig, 2) + ' <span class="sub">mm</span></span></div>';
                    html += '<div class="result-item"><span class="label">回转半径 i₂(较小)</span><span class="value">' + fmt(iSmall, 2) + ' <span class="sub">mm</span></span></div>';
                    var LBig = lambda * iBig / mu, LSmall = lambda * iSmall / mu;
                    html += '<div class="section-title">📏 最大允许长度(λ=' + lambda + '，μ=' + mu + ')</div>';
                    html += '<div class="result-item"><span class="label">i₁ 方向 L₁</span><span class="value">' + fmt(LBig) + ' <span class="sub">mm</span></span></div>';
                    html += '<div class="result-item"><span class="label">i₂ 方向 L₂</span><span class="value">' + fmt(LSmall) + ' <span class="sub">mm</span></span></div>';
                    html += '<div class="result-highlight"><div class="label">⚠️ 控制长度(较小回转半径方向)</div><div class="value">' + fmt(LSmall) + ' <span class="sub">mm</span></div><div style="font-size:12px;color:#4d6f8a;margin-top:4px;">另一方向：' + fmt(LBig) + ' mm</div></div>';
                } else {
                    html += '<div class="result-item"><span class="label">回转半径 i</span><span class="value">' + fmt(sec.i, 2) + ' <span class="sub">mm</span></span></div>';
                    var L = lambda * sec.i / mu;
                    html += '<div class="section-title">📏 最大允许长度(λ=' + lambda + '，μ=' + mu + ')</div>';
                    html += '<div class="result-highlight"><div class="label">最大允许长度 L</div><div class="value">' + fmt(L) + ' <span class="sub">mm</span></div></div>';
                }

                var gb = checkGB(spec, fy);
                html = renderGB(html, gb.warnings, gb.infos);
                html += '<div class="gb-ref"><strong>📖 公式：</strong>L = λ·i/μ &nbsp;|&nbsp; i = √(I/A) &nbsp;|&nbsp; ε_k=' + fmt(epsilonK(fy), 3) + ' &nbsp;|&nbsp; GB 50017-2017</div>';
                result.innerHTML = html;
            }

            /* =========================================
             *  面板2：轴心受压承载力
             * ======================================== */
            function calcAxial() {
                var spec = getSpec(2);
                var fy = +document.getElementById('materialSelect2').value;
                var mu = +document.getElementById('muSelect2').value;
                var L = +document.getElementById('lengthInput2').value;
                var klass = document.getElementById('sectionClassSelect').value;
                var K = +document.getElementById('safetyInput2').value || 1;
                var N_use = +document.getElementById('NaxialInput').value || 0;
                var f = getF(fy);
                var result = document.getElementById('axialResult');

                if (!spec) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>规格解析失败</div>'; return; }
                if (!L || L <= 0) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>长度不合法</div>'; return; }

                var sec = getSection(spec);
                var html = specHeader(spec, fy, ' · ' + klass + '类');

                html += '<div class="section-title">📐 截面几何参数</div>';
                html += '<div class="result-item"><span class="label">截面面积 A</span><span class="value">' + fmt(sec.A) + ' <span class="sub">mm²</span></span></div>';
                var iMin = (spec.kind === 'rect') ? Math.min(sec.ix, sec.iy) : sec.i;
                html += '<div class="result-item"><span class="label">回转半径 i_min</span><span class="value">' + fmt(iMin, 2) + ' <span class="sub">mm</span></span></div>';

                var lambda = mu * L / iMin;
                var Ncr = Math.PI * Math.PI * E * iMin * iMin * sec.A / (mu * L) / (mu * L);
                html += '<div class="section-title">📏 稳定验算</div>';
                html += '<div class="result-item"><span class="label">长细比 λ = μL / i_min</span><span class="value">' + fmt(lambda, 1) + '</span></div>';
                html += '<div class="result-item"><span class="label">欧拉临界力 N_cr(弹性上限)</span><span class="value">' + fmt(Ncr / 1000, 2) + ' <span class="sub">kN</span></span></div>';

                var phi = stabilityFactor(lambda, fy, klass);
                html += '<div class="result-item"><span class="label">稳定系数 φ(GB 50017 附录D)</span><span class="value">' + fmt(phi, 3) + '</span></div>';

                var N_des = phi * sec.A * f;
                var N_allow = N_des / K;
                html += '<div class="result-item"><span class="label">材料强度 f</span><span class="value">' + f + ' <span class="sub">N/mm²</span></span></div>';
                html += '<div class="result-item"><span class="label">设计承载力 N = φAf</span><span class="value">' + fmt(N_des / 1000, 2) + ' <span class="sub">kN</span></span></div>';
                html += '<div class="result-item"><span class="label">安全系数 K</span><span class="value">' + fmt(K, 2) + '</span></div>';

                html += '<div class="result-highlight">';
                html += '<div class="label">🔩 最大允许压力(使用值)</div>';
                html += '<div class="value">' + fmt(N_allow / 1000, 2) + ' <span class="sub">kN</span></div>';
                html += '<div style="font-size:12px;color:#4d6f8a;margin-top:4px;">N_allow = φAf / K = ' + fmt(phi, 3) + ' × ' + fmt(sec.A) + ' × ' + f + ' / ' + fmt(K, 2) + '</div>';
                html += '</div>';

                if (N_use > 0) {
                    var ratio = N_use / (N_allow / 1000);
                    html += '<div class="result-item" style="margin-top:8px;"><span class="label">实际轴力 N_use</span><span class="value">' + fmt(N_use, 1) + ' <span class="sub">kN</span></span></div>';
                    html += '<div class="result-item"><span class="label">使用率 N_use / N_allow</span><span class="value">' + fmt(ratio * 100, 1) + '%</span></div>';
                    if (ratio < 1) {
                        html += '<div class="safety-tag safety-ok">✅ 安全(使用率 ' + fmt(ratio * 100, 1) + '% < 100%)</div>';
                    } else if (ratio < 1.1) {
                        html += '<div class="safety-tag safety-warn">⚠️ 接近极限(使用率 ' + fmt(ratio * 100, 1) + '%)</div>';
                    } else {
                        html += '<div class="safety-tag safety-danger">❌ 不安全(使用率 ' + fmt(ratio * 100, 1) + '% > 100%)</div>';
                    }
                }

                if (lambda > SLENDER_LIMIT) {
                    html += '<div class="warn"><strong>⚠️ 长细比过大：</strong>λ=' + fmt(lambda, 1) + ' > ' + SLENDER_LIMIT + '，建议增大截面或减小支撑间距。</div>';
                }

                var gb = checkGB(spec, fy);
                html = renderGB(html, gb.warnings, gb.infos);
                html += '<div class="gb-ref"><strong>📖 公式：</strong>N = φAf &nbsp;|&nbsp; φ 按 GB 50017-2017 附录D &nbsp;|&nbsp; N_cr = π²EI/(μL)² &nbsp;|&nbsp; ε_k=' + fmt(epsilonK(fy), 3) + '</div>';
                result.innerHTML = html;
            }

            /* =========================================
             *  面板3：压弯组合校核
             * ======================================== */
            function calcBend() {
                var spec = getSpec(3);
                var fy = +document.getElementById('materialSelect3').value;
                var mu = +document.getElementById('muSelect3').value;
                var L = +document.getElementById('lengthInput3').value;
                var klass = document.getElementById('sectionClassBend').value;
                var N_use = (+document.getElementById('NbendInput').value) * 1000;
                var qVal = +document.getElementById('qInput').value;
                var loadType = document.getElementById('loadTypeSelect').value;
                var K = +document.getElementById('safetyInput3').value || 1;
                var f = getF(fy);
                var result = document.getElementById('bendResult');

                if (!spec) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>规格解析失败</div>'; return; }
                if (!L || L <= 0) { result.innerHTML = '<div class="empty-state"><span class="emoji">❌</span>长度不合法</div>'; return; }

                var sec = getSection(spec);
                var html = specHeader(spec, fy, ' · ' + klass + '类');

                var M_q, W;
                if (loadType === 'point') {
                    var F = qVal * 1000;
                    M_q = F * L / 8;
                    html += '<div class="section-title">📐 横向荷载弯矩</div>';
                    html += '<div class="result-item"><span class="label">荷载类型</span><span class="value">跨中集中力 F=' + fmt(F / 1000, 1) + ' kN</span></div>';
                    html += '<div class="result-item"><span class="label">跨中弯矩 M_q = FL/8</span><span class="value">' + fmt(M_q / 1e6, 2) + ' <span class="sub">kN·m</span></span></div>';
                } else {
                    var q = qVal / 1000;
                    M_q = q * L * L / 24;
                    html += '<div class="section-title">📐 横向荷载弯矩</div>';
                    html += '<div class="result-item"><span class="label">荷载类型</span><span class="value">均布荷载 q=' + fmt(qVal, 1) + ' kN/m</span></div>';
                    html += '<div class="result-item"><span class="label">跨中弯矩 M_q = qL²/24</span><span class="value">' + fmt(M_q / 1e6, 2) + ' <span class="sub">kN·m</span></span></div>';
                }

                if (spec.kind === 'rect') {
                    if (sec.ix < sec.iy) {
                        W = sec.Wx;
                        html += '<div class="result-item"><span class="label">控制截面模量 W(绕弱轴 x)</span><span class="value">' + fmt(W, 0) + ' <span class="sub">mm³</span></span></div>';
                    } else {
                        W = sec.Wy;
                        html += '<div class="result-item"><span class="label">控制截面模量 W(绕弱轴 y)</span><span class="value">' + fmt(W, 0) + ' <span class="sub">mm³</span></span></div>';
                    }
                } else {
                    W = sec.W;
                    html += '<div class="result-item"><span class="label">截面模量 W</span><span class="value">' + fmt(W, 0) + ' <span class="sub">mm³</span></span></div>';
                }

                var iMin = (spec.kind === 'rect') ? Math.min(sec.ix, sec.iy) : sec.i;
                var Ncr = Math.PI * Math.PI * E * iMin * iMin * sec.A / (mu * L) / (mu * L);
                var delta_1 = 1 / (1 - N_use / Ncr);
                if (delta_1 < 1) delta_1 = 1;
                var M_max = M_q * delta_1;

                html += '<div class="section-title">📏 二阶效应放大</div>';
                html += '<div class="result-item"><span class="label">欧拉临界力 N_cr</span><span class="value">' + fmt(Ncr / 1000, 2) + ' <span class="sub">kN</span></span></div>';
                html += '<div class="result-item"><span class="label">放大系数 δ₁ = 1/(1−N/N_cr)</span><span class="value">' + fmt(delta_1, 3) + '</span></div>';
                html += '<div class="result-item"><span class="label">放大后弯矩 M_max</span><span class="value">' + fmt(M_max / 1e6, 2) + ' <span class="sub">kN·m</span></span></div>';

                var sigma_N = N_use / sec.A;
                var sigma_M = M_max / W;
                var sigma_total = sigma_N + sigma_M;

                html += '<div class="section-title">🔬 强度校核(压弯组合)</div>';
                html += '<div class="result-item"><span class="label">轴向压应力 N/A</span><span class="value">' + fmt(sigma_N, 2) + ' <span class="sub">N/mm²</span></span></div>';
                html += '<div class="result-item"><span class="label">弯曲应力 M/W</span><span class="value">' + fmt(sigma_M, 2) + ' <span class="sub">N/mm²</span></span></div>';
                html += '<div class="result-item"><span class="label">合成最大压应力</span><span class="value">' + fmt(sigma_total, 2) + ' <span class="sub">N/mm²</span></span></div>';
                html += '<div class="result-item"><span class="label">材料强度 f</span><span class="value">' + f + ' <span class="sub">N/mm²</span></span></div>';

                var ratio = sigma_total / f;
                html += '<div class="result-highlight">';
                html += '<div class="label">📐 强度使用率 σ/f</div>';
                html += '<div class="value">' + fmt(ratio * 100, 1) + '%</div>';
                html += '</div>';

                if (ratio < 1 / K) {
                    html += '<div class="safety-tag safety-ok">✅ 安全(σ/f = ' + fmt(ratio * 100, 1) + '% < 1/K = ' + fmt(100 / K, 1) + '%)</div>';
                } else if (ratio < 1) {
                    html += '<div class="safety-tag safety-warn">⚠️ 考虑安全系数后：σ/f = ' + fmt(ratio * 100, 1) + '%，÷K=' + fmt(K, 2) + ' → ' + fmt(ratio * 100 / K, 1) + '%</div>';
                } else {
                    html += '<div class="safety-tag safety-danger">❌ 不安全：σ = ' + fmt(sigma_total, 1) + ' > f = ' + f + ' N/mm²</div>';
                }

                var lambda = mu * L / iMin;
                var phi = stabilityFactor(lambda, fy, klass);
                var stability_check = N_use / (phi * sec.A * f) + M_max / (W * f);
                html += '<div class="section-title">📏 稳定验算(近似)</div>';
                html += '<div class="result-item"><span class="label">长细比 λ</span><span class="value">' + fmt(lambda, 1) + '</span></div>';
                html += '<div class="result-item"><span class="label">稳定系数 φ</span><span class="value">' + fmt(phi, 3) + '</span></div>';
                html += '<div class="result-item"><span class="label">N/(φAf) + M/(Wf)</span><span class="value">' + fmt(stability_check, 3) + '</span></div>';
                if (stability_check < 1) {
                    html += '<div class="safety-tag safety-ok">✅ 稳定满足(' + fmt(stability_check, 3) + ' < 1)</div>';
                } else {
                    html += '<div class="safety-tag safety-danger">❌ 稳定不满足(' + fmt(stability_check, 3) + ' > 1)，需增大截面</div>';
                }

                if (N_use / Ncr > 0.8) {
                    html += '<div class="warn"><strong>⚠️ P-δ 效应显著：</strong>N/N_cr = ' + fmt(N_use / Ncr * 100, 1) + '%，放大系数已达 ' + fmt(delta_1, 2) + '，建议减小长细比或增大截面。</div>';
                }
                if (lambda > SLENDER_LIMIT) {
                    html += '<div class="warn"><strong>⚠️ 长细比过大：</strong>λ=' + fmt(lambda, 1) + ' > ' + SLENDER_LIMIT + '</div>';
                }

                var gb = checkGB(spec, fy);
                html = renderGB(html, gb.warnings, gb.infos);
                html += '<div class="gb-ref"><strong>📖 公式：</strong>σ = N/A + M/W ≤ f &nbsp;|&nbsp; M = δ₁·M_q &nbsp;|&nbsp; δ₁=1/(1−N/N_cr) &nbsp;|&nbsp; N_cr=π²EI/(μL)² &nbsp;|&nbsp; GB 50017-2017 第7.3条</div>';
                result.innerHTML = html;
            }

            /* ===== 规格输入联动(每面板独立) ===== */
            function bindSpecInput(panelNum) {
                var input = document.getElementById('specInput' + panelNum);
                var preset = document.getElementById('presetSpec' + panelNum);
                var group = document.getElementById('shapeSelectGroup' + panelNum);
                var sq = document.getElementById('shapeSquare' + panelNum);
                var rnd = document.getElementById('shapeRound' + panelNum);

                function updateShape() {
                    var val = input.value.trim();
                    var parts = val.replace(/\s+/g, '').split('*').filter(function (s) { return s.length > 0; });
                    var first = parts[0];
                    var isRoundPrefix = (first && (first.charAt(0) === 'D' || first.charAt(0) === 'd'));
                    if (!isRoundPrefix && parts.length === 2) {
                        group.style.display = 'flex';
                        if (!sq.checked && !rnd.checked) sq.checked = true;
                    } else {
                        group.style.display = 'none';
                        sq.checked = false; rnd.checked = false;
                    }
                }

                input.onkeydown = function (e) { if (e.key === 'Enter') input.blur(); };
                input.onblur = function () {
                    preset.value = '__custom__';
                    updateShape();
                    if (panelNum === 1) calcLength();
                    else if (panelNum === 2) calcAxial();
                    else calcBend();
                };
                input.oninput = updateShape;

                sq.onchange = function () { if (panelNum === 1) calcLength(); else if (panelNum === 2) calcAxial(); else calcBend(); };
                rnd.onchange = function () { if (panelNum === 1) calcLength(); else if (panelNum === 2) calcAxial(); else calcBend(); };

                preset.onchange = function () {
                    if (preset.value === '__custom__') { input.focus(); input.select(); }
                    else if (preset.value) { input.value = preset.value; updateShape(); if (panelNum === 1) calcLength(); else if (panelNum === 2) calcAxial(); else calcBend(); }
                };
            }

            bindSpecInput(1);
            bindSpecInput(2);
            bindSpecInput(3);

            /* ===== 按钮绑定 ===== */
            document.getElementById('calcLengthBtn').onclick = calcLength;
            document.getElementById('calcAxialBtn').onclick = calcAxial;
            document.getElementById('calcBendBtn').onclick = calcBend;

            /* ===== 面板1 输入变化 ===== */
            document.getElementById('lambdaInput').onchange = calcLength;
            document.getElementById('muSelect1').onchange = calcLength;
            document.getElementById('materialSelect1').onchange = calcLength;
            document.getElementById('presetLambda').onchange = function () {
                if (this.value) { document.getElementById('lambdaInput').value = this.value; calcLength(); }
            };

            /* ===== 面板2 输入变化 ===== */
            document.getElementById('materialSelect2').onchange = calcAxial;
            document.getElementById('muSelect2').onchange = calcAxial;
            document.getElementById('lengthInput2').onchange = calcAxial;
            document.getElementById('sectionClassSelect').onchange = calcAxial;
            document.getElementById('safetyInput2').onchange = calcAxial;
            document.getElementById('NaxialInput').onchange = calcAxial;

            /* ===== 面板3 输入变化 ===== */
            document.getElementById('materialSelect3').onchange = calcBend;
            document.getElementById('muSelect3').onchange = calcBend;
            document.getElementById('lengthInput3').onchange = calcBend;
            document.getElementById('sectionClassBend').onchange = calcBend;
            document.getElementById('NbendInput').onchange = calcBend;
            document.getElementById('qInput').onchange = calcBend;
            document.getElementById('safetyInput3').onchange = calcBend;
            document.getElementById('loadTypeSelect').onchange = function () {
                var t = this.value;
                var u = document.getElementById('loadUnit');
                var h = document.getElementById('loadHint');
                if (t === 'point') { u.textContent = 'kN'; h.textContent = '集中力：输入力值(kN)'; }
                else { u.textContent = 'kN/m'; h.textContent = '均布荷载：输入线荷载(kN/m)'; }
                calcBend();
            };

            /* ===== 初始化 ===== */
            window.addEventListener('DOMContentLoaded', function () {
                ['1', '2', '3'].forEach(function (n) {
                    var input = document.getElementById('specInput' + n);
                    var group = document.getElementById('shapeSelectGroup' + n);
                    var parts = input.value.replace(/\s+/g, '').split('*').filter(function (s) { return s.length > 0; });
                    var first = parts[0];
                    var isRound = (first && (first.charAt(0) === 'D' || first.charAt(0) === 'd'));
                    if (!isRound && parts.length === 2) { group.style.display = 'flex'; document.getElementById('shapeSquare' + n).checked = true; }
                });
                calcLength();
                calcAxial();
                calcBend();
            });

        })();
    </script>
</body>

</html>
