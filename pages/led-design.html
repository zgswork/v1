<!doctype html>
<html lang="zh-CN">

    <head>
        <script src="../static/js/runtime.js?v=20260827p"></script>
        <meta charset="utf-8">
        <title>LED显示屏 模组 安装结构设计</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="stylesheet" href="../static/css/led-design.css">
    </head>

    <body>
        <div id="alertOverlay" class="alert-overlay">
            <div class="alert-box">
                <h3 class="alert-title">关于 LED显示屏钢结构设计</h3>
                <div class="alert-content">
                    <p><strong>版本：</strong> <span id="alertVersion"></span></p>
                    <p><strong>功能说明：</strong></p>
                    <p>本工具用于LED显示屏室内模组的钢结构设计。支持多种型号选择，自动计算显示尺寸，并提供多种设计选项。</p>
                    <p><strong>主要特性：</strong></p>
                    <ul style="padding-left:20px;margin-top:10px;">
                        <li>支持Q/S/M/N系列多种型号</li>
                        <li>自动计算显示长度和高度</li>
                        <li>灵活的排列组合配置</li>
                        <li>多种结构截面选择</li>
                    </ul>
                    <p style="margin-top:15px;color:#7dd3fc;">
                        注：请根据实际工程需求调整参数，计算结果仅供参考。
                    </p>
                </div>
                <div class="alert-footer">
                    <button id="closeAlertBtn" class="alert-button">确定</button>
                </div>
            </div>
        </div>
        <form class="box" id="designForm">
            <h2>LED显示屏 模组 安装结构设计
                <span id="headerVersion" style="font-size: .5em;font-weight:normal;"></span>
            </h2>
            <h5>
                *声明：<br>
                1、本应用仅适用于模组磁吸平面前维护钢结构；<br>
                2、输出的文件仅供参考，不得作为施工依据，默认同意本声明，否则请放弃使用。
            </h5>
            <!-- 第一行 -->
            <div class="row">
                <label>室内户外</label><select id="snhw" name="snhw"></select>
                <label>产品系列</label><select id="cpxl" name="cpxl"></select>
                <label>产品型号</label><select id="cpxh" name="cpxh"></select>
                <label>屏点间距</label><input id="pdjj" name="pdjj" type="number" readonly class="readonly">
            </div>
            <!-- 第二行 -->
            <div class="row">
                <label>单元长度</label><input id="dycd" name="dycd" type="number">
                <label>单元高度</label><input id="dygd" name="dygd" type="number">
                <label>包边上边</label><input id="bbsb" name="bbsb" type="number">
                <label>安装样式</label><select id="azys" name="azys"></select>
            </div>
            <!-- 第三行 -->
            <div class="row">
                <label>排列列数</label><input id="plls" name="plls" type="number" min="1" step="1" value="10">
                <label>排列行数</label><input id="plhs" name="plhs" type="number" min="1" step="1" value="10">
                <label>包边下边</label><input id="bbxb" name="bbxb" type="number">
                <label>包边侧边</label><input id="bbcb" name="bbcb" type="number">
            </div>
            <!-- 第四行 -->
            <div class="row">
                <label>单元厚度</label><input id="dyhd" name="dyhd" type="number">
                <label>屏体厚度</label><input id="pthd" name="pthd" type="number" value="100">
                <label>离地高度</label><input id="ldgd" name="ldgd" type="number">
                <label>距离屋顶</label><input id="jlwd" name="jlwd" type="number">
            </div>
            <!-- 第五行 -->
            <div class="row">
                <label>显示长度</label><input id="xscd" name="xscd" type="number" readonly class="readonly">
                <label>显示高度</label><input id="xsgd" name="xsgd" type="number" readonly class="readonly">
                <label>留空间隙</label><input id="lkjx" name="lkjx" type="number">
                <label>项目区域</label><select id="xmqy" name="xmqy"></select>
            </div>
            <div id="rowSteelX">
                <div class="divider-line"></div>
                <!-- 第六行 -->
                <div class="row">
                    <label>单元背条</label><input id="dybt" name="dybt" type="text">
                    <label>背条横杆</label><input id="bthg" name="bthg" type="text">
                    <label>牛腿连杆</label><input id="ntlg" name="ntlg" type="text">
                    <label>水平横杆</label><input id="sphg" name="sphg" type="text">
                </div>                 
                <!-- 第七行 -->
                <div class="row">
                    <label>主承竖杆</label><input id="zcsg" name="zcsg" type="text">
                    <label>埋件横距</label><input id="mjhj" name="mjhj" type="number" value="1216">
                    <label>埋件竖距</label><input id="mjsj" name="mjsj" type="number" value="1500">
                    <label>法兰埋件</label><select id="flmj" name="flmj"></select>
                </div>
            </div>
            <div class="divider-line"></div>
            <!-- 复选框行 --><!-- checked换成disabled永久禁用 -->
            <div class="row checkbox-row">
                <label class="steel-label"><input type="checkbox" id="psyt" name="psyt" checked>屏示意图</label>
                <label class="steel-label"><input type="checkbox" id="pggt" name="pggt" checked>屏钢构图</label>
                <label class="steel-label"><input type="checkbox" id="zdtj" name="zdtj" checked>自动推荐</label>
                <label class="steel-label"><input type="checkbox" id="cltj" name="cltj" checked>材料统计</label>
                <label class="steel-label"><input type="checkbox" id="dxft" name="dxft" checked>DXF图纸</label>
                <label class="steel-label"><input type="checkbox" id="pdft" name="pdft" disabled>PDF图纸</label>
            </div>
            <div class="divider-line"></div>
            <!-- 按钮 -->
            <div class="btn-row">
                <button id="drawBtn" name="drawBtn" onclick="drawDxf()">绘图</button>
                <button id="showAlertBtn" name="showAlertBtn" onclick="showAlert()">关于</button>
                <button onclick="closePage()">取消</button>
            </div>
            <div class="divider-line"></div>
            <div id="msg" name="msg" class="hidden"></div>
            <ol id="hist" name="hist" class="hidden"></ol>
        </form>
        <!-- 数据层 -->
        <script src="../static/js/led-design_data.js"></script>
        <!-- 业务逻辑层 -->
        <script src="../static/js/led-design_app.js"></script>
    </body>

</html>
