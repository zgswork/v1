<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙发库存统计 - 本地版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #667eea;
        }

        .import-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .import-box {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            background: #fafafa;
        }

        .import-box:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .import-box.dragover {
            border-color: #667eea;
            background: #e8eeff;
            transform: scale(1.02);
        }

        .import-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .import-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .date-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        .date-input:focus {
            border-color: #667eea;
        }

        .file-input {
            display: none;
        }

        .btn-select {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-select:hover {
            background: #5a6fd6;
        }

        .file-info {
            margin-top: 12px;
            padding: 8px 12px;
            background: #e8f5e9;
            border-radius: 6px;
            color: #2e7d32;
            font-size: 13px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #eee;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .summary-item {
            text-align: center;
            padding: 16px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .summary-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 600;
            color: #667eea;
        }

        .summary-value.positive {
            color: #4caf50;
        }

        .summary-value.negative {
            color: #f44336;
        }

        .chart-container {
            height: 400px;
            width: 100%;
        }

        .small-chart {
            height: 280px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9ff;
            font-weight: 600;
            color: #667eea;
        }

        tr:hover {
            background: #fafafa;
        }

        .number {
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .total-row {
            background: #fff3cd;
            font-weight: 600;
        }

        .total-row td {
            border-top: 2px solid #ffc107;
        }

        .positive {
            color: #4caf50;
        }

        .negative {
            color: #f44336;
        }

        .history-section {
            margin-top: 20px;
        }

        .history-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .btn-clear {
            background: #ff5252;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-clear:hover {
            background: #ff1744;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            display: none;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛋️ 沙发库存统计 - 本地版</h1>

        <!-- 消息提示 -->
        <div id="message" class="message"></div>

        <!-- 数据导入卡片 -->
        <div class="card">
            <div class="card-title">📥 数据导入</div>
            
            <div class="import-section">
                <!-- 库存数据导入 -->
                <div class="import-box" id="stockDropArea">
                    <div class="import-icon">📦</div>
                    <div class="import-text">沙发库存导入</div>
                    <input type="date" class="date-input" id="stockDate">
                    <input type="file" class="file-input" id="stockFile" accept=".xlsx,.xls">
                    <button class="btn-select" onclick="document.getElementById('stockFile').click()">选择文件</button>
                    <div class="file-info" id="stockFileInfo">未选择文件</div>
                </div>

                <!-- 出入库数据导入 -->
                <div class="import-box" id="ioDropArea">
                    <div class="import-icon">📊</div>
                    <div class="import-text">沙发出入库导入</div>
                    <input type="date" class="date-input" id="ioDate">
                    <input type="file" class="file-input" id="ioFile" accept=".xlsx,.xls">
                    <button class="btn-select" onclick="document.getElementById('ioFile').click()">选择文件</button>
                    <div class="file-info" id="ioFileInfo">未选择文件</div>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-secondary" onclick="clearAll()">清空</button>
                <button class="btn-primary" onclick="processData()">开始处理</button>
            </div>
        </div>

        <!-- 加载中 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在处理数据...</div>
        </div>

        <!-- 结果区域 -->
        <div id="results" style="display: none;">
            <!-- 今日库存汇总 -->
            <div class="card">
                <div class="card-title">📈 今日库存汇总</div>
                <div class="summary-grid" id="summaryGrid">
                </div>
            </div>

            <!-- 库存趋势图 -->
            <div class="card">
                <div class="card-title">📊 库存趋势图</div>
                <div id="stockChart" class="chart-container"></div>
            </div>

            <!-- 出入库对比图 -->
            <div class="card">
                <div class="card-title">📉 出入库对比</div>
                <div id="ioChart" class="chart-container small-chart"></div>
            </div>

            <!-- 今日供应商分布 -->
            <div class="card">
                <div class="card-title">📋 今日沙发库存供应商分布</div>
                <table id="supplierTable">
                </table>
            </div>

            <!-- 历史数据汇总 -->
            <div class="card">
                <div class="history-title">
                    <div class="card-title" style="margin: 0;">📅 近30天沙发库存变动汇总表</div>
                    <button class="btn-clear" onclick="clearHistory()">清空历史数据</button>
                </div>
                <table id="historyTable">
                </table>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let stockFile = null;
        let ioFile = null;
        let stockData = null;
        let ioData = null;
        let historyData = JSON.parse(localStorage.getItem('sofaInventoryHistory') || '{}');

        // 初始化日期
        document.getElementById('stockDate').valueAsDate = new Date();
        document.getElementById('ioDate').valueAsDate = new Date();

        // 设置拖放事件
        setupDragDrop('stockDropArea', 'stockFile', 'stockFileInfo', '库存数据');
        setupDragDrop('ioDropArea', 'ioFile', 'ioFileInfo', '出入库数据');

        // 文件选择事件
        document.getElementById('stockFile').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                stockFile = e.target.files[0];
                document.getElementById('stockFileInfo').textContent = '已选择: ' + stockFile.name;
                document.getElementById('stockFileInfo').classList.add('show');
            }
        });

        document.getElementById('ioFile').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                ioFile = e.target.files[0];
                document.getElementById('ioFileInfo').textContent = '已选择: ' + ioFile.name;
                document.getElementById('ioFileInfo').classList.add('show');
            }
        });

        // 设置拖放功能
        function setupDragDrop(dropAreaId, fileInputId, infoId, fileType) {
            const dropArea = document.getElementById(dropAreaId);
            const fileInput = document.getElementById(fileInputId);
            const fileInfo = document.getElementById(infoId);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.classList.add('dragover');
            }

            function unhighlight() {
                dropArea.classList.remove('dragover');
            }

            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (fileType === '库存数据') {
                        stockFile = file;
                    } else {
                        ioFile = file;
                    }
                    fileInfo.textContent = '已选择: ' + file.name;
                    fileInfo.classList.add('show');
                }
            }
        }

        // 显示消息
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.classList.add('show');
            setTimeout(() => {
                msg.classList.remove('show');
            }, 3000);
        }

        // 清空所有
        function clearAll() {
            stockFile = null;
            ioFile = null;
            document.getElementById('stockFile').value = '';
            document.getElementById('ioFile').value = '';
            document.getElementById('stockFileInfo').classList.remove('show');
            document.getElementById('ioFileInfo').classList.remove('show');
            document.getElementById('results').style.display = 'none';
        }

        // 清空历史数据
        function clearHistory() {
            if (confirm('确定要清空所有历史数据吗？此操作不可恢复！')) {
                localStorage.removeItem('sofaInventoryHistory');
                historyData = {};
                showMessage('历史数据已清空', 'success');
                renderResults();
            }
        }

        // 处理数据
        function processData() {
            const stockDate = document.getElementById('stockDate').value;
            const ioDate = document.getElementById('ioDate').value;

            if (!stockFile && !ioFile) {
                showMessage('请至少选择一个文件！', 'error');
                return;
            }

            if (stockFile && !stockDate) {
                showMessage('请选择库存数据的日期！', 'error');
                return;
            }

            if (ioFile && !ioDate) {
                showMessage('请选择出入库数据的日期！', 'error');
                return;
            }

            document.getElementById('loading').classList.add('show');

            // 处理库存文件
            let stockPromise = stockFile ? readExcelFile(stockFile) : Promise.resolve(null);
            
            // 处理出入库文件
            let ioPromise = ioFile ? readExcelFile(ioFile) : Promise.resolve(null);

            Promise.all([stockPromise, ioPromise])
                .then(([stockJson, ioJson]) => {
                    // 处理库存数据
                    if (stockJson) {
                        const supplierStock = processStockData(stockJson);
                        if (!historyData[stockDate]) {
                            historyData[stockDate] = {};
                        }
                        Object.assign(historyData[stockDate], supplierStock);
                    }

                    // 处理出入库数据
                    if (ioJson) {
                        const ioStats = processIoData(ioJson);
                        if (!historyData[ioDate]) {
                            historyData[ioDate] = {};
                        }
                        Object.assign(historyData[ioDate], ioStats);
                    }

                    // 保存到localStorage
                    localStorage.setItem('sofaInventoryHistory', JSON.stringify(historyData));

                    // 渲染结果
                    renderResults();

                    document.getElementById('loading').classList.remove('show');
                    showMessage('数据处理完成！', 'success');
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('loading').classList.remove('show');
                    showMessage('数据处理失败: ' + error.message, 'error');
                });
        }

        // 读取Excel文件
        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet);
                        resolve(json);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        // 处理库存数据
        function processStockData(jsonData) {
            const suppliers = { '小宅': 0, '楷迪': 0, '富瑞德': 0, '其他': 0 };
            
            jsonData.forEach(row => {
                const batch = row['批次'] || '';
                const qty = parseInt(row['库存数量']) || 0;
                
                let supplier = '其他';
                if (String(batch).includes('XZ')) supplier = '小宅';
                else if (String(batch).includes('KD')) supplier = '楷迪';
                else if (String(batch).includes('FRD')) supplier = '富瑞德';
                
                suppliers[supplier] += qty;
            });

            const total = Object.values(suppliers).reduce((a, b) => a + b, 0);
            return {
                '小宅': suppliers['小宅'],
                '楷迪': suppliers['楷迪'],
                '富瑞德': suppliers['富瑞德'],
                '其他': suppliers['其他'],
                '总库存': total
            };
        }

        // 处理出入库数据
        function processIoData(jsonData) {
            let inCount = 0;
            let outCount = 0;

            jsonData.forEach(row => {
                inCount += parseInt(row['入库数量']) || 0;
                outCount += parseInt(row['出库数量']) || 0;
            });

            return {
                'in_count': inCount,
                'out_count': outCount
            };
        }

        // 渲染所有结果
        function renderResults() {
            const dates = Object.keys(historyData).sort().slice(-30);
            if (dates.length === 0) {
                document.getElementById('results').style.display = 'none';
                return;
            }

            document.getElementById('results').style.display = 'block';

            const latestDate = dates[dates.length - 1];
            const latestData = historyData[latestDate];

            // 渲染汇总卡片
            renderSummary(latestData);

            // 渲染图表
            renderStockChart(dates);
            renderIoChart(dates);

            // 渲染供应商分布表
            renderSupplierTable(latestData);

            // 渲染历史数据表
            renderHistoryTable(dates);
        }

        // 渲染汇总卡片
        function renderSummary(data) {
            const totalStock = data['总库存'] || 0;
            const inCount = data['in_count'] || 0;
            const outCount = data['out_count'] || 0;
            const netChange = inCount - outCount;

            let netClass = '';
            if (netChange > 0) netClass = 'positive';
            else if (netChange < 0) netClass = 'negative';

            document.getElementById('summaryGrid').innerHTML = `
                <div class="summary-item">
                    <div class="summary-label">总库存</div>
                    <div class="summary-value">${totalStock}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">入库数量</div>
                    <div class="summary-value positive">${inCount}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">出库数量</div>
                    <div class="summary-value negative">${outCount}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">净变化</div>
                    <div class="summary-value ${netClass}">${netChange > 0 ? '+' : ''}${netChange}</div>
                </div>
            `;
        }

        // 渲染库存趋势图
        function renderStockChart(dates) {
            const chart = echarts.init(document.getElementById('stockChart'));
            
            const suppliers = ['小宅', '楷迪', '富瑞德', '其他'];
            const colors = ['#667eea', '#ef5350', '#ab47bc', '#66bb6a'];
            
            const series = suppliers.map((supplier, index) => ({
                name: supplier,
                type: 'bar',
                stack: 'total',
                barMaxWidth: 80,
                itemStyle: { color: colors[index] },
                label: {
                    show: true,
                    position: 'inside',
                    fontSize: 11
                },
                data: dates.map(date => historyData[date][supplier] || 0)
            }));

            // 添加趋势线
            suppliers.forEach((supplier, index) => {
                series.push({
                    name: supplier + '趋势',
                    type: 'line',
                    stack: null,
                    barMaxWidth: null,
                    lineStyle: {
                        type: 'dashed',
                        width: 2,
                        color: colors[index]
                    },
                    itemStyle: {
                        color: colors[index]
                    },
                    symbol: 'circle',
                    symbolSize: 6,
                    label: {
                        show: false
                    },
                    data: dates.map(date => {
                        let total = 0;
                        for (let i = 0; i <= index; i++) {
                            total += historyData[date][suppliers[i]] || 0;
                        }
                        return total;
                    })
                });
            });

            chart.setOption({
                animation: false,
                tooltip: { show: false },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: dates.map(d => d.slice(5)),
                    axisLabel: {
                        rotate: 45,
                        fontSize: 11
                    }
                },
                yAxis: {
                    type: 'value'
                },
                series: series
            });

            window.addEventListener('resize', () => chart.resize());
        }

        // 渲染出入库对比图
        function renderIoChart(dates) {
            const chart = echarts.init(document.getElementById('ioChart'));

            chart.setOption({
                animation: false,
                tooltip: { show: false },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                legend: {
                    data: ['入库', '出库']
                },
                xAxis: {
                    type: 'category',
                    data: dates.map(d => d.slice(5)),
                    axisLabel: {
                        rotate: 45,
                        fontSize: 11
                    }
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: '入库',
                        type: 'bar',
                        barMaxWidth: 40,
                        itemStyle: { color: '#ff9800' },
                        label: {
                            show: true,
                            position: 'top',
                            fontSize: 11
                        },
                        data: dates.map(date => historyData[date]['in_count'] || 0)
                    },
                    {
                        name: '出库',
                        type: 'bar',
                        barMaxWidth: 40,
                        itemStyle: { color: '#2196f3' },
                        label: {
                            show: true,
                            position: 'top',
                            fontSize: 11
                        },
                        data: dates.map(date => historyData[date]['out_count'] || 0)
                    }
                ]
            });

            window.addEventListener('resize', () => chart.resize());
        }

        // 渲染供应商分布表
        function renderSupplierTable(data) {
            const suppliers = ['小宅', '楷迪', '富瑞德', '其他'];
            const total = data['总库存'] || 0;

            let html = `
                <thead>
                    <tr>
                        <th>供应商</th>
                        <th class="number">库存数量</th>
                        <th class="number">占比</th>
                    </tr>
                </thead>
                <tbody>
            `;

            suppliers.forEach(supplier => {
                const qty = data[supplier] || 0;
                const percent = total > 0 ? ((qty / total) * 100).toFixed(1) : 0;
                html += `
                    <tr>
                        <td>${supplier}</td>
                        <td class="number">${qty}</td>
                        <td class="number">${percent}%</td>
                    </tr>
                `;
            });

            html += `
                <tr class="total-row">
                    <td>合计</td>
                    <td class="number">${total}</td>
                    <td class="number">100.0%</td>
                </tr>
            `;

            html += '</tbody>';
            document.getElementById('supplierTable').innerHTML = html;
        }

        // 渲染历史数据表
        function renderHistoryTable(dates) {
            let html = `
                <thead>
                    <tr>
                        <th>日期</th>
                        <th class="number">总库存</th>
                        <th class="number">入库数量</th>
                        <th class="number">出库数量</th>
                        <th class="number">净变化</th>
                    </tr>
                </thead>
                <tbody>
            `;

            let totalIn = 0;
            let totalOut = 0;

            dates.forEach(date => {
                const data = historyData[date];
                const totalStock = data['总库存'] || 0;
                const inCount = data['in_count'] || 0;
                const outCount = data['out_count'] || 0;
                const netChange = inCount - outCount;
                
                totalIn += inCount;
                totalOut += outCount;

                let netClass = '';
                if (netChange > 0) netClass = 'positive';
                else if (netChange < 0) netClass = 'negative';

                html += `
                    <tr>
                        <td>${date}</td>
                        <td class="number">${totalStock}</td>
                        <td class="number">${inCount}</td>
                        <td class="number">${outCount}</td>
                        <td class="number ${netClass}">${netChange > 0 ? '+' : ''}${netChange}</td>
                    </tr>
                `;
            });

            const totalNet = totalIn - totalOut;
            let netClass = '';
            if (totalNet > 0) netClass = 'positive';
            else if (totalNet < 0) netClass = 'negative';

            html += `
                <tr class="total-row">
                    <td>30天合计</td>
                    <td class="number">-</td>
                    <td class="number">${totalIn}</td>
                    <td class="number">${totalOut}</td>
                    <td class="number ${netClass}">${totalNet > 0 ? '+' : ''}${totalNet}</td>
                </tr>
            `;

            html += '</tbody>';
            document.getElementById('historyTable').innerHTML = html;
        }

        // 页面加载时，如果有历史数据就直接渲染
        if (Object.keys(historyData).length > 0) {
            renderResults();
        }
    </script>
</body>
</html>
