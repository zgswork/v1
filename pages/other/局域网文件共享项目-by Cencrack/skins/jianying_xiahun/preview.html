<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剑影侠魂皮肤预览</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 20px;
        }
        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .preview-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: var(--color-bg-secondary);
            border-radius: var(--size-border-radius);
            box-shadow: var(--shadow-md);
        }
        .preview-title {
            font-size: var(--size-font-xl);
            margin-bottom: 15px;
            color: var(--color-text-primary);
            border-bottom: 2px solid var(--color-border-primary);
            padding-bottom: 10px;
        }
        .button-demo {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .form-demo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .table-demo {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .table-demo th,
        .table-demo td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--color-border-primary);
        }
        .table-demo th {
            background-color: var(--color-bg-tertiary);
            font-weight: 600;
        }
        .card-demo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .notification-demo {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <h1 class="preview-title">剑影侠魂皮肤预览</h1>
        
        <div class="preview-section">
            <h2 class="preview-title">按钮样式</h2>
            <div class="button-demo">
                <button class="btn">默认按钮</button>
                <button class="btn btn-primary">主要按钮</button>
                <button class="btn btn-secondary">次要按钮</button>
                <button class="btn btn-success">成功按钮</button>
                <button class="btn btn-warning">警告按钮</button>
                <button class="btn btn-danger">危险按钮</button>
            </div>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">表单样式</h2>
            <div class="form-demo">
                <div>
                    <label for="input1" class="form-label">文本输入框</label>
                    <input type="text" id="input1" class="form-control" placeholder="请输入文本">
                </div>
                <div>
                    <label for="select1" class="form-label">下拉选择框</label>
                    <select id="select1" class="form-control">
                        <option>选项1</option>
                        <option>选项2</option>
                        <option>选项3</option>
                    </select>
                </div>
                <div>
                    <label for="textarea1" class="form-label">文本域</label>
                    <textarea id="textarea1" class="form-control" rows="3" placeholder="请输入多行文本"></textarea>
                </div>
                <div>
                    <label class="form-label">复选框</label>
                    <div class="form-check">
                        <input type="checkbox" id="check1" class="form-check-input">
                        <label for="check1" class="form-check-label">选项1</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="check2" class="form-check-input">
                        <label for="check2" class="form-check-label">选项2</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">表格样式</h2>
            <table class="table-demo">
                <thead>
                    <tr>
                        <th>列1</th>
                        <th>列2</th>
                        <th>列3</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>数据1</td>
                        <td>数据2</td>
                        <td>数据3</td>
                        <td>
                            <button class="btn btn-sm">编辑</button>
                            <button class="btn btn-sm btn-danger">删除</button>
                        </td>
                    </tr>
                    <tr>
                        <td>数据4</td>
                        <td>数据5</td>
                        <td>数据6</td>
                        <td>
                            <button class="btn btn-sm">编辑</button>
                            <button class="btn btn-sm btn-danger">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">卡片样式</h2>
            <div class="card-demo">
                <div class="card">
                    <div class="card-header">
                        <h3>卡片标题1</h3>
                    </div>
                    <div class="card-body">
                        <p>这是卡片的内容区域，展示了剑影侠魂皮肤的卡片样式。</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary">操作按钮</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>卡片标题2</h3>
                    </div>
                    <div class="card-body">
                        <p>这是另一个卡片的内容区域，展示了剑影侠魂皮肤的卡片样式。</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-secondary">操作按钮</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">导航样式</h2>
            <nav class="nav">
                <a href="#" class="nav-link active">首页</a>
                <a href="#" class="nav-link">文件管理</a>
                <a href="#" class="nav-link">分类管理</a>
                <a href="#" class="nav-link">用户管理</a>
                <a href="#" class="nav-link">系统设置</a>
            </nav>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">标签页样式</h2>
            <div class="tabs">
                <div class="tab-list">
                    <button class="tab active">标签页1</button>
                    <button class="tab">标签页2</button>
                    <button class="tab">标签页3</button>
                </div>
                <div class="tab-content">
                    <div class="tab-pane active">
                        <p>这是标签页1的内容。</p>
                    </div>
                    <div class="tab-pane">
                        <p>这是标签页2的内容。</p>
                    </div>
                    <div class="tab-pane">
                        <p>这是标签页3的内容。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification-demo">
        <div class="notification success">
            <i class="fa fa-check-circle"></i>
            <span>操作成功！</span>
        </div>
    </div>
</body>
</html>
