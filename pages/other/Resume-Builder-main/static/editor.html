<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历生成工具</title>
<link rel="stylesheet" href="/static/editor.css">
<script defer src="/static/editor.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="workspace-panel" aria-label="简历编辑区">
    <header class="app-header">
      <div>
        <p class="eyebrow">Resume Studio</p>
        <h1>简历编辑器</h1>
      </div>
      <div class="header-actions" aria-label="常用操作">
        <button class="btn btn-ghost" type="button" data-action="load-sample">加载示例</button>
        <button class="btn btn-primary" type="button" data-action="export-pdf">导出PDF</button>
        <button class="btn btn-ghost" type="button" data-action="export-word">导出Word</button>
      </div>
    </header>

    <nav class="template-strip" id="templateBar" aria-label="模板选择"></nav>

    <main class="editor-content" id="editorContent" aria-live="polite">
      <div class="empty-state">正在加载编辑器...</div>
    </main>

    <footer class="panel-footer">
      <button class="text-button" type="button" data-action="switch-json">JSON 编辑</button>
      <span id="editorStatus">等待输入</span>
    </footer>
  </aside>

  <section class="preview-panel" aria-label="简历预览区">
    <header class="preview-toolbar">
      <div>
        <p class="eyebrow">Live Preview</p>
        <strong id="previewInfo">实时预览</strong>
      </div>
      <button class="icon-button" type="button" data-action="refresh-preview" title="刷新预览" aria-label="刷新预览">↻</button>
    </header>
    <div class="preview-frame-wrap">
      <iframe class="preview-iframe" id="previewFrame" title="简历预览"></iframe>
    </div>
  </section>
</div>

<div class="json-overlay" id="jsonOverlay" hidden>
  <section class="json-dialog" role="dialog" aria-modal="true" aria-labelledby="jsonDialogTitle">
    <header class="json-dialog-header">
      <strong id="jsonDialogTitle">JSON 编辑器</strong>
      <div class="dialog-actions">
        <button class="btn btn-primary" type="button" data-action="apply-json">应用</button>
        <button class="btn btn-ghost" type="button" data-action="close-json">关闭</button>
      </div>
    </header>
    <textarea id="jsonText" spellcheck="false" aria-label="JSON 内容"></textarea>
  </section>
</div>
</body>
</html>
