<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>填充矩形工具</title>
        <link rel="stylesheet" href="../static/css/module-padding.css">
    </head>

    <body>
        <div id="app">
            <!-- ── 左侧控制台 ──────────────── -->
            <div id="sidebar">
                <div id="sidebar-header">
                    <span id="sidebar-collapse">◀</span>
                    <h1>填充矩形工具 <span style="font-size: .8em;font-weight:normal;">V1.35.0 by 笙</span> </h1>
                    <span id="sidebar-toggle">▼</span>
                </div>
                <div id="sidebar-scroll">
                    <!-- 形状选择 -->
                    <div class="section">
                        <div class="section-title">形状类型</div>
                        <div class="field">
                            <select id="shape-type">
                                <option value="circle">圆</option>
                                <option value="trapezoid">梯形</option>
                                <option value="triangle">三角形</option>
                                <option value="ellipse">椭圆</option>
                                <option value="sector">扇形</option>
                                <option value="segment">弓形</option>
                                <option value="annulus">圆环</option>
                                <option value="sector-annulus">扇环</option>
                                <option value="regular-polygon">正多边形</option>
                            </select>
                        </div>
                    </div>
                    <!-- 动态参数 -->
                    <div class="section" id="shape-params"></div>
                    <!-- 矩形尺寸 -->
                    <div class="section">
                        <div class="section-title">矩形尺寸 (mm)</div>
                        <div class="row2">
                            <div class="field">
                                <label>宽 w1</label> <input type="number" id="w1" value="320" min="1">
                            </div>
                            <div class="field">
                                <label>高 h1</label> <input type="number" id="h1" value="160" min="1">
                            </div>
                        </div>
                        <div class="row2">
                            <div class="field">
                                <label>宽 w2 (可选)</label> <input type="number" id="w2" placeholder="—" min="1">
                            </div>
                            <div class="field">
                                <label>高 h2 (可选)</label> <input type="number" id="h2" placeholder="—" min="1">
                            </div>
                        </div>
                        <div class="field" id="allowance-container" style="display:none;">
                            <label>允许留空 (mm 可选)</label>
                            <input type="number" id="allowance" value="0" min="0" step="any">
                        </div>
                    </div>
                    <!-- 填充模式 -->
                    <div class="section">
                        <div class="section-title">填充模式</div>
                        <div class="mode-group">
                            <button class="mode-btn active" data-mode="contains">圆包围矩形</button>
                            <button class="mode-btn" data-mode="surround">矩形包围圆</button>
                        </div>
                    </div>
                    <!-- ✅ 生成按钮 & 导出按钮：紧贴填充模式 -->
                    <div id="action-bar">
                        <div id="error-msg"></div>
                        <button id="btn-generate">▶ 生成填充方案</button>
                        <div class="export-section">
                            <div class="export-group">
                                <button class="exp-btn" id="exp-jpg" disabled>JPG</button>
                                <button class="exp-btn" id="exp-pdf" disabled>PDF</button>
                                <button class="exp-btn" id="exp-dxf" disabled>DXF</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ── 右侧工作区 ──────────────── -->
            <div id="workspace">
                <div id="canvas-wrap">
                    <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2d45" stroke-width="0.5" />
                            </pattern>
                            <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                                <rect width="100" height="100" fill="url(#smallGrid)" />
                                <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3550" stroke-width="1" />
                            </pattern>
                        </defs>
                        <rect id="grid-rect" width="100%" height="100%" fill="url(#grid)" />
                        <g id="crosshair" opacity="0.25">
                            <line id="ch-v" y1="0" y2="10000" stroke="#38BDF8" stroke-width="0.5"
                                stroke-dasharray="4 4" />
                            <line id="ch-h" x1="0" x2="10000" stroke="#38BDF8" stroke-width="0.5"
                                stroke-dasharray="4 4" />
                        </g>
                        <g id="draw-layer" transform="translate(0,0)"></g>
                    </svg>
                    <div id="empty-hint">
                        <div class="em-icon">⬡</div>
                        <div class="em-text">设置参数后点击「生成填充方案」</div>
                    </div>
                    <div id="stats-panel" style="display:none">
                        <div class="stats-title">统计信息</div>
                        <div id="stats-content"></div>
                    </div>
                    <div id="loading"><span id="loading-text">COMPUTING...</span></div>
                </div>
                <div id="statusbar">
                    <div class="sb-item">形状: <span id="sb-shape">—</span></div>
                    <div class="sb-item">模式: <span id="sb-mode">—</span></div>
                    <div class="sb-item">矩形: <span id="sb-count">—</span></div>
                    <div class="sb-item" style="margin-left:auto; color:#2d4060;">
                        by 笙 版权所有，不得仿冒；合作与反馈 QQ群(891047894)
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="../static/js/module-padding_app.js"></script>
    </body>

</html>
