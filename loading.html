<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中</title>
    <style>
        /* 重置并居中，背景色与右侧主区域一致 */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1e293b;  /* 与 sidebar-bg 相同，即主区域背景色 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loader {
            text-align: center;
        }
        /* 旋转动画 - 亮色边框 */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 跳动文字 - 亮灰色，与页面文字颜色一致 */
        .loader p {
            font-size: 3rem;
            font-weight: 700;
            color: #e2e8f0;   /* 与 .page-title 颜色一致 */
            animation: bounce 1.2s infinite ease-in-out;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
        /* 响应式调整 */
        @media (max-width: 768px) {
            .loader p { font-size: 2.2rem; }
        }
        @media (max-width: 480px) {
            .loader p { font-size: 1.6rem; }
            .spinner { width: 40px; height: 40px; border-width: 4px; }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>启动加载中，请耐心等待...</p>
    </div>
</body>
</html>
