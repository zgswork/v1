<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>工作台</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="static/css/index.css">
    </head>

    <body>
        <!-- ===== 左侧菜单 ===== -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">笙</div>
                <div>
                    <div class="logo-text">工作台</div>
                    <div class="version">V2.5.2</div>
                </div>
            </div>
            <div class="nav-menu" id="navMenu"></div>
            <div class="sidebar-footer">© 2026 工作台 • 保留所有权利<br>E-mail：zgswork@foxmail.com</div>
        </div>
        <!-- ===== 右侧主区域 ===== -->
        <div class="main-content">
            <div class="header">
                <div>
                    <div class="page-title" id="current-page-title"></div>
                    <div class="page-subtitle" id="current-page-subtitle"></div>
                </div>
                <!-- ===== 用户信息（点击触发登录框） ===== -->
                <div class="user-info" id="userInfo" style="cursor:pointer;">
                    <div class="user-avatar" id="userAvatar">游客</div>
                    <div>
                        <div style="font-weight:600;" id="userDisplayName">游客</div>
                        <div style="font-size:0.8rem;color:var(--text-muted);" id="userRole">未登录</div>
                    </div>
                </div>
            </div>
            <div class="iframe-wrapper"><iframe id="pageFrame"></iframe></div>
        </div>
        <!-- ===== 登录模态框 ===== -->
        <div id="loginModal" class="login-modal" style="display:none;">
            <div class="login-box">
                <span class="close-btn" id="closeLoginModal">&times;</span>
                <h2 id="modalTitle"  style="color:#000000;">会员登录</h2>
                <!-- 登录表单（未登录时显示） -->
                <div id="loginForm">
                    <input type="text" id="loginUsername" placeholder="用户名" />
                    <input type="password" id="loginPassword" placeholder="密码" />
                    <button id="loginBtn">登录</button>
                    <div id="loginError" style="color:red; margin-top:8px;"></div>
                </div>
                <!-- 已登录状态信息 -->
                <div id="loggedInInfo" style="display:none;">
                    <p>当前用户：<strong id="loggedInUser"></strong></p>
                    <p>权限角色：<span id="loggedInRole"></span></p>
                    <button id="switchAccountBtn">切换账号</button>
                    <button id="logoutBtn">登出</button>
                </div>
            </div>
        </div>
        <!-- 双模运行时：先加载，用于决定是否走 Pyodide 纯前端模式 -->
        <script src="static/js/runtime.js?v=20260827r"></script>
        <script src="static/js/index_app.js"></script>
    </body>

</html>
