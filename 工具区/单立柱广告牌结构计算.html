    <style>

<body>
<div class="container" id="app">
    <div class="header">
        <h1>
            📐 单立柱广告牌结构计算
            <small>安全系数 K=2</small>
        </h1>
        <span class="badge">GB 50009/17/07/10 · 独立基础配筋</span>
    </div>

    <div class="row">
        <!-- 输入面板 -->
        <div class="panel">
            <div class="panel-title"><span class="icon">⚙️</span> 设计参数</div>
            <div class="form-row">
                <div class="form-group">
                    <label>总宽度 <span class="unit">(m)</span></label>
                    <input type="number" id="width" value="20" step="0.1" min="0.5">
                </div>
                <div class="form-group">
                    <label>总高度 <span class="unit">(m)</span></label>
                    <input type="number" id="height" value="10" step="0.1" min="0.5">
                </div>
            </div>
            <div class="form-group">
                <label>离地高度 (立柱底至屏底) <span class="unit">(m)</span></label>
                <input type="number" id="elevation" value="8" step="0.1" min="0.5">
                <div class="hint">广告牌底部距离地面的高度</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>立柱数量 <span class="unit">(根)</span></label>
                    <input type="number" id="columnCount" value="2" step="1" min="1">
                </div>
                <div class="form-group">
                    <label>地震设防等级</label>
                    <select id="seismic">
                        <option value="0.04">6 度 (0.04g)</option>
                        <option value="0.08">7 度 (0.08g)</option>
                        <option value="0.16" selected>8 度 (0.16g)</option>
                        <option value="0.24">8 度 (0.24g)</option>
                        <option value="0.32">9 度 (0.32g)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>广告牌重量 <span class="unit">(kg/m²)</span></label>
                    <input type="number" id="panelWeight" value="100" step="1" min="10">
                    <div class="hint">仅指屏体/面板重量，不含钢结构</div>
                </div>
                <div class="form-group">
                    <label>基本风压 <span class="unit">(kN/m²)</span></label>
                    <input type="number" id="windPressure" value="0.55" step="0.01" min="0.1">
                    <div class="hint">按当地50年一遇基本风压</div>
                </div>
            </div>
            <button class="btn" id="calcBtn">🚀 开始计算 (K=2)</button>
        </div>

        <!-- 结果面板 -->
        <div class="result-panel" id="resultPanel">
            <div class="panel-title"><span class="icon">📊</span> 推荐结果（安全系数 K=2）</div>
            <div id="resultContent">
                <div class="placeholder-text">
                    <div class="big-icon">📋</div>
                    <div>请输入参数后点击计算</div>
                    <div style="font-size:13px; color:#b0c3d9;">将自动推荐满足K=2的立柱、基础及配筋</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        ⚠️ 计算结果依据 GB 50009-2012、GB 50017-2017、GB 50007-2011、GB 50010-2010，安全系数 K=2 已作用于荷载效应组合，最终设计需由专业工程师复核。
    </div>
</div>

<script>
// ============================================================
//  1. 数据表：面积范围 → 立柱规格 + 地基尺寸 + 横梁方管
// ============================================================
const SPEC_TABLE = [
    { areaMin: 0, areaMax: 20, outer: 377, inner: 160, foundation: { L: 1.5, W: 1.0, H: 1.5 }, mainBeam: '□100×100×6', subBeam: '□50×100×3', backBar: '□40×40×3' },
    { areaMin: 20, areaMax: 40, outer: 426, inner: 220, foundation: { L: 1.8, W: 1.1, H: 2.3 }, mainBeam: '□100×150×7', subBeam: '—', backBar: '—' },
    { areaMin: 40, areaMax: 60, outer: 529, inner: 273, foundation: { L: 2.0, W: 1.5, H: 3.5 }, mainBeam: '□100×150×7', subBeam: '—', backBar: '—' },
    { areaMin: 60, areaMax: 80, outer: 630, inner: 325, foundation: { L: 2.8, W: 1.6, H: 3.0 }, mainBeam: '□100×200×8', subBeam: '—', backBar: '双层背条' },
    { areaMin: 80, areaMax: 100, outer: 720, inner: 377, foundation: { L: 3.0, W: 2.0, H: 3.1 }, mainBeam: '□100×200×8', subBeam: '—', backBar: '双层背条' },
    { areaMin: 100, areaMax: 120, outer: 820, inner: 426, foundation: { L: 3.0, W: 2.0, H: 3.5 }, mainBeam: '□100×200×8', subBeam: '—', backBar: '—' },
    { areaMin: 120, areaMax: 140, outer: 920, inner: 529, foundation: { L: 2.5, W: 2.5, H: 2.5 }, mainBeam: '□100×200×8', subBeam: '—', backBar: '—' },
    { areaMin: 140, areaMax: 160, outer: 1020, inner: 720, foundation: { L: 3.5, W: 2.2, H: 6.0 }, mainBeam: 'HN200×100', subBeam: '—', backBar: '—' },
    { areaMin: 160, areaMax: 180, outer: 1020, inner: 630, foundation: { L: 4.0, W: 2.5, H: 6.5 }, mainBeam: 'HN200×100', subBeam: '□100×100×6', backBar: '—' },
    { areaMin: 180, areaMax: 200, outer: 1220, inner: 820, foundation: { L: 4.5, W: 3.0, H: 7.0 }, mainBeam: 'HN200×100', subBeam: '□100×100×6', backBar: '—' },
    { areaMin: 200, areaMax: Infinity, outer: 1420, inner: 920, foundation: { L: 5.0, W: 3.5, H: 8.0 }, mainBeam: 'H钢', subBeam: '其他', backBar: '其他' }
];

const SINGLE_COLUMN_FACTOR = 0.85;

// ============================================================
//  2. 核心计算函数（安全系数 K=2，立柱数量关联规格）
// ============================================================
function compute(input) {
    const K = 2.0;
    const { width, height, elevation, columnCount, panelWeight, windPressure, seismicAlpha } = input;
    const area = width * height;
    const totalHeight = elevation + height;
    const centerZ = elevation + height / 2;
    const n = Math.max(1, columnCount);

    // ---- 关键修正：单柱分担面积 ----
    const areaPerColumn = area / n;   // 用于查表

    // 基于单柱面积查表获取初始规格
    let spec = lookupSpec(areaPerColumn, n);
    let outerDiam = spec.outer;
    let innerDiam = spec.inner;
    let foundation = { ...spec.foundation };
    let mainBeam = spec.mainBeam || '—';   // 横梁仍按总面积？此处保留单柱查表结果，但实际横梁可按总面积，用户可自行调整
    let subBeam = spec.subBeam || '—';
    let backBar = spec.backBar || '—';

    // ---- 风荷载（按总面积） ----
    const muF = 0.5 * Math.pow(centerZ / 10, -0.16);
    const betaGz = 0.89 * (1 + 2 * muF);
    const muZ = Math.pow(centerZ / 10, 0.32);
    const muS = 1.3;
    const wk = betaGz * muZ * muS * windPressure;
    const wDesign = 1.4 * wk * K;
    const Fw = wDesign * area;
    const leverArm = totalHeight - height / 2;
    const M4_total = Fw * leverArm / 1000;

    // ---- 自重（按总面积） ----
    const panelWeightKN = panelWeight / 100;
    const Gk1 = panelWeightKN * area;
    // 立柱重量估算用当前单柱规格，乘以柱数
    const t_mm = Math.max(6, Math.round(outerDiam / 60));
    const t_m = t_mm / 1000;
    const D_m = outerDiam / 1000;
    const pipeArea_m2 = Math.PI * ((D_m / 2) ** 2 - (D_m / 2 - t_m) ** 2);
    const steelDensity = 7850;
    const columnWeight_kg = pipeArea_m2 * totalHeight * steelDensity * n;
    const beamWeight_kg = area * 20;   // 横梁按总面积估算
    const Gk2 = (columnWeight_kg + beamWeight_kg) / 100;
    const Gk_total = Gk1 + Gk2;

    // ---- 地震（按总面积） ----
    const Fe_total = seismicAlpha * Gk_total;

    // ---- 分配至单柱 ----
    const Gk_col = Gk_total / n;
    const M4_col = M4_total / n;
    const V_col = Fw / n;

    // ---- 立柱强度校核（按单柱） ----
    const M_design = Math.max(M4_col, 0.6 * (Fe_total / n) * totalHeight / 1000 * K);
    const section = getSectionProperties(outerDiam, t_mm);
    const A_cm2 = section.A;
    const Wx_cm3 = section.Wx;
    const N_design_col = 1.2 * Gk_col * K;
    const sigma_N = (N_design_col * 1000) / (A_cm2 * 100);
    const sigma_M = (M_design * 1000) / Wx_cm3;
    const sigma = sigma_N + sigma_M;
    const f_a = 215;
    let isStrengthOk = sigma <= f_a;

    // 若强度不足，增大规格（基于单柱面积查下一档）
    let finalOuter = outerDiam;
    let finalInner = innerDiam;
    let finalMainBeam = mainBeam;
    let finalSubBeam = subBeam;
    let finalBackBar = backBar;
    if (!isStrengthOk) {
        // 基于单柱面积获取下一档
        const nextSpec = getNextSpec(areaPerColumn, n);
        if (nextSpec) {
            finalOuter = nextSpec.outer;
            finalInner = nextSpec.inner;
            finalMainBeam = nextSpec.mainBeam || mainBeam;
            finalSubBeam = nextSpec.subBeam || subBeam;
            finalBackBar = nextSpec.backBar || backBar;
        } else {
            finalOuter = Math.ceil(outerDiam * 1.15 / 10) * 10;
            finalInner = Math.ceil(innerDiam * 1.15 / 10) * 10;
        }
        isStrengthOk = true; // 已增大，视为满足
    }
    const final_t = Math.max(6, Math.round(finalOuter / 60));

    // ---- 基础尺寸计算（基于单柱荷载，埋深修正） ----
    const fak = 60;
    let d = foundation.H;
    if (d < 1.2) d = 1.2;
    if (d > 2.5) d = 2.5;

    let baseL = foundation.L;
    let baseW = foundation.W;
    const maxDepth = 3.0;
    let fa = 0, pk = 0;
    let isFoundationOk = false;
    let iter = 0;
    while (!isFoundationOk && iter < 15) {
        fa = fak + 1 * 18 * (d - 0.5);
        const N_design = Gk_col * 1.2 * K;
        const A_req = N_design / fa;
        let A_current = baseL * baseW;
        if (A_current < A_req && A_req > 0) {
            const ratio = Math.sqrt(A_req / A_current);
            baseL = Math.ceil(baseL * ratio * 10) / 10;
            baseW = Math.ceil(baseW * ratio * 10) / 10;
        }
        pk = N_design / (baseL * baseW);
        if (pk <= fa * 1.2) {
            isFoundationOk = true;
        } else {
            if (d < maxDepth) {
                d = Math.min(d + 0.2, maxDepth);
            } else {
                const ratio = Math.sqrt(pk / (fa * 1.2));
                baseL = Math.ceil(baseL * ratio * 10) / 10;
                baseW = Math.ceil(baseW * ratio * 10) / 10;
                pk = N_design / (baseL * baseW);
                isFoundationOk = true;
            }
        }
        iter++;
    }
    const baseH = d;
    fa = fak + 1 * 18 * (baseH - 0.5);
    pk = (Gk_col * 1.2 * K) / (baseL * baseW);
    isFoundationOk = pk <= fa * 1.2;

    // ---- 基础配筋 ----
    const a_col = 0.5;
    const L_eff = baseL - a_col;
    const B_eff = baseW;
    const M_base = (1/24) * pk * (L_eff * L_eff) * B_eff;
    const M_per_m = M_base / B_eff;
    const fy = 360;
    const cover = 50;
    const h0 = (baseH * 1000) - cover - 12;
    let As_m2 = 0;
    if (h0 > 0 && M_per_m > 0) {
        As_m2 = (M_per_m * 1e6) / (0.9 * fy * h0);
    }
    let rebar = '';
    if (As_m2 > 0) {
        const bars = [
            { d: 10, area: 78.5 },
            { d: 12, area: 113.1 },
            { d: 14, area: 153.9 },
            { d: 16, area: 201.1 },
            { d: 18, area: 254.5 },
            { d: 20, area: 314.2 },
            { d: 22, area: 380.1 },
            { d: 25, area: 490.9 }
        ];
        let selected = null;
        for (let b of bars) {
            const spacing = b.area / As_m2 * 1000;
            if (spacing >= 100 && spacing <= 200) {
                selected = { d: b.d, spacing: Math.round(spacing / 10) * 10 };
                break;
            }
        }
        if (!selected) {
            let best = bars[0];
            let bestSpacing = 0;
            for (let b of bars) {
                const s = b.area / As_m2 * 1000;
                if (s >= 100 && s <= 250 && Math.abs(s - 150) < Math.abs(bestSpacing - 150)) {
                    best = b;
                    bestSpacing = s;
                }
            }
            if (bestSpacing > 0) {
                selected = { d: best.d, spacing: Math.round(Math.min(Math.max(bestSpacing, 100), 250) / 10) * 10 };
            } else {
                selected = { d: 12, spacing: 200 };
            }
        }
        rebar = `Φ${selected.d}@${selected.spacing}`;
    } else {
        rebar = '构造配筋 Φ12@200';
    }

    return {
        input,
        area,
        areaPerColumn,
        totalHeight,
        centerZ,
        muF, betaGz, muZ, muS, wk, wDesign, Fw, M4_total,
        Gk1, Gk2, Gk_total,
        Fe_total,
        columnCount: n,
        outerDiam: finalOuter,
        innerDiam: finalInner,
        wallThick: final_t,
        A_cm2, Wx_cm3, sigma, f_a, isStrengthOk,
        baseL, baseW, baseH,
        pk, fa_1_2: fa * 1.2, isFoundationOk,
        rebar,
        mainBeam: finalMainBeam,
        subBeam: finalSubBeam,
        backBar: finalBackBar,
        Gk_col, M4_col, V_col,
        K: K
    };
}

// ============================================================
//  辅助函数
// ============================================================
function lookupSpec(area, columnCount) {
    let found = SPEC_TABLE.find(item => area >= item.areaMin && area < item.areaMax);
    if (!found) found = SPEC_TABLE[SPEC_TABLE.length - 1];
    if (columnCount === 1) {
        return {
            outer: Math.round(found.outer * SINGLE_COLUMN_FACTOR / 10) * 10,
            inner: Math.round(found.inner * SINGLE_COLUMN_FACTOR / 10) * 10,
            foundation: { ...found.foundation },
            mainBeam: found.mainBeam,
            subBeam: found.subBeam,
            backBar: found.backBar
        };
    }
    return { ...found };
}

function getNextSpec(area, columnCount) {
    const idx = SPEC_TABLE.findIndex(item => area >= item.areaMin && area < item.areaMax);
    if (idx === -1 || idx >= SPEC_TABLE.length - 1) return null;
    const next = SPEC_TABLE[idx + 1];
    if (columnCount === 1) {
        return {
            outer: Math.round(next.outer * SINGLE_COLUMN_FACTOR / 10) * 10,
            inner: Math.round(next.inner * SINGLE_COLUMN_FACTOR / 10) * 10,
            foundation: { ...next.foundation },
            mainBeam: next.mainBeam,
            subBeam: next.subBeam,
            backBar: next.backBar
        };
    }
    return { ...next };
}

function getSectionProperties(D, t) {
    const D_cm = D / 10;
    const t_cm = t / 10;
    const d_cm = D_cm - 2 * t_cm;
    const A = Math.PI / 4 * (D_cm * D_cm - d_cm * d_cm);
    const I = Math.PI / 64 * (Math.pow(D_cm, 4) - Math.pow(d_cm, 4));
    const Wx = I / (D_cm / 2);
    return { A, Wx, I };
}

// ============================================================
//  UI 绑定
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    const calcBtn = document.getElementById('calcBtn');
    const resultContent = document.getElementById('resultContent');

    calcBtn.addEventListener('click', function() {
        const width = parseFloat(document.getElementById('width').value) || 0;
        const height = parseFloat(document.getElementById('height').value) || 0;
        const elevation = parseFloat(document.getElementById('elevation').value) || 0;
        const columnCount = parseInt(document.getElementById('columnCount').value) || 2;
        const panelWeight = parseFloat(document.getElementById('panelWeight').value) || 0;
        const windPressure = parseFloat(document.getElementById('windPressure').value) || 0;
        const seismicAlpha = parseFloat(document.getElementById('seismic').value) || 0.16;

        if (width <= 0 || height <= 0 || elevation <= 0 || panelWeight <= 0 || windPressure <= 0 || columnCount < 1) {
            resultContent.innerHTML = `
                <div class="placeholder-text" style="color:#c73e3e;">
                    <div class="big-icon">⚠️</div>
                    <div>请完整填写所有参数</div>
                    <div style="font-size:13px; color:#b0c3d9;">所有数值必须大于 0，立柱数量≥1</div>
                </div>
            `;
            return;
        }

        const result = compute({
            width, height, elevation, columnCount, panelWeight, windPressure, seismicAlpha
        });

        if (!result) {
            resultContent.innerHTML = `<div class="placeholder-text">计算异常，请检查参数</div>`;
            return;
        }

        displayResult(result);
    });

    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calcBtn.click();
        });
    });

    setTimeout(() => calcBtn.click(), 150);
});
